<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчеттор - Bilimal.</title>
    
    <!-- Google Analytics & AdSense -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GSQV60QV0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-9GSQV60QV0');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1495571814896964" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        /* Builder жана Tests менен бирдей өзгөрмөлөр */
        :root {
            --bg-color: #070b19; --surface-color: #111827; --surface-hover: #1f2937;
            --primary: #00f2fe; --primary-glow: rgba(0, 242, 254, 0.3);
            --success: #00e676; --success-glow: rgba(0, 230, 118, 0.3);
            --danger: #ff4b4b; --text-main: #ffffff; --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08); --transition: all 0.3s ease;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Sidebar */
        .sidebar { width: 280px; padding: 30px 20px; height: 100vh; border-right: 1px solid var(--border-color); position: fixed; display: flex; flex-direction: column; box-sizing: border-box; z-index: 50; }
        .brand-logo { font-size: 28px; font-weight: 700; margin-bottom: 50px; display: flex; align-items: center; gap: 10px; text-shadow: 0 0 10px var(--primary-glow); }
        .brand-logo span { color: var(--primary); }
        .nav-menu { display: flex; flex-direction: column; gap: 12px; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 14px 20px; border-radius: 12px; text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 15px; transition: var(--transition); border: 1px solid transparent; }
        .nav-item:hover { background: var(--surface-color); color: var(--text-main); }
        .nav-item.active { background: linear-gradient(90deg, rgba(0, 242, 254, 0.1) 0%, transparent 100%); color: var(--primary); border-left: 3px solid var(--primary); border-radius: 0 12px 12px 0; box-shadow: inset 20px 0 20px -20px var(--primary-glow); }

        .main-content { margin-left: 280px; padding: 40px; width: calc(100% - 280px); box-sizing: border-box; }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .panel-header h2 { margin: 0; font-size: 24px; }
        
        .btn { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: var(--transition); }
        .btn-success { background: var(--success); color: #000; box-shadow: 0 0 15px var(--success-glow); }
        
        .form-control { width: 100%; padding: 12px 15px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); outline: none; transition: var(--transition); box-sizing: border-box; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }

        /* Фильтр жана Аналитика */
        .filter-grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; background: var(--surface-color); padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 1px solid var(--border-color); }
        .analytics-dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        
        .stat-card { background: var(--surface-color); padding: 25px; border-radius: 16px; border: 1px solid var(--border-color); position: relative; overflow: hidden; transition: var(--transition); }
        .stat-card:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .stat-card h5 { margin: 0 0 15px 0; color: var(--text-muted); font-size: 14px; font-weight: 500; }
        .stat-card .num { font-size: 32px; font-weight: 700; color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); }

        /* Таблица */
        .responsive-table-wrapper { width: 100%; overflow-x: auto; background: var(--surface-color); border-radius: 16px; border: 1px solid var(--border-color); }
        .cyber-table { width: 100%; min-width: 1000px; border-collapse: collapse; text-align: left; }
        .cyber-table th { background: rgba(0, 242, 254, 0.05); color: var(--primary); padding: 18px 20px; font-weight: 600; font-size: 13px; border-bottom: 1px solid var(--border-color); }
        .cyber-table td { padding: 16px 20px; font-size: 14px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
        .cyber-table tr:hover td { background: var(--surface-hover); }

        .footer-ad-container { margin-top: 40px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 20px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand-logo">
            <i class="fas fa-atom" style="color: var(--primary);"></i> Bilimal<span>.</span>
        </div>
        <nav class="nav-menu">
            <a href="/sections/tests.html" class="nav-item"><i class="fas fa-chart-pie"></i> Башкаруу панели</a>
            <a href="/sections/test-builder.html" class="nav-item"><i class="fas fa-sliders-h"></i> Smart Test Builder</a>
            <a href="/sections/test-results.html" class="nav-item active"><i class="fas fa-graduation-cap"></i> Жыйынтыктар</a>
            <a href="/sections/students.html" class="nav-item"><i class="fas fa-users"></i> Окуучулар</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="panel-header">
            <h2>Баалоо жана Отчет Борбору</h2>
            <button class="btn btn-success" id="btnDownloadYearlyReport">
                <i class="fas fa-file-excel"></i> Жылдык Жалпы Отчет (CSV)
            </button>
        </div>

        <div class="filter-grid-layout">
            <input type="text" id="resSearchStudent" placeholder="Окуучунун аты..." class="form-control">
            <select id="resFilterYear" class="form-control"><option value="all">Бардык жылдар</option><option value="2026-2027">2026-2027</option></select>
            <select id="resFilterSubject" class="form-control"><option value="all">Бардык предметтер</option><option value="physics">Физика</option><option value="astronomy">Астрономия</option></select>
            <select id="resFilterClass" class="form-control"><option value="all">Бардык класстар</option></select>
            <select id="resFilterTest" class="form-control"><option value="all">Бардык тесттер</option></select>
        </div>

        <div class="analytics-dashboard-grid">
            <div class="stat-card"><h5>Орточо жетишүү</h5><div class="num" id="anAverageScore">0%</div></div>
            <div class="stat-card"><h5>Эң жогорку балл</h5><div class="num" id="anMaxScore">0</div></div>
            <div class="stat-card"><h5>Класстын сапаты</h5><div class="num" id="anSuccessRate" style="color: var(--success); text-shadow: 0 0 15px var(--success-glow);">0%</div></div>
            <div class="stat-card"><h5>Көп каталанган суроо</h5><div class="num" id="anMostFailedQ" style="color: var(--danger); font-size: 18px; text-shadow: none;">Жок</div></div>
        </div>

        <div class="responsive-table-wrapper">
            <table class="cyber-table">
                <thead>
                    <tr>
                        <th>Окуучу</th>
                        <th>Класс</th>
                        <th>Тесттин аталышы</th>
                        <th>Убактысы</th>
                        <th>Балл (%)</th>
                        <th>Баа</th>
                        <th>Статус</th>
                        <th>Аракеттер</th>
                    </tr>
                </thead>
                <tbody id="resultsMainTableBody">
                    <!-- JavaScript аркылуу толтурулат -->
                </tbody>
            </table>
        </div>

        <div class="footer-ad-container">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-1495571814896964" data-ad-slot="1574613769" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </main>

    <script type="module" src="/assets/js/test-results.js"></script>
</body>
</html>
