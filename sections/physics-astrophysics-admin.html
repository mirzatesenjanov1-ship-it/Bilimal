<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физика жана Астрофизика (Админ)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- MathJax formula rendering -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #151c2c;
            --border: #232d42;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lang-select {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            font-weight: bold;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            background: #1e293b;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .auth-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 15, 25, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .auth-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            box-sizing: border-box;
            outline: none;
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: var(--primary);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-submit {
            background: var(--primary);
            color: #0b0f19;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .preview-box {
            background: var(--bg);
            border: 1px dashed var(--border);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            min-height: 50px;
        }

        .articles-list {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .article-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .article-item:last-child {
            border-bottom: none;
        }

        .btn-delete {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION MODAL -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            <i class="fa-solid fa-lock" style="font-size: 36px; color: var(--primary);"></i>
            <h3 id="i18n_authTitle" style="margin-top: 15px;">Админ кирүү</h3>
            <p id="i18n_authDesc" style="font-size: 13px; color: var(--text-muted);">Макала жарыялоо үчүн паролду киргизиңиз</p>
            <input type="password" id="adminPasswordInput" placeholder="Пароль..." onkeypress="if(event.key==='Enter') checkAdminAuth()">
            <button id="i18n_authBtn" onclick="checkAdminAuth()">Кирүү</button>
            <p id="authError" style="color: var(--danger); font-size: 12px; display: none; margin-top: 10px;">Сырсөз туура эмес!</p>
        </div>
    </div>

    <!-- MAIN ADMIN CONTENT -->
    <div class="container" id="adminMainContent" style="display: none;">
        
        <div class="top-bar">
            <div></div>
            <!-- Language Switcher -->
            <div>
                <i class="fa-solid fa-globe" style="color: var(--primary);"></i>
                <select id="langSelector" class="lang-select" onchange="changeLanguage(this.value)">
                    <option value="ky">Кыргызча</option>
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>

        <div class="header">
            <h1 id="i18n_pageTitle"><i class="fa-solid fa-atom"></i> Физика жана астрофизика (Админ)</h1>
            <a href="/sections/physics-astrophysics.html" class="btn-back" id="i18n_btnBack">
                <i class="fa-solid fa-arrow-left"></i> Сайтка өтүү
            </a>
        </div>

        <!-- FORM CARD -->
        <div class="form-card">
            <h2 id="i18n_formTitle" style="margin-top:0; color: var(--text); font-size: 18px;"><i class="fa-solid fa-plus-circle"></i> Жаңы Макала кошуу</h2>
            
            <div class="form-group">
                <label id="i18n_labelTitle">Макаланын Темасы (Аталышы):</label>
                <input type="text" id="articleTitle" class="form-control" placeholder="...">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label id="i18n_labelCat">Категория:</label>
                    <select id="articleCategory" class="form-control">
                        <option value="astrophysics" id="opt1">Астрофизика</option>
                        <option value="mechanics" id="opt2">Асман механикасы</option>
                        <option value="cosmology" id="opt3">Космология</option>
                        <option value="stars" id="opt4">Жылдыздар жана Спектрлер</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="i18n_labelImg">Сүрөт URL (Милдеттүү эмес):</label>
                    <input type="url" id="articleImageUrl" class="form-control" placeholder="https://example.com/image.jpg">
                </div>
            </div>

            <div class="form-group">
                <label id="i18n_label3D">3D Модель же Симуляция Embed URL:</label>
                <input type="url" id="article3DUrl" class="form-control" placeholder="https://sketchfab.com/models/.../embed">
            </div>

            <div class="form-group">
                <label id="i18n_labelFormula">Формулалар (LaTeX):</label>
                <input type="text" id="articleFormula" class="form-control" placeholder="Мисалы: $E = mc^2$" oninput="updateFormulaPreview()">
                <div class="preview-box" id="formulaPreview">Формуланы алдын ала көрүү...</div>
            </div>

            <div class="form-group">
                <label id="i18n_labelContent">Макаланын Негизги Тексти:</label>
                <textarea id="articleContent" class="form-control" placeholder="..."></textarea>
            </div>

            <button class="btn-submit" onclick="saveArticle()" id="i18n_btnSubmit">
                <i class="fa-solid fa-paper-plane"></i> Макаланы Жарыялоо
            </button>
        </div>

        <!-- LIST OF PUBLISHED ARTICLES -->
        <div class="articles-list">
            <h3 id="i18n_listTitle" style="margin-top:0; color: var(--primary);"><i class="fa-solid fa-list-check"></i> Жарыяланган Макалалар</h3>
            <div id="articlesTable">Жүктөлүүдө...</div>
        </div>

    </div>

    <script>
        // 1. DICTIONARY FOR 3 LANGUAGES
        const translations = {
            ky: {
                authTitle: "Админ кирүү",
                authDesc: "Макала жарыялоо үчүн паролду киргизиңиз",
                authBtn: "Кирүү",
                pageTitle: "Физика жана астрофизика (Админ)",
                btnBack: "Сайтка өтүү",
                formTitle: "Жаңы Макала кошуу",
                labelTitle: "Макаланын Темасы (Аталышы):",
                labelCat: "Категория:",
                opt1: "Астрофизика", opt2: "Асман механикасы", opt3: "Космология", opt4: "Жылдыздар жана Спектрлер",
                labelImg: "Сүрөт URL (Милдеттүү эмес):",
                label3D: "3D Модель же Симуляция Embed URL:",
                labelFormula: "Формулалар (LaTeX форматында, мисалы: $F = G \\frac{m_1 m_2}{r^2}$):",
                labelContent: "Макаланын Негизги Тексти:",
                btnSubmit: "Макаланы Жарыялоо",
                listTitle: "Жарыяланган Макалалар",
                previewText: "Формуланы алдын ала көрүү...",
                loading: "Жүктөлүүдө...",
                noArticles: "Азырынча макалалар жок.",
                deleteBtn: "Өчүрүү"
            },
            ru: {
                authTitle: "Вход для админа",
                authDesc: "Введите пароль для публикации статей",
                authBtn: "Войти",
                pageTitle: "Физика и астрофизика (Админ)",
                btnBack: "На сайт",
                formTitle: "Добавить новую статью",
                labelTitle: "Тема статьи (Заголовок):",
                labelCat: "Категория:",
                opt1: "Астрофизика", opt2: "Небесная механика", opt3: "Космология", opt4: "Звезды и спектры",
                labelImg: "URL изображения (необязательно):",
                label3D: "URL 3D-модели или симуляции Embed:",
                labelFormula: "Формулы (в формате LaTeX, например: $F = G \\frac{m_1 m_2}{r^2}$):",
                labelContent: "Основной текст статьи:",
                btnSubmit: "Опубликовать статью",
                listTitle: "Опубликованные статьи",
                previewText: "Предпросмотр формулы...",
                loading: "Загрузка...",
                noArticles: "Статей пока нет.",
                deleteBtn: "Удалить"
            },
            en: {
                authTitle: "Admin Login",
                authDesc: "Enter password to publish articles",
                authBtn: "Login",
                pageTitle: "Physics & Astrophysics (Admin)",
                btnBack: "To Website",
                formTitle: "Add New Article",
                labelTitle: "Article Title:",
                labelCat: "Category:",
                opt1: "Astrophysics", opt2: "Celestial Mechanics", opt3: "Cosmology", opt4: "Stars & Spectra",
                labelImg: "Image URL (Optional):",
                label3D: "3D Model or Simulation Embed URL:",
                labelFormula: "Formulas (LaTeX format, e.g. $F = G \\frac{m_1 m_2}{r^2}$):",
                labelContent: "Main Content:",
                btnSubmit: "Publish Article",
                listTitle: "Published Articles",
                previewText: "Formula Preview...",
                loading: "Loading...",
                noArticles: "No articles yet.",
                deleteBtn: "Delete"
            }
        };

        let currentLang = localStorage.getItem("app_lang") || "ky";

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem("app_lang", lang);
            document.getElementById('langSelector').value = lang;

            const t = translations[lang];
            document.getElementById('i18n_authTitle').innerText = t.authTitle;
            document.getElementById('i18n_authDesc').innerText = t.authDesc;
            document.getElementById('i18n_authBtn').innerText = t.authBtn;
            document.getElementById('i18n_pageTitle').innerHTML = `<i class="fa-solid fa-atom"></i> ${t.pageTitle}`;
            document.getElementById('i18n_btnBack').innerHTML = `<i class="fa-solid fa-arrow-left"></i> ${t.btnBack}`;
            document.getElementById('i18n_formTitle').innerHTML = `<i class="fa-solid fa-plus-circle"></i> ${t.formTitle}`;
            document.getElementById('i18n_labelTitle').innerText = t.labelTitle;
            document.getElementById('i18n_labelCat').innerText = t.labelCat;
            document.getElementById('opt1').innerText = t.opt1;
            document.getElementById('opt2').innerText = t.opt2;
            document.getElementById('opt3').innerText = t.opt3;
            document.getElementById('opt4').innerText = t.opt4;
            document.getElementById('i18n_labelImg').innerText = t.labelImg;
            document.getElementById('i18n_label3D').innerText = t.label3D;
            document.getElementById('i18n_labelFormula').innerText = t.labelFormula;
            document.getElementById('i18n_labelContent').innerText = t.labelContent;
            document.getElementById('i18n_btnSubmit').innerHTML = `<i class="fa-solid fa-paper-plane"></i> ${t.btnSubmit}`;
            document.getElementById('i18n_listTitle').innerHTML = `<i class="fa-solid fa-list-check"></i> ${t.listTitle}`;
            
            loadArticles();
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
            authDomain: "bilimal-org.firebaseapp.com",
            databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bilimal-org",
            storageBucket: "bilimal-org.firebasestorage.app",
            messagingSenderId: "241750360816",
            appId: "1:241750360816:web:a991434eb5afbc470d7835",
            measurementId: "G-9GSQV60QV0"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const auth = firebase.auth();

        // AUTH & FIREBASE ANONYMOUS AUTHENTICATION
        function ensureAuth() {
            return new Promise((resolve, reject) => {
                if (auth.currentUser) {
                    resolve(auth.currentUser);
                } else {
                    auth.signInAnonymously().then(res => resolve(res.user)).catch(reject);
                }
            });
        }

        function checkAdminAuth() {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === "mirzat14051999") {
                sessionStorage.setItem("astro_admin_auth", "true");
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('adminMainContent').style.display = 'block';
                initAdmin();
            } else {
                document.getElementById('authError').style.display = 'block';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            changeLanguage(currentLang);
            if (sessionStorage.getItem("astro_admin_auth") === "true") {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('adminMainContent').style.display = 'block';
                initAdmin();
            }
        });

        function initAdmin() {
            ensureAuth().then(() => {
                loadArticles();
            }).catch(err => console.error("Auth error:", err));
        }

        function updateFormulaPreview() {
            const val = document.getElementById('articleFormula').value;
            const preview = document.getElementById('formulaPreview');
            preview.innerHTML = val || translations[currentLang].previewText;
            if (window.MathJax) {
                MathJax.typesetPromise([preview]).catch((err) => console.log(err));
            }
        }

        // SAVE ARTICLE UNDER "library/astrophysics" TO MATCH FIREBASE RULES (.write: auth != null)
        function saveArticle() {
            const title = document.getElementById('articleTitle').value.trim();
            const category = document.getElementById('articleCategory').value;
            const imageUrl = document.getElementById('articleImageUrl').value.trim();
            const model3DUrl = document.getElementById('article3DUrl').value.trim();
            const formula = document.getElementById('articleFormula').value.trim();
            const content = document.getElementById('articleContent').value.trim();

            if (!title || !content) {
                alert("Макаланын темасын жана текстин толтуруңуз!");
                return;
            }

            const articleData = {
                title: title,
                category: category,
                imageUrl: imageUrl,
                model3DUrl: model3DUrl,
                formula: formula,
                content: content,
                createdAt: new Date().toISOString()
            };

            ensureAuth().then(() => {
                db.ref('library/astrophysics').push(articleData).then(() => {
                    alert("Ийгиликтүү сакталды!");
                    document.getElementById('articleTitle').value = '';
                    document.getElementById('articleImageUrl').value = '';
                    document.getElementById('article3DUrl').value = '';
                    document.getElementById('articleFormula').value = '';
                    document.getElementById('articleContent').value = '';
                    document.getElementById('formulaPreview').innerText = translations[currentLang].previewText;
                }).catch(err => {
                    alert("Ката: " + err.message);
                });
            });
        }

        function loadArticles() {
            const container = document.getElementById('articlesTable');
            const t = translations[currentLang];
            
            ensureAuth().then(() => {
                db.ref('library/astrophysics').on('value', snapshot => {
                    container.innerHTML = '';
                    if (!snapshot.exists()) {
                        container.innerHTML = `<p style="color: var(--text-muted);">${t.noArticles}</p>`;
                        return;
                    }

                    snapshot.forEach(child => {
                        const id = child.key;
                        const data = child.val();

                        const item = document.createElement('div');
                        item.className = 'article-item';
                        item.innerHTML = `
                            <div>
                                <strong>${data.title}</strong>
                                <div style="font-size: 12px; color: var(--text-muted);">
                                    ${data.category} | ${new Date(data.createdAt).toLocaleDateString()}
                                </div>
                            </div>
                            <button class="btn-delete" onclick="deleteArticle('${id}')"><i class="fa-solid fa-trash"></i> ${t.deleteBtn}</button>
                        `;
                        container.appendChild(item);
                    });
                });
            });
        }

        function deleteArticle(id) {
            if (confirm("Өчүрүүнү каалайсызбы?")) {
                ensureAuth().then(() => {
                    db.ref('library/astrophysics/' + id).remove();
                });
            }
        }
    </script>
</body>
</html>
