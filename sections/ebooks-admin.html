<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электрондук китептер - Bilimal.org</title>

    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #06b6d4;
            --text-color: #f8fafc;
            --error-bg: rgba(30, 41, 59, 0.95);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* Top Header Control Bar */
        .header-bar {
            height: 60px;
            background-color: var(--panel-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            z-index: 100;
            position: relative;
        }

        .book-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40%;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background-color: #334155;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #475569;
        }

        .btn-danger {
            background-color: #ef4444;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-action {
            background-color: #0284c7;
        }
        .btn-action:hover {
            background-color: #0369a1;
        }

        .page-counter {
            font-weight: 600;
            letter-spacing: 1px;
            padding: 0 10px;
        }

        /* Flipbook Viewer Workspace */
        .viewer-container {
            width: 100vw;
            height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: auto;
        }

        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 95%;
            max-height: 95%;
        }

        canvas {
            max-width: 100%;
            max-height: calc(100vh - 80px);
            height: auto;
            background-color: #ffffff;
            border-radius: 4px;
        }

        /* Error Overlay UI */
        .error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--error-bg);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .error-card {
            background-color: #1e293b;
            border: 1px solid #ef4444;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .error-card p {
            color: #f87171;
            font-size: 1.05rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Loading Spinner */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: var(--accent-color);
            animation: spin 1s linear infinite;
            position: absolute;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Header / Nav Controls -->
    <div class="header-bar">
        <div class="book-title" id="book-title-display">"А" тамгасы менен саякат</div>
        
        <div class="controls">
            <button class="btn" onclick="firstPage()"><i class="fa-solid fa-angles-left"></i></button>
            <button class="btn" onclick="prevPage()"><i class="fa-solid fa-chevron-left"></i> Мурунку</button>
            <span class="page-counter" id="page-num-display">0 / 0</span>
            <button class="btn" onclick="nextPage()">Кийинки <i class="fa-solid fa-chevron-right"></i></button>
            <button class="btn" onclick="lastPage()"><i class="fa-solid fa-angles-right"></i></button>
            
            <button class="btn" onclick="zoomIn()"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
            <button class="btn" onclick="zoomOut()"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            <button class="btn" onclick="resetZoom()"><i class="fa-solid fa-rotate-left"></i></button>
            
            <button class="btn btn-danger" onclick="closeViewer()"><i class="fa-solid fa-xmark"></i> Жабуу</button>
        </div>
    </div>

    <!-- Viewer Space -->
    <div class="viewer-container">
        <div id="loading-spinner" class="spinner"></div>
        <div id="canvas-container">
            <canvas id="pdf-render-canvas"></canvas>
        </div>

        <!-- Fallback Error Card -->
        <div id="error-overlay" class="error-overlay">
            <div class="error-card">
                <p>Бул китепти Flipbook режиминде иштетүү мүмкүн болгон жок (Google Drive чектөөсү же шилтеме туура эмес).</p>
                <a id="direct-pdf-link" href="#" target="_blank" class="btn btn-action">
                    <i class="fa-solid fa-file-pdf"></i> PDF катары ачуу
                </a>
            </div>
        </div>
    </div>

    <!-- Core Script Architecture -->
    <script>
        // Set PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // State Variables
        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = 1.2;
        const canvas = document.getElementById('pdf-render-canvas');
        const ctx = canvas.getContext('2d');

        // Example Google Drive PDF Link (Replace or get dynamically via Query Params/Firebase)
        const rawBookUrl = "https://drive.google.com/file/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs/view?usp=sharing";

        /**
         * Extract Google Drive File ID from various URL formats
         */
        function extractDriveId(url) {
            if (!url) return null;
            const match = url.match(/(?:\/d\/|id=|file\/d\/|open\?id=)([a-zA-Z0-9_-]{25,})/);
            return match ? match[1] : null;
        }

        /**
         * Construct CORS-friendly direct stream URLs
         */
        function getCorsFriendlyUrl(originalUrl) {
            const driveId = extractDriveId(originalUrl);
            if (driveId) {
                // lh3.googleusercontent.com allows CORS stream for public Google Drive files
                return `https://lh3.googleusercontent.com/d/${driveId}`;
            }
            return originalUrl;
        }

        /**
         * Main PDF Loading Pipeline with Fallback Strategy
         */
        async function initPdfLoader(originalUrl) {
            showSpinner(true);
            hideErrorOverlay();
            
            // Set Direct Link for fallback button
            document.getElementById('direct-pdf-link').href = originalUrl;

            const primaryUrl = getCorsFriendlyUrl(originalUrl);

            try {
                // Primary Strategy: High-speed Google CDN Direct Stream
                const loadingTask = pdfjsLib.getDocument({
                    url: primaryUrl,
                    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/',
                    cMapPacked: true
                });
                pdfDoc = await loadingTask.promise;
                onPdfLoadedSuccessfully();
            } catch (primaryErr) {
                console.warn("Primary stream attempt failed. Retrying with CORS Proxy...", primaryErr);
                
                try {
                    // Fallback Strategy: Proxy pass-through
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(originalUrl)}`;
                    const fallbackTask = pdfjsLib.getDocument({
                        url: proxyUrl,
                        cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/',
                        cMapPacked: true
                    });
                    pdfDoc = await fallbackTask.promise;
                    onPdfLoadedSuccessfully();
                } catch (fallbackErr) {
                    console.error("All PDF loading mechanisms failed:", fallbackErr);
                    showSpinner(false);
                    showErrorOverlay();
                }
            }
        }

        /**
         * Triggered once PDF promise is resolved
         */
        function onPdfLoadedSuccessfully() {
            showSpinner(false);
            updatePageCounter();
            renderPage(pageNum);
        }

        /**
         * Render specific PDF page onto HTML5 Canvas
         */
        function renderPage(num) {
            pageRendering = true;

            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                const renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            }).catch(err => {
                console.error("Error rendering page: ", err);
            });

            updatePageCounter();
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        // Navigation Actions
        function prevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function nextPage() {
            if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        function firstPage() {
            if (!pdfDoc || pageNum === 1) return;
            pageNum = 1;
            queueRenderPage(pageNum);
        }

        function lastPage() {
            if (!pdfDoc || pageNum === pdfDoc.numPages) return;
            pageNum = pdfDoc.numPages;
            queueRenderPage(pageNum);
        }

        // Zoom Actions
        function zoomIn() {
            scale += 0.2;
            queueRenderPage(pageNum);
        }

        function zoomOut() {
            if (scale <= 0.6) return;
            scale -= 0.2;
            queueRenderPage(pageNum);
        }

        function resetZoom() {
            scale = 1.2;
            queueRenderPage(pageNum);
        }

        // UI Helpers
        function updatePageCounter() {
            const total = pdfDoc ? pdfDoc.numPages : 0;
            document.getElementById('page-num-display').innerText = `${pageNum} / ${total}`;
        }

        function showSpinner(show) {
            document.getElementById('loading-spinner').style.display = show ? 'block' : 'none';
        }

        function showErrorOverlay() {
            document.getElementById('error-overlay').style.display = 'flex';
        }

        function hideErrorOverlay() {
            document.getElementById('error-overlay').style.display = 'none';
        }

        function closeViewer() {
            window.history.back();
        }

        // Start initialization on page load
        document.addEventListener('DOMContentLoaded', () => {
            // Read URL parameter if available (e.g. ebooks-admin.html?pdf=URL)
            const urlParams = new URLSearchParams(window.location.search);
            const pdfParam = urlParams.get('pdf');
            
            initPdfLoader(pdfParam || rawBookUrl);
        });
    </script>
</body>
</html>
