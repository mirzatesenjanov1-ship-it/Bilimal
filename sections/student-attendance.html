<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сабакка катталуу - Bilimal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #111622;
            --border-color: #1e2640;
            --accent-blue: #00d2ff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .btn-back { background: var(--border-color); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .btn-gps { width: 100%; background: var(--accent-blue); color: #0b0e14; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 15px 0; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 15px; border: 1px solid var(--border-color); }
        .alert { padding: 14px; border-radius: 8px; margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; line-height: 1.4; }
        .alert-success { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .alert-error { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <a href="/sections/student-portal.html" class="btn-back"><i class="fas fa-arrow-left"></i> Артка</a>
            <h3 style="color: var(--accent-blue); display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-qrcode"></i> Сабакка каттал
            </h3>
        </div>

        <div id="gpsBox" style="background: #0b0e14; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);">
            <p style="font-size: 13px; color: var(--text-muted);">Катышууну сактоо үчүн алгач GPS аныктаңыз:</p>
            <button class="btn-gps" id="btnGetGps"><i class="fas fa-location-arrow"></i> GPS Аныктоо</button>
            <div id="gpsStatus"></div>
        </div>

        <div id="scannerWrapper" style="display: none;">
            <div id="reader"></div>
        </div>

        <div id="resultBox"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
        authDomain: "bilimal-org.firebaseapp.com",
        databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "bilimal-org",
        storageBucket: "bilimal-org.firebasestorage.app",
        messagingSenderId: "241750360816",
        appId: "1:241750360816:web:a991434eb5afbc470d7835"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    let gpsLocation = null;
    let gpsAccuracy = null;
    let html5QrcodeScanner = null;
    let isProcessing = false;

    const studentEmail = (localStorage.getItem('bilimal_student_email') || '').trim().toLowerCase();

    document.getElementById('btnGetGps').addEventListener('click', () => {
        const status = document.getElementById('gpsStatus');
        status.innerHTML = `<span style="color:var(--accent-blue); font-size:13px;"><i class="fas fa-spinner fa-spin"></i> GPS геолокация аныкталууда...</span>`;

        if (!navigator.geolocation) {
            status.innerHTML = `<span style="color:var(--accent-red); font-size:13px;">Түзмөгүңүз геолокацияны колдобойт.</span>`;
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude.toFixed(6);
                const lng = pos.coords.longitude.toFixed(6);
                const acc = Math.round(pos.coords.accuracy);

                gpsLocation = `https://www.google.com/maps?q=${lat},${lng}`;
                gpsAccuracy = `~${acc} метр`;

                status.innerHTML = `
                    <span style="color:var(--accent-green); font-weight:bold; font-size:13px;">
                        <i class="fas fa-check-circle"></i> GPS Аныкталды! (Тактыгы: ${gpsAccuracy})
                    </span>
                `;
                document.getElementById('scannerWrapper').style.display = 'block';
                startScanner();
            },
            (err) => {
                status.innerHTML = `<span style="color:var(--accent-red); font-size:13px;"><i class="fas fa-exclamation-circle"></i> GPS аныкталган жок! Браузерден уруксат бериңиз.</span>`;
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    });

    function startScanner() {
        if (html5QrcodeScanner) {
            try { html5QrcodeScanner.clear(); } catch(e){}
        }
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
        html5QrcodeScanner.render(onScanSuccess, () => {});
    }

    async function onScanSuccess(decodedText) {
        if (isProcessing) return;
        isProcessing = true;

        const resultBox = document.getElementById('scanResult') || document.getElementById('resultBox');
        resultBox.innerHTML = '';

        try {
            if (!gpsLocation) throw new Error("GPS аныкталган жок!");

            const todayStr = new Date().toISOString().split('T')[0];
            const now = new Date();
            const nowTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const hours = now.getHours();
            const minutes = now.getMinutes();

            // Расписание: 08:15ке чейин "PRESENT" (Келди), андан кийин "LATE" (Кечикти)
            let autoStatus = (hours > 8 || (hours === 8 && minutes > 15)) ? 'LATE' : 'PRESENT';

            // 1. Алгач туура Окуучунун ID'син Firebase DB же LocalStorage'ден табуу
            let matchedStudentId = null;
            let matchedStudentName = studentEmail.split('@')[0];

            // Realtime Database "students" түйүнүнөн издейбиз
            const studentsSnap = await get(ref(database, 'students'));
            if (studentsSnap.exists()) {
                const allStudents = studentsSnap.val();
                for (const [id, sData] of Object.entries(allStudents)) {
                    if (sData.email && sData.email.toLowerCase() === studentEmail) {
                        matchedStudentId = id;
                        matchedStudentName = sData.name || matchedStudentName;
                        break;
                    }
                }
            }

            // Эгер Firebase DBде табылбаса LocalStorage'деги мугалимдин списогун текшеребиз
            if (!matchedStudentId) {
                const storedTeacherData = localStorage.getItem('attendance_app_students');
                if (storedTeacherData) {
                    const parsedList = JSON.parse(storedTeacherData);
                    const found = parsedList.find(s => s.email && s.email.toLowerCase() === studentEmail);
                    if (found) {
                        matchedStudentId = found.id;
                        matchedStudentName = found.name;
                    }
                }
            }

            // Табылбаса убактылуу уникалдуу ключ беребиз
            if (!matchedStudentId) {
                matchedStudentId = 'st_' + studentEmail.replace(/[^a-zA-Z0-9]/g, '');
            }

            // 2. Attendance колуна жазуу
            const attendanceData = {
                studentId: matchedStudentId,
                studentName: matchedStudentName,
                email: studentEmail,
                status: autoStatus,
                checkIn: nowTime,
                mapUrl: gpsLocation,
                geolocation: gpsLocation,
                accuracy: gpsAccuracy || 'Аныкталган жок',
                updatedAt: new Date().toISOString()
            };

            await set(ref(database, `attendance/${todayStr}/${matchedStudentId}`), attendanceData);

            if (html5QrcodeScanner) {
                try { html5QrcodeScanner.clear(); } catch(e){}
            }

            resultBox.innerHTML = `
                <div class="alert alert-success">
                    <i class="fas fa-check-circle"></i> Саат ${nowTime} боюнча катышууңуз катталды!<br>
                    <small>Статус: <strong>${autoStatus === 'PRESENT' ? 'Келди' : 'Кечикти'}</strong> | Журналга жүктөлдү.</small>
                </div>
            `;
        } catch (err) {
            resultBox.innerHTML = `
                <div class="alert alert-error">
                    <i class="fas fa-exclamation-triangle"></i> Ката: ${err.message || 'Катышуу катталган жок!'}
                </div>
            `;
        } finally {
            setTimeout(() => { isProcessing = false; }, 3000);
        }
    }
</script>
</body>
</html>
