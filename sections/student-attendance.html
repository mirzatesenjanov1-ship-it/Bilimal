<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сабакка катталуу - Bilimal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #111622;
            --border-color: #1e2640;
            --accent-blue: #00d2ff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .btn-back { background: var(--border-color); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .btn-gps { width: 100%; background: var(--accent-blue); color: #0b0e14; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 10px 0; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-retry { background: var(--accent-yellow); color: #0b0e14; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 15px; border: 1px solid var(--border-color); }
        .alert { padding: 14px; border-radius: 8px; margin-top: 15px; font-weight: normal; font-size: 13px; line-height: 1.5; }
        .alert-success { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .alert-error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid var(--accent-red); text-align: left; }
        .alert-warning { background: rgba(245, 158, 11, 0.15); color: #fde047; border: 1px solid var(--accent-yellow); text-align: left; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <a href="/sections/student-portal.html" class="btn-back"><i class="fas fa-arrow-left"></i> Артка</a>
            <h3 style="color: var(--accent-blue); display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-qrcode"></i> Сабакка каттал
            </h3>
        </div>

        <div id="gpsBox" style="background: #0b0e14; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);">
            <p style="font-size: 13px; color: var(--text-muted);">Катышууну сактоо үчүн алгач GPS аныктаңыз:</p>
            
            <button class="btn-gps" id="btnGetGps">
                <i class="fas fa-location-arrow"></i> GPS Аныктоо
            </button>
            
            <div id="gpsStatus"></div>
        </div>

        <div id="scannerWrapper" style="display: none;">
            <div id="reader"></div>
        </div>

        <div id="resultBox"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
        authDomain: "bilimal-org.firebaseapp.com",
        databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "bilimal-org",
        storageBucket: "bilimal-org.firebasestorage.app",
        messagingSenderId: "241750360816",
        appId: "1:241750360816:web:a991434eb5afbc470d7835"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    let gpsLocation = null;
    let gpsAccuracy = null;
    let html5QrcodeScanner = null;
    let isProcessing = false;

    const studentEmail = (localStorage.getItem('bilimal_student_email') || '').trim().toLowerCase();

    const btnGetGps = document.getElementById('btnGetGps');
    const gpsStatus = document.getElementById('gpsStatus');

    // Экран ачылганда уруксат статусун автоматты текшерүү
    checkPermissionStatus();

    async function checkPermissionStatus() {
        if (navigator.permissions && navigator.permissions.query) {
            try {
                const status = await navigator.permissions.query({ name: 'geolocation' });
                if (status.state === 'denied') {
                    showDeniedInstructions();
                }
                status.onchange = () => {
                    if (status.state === 'granted') {
                        gpsStatus.innerHTML = `<span style="color:var(--accent-green); font-size:13px;"><i class="fas fa-check"></i> Уруксат берилди! "GPS Аныктоо" баскычын басыңыз.</span>`;
                    } else if (status.state === 'denied') {
                        showDeniedInstructions();
                    }
                };
            } catch (e) {}
        }
    }

    btnGetGps.addEventListener('click', () => {
        gpsStatus.innerHTML = `<span style="color:var(--accent-blue); font-size:13px;"><i class="fas fa-spinner fa-spin"></i> GPS геолокация суралууда...</span>`;

        if (!navigator.geolocation) {
            gpsStatus.innerHTML = `<div class="alert alert-error">Түзмөгүңүз геолокацияны колдобойт.</div>`;
            return;
        }

        const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude.toFixed(6);
                const lng = pos.coords.longitude.toFixed(6);
                const acc = Math.round(pos.coords.accuracy);

                gpsLocation = `https://www.google.com/maps?q=${lat},${lng}`;
                gpsAccuracy = `~${acc} метр`;

                gpsStatus.innerHTML = `
                    <div style="color:var(--accent-green); font-weight:bold; font-size:13px; margin-top:8px;">
                        <i class="fas fa-check-circle"></i> GPS Аныкталды! (Тактыгы: ${gpsAccuracy})
                    </div>
                `;
                document.getElementById('scannerWrapper').style.display = 'block';
                startScanner();
            },
            (err) => {
                if (err.code === err.PERMISSION_DENIED) {
                    showDeniedInstructions();
                } else {
                    gpsStatus.innerHTML = `
                        <div class="alert alert-warning">
                            <i class="fas fa-exclamation-triangle"></i> GPS сигналы начар же телефондун геолокациясы өчүк.<br>
                            <button class="btn-retry" onclick="location.reload()"><i class="fas fa-redo"></i> Кайра аракет кылуу</button>
                        </div>
                    `;
                }
            },
            options
        );
    });

    function showDeniedInstructions() {
        gpsStatus.innerHTML = `
            <div class="alert alert-error">
                <strong style="color:#ef4444; font-size:14px;"><i class="fas fa-user-lock"></i> GPS уруксаты бөгөттөлгөн!</strong><br><br>
                Браузер уруксатты бөгөттөп койгондуктан, аны кол менен күйгүзүү керек:<br><br>
                <strong>1-кадам:</strong> Браузердин жогорку сол бурчундагы 🔒 (кулпу) же ⚙️ (жөндөө) сүрөтчөсүн басыңыз.<br>
                <strong>2-кадам:</strong> <em>"Сайттын жөндөөлөрү" (Site settings)</em> бөлүмүнө кириңиз.<br>
                <strong>3-кадам:</strong> <em>"Геолокация / Местоположение"</em> дегенди <strong>"Разрешить" (Уруксат берүү)</strong> кылып өзгөртүңүз.<br>
                <strong>4-кадам:</strong> Төмөндөгү баскычты басып баракчаны жаңыртыңыз.
                <button class="btn-retry" onclick="location.reload()"><i class="fas fa-sync-alt"></i> Баракчаны жаңыртуу</button>
            </div>
        `;
    }

    function startScanner() {
        if (html5QrcodeScanner) {
            try { html5QrcodeScanner.clear(); } catch(e){}
        }
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
        html5QrcodeScanner.render(onScanSuccess, () => {});
    }

    async function onScanSuccess(decodedText) {
        if (isProcessing) return;
        isProcessing = true;

        const resultBox = document.getElementById('resultBox');
        resultBox.innerHTML = '';

        try {
            if (!gpsLocation) throw new Error("GPS геолокация алынган жок!");

            const todayStr = new Date().toISOString().split('T')[0];
            const now = new Date();
            const nowTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const hours = now.getHours();
            const minutes = now.getMinutes();

            let autoStatus = (hours > 8 || (hours === 8 && minutes > 15)) ? 'LATE' : 'PRESENT';

            let matchedStudentId = null;
            let matchedStudentName = studentEmail.split('@')[0];

            const studentsSnap = await get(ref(database, 'students'));
            if (studentsSnap.exists()) {
                const allStudents = studentsSnap.val();
                for (const [id, sData] of Object.entries(allStudents)) {
                    if (sData.email && sData.email.toLowerCase().trim() === studentEmail) {
                        matchedStudentId = id;
                        matchedStudentName = sData.name || matchedStudentName;
                        break;
                    }
                }
            }

            if (!matchedStudentId) {
                matchedStudentId = 'st_' + studentEmail.replace(/[^a-zA-Z0-9]/g, '');
            }

            const attendanceData = {
                studentId: matchedStudentId,
                studentName: matchedStudentName,
                email: studentEmail,
                status: autoStatus,
                checkIn: nowTime,
                mapUrl: gpsLocation,
                geolocation: gpsLocation,
                accuracy: gpsAccuracy || 'Аныкталган жок',
                updatedAt: new Date().toISOString()
            };

            await set(ref(database, `attendance/${todayStr}/${matchedStudentId}`), attendanceData);

            if (html5QrcodeScanner) {
                try { html5QrcodeScanner.clear(); } catch(e){}
            }

            resultBox.innerHTML = `
                <div class="alert alert-success">
                    <i class="fas fa-check-circle"></i> Саат ${nowTime} боюнча катышууңуз катталды!<br>
                    <small>Статус: <strong>${autoStatus === 'PRESENT' ? 'Келди' : 'Кечикти'}</strong> | Класс жетекчинин журналына сакталды.</small>
                </div>
            `;
        } catch (err) {
            resultBox.innerHTML = `
                <div class="alert alert-error">
                    <i class="fas fa-exclamation-triangle"></i> Ката: ${err.message || 'Катышуу катталган жок!'}
                </div>
            `;
        } finally {
            setTimeout(() => { isProcessing = false; }, 3000);
        }
    }
</script>
</body>
</html>
