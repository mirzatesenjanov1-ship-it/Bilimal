<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilimAl.org - Бала бакча китепканасы (Админ)</title>

    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #080a0f;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e2640;
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 22px;
            color: #00d2ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            background: #1e2640;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #00d2ff;
            color: #080a0f;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .form-card {
            background: #111622;
            border: 1px solid #1e2640;
            border-radius: 12px;
            padding: 24px;
            height: fit-content;
        }

        .form-card h2 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 20px;
            border-bottom: 1px solid #1e2640;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            background: #0b0e14;
            border: 1px solid #1e2640;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #00d2ff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-save {
            width: 100%;
            background: #00e676;
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-save:hover {
            background: #00c853;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
        }

        .btn-save:disabled {
            background: #4a5568;
            color: #a0aec0;
            cursor: not-allowed;
            box-shadow: none;
        }

        .list-card {
            background: #111622;
            border: 1px solid #1e2640;
            border-radius: 12px;
            padding: 24px;
            min-height: 500px;
        }

        .list-card h2 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 20px;
            border-bottom: 1px solid #1e2640;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .book-item {
            background: #0b0e14;
            border: 1px solid #1e2640;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .book-info h3 {
            font-size: 16px;
            color: #00d2ff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .book-info .meta {
            font-size: 12px;
            color: #718096;
            margin-bottom: 8px;
        }

        .book-info p {
            font-size: 14px;
            color: #cbd5e0;
            white-space: pre-line;
        }

        .btn-delete {
            background: rgba(229, 62, 62, 0.2);
            color: #feb2b2;
            border: 1px solid #e53e3e;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }

        .btn-delete:hover {
            background: #e53e3e;
            color: white;
        }

        .empty-msg {
            text-align: center;
            color: #718096;
            padding: 40px 0;
            font-size: 14px;
        }

        .status-toast {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: 500;
        }
        .status-toast.success {
            display: block;
            background: rgba(0, 230, 118, 0.15);
            border: 1px solid #00e676;
            color: #00e676;
        }
        .status-toast.error {
            display: block;
            background: rgba(229, 62, 62, 0.15);
            border: 1px solid #e53e3e;
            color: #feb2b2;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-child"></i> Бала бакча китепканасы (Админ)</h1>
        <a href="../dashboard.html" class="btn-back"><i class="fas fa-arrow-left"></i> Башкаруу панелине кайтуу</a>
    </div>

    <div class="main-container">
        <!-- ФОРМА (САКТОО БӨЛҮМҮ) -->
        <div class="form-card">
            <h2>Жаңы материал кошуу</h2>

            <div id="status-toast" class="status-toast"></div>

            <form id="library-form" onsubmit="return false;">
                <div class="form-group">
                    <label for="book-title">Аталышы / Темасы *</label>
                    <input type="text" id="book-title" placeholder="Мисалы: Алтын балык жомогу" required>
                </div>

                <div class="form-group">
                    <label for="book-category">Категориясы *</label>
                    <select id="book-category" required>
                        <option value="Эл жомоктору">Эл жомоктору</option>
                        <option value="Дүйнөлүк жомок">Дүйнөлүк жомок</option>
                        <option value="Ырлар жана ыр саптары">Ырлар жана ыр саптары</option>
                        <option value="Табышмактар">Табышмактар</option>
                        <option value="Өнүктүрүүчү оюндар">Өнүктүрүүчү оюндар</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="book-icon">Иконка (Эмоджи) *</label>
                    <input type="text" id="book-icon" value="📖" required>
                </div>

                <div class="form-group">
                    <label for="book-format">Форматы *</label>
                    <select id="book-format" required>
                        <option value="text">Текст түрүндө (Мазмунун жазуу)</option>
                        <option value="audio">Аудио шилтеме (MP3 / Audio URL)</option>
                        <option value="video">Видео шилтеме (YouTube / Video URL)</option>
                    </select>
                </div>

                <div class="form-group" id="content-text-group">
                    <label for="book-content">Текст мазмуну *</label>
                    <textarea id="book-content" placeholder="Китептин же жомоктун тексти ушул жерге жазылат..."></textarea>
                </div>

                <div class="form-group" id="content-url-group" style="display: none;">
                    <label for="book-url">Медиа шилтемеси (URL) *</label>
                    <input type="url" id="book-url" placeholder="https://example.com/audio.mp3">
                </div>

                <button type="submit" id="save-book-btn" class="btn-save">
                    <i class="fas fa-save"></i> Базага сактоо
                </button>
            </form>
        </div>

        <!-- КИТЕПТЕРДИН ТИЗМЕСИ -->
        <div class="list-card">
            <h2>Базадагы материалдар <span id="books-count" style="font-size: 14px; color: #00d2ff;">(0)</span></h2>
            <div id="books-list">
                <div class="empty-msg">Жүктөлүүдө...</div>
            </div>
        </div>
    </div>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // Firebase Конфигурациясы
        const firebaseConfig = {
            apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
            authDomain: "bilimal-org.firebaseapp.com",
            databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bilimal-org",
            storageBucket: "bilimal-org.firebasestorage.app",
            messagingSenderId: "241750360816",
            appId: "1:241750360816:web:a991434eb5afbc470d7835",
            measurementId: "G-9GSQV60QV0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const libraryRef = ref(db, 'kindergarten_library');

        // DOM Элементтери
        const form = document.getElementById('library-form');
        const saveBtn = document.getElementById('save-book-btn');
        const formatSelect = document.getElementById('book-format');
        const textGroup = document.getElementById('content-text-group');
        const urlGroup = document.getElementById('content-url-group');
        const toast = document.getElementById('status-toast');
        const booksListDiv = document.getElementById('books-list');
        const booksCountSpan = document.getElementById('books-count');

        // Формат өзгөргөндө талааларды көрсөтүү/жашыруу
        formatSelect.addEventListener('change', () => {
            if (formatSelect.value === 'text') {
                textGroup.style.display = 'block';
                urlGroup.style.display = 'none';
            } else {
                textGroup.style.display = 'none';
                urlGroup.style.display = 'block';
            }
        });

        // Билдирүү көрсөтүү функциясы
        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `status-toast ${type}`;
            setTimeout(() => {
                toast.className = 'status-toast';
            }, 4000);
        }

        // БАЗАГА САКТОО ЛОГИКАСЫ (САКТОО БАШКЫЧЫ ИШТӨӨСҮ ҮЧҮН)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('book-title').value.trim();
            const category = document.getElementById('book-category').value;
            const icon = document.getElementById('book-icon').value.trim() || '📖';
            const format = formatSelect.value;
            const contentText = document.getElementById('book-content').value.trim();
            const mediaUrl = document.getElementById('book-url').value.trim();

            if (!title) {
                showToast('Сураныч, маалыматтын аталышын жазыңыз!', 'error');
                return;
            }

            if (format === 'text' && !contentText) {
                showToast('Сураныч, текст мазмунун жазыңыз!', 'error');
                return;
            }

            if (format !== 'text' && !mediaUrl) {
                showToast('Сураныч, медиа шилтемени жазыңыз!', 'error');
                return;
            }

            // Баскычты катыруу
            saveBtn.disabled = true;
            saveBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Сакталууда...`;

            try {
                const newBookData = {
                    title: title,
                    category: category,
                    icon: icon,
                    format: format,
                    content: format === 'text' ? contentText : mediaUrl,
                    createdAt: serverTimestamp()
                };

                // Firebase Realtime Database'ге жөнөтүү
                await push(libraryRef, newBookData);

                showToast('Материал ийгиликтүү базага сакталды!', 'success');
                
                // Форманы тазалоо
                document.getElementById('book-title').value = '';
                document.getElementById('book-content').value = '';
                document.getElementById('book-url').value = '';

            } catch (error) {
                console.error("Firebase'ге сактоодо ката чыкты:", error);
                showToast('Ката кетти: ' + error.message, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = `<i class="fas fa-save"></i> Базага сактоо`;
            }
        });

        // БАЗАДАН РЕАЛДУУ УБАКТА ОКУУ ЖАНА ТИЗМЕНИ ЖАҢЫРТУУ
        onValue(libraryRef, (snapshot) => {
            booksListDiv.innerHTML = '';
            
            if (!snapshot.exists()) {
                booksListDiv.innerHTML = `<div class="empty-msg">Базага азырынча эч кандай материал кошула элек.</div>`;
                booksCountSpan.textContent = '(0)';
                return;
            }

            const data = snapshot.val();
            const bookKeys = Object.keys(data).reverse(); // акыркы сакталгандар өйдө чыгат
            booksCountSpan.textContent = `(${bookKeys.length})`;

            bookKeys.forEach((key) => {
                const book = data[key];
                const bookEl = document.createElement('div');
                bookEl.className = 'book-item';

                let displayContent = '';
                if (book.format === 'text') {
                    displayContent = `<p>${book.content.length > 150 ? book.content.substring(0, 150) + '...' : book.content}</p>`;
                } else {
                    displayContent = `<p><a href="${book.content}" target="_blank" style="color:#00d2ff;"><i class="fas fa-external-link-alt"></i> Медианы ачуу (${book.format})</a></p>`;
                }

                bookEl.innerHTML = `
                    <div class="book-info">
                        <h3><span>${book.icon || '📖'}</span> ${book.title}</h3>
                        <div class="meta">Категория: <b>${book.category}</b> | Формат: <b>${book.format}</b></div>
                        ${displayContent}
                    </div>
                    <button class="btn-delete" data-id="${key}"><i class="fas fa-trash"></i> Өчүрүү</button>
                `;

                // Өчүрүү баскычын иштетүү
                bookEl.querySelector('.btn-delete').addEventListener('click', async () => {
                    if (confirm(`"${book.title}" материалын өчүрүүнү каалайсызбы?`)) {
                        try {
                            await remove(ref(db, `kindergarten_library/${key}`));
                            showToast('Материал өчүрүлдү!', 'success');
                        } catch (err) {
                            showToast('Өчүрүүдө ката: ' + err.message, 'error');
                        }
                    }
                });

                booksListDiv.appendChild(bookEl);
            });
        });
    </script>
</body>
</html>
