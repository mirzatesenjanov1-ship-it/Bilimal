<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilimAl.org - Китепкана Админ Панел</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #080a0f; color: #ffffff; min-height: 100vh; padding: 20px; }
        #login-section { max-width: 400px; margin: 100px auto; background: #111622; border: 1px solid #1e2640; border-radius: 12px; padding: 30px; text-align: center; }
        #login-section h2 { color: #00d2ff; margin-bottom: 20px; font-size: 20px; }
        .login-input { width: 100%; background: #0b0e14; border: 1px solid #1e2640; color: #ffffff; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; outline: none; }
        .login-input:focus { border-color: #00d2ff; }
        #admin-pin { letter-spacing: 5px; font-weight: bold; text-align: center; font-size: 18px; }
        .btn-login { width: 100%; background: #00d2ff; color: #080a0f; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
        #dashboard-section { display: none; }
        .header { max-width: 1200px; margin: 0 auto 25px auto; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e2640; padding-bottom: 15px; }
        .header h1 { font-size: 22px; color: #00d2ff; }
        .btn-logout { background: #e53e3e; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .main-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 420px 1fr; gap: 25px; }
        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } }
        .form-card, .list-card { background: #111622; border: 1px solid #1e2640; border-radius: 12px; padding: 24px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: #a0aec0; margin-bottom: 6px; }
        .form-group select, .form-group input, .form-group textarea { width: 100%; background: #0b0e14; border: 1px solid #1e2640; color: #ffffff; padding: 12px; border-radius: 8px; font-size: 14px; outline: none; }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .btn-save { width: 100%; background: #00e676; color: #000; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .book-item { background: #0b0e14; border: 1px solid #1e2640; border-radius: 10px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; }
        .btn-delete { background: rgba(229, 62, 62, 0.2); color: #feb2b2; border: 1px solid #e53e3e; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .status-toast { display: none; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
        .status-toast.success { display: block; background: rgba(0, 230, 118, 0.15); color: #00e676; border: 1px solid #00e676; }
        .status-toast.error { display: block; background: rgba(229, 62, 62, 0.15); color: #feb2b2; border: 1px solid #e53e3e; }
    </style>
</head>
<body>

    <div id="login-section">
        <h2><i class="fas fa-lock"></i> Админ панелге кирүү</h2>
        <div id="login-toast" class="status-toast"></div>
        <form id="login-form">
            <input type="email" id="admin-email" class="login-input" placeholder="Электрондук почта" required>
            <input type="password" id="admin-password" class="login-input" placeholder="Сырсөз" required>
            <input type="password" id="admin-pin" class="login-input" placeholder="ПИН КОД (4 орундуу)" maxlength="4" required>
            <button type="submit" id="btn-login-submit" class="btn-login">Кирүү</button>
        </form>
    </div>

    <div id="dashboard-section">
        <div class="header">
            <h1><i class="fas fa-book-reader"></i> Китепкана башкаруу панели</h1>
            <button id="btn-logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Чыгуу</button>
        </div>

        <div class="main-container">
            <div class="form-card">
                <h2>Жаңы материал кошуу</h2>
                <div id="status-toast" class="status-toast"></div>

                <form id="library-form">
                    <div class="form-group">
                        <label>Аталышы / Темасы *</label>
                        <input type="text" id="book-title" placeholder="Мисалы: Алтын балык жомогу" required>
                    </div>
                    <div class="form-group">
                        <label>Автору *</label>
                        <input type="text" id="book-author" placeholder="Мисалы: Кыргыз эл жомогу" value="Кыргыз эл жомогу" required>
                    </div>
                    <div class="form-group">
                        <label>Категориясы *</label>
                        <select id="book-category" required>
                            <option value="jomok">Эл жомоктору</option>
                            <option value="audio">Аудио жомоктор</option>
                            <option value="picture">Сүрөттүү / PDF</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Иконка (Эмоджи) *</label>
                        <input type="text" id="book-icon" value="📖" required>
                    </div>
                    <div class="form-group">
                        <label>Форматы *</label>
                        <select id="book-format" required>
                            <option value="text">Текст түрүндө</option>
                            <option value="pdf">PDF / Сырткы Шилтеме (Google Drive / URL)</option>
                        </select>
                    </div>
                    <div class="form-group" id="content-text-group">
                        <label>Текст мазмуну *</label>
                        <textarea id="book-content" placeholder="Жомок же аңгеменин текстин ушул жерге жазыңыз..."></textarea>
                    </div>
                    <div class="form-group" id="content-url-group" style="display: none;">
                        <label>PDF же Шилтеме (URL) *</label>
                        <input type="url" id="book-url" placeholder="https://drive.google.com/...">
                    </div>
                    <button type="submit" id="save-book-btn" class="btn-save"><i class="fas fa-save"></i> Базага сактоо</button>
                </form>
            </div>

            <div class="list-card">
                <h2>Базадагы китептер <span id="books-count" style="color: #00d2ff;">(0)</span></h2>
                <div id="books-list"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
            authDomain: "bilimal-org.firebaseapp.com",
            databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bilimal-org",
            storageBucket: "bilimal-org.firebasestorage.app",
            messagingSenderId: "241750360816",
            appId: "1:241750360816:web:a991434eb5afbc470d7835"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const libraryRef = ref(db, 'kindergarten_library');

        const MASTER_PIN = "7777"; // Демейки ПИН код

        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginForm = document.getElementById('login-form');
        const loginToast = document.getElementById('login-toast');
        const logoutBtn = document.getElementById('btn-logout');

        const form = document.getElementById('library-form');
        const saveBtn = document.getElementById('save-book-btn');
        const formatSelect = document.getElementById('book-format');
        const textGroup = document.getElementById('content-text-group');
        const urlGroup = document.getElementById('content-url-group');
        const toast = document.getElementById('status-toast');
        const booksListDiv = document.getElementById('books-list');
        const booksCountSpan = document.getElementById('books-count');

        let currentUser = null;

        formatSelect.addEventListener('change', () => {
            if (formatSelect.value === 'text') {
                textGroup.style.display = 'block'; urlGroup.style.display = 'none';
            } else {
                textGroup.style.display = 'none'; urlGroup.style.display = 'block';
            }
        });

        function showToast(elem, msg, type = 'success') {
            elem.textContent = msg; elem.className = `status-toast ${type}`;
            setTimeout(() => { elem.className = 'status-toast'; }, 4000);
        }

        onAuthStateChanged(auth, (user) => {
            const pinVerified = sessionStorage.getItem('admin_pin_verified');
            if (user && pinVerified === 'true') {
                currentUser = user;
                loginSection.style.display = 'none';
                dashboardSection.style.display = 'block';
                loadLibraryData();
            } else {
                currentUser = null;
                if(user) signOut(auth);
                loginSection.style.display = 'block';
                dashboardSection.style.display = 'none';
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value.trim();
            const pin = document.getElementById('admin-pin').value.trim();

            if (pin !== MASTER_PIN) {
                showToast(loginToast, 'ПИН код туура эмес!', 'error');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                sessionStorage.setItem('admin_pin_verified', 'true');
            } catch (err) {
                showToast(loginToast, 'Кирүү катасы: ' + err.message, 'error');
            }
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
            sessionStorage.removeItem('admin_pin_verified');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUser) return;

            const title = document.getElementById('book-title').value.trim();
            const author = document.getElementById('book-author').value.trim();
            const category = document.getElementById('book-category').value;
            const cover = document.getElementById('book-icon').value.trim() || '📖';
            const format = formatSelect.value;
            const contentText = document.getElementById('book-content').value.trim();
            const mediaUrl = document.getElementById('book-url').value.trim();

            saveBtn.disabled = true;
            try {
                await currentUser.getIdToken(true);
                await push(libraryRef, {
                    title, author, category, cover, format,
                    content: format === 'text' ? contentText : '',
                    pdfUrl: format === 'pdf' ? mediaUrl : '',
                    createdAt: serverTimestamp()
                });
                showToast(toast, 'Материал сакталды!', 'success');
                form.reset();
            } catch (err) {
                showToast(toast, 'Сактоо катасы: ' + err.message, 'error');
            } finally {
                saveBtn.disabled = false;
            }
        });

        function loadLibraryData() {
            onValue(libraryRef, (snapshot) => {
                booksListDiv.innerHTML = '';
                if (!snapshot.exists()) {
                    booksListDiv.innerHTML = '<div style="color:#a0aec0;">Китеп азырынча жок.</div>';
                    booksCountSpan.textContent = '(0)';
                    return;
                }
                const data = snapshot.val();
                const keys = Object.keys(data).reverse();
                booksCountSpan.textContent = `(${keys.length})`;

                keys.forEach((key) => {
                    const book = data[key];
                    const div = document.createElement('div');
                    div.className = 'book-item';
                    div.innerHTML = `
                        <div>
                            <h3 style="color:#00d2ff;">${book.cover || '📖'} ${book.title}</h3>
                            <p style="font-size:12px; color:#a0aec0;">Автору: ${book.author} | Категория: ${book.category}</p>
                        </div>
                        <button class="btn-delete"><i class="fas fa-trash"></i> Өчүрүү</button>
                    `;
                    div.querySelector('.btn-delete').addEventListener('click', async () => {
                        if (confirm(`"${book.title}" өчүрүлсүнбү?`)) {
                            await remove(ref(db, `kindergarten_library/${key}`));
                            showToast(toast, 'Өчүрүлдү!', 'success');
                        }
                    });
                    booksListDiv.appendChild(div);
                });
            }, (err) => {
                showToast(toast, 'Окуу катасы: ' + err.message, 'error');
            });
        }
    </script>
</body>
</html>
