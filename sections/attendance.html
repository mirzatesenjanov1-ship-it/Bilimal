<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Окуучулардын катышуусу - Bilimal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #111622;
            --border-color: #1e2640;
            --accent-color: #00d2ff;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --text-main: #ffffff;
            --text-muted: #7f8c8d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; }
        .container { max-width: 1300px; margin: 0 auto; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 18px;
        }

        .stat-card h4 { font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
        .stat-card .val { font-size: 26px; font-weight: bold; }

        .main-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 992px) { .main-layout { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .card-title { font-size: 18px; color: var(--accent-color); font-weight: 600; display: flex; align-items: center; gap: 10px; }

        .search-input {
            background: #0b0e14; border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 6px; color: #fff; outline: none; font-size: 14px;
        }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: #0b0e14; color: var(--text-muted); padding: 12px 14px; font-weight: 500; border-bottom: 1px solid var(--border-color); }
        td { padding: 14px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }

        .status-btn { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; text-align: center; }
        .status-present { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .status-late { background: rgba(245, 158, 11, 0.2); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        .status-absent { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .map-btn {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(0, 210, 255, 0.15);
            color: var(--accent-color); border: 1px solid var(--accent-color); padding: 6px 10px;
            border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 500; transition: 0.2s;
        }
        .map-btn:hover { background: var(--accent-color); color: #0b0e14; }

        .no-geo { color: var(--text-muted); font-size: 13px; }

        .action-btns { display: flex; flex-direction: column; gap: 4px; }
        .act-btn {
            background: #1e2640; border: none; color: #fff; width: 24px; height: 24px;
            border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px;
        }
        .act-btn.green:hover { background: var(--accent-green); }
        .act-btn.yellow:hover { background: var(--accent-yellow); }
        .act-btn.red:hover { background: var(--accent-red); }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px; background: #0b0e14; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 14px; outline: none; }

        .btn-add { width: 100%; background: var(--accent-color); color: #0b0e14; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-add:hover { opacity: 0.9; }

        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--accent-color); color: #0b0e14; padding: 12px 20px; border-radius: 8px; font-weight: bold; display: none; z-index: 9999; }
    </style>
</head>
<body>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card"><h4>Жалпы Окуучулар</h4><div class="val" id="statTotal">0</div></div>
        <div class="stat-card"><h4>Келгендер</h4><div class="val" style="color: var(--accent-green);" id="statPresent">0</div></div>
        <div class="stat-card"><h4>Кечикти</h4><div class="val" style="color: var(--accent-yellow);" id="statLate">0</div></div>
        <div class="stat-card"><h4>Келген жок</h4><div class="val" style="color: var(--accent-red);" id="statAbsent">0</div></div>
    </div>

    <div class="main-layout">
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-list-check"></i> Катышуу журналы</div>
                <input type="text" id="searchInput" class="search-input" placeholder="Окуучуну издөө...">
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Окуучунун Аты-Жөнү</th>
                            <th>Электрондук Почтасы</th>
                            <th>Кирген убактысы</th>
                            <th>Геолокация (GPS)</th>
                            <th>Статусу</th>
                            <th>Белгилөө</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Маалыматтар жүктөлүүдө...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div>
            <div class="card">
                <div class="card-title" style="font-size: 15px;"><i class="fas fa-qrcode"></i> Жалпы QR Сканер Терминалы</div>
                <div style="border: 2px dashed var(--border-color); border-radius: 8px; padding: 20px; text-align: center; margin-top: 15px;">
                    <i class="fas fa-camera" style="font-size: 32px; color: var(--accent-color); margin-bottom: 10px;"></i>
                    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">Окуучунун QR Токенин киргизиңиз:</p>
                    <input type="text" id="manualTokenInput" class="search-input" placeholder="Сканерден өткөрүү..." style="width: 100%; text-align: center;">
                </div>
            </div>

            <div class="card">
                <div class="card-title" style="font-size: 15px;"><i class="fas fa-user-plus"></i> Окуучу кошуу</div>
                <form id="addStudentForm">
                    <div class="form-group">
                        <label>Окуучунун Аты-Жөнү:</label>
                        <input type="text" id="newStudentName" placeholder="Мисалы: Абдуллаев Нурислам" required>
                    </div>
                    <div class="form-group">
                        <label>Электрондук Почтасы (Email):</label>
                        <input type="email" id="newStudentEmail" placeholder="Мисалы: student@gmail.com" required>
                    </div>
                    <button type="submit" class="btn-add">+ Базага кошуу</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toastMsg">Билдирүү</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
        authDomain: "bilimal-org.firebaseapp.com",
        databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "bilimal-org",
        storageBucket: "bilimal-org.firebasestorage.app",
        messagingSenderId: "241750360816",
        appId: "1:241750360816:web:a991434eb5afbc470d7835"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    let activeTeacherId = null;
    const todayStr = new Date().toISOString().split('T')[0];

    const attendanceTableBody = document.getElementById('attendanceTableBody');
    const toastMsg = document.getElementById('toastMsg');

    onAuthStateChanged(auth, (user) => {
        if (user) {
            activeTeacherId = user.uid;
        }
        // Колдонуучу кирсе да, кирбесе да базадагы бардык окуучуларды издеп табуу
        loadGlobalAttendanceData();
    });

    // БАЗАДАГЫ БАРДЫК МУГАЛИМДЕРДИН ОКУУЧУЛАРЫН ТАППАК ЖААЛЫМ САКТАП ИШТӨӨ
    function loadGlobalAttendanceData() {
        const teachersRef = ref(database, `teachers`);

        onValue(teachersRef, (snapshot) => {
            if (!snapshot.exists()) {
                renderTable({}, {});
                return;
            }

            const teachersData = snapshot.val();
            let aggregatedStudents = {};
            let aggregatedAttendance = {};

            // Бардык мугалимдердин астындагы окуучуларды жана катышууну топтоо
            for (const [tId, tData] of Object.entries(teachersData)) {
                if (!activeTeacherId) activeTeacherId = tId; // биринчи табылган IDни активдүү кылуу

                if (tData.students) {
                    for (const [sId, sData] of Object.entries(tData.students)) {
                        aggregatedStudents[sId] = { ...sData, teacherOwnerId: tId };
                    }
                }

                if (tData.attendance && tData.attendance[todayStr]) {
                    for (const [sId, attData] of Object.entries(tData.attendance[todayStr])) {
                        aggregatedAttendance[sId] = attData;
                    }
                }
            }

            renderTable(aggregatedStudents, aggregatedAttendance);
        });
    }

    function renderTable(students, attendance) {
        attendanceTableBody.innerHTML = '';
        let total = 0, present = 0, late = 0, absent = 0;
        const studentEntries = Object.entries(students);
        total = studentEntries.length;

        if (total === 0) {
            attendanceTableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">Окуучулар табылган жок. Окуучу кошуңуз.</td></tr>`;
            updateStats(0, 0, 0, 0);
            return;
        }

        let index = 1;
        for (const [sId, sData] of studentEntries) {
            const att = attendance[sId] || {};
            const status = att.status || 'ABSENT';
            const checkInTime = att.checkIn || '-';
            const teacherId = sData.teacherOwnerId || activeTeacherId;
            
            // GPS Маалыматын Табуу жана Онлайн Карта шилтемесин түзүү
            let geoHTML = `<span class="no-geo">-</span>`;
            let rawGeo = att.geolocation || att.mapUrl || att.coordinates || "";

            if (rawGeo && rawGeo !== "-" && !rawGeo.includes("берилген эмес") && !rawGeo.includes("өчүрүлгөн")) {
                if (rawGeo.startsWith('http://') || rawGeo.startsWith('https://')) {
                    geoHTML = `<a href="${rawGeo}" target="_blank" class="map-btn"><i class="fas fa-map-marked-alt"></i> Картадан көрүү</a>`;
                } else if (rawGeo.includes(',')) {
                    const cleanCoords = rawGeo.replace(/\s+/g, '');
                    geoHTML = `<a href="https://www.google.com/maps?q=${cleanCoords}" target="_blank" class="map-btn"><i class="fas fa-map-pin"></i> ${cleanCoords}</a>`;
                } else {
                    geoHTML = `<span class="no-geo">${rawGeo}</span>`;
                }
            } else if (rawGeo) {
                geoHTML = `<span class="no-geo" style="font-size:11px;">${rawGeo}</span>`;
            }

            let statusBadge = '';
            if (status === 'PRESENT') {
                statusBadge = `<span class="status-btn status-present">Толук катышты</span>`;
                present++;
            } else if (status === 'LATE') {
                statusBadge = `<span class="status-btn status-late">Кечикти</span>`;
                late++;
            } else {
                statusBadge = `<span class="status-btn status-absent">Келген жок</span>`;
                absent++;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index++}</td>
                <td><strong>${sData.name || 'Окуучу'}</strong></td>
                <td style="color: var(--text-muted); font-size:13px;">${sData.email || '-'}</td>
                <td>${checkInTime}</td>
                <td>${geoHTML}</td>
                <td>${statusBadge}</td>
                <td>
                    <div class="action-btns">
                        <button class="act-btn green" title="Келди" onclick="setStatus('${teacherId}', '${sId}', 'PRESENT')"><i class="fas fa-check"></i></button>
                        <button class="act-btn yellow" title="Кечикти" onclick="setStatus('${teacherId}', '${sId}', 'LATE')"><i class="fas fa-clock"></i></button>
                        <button class="act-btn red" title="Келген жок" onclick="setStatus('${teacherId}', '${sId}', 'ABSENT')"><i class="fas fa-times"></i></button>
                    </div>
                </td>
            `;
            attendanceTableBody.appendChild(tr);
        }

        updateStats(total, present, late, absent);
    }

    function updateStats(total, present, late, absent) {
        document.getElementById('statTotal').innerText = total;
        document.getElementById('statPresent').innerText = present;
        document.getElementById('statLate').innerText = late;
        document.getElementById('statAbsent').innerText = absent;
    }

    window.setStatus = async function(tId, studentId, newStatus) {
        const targetTeacherId = tId || activeTeacherId || 'default_teacher';
        const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const attRef = ref(database, `teachers/${targetTeacherId}/attendance/${todayStr}/${studentId}`);
        await update(attRef, {
            status: newStatus,
            checkIn: newStatus !== 'ABSENT' ? nowTime : '-',
            updatedAt: new Date().toISOString()
        });
        showToast('Статус жаңыртылды!');
    };

    document.getElementById('addStudentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('newStudentName').value.trim();
        const email = document.getElementById('newStudentEmail').value.trim().toLowerCase();
        const targetTeacherId = activeTeacherId || 'default_teacher';

        const sId = 'std_' + Date.now();
        const studentRef = ref(database, `teachers/${targetTeacherId}/students/${sId}`);

        await set(studentRef, {
            name: name,
            email: email,
            createdAt: new Date().toISOString()
        });

        document.getElementById('addStudentForm').reset();
        showToast('Жаңы окуучу ийгиликтүү кошулду!');
    });

    function showToast(msg) {
        toastMsg.innerText = msg;
        toastMsg.style.display = 'block';
        setTimeout(() => toastMsg.style.display = 'none', 3000);
    }
</script>
</body>
</html>
