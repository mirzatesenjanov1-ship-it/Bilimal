<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кыргыз адабияты - Окуучулар үчүн - BilimAl.org</title>

    <!-- FontAwesome & CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1495571814896964" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-box {
            text-align: center;
            margin-bottom: 25px;
            padding: 25px;
            background: #111622;
            border-radius: 12px;
            border: 1px solid #1e2640;
        }

        .header-box h1 {
            color: #a855f7;
            font-size: 26px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .adsense-container {
            margin-bottom: 25px;
            text-align: center;
        }

        .card {
            background: #111622;
            border: 1px solid #1e2640;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.2s;
        }

        .card:hover {
            border-color: #a855f7;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e2640;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .card-title {
            color: #a855f7;
            font-size: 19px;
            font-weight: bold;
        }

        .grade-badge {
            background: #1e2640;
            color: #a855f7;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .card-content {
            font-size: 15px;
            color: #d1d5db;
            line-height: 1.6;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .file-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(168, 85, 247, 0.1);
            color: #a855f7;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid rgba(168, 85, 247, 0.3);
            transition: 0.2s;
        }

        .file-button:hover {
            background: #a855f7;
            color: #0b0e14;
        }

        .card-footer {
            margin-top: 15px;
            font-size: 12px;
            color: #6b7280;
            display: flex;
            justify-content: space-between;
        }

        .empty-box {
            text-align: center;
            padding: 40px;
            color: #6b7280;
            background: #111622;
            border-radius: 12px;
            border: 1px solid #1e2640;
        }

        #loader {
            text-align: center;
            padding: 30px;
            color: #a855f7;
            font-size: 18px;
        }

        .back-nav {
            margin-bottom: 15px;
        }

        .back-nav a {
            color: #a855f7;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="back-nav">
            <a href="school-subjects.html"><i class="fas fa-arrow-left"></i> Өткөн менюга кайтуу</a>
        </div>

        <div class="header-box">
            <h1><i class="fas fa-book-reader"></i> Кыргыз адабияты боюнча сабактар жана чыгармалар</h1>
            <p style="color: #9ca3af; font-size: 14px;">Эпостор, акын-жазуучулардын чыгармалары жана тапшырмалар</p>
        </div>

        <!-- AdSense жарнама -->
        <div class="adsense-container">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-1495571814896964"
                 data-ad-slot="auto"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <div id="loader"><i class="fas fa-spinner fa-spin"></i> Материалдар жүктөлүүдө...</div>
        <div id="student-materials-list"></div>
    </div>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
            authDomain: "bilimal-org.firebaseapp.com",
            databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bilimal-org",
            storageBucket: "bilimal-org.firebasestorage.app",
            messagingSenderId: "241750360816",
            appId: "1:241750360816:web:a991434eb5afbc470d7835"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const loader = document.getElementById('loader');
        const listContainer = document.getElementById('student-materials-list');

        // Public Кыргыз Адабияты зонасы
        const publicRef = ref(db, 'library/kyrgyz_literature_materials');

        onValue(publicRef, (snapshot) => {
            loader.style.display = 'none';
            listContainer.innerHTML = '';

            if (!snapshot.exists()) {
                listContainer.innerHTML = `
                    <div class="empty-box">
                        <i class="fas fa-book" style="font-size: 32px; margin-bottom: 10px; color: #a855f7;"></i>
                        <p>Азырынча Кыргыз адабияты боюнча ачык тапшырмалар жарыялана элек.</p>
                    </div>`;
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const item = childSnapshot.val();

                const card = document.createElement('div');
                card.className = 'card';

                const fileBtn = item.fileUrl 
                    ? `<a href="${item.fileUrl}" target="_blank" class="file-button"><i class="fas fa-file-download"></i> Документ / Текстти ачуу</a>` 
                    : '';

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">${item.title}</span>
                        <span class="grade-badge">${item.grade}-класс</span>
                    </div>
                    <div class="card-content">${item.content}</div>
                    ${fileBtn}
                    <div class="card-footer">
                        <span><i class="fas fa-user-edit"></i> Мугалим: ${item.teacherEmail || 'Кыргыз адабияты мугалими'}</span>
                        <span><i class="far fa-clock"></i> ${item.updatedAt || item.createdAt || ''}</span>
                    </div>
                `;

                listContainer.prepend(card);
            });
        }, (error) => {
            loader.style.display = 'none';
            console.error("Read Error:", error);
            listContainer.innerHTML = `<div class="empty-box" style="color: #ff5252;">Ката кетти: ${error.message}</div>`;
        });
    </script>
</body>
</html>
