<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивдүү Оюн-Тесттер — BiliMal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { background: #04040d; color: #fff; padding: 40px 5%; min-height: 100vh; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(0, 240, 255, 0.2); padding-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        .btn-back { border: 1px solid #00f0ff; color: #00f0ff; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-back:hover { background: #00f0ff; color: #000; box-shadow: 0 0 15px #00f0ff; }
        
        /* LANGUAGE SELECTOR STYLES */
        .lang-selector {
            display: flex;
            gap: 6px;
        }
        .lang-btn {
            background-color: #1e2640;
            color: #fff;
            border: 1px solid #34495e;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }
        .lang-btn.active {
            background-color: #00d2ff;
            color: #0b0e14;
            border-color: #00d2ff;
        }
        .lang-btn:hover {
            background-color: #00d2ff;
            color: #0b0e14;
        }

        /* ADSTERRA BANNER CONTAINER STYLES */
        .adsterra-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0 30px 0;
            overflow: hidden;
            min-height: 90px;
        }
        .adsterra-inner {
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(15, 15, 40, 0.3);
            border: 1px solid rgba(0, 240, 255, 0.1);
            border-radius: 8px;
            padding: 5px;
        }

        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 20px; }
        .game-card { background: rgba(15, 15, 40, 0.6); border: 1px solid rgba(255, 0, 255, 0.2); border-radius: 15px; padding: 25px; text-align: center; transition: 0.3s; }
        .game-card:hover { transform: translateY(-5px); border-color: #00f0ff; box-shadow: 0 5px 25px rgba(0, 240, 255, 0.2); }
        
        .game-title { font-size: 1.3rem; color: #00f0ff; margin: 15px 0 10px; }
        .btn-play { background: linear-gradient(90deg, #ff00ff, #7000ff); border: none; color: white; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.3s; text-decoration: none; display: inline-block; }
        .btn-play:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(255, 0, 255, 0.4); }

        @media (max-width: 768px) {
            header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="btn-back" id="btn-back">← Башкы бетке</a>
        <h1 id="page-title" style="background: linear-gradient(45deg, #00f0ff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Улуттук Оюн Симуляциялары</h1>
        
        <div class="lang-selector">
            <button class="lang-btn active" id="btn-lang-ky">KG</button>
            <button class="lang-btn" id="btn-lang-ru">RU</button>
            <button class="lang-btn" id="btn-lang-en">EN</button>
        </div>
    </header>

    <!-- ADSTERRA 728x90 AD ZONE START -->
    <div class="adsterra-wrapper">
        <div class="adsterra-inner">
            <script type="text/javascript">
                atOptions = {
                    'key' : '230e338703bb44150336cce1f0832fe3',
                    'format' : 'iframe',
                    'height' : 90,
                    'width' : 728,
                    'params' : {}
                };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/230e338703bb44150336cce1f0832fe3/invoke.js"></script>
        </div>
    </div>
    <!-- ADSTERRA 728x90 AD ZONE END -->

    <div class="games-grid">
        <div class="game-card">
            <div style="font-size: 3.5rem;">🐎</div>
            <div class="game-title" id="game1-title">Кыз Куумай: Физика Онлайн</div>
            <p id="game1-desc" style="color:#7e8bbd; font-size:0.9rem; margin-bottom:20px;">Ылдамдык, тезденүү жана аралык формулалары боюнча реалдуу убакыттагы интерактивдүү жарыш оюну.</p>
            <button class="btn-play" id="game1-btn" onclick="playKyzKuumay()">ОЙНОО</button>
        </div>

        <div class="game-card">
            <div style="font-size: 3.5rem;">🪢</div>
            <div class="game-title" id="game2-title">Аркан Тартыш: Күч Энергиясы</div>
            <p id="game2-desc" style="color:#7e8bbd; font-size:0.9rem; margin-bottom:20px;">Ньютондун үчүнчү закону жана күчтөрдүн вектордук тең салмактуулугу боюнча динамикалык мелдеши.</p>
            <button class="btn-play" id="game2-btn" onclick="playArkanTartysh()">ОЙНОО</button>
        </div>
    </div>

    <script>
        // Тил котормолору
        const translations = {
            ky: {
                btnBack: "← Башкы бетке",
                pageTitle: "Улуттук Оюн Симуляциялары",
                game1Title: "Кыз Куумай: Физика Онлайн",
                game1Desc: "Ылдамдык, тезденүү жана аралык формулалары боюнча реалдуу убакыттагы интерактивдүү жарыш оюну.",
                game1Btn: "ОЙНОО",
                game2Title: "Аркан Тартыш: Күч Энергиясы",
                game2Desc: "Ньютондун үчүнчү закону жана күчтөрдүн вектордук тең салмактуулугу боюнча динамикалык мелдеши.",
                game2Btn: "ОЙНОО"
            },
            ru: {
                btnBack: "← На главную",
                pageTitle: "Национальные Игровые Симуляции",
                game1Title: "Кыз Куумай: Физика Онлайн",
                game1Desc: "Интерактивная гоночная игра в реальном времени по формулам скорости, ускорения и расстояния.",
                game1Btn: "ИГРАТЬ",
                game2Title: "Перетягивание каната: Энергия Силы",
                game2Desc: "Динамическое соревнование по третьему закону Ньютона и векторному равновесию сил.",
                game2Btn: "ИГРАТЬ"
            },
            en: {
                btnBack: "← Home",
                pageTitle: "National Game Simulations",
                game1Title: "Kyz Kuumay: Physics Online",
                game1Desc: "Real-time interactive racing game based on formulas of speed, acceleration, and distance.",
                game1Btn: "PLAY",
                game2Title: "Tug of War: Energy of Force",
                game2Desc: "Dynamic competition based on Newton's third law and vector equilibrium of forces.",
                game2Btn: "PLAY"
            }
        };

        let currentLang = localStorage.getItem('site_lang') || 'ky';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);

            const buttons = {
                ky: document.getElementById('btn-lang-ky'),
                ru: document.getElementById('btn-lang-ru'),
                en: document.getElementById('btn-lang-en')
            };

            Object.keys(buttons).forEach(key => {
                if (buttons[key]) buttons[key].classList.toggle('active', key === lang);
            });

            const t = translations[lang] || translations['ky'];

            document.getElementById('btn-back').innerText = t.btnBack;
            document.getElementById('page-title').innerText = t.pageTitle;
            document.getElementById('game1-title').innerText = t.game1Title;
            document.getElementById('game1-desc').innerText = t.game1Desc;
            document.getElementById('game1-btn').innerText = t.game1Btn;
            document.getElementById('game2-title').innerText = t.game2Title;
            document.getElementById('game2-desc').innerText = t.game2Desc;
            document.getElementById('game2-btn').innerText = t.game2Btn;
        }

        // Event listener'лерди баскычтарга туташтыруу
        document.getElementById('btn-lang-ky').addEventListener('click', () => setLanguage('ky'));
        document.getElementById('btn-lang-ru').addEventListener('click', () => setLanguage('ru'));
        document.getElementById('btn-lang-en').addEventListener('click', () => setLanguage('en'));

        // Баракча жүктөлгөндө сакталган тилди жуктоо
        document.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLang);
        });

        // Кыз Куумай оюнун ачуучу функция
        function playKyzKuumay() {
            window.location.href = "https://mirzatesenjanov1-ship-it.github.io/";
        }

        // Аркан Тартыш оюнун ачуучу функция
        function playArkanTartysh() {
            window.location.href = "../arkan-game/index.html";
        }
    </script>

    <script src="../assets/js/script.js"></script>
</body>
</html>
