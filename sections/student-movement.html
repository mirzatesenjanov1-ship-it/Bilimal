<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Окуучулардын Кыймылы</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --accent-color: #00d2ff;
            --accent-green: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header h1 { font-size: 24px; color: var(--accent-color); display: flex; align-items: center; gap: 10px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; text-align: center; }
        .stat-card h3 { font-size: 28px; color: var(--accent-color); }
        .stat-card p { font-size: 13px; color: var(--text-muted); margin-top: 5px; }

        .main-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: var(--accent-color); display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 10px; background: #1f2937; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; outline: none; font-size: 13px; }
        
        .btn { background: var(--accent-color); color: #000; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: 600; background: #161e2e; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; background: #1f2937; color: var(--accent-color); }
        .btn-delete { color: #ef4444; background: transparent; border: none; cursor: pointer; font-size: 14px; }
        .btn-delete:hover { color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fas fa-exchange-alt"></i> ОКУУЧУЛАРДЫН КЫЙМЫЛ ЖУРНАЛЫ</h1>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3 id="statTotal">0</h3>
            <p>ЖАЛПЫ ЖАЗУУЛАР</p>
        </div>
    </div>

    <div class="main-layout">
        <!-- Мугалим тараптан кол менен каттоо -->
        <div class="card">
            <div class="card-title"><i class="fas fa-pen"></i> Мугалим тараптан каттоо</div>
            <form id="teacherAddForm">
                <div class="form-group">
                    <label>Окуучунун Аты-Жөнү:</label>
                    <input type="text" id="mName" placeholder="Мисалы: Асанов Арсен" required>
                </div>
                <div class="form-group">
                    <label>Классы:</label>
                    <input type="text" id="mClass" placeholder="Мисалы: 9-Б" required>
                </div>
                <div class="form-group">
                    <label>Окуу жай / Мектеп / Абалы:</label>
                    <input type="text" id="mStatus" placeholder="Мисалы: №5 мектеп же КНУ" required>
                </div>
                <div class="form-group">
                    <label>Кошумча маалымат:</label>
                    <textarea id="mNotes" rows="2" placeholder="Себеби же кошумча маалымат..."></textarea>
                </div>
                <button type="submit" class="btn" id="teacherSubmitBtn">Каттоо</button>
            </form>
        </div>

        <!-- Журнал таблицасы -->
        <div class="card">
            <div class="card-title"><i class="fas fa-list"></i> Кыймыл Журналы</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Аты-Жөнү</th>
                            <th>Класс</th>
                            <th>Окуу жай / Абалы</th>
                            <th>Кошумча маалымат</th>
                            <th>Аракет</th>
                        </tr>
                    </thead>
                    <tbody id="movementTableBody">
                        <tr>
                            <td colspan="6" style="text-align:center;">Жүктөлүүдө...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDK модулдары -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
        authDomain: "bilimal-org.firebaseapp.com",
        databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "bilimal-org",
        storageBucket: "bilimal-org.firebasestorage.app",
        messagingSenderId: "241750360816",
        appId: "1:241750360816:web:a991434eb5afbc470d7835",
        measurementId: "G-9GSQV60QV0"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const movementsRef = ref(database, 'movements');

    // Realtime режиминде базадан маалыматты угуу жана заматта таблицага чыгаруу
    onValue(movementsRef, (snapshot) => {
        const tbody = document.getElementById('movementTableBody');
        tbody.innerHTML = '';

        if (!snapshot.exists()) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Катталган маалымат жок</td></tr>';
            document.getElementById('statTotal').innerText = '0';
            return;
        }

        const data = snapshot.val();
        const entries = Object.entries(data);
        document.getElementById('statTotal').innerText = entries.length;

        // Соңку жазууларды өйдөгө чыгаруу
        entries.reverse().forEach(([key, item]) => {
            const dateStr = item.timestamp ? new Date(item.timestamp).toLocaleDateString() : '-';
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${dateStr}</td>
                <td><strong>${item.fullName || '-'}</strong></td>
                <td><span class="badge">${item.studentClass || '-'}</span></td>
                <td>${item.status || '-'}</td>
                <td>${item.notes || '-'}</td>
                <td>
                    <button class="btn-delete" data-id="${key}" title="Өчүрүү">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // Өчүрүү баскычтарына эвент байлоо
        document.querySelectorAll('.btn-delete').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = e.currentTarget.getAttribute('data-id');
                if (confirm('Бул жазууну өчүрүүнү каалайсызбы?')) {
                    await remove(ref(database, `movements/${id}`));
                }
            });
        });
    });

    // Мугалим өзү кол менен кошкондо
    const teacherForm = document.getElementById('teacherAddForm');
    teacherForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const payload = {
            fullName: document.getElementById('mName').value.trim(),
            studentClass: document.getElementById('mClass').value.trim(),
            status: document.getElementById('mStatus').value.trim(),
            notes: document.getElementById('mNotes').value.trim() || 'Мугалим каттады',
            timestamp: new Date().toISOString()
        };

        try {
            await push(movementsRef, payload);
            teacherForm.reset();
        } catch (err) {
            console.error(err);
            alert('Ката чыкты!');
        }
    });
</script>

</body>
</html>
