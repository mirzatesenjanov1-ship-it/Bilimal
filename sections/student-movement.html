<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Окуучулардын Кыймылы (Келди - Кетти)</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --accent-color: #00d2ff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Top Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 24px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-secondary {
            background: #374151;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .lang-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .lang-btn.active, .lang-btn:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Stats Dashboard */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 10px;
            position: relative;
        }

        .stat-card i {
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 24px;
            opacity: 0.3;
            color: var(--accent-color);
        }

        .stat-card h4 {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-card .val {
            font-size: 22px;
            font-weight: bold;
        }

        /* Controls & Form Elements */
        .grid-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 10px;
        }

        .card-title {
            font-size: 16px;
            color: var(--accent-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-muted);
        }

        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 10px 14px;
            background: #1f2937;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        .btn-primary {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* Tables styling */
        .table-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 300px;
        }

        .search-box input {
            padding-left: 35px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            background: #1f2937;
            color: var(--text-muted);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge-in { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
        .badge-out { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="header-title">
                <a href="/sections/curators.html" class="btn-secondary"><i class="fas fa-arrow-left"></i> Башкы бетке</a>
                <h1><i class="fas fa-exchange-alt"></i> ОКУУЧУЛАРДЫН КЫЙМЫЛЫ (КЕЛДИ - КЕТТИ)</h1>
            </div>
            <div class="header-actions">
                <button class="lang-btn active">KG</button>
                <button class="lang-btn">RU</button>
                <button class="lang-btn">EN</button>
            </div>
        </header>

        <!-- STATS DASHBOARD -->
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-users"></i>
                <h4>ЖАЛПЫ КЫЙМЫЛДАР</h4>
                <div class="val" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-user-plus"></i>
                <h4>ЖАҢЫ КЕЛГЕНДЕР</h4>
                <div class="val" id="stat-in" style="color: var(--accent-green);">0</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-user-minus"></i>
                <h4>КОТОРУЛУП КЕТКЕНДЕР</h4>
                <div class="val" id="stat-out" style="color: var(--accent-red);">0</div>
            </div>
        </div>

        <div class="grid-layout">
            <!-- INPUT FORM CARD -->
            <div class="card">
                <div class="card-title"><i class="fas fa-pen-fancy"></i> Кыймылды каттоо</div>
                <form id="movement-form" onsubmit="handleFormSubmit(event)">
                    <div class="form-group">
                        <label>Окуучунун Аты-Жөнү:</label>
                        <input type="text" id="student-name" placeholder="Мисалы: Асанов Арсен" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Классы:</label>
                        <input type="text" id="student-class" placeholder="Мисалы: 9-Б" required>
                    </div>

                    <div class="form-group">
                        <label>Кыймыл түрү:</label>
                        <select id="movement-type" required>
                            <option value="in">🟢 Келди (Жаңы кабыл алынды)</option>
                            <option value="out">🔴 Кетти (Башка мектепке/окуу жайга)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Кайдан келди / Кайка кетти:</label>
                        <input type="text" id="school-info" placeholder="Мисалы: №5 мектептен же Бишкек к-си" required>
                    </div>

                    <div class="form-group">
                        <label>Датасы:</label>
                        <input type="date" id="movement-date" required>
                    </div>

                    <div class="form-group">
                        <label>Себеби / Кошумча маалымат:</label>
                        <textarea id="movement-reason" rows="2" placeholder="Жашаган жерин өзгөрткөндүгү үчүн..."></textarea>
                    </div>

                    <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Каттоо жана Сактоо</button>
                </form>
            </div>

            <!-- TABLE VIEW CARD -->
            <div class="card">
                <div class="table-toolbar">
                    <div class="card-title" style="margin-bottom: 0;"><i class="fas fa-list"></i> Кыймыл Журналы</div>
                    <div style="display: flex; gap: 10px;">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="search-input" placeholder="Окуучуну издөө..." oninput="filterTable()">
                        </div>
                        <button class="btn-secondary" onclick="exportCSV()"><i class="fas fa-file-excel"></i> CSV Экспорт</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Дата</th>
                                <th>Окуучунун аты-жөнү</th>
                                <th>Класс</th>
                                <th>Түрү</th>
                                <th>Кайдан / Кайка</th>
                                <th>Себеби</th>
                                <th>Аракет</th>
                            </tr>
                        </thead>
                        <tbody id="movement-table-body">
                            <!-- JS Dynmic Rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        let movementRecords = [];

        // Application Initialization
        window.addEventListener('DOMContentLoaded', () => {
            // Set default date to today
            document.getElementById('movement-date').valueAsDate = new Date();
            loadRecords();
        });

        function loadRecords() {
            const stored = localStorage.getItem('bilimal_student_movements');
            if (stored) {
                movementRecords = JSON.parse(stored);
            }
            renderTable();
            updateStats();
        }

        function saveRecords() {
            localStorage.setItem('bilimal_student_movements', JSON.stringify(movementRecords));
            updateStats();
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const record = {
                id: Date.now(),
                name: document.getElementById('student-name').value.trim(),
                class: document.getElementById('student-class').value.trim(),
                type: document.getElementById('movement-type').value,
                school: document.getElementById('school-info').value.trim(),
                date: document.getElementById('movement-date').value,
                reason: document.getElementById('movement-reason').value.trim() || 'Көрсөтүлгөн эмес'
            };

            movementRecords.unshift(record); // Add to beginning of array
            saveRecords();
            renderTable();

            // Reset Form fields
            document.getElementById('student-name').value = '';
            document.getElementById('student-class').value = '';
            document.getElementById('school-info').value = '';
            document.getElementById('movement-reason').value = '';
            alert('Окуучунун кыймылы ийгиликтүү катталды!');
        }

        function deleteRecord(id) {
            if (confirm('Бул жазууну өчүрүүнү каалайсызбы?')) {
                movementRecords = movementRecords.filter(item => item.id !== id);
                saveRecords();
                renderTable();
            }
        }

        function renderTable(dataToRender = movementRecords) {
            const tbody = document.getElementById('movement-table-body');
            tbody.innerHTML = '';

            if (dataToRender.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color: var(--text-muted); padding: 20px;">Катталган маалымат жок</td></tr>`;
                return;
            }

            dataToRender.forEach((item, index) => {
                const tr = document.createElement('tr');
                const badgeClass = item.type === 'in' ? 'badge-in' : 'badge-out';
                const typeText = item.type === 'in' ? '<i class="fas fa-arrow-down"></i> Келди' : '<i class="fas fa-arrow-up"></i> Кетти';

                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.date}</td>
                    <td><strong>${item.name}</strong></td>
                    <td>${item.class}</td>
                    <td><span class="badge ${badgeClass}">${typeText}</span></td>
                    <td>${item.school}</td>
                    <td><small style="color: var(--text-muted);">${item.reason}</small></td>
                    <td>
                        <button class="btn-secondary" style="padding: 4px 8px; color: var(--accent-red);" onclick="deleteRecord(${item.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStats() {
            const total = movementRecords.length;
            const inCount = movementRecords.filter(r => r.type === 'in').length;
            const outCount = movementRecords.filter(r => r.type === 'out').length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-in').innerText = inCount;
            document.getElementById('stat-out').innerText = outCount;
        }

        function filterTable() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = movementRecords.filter(r => 
                r.name.toLowerCase().includes(query) || 
                r.class.toLowerCase().includes(query) ||
                r.school.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        function exportCSV() {
            if (movementRecords.length === 0) return alert('Экспорттоого маалымат жок!');

            let csv = 'Дата,Аты-Жону,Класс,Туру,Кайдан/Кайка,Себеби\n';
            movementRecords.forEach(r => {
                const typeName = r.type === 'in' ? 'Келди' : 'Кетти';
                csv += `"${r.date}","${r.name}","${r.class}","${typeName}","${r.school}","${r.reason}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'student_movement_report.csv');
            a.click();
        }
    </script>
</body>
</html>
