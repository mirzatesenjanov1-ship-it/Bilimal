<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Лабораториялык Иштер - Bilimal.org</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f59e0b;
            --text-color: #f8fafc;
            --input-bg: #0f172a;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Modal Structure */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #d97706;
        }

        .dashboard-panel {
            display: none;
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Admin Login Modal -->
    <div id="adminModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">🔒 Админ Кирүү</div>
                <button class="close-btn" onclick="closeAdminModal()">&times;</button>
            </div>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminEmail">Администратор E-mail:</label>
                    <input type="email" id="adminEmail" required placeholder="example@gmail.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="adminPassword">Сырcөз (Password):</label>
                    <input type="password" id="adminPassword" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">Кирүү</button>
            </form>
        </div>
    </div>

    <!-- Admin VIP Panel (Authorized Zone) -->
    <div id="adminDashboard" class="dashboard-panel">
        <h2>VIP Лабораториялык Иштерди Башкаруу Панели</h2>
        <p>Кош келдиңиз, <span id="userEmailDisplay"></span>!</p>
        <button onclick="handleLogout()" style="background:#ef4444; color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">Чыгуу</button>
    </div>

    <!-- Firebase Modular SDK Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // TODO: Бул жерге Firebase Console'дон алынган чыныгы конфигурацияны коюңуз
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById("adminLoginForm");
        const adminModal = document.getElementById("adminModal");
        const adminDashboard = document.getElementById("adminDashboard");
        const userEmailDisplay = document.getElementById("userEmailDisplay");

        // UI контроллерлерди глобалдык тармакка чыгаруу
        window.closeAdminModal = () => {
            adminModal.style.display = "none";
        };

        window.handleLogout = async () => {
            try {
                await signOut(auth);
                alert("Системадан чыктыңыз.");
                location.reload();
            } catch (err) {
                console.error("Чыгууда ката пайда болду:", err);
            }
        };

        // Auth State Listener (Сессияны текшерүү)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                adminModal.style.display = "none";
                adminDashboard.style.display = "block";
                userEmailDisplay.textContent = user.email;
            } else {
                adminModal.style.display = "flex";
                adminDashboard.style.display = "none";
            }
        });

        // Form Submit Handler
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const emailInput = document.getElementById("adminEmail");
            const passwordInput = document.getElementById("adminPassword");
            const loginBtn = document.getElementById("loginBtn");

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            if (!email || !password) {
                alert("Өтүнүч: Email жана сырсөздү толук киргизиңиз!");
                return;
            }

            try {
                loginBtn.disabled = true;
                loginBtn.textContent = "Текшерилүүдө...";

                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                console.log("Админ авторизациядан өттү:", userCredential.user.email);

            } catch (error) {
                console.error("Firebase Auth Error Details:", error.code, error.message);

                switch (error.code) {
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                    case 'auth/invalid-credential':
                        alert("Ката: Email же сырсөз туура эмес!");
                        break;
                    case 'auth/unauthorized-domain':
                        alert("Ката: Бул домен (bilimal.org) Firebase Console'до авторизациядан өткөн эмес (Authorized Domains)!");
                        break;
                    case 'auth/operation-not-allowed':
                        alert("Ката: Firebase Console'до Email/Password менен кирүү өчүрүлгөн!");
                        break;
                    case 'auth/too-many-requests':
                        alert("Ката: Абдан көп ката аракет жасалды. Бир аздан кийин кайра кириңиз!");
                        break;
                    case 'auth/invalid-email':
                        alert("Ката: Электрондук почта форматы туура эмес!");
                        break;
                    default:
                        alert("Кирүүдө белгисиз ката чыкты: " + error.message);
                }
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = "Кирүү";
            }
        });
    </script>
</body>
</html>
