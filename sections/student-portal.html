<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Окуучу Порталы - Bilimal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #111622;
            --border-color: #1e2640;
            --accent-blue: #00d2ff;
            --accent-green: #10b981;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .user-header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            font-size: 16px;
        }

        .user-info strong {
            color: var(--accent-blue);
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .auth-card input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: #0b0e14;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .portal-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .portal-card:hover {
            transform: translateY(-5px);
        }

        .portal-card.attendance-card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.2);
        }

        .portal-card.duty-card:hover {
            border-color: var(--accent-green);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.2);
        }

        .card-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 15px;
        }

        .attendance-card .card-icon {
            background: rgba(0, 210, 255, 0.15);
            color: var(--accent-blue);
        }

        .duty-card .card-icon {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }

        .card-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .btn-enter {
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            border: none;
            cursor: pointer;
        }

        .attendance-card .btn-enter {
            background: var(--accent-blue);
            color: #0b0e14;
        }

        .duty-card .btn-enter {
            background: var(--accent-green);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- AUTH BLOCK -->
    <div id="authBlock" class="auth-card">
        <h2 style="color: var(--accent-blue); margin-bottom: 10px;"><i class="fas fa-user-graduate"></i> Окуучу Порталы</h2>
        <p style="color: var(--text-muted); font-size: 14px;">Системага кирүү үчүн Email дарегиңизди жазыңыз:</p>
        <input type="email" id="emailInput" placeholder="okuuchu@gmail.com">
        <button id="loginBtn" style="width: 100%; padding: 12px; background: var(--accent-blue); border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Кирүү</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainDashboard" style="display: none;">
        <div class="user-header">
            <div class="user-info">
                Окуучу: <strong id="studentName">--</strong>
            </div>
            <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Чыгуу</button>
        </div>

        <div class="portal-grid">
            <!-- SECTION 1 -->
            <a href="/sections/student-attendance.html" class="portal-card attendance-card">
                <div class="card-icon">
                    <i class="fas fa-qrcode"></i>
                </div>
                <div class="card-title">Сабакка каттал</div>
                <div class="card-desc">QR кодду сканерлөө жана GPS геолокация аркылуу сабакка катышууну белгилөө</div>
                <button class="btn-enter"><i class="fas fa-arrow-right"></i> Кирүү</button>
            </a>

            <!-- SECTION 2 -->
            <a href="/sections/student-duty.html" class="portal-card duty-card">
                <div class="card-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="card-title">Кезмет порталы</div>
                <div class="card-desc">Бүгүнкү кезметчилердин тизмесин көрүү жана кезметти кабыл алуу</div>
                <button class="btn-enter"><i class="fas fa-arrow-right"></i> Кирүү</button>
            </a>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const savedEmail = localStorage.getItem('bilimal_student_email');
        if (savedEmail) {
            showDashboard(savedEmail);
        }

        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('emailInput').value.trim();
            if (email) {
                localStorage.setItem('bilimal_student_email', email);
                showDashboard(email);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('bilimal_student_email');
            location.reload();
        });
    });

    function showDashboard(email) {
        document.getElementById('authBlock').style.display = 'none';
        document.getElementById('mainDashboard').style.display = 'block';
        document.getElementById('studentName').innerText = email.split('@')[0];
    }
</script>
</body>
</html>
