<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физика жана Астрофизика</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- MathJax formula rendering -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #151c2c;
            --border: #232d42;
            --primary: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .lang-select {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            font-weight: bold;
        }

        .header {
            text-align: center;
            padding: 20px 0 30px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
        }

        .articles-feed {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .article-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .article-title {
            color: var(--primary);
            font-size: 22px;
            margin: 0 0 10px 0;
        }

        .article-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
        }

        .article-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .iframe-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        .formula-box {
            background: rgba(56, 189, 248, 0.05);
            border-left: 4px solid var(--primary);
            padding: 15px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
            font-size: 16px;
            overflow-x: auto;
        }

        .article-body {
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-line;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="top-bar">
            <div>
                <i class="fa-solid fa-globe" style="color: var(--primary);"></i>
                <select id="langSelector" class="lang-select" onchange="changeLanguage(this.value)">
                    <option value="ky">Кыргызча</option>
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>

        <div class="header">
            <h1 id="i18n_title"><i class="fa-solid fa-user-astronaut"></i> Физика жана Астрофизика</h1>
            <p id="i18n_desc">Теориялык макалалар, формулалар жана интерактивдүү 3D симуляциялар жыйнагы</p>
        </div>

        <div id="articlesFeed" class="articles-feed">
            <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> Жүктөлүүдө...</div>
        </div>

    </div>

    <script>
        const translations = {
            ky: {
                title: "Физика жана Астрофизика",
                desc: "Теориялык макалалар, формулалар жана интерактивдүү 3D симуляциялар жыйнагы",
                loading: "Макалалар жүктөлүүдө...",
                empty: "Азырынча эч кандай макала жарыялана элек."
            },
            ru: {
                title: "Физика и Астрофизика",
                desc: "Сборник теоретических статей, формул и интерактивных 3D-симуляций",
                loading: "Загрузка статей...",
                empty: "Статей пока нет."
            },
            en: {
                title: "Physics & Astrophysics",
                desc: "Collection of theoretical articles, formulas, and interactive 3D simulations",
                loading: "Loading articles...",
                empty: "No articles published yet."
            }
        };

        let currentLang = localStorage.getItem("app_lang") || "ky";

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem("app_lang", lang);
            document.getElementById('langSelector').value = lang;

            const t = translations[lang];
            document.getElementById('i18n_title').innerHTML = `<i class="fa-solid fa-user-astronaut"></i> ${t.title}`;
            document.getElementById('i18n_desc').innerText = t.desc;

            loadPublicArticles();
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
            authDomain: "bilimal-org.firebaseapp.com",
            databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bilimal-org",
            storageBucket: "bilimal-org.firebasestorage.app",
            messagingSenderId: "241750360816",
            appId: "1:241750360816:web:a991434eb5afbc470d7835",
            measurementId: "G-9GSQV60QV0"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const auth = firebase.auth();

        function ensureAuth() {
            return new Promise((resolve, reject) => {
                if (auth.currentUser) {
                    resolve(auth.currentUser);
                } else {
                    auth.signInAnonymously().then(res => resolve(res.user)).catch(reject);
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            changeLanguage(currentLang);
        });

        function loadPublicArticles() {
            const feed = document.getElementById('articlesFeed');
            const t = translations[currentLang];

            ensureAuth().then(() => {
                db.ref('library/astrophysics').on('value', snapshot => {
                    feed.innerHTML = '';
                    if (!snapshot.exists()) {
                        feed.innerHTML = `<div class="empty-state">${t.empty}</div>`;
                        return;
                    }

                    snapshot.forEach(child => {
                        const data = child.val();
                        const card = document.createElement('div');
                        card.className = 'article-card';

                        let mediaHtml = '';
                        if (data.imageUrl) {
                            mediaHtml += `<img src="${data.imageUrl}" class="article-img" alt="${data.title}" onerror="this.style.display='none'">`;
                        }

                        if (data.model3DUrl) {
                            mediaHtml += `
                                <div class="iframe-container">
                                    <iframe src="${data.model3DUrl}" allowfullscreen></iframe>
                                </div>
                            `;
                        }

                        let formulaHtml = '';
                        if (data.formula) {
                            formulaHtml = `<div class="formula-box">${data.formula}</div>`;
                        }

                        card.innerHTML = `
                            <h2 class="article-title">${data.title}</h2>
                            <div class="article-meta">
                                <span><i class="fa-solid fa-folder"></i> ${data.category || 'Астрофизика'}</span>
                                <span><i class="fa-solid fa-calendar"></i> ${new Date(data.createdAt).toLocaleDateString()}</span>
                            </div>
                            ${mediaHtml}
                            ${formulaHtml}
                            <div class="article-body">${data.content}</div>
                        `;

                        feed.appendChild(card);
                    });

                    if (window.MathJax) {
                        MathJax.typesetPromise([feed]).catch(err => console.log(err));
                    }
                });
            }).catch(err => {
                feed.innerHTML = `<div class="empty-state">Ката чыкты: ${err.message}</div>`;
            });
        }
    </script>
</body>
</html>
