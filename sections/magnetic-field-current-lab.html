<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магнит талаасынын токко таасири — Виртуалдык Лаборатория</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .container { width: 100%; max-width: 1200px; }
    
    .header-nav {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
      background: #111827; padding: 15px 25px; border-radius: 14px; border: 1px solid #1f2937;
    }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
    .back-btn:hover { color: #ffffff; }
    h1 { font-size: 1.15rem; color: #facc15; text-align: center; }

    .lab-grid { display: grid; grid-template-columns: 1fr 420px; gap: 20px; }
    @media (max-width: 950px) { .lab-grid { grid-template-columns: 1fr; } }

    .canvas-container {
      background: #111827; border: 2px solid #374151; border-radius: 16px; padding: 20px;
      display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    canvas { background: #030712; border-radius: 12px; border: 1px solid #1f2937; width: 100%; max-width: 700px; height: 360px; }
    .canvas-caption { margin-top: 12px; font-size: 0.85rem; color: #94a3b8; text-align: center; line-height: 1.4; }

    .control-panel {
      background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 20px;
      display: flex; flex-direction: column; gap: 14px; max-height: 750px; overflow-y: auto;
    }
    .control-group { display: flex; flex-direction: column; gap: 4px; }
    .control-group label { font-size: 0.82rem; font-weight: 600; color: #38bdf8; display: flex; justify-content: space-between; }
    .control-group span { color: #facc15; }
    input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .action-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; padding: 10px;
      border-radius: 10px; font-weight: 600; font-size: 0.82rem; cursor: pointer; transition: 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .action-btn:hover { box-shadow: 0 0 15px rgba(37, 99, 235, 0.5); transform: translateY(-2px); }
    .action-btn.secondary { background: #374151; }
    .action-btn.secondary:hover { background: #4b5563; }
    .action-btn.success { background: linear-gradient(135deg, #16a34a, #15803d); grid-column: span 2; }

    .measurements { background: #030712; border: 1px solid #1f2937; border-radius: 10px; padding: 10px; font-family: monospace; font-size: 0.8rem; color: #4ade80; }
    
    .table-container { margin-top: 5px; max-height: 130px; overflow-y: auto; border: 1px solid #1f2937; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.72rem; text-align: center; }
    th, td { border: 1px solid #1f2937; padding: 5px; color: #cbd5e1; }
    th { background: #1e293b; color: #38bdf8; position: sticky; top: 0; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-nav">
      <a href="electrodynamics-labs.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Тизмеге кайтуу</a>
      <h1>Магнит талаасынын токко таасири — Лаборатория</h1>
      <div style="width: 120px;"></div>
    </div>

    <div class="lab-grid">
      <div class="canvas-container">
        <canvas id="labCanvas" width="700" height="360"></canvas>
        <div class="canvas-caption">
          <strong>Виртуалдык Симулятор:</strong> Ток (I), индукция (B), узундук (L) жана бурчту (альфа) жөнгө салып Ампер күчүн (F) изилдеңиз.
        </div>
      </div>

      <div class="control-panel">
        <div class="control-group">
          <label>Ток күчү (I): <span id="currentVal">2.0 A</span></label>
          <input type="range" id="currentRange" min="-5" max="5" step="0.5" value="2">
        </div>

        <div class="control-group">
          <label>Магнит индукциясы (B): <span id="inductionVal">1.5 Tl</span></label>
          <input type="range" id="inductionRange" min="0.5" max="3" step="0.5" value="1.5">
        </div>

        <div class="control-group">
          <label>Проводниктин узундугу (L): <span id="lengthVal">0.20 m</span></label>
          <input type="range" id="lengthRange" min="0.05" max="0.5" step="0.05" value="0.2">
        </div>

        <div class="control-group">
          <label>Талаа менен бурч (альфа): <span id="angleVal">90°</span></label>
          <input type="range" id="angleRange" min="10" max="90" step="10" value="90">
        </div>

        <div class="btn-row">
          <button class="action-btn" onclick="toggleSwitch()"><i class="fa-solid fa-power-off"></i> Тизгин</button>
          <button class="action-btn secondary" onclick="resetLab()"><i class="fa-solid fa-rotate-right"></i> Тазалоо</button>
          <button class="action-btn success" onclick="logData()"><i class="fa-solid fa-clipboard-check"></i> Маалыматты таблицага жазуу</button>
        </div>

        <div class="measurements" id="outputStats">
          > Эсептелген Ампер күчү (F): 0.60 Н<br>
          > Кыймыл статусу: Сыртка / Өйдө
        </div>

        <div class="table-container">
          <table id="logTable">
            <thead>
              <tr>
                <th>№</th>
                <th>I(A)</th>
                <th>B(Tl)</th>
                <th>L(m)</th>
                <th>альфа</th>
                <th>F(N)</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('labCanvas');
    const ctx = canvas.getContext('2d');

    const currentRange = document.getElementById('currentRange');
    const inductionRange = document.getElementById('inductionRange');
    const lengthRange = document.getElementById('lengthRange');
    const angleRange = document.getElementById('angleRange');

    const currentVal = document.getElementById('currentVal');
    const inductionVal = document.getElementById('inductionVal');
    const lengthVal = document.getElementById('lengthVal');
    const angleVal = document.getElementById('angleVal');
    const outputStats = document.getElementById('outputStats');
    const logTableBody = document.querySelector('#logTable tbody');

    let isPowerOn = true;
    let wireOffset = 0;
    let experimentCount = 0;

    function toggleSwitch() { isPowerOn = !isPowerOn; }
    function resetLab() {
      currentRange.value = 2;
      inductionRange.value = 1.5;
      lengthRange.value = 0.2;
      angleRange.value = 90;
      isPowerOn = true;
      wireOffset = 0;
    }

    function logData() {
      experimentCount++;
      const I = parseFloat(currentRange.value);
      const B = parseFloat(inductionRange.value);
      const L = parseFloat(lengthRange.value);
      const alpha = parseFloat(angleRange.value);
      const F = Math.abs(I * L * B * Math.sin(alpha * Math.PI / 180));

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${experimentCount}</td>
        <td>${I.toFixed(1)}</td>
        <td>${B.toFixed(1)}</td>
        <td>${L.toFixed(2)}</td>
        <td>${alpha}°</td>
        <td><b>${F.toFixed(2)}</b></td>
      `;
      logTableBody.appendChild(row);
    }

    function updateSimulation() {
      const I = parseFloat(currentRange.value);
      const B = parseFloat(inductionRange.value);
      const L = parseFloat(lengthRange.value);
      const alpha = parseFloat(angleRange.value);
      
      const rad = alpha * Math.PI / 180;
      const F = Math.abs(I * L * B * Math.sin(rad));

      currentVal.innerText = I.toFixed(1) + " A";
      inductionVal.innerText = B.toFixed(1) + " Tl";
      lengthVal.innerText = L.toFixed(2) + " m";
      angleVal.innerText = alpha + "°";

      let statusText = "Тынч абалда";
      if (!isPowerOn || I === 0) {
        statusText = "Ток жок (Күч = 0)";
        wireOffset = 0;
      } else {
        let targetOffset = (I > 0 ? -1 : 1) * F * 30;
        wireOffset += (targetOffset - wireOffset) * 0.1;
        statusText = I > 0 ? "Сыртка / Өйдө кыймылда" : "Ичкери карай кыймылда";
      }

      outputStats.innerHTML = `
        > Эсептелген Ампер күчү (F): ${F.toFixed(2)} Н<br>
        > Кыймыл статусу: ${statusText}
      `;
    }

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Магнит полюстары
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(80, 70, 120, 240);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px Poppins';
      ctx.fillText('N', 130, 195);

      ctx.fillStyle = '#3b82f6';
      ctx.fillRect(500, 70, 120, 240);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('S', 550, 195);

      // Магнит сызыктары
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      for (let y = 110; y <= 270; y += 40) {
        ctx.beginPath();
        ctx.moveTo(200, y);
        ctx.lineTo(500, y);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // Схема тизгини
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(265, 20, 170, 32);
      ctx.fillStyle = '#facc15';
      ctx.font = '11px Poppins';
      ctx.fillText(isPowerOn ? "Тизгин: КОШУЛДУ" : "Тизгин: ӨЧҮРҮЛДҮ", 290, 41);

      // Проводник
      let wireY = 190 + wireOffset;
      let L = parseFloat(lengthRange.value);
      let wireWidth = 120 + (L * 150);

      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(350 - wireWidth/2, 55);
      ctx.lineTo(350 - wireWidth/2, wireY);
      ctx.moveTo(350 + wireWidth/2, 55);
      ctx.lineTo(350 + wireWidth/2, wireY);
      ctx.stroke();

      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.roundRect(350 - wireWidth/2 - 15, wireY - 8, wireWidth + 30, 16, 8);
      ctx.fill();

      let currentI = parseFloat(currentRange.value);
      if (isPowerOn && currentI !== 0) {
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 12px Poppins';
        let symbol = currentI > 0 ? "О Ток" : "Х Ток";
        ctx.fillText(symbol, 340, wireY + 4);
      }

      // Ампер күчүнүн векторы
      if (isPowerOn && currentI !== 0) {
        ctx.strokeStyle = '#22c55e';
        ctx.fillStyle = '#22c55e';
        ctx.lineWidth = 3;
        let arrowY = wireY + (currentI > 0 ? -45 : 45);
        
        ctx.beginPath();
        ctx.moveTo(350, wireY);
        ctx.lineTo(350, arrowY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(350, arrowY);
        ctx.lineTo(345, arrowY + (currentI > 0 ? 10 : -10));
        ctx.lineTo(355, arrowY + (currentI > 0 ? 10 : -10));
        ctx.closePath();
        ctx.fill();

        ctx.font = 'bold 12px Poppins';
        ctx.fillText("F (Ампер күчү)", 370, arrowY + 5);
      }
    }

    function loop() {
      updateSimulation();
      drawScene();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
