<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Конструктору — BiliMal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- MathJax 3 (Формулаларды тестте кооз көрсөтүү үчүн) -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- MathLive Visual Formula Editor (Word сыяктуу графикалык редактор) -->
    <link rel="stylesheet" href="https://unpkg.com/mathlive/dist/mathlive-static.css" />
    <script src="https://unpkg.com/mathlive"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#03030d; color:#fff; padding:20px 4%; min-height:100vh; }
        .builder-card { background:rgba(15,23,42,0.8); border:1px solid rgba(0,240,255,0.2); border-radius:12px; padding:25px; max-width:900px; margin:0 auto; backdrop-filter: blur(10px); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .back-link { color: #00f0ff; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .back-link:hover { color: #fff; text-shadow: 0 0 10px #00f0ff; }
        
        h2 { color:#00f0ff; text-align:center; font-size: 1.5rem; }
        .edit-badge { background: rgba(255, 0, 255, 0.2); border: 1px solid #ff00ff; color: #ff00ff; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; display: none; margin-left: 10px; }
        
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px; margin-top: 20px; }
        .form-group { display:flex; flex-direction:column; gap:5px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size:0.85rem; color:#a5b4fc; font-weight: 600; }
        input, select, textarea { background:#020208; border:1px solid rgba(0,240,255,0.3); color:#fff; padding:10px 14px; border-radius:6px; outline:none; font-size:0.95rem; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { border-color:#00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.2); }
        
        .q-box { background:rgba(2,2,8,0.6); border:1px dashed rgba(0,240,255,0.3); border-radius:8px; padding:20px; margin-bottom:20px; position:relative; }
        
        .btn { background:linear-gradient(45deg, #00f0ff, #0077ff); color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:700; transition:0.3s; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
        .btn:hover { box-shadow:0 0 15px rgba(0,240,255,0.5); transform: translateY(-2px); }
        .btn-sm { padding: 8px 14px; font-size: 0.85rem; }
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
        .btn-secondary:hover { background: rgba(0,240,255,0.2); border-color: #00f0ff; }
        
        .symbol-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
        .symbol-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(0,240,255,0.3); color: #00f0ff; padding: 5px 10px; border-radius: 4px; font-size: 0.82rem; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
        .symbol-btn:hover { background: #00f0ff; color: #000; box-shadow: 0 0 8px rgba(0,240,255,0.4); }
        .symbol-btn.pro-btn { background: linear-gradient(45deg, #7928ca, #ff0080); color: #fff; border: none; font-weight: bold; }
        .symbol-btn.pro-btn:hover { box-shadow: 0 0 12px rgba(255,0,128,0.6); }

        /* Formula Modal Style */
        .fe-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 10000; padding: 15px; }
        .fe-modal { background: #0b0f19; border: 1px solid #00f0ff; border-radius: 12px; width: 100%; max-width: 750px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 30px rgba(0, 240, 255, 0.25); color: #fff; }
        .fe-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #030712; border-bottom: 1px solid rgba(0, 240, 255, 0.2); }
        .fe-header h3 { color: #00f0ff; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .fe-close-btn { background: transparent; border: none; color: #a5b4fc; font-size: 1.4rem; cursor: pointer; }
        .fe-body { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        /* MathLive Visual Field Style */
        math-field { font-size: 1.4rem; padding: 12px; background: #02040a; border: 1px solid #00f0ff; border-radius: 8px; color: #fff; width: 100%; outline: none; }
        
        .quick-templates { display: flex; flex-wrap: wrap; gap: 8px; }
        .template-chip { background: rgba(255,255,255,0.06); border: 1px solid rgba(0,240,255,0.3); color: #00f0ff; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
        .template-chip:hover { background: #00f0ff; color: #000; }
        
        .fe-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; background: #030712; border-top: 1px solid rgba(0, 240, 255, 0.2); }
    </style>
</head>
<body>
    <div class="builder-card">
        <div class="top-bar">
            <a href="tests.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Башкаруу панелине кайтуу</a>
            <div>
                <span id="editBadge" class="edit-badge"><i class="fa-solid fa-pen-to-square"></i> Оңдоо режими</span>
            </div>
        </div>

        <h2>📝 Тест Конструктору</h2>

        <form id="builderForm">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Тесттин аталышы</label>
                    <input type="text" id="testTitle" required placeholder="Мисалы: Электр динамикасы жана Омдун мыйзамы">
                </div>
                <div class="form-group">
                    <label>Предмет</label>
                    <input type="text" id="testSubject" required placeholder="Физика">
                </div>
                <div class="form-group">
                    <label>Класс</label>
                    <input type="text" id="testGrade" required placeholder="8">
                </div>
                <div class="form-group">
                    <label>Тема (милдеттүү эмес)</label>
                    <input type="text" id="testTopic" placeholder="Ток күчү жана чыңалуу">
                </div>
                <div class="form-group">
                    <label>Убакыт (Мүнөт менен)</label>
                    <input type="number" id="testDuration" value="15" min="1" required>
                </div>
            </div>

            <hr style="border-color:rgba(255,255,255,0.1); margin:25px 0;">

            <div id="questionsContainer"></div>

            <div style="display:flex; justify-content:space-between; margin-top:25px; flex-wrap: wrap; gap: 15px;">
                <button type="button" class="btn btn-secondary" id="addQuestionBtn"><i class="fa-solid fa-plus"></i> Суроо кошуу</button>
                <button type="submit" class="btn" id="submitBtn"><i class="fa-solid fa-paper-plane"></i> Сактоо жана Жарыялоо 🚀</button>
            </div>
        </form>
    </div>

    <!-- MathLive Visual Editor Modal -->
    <div id="formulaModal" class="fe-modal-overlay">
        <div class="fe-modal">
            <div class="fe-header">
                <h3><i class="fa-solid fa-square-root-variable"></i> Визуалдык Формула Редактору</h3>
                <button type="button" class="fe-close-btn" onclick="closeFormulaModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="fe-body">
                <p style="font-size: 0.85rem; color: #a5b4fc;">Төмөндөгү талаага териңиз же экрандагы клавиатураны колдонуңуз:</p>
                
                <!-- MathLive Visual Element -->
                <math-field id="mfInput"></math-field>

                <label style="font-size:0.8rem; color:#a5b4fc; margin-top:5px;">Даяр физика/математика шаблондору:</label>
                <div class="quick-templates">
                    <button type="button" class="template-chip" onclick="insertTemplate('\\frac{a}{b}')">Бөлчөк (a/b)</button>
                    <button type="button" class="template-chip" onclick="insertTemplate('x^{2}')">Даража (x²)</button>
                    <button type="button" class="template-chip" onclick="insertTemplate('x_{0}')">Индекс (x₀)</button>
                    <button type="button" class="template-chip" onclick="insertTemplate('\\sqrt{x}')">Тамыр (√x)</button>
                    <button type="button" class="template-chip" onclick="insertTemplate('\\int_{a}^{b}')">Интеграл (∫)</button>
                    <button type="button" class="template-chip" onclick="insertTemplate('\\vec{v}')">Вектор (v⃗)</button>
                    <button type="button" class="template-chip" onclick="insertTemplate('E=mc^2')">E=mc²</button>
                    <button type="button" class="template-chip" onclick="insertTemplate('I=\\frac{U}{R}')">I=U/R</button>
                </div>
            </div>

            <div class="fe-footer">
                <button type="button" class="btn btn-secondary btn-sm" onclick="closeFormulaModal()">Баш тартуу</button>
                <button type="button" class="btn btn-sm" onclick="applyFormula()"><i class="fa-solid fa-check"></i> Текстке Кошуу</button>
            </div>
        </div>
    </div>

    <!-- Main Logic -->
    <script type="module" src="../js/test-builder.js"></script>

    <!-- Formula Engine Logic -->
    <script>
        let currentActiveInput = null;

        // Символду же формуланы түздөн-түз активдүү инпутка киргизүү
        window.insertSymbol = function(btn, symbol) {
            const container = btn.closest('.q-box') || btn.closest('.form-group') || document;
            const input = container.querySelector('textarea, input[type="text"]');
            if (input) {
                const start = input.selectionStart || input.value.length;
                const end = input.selectionEnd || input.value.length;
                input.value = input.value.substring(0, start) + symbol + input.value.substring(end);
                input.focus();
                input.selectionStart = input.selectionEnd = start + symbol.length;
            }
        };

        // Визуалдык редакторду ачуу
        window.openFormulaModal = function(btn) {
            const container = btn.closest('.q-box') || btn.closest('.form-group') || btn.parentElement;
            currentActiveInput = container.querySelector('textarea, input[type="text"]');
            
            const modal = document.getElementById('formulaModal');
            const mf = document.getElementById('mfInput');
            
            mf.setValue('');
            modal.style.display = 'flex';
            setTimeout(() => mf.focus(), 100);
        };

        window.closeFormulaModal = function() {
            document.getElementById('formulaModal').style.display = 'none';
        };

        window.insertTemplate = function(latex) {
            const mf = document.getElementById('mfInput');
            mf.insert(latex);
            mf.focus();
        };

        window.applyFormula = function() {
            const mf = document.getElementById('mfInput');
            const latex = mf.getValue('latex');
            
            if (latex && currentActiveInput) {
                const formatted = ` $${latex}$ `;
                const start = currentActiveInput.selectionStart || currentActiveInput.value.length;
                const end = currentActiveInput.selectionEnd || currentActiveInput.value.length;
                
                currentActiveInput.value = currentActiveInput.value.substring(0, start) + formatted + currentActiveInput.value.substring(end);
                currentActiveInput.focus();
            }
            closeFormulaModal();
        };
    </script>
</body>
</html>
