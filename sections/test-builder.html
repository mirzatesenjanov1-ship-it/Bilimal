<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Түзүүчү | Bilimal.org</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bilimal/sections каталогунан Bilimal/css/style.css файлын туура туташтыруу -->
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .builder-container {
            max-width: 1050px;
            margin: 20px auto;
            padding: 24px;
            background: #0f172a;
            color: #f8fafc;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .q-box {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 24px;
            position: relative;
        }
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .symbol-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .symbol-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid #475569;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            user-select: none;
        }
        .symbol-btn:hover {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
        }
        .symbol-btn:active {
            transform: scale(0.95);
        }
        .formula-preview {
            background: #090d16;
            padding: 10px 14px;
            border-radius: 6px;
            margin-top: 8px;
            min-height: 38px;
            color: #e2e8f0;
            border-left: 4px solid #38bdf8;
            font-size: 15px;
            overflow-x: auto;
        }
        .opt-item-wrapper, .match-pair-wrapper {
            margin-bottom: 12px;
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #1e293b;
        }
        .opt-item, .match-pair {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        input[type="text"], input[type="number"], input[type="url"], textarea, select {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }
        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-primary { background: #0284c7; color: #fff; }
        .btn-primary:hover { background: #0369a1; }
        .btn-secondary { background: #475569; color: #fff; }
        .btn-secondary:hover { background: #334155; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .badge {
            background: #0284c7;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
        }
    </style>
    <!-- MathJax CDN Интеграциясы -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="builder-container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <h2><i class="fa-solid fa-vial-circle-check" style="color:#38bdf8;"></i> Тест Түзүүчү Конструктор <span id="editBadge" style="display:none;" class="badge">Оңдоо режими</span></h2>
        </div>
        
        <form id="builderForm">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px;">
                <div>
                    <label style="display:block; margin-bottom:6px; font-weight:500;">Тесттин аталышы:</label>
                    <input type="text" id="testTitle" required placeholder="Мисалы: Физика 9-класс Денелердин сүзүүсү">
                </div>
                <div>
                    <label style="display:block; margin-bottom:6px; font-weight:500;">Предмет:</label>
                    <input type="text" id="testSubject" required placeholder="Мисалы: Физика">
                </div>
                <div>
                    <label style="display:block; margin-bottom:6px; font-weight:500;">Класс:</label>
                    <input type="text" id="testGrade" placeholder="Мисалы: 9-класс">
                </div>
                <div>
                    <label style="display:block; margin-bottom:6px; font-weight:500;">Тема:</label>
                    <input type="text" id="testTopic" placeholder="Суюктуктардагы басым">
                </div>
                <div>
                    <label style="display:block; margin-bottom:6px; font-weight:500;">Убакыт (мүнөт):</label>
                    <input type="number" id="testDuration" value="20" min="5" max="180">
                </div>
            </div>

            <hr style="border-color: #334155; margin: 24px 0;">

            <h3 style="margin-bottom: 16px; color:#38bdf8;"><i class="fa-solid fa-list-check"></i> Суроолор тизмеси</h3>
            <div id="questionsContainer"></div>

            <div style="margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap;">
                <button type="button" id="addQuestionBtn" class="btn btn-secondary"><i class="fa-solid fa-plus"></i> Суроо кошуу</button>
                <button type="submit" id="submitBtn" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Сактоо жана Жарыялоо 🚀</button>
            </div>
        </form>
    </div>

    <!-- Bilimal/sections/test-builder.html файлынан Bilimal/js/test-builder.js файлын туура чакыруу -->
    <script type="module" src="../js/test-builder.js"></script>
</body>
</html>
