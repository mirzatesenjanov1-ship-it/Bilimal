<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Конструктору — BiliMal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- MathJax 3 Engine -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#03030d; color:#fff; padding:20px 4%; min-height:100vh; }
        .builder-card { background:rgba(15,23,42,0.8); border:1px solid rgba(0,240,255,0.2); border-radius:12px; padding:25px; max-width:950px; margin:0 auto; backdrop-filter: blur(10px); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .back-link { color: #00f0ff; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .back-link:hover { color: #fff; text-shadow: 0 0 10px #00f0ff; }
        
        h2 { color:#00f0ff; text-align:center; font-size: 1.5rem; }
        .edit-badge { background: rgba(255, 0, 255, 0.2); border: 1px solid #ff00ff; color: #ff00ff; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; display: none; margin-left: 10px; }
        
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px; margin-top: 20px; }
        .form-group { display:flex; flex-direction:column; gap:5px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size:0.85rem; color:#a5b4fc; font-weight: 600; }
        input, select, textarea { background:#020208; border:1px solid rgba(0,240,255,0.3); color:#fff; padding:10px 14px; border-radius:6px; outline:none; font-size:0.95rem; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { border-color:#00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.2); }
        
        .q-box { background:rgba(2,2,8,0.6); border:1px dashed rgba(0,240,255,0.3); border-radius:8px; padding:20px; margin-bottom:20px; position:relative; }
        
        .btn { background:linear-gradient(45deg, #00f0ff, #0077ff); color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:700; transition:0.3s; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
        .btn:hover { box-shadow:0 0 15px rgba(0,240,255,0.5); transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
        .btn-secondary:hover { background: rgba(0,240,255,0.2); border-color: #00f0ff; }
        
        /* Горизонталынан сыдырылма (Scrollable Toolbar) */
        .symbol-toolbar-scroll { 
            display: flex; 
            gap: 6px; 
            overflow-x: auto; 
            white-space: nowrap; 
            padding: 8px 4px 12px 4px; 
            margin-bottom: 10px;
            scroll-behavior: smooth;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
        }
        
        /* Scrollbar Стилин Көрктөө */
        .symbol-toolbar-scroll::-webkit-scrollbar { height: 6px; }
        .symbol-toolbar-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); border-radius: 3px; }
        .symbol-toolbar-scroll::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.3); border-radius: 3px; }
        .symbol-toolbar-scroll::-webkit-scrollbar-thumb:hover { background: #00f0ff; }

        .tpl-btn { 
            background: rgba(15, 23, 42, 0.9); 
            border: 1px solid rgba(0, 240, 255, 0.3); 
            color: #00f0ff; 
            padding: 6px 12px; 
            border-radius: 6px; 
            font-size: 0.9rem; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            flex-shrink: 0;
            user-select: none;
        }
        .tpl-btn:hover { 
            background: #00f0ff; 
            color: #000; 
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5); 
            transform: translateY(-1px);
        }
        
        .tpl-btn .box-icon {
            display: inline-block;
            border: 1px dashed currentColor;
            width: 11px;
            height: 11px;
            margin: 0 2px;
            vertical-align: middle;
            border-radius: 1px;
        }

        /* WYSIWYG Текст талаасы */
        .input-wrapper { position: relative; width: 100%; margin-bottom: 12px; }
        .math-live-preview { min-height: 48px; padding: 10px 14px; background: #02040a; border: 1px solid rgba(0,240,255,0.4); border-radius: 6px; color: #fff; cursor: text; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 1rem; }
        .math-live-preview:hover { border-color: #00f0ff; }
        .raw-input { width: 100%; min-height: 48px; background: #020208; border: 1px solid #00f0ff; color: #00f0ff; font-family: 'Consolas', monospace; padding: 10px; border-radius: 6px; resize: vertical; display: none; }
    </style>
</head>
<body>
    <div class="builder-card">
        <div class="top-bar">
            <a href="tests.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Башкаруу панелине кайтуу</a>
            <div>
                <span id="editBadge" class="edit-badge"><i class="fa-solid fa-pen-to-square"></i> Оңдоо режими</span>
            </div>
        </div>

        <h2>📝 Тест Конструктору</h2>

        <form id="builderForm">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Тесттин аталышы</label>
                    <input type="text" id="testTitle" required placeholder="Мисалы: Электр динамикасы жана Омдун мыйзамы">
                </div>
                <div class="form-group">
                    <label>Предмет</label>
                    <input type="text" id="testSubject" required placeholder="Физика">
                </div>
                <div class="form-group">
                    <label>Класс</label>
                    <input type="text" id="testGrade" required placeholder="8">
                </div>
                <div class="form-group">
                    <label>Тема (милдеттүү эмес)</label>
                    <input type="text" id="testTopic" placeholder="Ток күчү жана чыңалуу">
                </div>
                <div class="form-group">
                    <label>Убакыт (Мүнөт менен)</label>
                    <input type="number" id="testDuration" value="15" min="1" required>
                </div>
            </div>

            <hr style="border-color:rgba(255,255,255,0.1); margin:25px 0;">

            <div id="questionsContainer"></div>

            <div style="display:flex; justify-content:space-between; margin-top:25px; flex-wrap: wrap; gap: 15px;">
                <button type="button" class="btn btn-secondary" id="addQuestionBtn"><i class="fa-solid fa-plus"></i> Суроо кошуу</button>
                <button type="submit" class="btn" id="submitBtn"><i class="fa-solid fa-paper-plane"></i> Сактоо жана Жарыялоо 🚀</button>
            </div>
        </form>
    </div>

    <!-- Main JS Bundle Logic -->
    <script type="module" src="../js/test-builder.js"></script>

    <!-- Visual Template Injector Engine -->
    <script>
        // БАРДЫК ДАЯР ЯЧЕЙКАЛЫК ШАБЛОНДОР МЕНЕН СИМВОЛДОР
        const TEMPLATES = [
            // Бөлчөктөр (1-сүрөт)
            { label: '<span class="box-icon"></span>/<span class="box-icon"></span>', code: '\\frac{?}{?}', cursorOffset: 6 },
            { label: '<span class="box-icon"></span>/%', code: '\\frac{?}{\\%}', cursorOffset: 6 },
            
            // Даража жана индекстер (2-сүрөт)
            { label: '<span class="box-icon"></span><sup><span class="box-icon"></span></sup>', code: '^{?}', cursorOffset: 2 },
            { label: '<span class="box-icon"></span><sub><span class="box-icon"></span></sub>', code: '_{?}', cursorOffset: 2 },
            { label: '<span class="box-icon"></span><sup><span class="box-icon"></span></sup><sub><span class="box-icon"></span></sub>', code: '_{?}^{?}', cursorOffset: 2 },

            // Тамырлар (3-сүрөт)
            { label: '√<span class="box-icon"></span>', code: '\\sqrt{?}', cursorOffset: 6 },
            { label: '<sup><span class="box-icon"></span></sup>√<span class="box-icon"></span>', code: '\\sqrt[?]{?}', cursorOffset: 6 },
            { label: '<sup>2</sup>√<span class="box-icon"></span>', code: '\\sqrt[2]{?}', cursorOffset: 7 },
            { label: '<sup>3</sup>√<span class="box-icon"></span>', code: '\\sqrt[3]{?}', cursorOffset: 7 },

            // Тригонометрия (4-сүрөт)
            { label: 'sin <span class="box-icon"></span>', code: '\\sin(? )', cursorOffset: 5 },
            { label: 'cos <span class="box-icon"></span>', code: '\\cos(? )', cursorOffset: 5 },
            { label: 'tan <span class="box-icon"></span>', code: '\\tan(? )', cursorOffset: 5 },
            { label: 'cot <span class="box-icon"></span>', code: '\\cot(? )', cursorOffset: 5 },
            { label: 'sec <span class="box-icon"></span>', code: '\\sec(? )', cursorOffset: 5 },
            { label: 'csc <span class="box-icon"></span>', code: '\\csc(? )', cursorOffset: 5 },

            // Физикалык & Математикалык Символдор
            { label: 'α', code: '\\alpha', cursorOffset: 6 },
            { label: 'β', code: '\\beta', cursorOffset: 5 },
            { label: 'Ω', code: '\\Omega', cursorOffset: 6 },
            { label: 'λ', code: '\\lambda', cursorOffset: 7 },
            { label: '℃', code: '^\\circ C', cursorOffset: 8 },
            { label: 'v⃗', code: '\\vec{v}', cursorOffset: 7 },
            { label: '∫', code: '\\int_{?}^{?}', cursorOffset: 5 },
            { label: '∑', code: '\\sum_{?}^{?}', cursorOffset: 5 },
            { label: 'Δ', code: '\\Delta', cursorOffset: 6 },
            { label: '∞', code: '\\infty', cursorOffset: 6 },
            { label: '≈', code: '\\approx', cursorOffset: 7 },
            { label: '±', code: '\\pm', cursorOffset: 3 }
        ];

        // Суроонун же варианттын үстүнө горизонталынан сыдырылма панелди динамикалык түзүү
        window.createScrollableToolbar = function(targetInput) {
            const toolbar = document.createElement('div');
            toolbar.className = 'symbol-toolbar-scroll';

            TEMPLATES.forEach(tpl => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tpl-btn';
                btn.innerHTML = tpl.label;
                btn.title = 'Шаблонду киргизүү';
                
                // Чыкылдатканда курсор турган жерге шаблон кошуу
                btn.onmousedown = (e) => {
                    e.preventDefault(); // Инпуттан фокусту жоготпош үчүн
                    insertTemplateAtCursor(targetInput, tpl.code, tpl.cursorOffset);
                };
                toolbar.appendChild(btn);
            });

            return toolbar;
        };

        // Текстке ошол замат курсор токтогон жерге шаблон түшүрүү
        function insertTemplateAtCursor(input, code, cursorOffset) {
            const start = input.selectionStart || input.value.length;
            const end = input.selectionEnd || input.value.length;
            const val = input.value;

            // Формула $ белгисинин ичинде болушун текшерүү же кошуу
            let textToInsert = code;
            
            input.value = val.substring(0, start) + textToInsert + val.substring(end);
            
            // Фокусту кайра киргизилген ячейканын (суроо белгиси токтогон жеринин) ичине тууралоо
            input.focus();
            const newCursorPos = start + (cursorOffset || textToInsert.length);
            input.setSelectionRange(newCursorPos, newCursorPos);

            // Резервдеги MathJax дисплейин жаңыртуу
            input.dispatchEvent(new Event('input', { bubbles: true }));
        }

        // Инпуттарды жана Суроо-Жооп Блокторун Интеграциялоо Функциясы
        window.setupQuestionMath = function(qBox) {
            const inputs = qBox.querySelectorAll('textarea, input[type="text"]');
            
            inputs.forEach(input => {
                if(input.dataset.toolbarAttached) return;
                input.dataset.toolbarAttached = "true";

                // Сыдырылма панелди инпуттун өйдө жагына кошуу
                const toolbar = window.createScrollableToolbar(input);
                input.parentNode.insertBefore(toolbar, input);

                // Инпуттун ичиндеги MathJax визуализациясы
                const wrapper = document.createElement('div');
                wrapper.className = 'input-wrapper';
                input.parentNode.insertBefore(wrapper, input);
                wrapper.appendChild(toolbar);
                wrapper.appendChild(input);
            });
        };
    </script>
</body>
</html>
