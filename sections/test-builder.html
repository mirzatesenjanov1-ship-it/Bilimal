<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Test Builder - Bilimal.</title>
    <link class="icon" href="data:,">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GSQV60QV0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-9GSQV60QV0');
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-color: #070b19;
            --surface-color: #111827;
            --surface-hover: #1f2937;
            --primary: #00f2fe;
            --primary-glow: rgba(0, 242, 254, 0.3);
            --success: #00e676;
            --success-glow: rgba(0, 230, 118, 0.3);
            --warning: #f59e0b;
            --danger: #ff4b4b;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --transition: all 0.3s ease;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Sidebar - Бирдиктүү стиль */
        .sidebar { width: 280px; padding: 30px 20px; height: 100vh; border-right: 1px solid var(--border-color); position: fixed; display: flex; flex-direction: column; box-sizing: border-box; z-index: 50; background: var(--bg-color); }
        .brand-logo { font-size: 28px; font-weight: 700; margin-bottom: 50px; display: flex; align-items: center; gap: 10px; text-shadow: 0 0 10px var(--primary-glow); }
        .brand-logo span { color: var(--primary); }
        .nav-menu { display: flex; flex-direction: column; gap: 12px; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 14px 20px; border-radius: 12px; text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 15px; transition: var(--transition); border: 1px solid transparent; }
        .nav-item i { font-size: 18px; width: 24px; text-align: center; }
        .nav-item:hover { background: var(--surface-color); color: var(--text-main); }
        .nav-item.active { background: linear-gradient(90deg, rgba(0, 242, 254, 0.1) 0%, transparent 100%); color: var(--primary); border-left: 3px solid var(--primary); border-radius: 0 12px 12px 0; box-shadow: inset 20px 0 20px -20px var(--primary-glow); }

        /* Main Content */
        .main-content { margin-left: 280px; width: calc(100% - 280px); box-sizing: border-box; }
        
        .sticky-toolbar { position: sticky; top: 0; background: rgba(7, 11, 25, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); padding: 20px 40px; z-index: 100; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .toolbar-actions { display: flex; gap: 12px; align-items: center; }
        .autosave-indicator { font-size: 14px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        
        .builder-layout { display: grid; grid-template-columns: 1fr 340px; gap: 30px; padding: 40px; }
        
        /* Карточкалар жана Формалар */
        .builder-card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; margin-bottom: 25px; transition: var(--transition); }
        .builder-card:hover { border-color: var(--primary); box-shadow: 0 5px 25px var(--primary-glow); }
        .builder-card h3 { font-size: 18px; color: var(--text-main); margin: 0 0 20px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        
        .editor-form-group { margin-bottom: 18px; }
        .editor-form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); }
        .form-control { width: 100%; padding: 12px 15px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px; outline: none; transition: var(--transition); box-sizing: border-box; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        
        /* Checkbox тууралоо */
        .editor-form-group label:has(input[type="checkbox"]) { display: flex; align-items: center; gap: 10px; color: var(--text-main); cursor: pointer; font-size: 14px; }
        input[type="checkbox"] { accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; }

        /* Баскычтар */
        .btn { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: var(--transition); text-decoration: none; }
        .btn-primary { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary-glow); }
        .btn-primary:hover { background: #4facfe; transform: translateY(-2px); }
        .btn-success { background: var(--success); color: #000; box-shadow: 0 0 15px var(--success-glow); }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }

        /* Суроолор */
        .questions-container { display: flex; flex-direction: column; gap: 20px; }
        .question-node { background: var(--surface-hover); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        
        /* Modal */
        .modal { background: var(--surface-color); border: 1px solid var(--primary); border-radius: 16px; padding: 30px; display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; width: 90%; max-width: 600px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .type-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .type-card { background: var(--bg-color); border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; cursor: pointer; transition: var(--transition); }
        .type-card:hover { background: rgba(0, 242, 254, 0.1); border-color: var(--primary); }
        .type-card h5 { color: var(--text-main); margin: 0 0 5px 0; font-size: 14px; }
        .type-card p { color: var(--text-muted); font-size: 12px; margin: 0; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand-logo">
            <i class="fas fa-atom" style="color: var(--primary);"></i> Bilimal<span>.</span>
        </div>
        <nav class="nav-menu">
            <a href="/sections/tests.html" class="nav-item"><i class="fas fa-chart-pie"></i> Башкаруу панели</a>
            <a href="/sections/test-builder.html" class="nav-item active"><i class="fas fa-sliders-h"></i> Smart Test Builder</a>
            <a href="/sections/test-results.html" class="nav-item"><i class="fas fa-graduation-cap"></i> Жыйынтыктар</a>
            <a href="/sections/students.html" class="nav-item"><i class="fas fa-users"></i> Окуучулар</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="sticky-toolbar">
            <div class="autosave-indicator" id="autosaveStatus">
                <i class="fas fa-check-circle" style="color: var(--success);"></i> <span>Сакталды</span>
            </div>
            <div class="toolbar-actions">
                <button class="btn btn-outline" id="btnBackToDashboard"><i class="fas fa-arrow-left"></i> Артка</button>
                <button class="btn btn-outline" id="btnPreviewTest"><i class="fas fa-eye"></i> Көрүү</button>
                <button class="btn btn-outline" id="btnExportTestJSON"><i class="fas fa-download"></i> Экспорт</button>
                <button class="btn btn-warning" id="btnSaveDraft">Черновик</button>
                <button class="btn btn-success" id="btnPublishTest">Жарыялоо</button>
                <button class="btn btn-primary" id="btnQuickAddQuestion"><i class="fas fa-plus"></i> Суроо кошуу</button>
            </div>
        </div>

        <div class="builder-layout">
            <div>
                <div class="builder-card">
                    <h3>Тесттин негизги маалыматтары</h3>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
                        <div class="editor-form-group" style="grid-column: span 2;">
                            <label>Тесттин аталышы</label>
                            <input type="text" id="txtTestTitle" class="form-control" placeholder="Маселен: Механиканын негиздери">
                        </div>
                        <div class="editor-form-group">
                            <label>Предмет</label>
                            <input type="text" id="selTestSubject" class="form-control" list="subjectSuggestions" placeholder="Тандаңыз же жазыңыз...">
                            <datalist id="subjectSuggestions">
                                <option value="Физика"></option>
                                <option value="Астрономия"></option>
                                <option value="Информатика"></option>
                            </datalist>
                        </div>
                        <div class="editor-form-group">
                            <label>Класс</label>
                            <input type="text" id="txtTestClass" class="form-control" placeholder="Маселен: 10-А">
                        </div>
                        <div class="editor-form-group">
                            <label>Тема</label>
                            <input type="text" id="txtTestTopic" class="form-control" placeholder="Маселен: Динамика">
                        </div>
                        <div class="editor-form-group">
                            <label>Окуу жылы</label>
                            <input type="text" id="txtAcademicYear" class="form-control" value="2026–2027-окуу жылы">
                        </div>
                        <div class="editor-form-group">
                            <label>Башталуу убактысы</label>
                            <input type="datetime-local" id="txtStartTime" class="form-control">
                        </div>
                        <div class="editor-form-group">
                            <label>Аяктоо убактысы</label>
                            <input type="datetime-local" id="txtEndTime" class="form-control">
                        </div>
                        <div class="editor-form-group">
                            <label>Убакыт (мүнөт)</label>
                            <input type="number" id="numDuration" class="form-control" value="45">
                        </div>
                        <div class="editor-form-group">
                            <label>Аракеттердин саны</label>
                            <select id="selAttempts" class="form-control">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="infinite">Чексиз</option>
                            </select>
                        </div>
                    </div>
                    <div class="editor-form-group" style="margin-top: 15px;">
                        <label>Сүрөттөмө / Нускама</label>
                        <textarea id="txtDescription" class="form-control" rows="3" placeholder="Окуучулар үчүн нускамалар..."></textarea>
                    </div>
                </div>

                <div class="questions-container" id="questionsListWrapper"></div>
            </div>

            <div>
                <div class="builder-card">
                    <h3>Баалоо системасы</h3>
                    <div class="editor-form-group">
                        <label>Тутум түрү</label>
                        <select id="selGradingSystem" class="form-control">
                            <option value="5">5 баллдык система</option>
                            <option value="10">10 баллдык система</option>
                            <option value="100">100 баллдык система</option>
                            <option value="percent">Процент (%) менен</option>
                            <option value="custom">Ар бир суроого өзүнчө упай</option>
                        </select>
                    </div>
                    <div class="editor-form-group">
                        <label>Өтүү балы</label>
                        <input type="number" id="numPassingScore" class="form-control" value="60">
                    </div>
                </div>

                <div class="builder-card">
                    <h3>Античит & Коопсуздук</h3>
                    <div class="editor-form-group"><label><input type="checkbox" id="chkShuffleQuestions"> Суроолорду аралаштыруу</label></div>
                    <div class="editor-form-group"><label><input type="checkbox" id="chkShuffleOptions"> Жоопторду аралаштыруу</label></div>
                    <div class="editor-form-group"><label><input type="checkbox" id="chkPreventCopy" checked> Көчүрүүгө бөгөт коюу</label></div>
                    <div class="editor-form-group"><label><input type="checkbox" id="chkPreventPaste" checked> Коюуга бөгөт коюу</label></div>
                    <div class="editor-form-group"><label><input type="checkbox" id="chkBlockRightClick" checked> Оң чыкылдатууну бөгөттөө</label></div>
                    <div class="editor-form-group"><label><input type="checkbox" id="chkWindowSwitchTrack" checked> Терезе алмаштырууну көзөмөлдөө</label></div>
                    <div class="editor-form-group"><label><input type="checkbox" id="chkRequireFullscreen"> Fullscreen талап кылуу</label></div>
                    <div class="editor-form-group"><label><input type="checkbox" id="chkInstantResults" checked> Натыйжаны дароо көрсөтүү</label></div>
                    <div class="editor-form-group"><label><input type="checkbox" id="chkShowCorrectAnswers"> Туура жоопту ачыктоо</label></div>
                    <div class="editor-form-group" style="margin-top: 15px;">
                        <label>Тест сырсөзү</label>
                        <input type="text" id="txtTestPassword" class="form-control" placeholder="Сырсөз жок">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal" id="qTypeModal">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="color: var(--primary); margin: 0;">Суроонун түрүн тандаңыз</h3>
            <button class="btn btn-outline" id="btnCloseTypeModal" style="padding: 8px 12px; border-color: transparent;"><i class="fas fa-times"></i></button>
        </div>
        <div class="type-grid" id="qTypeGrid"></div>
    </div>

    <input type="file" id="builderJsonFileInput" accept=".json" style="display:none;">
    <script type="module" src="/assets/js/test-builder.js"></script>
</body>
</html>
