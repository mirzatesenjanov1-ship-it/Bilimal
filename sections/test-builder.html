<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Конструктору — BiliMal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- MathJax: Физика жана Математика формулаларын рендерлөө үчүн -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#03030d; color:#fff; padding:30px 5%; min-height:100vh; }
        .builder-card { background:rgba(15,23,42,0.8); border:1px solid rgba(0,240,255,0.2); border-radius:12px; padding:25px; max-width:900px; margin:0 auto; backdrop-filter: blur(10px); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-link { color: #00f0ff; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .back-link:hover { color: #fff; text-shadow: 0 0 10px #00f0ff; }
        
        h2 { color:#00f0ff; text-align:center; }
        .edit-badge { background: rgba(255, 0, 255, 0.2); border: 1px solid #ff00ff; color: #ff00ff; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; display: none; margin-left: 10px; }
        
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px; margin-top: 20px; }
        .form-group { display:flex; flex-direction:column; gap:5px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size:0.85rem; color:#a5b4fc; font-weight: 600; }
        input, select, textarea { background:#020208; border:1px solid rgba(0,240,255,0.3); color:#fff; padding:10px 14px; border-radius:6px; outline:none; font-size:0.95rem; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { border-color:#00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.2); }
        
        .q-box { background:rgba(2,2,8,0.6); border:1px dashed rgba(0,240,255,0.3); border-radius:8px; padding:20px; margin-bottom:20px; position:relative; }
        .q-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        
        .btn { background:linear-gradient(45deg, #00f0ff, #0077ff); color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:700; transition:0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn:hover { box-shadow:0 0 15px rgba(0,240,255,0.5); transform: translateY(-2px); }
        .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:hover { background: rgba(0,240,255,0.2); border-color: #00f0ff; }
        .btn-danger { background: linear-gradient(45deg, #ff0055, #ff0000); }
        .btn-danger:hover { box-shadow:0 0 15px rgba(255,0,85,0.5); }
        
        .opt-list { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
        .opt-item { display:flex; align-items:center; gap:10px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; }
        .opt-item input[type="radio"], .opt-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #00f0ff; cursor: pointer; }
        .opt-item input[type="text"] { flex: 1; }
        .match-pair { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 10px; align-items: center; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; }
        
        .pisa-context { background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
        .img-preview { max-width: 100%; max-height: 180px; margin-top: 8px; border-radius: 6px; border: 1px solid rgba(0,240,255,0.3); display: none; }
        
        .symbol-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
        .symbol-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(0,240,255,0.3); color: #00f0ff; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
        .symbol-btn:hover { background: #00f0ff; color: #000; }
    </style>
</head>
<body>
    <div class="builder-card">
        <div class="top-bar">
            <a href="tests.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Башкаруу панелине кайтуу</a>
            <div>
                <span id="editBadge" class="edit-badge"><i class="fa-solid fa-pen-to-square"></i> Оңдоо режими</span>
            </div>
        </div>

        <h2>📝 Тест Конструктору</h2>

        <form id="builderForm">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Тесттин аталышы</label>
                    <input type="text" id="testTitle" required placeholder="Мисалы: Электр динамикасы жана Омдун мыйзамы">
                </div>
                <div class="form-group">
                    <label>Предмет</label>
                    <input type="text" id="testSubject" required placeholder="Физика">
                </div>
                <div class="form-group">
                    <label>Класс</label>
                    <input type="text" id="testGrade" required placeholder="8">
                </div>
                <div class="form-group">
                    <label>Тема (милдеттүү эмес)</label>
                    <input type="text" id="testTopic" placeholder="Тынчтык жана чыңалуу">
                </div>
                <div class="form-group">
                    <label>Убакыт (Мүнөт менен)</label>
                    <input type="number" id="testDuration" value="15" min="1" required>
                </div>
            </div>

            <hr style="border-color:rgba(255,255,255,0.1); margin:25px 0;">

            <div id="questionsContainer"></div>

            <div style="display:flex; justify-content:space-between; margin-top:25px; flex-wrap: wrap; gap: 15px;">
                <button type="button" class="btn btn-secondary" id="addQuestionBtn"><i class="fa-solid fa-plus"></i> Суроо кошуу</button>
                <button type="submit" class="btn" id="submitBtn"><i class="fa-solid fa-paper-plane"></i> Сактоо жана Жарыялоо 🚀</button>
            </div>
        </form>
    </div>

    <script type="module" src="../js/test-builder.js"></script>
</body>
</html>
