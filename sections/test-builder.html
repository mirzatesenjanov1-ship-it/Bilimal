<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Түзүүчү | Bilimal.org</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .builder-container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background: #0f172a;
            color: #f8fafc;
            border-radius: 12px;
        }
        .q-box {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .symbol-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .symbol-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid #475569;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }
        .symbol-btn:hover {
            background: #0284c7;
            color: #fff;
        }
        .formula-preview {
            background: #090d16;
            padding: 8px;
            border-radius: 4px;
            margin-top: 5px;
            min-height: 24px;
            color: #e2e8f0;
            border-left: 3px solid #38bdf8;
        }
        .opt-item-wrapper, .match-pair-wrapper {
            margin-bottom: 10px;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
        }
        .opt-item, .match-pair {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="text"], textarea, select {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 5px rgba(56, 189, 248, 0.4);
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-weight: 600;
        }
        .btn-primary { background: #0284c7; color: #fff; }
        .btn-secondary { background: #475569; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; }
    </style>
    <!-- MathJax Renderer Support -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="builder-container">
        <h2>Тест түзүүчү <span id="editBadge" style="display:none;" class="badge">Оңдоо режими</span></h2>
        
        <form id="builderForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div>
                    <label>Тесттин аталышы:</label>
                    <input type="text" id="testTitle" required placeholder="Мисалы: Физика 9-класс Денелердин сүзүүсү">
                </div>
                <div>
                    <label>Предмет:</label>
                    <input type="text" id="testSubject" required placeholder="Мисалы: Физика">
                </div>
                <div>
                    <label>Класс:</label>
                    <input type="text" id="testGrade" placeholder="Мисалы: 9-класс">
                </div>
                <div>
                    <label>Тема:</label>
                    <input type="text" id="testTopic" placeholder="Суюктуктардагы басым">
                </div>
                <div>
                    <label>Убакыт (мүнөт):</label>
                    <input type="number" id="testDuration" value="20" min="5" max="180">
                </div>
            </div>

            <hr style="border-color: #334155; margin: 20px 0;">

            <h3>Суроолор</h3>
            <div id="questionsContainer"></div>

            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button type="button" id="addQuestionBtn" class="btn btn-secondary"><i class="fa-solid fa-plus"></i> Суроо кошуу</button>
                <button type="submit" id="submitBtn" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Сактоо жана Жарыялоо 🚀</button>
            </div>
        </form>
    </div>

    <script type="module" src="../js/test-builder.js"></script>
</body>
</html>
