<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Конструктору — BiliMal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- MathJax: Физика жана Математика формулаларын рендерлөө үчүн -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#03030d; color:#fff; padding:30px 5%; min-height:100vh; }
        .builder-card { background:rgba(15,23,42,0.8); border:1px solid rgba(0,240,255,0.2); border-radius:12px; padding:25px; max-width:900px; margin:0 auto; backdrop-filter: blur(10px); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-link { color: #00f0ff; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .back-link:hover { color: #fff; text-shadow: 0 0 10px #00f0ff; }
        
        h2 { color:#00f0ff; text-align:center; }
        .edit-badge { background: rgba(255, 0, 255, 0.2); border: 1px solid #ff00ff; color: #ff00ff; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; display: none; margin-left: 10px; }
        
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px; margin-top: 20px; }
        .form-group { display:flex; flex-direction:column; gap:5px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size:0.85rem; color:#a5b4fc; font-weight: 600; }
        input, select, textarea { background:#020208; border:1px solid rgba(0,240,255,0.3); color:#fff; padding:10px 14px; border-radius:6px; outline:none; font-size:0.95rem; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { border-color:#00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.2); }
        
        .q-box { background:rgba(2,2,8,0.6); border:1px dashed rgba(0,240,255,0.3); border-radius:8px; padding:20px; margin-bottom:20px; position:relative; }
        .q-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        
        .btn { background:linear-gradient(45deg, #00f0ff, #0077ff); color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:700; transition:0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn:hover { box-shadow:0 0 15px rgba(0,240,255,0.5); transform: translateY(-2px); }
        .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
        .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:hover { background: rgba(0,240,255,0.2); border-color: #00f0ff; }
        .btn-danger { background: linear-gradient(45deg, #ff0055, #ff0000); }
        .btn-danger:hover { box-shadow:0 0 15px rgba(255,0,85,0.5); }
        
        .opt-list { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
        .opt-item { display:flex; align-items:center; gap:10px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; }
        .opt-item input[type="radio"], .opt-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #00f0ff; cursor: pointer; }
        .opt-item input[type="text"] { flex: 1; }
        .match-pair { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 10px; align-items: center; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; }
        
        .pisa-context { background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
        .img-preview { max-width: 100%; max-height: 180px; margin-top: 8px; border-radius: 6px; border: 1px solid rgba(0,240,255,0.3); display: none; }
        
        .symbol-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; align-items: center; }
        .symbol-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(0,240,255,0.3); color: #00f0ff; padding: 4px 10px; border-radius: 4px; font-size: 0.82rem; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
        .symbol-btn:hover { background: #00f0ff; color: #000; box-shadow: 0 0 8px rgba(0,240,255,0.4); }
        .symbol-btn.pro-btn { background: linear-gradient(45deg, #7928ca, #ff0080); color: #fff; border: none; font-weight: bold; }
        .symbol-btn.pro-btn:hover { box-shadow: 0 0 12px rgba(255,0,128,0.6); }

        /* Formula Editor Modal Styles */
        .fe-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 10000; }
        .fe-modal { background: #0b0f19; border: 1px solid #00f0ff; border-radius: 12px; width: 92%; max-width: 850px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 30px rgba(0, 240, 255, 0.25); color: #fff; }
        .fe-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #030712; border-bottom: 1px solid rgba(0, 240, 255, 0.2); }
        .fe-header h3 { color: #00f0ff; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
        .fe-close-btn { background: transparent; border: none; color: #a5b4fc; font-size: 1.3rem; cursor: pointer; }
        .fe-close-btn:hover { color: #ff0055; }
        .fe-body { padding: 15px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; flex: 1; }
        
        .fe-nav-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .fe-tab-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #a5b4fc; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; whitespace: nowrap; transition: 0.2s; }
        .fe-tab-btn.active, .fe-tab-btn:hover { background: rgba(0, 240, 255, 0.15); border-color: #00f0ff; color: #00f0ff; }
        
        .fe-search-box { display: flex; gap: 10px; }
        .fe-search-box input { flex: 1; padding: 8px 12px; font-size: 0.88rem; }
        
        .fe-palette-grid { display: flex; flex-wrap: wrap; gap: 8px; max-height: 180px; overflow-y: auto; background: rgba(0, 0, 0, 0.4); padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .fe-item-btn { background: #131b2e; border: 1px solid rgba(0, 240, 255, 0.2); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; transition: 0.2s; min-width: 40px; text-align: center; }
        .fe-item-btn:hover { background: #00f0ff; color: #000; font-weight: bold; transform: scale(1.05); }
        
        .fe-editor-area { display: flex; flex-direction: column; gap: 8px; }
        .fe-toolbar-actions { display: flex; justify-content: space-between; align-items: center; }
        .fe-mode-selector { display: flex; gap: 12px; align-items: center; font-size: 0.85rem; color: #a5b4fc; }
        .fe-mode-selector label { font-size: 0.85rem; cursor: pointer; color: #fff; }
        
        .fe-textarea { width: 100%; font-family: 'Courier New', monospace; font-size: 1.05rem; background: #02040a; border: 1px solid rgba(0, 240, 255, 0.4); color: #00f0ff; border-radius: 6px; padding: 12px; resize: vertical; min-height: 70px; }
        
        .fe-preview-box { background: rgba(0, 240, 255, 0.03); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 8px; padding: 15px; min-height: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .fe-preview-title { position: absolute; top: 6px; left: 10px; font-size: 0.72rem; color: #a5b4fc; text-transform: uppercase; letter-spacing: 0.5px; }
        .fe-preview-content { font-size: 1.25rem; color: #fff; max-width: 100%; overflow-x: auto; padding-top: 10px; }
        
        .fe-footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #030712; border-top: 1px solid rgba(0, 240, 255, 0.2); }
        .fe-recent-box { display: flex; gap: 6px; align-items: center; font-size: 0.8rem; color: #a5b4fc; overflow-x: auto; max-width: 50%; }
        .fe-recent-tag { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .fe-recent-tag:hover { background: #00f0ff; color: #000; }
    </style>
</head>
<body>
    <div class="builder-card">
        <div class="top-bar">
            <a href="tests.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Башкаруу панелине кайтуу</a>
            <div>
                <span id="editBadge" class="edit-badge"><i class="fa-solid fa-pen-to-square"></i> Оңдоо режими</span>
            </div>
        </div>

        <h2>📝 Тест Конструктору</h2>

        <form id="builderForm">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Тесттин аталышы</label>
                    <input type="text" id="testTitle" required placeholder="Мисалы: Электр динамикасы жана Омдун мыйзамы">
                </div>
                <div class="form-group">
                    <label>Предмет</label>
                    <input type="text" id="testSubject" required placeholder="Физика">
                </div>
                <div class="form-group">
                    <label>Класс</label>
                    <input type="text" id="testGrade" required placeholder="8">
                </div>
                <div class="form-group">
                    <label>Тема (милдеттүү эмес)</label>
                    <input type="text" id="testTopic" placeholder="Ток күчү жана чыңалуу">
                </div>
                <div class="form-group">
                    <label>Убакыт (Мүнөт менен)</label>
                    <input type="number" id="testDuration" value="15" min="1" required>
                </div>
            </div>

            <hr style="border-color:rgba(255,255,255,0.1); margin:25px 0;">

            <div id="questionsContainer"></div>

            <div style="display:flex; justify-content:space-between; margin-top:25px; flex-wrap: wrap; gap: 15px;">
                <button type="button" class="btn btn-secondary" id="addQuestionBtn"><i class="fa-solid fa-plus"></i> Суроо кошуу</button>
                <button type="submit" class="btn" id="submitBtn"><i class="fa-solid fa-paper-plane"></i> Сактоо жана Жарыялоо 🚀</button>
            </div>
        </form>
    </div>

    <!-- Professional Formula Editor Modal -->
    <div id="formulaEditorModal" class="fe-modal-overlay">
        <div class="fe-modal">
            <div class="fe-header">
                <h3><i class="fa-solid fa-calculator"></i> Professional Formula Editor (Equation Builder)</h3>
                <button type="button" class="fe-close-btn" onclick="closeFormulaEditor()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="fe-body">
                <div class="fe-search-box">
                    <input type="text" id="feSearchInput" placeholder="Формула, символ же тема издеңиз (мис: fraction, integral, Newton, kinematics)..." oninput="filterFormulaPalette()">
                </div>

                <div class="fe-nav-tabs" id="feTabs">
                    <button type="button" class="fe-tab-btn active" onclick="switchFEPalette('struct')">Structures</button>
                    <button type="button" class="fe-tab-btn" onclick="switchFEPalette('calc')">Calculus & Math</button>
                    <button type="button" class="fe-tab-btn" onclick="switchFEPalette('greek')">Greek Letters</button>
                    <button type="button" class="fe-tab-btn" onclick="switchFEPalette('symbols')">Physics Symbols</button>
                    <button type="button" class="fe-tab-btn" onclick="switchFEPalette('units')">Units & Const</button>
                    <button type="button" class="fe-tab-btn" onclick="switchFEPalette('templates')">Physics Templates</button>
                </div>

                <div class="fe-palette-grid" id="fePalette">
                    <!-- Dynamic Palette Items Loaded via JS -->
                </div>

                <div class="fe-editor-area">
                    <div class="fe-toolbar-actions">
                        <div style="display:flex; gap:6px;">
                            <button type="button" class="symbol-btn" onclick="feUndo()"><i class="fa-solid fa-rotate-left"></i> Undo</button>
                            <button type="button" class="symbol-btn" onclick="feRedo()"><i class="fa-solid fa-rotate-right"></i> Redo</button>
                            <button type="button" class="symbol-btn" onclick="feClear()"><i class="fa-solid fa-trash-can"></i> Тазалоо</button>
                        </div>
                        <div class="fe-mode-selector">
                            <span>Режим:</span>
                            <label><input type="radio" name="feMode" value="inline" checked> Inline ($...$)</label>
                            <label><input type="radio" name="feMode" value="display"> Display ($$...$$)</label>
                        </div>
                    </div>

                    <textarea id="feLatexInput" class="fe-textarea" placeholder="LaTeX кодун жазыңыз же жогорудагы баскычтардан тандаңыз..." oninput="onFeInput()"></textarea>
                </div>

                <div class="fe-preview-box">
                    <span class="fe-preview-title">Live Mathematical Preview</span>
                    <div id="fePreview" class="fe-preview-content">$$\text{Preview}$$</div>
                </div>
            </div>

            <div class="fe-footer">
                <div class="fe-recent-box">
                    <span>Акыркы:</span>
                    <div id="feRecentList" style="display:flex; gap:4px;"></div>
                </div>
                <div style="display:flex; gap:10px;">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="closeFormulaEditor()">Баш тартуу</button>
                    <button type="button" class="btn btn-sm" onclick="insertFormulaToTarget()"><i class="fa-solid fa-check"></i> Текстке Киргизүү</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Logic Script Module -->
    <script type="module" src="../js/test-builder.js"></script>

    <!-- Formula Editor Core Engine (Backward Compatible & XSS Safe) -->
    <script>
        // Global State for Formula Editor
        window.feTargetInput = null;
        let feHistory = [];
        let feHistoryStep = -1;
        let feRecentFormulas = JSON.parse(localStorage.getItem('fe_recent_formulas') || '[]');

        const PALETTES = {
            struct: [
                { label: 'Fraction (a/b)', latex: '\\frac{a}{b}', desc: 'бөлчөк fraction' },
                { label: 'Power (x²)', latex: 'x^{2}', desc: 'даража superscript' },
                { label: 'Index (x₀)', latex: 'x_{0}', desc: 'индекс subscript' },
                { label: 'Power & Index (x₀²)', latex: 'x_{0}^{2}', desc: 'даража индекс' },
                { label: 'Sqrt (√x)', latex: '\\sqrt{x}', desc: 'квадрат тамыр root' },
                { label: 'Cube Root (∛x)', latex: '\\sqrt[3]{x}', desc: 'куб тамыр root' },
                { label: 'N-th Root (ⁿ√x)', latex: '\\sqrt[n]{x}', desc: 'тамыр root' },
                { label: 'Vector (v⃗)', latex: '\\vec{v}', desc: 'вектор vector' },
                { label: 'Vector Modulus (|v⃗|)', latex: '|\\vec{v}|', desc: 'модуль vector' }
            ],
            calc: [
                { label: 'Integral (∫)', latex: '\\int f(x) dx', desc: 'интеграл integral' },
                { label: 'Def Integral (∫ₐᵇ)', latex: '\\int_{a}^{b} f(x) dx', desc: 'интеграл integral' },
                { label: 'Derivative (df/dx)', latex: '\\frac{df}{dx}', desc: 'дифференциал derivative' },
                { label: 'Partial (∂f/∂x)', latex: '\\frac{\\partial f}{\\partial x}', desc: 'частная производная' },
                { label: 'Sum (∑)', latex: '\\sum_{i=1}^{n} x_{i}', desc: 'сумма summation' },
                { label: 'Limit (lim)', latex: '\\lim_{x \\to 0}', desc: 'предел limit' },
                { label: 'sin α', latex: '\\sin \\alpha', desc: 'синус trig' },
                { label: 'cos β', latex: '\\cos \\beta', desc: 'косинус trig' },
                { label: 'tan θ', latex: '\\tan \\theta', desc: 'тангенс trig' },
                { label: 'log₂ x', latex: '\\log_{2}(x)', desc: 'логарифм log' },
                { label: 'ln x', latex: '\\ln(x)', desc: 'натуральный логарифм' },
                { label: 'Matrix 2x2', latex: '\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}', desc: 'матрица matrix' }
            ],
            greek: [
                { label: 'α', latex: '\\alpha' }, { label: 'β', latex: '\\beta' }, { label: 'γ', latex: '\\gamma' },
                { label: 'δ', latex: '\\delta' }, { label: 'ε', latex: '\\varepsilon' }, { label: 'θ', latex: '\\theta' },
                { label: 'λ', latex: '\\lambda' }, { label: 'μ', latex: '\\mu' }, { label: 'π', latex: '\\pi' },
                { label: 'ρ', latex: '\\rho' }, { label: 'σ', latex: '\\sigma' }, { label: 'φ', latex: '\\phi' },
                { label: 'ψ', latex: '\\psi' }, { label: 'ω', latex: '\\omega' }, { label: 'Δ', latex: '\\Delta' },
                { label: 'Ω', latex: '\\Omega' }, { label: 'Σ', latex: '\\Sigma' }, { label: 'Φ', latex: '\\Phi' }
            ],
            symbols: [
                { label: '∞', latex: '\\infty' }, { label: '≈', latex: '\\approx' }, { label: '≠', latex: '\\neq' },
                { label: '≤', latex: '\\le' }, { label: '≥', latex: '\\ge' }, { label: '±', latex: '\\pm' },
                { label: '∝', latex: '\\propto' }, { label: '∂', latex: '\\partial' }, { label: '∇', latex: '\\nabla' },
                { label: 'ℏ', latex: '\\hbar' }, { label: '→', latex: '\\rightarrow' }, { label: '·', latex: '\\cdot' },
                { label: '×', latex: '\\times' }, { label: '°C', latex: '^\\circ C' }
            ],
            units: [
                { label: 'm/s', latex: '\\text{m/s}' }, { label: 'm/s²', latex: '\\text{m/s}^2' },
                { label: 'kg·m/s', latex: '\\text{kg}\\cdot\\text{m/s}' }, { label: 'N·m', latex: '\\text{N}\\cdot\\text{m}' },
                { label: 'J (Жоуль)', latex: '\\text{J}' }, { label: 'W (Ватт)', latex: '\\text{W}' },
                { label: 'Pa (Паскаль)', latex: '\\text{Pa}' }, { label: 'Hz (Герц)', latex: '\\text{Hz}' },
                { label: 'Ω (Ом)', latex: '\\Omega' }, { label: '3×10⁸', latex: '3 \\times 10^{8}' },
                { label: 'c (жарык ылдамдыгы)', latex: 'c = 3 \\times 10^{8} \\text{ m/s}' },
                { label: 'G (гравитациялык)', latex: 'G = 6.67 \\times 10^{-11}' },
                { label: 'g (эркин түшүү)', latex: 'g = 9.8 \\text{ m/s}^2' }
            ],
            templates: [
                { label: 'v = s/t', latex: 'v = \\frac{s}{t}', desc: 'ылдамдык kinematics' },
                { label: 'a = Δv/Δt', latex: 'a = \\frac{\\Delta v}{\\Delta t}', desc: 'ылдамдануу kinematics' },
                { label: 's = v₀t + at²/2', latex: 's = v_{0}t + \\frac{at^{2}}{2}', desc: 'аралык kinematics' },
                { label: 'F = ma', latex: 'F = ma', desc: 'Ньютон мыйзамы dynamics' },
                { label: 'F = G m₁m₂/r²', latex: 'F = G \\frac{m_1 m_2}{r^2}', desc: 'гравитация dynamics' },
                { label: 'p = mv', latex: 'p = mv', desc: 'импульс momentum' },
                { label: 'Ek = mv²/2', latex: 'E_k = \\frac{m v^2}{2}', desc: 'кинетикалык энергия energy' },
                { label: 'Ep = mgh', latex: 'E_p = mgh', desc: 'потенциалдык энергия energy' },
                { label: 'Q = cmΔT', latex: 'Q = cm\\Delta T', desc: 'жылуулук thermodynamics' },
                { label: 'I = U/R', latex: 'I = \\frac{U}{R}', desc: 'Ом мыйзамы electric' },
                { label: 'P = UI', latex: 'P = UI', desc: 'кубаттуулук electric' },
                { label: 'v = λf', latex: 'v = \\lambda f', desc: 'толкун wave' },
                { label: 'E = mc²', latex: 'E = mc^2', desc: 'Эйнштейн relativity' }
            ]
        };

        window.openFormulaEditor = function(targetEl) {
            window.feTargetInput = targetEl;
            const modal = document.getElementById('formulaEditorModal');
            modal.style.display = 'flex';
            
            // Check if current target contains LaTeX formula
            const val = targetEl ? targetEl.value : '';
            const textarea = document.getElementById('feLatexInput');
            textarea.value = val.replace(/^\$\$|\$\$$|^\$|\$$/g, '');
            
            feHistory = [textarea.value];
            feHistoryStep = 0;
            
            switchFEPalette('struct');
            renderRecentFormulas();
            updateFePreview();
        };

        window.closeFormulaEditor = function() {
            document.getElementById('formulaEditorModal').style.display = 'none';
        };

        window.switchFEPalette = function(tabKey) {
            const tabs = document.querySelectorAll('.fe-tab-btn');
            tabs.forEach(t => t.classList.remove('active'));
            if(event && event.target && event.target.classList) event.target.classList.add('active');
            
            const grid = document.getElementById('fePalette');
            grid.innerHTML = '';
            
            const list = PALETTES[tabKey] || [];
            list.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'fe-item-btn';
                btn.innerText = item.label;
                btn.title = item.desc || item.label;
                btn.onclick = () => feInsertLatex(item.latex);
                grid.appendChild(btn);
            });
        };

        window.filterFormulaPalette = function() {
            const q = document.getElementById('feSearchInput').value.toLowerCase().trim();
            const grid = document.getElementById('fePalette');
            grid.innerHTML = '';
            
            if(!q) { switchFEPalette('struct'); return; }
            
            let matches = [];
            Object.keys(PALETTES).forEach(key => {
                PALETTES[key].forEach(item => {
                    const textStr = `${item.label} ${item.latex} ${item.desc || ''}`.toLowerCase();
                    if(textStr.includes(q)) matches.push(item);
                });
            });

            matches.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'fe-item-btn';
                btn.innerText = item.label;
                btn.onclick = () => feInsertLatex(item.latex);
                grid.appendChild(btn);
            });
        };

        window.feInsertLatex = function(code) {
            const textarea = document.getElementById('feLatexInput');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            
            textarea.value = text.substring(0, start) + code + text.substring(end);
            textarea.focus();
            textarea.selectionStart = textarea.selectionEnd = start + code.length;
            
            onFeInput();
        };

        window.onFeInput = function() {
            const val = document.getElementById('feLatexInput').value;
            // Smart Replacement Helpers
            let autoVal = val.replace(/(\w+)\^2/g, '$1^{2}')
                             .replace(/sqrt\(([^)]+)\)/g, '\\sqrt{$1}')
                             .replace(/\balpha\b/g, '\\alpha')
                             .replace(/\bbeta\b/g, '\\beta')
                             .replace(/\blambda\b/g, '\\lambda');
            
            if (autoVal !== val) {
                document.getElementById('feLatexInput').value = autoVal;
            }

            pushFeHistory(document.getElementById('feLatexInput').value);
            updateFePreview();
        };

        function pushFeHistory(val) {
            if(feHistory[feHistoryStep] !== val) {
                feHistory = feHistory.slice(0, feHistoryStep + 1);
                feHistory.push(val);
                feHistoryStep++;
            }
        }

        window.feUndo = function() {
            if(feHistoryStep > 0) {
                feHistoryStep--;
                document.getElementById('feLatexInput').value = feHistory[feHistoryStep];
                updateFePreview();
            }
        };

        window.feRedo = function() {
            if(feHistoryStep < feHistory.length - 1) {
                feHistoryStep++;
                document.getElementById('feLatexInput').value = feHistory[feHistoryStep];
                updateFePreview();
            }
        };

        window.feClear = function() {
            document.getElementById('feLatexInput').value = '';
            onFeInput();
        };

        function updateFePreview() {
            const latex = document.getElementById('feLatexInput').value.trim();
            const isDisplay = document.querySelector('input[name="feMode"]:checked').value === 'display';
            const previewEl = document.getElementById('fePreview');
            
            if(!latex) {
                previewEl.innerHTML = '<span style="color:#64748b;">(Формула бул жерде көрүнөт)</span>';
                return;
            }

            const wrapper = isDisplay ? `$$\n${latex}\n$$` : `$${latex}$`;
            // Safe Text Rendering for MathJax
            previewEl.textContent = wrapper;
            
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([previewEl]).catch(err => console.log('MathJax error:', err));
            }
        }

        window.insertFormulaToTarget = function() {
            const latex = document.getElementById('feLatexInput').value.trim();
            if(!latex) {
                closeFormulaEditor();
                return;
            }

            const isDisplay = document.querySelector('input[name="feMode"]:checked').value === 'display';
            const formatted = isDisplay ? ` $$${latex}$$ ` : ` $${latex}$ `;
            
            if(window.feTargetInput) {
                const el = window.feTargetInput;
                const start = el.selectionStart || el.value.length;
                const end = el.selectionEnd || el.value.length;
                el.value = el.value.substring(0, start) + formatted + el.value.substring(end);
                el.focus();
                // Trigger input event for dynamically updating test builders if needed
                el.dispatchEvent(new Event('input', { bubbles: true }));
            }

            // Save to Recent
            saveRecentFormula(latex);
            closeFormulaEditor();
        };

        function saveRecentFormula(latex) {
            feRecentFormulas = feRecentFormulas.filter(f => f !== latex);
            feRecentFormulas.unshift(latex);
            if(feRecentFormulas.length > 8) feRecentFormulas.pop();
            localStorage.setItem('fe_recent_formulas', JSON.stringify(feRecentFormulas));
        }

        function renderRecentFormulas() {
            const container = document.getElementById('feRecentList');
            container.innerHTML = '';
            feRecentFormulas.forEach(f => {
                const tag = document.createElement('span');
                tag.className = 'fe-recent-tag';
                tag.innerText = f.length > 12 ? f.substring(0, 10) + '...' : f;
                tag.title = f;
                tag.onclick = () => feInsertLatex(f);
                container.appendChild(tag);
            });
        }

        // MutationObserver to attach Formula Editor triggers to all inputs/textareas dynamically
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new MutationObserver(() => {
                document.querySelectorAll('.q-box').forEach(qBox => {
                    const toolbar = qBox.querySelector('.symbol-toolbar');
                    if(toolbar && !toolbar.querySelector('.fe-trigger-btn')) {
                        const feBtn = document.createElement('button');
                        feBtn.type = 'button';
                        feBtn.className = 'symbol-btn pro-btn fe-trigger-btn';
                        feBtn.innerHTML = '<i class="fa-solid fa-square-root-variable"></i> Equation Editor';
                        feBtn.onclick = () => {
                            const textarea = qBox.querySelector('.q-text');
                            window.openFormulaEditor(textarea);
                        };
                        toolbar.appendChild(feBtn);
                    }
                });
            });

            observer.observe(document.body, { childList: true, subtree: true });
        });
    </script>
</body>
</html>
