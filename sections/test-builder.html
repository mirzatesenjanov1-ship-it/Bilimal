<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Конструктору — BiliMal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#03030d; color:#fff; padding:30px 5%; min-height:100vh; }
        .builder-card { background:rgba(15,23,42,0.8); border:1px solid rgba(0,240,255,0.2); border-radius:12px; padding:25px; max-width:900px; margin:0 auto; }
        h2 { color:#00f0ff; margin-bottom:20px; text-align:center; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px; }
        .form-group { display:flex; flex-direction:column; gap:5px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size:0.85rem; color:#a5b4fc; }
        input, select, textarea { background:#020208; border:1px solid rgba(0,240,255,0.3); color:#fff; padding:10px; border-radius:6px; outline:none; font-size:0.95rem; }
        input:focus, select:focus, textarea:focus { border-color:#00f0ff; }
        .q-box { background:rgba(2,2,8,0.6); border:1px dashed rgba(255,255,255,0.2); border-radius:8px; padding:15px; margin-bottom:15px; position:relative; }
        .q-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
        .btn { background:linear-gradient(45deg, #00f0ff, #0077ff); color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:700; transition:0.3s; }
        .btn:hover { box-shadow:0 0 10px rgba(0,240,255,0.5); }
        .btn-danger { background:#ff0055; }
        .opt-list { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
        .opt-item { display:flex; align-items:center; gap:8px; }
    </style>
</head>
<body>
    <div class="builder-card">
        <h2>📝 Тест Конструктору</h2>
        <form id="builderForm">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Тесттин аталышы</label>
                    <input type="text" id="testTitle" required placeholder="Мисалы: Электр динамикасы">
                </div>
                <div class="form-group">
                    <label>Предмет</label>
                    <input type="text" id="testSubject" required placeholder="Физика">
                </div>
                <div class="form-group">
                    <label>Класс</label>
                    <input type="text" id="testGrade" required placeholder="8">
                </div>
                <div class="form-group">
                    <label>Тема</label>
                    <input type="text" id="testTopic" placeholder="Омдун мыйзамы">
                </div>
                <div class="form-group">
                    <label>Убакыт (Мүнөт менен)</label>
                    <input type="number" id="testDuration" value="15" min="1" required>
                </div>
            </div>

            <hr style="border-color:rgba(255,255,255,0.1); margin:20px 0;">

            <div id="questionsContainer"></div>

            <div style="display:flex; justify-content:space-between; margin-top:20px;">
                <button type="button" class="btn" style="background:#1e293b" id="addQuestionBtn">+ Суроо кошуу</button>
                <button type="submit" class="btn">Сактоо жана Жарыялоо 🚀</button>
            </div>
        </form>
    </div>

    <script type="module" src="../js/test-builder.js"></script>
</body>
</html>
