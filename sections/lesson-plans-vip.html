<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планы уроков - Bilimal.org</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Firebase SDKs with fallback capability -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --input-bg: #1a2234;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-amber: #f59e0b;
      --accent-amber-hover: #d97706;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-blue: #38bdf8;
      --accent-red: #ef4444;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 15px;
      padding-bottom: 50px;
    }

    /* Container wrapper */
    .app-container {
      max-width: 1240px;
      margin: 0 auto;
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 14px 22px;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent-amber);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.5px;
    }

    .brand-logo i {
      font-size: 1.6rem;
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status-badge {
      font-size: 0.85rem;
      color: var(--accent-green);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .status-badge.offline {
      color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.1);
      border-color: rgba(245, 158, 11, 0.2);
    }

    .lang-select {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      font-weight: 500;
    }

    .admin-btn {
      background: linear-gradient(135deg, var(--accent-amber), var(--accent-amber-hover));
      color: #000;
      padding: 9px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.25);
    }

    .admin-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }

    .admin-btn.logged-in {
      background: linear-gradient(135deg, var(--accent-blue), #0284c7);
      color: #fff;
    }

    /* Controls & Filter Panel */
    .controls-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      margin-bottom: 24px;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      padding: 11px 14px 11px 42px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
      user-select: text;
      -webkit-user-select: text;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
    }

    .filter-select {
      padding: 11px 16px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      font-weight: 500;
    }

    .add-plan-quick-btn {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
      border: 1px dashed var(--accent-amber);
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .add-plan-quick-btn:hover {
      background: rgba(245, 158, 11, 0.25);
    }

    /* Grid Layout */
    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 22px;
    }

    /* Card Styling */
    .plan-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .plan-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-blue);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-badge {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.8em;
    }

    .preview-container {
      width: 100%;
      height: 240px;
      background: #000000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      margin-bottom: 16px;
      position: relative;
    }

    .preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .iframe-overlay-blocker {
      position: absolute;
      top: 0;
      right: 0;
      width: 60px;
      height: 60px;
      background: transparent;
      z-index: 10;
    }

    .download-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-green-hover));
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .download-btn:hover {
      opacity: 0.95;
      transform: scale(1.01);
    }

    .price-tag {
      background: rgba(0, 0, 0, 0.25);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
    }

    .delete-card-btn {
      background: rgba(239, 68, 68, 0.2);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.4);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .delete-card-btn:hover {
      background: rgba(239, 68, 68, 0.9);
      color: #ffffff;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 26px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      animation: modalFadeIn 0.25s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .close-modal {
      position: absolute;
      top: 18px;
      right: 18px;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.2s;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .close-modal:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .qr-box {
      background: #ffffff;
      padding: 12px;
      border-radius: 14px;
      display: inline-block;
      margin: 16px 0;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }

    .qr-box img {
      width: 190px;
      height: 190px;
      object-fit: contain;
      display: block;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent-amber);
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-amber), var(--accent-amber-hover));
      color: #000;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.95;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(1);
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--card-border);
    }

    /* Notification Toast */
    .toast-msg {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--card-bg);
      border: 1px solid var(--accent-amber);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 2000;
      display: none;
      align-items: center;
      gap: 10px;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 650px) {
      .header-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .user-controls {
        justify-content: space-between;
      }
      .controls-container {
        flex-direction: column;
      }
      .filter-select {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="header-bar">
      <a href="/" class="brand-logo">
        <i class="fa-solid fa-graduation-cap"></i> Bilimal.org
      </a>
      
      <div class="user-controls">
        <div class="status-badge" id="txtOpenBase">
          <i class="fa-solid fa-shield-halved"></i> <span id="statusText">Ачык база</span>
        </div>

        <!-- Language Selector -->
        <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
          <option value="ky" selected>Кыргызча</option>
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>

        <button class="admin-btn" id="btnAdminTrigger" onclick="openAuthOrAdminModal()">
          <i class="fa-solid fa-user-shield"></i> <span id="txtAdminBtn">Админ Панель</span>
        </button>
      </div>
    </header>

    <!-- Search & Filter Controls -->
    <div class="controls-container">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Сабактын темасы боюнча издөө..." oninput="filterPlans()">
      </div>
      
      <select id="gradeFilter" class="filter-select" onchange="filterPlans()">
        <option value="all" id="optAllGrades">Бардык класстар</option>
        <option value="5">5 класс</option>
        <option value="6">6 класс</option>
        <option value="7">7 класс</option>
        <option value="8">8 класс</option>
        <option value="9">9 класс</option>
        <option value="10">10 класс</option>
        <option value="11">11 класс</option>
      </select>

      <button class="add-plan-quick-btn" id="btnAddPlanQuick" onclick="openAddPlanModal()">
        <i class="fa-solid fa-plus"></i> <span id="txtAddQuick">Жаңы план кошуу</span>
      </button>
    </div>

    <!-- Plans Grid -->
    <main class="plans-grid" id="plansContainer"></main>
  </div>

  <!-- Payment Modal -->
  <div class="modal-overlay" id="payModal">
    <div class="modal-content" style="text-align: center;">
      <i class="fa-solid fa-xmark close-modal" onclick="closeModal('payModal')"></i>
      <h3 style="color: #fff; margin-bottom: 8px;" id="txtModalHeader">Сабак планын жүктөө</h3>
      <p style="font-size: 0.88rem; color: var(--text-muted);" id="modalPlanTitle">Тема...</p>
      
      <div class="qr-box">
        <img src="/qrmbank.png" alt="MBANK QR" onerror="this.onerror=null; this.src='https://placehold.co/200x200/ffffff/000000?text=MBANK+QR+10+SOM';">
      </div>

      <div style="font-size: 1.15rem; font-weight: 800; color: var(--accent-green);" id="txtModalPrice">
        Төлөнүүчү сумма: 10 сом
      </div>
      <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 6px;" id="txtModalDesc">
        MBANK колдонмосу аркылуу QR-кодду сканерлеп 10 сом которуңуз.
      </p>

      <button class="submit-btn" style="background: linear-gradient(135deg, var(--accent-green), var(--accent-green-hover)); color: #fff; margin-top: 16px;" onclick="confirmPayment()">
        <i class="fa-solid fa-download"></i> <span id="txtConfirmPay">Төлөдүм, файлды жүктөө</span>
      </button>
    </div>
  </div>

  <!-- Admin Login Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-content">
      <i class="fa-solid fa-xmark close-modal" onclick="closeModal('authModal')"></i>
      <h3 style="color: var(--accent-amber); margin-bottom: 16px; font-size: 1.15rem;"><i class="fa-solid fa-lock"></i> Администратордун кирүүсү</h3>
      
      <form onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label>Логин:</label>
          <input type="text" id="authEmail" required placeholder="Логинди киргизиңиз">
        </div>

        <div class="form-group">
          <label>Пароль:</label>
          <input type="password" id="authPassword" required placeholder="Паролду киргизиңиз">
        </div>

        <div id="authStatusMsg" style="font-size: 0.85rem; color: var(--accent-red); margin-bottom: 10px; font-weight: 500;"></div>

        <button type="submit" class="submit-btn">Кирүү</button>
      </form>
    </div>
  </div>

  <!-- Admin Add/Edit Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-content">
      <i class="fa-solid fa-xmark close-modal" onclick="closeModal('adminModal')"></i>
      <h3 style="color: var(--accent-amber); margin-bottom: 18px; font-size: 1.15rem;" id="txtAdminTitle"><i class="fa-solid fa-plus-circle"></i> Жаңы план кошуу</h3>
      
      <form onsubmit="addNewPlan(event)">
        <div class="form-group">
          <label id="lblGrade">Классты тандаңыз:</label>
          <select id="newGrade" required>
            <option value="5">5 класс</option>
            <option value="6">6 класс</option>
            <option value="7">7 класс</option>
            <option value="8">8 класс</option>
            <option value="9">9 класс</option>
            <option value="10">10 класс</option>
            <option value="11">11 класс</option>
          </select>
        </div>

        <div class="form-group">
          <label id="lblTitle">Сабактын темасы:</label>
          <input type="text" id="newTitle" placeholder="Мис: Ньютондун экинчи закону" required>
        </div>

        <div class="form-group">
          <label id="lblUrl">Google Drive же Docs шилтемеси:</label>
          <input type="url" id="newDriveUrl" placeholder="https://docs.google.com/document/d/..." required>
        </div>

        <button type="submit" class="submit-btn" id="btnSavePlan">
          <i class="fa-solid fa-floppy-disk"></i> <span id="btnSavePlanText">Базага кошуу</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notice -->
  <div class="toast-msg" id="toastMsg">
    <i class="fa-solid fa-circle-info" style="color: var(--accent-amber);"></i>
    <span id="toastText">Маалымат</span>
  </div>

  <script>
    // Anti-inspect security script
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function(e) {
      if (
        e.keyCode === 123 || 
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
        (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))
      ) {
        e.preventDefault();
        return false;
      }
    });

    // Default Fallback Initial Plans Data if empty
    const INITIAL_DEFAULT_PLANS = [
      {
        id: "default-1",
        grade: "10",
        title: "Түз сызыктуу бир калыптагы ылдамдатылган кыймыл",
        previewUrl: "https://docs.google.com/document/d/12LafMJE_sample/preview",
        downloadUrl: "https://docs.google.com/document/d/12LafMJE_sample/export?format=docx",
        price: 10,
        timestamp: Date.now()
      }
    ];

    // Local Storage Keys
    const STORAGE_KEY = "bilimal_lesson_plans_v2";
    const AUTH_KEY = "bilimal_admin_session";

    // Firebase Setup
    const firebaseConfig = { 
      databaseURL: "https://bilimal-default-rtdb.firebaseio.com" 
    };

    let firebaseActive = false;
    let database = null;
    let plansRef = null;

    try {
      if (typeof firebase !== 'undefined') {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        database = firebase.database();
        plansRef = database.ref('global_lesson_plans');
        firebaseActive = true;
      }
    } catch(err) {
      console.warn("Firebase туташуу мүмкүнчүлүгү жок, локалдык режим колдонулат:", err);
    }

    // Admin Credentials
    const ADMIN_LOGIN = "admin";
    const ADMIN_PASS = "bilimal2026";
    let isAdminLoggedIn = false;
    let lessonPlans = [];
    let selectedPlanForPay = null;
    let currentLang = 'ky';

    // Translations Dictionary
    const translations = {
      ky: {
        openBase: 'Ачык база',
        adminBtn: 'Админ Панель',
        adminBtnActive: 'Выйти (Админ)',
        searchPlaceholder: 'Сабактын темасы боюнча издөө...',
        allGrades: 'Бардык класстар',
        gradeSuffix: 'класс',
        downloadWord: 'Word көчүрүү',
        modalHeader: 'Сабак планын жүктөө',
        modalPrice: 'Төлөнүүчү сумма: 10 сом',
        modalDesc: 'MBANK колдонмосу аркылуу QR-кодду сканерлеп 10 сом которуңуз.',
        confirmPay: 'Төлөдүм, файлды жүктөө',
        adminTitle: 'Жаңы сабак планын кошуу',
        lblGrade: 'Классты тандаңыз:',
        lblTitle: 'Сабактын темасы:',
        lblUrl: 'Google Drive / Docs Шилтемеси:',
        btnSavePlan: 'Базага кошуу',

    // Load local stored plans
    function getLocalPlans() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : INITIAL_DEFAULT_PLANS;
      } catch(e) {
        return INITIAL_DEFAULT_PLANS;
      }
    }

    // Save plans locally
    function setLocalPlans(plans) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(plans));
      } catch(e) {
        console.error("Local Storage error:", e);
      }
    }

    // Sync listener for Firebase with local fallback
    function initDataSync() {
      lessonPlans = getLocalPlans();
      filterPlans();

      if (firebaseActive && plansRef) {
        plansRef.on('value', (snapshot) => {
          const data = snapshot.val();
          let remotePlans = [];
          if (data) {
            Object.keys(data).forEach(key => {
              remotePlans.push({ id: key, ...data[key] });
            });
            remotePlans.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            lessonPlans = remotePlans;
            setLocalPlans(remotePlans);
          }
          filterPlans();
        }, (error) => {
          console.warn("Firebase Read Error - using local storage:", error);
        });
      }
    }

    // Check saved session
    function checkAdminSession() {
      if (sessionStorage.getItem(AUTH_KEY) === "true") {
        isAdminLoggedIn = true;
        updateAdminUI();
      }
    }

    function updateAdminUI() {
      const btnTrigger = document.getElementById('btnAdminTrigger');
      const txtBtn = document.getElementById('txtAdminBtn');
      const quickAdd = document.getElementById('btnAddPlanQuick');

      if (isAdminLoggedIn) {
        btnTrigger.classList.add('logged-in');
        txtBtn.innerText = translations[currentLang].adminBtnActive;
        quickAdd.style.display = 'inline-flex';
      } else {
        btnTrigger.classList.remove('logged-in');
        txtBtn.innerText = translations[currentLang].adminBtn;
        quickAdd.style.display = 'none';
      }
      filterPlans();
    }

    function openAuthOrAdminModal() {
      if (isAdminLoggedIn) {
        // Logout
        isAdminLoggedIn = false;
        sessionStorage.removeItem(AUTH_KEY);
        updateAdminUI();
        showToast("Администратор чыкты.");
      } else {
        openAuthModal();
      }
    }

    function changeLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.getElementById('statusText').innerText = t.openBase;
      if (!isAdminLoggedIn) {
        document.getElementById('txtAdminBtn').innerText = t.adminBtn;
      } else {
        document.getElementById('txtAdminBtn').innerText = t.adminBtnActive;
      }
      
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('optAllGrades').innerText = t.allGrades;
      document.getElementById('txtModalHeader').innerText = t.modalHeader;
      document.getElementById('txtModalPrice').innerText = t.modalPrice;
      document.getElementById('txtModalDesc').innerText = t.modalDesc;
      document.getElementById('txtConfirmPay').innerText = t.confirmPay;
      document.getElementById('txtAdminTitle').innerText = t.adminTitle;
      document.getElementById('lblGrade').innerText = t.lblGrade;
      document.getElementById('lblTitle').innerText = t.lblTitle;
      document.getElementById('lblUrl').innerText = t.lblUrl;
      document.getElementById('btnSavePlanText').innerText = t.btnSavePlan;

      filterPlans();
    }

    function renderPlans(plans) {
      const container = document.getElementById('plansContainer');
      const t = translations[currentLang];
      container.innerHTML = '';

      if (!plans || plans.length === 0) {
        container.innerHTML = `
          <div class="empty-msg">
            <i class="fa-solid fa-folder-open" style="font-size: 2.2rem; margin-bottom: 12px; color: var(--accent-amber);"></i>
            <br>${t.emptyMsg}
          </div>`;
        return;
      }

      plans.forEach(plan => {
        const card = document.createElement('div');
        card.className = 'plan-card';
        
        const deleteBtnStyle = isAdminLoggedIn ? 'flex' : 'none';

        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="card-badge">${plan.grade}-${t.gradeSuffix}</span>
              <button class="delete-card-btn" style="display: ${deleteBtnStyle}" onclick="deletePlan('${plan.id}')" title="Өчүрүү">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
            
            <h3 class="card-title" title="${plan.title}">${plan.title}</h3>
            
            <div class="preview-container">
              <div class="iframe-overlay-blocker"></div>
              <iframe class="preview-iframe" src="${plan.previewUrl}" loading="lazy"></iframe>
            </div>
          </div>

          <button class="download-btn" onclick="openPaymentModal('${plan.id}')">
            <i class="fa-solid fa-file-word"></i> ${t.downloadWord} 
            <span class="price-tag">${plan.price || 10} сом</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function filterPlans() {
      const searchValue = document.getElementById('searchInput').value.toLowerCase();
      const selectedGrade = document.getElementById('gradeFilter').value;

      const filtered = lessonPlans.filter(plan => {
        const matchesSearch = plan.title.toLowerCase().includes(searchValue);
        const matchesGrade = selectedGrade === 'all' || String(plan.grade) === String(selectedGrade);
        return matchesSearch && matchesGrade;
      });

      renderPlans(filtered);
    }

    function openPaymentModal(planId) {
      selectedPlanForPay = lessonPlans.find(p => p.id === planId);
      if (!selectedPlanForPay) return;

      const t = translations[currentLang];
      document.getElementById('modalPlanTitle').innerText = `${selectedPlanForPay.grade}-${t.gradeSuffix}: ${selectedPlanForPay.title}`;
      document.getElementById('payModal').style.display = 'flex';
    }

    function confirmPayment() {
      if (selectedPlanForPay) {
        showToast(translations[currentLang].paySuccess);
        window.open(selectedPlanForPay.downloadUrl, '_blank');
        closeModal('payModal');
      }
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function openAuthModal() {
      document.getElementById('authStatusMsg').innerText = '';
      document.getElementById('authEmail').value = '';
      document.getElementById('authPassword').value = '';
      document.getElementById('authModal').style.display = 'flex';
    }

    function openAddPlanModal() {
      document.getElementById('adminModal').style.display = 'flex';
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const userLogin = document.getElementById('authEmail').value.trim();
      const userPass = document.getElementById('authPassword').value.trim();
      const statusMsg = document.getElementById('authStatusMsg');

      if (userLogin === ADMIN_LOGIN && userPass === ADMIN_PASS) {
        isAdminLoggedIn = true;
        sessionStorage.setItem(AUTH_KEY, "true");
        closeModal('authModal');
        updateAdminUI();
        openAddPlanModal();
        showToast("Администратор кирди!");
      } else {
        statusMsg.innerText = "Логин же пароль ката!";
      }
    }

    // Comprehensive RegEx URL Extractor for Google Docs/Drive
    function extractGoogleFileId(url) {
      if (!url) return null;
      // Patterns matching: /d/FILE_ID, id=FILE_ID, /document/d/FILE_ID, etc.
      const regExp = /(?:\/d\/|id=|document\/d\/|presentation\/d\/|spreadsheets\/d\/)([a-zA-Z0-9_-]{15,})/i;
      const match = url.match(regExp);
      return match ? match[1] : null;
    }

    // Add new plan with timeout fallback (Non-blocking guarantee)
    function addNewPlan(e) {
      e.preventDefault();

      const btnSave = document.getElementById('btnSavePlan');
      const btnText = document.getElementById('btnSavePlanText');
      const t = translations[currentLang];

      const grade = document.getElementById('newGrade').value;
      const title = document.getElementById('newTitle').value.trim();
      const rawUrl = document.getElementById('newDriveUrl').value.trim();

      const fileId = extractGoogleFileId(rawUrl);
      if (!fileId) {
        alert(t.urlError);
        return;
      }

      let previewUrl = `https://drive.google.com/file/d/${fileId}/preview`;
      let downloadUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;

      // Google Docs optimization
      if (rawUrl.includes("docs.google.com/document")) {
        previewUrl = `https://docs.google.com/document/d/${fileId}/preview`;
        downloadUrl = `https://docs.google.com/document/d/${fileId}/export?format=docx`;
      }

      // UI Loading state
      btnSave.disabled = true;
      btnText.innerText = t.btnSaving;

      const newPlanObj = {
        id: "plan-" + Date.now(),
        grade: grade,
        title: title,
        previewUrl: previewUrl,
        downloadUrl: downloadUrl,
        price: 10,
        timestamp: Date.now()
      };

      // 1. Immediately update Local Storage and Local State
      lessonPlans.unshift(newPlanObj);
      setLocalPlans(lessonPlans);
      filterPlans();

      // 2. Try Firebase write with strict 2.5 second timeout
      let savedToRemote = false;

      if (firebaseActive && plansRef) {
        const firebasePromise = plansRef.push({
          grade: grade,
          title: title,
          previewUrl: previewUrl,
          downloadUrl: downloadUrl,
          price: 10,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });

        const timeoutPromise = new Promise((_, reject) => 
          setTimeout(() => reject(new Error("Timeout")), 2500)
        );

        Promise.race([firebasePromise, timeoutPromise])
          .then(() => {
            savedToRemote = true;
            finishSaving();
          })
          .catch((err) => {
            console.warn("Firebase sync delayed or failed, saved locally:", err);
            finishSaving();
          });
      } else {
        finishSaving();
      }

      function finishSaving() {
        btnSave.disabled = false;
        btnText.innerText = t.btnSavePlan;
        closeModal('adminModal');
        document.getElementById('newTitle').value = '';
        document.getElementById('newDriveUrl').value = '';
        showToast(t.saveSuccess);
      }
    }

    // Delete plan function
    function deletePlan(planId) {
      if (!isAdminLoggedIn) return;
      const t = translations[currentLang];

      if (confirm(t.deleteConfirm)) {
        // Remove locally
        lessonPlans = lessonPlans.filter(p => p.id !== planId);
        setLocalPlans(lessonPlans);
        filterPlans();

        // Remove remotely if possible
        if (firebaseActive && plansRef && !planId.startsWith('default-') && !planId.startsWith('plan-')) {
          plansRef.child(planId).remove().catch(e => console.warn("Firebase delete err:", e));
        }

        showToast(t.deleted);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      document.getElementById('toastText').innerText = msg;
      toast.style.display = 'flex';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3500);
    }

    // Page Load Initialization
    window.onload = () => {
      initDataSync();
      checkAdminSession();
      changeLanguage('ky');
    };
  </script>
