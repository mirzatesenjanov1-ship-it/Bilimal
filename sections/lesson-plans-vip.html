<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сабак пландары - Bilimal.org</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }

    /* Навигация / Башкы панель */
    .header-bar {
      max-width: 1200px;
      margin: 0 auto 25px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      padding: 15px 25px;
      border-radius: 14px;
      border: 1px solid #1f2937;
    }

    .brand-logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f59e0b;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Издөө жана Чыпкалоо Панели */
    .controls-container {
      max-width: 1200px;
      margin: 0 auto 25px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      background: #111827;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid #1f2937;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
    }

    .search-input {
      width: 100%;
      padding: 12px 15px 12px 42px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    .filter-select {
      padding: 12px 20px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    /* Витрина Карточкаларынын Сеткасы */
    .plans-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
    }

    .plan-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .plan-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }

    .card-badge {
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f3f4f6;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    /* Google Drive Preview Фрейми (көчүрүү бөгөттөлгөн) */
    .preview-container {
      width: 100%;
      height: 280px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #374151;
      margin-bottom: 15px;
      position: relative;
    }

    .preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Жүктөө Баскычы */
    .download-btn {
      width: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.2s;
    }

    .download-btn:hover {
      opacity: 0.9;
    }

    .price-tag {
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    /* Модалдык Төлөм Терезеси */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      padding: 25px;
      text-align: center;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #9ca3af;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .qr-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 12px;
      display: inline-block;
      margin: 15px 0;
    }

    .qr-box img {
      width: 180px;
      height: 180px;
    }

    .pay-status {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-left-color: #38bdf8;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <!-- Башкы Header -->
  <header class="header-bar">
    <a href="/" class="brand-logo">
      <i class="fa-solid fa-graduation-cap"></i> Bilimal.org
    </a>
    <div style="font-size: 0.9rem; color: #10b981; font-weight: 500;">
      <i class="fa-solid fa-lock-open"></i> Ачык база (Витрина)
    </div>
  </header>

  <!-- Издөө жана Фильтр -->
  <div class="controls-container">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="Сабактын темасы боюнча издөө..." oninput="filterPlans()">
    </div>
    
    <select id="gradeFilter" class="filter-select" onchange="filterPlans()">
      <option value="all">Бардык класстар</option>
      <option value="5">5-класс</option>
      <option value="6">6-класс</option>
      <option value="7">7-класс</option>
      <option value="8">8-класс</option>
      <option value="9">9-класс</option>
      <option value="10">10-класс</option>
      <option value="11">11-класс</option>
    </select>
  </div>

  <!-- Пландардын сеткасы -->
  <main class="plans-grid" id="plansContainer">
    <!-- Данныйлар JS аркылуу автоматтык жүктөлөт -->
  </main>

  <!-- Төлөм жүргүзүү Модалдык терезеси -->
  <div class="modal-overlay" id="payModal">
    <div class="modal-content">
      <i class="fa-solid fa-xmark close-modal" onclick="closePaymentModal()"></i>
      <h3 style="color: #fff; margin-bottom: 8px;">Сабак планын жүктөө</h3>
      <p style="font-size: 0.85rem; color: #9ca3af;" id="modalPlanTitle">Темасы...</p>
      
      <div class="qr-box">
        <!-- Динамикалык QR код же банктык QR -->
        <img id="qrImage" src="" alt="Төлөм QR коду">
      </div>

      <div style="font-size: 1.1rem; font-weight: bold; color: #10b981;">
        Төлөнүүчү сумма: 10 сом
      </div>
      <p style="font-size: 0.8rem; color: #9ca3af; margin-top: 5px;">
        MBANK же каалаган банк колдонмосу менен QR-кодду сканерлеңиз.
      </p>

      <div class="pay-status" id="payStatus">
        <div class="spinner"></div> Төлөм автоматтык текшерилүүдө...
      </div>
    </div>
  </div>

  <script>
    // 1. Сабак пландарынын маалымат базасы (Бул жерге Google Drive ID жана Жүктөө шилтемелерин саласыз)
    const lessonPlans = [
      {
        id: "plan_10_01",
        grade: "10",
        title: "Түз сызыктуу бир калыптагы кыймыл",
        // Google Drive /preview шилтемеси (Көчүрүү жана басып чыгаруу жабылган)
        previewUrl: "https://drive.google.com/file/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs/preview",
        // Төлөгөндөн кийин жүктөлүүчү Word файлдын түздөн-түз шилтемеси
        downloadUrl: "https://drive.google.com/uc?export=download&id=1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs",
        price: 10
      },
      {
        id: "plan_8_01",
        grade: "8",
        title: "Заттын түзүлүшү. Молекулалар жана атомдор",
        previewUrl: "https://drive.google.com/file/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs/preview",
        downloadUrl: "https://drive.google.com/uc?export=download&id=1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs",
        price: 10
      },
      {
        id: "plan_7_01",
        grade: "7",
        title: "Физикалык кубулуштар жана байкоолор",
        previewUrl: "https://drive.google.com/file/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs/preview",
        downloadUrl: "https://drive.google.com/uc?export=download&id=1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs",
        price: 10
      }
    ];

    let currentCheckingPlan = null;
    let paymentCheckInterval = null;

    // 2. Витринаны экранга чыгаруу
    function renderPlans(plans) {
      const container = document.getElementById('plansContainer');
      container.innerHTML = '';

      if (plans.length === 0) {
        container.innerHTML = `<div class="empty-msg"><i class="fa-solid fa-folder-open" style="font-size: 2rem; margin-bottom: 10px;"></i><br>Сабак пландары табылган жок.</div>`;
        return;
      }

      plans.forEach(plan => {
        const card = document.createElement('div');
        card.className = 'plan-card';
        card.innerHTML = `
          <div>
            <span class="card-badge">${plan.grade}-класс</span>
            <h3 class="card-title">${plan.title}</h3>
            
            <!-- Google Drive Документти көрүү (Копирование блокировкада) -->
            <div class="preview-container">
              <iframe class="preview-iframe" src="${plan.previewUrl}" allow="autoplay"></iframe>
            </div>
          </div>

          <button class="download-btn" onclick="openPaymentModal('${plan.id}')">
            <i class="fa-solid fa-file-word"></i> Word көчүрүү 
            <span class="price-tag">${plan.price} сом</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    // 3. Издөө жана Фильтрлоо функциясы
    function filterPlans() {
      const searchValue = document.getElementById('searchInput').value.toLowerCase();
      const selectedGrade = document.getElementById('gradeFilter').value;

      const filtered = lessonPlans.filter(plan => {
        const matchesSearch = plan.title.toLowerCase().includes(searchValue);
        const matchesGrade = selectedGrade === 'all' || plan.grade === selectedGrade;
        return matchesSearch && matchesGrade;
      });

      renderPlans(filtered);
    }

    // 4. Төлөм Модалын ачуу жана QR түзүү (Б-Вариант)
    function openPaymentModal(planId) {
      const plan = lessonPlans.find(p => p.id === planId);
      if (!plan) return;

      currentCheckingPlan = plan;
      document.getElementById('modalPlanTitle').innerText = `${plan.grade}-класс: ${plan.title}`;
      
      // Динамикалык QR кодду жаратуу (MBANK же Pay24 QR API шилтемеси)
      // Мисал катары QuickChart API аркылуу QR генерециялоо
      const paymentPayload = `https://bilimal.org/pay?plan_id=${plan.id}&amount=${plan.price}`;
      document.getElementById('qrImage').src = `https://quickchart.io/qr?text=${encodeURIComponent(paymentPayload)}&size=180`;

      document.getElementById('payModal').style.display = 'flex';

      // 5. Төлөм аткарылганын серверден автоматтык сурап туруу (Polling)
      startPaymentCheck(plan.id);
    }

    // 5. Төлөмдүн статусун аткаруу / текшерүү
    function startPaymentCheck(planId) {
      clearInterval(paymentCheckInterval);
      
      // Б-Вариант: Бул жерде ар 3 секунд сайын серверден (Webhook) төлөм түштүбү же жокпу текшерип турат
      paymentCheckInterval = setInterval(() => {
        /* 
           Иш жүзүндө Backendге суроо жиберилет:
           fetch('/api/check-payment?plan_id=' + planId)...
        */
        
        // Демонстрация үчүн: 6 секунддан кийин төлөм ийгиликтүү өттү деп файлды автоматтык жүктөп берет
      }, 3000);
    }

    // Имитация: Төлөм ийгиликтүү өткөндө чакырылуучу функция
    function paymentSuccess(plan) {
      clearInterval(paymentCheckInterval);
      document.getElementById('payStatus').innerHTML = `<span style="color: #10b981;"><i class="fa-solid fa-circle-check"></i> Төлөм кабыл алынды! Жүктөлүп жатат...</span>`;
      
      setTimeout(() => {
        closePaymentModal();
        // Word файлды түз автоматтык түрдө жүктөп алуу
        window.location.href = plan.downloadUrl;
      }, 1500);
    }

    // Модалды жабуу
    function closePaymentModal() {
      document.getElementById('payModal').style.display = 'none';
      clearInterval(paymentCheckInterval);
    }

    // Алгачкы баракча жүктөлгөндө чакыруу
    window.onload = () => {
      renderPlans(lessonPlans);
    };
  </script>
</body>
</html>
