<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сабактын пландары - Bilimal.org</title>

  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDK (v9 Compatibility Mode) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      padding: 15px;
    }

    /* Header Navigation */
    .header-bar {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      padding: 12px 20px;
      border-radius: 14px;
      border: 1px solid #1f2937;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f59e0b;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lang-select {
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .admin-btn {
      background: linear-gradient(90deg, #f59e0b, #d97706);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Search & Filter Controls */
    .controls-container {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: #111827;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #1f2937;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    .filter-select {
      padding: 10px 15px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    /* Grid Layout */
    .plans-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .plan-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .plan-card:hover {
      transform: translateY(-3px);
      border-color: #38bdf8;
    }

    .card-badge {
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f3f4f6;
      margin-bottom: 12px;
      line-height: 1.4;
      word-break: break-word;
    }

    .preview-box {
      width: 100%;
      height: 220px;
      background: #0d1322;
      border-radius: 10px;
      overflow-y: auto;
      border: 1px solid #374151;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      color: #d1d5db;
      line-height: 1.5;
      user-select: text;
      -webkit-user-select: text;
    }

    .download-btn {
      width: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .download-btn:hover {
      opacity: 0.9;
    }

    .price-tag {
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .delete-card-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      z-index: 5;
    }

    /* Modal Layouts */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-content {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      max-width: 460px;
      width: 100%;
      padding: 22px;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #9ca3af;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .qr-box {
      background: #ffffff;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
      margin: 12px 0;
    }

    .qr-box img {
      width: 180px;
      height: 180px;
      object-fit: contain;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .submit-btn {
      width: 100%;
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #9ca3af;
    }

    @media (max-width: 600px) {
      .header-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .user-controls {
        justify-content: space-between;
      }
      .controls-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header-bar">
    <a href="/" class="brand-logo">
      <i class="fa-solid fa-graduation-cap"></i> Bilimal.org
    </a>
    
    <div class="user-controls">
      <div style="font-size: 0.85rem; color: #10b981; font-weight: 500;" id="txtOpenBase">
        <i class="fa-solid fa-lock-open"></i> Ачык база
      </div>

      <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
        <option value="ky" selected>Кыргызча</option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>

      <button class="admin-btn" onclick="openAuthModal()">
        <i class="fa-solid fa-user-shield"></i> <span id="txtAdminBtn">Админ Панель</span>
      </button>
    </div>
  </header>

  <!-- Control Inputs -->
  <div class="controls-container">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="Сабактын темасы боюнча издөө..." oninput="filterPlans()">
    </div>
    
    <select id="gradeFilter" class="filter-select" onchange="filterPlans()">
      <option value="all" id="optAllGrades">Бардык класстар</option>
      <option value="5">5-класс</option>
      <option value="6">6-класс</option>
      <option value="7">7-класс</option>
      <option value="8">8-класс</option>
      <option value="9">9-класс</option>
      <option value="10">10-класс</option>
      <option value="11">11-класс</option>
    </select>
  </div>

  <!-- Lesson Plans Grid -->
  <main class="plans-grid" id="plansContainer"></main>

  <!-- Payment Modal -->
  <div class="modal-overlay" id="payModal">
    <div class="modal-content" style="text-align: center;">
      <i class="fa-solid fa-xmark close-modal" onclick="closeModal('payModal')"></i>
      <h3 style="color: #fff; margin-bottom: 8px;" id="txtModalHeader">Сабак планын жүктөө</h3>
      <p style="font-size: 0.85rem; color: #9ca3af;" id="modalPlanTitle">Тема...</p>
      
      <div class="qr-box">
        <img src="/qrmbank.png" alt="MBANK QR" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=MBANK_BILIMAL_PAYMENT'">
      </div>

      <div style="font-size: 1.1rem; font-weight: bold; color: #10b981;" id="txtModalPrice">
        Төлөнүүчү сумма: 10 сом
      </div>
      <p style="font-size: 0.8rem; color: #9ca3af; margin-top: 5px;" id="txtModalDesc">
        MBANK колдонмосу аркылуу QR-кодду сканерлеп 10 сом которуңуз.
      </p>

      <button class="submit-btn" style="background: #10b981; color: #fff; margin-top: 15px;" onclick="confirmPayment()">
        <i class="fa-solid fa-download"></i> <span id="txtConfirmPay">Төлөдүм, сабак планын алуу</span>
      </button>
    </div>
  </div>

  <!-- Admin Auth Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-content">
      <i class="fa-solid fa-xmark close-modal" onclick="closeModal('authModal')"></i>
      <h3 style="color: #f59e0b; margin-bottom: 15px;"><i class="fa-solid fa-lock"></i> Админ панелине кирүү</h3>
      
      <form onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label>Логин:</label>
          <input type="text" id="authEmail" required placeholder="Логинди киргизиңиз">
        </div>

        <div class="form-group">
          <label>Пароль:</label>
          <input type="password" id="authPassword" required placeholder="Паролду киргизиңиз">
        </div>

        <div id="authStatusMsg" style="font-size: 0.85rem; color: #ef4444; margin-bottom: 10px;"></div>

        <button type="submit" class="submit-btn">Панелге кирүү</button>
      </form>
    </div>
  </div>

  <!-- Admin Control Panel Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-content">
      <i class="fa-solid fa-xmark close-modal" onclick="closeModal('adminModal')"></i>
      <h3 style="color: #f59e0b; margin-bottom: 15px;" id="txtAdminTitle"><i class="fa-solid fa-plus-circle"></i> Жаңы сабак планын кошуу</h3>
      
      <form onsubmit="addNewPlan(event)">
        <div class="form-group">
          <label id="lblGrade">Классты тандаңыз:</label>
          <select id="newGrade" required>
            <option value="5">5-класс</option>
            <option value="6">6-класс</option>
            <option value="7">7-класс</option>
            <option value="8">8-класс</option>
            <option value="9">9-класс</option>
            <option value="10">10-класс</option>
            <option value="11">11-класс</option>
          </select>
        </div>

        <div class="form-group">
          <label id="lblTitle">Сабактын темасы:</label>
          <input type="text" id="newTitle" placeholder="Мисалы: Түз сызыктуу бир калыптагы ылдамдатылган кыймыл" required>
        </div>

        <div class="form-group">
          <label id="lblContent">Сабактын планынын мазмуну (Конспект):</label>
          <textarea id="newContent" rows="6" placeholder="Сабактын максаты, тиби, жүрүшү жана тапшырмаларды бул жерге жазыңыз..." required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="btnSavePlan">Базага жарыялоо</button>
      </form>
    </div>
  </div>

  <script>
    // Context Menu & DevTools Security
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function(e) {
      if (
        e.keyCode === 123 || 
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
        (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))
      ) {
        e.preventDefault();
        return false;
      }
    });

    // Firebase Initialization
    const firebaseConfig = { 
      databaseURL: "https://bilimal-default-rtdb.firebaseio.com" 
    };
    
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    const plansRef = database.ref('global_lesson_plans');

    // Admin Credentials & State
    const ADMIN_LOGIN = "admin";
    const ADMIN_PASS = "bilimal2026";
    let isAdminLoggedIn = false;
    let lessonPlans = [];

    // Realtime Global Database Listener
    function listenGlobalPlans() {
      plansRef.on('value', (snapshot) => {
        const data = snapshot.val();
        lessonPlans = [];
        if (data) {
          Object.keys(data).forEach(key => {
            lessonPlans.push({ id: key, ...data[key] });
          });
          lessonPlans.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        }
        filterPlans();
      }, (error) => {
        console.error("Firebase Sync Error:", error);
      });
    }

    const translations = {
      ky: {
        openBase: '<i class="fa-solid fa-lock-open"></i> Ачык база',
        adminBtn: 'Админ Панель',
        searchPlaceholder: 'Сабактын темасы боюнча издөө...',
        allGrades: 'Бардык класстар',
        gradeSuffix: '-класс',
        downloadWord: 'Пландарды көрүү / Төлөө',
        modalHeader: 'Сабак планын жүктөө',
        modalPrice: 'Төлөнүүчү сумма: 10 сом',
        modalDesc: 'MBANK колдонмосу аркылуу QR-кодду сканерлеп 10 сом которуңуз.',
        confirmPay: 'Төлөдүм, планды ачуу',
        adminTitle: '<i class="fa-solid fa-plus-circle"></i> Жаңы сабак планын кошуу',
        lblGrade: 'Классты тандаңыз:',
        lblTitle: 'Сабактын темасы:',
        lblContent: 'Сабактын планынын мазмуну (Конспект):',
        btnSavePlan: 'Базага жарыялоо',
        emptyMsg: 'Сабак пландары азырынча кошула элек.',
        paySuccess: 'Төлөм кабыл алынды! Сабактын планы толук ачылды.'
      },
      ru: {
        openBase: '<i class="fa-solid fa-lock-open"></i> Открытая база',
        adminBtn: 'Админ Панель',
        searchPlaceholder: 'Поиск по теме урока...',
        allGrades: 'Все классы',
        gradeSuffix: ' класс',
        downloadWord: 'Открыть план / Оплатить',
        modalHeader: 'Скачать план урока',
        modalPrice: 'Сумма к оплате: 10 сом',
        modalDesc: 'Отсканируйте QR-код через приложение MBANK и переведите 10 сом.',
        confirmPay: 'Оплачено, открыть план',
        adminTitle: '<i class="fa-solid fa-plus-circle"></i> Добавить новый план',
        lblGrade: 'Выберите класс:',
        lblTitle: 'Тема урока:',
        lblContent: 'Содержание плана урока (Конспект):',
        btnSavePlan: 'Опубликовать в базу',
        emptyMsg: 'Планы уроков пока не добавлены.',
        paySuccess: 'Оплата принята! План урока открыт.'
      },
      en: {
        openBase: '<i class="fa-solid fa-lock-open"></i> Public Database',
        adminBtn: 'Admin Panel',
        searchPlaceholder: 'Search lesson topic...',
        allGrades: 'All grades',
        gradeSuffix: ' grade',
        downloadWord: 'View Plan / Pay',
        modalHeader: 'Download Lesson Plan',
        modalPrice: 'Amount due: 10 SOM',
        modalDesc: 'Scan QR code via MBANK app and transfer 10 SOM.',
        confirmPay: 'Paid, open plan',
        adminTitle: '<i class="fa-solid fa-plus-circle"></i> Add New Plan',
        lblGrade: 'Select Grade:',
        lblTitle: 'Lesson Topic:',
        lblContent: 'Lesson Plan Content:',
        btnSavePlan: 'Publish to Database',
        emptyMsg: 'No lesson plans added yet.',
        paySuccess: 'Payment accepted! Lesson plan opened.'
      }
    };

    let currentLang = 'ky';
    let selectedPlanForPay = null;

    function changeLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.getElementById('txtOpenBase').innerHTML = t.openBase;
      document.getElementById('txtAdminBtn').innerText = t.adminBtn;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('optAllGrades').innerText = t.allGrades;
      document.getElementById('txtModalHeader').innerText = t.modalHeader;
      document.getElementById('txtModalPrice').innerText = t.modalPrice;
      document.getElementById('txtModalDesc').innerText = t.modalDesc;
      document.getElementById('txtConfirmPay').innerText = t.confirmPay;
      document.getElementById('txtAdminTitle').innerHTML = t.adminTitle;
      document.getElementById('lblGrade').innerText = t.lblGrade;
      document.getElementById('lblTitle').innerText = t.lblTitle;
      document.getElementById('lblContent').innerText = t.lblContent;
      document.getElementById('btnSavePlan').innerText = t.btnSavePlan;

      filterPlans();
    }

    function renderPlans(plans) {
      const container = document.getElementById('plansContainer');
      const t = translations[currentLang];
      container.innerHTML = '';

      if (!plans || plans.length === 0) {
        container.innerHTML = `<div class="empty-msg"><i class="fa-solid fa-folder-open" style="font-size: 2rem; margin-bottom: 10px;"></i><br>${t.emptyMsg}</div>`;
        return;
      }

      plans.forEach(plan => {
        const card = document.createElement('div');
        card.className = 'plan-card';
        
        const deleteBtnDisplay = isAdminLoggedIn ? 'flex' : 'none';

        card.innerHTML = `
          <button class="delete-card-btn" style="display: ${deleteBtnDisplay}" onclick="deletePlan('${plan.id}')" title="Өчүрүү">
            <i class="fa-solid fa-trash"></i>
          </button>
          <div>
            <span class="card-badge">${plan.grade}${t.gradeSuffix}</span>
            <h3 class="card-title">${plan.title}</h3>
            
            <div class="preview-box">
              ${plan.content ? plan.content.replace(/\n/g, '<br>') : 'Сабактын планы кошулган.'}
            </div>
          </div>

          <button class="download-btn" onclick="openPaymentModal('${plan.id}')">
            <i class="fa-solid fa-file-invoice"></i> ${t.downloadWord} 
            <span class="price-tag">${plan.price || 10} сом</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function filterPlans() {
      const searchValue = document.getElementById('searchInput').value.toLowerCase();
      const selectedGrade = document.getElementById('gradeFilter').value;

      const filtered = lessonPlans.filter(plan => {
        const matchesSearch = plan.title.toLowerCase().includes(searchValue) || 
                              (plan.content && plan.content.toLowerCase().includes(searchValue));
        const matchesGrade = selectedGrade === 'all' || String(plan.grade) === String(selectedGrade);
        return matchesSearch && matchesGrade;
      });

      renderPlans(filtered);
    }

    function openPaymentModal(planId) {
      selectedPlanForPay = lessonPlans.find(p => p.id === planId);
      if (!selectedPlanForPay) return;

      const t = translations[currentLang];
      document.getElementById('modalPlanTitle').innerText = `${selectedPlanForPay.grade}${t.gradeSuffix}: ${selectedPlanForPay.title}`;
      document.getElementById('payModal').style.display = 'flex';
    }

    function confirmPayment() {
      if (selectedPlanForPay) {
        alert(translations[currentLang].paySuccess);
        
        // Төлөгөндөн кийин сабактын текстин модалдык терезеге толук чыгарып берүү
        const newWin = window.open("", "_blank");
        newWin.document.write(`
          <html>
            <head>
              <title>${selectedPlanForPay.title}</title>
              <style>
                body { font-family: Arial, sans-serif; padding: 30px; line-height: 1.6; color: #111; }
                h2 { color: #d97706; }
                .content { background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; white-space: pre-wrap; }
              </style>
            </head>
            <body>
              <h2>${selectedPlanForPay.grade}-класс: ${selectedPlanForPay.title}</h2>
              <hr><br>
              <div class="content">${selectedPlanForPay.content}</div>
            </body>
          </html>
        `);
        closeModal('payModal');
      }
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function openAuthModal() {
      document.getElementById('authStatusMsg').innerText = '';
      document.getElementById('authEmail').value = '';
      document.getElementById('authPassword').value = '';
      document.getElementById('authModal').style.display = 'flex';
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const userLogin = document.getElementById('authEmail').value.trim();
      const userPass = document.getElementById('authPassword').value.trim();
      const statusMsg = document.getElementById('authStatusMsg');

      if (userLogin === ADMIN_LOGIN && userPass === ADMIN_PASS) {
        isAdminLoggedIn = true;
        closeModal('authModal');
        document.getElementById('adminModal').style.display = 'flex';
        filterPlans();
      } else {
        statusMsg.innerText = "Логин же пароль туура эмес!";
      }
    }

    // Сабак планын катып калуусуз кошуу (Safe Async Handler)
    async function addNewPlan(e) {
      e.preventDefault();

      const btnSave = document.getElementById('btnSavePlan');
      const originalBtnText = btnSave.innerText;

      const grade = document.getElementById('newGrade').value;
      const title = document.getElementById('newTitle').value.trim();
      const content = document.getElementById('newContent').value.trim();

      if (!title || !content) {
        alert("Сураныч, сабактын темасын жана мазмунун киргизиңиз!");
        return;
      }

      btnSave.disabled = true;
      btnSave.innerText = "Базага жазылууда...";

      const newPlanData = {
        grade: grade,
        title: title,
        content: content,
        price: 10,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      try {
        // Firebase'ге сактоо
        await plansRef.push(newPlanData);
        alert("Сабактын планы глобалдуу базага ийгиликтүү кошулду!");
        closeModal('adminModal');
        document.getElementById('newTitle').value = '';
        document.getElementById('newContent').value = '';
      } catch (err) {
        console.error("Firebase Error:", err);
        alert("Базага сактоодо ката чыкты: " + err.message);
      } finally {
        btnSave.disabled = false;
        btnSave.innerText = originalBtnText;
      }
    }

    // Админ тарабынан планды базадан өчүрүү
    function deletePlan(planId) {
      if (!isAdminLoggedIn) return;
      if (confirm("Бул сабактын планын базадан өчүрүүнү каалайсызбы?")) {
        plansRef.child(planId).remove()
          .then(() => alert("План базадан өчүрүлдү!"))
          .catch(err => alert("Өчүрүүдө ката чыкты: " + err.message));
      }
    }

    window.onload = () => {
      listenGlobalPlans();
      changeLanguage('ky');
    };
  </script>
</body>
</html>
