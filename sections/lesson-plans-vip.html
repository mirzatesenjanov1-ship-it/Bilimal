<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilimal.org - VIP Сабак пландары жана Админ Панель</title>
  
  <!-- Firebase SDK Standard Imports -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e293b;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-gold);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-panel {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-email {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-logout {
      background-color: #334155;
      color: var(--text-main);
    }

    .btn-logout:hover {
      background-color: #475569;
    }

    .btn-approve {
      background-color: var(--accent-green);
      color: white;
    }

    .btn-approve:hover {
      background-color: #059669;
    }

    .btn-revoke {
      background-color: var(--accent-gold);
      color: white;
    }

    .btn-revoke:hover {
      background-color: #d97706;
    }

    .btn-delete {
      background-color: var(--accent-red);
      color: white;
    }

    .btn-delete:hover {
      background-color: #dc2626;
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .admin-section {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 1.3rem;
      margin-bottom: 1.2rem;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-pending {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold);
    }

    .status-approved {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
    }

    .actions-cell {
      display: flex;
      gap: 8px;
    }

    .loading-spinner {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">
      🎓 Bilimal.org
    </a>
    <div class="user-panel" id="userPanel">
      <span class="user-email" id="userEmailDisplay">Жүктөлүүдө...</span>
      <button class="btn btn-logout" onclick="handleLogout()">Чыгуу</button>
    </div>
  </header>

  <main>
    <section class="admin-section">
      <h2 class="section-title">🎫 Төлөм арыздары жана Уруксаттар</h2>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Тариф</th>
              <th>Сумма</th>
              <th>Статус</th>
              <th>Аракеттер</th>
            </tr>
          </thead>
          <tbody id="applicationsTableBody">
            <tr>
              <td colspan="5" class="loading-spinner">Арыздар жүктөлүүдө...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // Firebase Config (Bilimal.org Firebase Доболу)
    const firebaseConfig = {
      apiKey: "AIzaSyB_YOUR_API_KEY_HERE",
      authDomain: "bilimal-org.firebaseapp.com",
      databaseURL: "https://bilimal-org-default-rtdb.firebaseio.com",
      projectId: "bilimal-org",
      storageBucket: "bilimal-org.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;

    // Authentication Observer
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById('userEmailDisplay').textContent = user.email;
        loadAdminPaymentsTable();
      } else {
        window.location.href = "/login.html";
      }
    });

    function handleLogout() {
      auth.signOut().then(() => {
        window.location.href = "/login.html";
      });
    }

    // Email даректи Firebase Key катары колдонуу үчүн тазалоо функциясы
    function encodeEmail(email) {
      return email.replace(/\./g, ',').toLowerCase();
    }

    // Төлөм арыздарын Realtime Database аркылуу жүктөө
    function loadAdminPaymentsTable() {
      const tbody = document.getElementById('applicationsTableBody');
      
      db.ref('applications').on('value', (snapshot) => {
        const data = snapshot.val();
        tbody.innerHTML = '';

        if (!data) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">Арыздар табылган жок.</td></tr>';
          return;
        }

        Object.keys(data).forEach((appId) => {
          const app = data[appId];
          const tr = document.createElement('tr');

          const isApproved = app.status === 'approved';
          const statusHTML = isApproved 
            ? `<span class="status-badge status-approved">✅ Ырасталган</span>`
            : `<span class="status-badge status-pending">⏳ Күтүүдө</span>`;

          const targetUid = app.uid || app.userId || '';
          const targetEmail = app.email || '';

          const actionBtn = isApproved
            ? `<button class="btn btn-revoke" onclick="revokePayment('${appId}', '${targetUid}', '${targetEmail}')">Уруксатты кайтаруу</button>`
            : `<button class="btn btn-approve" onclick="approvePayment('${appId}', '${targetUid}', '${targetEmail}')">Уруксат берүү (VIP)</button>`;

          tr.innerHTML = `
            <td>${app.email || 'Көрсөтүлгөн эмес'}</td>
            <td>${app.plan || app.tariff || '1 ай'}</td>
            <td><strong style="color: var(--accent-gold);">${app.amount || '200'} сом</strong></td>
            <td>${statusHTML}</td>
            <td class="actions-cell">
              ${actionBtn}
              <button class="btn btn-delete" onclick="deleteApplication('${appId}')">🗑 Өчүрүү</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }, (error) => {
        console.error("Data Load Error:", error);
        tbody.innerHTML = `<tr><td colspan="5" style="color: var(--accent-red); text-align: center;">Ката пайда болду: ${error.message}</td></tr>`;
      });
    }

    // VIP уруксатын берүү (Эрежелердеги "vip_users" жана "applications" түйүндөрүнө туураланган)
    async function approvePayment(appId, targetUid, targetEmail) {
      if (!currentUser) {
        alert("Авторизациядан өтүңүз!");
        return;
      }

      try {
        const now = new Date().toISOString();
        const vipData = {
          active: true,
          grantedAt: now,
          grantedBy: currentUser.email,
          email: targetEmail
        };

        // 1. "vip_users" түйүнүнө UID боюнча сактоо (эгер бар болсо)
        if (targetUid && targetUid !== 'undefined' && targetUid !== 'null' && targetUid !== '') {
          await db.ref(`vip_users/${targetUid}`).set(vipData);
        }

        // 2. Email боюнча да "vip_users" түйүнүнө сактоо (эгер UID жок же дал келбесе)
        if (targetEmail) {
          const encodedEmail = encodeEmail(targetEmail);
          await db.ref(`vip_users/by_email/${encodedEmail}`).set(vipData);
        }

        // 3. "applications" түйүнүндө арыздын статусун жаңыртуу (.write: true уруксаты бар)
        await db.ref(`applications/${appId}`).update({ 
          status: 'approved',
          approvedAt: now,
          approvedBy: currentUser.email
        });

        alert("Колдонуучуга VIP уруксаты ийгиликтүү берилди!");
      } catch (e) {
        console.error("Approve Payment Error:", e);
        alert("Ката пайда болду: " + e.message);
      }
    }

    // VIP уруксатын кайтаруу
    async function revokePayment(appId, targetUid, targetEmail) {
      if (!confirm("Бул колдонуучунун VIP уруксатын кайра алууну каалайсызбы?")) return;

      try {
        // 1. "vip_users" түйүнүнөн UID боюнча өчүрүү
        if (targetUid && targetUid !== 'undefined' && targetUid !== 'null' && targetUid !== '') {
          await db.ref(`vip_users/${targetUid}`).remove();
        }

        // 2. "vip_users" түйүнүнөн email боюнча өчүрүү
        if (targetEmail) {
          const encodedEmail = encodeEmail(targetEmail);
          await db.ref(`vip_users/by_email/${encodedEmail}`).remove();
        }

        // 3. "applications" түйүнүндө статусту калыбына келтирүү
        await db.ref(`applications/${appId}`).update({ status: 'pending' });
        alert("VIP уруксаты жокко чыгарылды.");
      } catch (e) {
        console.error("Revoke Payment Error:", e);
        alert("Ката пайда болду: " + e.message);
      }
    }

    // Арызды базадан өчүрүү
    async function deleteApplication(appId) {
      if (!confirm("Арызды өчүрүүнү ырастайсызбы?")) return;

      try {
        await db.ref(`applications/${appId}`).remove();
        alert("Арыз өчүрүлдү.");
      } catch (e) {
        console.error("Delete Error:", e);
        alert("Өчүрүүдө ката: " + e.message);
      }
    }
  </script>
</body>
</html>
