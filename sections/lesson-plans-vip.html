<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планы уроков - Bilimal.org</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      /* Текстти көчүрүүгө бөгөт коюу */
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      padding: 15px;
    }

    /* Header & Navigation */
    .header-bar {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      padding: 12px 20px;
      border-radius: 14px;
      border: 1px solid #1f2937;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f59e0b;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lang-select {
      background: #1f2937;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .admin-btn {
      background: linear-gradient(90deg, #f59e0b, #d97706);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Издөө жана Фильтр */
    .controls-container {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: #111827;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #1f2937;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    .filter-select {
      padding: 10px 15px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      width: auto;
    }

    /* Grid layout */
    .plans-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .plan-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .plan-card:hover {
      transform: translateY(-3px);
      border-color: #38bdf8;
    }

    .card-badge {
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #f3f4f6;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .preview-container {
      width: 100%;
      height: 260px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #374151;
      margin-bottom: 15px;
      position: relative;
    }

    .preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .iframe-overlay-blocker {
      position: absolute;
      top: 0;
      right: 0;
      width: 55px;
      height: 55px;
      background: transparent;
      z-index: 10;
    }

    .download-btn {
      width: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .download-btn:hover {
      opacity: 0.9;
    }

    .price-tag {
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    /* Modal Layouts */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-content {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      padding: 22px;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #9ca3af;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .qr-box {
      background: #ffffff;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
      margin: 12px 0;
    }

    .qr-box img {
      width: 180px;
      height: 180px;
      object-fit: contain;
    }

    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .submit-btn {
      width: 100%;
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #9ca3af;
    }

    @media (max-width: 600px) {
      .header-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .user-controls {
        justify-content: space-between;
      }
      .controls-container {
        flex-direction: column;
      }
      .filter-select {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header-bar">
    <a href="/" class="brand-logo">
      <i class="fa-solid fa-graduation-cap"></i> Bilimal.org
    </a>
    
    <div class="user-controls">
      <div style="font-size: 0.85rem; color: #10b981; font-weight: 500;" id="txtOpenBase">
        <i class="fa-solid fa-lock-open"></i> Открытая база
      </div>

      <!-- Тил которуу -->
      <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
        <option value="ru" selected>Русский</option>
        <option value="ky">Кыргызча</option>
        <option value="en">English</option>
      </select>

      <button class="admin-btn" onclick="openAuthModal()">
        <i class="fa-solid fa-user-shield"></i> <span id="txtAdminBtn">Админ Панель</span>
      </button>
    </div>
  </header>

  <!-- Издөө жана Фильтр -->
  <div class="controls-container">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск по теме урока..." oninput="filterPlans()">
    </div>
    
    <select id="gradeFilter" class="filter-select" onchange="filterPlans()">
      <option value="all" id="optAllGrades">Все классы</option>
      <option value="5">5 класс</option>
      <option value="6">6 класс</option>
      <option value="7">7 класс</option>
      <option value="8">8 класс</option>
      <option value="9">9 класс</option>
      <option value="10">10 класс</option>
      <option value="11">11 класс</option>
    </select>
  </div>

  <!-- Пландардын сеткасы -->
  <main class="plans-grid" id="plansContainer"></main>

  <!-- Төлөм Модалы -->
  <div class="modal-overlay" id="payModal">
    <div class="modal-content" style="text-align: center;">
      <i class="fa-solid fa-xmark close-modal" onclick="closeModal('payModal')"></i>
      <h3 style="color: #fff; margin-bottom: 8px;" id="txtModalHeader">Скачать план урока</h3>
      <p style="font-size: 0.85rem; color: #9ca3af;" id="modalPlanTitle">Тема...</p>
      
      <div class="qr-box">
        <img src="/qrmbank.png" alt="MBANK QR">
      </div>

      <div style="font-size: 1.1rem; font-weight: bold; color: #10b981;" id="txtModalPrice">
        Сумма к оплате: 10 сом
      </div>
      <p style="font-size: 0.8rem; color: #9ca3af; margin-top: 5px;" id="txtModalDesc">
        Отсканируйте QR-код через приложение MBANK и переведите 10 сом.
      </p>

      <button class="submit-btn" style="background: #10b981; color: #fff; margin-top: 15px;" onclick="confirmPayment()">
        <i class="fa-solid fa-download"></i> <span id="txtConfirmPay">Оплачено, скачать файл</span>
      </button>
    </div>
  </div>

  <!-- АДМИН КИРҮҮ МОДАЛЫ -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-content">
      <i class="fa-solid fa-xmark close-modal" onclick="closeModal('authModal')"></i>
      <h3 style="color: #f59e0b; margin-bottom: 15px;"><i class="fa-solid fa-lock"></i> Вход для Администратора</h3>
      
      <form onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label>Логин:</label>
          <input type="text" id="authEmail" required placeholder="Введите логин">
        </div>

        <div class="form-group">
          <label>Пароль:</label>
          <input type="password" id="authPassword" required placeholder="Введите пароль">
        </div>

        <div id="authStatusMsg" style="font-size: 0.85rem; color: #ef4444; margin-bottom: 10px;"></div>

        <button type="submit" class="submit-btn">Войти в панель</button>
      </form>
    </div>
  </div>

  <!-- АДМИН БАШКАРУУ МОДАЛЫ -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-content">
      <i class="fa-solid fa-xmark close-modal" onclick="closeModal('adminModal')"></i>
      <h3 style="color: #f59e0b; margin-bottom: 15px;" id="txtAdminTitle"><i class="fa-solid fa-plus-circle"></i> Добавить новый план</h3>
      
      <form onsubmit="addNewPlan(event)">
        <div class="form-group">
          <label id="lblGrade">Выберите класс:</label>
          <select id="newGrade" required>
            <option value="5">5 класс</option>
            <option value="6">6 класс</option>
            <option value="7">7 класс</option>
            <option value="8">8 класс</option>
            <option value="9">9 класс</option>
            <option value="10">10 класс</option>
            <option value="11">11 класс</option>
          </select>
        </div>

        <div class="form-group">
          <label id="lblTitle">Тема урока:</label>
          <input type="text" id="newTitle" placeholder="Например: Второй закон Ньютона" required>
        </div>

        <div class="form-group">
          <label id="lblUrl">Ссылка Google Drive:</label>
          <input type="url" id="newDriveUrl" placeholder="https://drive.google.com/file/d/... же папка шилтемеси" required>
        </div>

        <button type="submit" class="submit-btn" id="btnSavePlan">Добавить в базу</button>
      </form>
    </div>
  </div>

  <script>
    // ===============================================
    // F12 ЖАНА КОДДУ ИНСПЕКТИРОВАНИЕ КЫЛУУГА БӨГӨТ
    // ===============================================
    document.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('keydown', function(e) {
      // F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+S
      if (
        e.keyCode === 123 || 
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
        (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))
      ) {
        e.preventDefault();
        return false;
      }
    });

    // ===============================================
    // АДМИН ЛОГИН/ПАРОЛЬ
    // ===============================================
    const ADMIN_LOGIN = "admin";
    const ADMIN_PASS = "bilimal2026";

    // Google Drive шилтемесин универсалдуу иштетүүчү функция (файл болсо да, папка болсо да)
    function parseGoogleDriveUrl(url) {
      if (!url) return { previewUrl: '', downloadUrl: '#' };

      // Файл ID алуу (/d/ID_HERE)
      let fileMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (fileMatch && fileMatch[1]) {
        const fileId = fileMatch[1];
        return {
          previewUrl: `https://drive.google.com/file/d/${fileId}/preview`,
          downloadUrl: `https://drive.google.com/uc?export=download&id=${fileId}`
        };
      }

      // Папка ID алуу (/folders/ID_HERE)
      let folderMatch = url.match(/\/folders\/([a-zA-Z0-9_-]+)/);
      if (folderMatch && folderMatch[1]) {
        const folderId = folderMatch[1];
        return {
          previewUrl: `https://drive.google.com/embeddedfolderview?id=${folderId}#grid`,
          downloadUrl: `https://drive.google.com/drive/folders/${folderId}`
        };
      }

      // Эгер id= параметр катары келсе
      let idParamMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (idParamMatch && idParamMatch[1]) {
        const id = idParamMatch[1];
        return {
          previewUrl: `https://drive.google.com/file/d/${id}/preview`,
          downloadUrl: `https://drive.google.com/uc?export=download&id=${id}`
        };
      }

      return {
        previewUrl: url,
        downloadUrl: url
      };
    }

    // Бардык колдонуучуларга көрүнө турган дефолттук сабак пландары
    const initialLessonPlans = [
      {
        id: "plan_10_1",
        grade: "10",
        title: "Векторлор. Векторлорду кошуу жана кемитүү",
        previewUrl: "https://drive.google.com/file/d/1_EX_ID_HERE/preview",
        downloadUrl: "https://drive.google.com/uc?export=download&id=1_EX_ID_HERE",
        price: 10
      },
      {
        id: "plan_10_2",
        grade: "10",
        title: "Түз сызыктуу бир калыптагы ылдамдатылган кыймыл. Ылдамдануу",
        previewUrl: "https://drive.google.com/file/d/1_EX_ID_HERE/preview",
        downloadUrl: "https://drive.google.com/uc?export=download&id=1_EX_ID_HERE",
        price: 10
      },
      {
        id: "plan_10_3",
        grade: "10",
        title: "Түз сызыктуу бир калыпта эмес кыймыл",
        previewUrl: "https://drive.google.com/file/d/1_EX_ID_HERE/preview",
        downloadUrl: "https://drive.google.com/uc?export=download&id=1_EX_ID_HERE",
        price: 10
      },
      {
        id: "plan_10_4",
        grade: "10",
        title: "Түз сызыктуу бир калыптагы кыймыл",
        previewUrl: "https://drive.google.com/file/d/1_EX_ID_HERE/preview",
        downloadUrl: "https://drive.google.com/uc?export=download&id=1_EX_ID_HERE",
        price: 10
      }
    ];

    // LocalStorage маалыматтарын туура жуктоо
    let storedPlans = JSON.parse(localStorage.getItem('bilimal_plans_v2'));
    let lessonPlans = (storedPlans && storedPlans.length > 0) ? storedPlans : initialLessonPlans;

    // Сөздүк
    const translations = {
      ru: {
        openBase: '<i class="fa-solid fa-lock-open"></i> Открытая база',
        adminBtn: 'Админ Панель',
        searchPlaceholder: 'Поиск по теме урока...',
        allGrades: 'Все классы',
        gradeSuffix: 'класс',
        downloadWord: 'Скачать Word',
        modalHeader: 'Скачать план урока',
        modalPrice: 'Сумма к оплате: 10 сом',
        modalDesc: 'Отсканируйте QR-код через приложение MBANK и переведите 10 сом.',
        confirmPay: 'Оплачено, скачать файл',
        adminTitle: '<i class="fa-solid fa-plus-circle"></i> Добавить новый план',
        lblGrade: 'Выберите класс:',
        lblTitle: 'Тема урока:',
        lblUrl: 'Ссылка Google Drive:',
        btnSavePlan: 'Добавить в базу',
        emptyMsg: 'Планы уроков пока не добавлены.',
        paySuccess: 'Оплата принята! Начинается скачивание файла...',
        urlError: 'Пожалуйста, введите корректную ссылку Google Drive!'
      },
      ky: {
        openBase: '<i class="fa-solid fa-lock-open"></i> Ачык база',
        adminBtn: 'Админ Панель',
        searchPlaceholder: 'Сабактын темасы боюнча издөө...',
        allGrades: 'Бардык класстар',
        gradeSuffix: 'класс',
        downloadWord: 'Word көчүрүү',
        modalHeader: 'Сабак планын жүктөө',
        modalPrice: 'Төлөнүүчү сумма: 10 сом',
        modalDesc: 'MBANK колдонмосу аркылуу QR-кодду сканерлеп 10 сом которуңуз.',
        confirmPay: 'Төлөдүм, файлды жүктөө',
        adminTitle: '<i class="fa-solid fa-plus-circle"></i> Жаңы сабак планын кошуу',
        lblGrade: 'Классты тандаңыз:',
        lblTitle: 'Сабактын темасы:',
        lblUrl: 'Google Drive Шилтемеси:',
        btnSavePlan: 'Базага кошуу',
        emptyMsg: 'Сабак пландары азырынча кошула элек.',
        paySuccess: 'Төлөм кабыл алынды! Файлды жүктөө башталууда...',
        urlError: 'Сураныч, туура Google Drive шилтемесин киргизиңиз!'
      },
      en: {
        openBase: '<i class="fa-solid fa-lock-open"></i> Public Database',
        adminBtn: 'Admin Panel',
        searchPlaceholder: 'Search lesson topic...',
        allGrades: 'All grades',
        gradeSuffix: 'grade',
        downloadWord: 'Download Word',
        modalHeader: 'Download Lesson Plan',
        modalPrice: 'Amount due: 10 SOM',
        modalDesc: 'Scan QR code via MBANK app and transfer 10 SOM.',
        confirmPay: 'Paid, download file',
        adminTitle: '<i class="fa-solid fa-plus-circle"></i> Add New Plan',
        lblGrade: 'Select Grade:',
        lblTitle: 'Lesson Topic:',
        lblUrl: 'Google Drive Link:',
        btnSavePlan: 'Add to Database',
        emptyMsg: 'No lesson plans added yet.',
        paySuccess: 'Payment accepted! Downloading file...',
        urlError: 'Please enter a valid Google Drive URL!'
      }
    };

    let currentLang = 'ru';
    let selectedPlanForPay = null;

    function changeLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.getElementById('txtOpenBase').innerHTML = t.openBase;
      document.getElementById('txtAdminBtn').innerText = t.adminBtn;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('optAllGrades').innerText = t.allGrades;
      document.getElementById('txtModalHeader').innerText = t.modalHeader;
      document.getElementById('txtModalPrice').innerText = t.modalPrice;
      document.getElementById('txtModalDesc').innerText = t.modalDesc;
      document.getElementById('txtConfirmPay').innerText = t.confirmPay;
      document.getElementById('txtAdminTitle').innerHTML = t.adminTitle;
      document.getElementById('lblGrade').innerText = t.lblGrade;
      document.getElementById('lblTitle').innerText = t.lblTitle;
      document.getElementById('lblUrl').innerText = t.lblUrl;
      document.getElementById('btnSavePlan').innerText = t.btnSavePlan;

      filterPlans();
    }

    function renderPlans(plans) {
      const container = document.getElementById('plansContainer');
      const t = translations[currentLang];
      container.innerHTML = '';

      if (!plans || plans.length === 0) {
        container.innerHTML = `<div class="empty-msg"><i class="fa-solid fa-folder-open" style="font-size: 2rem; margin-bottom: 10px;"></i><br>${t.emptyMsg}</div>`;
        return;
      }

      plans.forEach(plan => {
        const card = document.createElement('div');
        card.className = 'plan-card';
        card.innerHTML = `
          <div>
            <span class="card-badge">${plan.grade}-${t.gradeSuffix}</span>
            <h3 class="card-title">${plan.title}</h3>
            
            <div class="preview-container">
              <div class="iframe-overlay-blocker"></div>
              <iframe class="preview-iframe" src="${plan.previewUrl}" loading="lazy"></iframe>
            </div>
          </div>

          <button class="download-btn" onclick="openPaymentModal('${plan.id}')">
            <i class="fa-solid fa-file-word"></i> ${t.downloadWord} 
            <span class="price-tag">${plan.price} сом</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function filterPlans() {
      const searchValue = document.getElementById('searchInput').value.toLowerCase();
      const selectedGrade = document.getElementById('gradeFilter').value;

      const filtered = lessonPlans.filter(plan => {
        const matchesSearch = plan.title.toLowerCase().includes(searchValue);
        const matchesGrade = selectedGrade === 'all' || plan.grade === selectedGrade;
        return matchesSearch && matchesGrade;
      });

      renderPlans(filtered);
    }

    function openPaymentModal(planId) {
      selectedPlanForPay = lessonPlans.find(p => p.id === planId);
      if (!selectedPlanForPay) return;

      const t = translations[currentLang];
      document.getElementById('modalPlanTitle').innerText = `${selectedPlanForPay.grade}-${t.gradeSuffix}: ${selectedPlanForPay.title}`;
      document.getElementById('payModal').style.display = 'flex';
    }

    function confirmPayment() {
      if (selectedPlanForPay) {
        alert(translations[currentLang].paySuccess);
        window.open(selectedPlanForPay.downloadUrl, '_blank');
        closeModal('payModal');
      }
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function openAuthModal() {
      document.getElementById('authStatusMsg').innerText = '';
      document.getElementById('authEmail').value = '';
      document.getElementById('authPassword').value = '';
      document.getElementById('authModal').style.display = 'flex';
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const userLogin = document.getElementById('authEmail').value.trim();
      const userPass = document.getElementById('authPassword').value.trim();
      const statusMsg = document.getElementById('authStatusMsg');

      if (userLogin === ADMIN_LOGIN && userPass === ADMIN_PASS) {
        closeModal('authModal');
        document.getElementById('adminModal').style.display = 'flex';
      } else {
        statusMsg.innerText = "Неверный логин или пароль! Доступ запрещен.";
      }
    }

    // Жаңы сабак планын кошуу
    function addNewPlan(e) {
      e.preventDefault();

      const grade = document.getElementById('newGrade').value;
      const title = document.getElementById('newTitle').value;
      const rawUrl = document.getElementById('newDriveUrl').value;

      const parsedDrive = parseGoogleDriveUrl(rawUrl);

      if (!parsedDrive.previewUrl || parsedDrive.previewUrl === rawUrl && !rawUrl.includes('drive.google.com')) {
        alert(translations[currentLang].urlError);
        return;
      }

      const newPlan = {
        id: "plan_" + Date.now(),
        grade: grade,
        title: title,
        previewUrl: parsedDrive.previewUrl,
        downloadUrl: parsedDrive.downloadUrl,
        price: 10
      };

      lessonPlans.unshift(newPlan);
      localStorage.setItem('bilimal_plans_v2', JSON.stringify(lessonPlans));

      renderPlans(lessonPlans);
      closeModal('adminModal');

      document.getElementById('newTitle').value = '';
      document.getElementById('newDriveUrl').value = '';
      alert("План успешно добавлен!");
    }

    window.onload = () => {
      changeLanguage('ru');
    };
  </script>
</body>
</html>
