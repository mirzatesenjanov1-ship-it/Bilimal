<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilimal.org - VIP Сабак пландары жана Төлөмдөрдү Башкаруу</title>
  
  <!-- Firebase SDK Standard Imports (v8.10.1) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e293b;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-gold);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-panel {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-email {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .badge-vip {
      background-color: rgba(245, 158, 11, 0.2);
      color: var(--accent-gold);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      border: 1px solid var(--accent-gold);
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.1s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-logout {
      background-color: #334155;
      color: var(--text-main);
    }

    .btn-logout:hover {
      background-color: #475569;
    }

    .btn-approve {
      background-color: var(--accent-green);
      color: white;
    }

    .btn-approve:hover {
      background-color: #059669;
    }

    .btn-revoke {
      background-color: var(--accent-gold);
      color: white;
    }

    .btn-revoke:hover {
      background-color: #d97706;
    }

    .btn-delete {
      background-color: var(--accent-red);
      color: white;
    }

    .btn-delete:hover {
      background-color: #dc2626;
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: white;
    }

    .btn-primary:hover {
      background-color: #2563eb;
    }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .admin-section {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 1.3rem;
      margin-bottom: 1.2rem;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-pending {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold);
    }

    .status-approved {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
    }

    .actions-cell {
      display: flex;
      gap: 8px;
    }

    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .plan-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .plan-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .plan-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .plan-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .locked-card {
      opacity: 0.6;
      filter: grayscale(0.5);
    }

    .loading-spinner {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }

    .auth-warning {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--accent-red);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">
      🎓 Bilimal.org
    </a>
    <div class="user-panel" id="userPanel">
      <span class="user-email" id="userEmailDisplay">Авторизация текшерилүүдө...</span>
      <span id="vipBadge" style="display: none;" class="badge-vip">⭐ VIP</span>
      <button class="btn btn-logout" id="authBtn" onclick="handleAuthAction()">Чыгуу</button>
    </div>
  </header>

  <main>
    <div id="authWarningBlock" class="auth-warning" style="display: none;">
      ⚠️ Сиз аккаунтка кире элексиз. Маалыматтарды көрүү жана башкаруу үчүн тизимге кириңиз.
      <br><br>
      <a href="/login.html" class="btn btn-primary">Кирүү барагына өтүү</a>
    </div>

    <!-- 1. VIP Төлөм Арыздарын Башкаруу (Админ Бөлүгү) -->
    <section class="admin-section">
      <h2 class="section-title">🎫 VIP Төлөм арыздары жана Уруксаттар</h2>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Тариф</th>
              <th>Сумма</th>
              <th>Статус</th>
              <th>Аракеттер</th>
            </tr>
          </thead>
          <tbody id="applicationsTableBody">
            <tr>
              <td colspan="5" class="loading-spinner">Жүктөлүүдө...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 2. VIP Сабак Пландары Бөлүгү -->
    <section class="admin-section">
      <h2 class="section-title">📚 VIP Сабак Пландары</h2>
      <div id="plansContainer" class="plans-grid">
        <div class="loading-spinner" style="grid-column: 1 / -1;">Сабак пландары жүктөлүүдө...</div>
      </div>
    </section>
  </main>

  <script>
    // Firebase Конфигурациясы (Чыныгы ачкычтарыңызды ушул жерге коюңуз)
    const firebaseConfig = {
      apiKey: "AIzaSyB_YOUR_API_KEY_HERE",
      authDomain: "bilimal-org.firebaseapp.com",
      databaseURL: "https://bilimal-org-default-rtdb.firebaseio.com",
      projectId: "bilimal-org",
      storageBucket: "bilimal-org.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let isUserVip = false;

    // Сессияны браузерде туруктуу сактоо
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    // Authentication Observer (Автоматтык чексиз багыттоо токтотулду)
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById('userEmailDisplay').textContent = user.email;
        document.getElementById('authBtn').textContent = 'Чыгуу';
        document.getElementById('authWarningBlock').style.display = 'none';
        
        checkVipStatus(user.uid, user.email);
        loadAdminPaymentsTable();
        loadLessonPlans();
      } else {
        currentUser = null;
        document.getElementById('userEmailDisplay').textContent = "Кирген жоксуз";
        document.getElementById('authBtn').textContent = 'Кирүү';
        document.getElementById('authWarningBlock').style.display = 'block';
        
        document.getElementById('applicationsTableBody').innerHTML = 
          '<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">Маалыматтарды көрүү үчүн аккаунтка кириңиз.</td></tr>';
        document.getElementById('plansContainer').innerHTML = 
          '<p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center;">Сабак пландарын көрүү үчүн авторизациядан өтүңүз.</p>';
      }
    });

    function handleAuthAction() {
      if (currentUser) {
        auth.signOut().then(() => {
          window.location.href = "/login.html";
        });
      } else {
        window.location.href = "/login.html";
      }
    }

    function encodeEmail(email) {
      if (!email) return '';
      return email.replace(/\./g, ',').toLowerCase();
    }

    // Колдонуучунун VIP статусун текшерүү
    function checkVipStatus(uid, email) {
      db.ref(`vip_users/${uid}`).on('value', (snapshot) => {
        const vipData = snapshot.val();
        if (vipData && vipData.active) {
          isUserVip = true;
          document.getElementById('vipBadge').style.display = 'inline-block';
        } else {
          const encoded = encodeEmail(email);
          if (encoded) {
            db.ref(`vip_users/by_email/${encoded}`).once('value', (eSnap) => {
              const eVal = eSnap.val();
              if (eVal && eVal.active) {
                isUserVip = true;
                document.getElementById('vipBadge').style.display = 'inline-block';
              } else {
                isUserVip = false;
                document.getElementById('vipBadge').style.display = 'none';
              }
              loadLessonPlans();
            });
          }
        }
      });
    }

    // Төлөм арыздарын жүктөө
    function loadAdminPaymentsTable() {
      if (!currentUser) return;
      const tbody = document.getElementById('applicationsTableBody');
      
      db.ref('applications').on('value', (snapshot) => {
        const data = snapshot.val();
        tbody.innerHTML = '';

        if (!data) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">Арыздар табылган жок.</td></tr>';
          return;
        }

        Object.keys(data).forEach((appId) => {
          const app = data[appId];
          const tr = document.createElement('tr');

          const isApproved = app.status === 'approved';
          const statusHTML = isApproved 
            ? `<span class="status-badge status-approved">✅ Ырасталган</span>`
            : `<span class="status-badge status-pending">⏳ Күтүүдө</span>`;

          const targetUid = app.uid || app.userId || '';
          const targetEmail = app.email || '';

          const actionBtn = isApproved
            ? `<button class="btn btn-revoke" onclick="revokePayment('${appId}', '${targetUid}', '${targetEmail}')">Уруксатты кайтаруу</button>`
            : `<button class="btn btn-approve" onclick="approvePayment('${appId}', '${targetUid}', '${targetEmail}')">Уруксат берүү (VIP)</button>`;

          tr.innerHTML = `
            <td>${app.email || 'Көрсөтүлгөн эмес'}</td>
            <td>${app.plan || app.tariff || '1 ай'}</td>
            <td><strong style="color: var(--accent-gold);">${app.amount || '200'} сом</strong></td>
            <td>${statusHTML}</td>
            <td class="actions-cell">
              ${actionBtn}
              <button class="btn btn-delete" onclick="deleteApplication('${appId}')">🗑 Өчүрүү</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }, (error) => {
        console.error("Applications Read Error:", error);
        tbody.innerHTML = `<tr><td colspan="5" style="color: var(--accent-red); text-align: center;">Ката пайда болду: ${error.message}</td></tr>`;
      });
    }

    // VIP уруксатын берүү
    async function approvePayment(appId, targetUid, targetEmail) {
      if (!currentUser) {
        alert("Авторизациядан өтүңүз!");
        return;
      }

      try {
        const now = new Date().toISOString();
        const vipData = {
          active: true,
          grantedAt: now,
          grantedBy: currentUser.email,
          email: targetEmail
        };

        if (targetUid && targetUid !== 'undefined' && targetUid !== 'null' && targetUid !== '') {
          await db.ref(`vip_users/${targetUid}`).set(vipData);
        }

        if (targetEmail) {
          const encodedEmail = encodeEmail(targetEmail);
          if (encodedEmail) {
            await db.ref(`vip_users/by_email/${encodedEmail}`).set(vipData);
          }
        }

        await db.ref(`applications/${appId}`).update({ 
          status: 'approved',
          approvedAt: now,
          approvedBy: currentUser.email
        });

        alert("Колдонуучуга VIP уруксаты ийгиликтүү берилди!");
      } catch (e) {
        console.error("Approve Payment Error:", e);
        alert("Ката пайда болду: " + e.message);
      }
    }

    // VIP уруксатын жокко чыгаруу
    async function revokePayment(appId, targetUid, targetEmail) {
      if (!confirm("Бул колдонуучунун VIP уруксатын кайра алууну каалайсызбы?")) return;

      try {
        if (targetUid && targetUid !== 'undefined' && targetUid !== 'null' && targetUid !== '') {
          await db.ref(`vip_users/${targetUid}`).remove();
        }

        if (targetEmail) {
          const encodedEmail = encodeEmail(targetEmail);
          if (encodedEmail) {
            await db.ref(`vip_users/by_email/${encodedEmail}`).remove();
          }
        }

        await db.ref(`applications/${appId}`).update({ status: 'pending' });
        alert("VIP уруксаты жокко чыгарылды.");
      } catch (e) {
        console.error("Revoke Payment Error:", e);
        alert("Ката пайда болду: " + e.message);
      }
    }

    // Арызды өчүрүү
    async function deleteApplication(appId) {
      if (!confirm("Арызды өчүрүүнү ырастайсызбы?")) return;

      try {
        await db.ref(`applications/${appId}`).remove();
        alert("Арыз өчүрүлдү.");
      } catch (e) {
        console.error("Delete Application Error:", e);
        alert("Өчүрүүдө ката: " + e.message);
      }
    }

    // Сабак пландарын жүктөө
    function loadLessonPlans() {
      if (!currentUser) return;
      const container = document.getElementById('plansContainer');

      db.ref('lesson_plans').on('value', (snapshot) => {
        const plans = snapshot.val();
        container.innerHTML = '';

        if (!plans) {
          container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center;">Азырынча сабак пландары жок.</p>';
          return;
        }

        Object.keys(plans).forEach((planId) => {
          const plan = plans[planId];
          const isVipOnly = plan.isVip === true;
          const canAccess = !isVipOnly || isUserVip;

          const card = document.createElement('div');
          card.className = `plan-card ${!canAccess ? 'locked-card' : ''}`;

          const actionButton = canAccess
            ? `<a href="${plan.fileUrl || '#'}" target="_blank" class="btn btn-primary" style="text-align: center;">📄 Жүктөп алуу</a>`
            : `<button class="btn btn-revoke" disabled style="opacity: 0.7; cursor: not-allowed;">🔒 VIP гана</button>`;

          card.innerHTML = `
            <div>
              <div class="plan-title">${plan.title || 'Сабак планы'}</div>
              <div class="plan-desc">${plan.description || 'Кеңири маалымат жок'}</div>
            </div>
            <div>
              <div class="plan-meta">Предмет: ${plan.subject || 'Жалпы'} | Класс: ${plan.grade || '-'}</div>
              ${actionButton}
            </div>
          `;

          container.appendChild(card);
        });
      }, (error) => {
        console.error("Lesson Plans Read Error:", error);
        container.innerHTML = `<p style="color: var(--accent-red); grid-column: 1 / -1; text-align: center;">Сабак пландарын жүктөөдө ката: ${error.message}</p>`;
      });
    }
  </script>
</body>
</html>
