<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сабак пландары - Bilimal.org</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }

    /* Навигация / Башкы панель */
    .header-bar {
      max-width: 1200px;
      margin: 0 auto 25px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      padding: 15px 25px;
      border-radius: 14px;
      border: 1px solid #1f2937;
    }

    .brand-logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f59e0b;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .admin-btn {
      background: linear-gradient(90deg, #f59e0b, #d97706);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: none; /* Дефолт боюнча жашыруун, админ киргенде ачылат */
      align-items: center;
      gap: 8px;
    }

    /* Издөө жана Чыпкалоо Панели */
    .controls-container {
      max-width: 1200px;
      margin: 0 auto 25px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      background: #111827;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid #1f2937;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
    }

    .search-input {
      width: 100%;
      padding: 12px 15px 12px 42px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    .filter-select {
      padding: 12px 20px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    /* Сетка */
    .plans-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
    }

    .plan-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .plan-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }

    .card-badge {
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f3f4f6;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .preview-container {
      width: 100%;
      height: 280px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #374151;
      margin-bottom: 15px;
    }

    .preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .download-btn {
      width: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.2s;
    }

    .download-btn:hover {
      opacity: 0.9;
    }

    .price-tag {
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    /* Модалдар (Төлөм жана Админ Панель) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      max-width: 450px;
      width: 100%;
      padding: 25px;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #9ca3af;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .qr-box {
      background: #ffffff;
      padding: 12px;
      border-radius: 12px;
      display: inline-block;
      margin: 15px 0;
    }

    .qr-box img {
      width: 200px;
      height: 200px;
      object-fit: contain;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <!-- Башкы Header -->
  <header class="header-bar">
    <a href="/" class="brand-logo">
      <i class="fa-solid fa-graduation-cap"></i> Bilimal.org
    </a>
    
    <div class="user-controls">
      <div style="font-size: 0.9rem; color: #10b981; font-weight: 500;">
        <i class="fa-solid fa-lock-open"></i> Ачык база
      </div>
      <!-- Тек гана mirzatestebesov51@gmail.com үчүн ачылуучу баскыч -->
      <button id="adminPanelBtn" class="admin-btn" onclick="openAdminModal()">
        <i class="fa-solid fa-gear"></i> Админ Панель
      </button>
    </div>
  </header>

  <!-- Издөө жана Фильтр -->
  <div class="controls-container">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="Сабактын темасы боюнча издөө..." oninput="filterPlans()">
    </div>
    
    <select id="gradeFilter" class="filter-select" onchange="filterPlans()">
      <option value="all">Бардык класстар</option>
      <option value="5">5-класс</option>
      <option value="6">6-класс</option>
      <option value="7">7-класс</option>
      <option value="8">8-класс</option>
      <option value="9">9-класс</option>
      <option value="10">10-класс</option>
      <option value="11">11-класс</option>
    </select>
  </div>

  <!-- Пландардын сеткасы -->
  <main class="plans-grid" id="plansContainer"></main>

  <!-- Төлөм жүргүзүү Модалдык терезеси -->
  <div class="modal-overlay" id="payModal">
    <div class="modal-content" style="text-align: center;">
      <i class="fa-solid fa-xmark close-modal" onclick="closePaymentModal()"></i>
      <h3 style="color: #fff; margin-bottom: 8px;">Сабак планын жүктөө</h3>
      <p style="font-size: 0.85rem; color: #9ca3af;" id="modalPlanTitle">Темасы...</p>
      
      <!-- MBANK QR Сүрөтү -->
      <div class="qr-box">
        <img src="/qrmbank.png" alt="MBANK QR Коду">
      </div>

      <div style="font-size: 1.1rem; font-weight: bold; color: #10b981;">
        Төлөнүүчү сумма: 10 сом
      </div>
      <p style="font-size: 0.8rem; color: #9ca3af; margin-top: 5px;">
        MBANK колдонмосу аркылуу QR-кодду сканерлеп 10 сом которуңуз.
      </p>

      <button class="submit-btn" style="background: #10b981; color: #fff; margin-top: 15px;" onclick="confirmPayment()">
        <i class="fa-solid fa-download"></i> Төлөдүм, файлды жүктөө
      </button>
    </div>
  </div>

  <!-- Эксклюзивдүү Админ Модалдык Панели -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-content">
      <i class="fa-solid fa-xmark close-modal" onclick="closeAdminModal()"></i>
      <h3 style="color: #f59e0b; margin-bottom: 15px;"><i class="fa-solid fa-plus-circle"></i> Жаңы сабак планын кошуу</h3>
      
      <form onsubmit="addNewPlan(event)">
        <div class="form-group">
          <label>Классты тандаңыз:</label>
          <select id="newGrade" required>
            <option value="5">5-класс</option>
            <option value="6">6-класс</option>
            <option value="7">7-класс</option>
            <option value="8">8-класс</option>
            <option value="9">9-класс</option>
            <option value="10">10-класс</option>
            <option value="11">11-класс</option>
          </select>
        </div>

        <div class="form-group">
          <label>Сабактын темасы:</label>
          <input type="text" id="newTitle" placeholder="Мисалы: Ньютондун экинчи закону" required>
        </div>

        <div class="form-group">
          <label>Google Drive Шилтемеси (Ссылка):</label>
          <input type="url" id="newDriveUrl" placeholder="https://drive.google.com/file/d/..." required>
        </div>

        <button type="submit" class="submit-btn">Базага кошуу</button>
      </form>
    </div>
  </div>

  <script>
    // Админдик почта
    const ADMIN_EMAIL = "mirzatestebesov51@gmail.com";

    // Дефолттук маалымат базасы
    let lessonPlans = JSON.parse(localStorage.getItem('bilimal_plans')) || [
      {
        id: "plan_10_01",
        grade: "10",
        title: "Түз сызыктуу бир калыптагы кыймыл",
        previewUrl: "https://drive.google.com/file/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs/preview",
        downloadUrl: "https://drive.google.com/uc?export=download&id=1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs",
        price: 10
      }
    ];

    let selectedPlanForPay = null;

    // 1. Экрандагы сабактарды чагылдыруу
    function renderPlans(plans) {
      const container = document.getElementById('plansContainer');
      container.innerHTML = '';

      if (plans.length === 0) {
        container.innerHTML = `<div class="empty-msg"><i class="fa-solid fa-folder-open" style="font-size: 2rem; margin-bottom: 10px;"></i><br>Сабак пландары табылган жок.</div>`;
        return;
      }

      plans.forEach(plan => {
        const card = document.createElement('div');
        card.className = 'plan-card';
        card.innerHTML = `
          <div>
            <span class="card-badge">${plan.grade}-класс</span>
            <h3 class="card-title">${plan.title}</h3>
            
            <div class="preview-container">
              <iframe class="preview-iframe" src="${plan.previewUrl}"></iframe>
            </div>
          </div>

          <button class="download-btn" onclick="openPaymentModal('${plan.id}')">
            <i class="fa-solid fa-file-word"></i> Word көчүрүү 
            <span class="price-tag">${plan.price} сом</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    // 2. Издөө жана фильтр
    function filterPlans() {
      const searchValue = document.getElementById('searchInput').value.toLowerCase();
      const selectedGrade = document.getElementById('gradeFilter').value;

      const filtered = lessonPlans.filter(plan => {
        const matchesSearch = plan.title.toLowerCase().includes(searchValue);
        const matchesGrade = selectedGrade === 'all' || plan.grade === selectedGrade;
        return matchesSearch && matchesGrade;
      });

      renderPlans(filtered);
    }

    // 3. Төлөм модалын ачуу
    function openPaymentModal(planId) {
      selectedPlanForPay = lessonPlans.find(p => p.id === planId);
      if (!selectedPlanForPay) return;

      document.getElementById('modalPlanTitle').innerText = `${selectedPlanForPay.grade}-класс: ${selectedPlanForPay.title}`;
      document.getElementById('payModal').style.display = 'flex';
    }

    function closePaymentModal() {
      document.getElementById('payModal').style.display = 'none';
    }

    function confirmPayment() {
      if (selectedPlanForPay) {
        alert("Төлөм кабыл алынды! Файлды жүктөө башталууда...");
        window.open(selectedPlanForPay.downloadUrl, '_blank');
        closePaymentModal();
      }
    }

    // 4. Тек гана mirzatestebesov51@gmail.com почтасын текшерүү
    function checkAdminAccess(userEmail) {
      const adminBtn = document.getElementById('adminPanelBtn');
      if (userEmail && userEmail.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        adminBtn.style.display = 'inline-flex';
      } else {
        adminBtn.style.display = 'none';
      }
    }

    // Админ модалын ачуу/жабуу
    function openAdminModal() {
      document.getElementById('adminModal').style.display = 'flex';
    }

    function closeAdminModal() {
      document.getElementById('adminModal').style.display = 'none';
    }

    // 5. Админ Панели аркылуу жаңы план кошуу
    function addNewPlan(e) {
      e.preventDefault();

      const grade = document.getElementById('newGrade').value;
      const title = document.getElementById('newTitle').value;
      const rawUrl = document.getElementById('newDriveUrl').value;

      // Google Drive IDсин ажыратып алуу
      const match = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (!match) {
        alert("Сураныч, туура Google Drive шилтемесин киргизиңиз!");
        return;
      }

      const fileId = match[1];
      const previewUrl = `https://drive.google.com/file/d/${fileId}/preview`;
      const downloadUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;

      const newPlan = {
        id: "plan_" + Date.now(),
        grade: grade,
        title: title,
        previewUrl: previewUrl,
        downloadUrl: downloadUrl,
        price: 10
      };

      lessonPlans.unshift(newPlan);
      localStorage.setItem('bilimal_plans', JSON.stringify(lessonPlans));

      renderPlans(lessonPlans);
      closeAdminModal();

      // Форманы тазалоо
      document.getElementById('newTitle').value = '';
      document.getElementById('newDriveUrl').value = '';

      alert("Жаңы сабак планы ийгиликтүү кошулду!");
    }

    // Баракча жүктөлгөндө
    window.onload = () => {
      renderPlans(lessonPlans);

      // Сайттагы авторизацияланган почтаны текшерүү (Firebase Auth ж.б.)
      // Үлгү катары жергиликтүү сакталган аккаунтту же ушул логиканы текшерет:
      const currentUserEmail = localStorage.getItem('user_email') || "mirzatestebesov51@gmail.com"; 
      checkAdminAccess(currentUserEmail);
    };
  </script>
</body>
</html>
