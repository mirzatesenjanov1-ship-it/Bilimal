<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БилимАл - Онлайн Тест Тапшыруу</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Баштапкы CSS стиль: Тест тапшыруу жана жыйынтык блоктор скрипт жүктөлгөнгө чейин жашыруун турат */
        .hidden, #studentTestingBlock, #studentResultsBlock {
            display: none !important;
        }
        
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .student-container {
            max-width: 900px;
            margin: 0 auto;
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 16px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            box-sizing: border-box;
        }

        button {
            background: #238636;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        button:hover {
            background: #2ea043;
        }

        .matrix-node {
            width: 40px;
            height: 40px;
            margin: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: #21262d;
            cursor: pointer;
        }

        .matrix-node.active {
            border: 2px solid #58a6ff;
        }

        .matrix-node.answered {
            background: #238636;
        }

        #studentToastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div id="studentToastContainer"></div>

    <div class="student-container">
        
        <!-- 1-БЛОК: Авторизация / Каттоо -->
        <div id="studentAuthBlock">
            <h2 id="gateTestTitle">Тестке кош келиңиз</h2>
            <p id="gateTestMeta">Жүктөлүүдө...</p>
            <hr style="border-color: #30363d; margin-bottom: 20px;">
            
            <form id="studentRegistrationForm">
                <label>Окуучунун аты-жөнү *</label>
                <input type="text" id="studentInputName" placeholder="Мисалы: Асанов Үсөн" required>

                <label>Классы *</label>
                <input type="text" id="studentInputClass" placeholder="Мисалы: 10-Б" required>

                <div id="gatePinWrapper" class="hidden">
                    <label>Тесттин PIN-коду *</label>
                    <input type="password" id="studentInputPin" placeholder="Мугалим берген PIN-кодду жазыңыз">
                </div>

                <button type="submit">Тестти баштоо</button>
            </form>
        </div>

        <!-- 2-БЛОК: Тест тапшыруу экраны -->
        <div id="studentTestingBlock" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 10px;">
                <div>
                    <h3 id="runtimeTestTitle" style="margin: 0;">Тест</h3>
                    <small id="runtimeStudentInfo" style="color: #8b949e;"></small>
                </div>
                <div id="hudTimerWidget" style="border: 1px solid #238636; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 18px;">
                    <i class="fa-regular fa-clock"></i> <span id="runtimeCountdown">00:00</span>
                </div>
            </div>

            <!-- Суроолордун матрицасы (HUD) -->
            <div id="studentQuestionsMatrix" style="margin: 15px 0;"></div>

            <!-- Активдүү суроо -->
            <div style="background: #21262d; padding: 20px; border-radius: 8px; margin-top: 15px;">
                <div style="display: flex; justify-content: space-between; color: #58a6ff;">
                    <span id="currentQuestionNumberLabel">Суроо #1</span>
                    <span id="currentQuestionPointsLabel">5 балл</span>
                </div>
                <h3 id="currentQuestionTextContainer" style="margin-top: 10px;">Суроонун тексти...</h3>
                <div id="questionOptionsContainer" style="margin-top: 15px;"></div>
            </div>

            <!-- Навигация топчулары -->
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" id="studentPrevQuestionBtn" style="background: #30363d;">Мурункусу</button>
                <button type="button" id="studentNextQuestionBtn" style="background: #1f6beb;">Кийинкиси</button>
                <button type="button" id="studentSubmitTestBtn" class="hidden" style="background: #238636;">Тестти аяктоо</button>
            </div>
        </div>

        <!-- 3-БЛОК: Жыйынтык экраны -->
        <div id="studentResultsBlock" class="hidden" style="text-align: center; padding: 20px;">
            <i class="fa-solid fa-circle-check" style="font-size: 60px; color: #238636; margin-bottom: 15px;"></i>
            <h2>Тест ийгиликтүү аяктады!</h2>
            <p>Жоопторуңуз сакталды жана мугалимдин журналына жөнөтүлдү.</p>
            
            <div style="background: #21262d; padding: 20px; border-radius: 8px; max-width: 400px; margin: 20px auto; text-align: left;">
                <p>Топтолгон балл: <strong id="resultPointsEarned">0 / 0</strong></p>
                <p>Пайыздык көрсөткүч: <strong id="resultPercentValue">0%</strong></p>
                <p>Туура жооптор: <strong id="resultCorrectCount">0/0</strong></p>
                <p>Колдонулган убакыт: <strong id="resultTimeSpent">0 мүнөт</strong></p>
            </div>
        </div>

    </div>

    <!-- МИЛДЕТТҮҮ ТҮРДӨ type="module" ДЕП ЖАЗЫЛЫШЫ КЕРЕК -->
    <script type="module" src="/assets/js/student-test.js"></script>
</body>
</html>
