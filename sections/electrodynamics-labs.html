<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Электродинамика лабораториялык иштери — BiliMal</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    
    .header-nav {
      width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 25px; background: #111827; padding: 15px 25px; border-radius: 14px; border: 1px solid #1f2937;
    }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
    .back-btn:hover { color: #ffffff; }
    h1 { font-size: 1.2rem; color: #facc15; }

    .sections-grid { width: 100%; max-width: 1000px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    
    .section-card {
      background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 22px;
      transition: all 0.3s ease; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
    }
    .section-card:hover { transform: translateY(-5px); border-color: #38bdf8; box-shadow: 0 8px 25px rgba(56, 189, 248, 0.2); }
    .card-icon { font-size: 2.2rem; margin-bottom: 12px; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-bottom: 8px; }
    .card-desc { font-size: 0.85rem; color: #94a3b8; line-height: 1.5; margin-bottom: 18px; }
    .card-action { font-size: 0.85rem; font-weight: 600; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .badge-lab { background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #38bdf8; font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; margin-bottom: 10px; display: inline-block; width: fit-content; }
  </style>
</head>
<body>

  <div class="header-nav">
    <a href="lab-works.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Башкы менюга кайтүү</a>
    <h1>3. Электродинамика бөлүмү</h1>
    <div style="width: 140px;"></div>
  </div>

  <div class="sections-grid">
    <!-- Лабораториялык иш бөлүмү -->
    <div class="section-card" onclick="openMagneticLab()">
      <div>
        <span class="badge-lab">Лабораториялык иш №1</span>
        <div class="card-icon" style="color: #38bdf8;"><i class="fa-solid fa-magnet"></i></div>
        <div class="card-title">Магнит талаасынын токко болгон аракетин байкоо</div>
        <div class="card-desc">Тогу бар проводникке магнит талаасынын көрсөткөн таасирин (Ампер күчүн) виртуалдык симуляция аркылуу изилдөө.</div>
      </div>
      <div class="card-action">Ишти баштоо <i class="fa-solid fa-arrow-right"></i></div>
    </div>
  </div>

  <script>
    function openMagneticLab() {
      window.location.href = "magnetic-field-current-lab.html";
    }
  </script>
</body>
</html>
