<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ачык Электрондук Китепкана</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; background: #151a28; color: #00d2ff; border: 1px solid #1e2640; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .btn-back:hover { background: #00d2ff; color: #0b0e14; border-color: #00d2ff; }
        .header-title { font-size: 24px; color: #00d2ff; display: flex; align-items: center; gap: 10px; margin-bottom: 0; }
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .book-card { background: #151a28; border: 1px solid #1e2640; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .book-card h3 { color: #fff; font-size: 18px; margin-bottom: 8px; }
        .book-card p { color: #ccc; font-size: 14px; line-height: 1.4; white-space: pre-line; }
        .btn-read { background: #1e2640; color: #00d2ff; border: 1px solid #00d2ff; width: 100%; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; transition: 0.3s; }
        .btn-read:hover { background: #00d2ff; color: #0b0e14; }
        #loader { text-align: center; padding: 50px; font-size: 18px; color: #00d2ff; }
        
        .reader-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b0e14; display: none; flex-direction: column; z-index: 9999; }
        .reader-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #151a28; border-bottom: 1px solid #1e2640; }
        .btn-close-reader { background: #e74c3c; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .reader-body { flex: 1; position: relative; width: 100%; height: calc(100vh - 60px); overflow: hidden; background: #121620; }
        .reader-body iframe { width: 100%; height: 100%; border: none; }
        .empty-msg { color: #aaa; text-align: center; grid-column: 1 / -1; padding: 40px; background: #151a28; border-radius: 12px; border: 1px solid #1e2640; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <a href="/#sections" class="btn-back"><i class="fas fa-arrow-left"></i> Артка кайтуу</a>
            <h2 class="header-title"><i class="fas fa-book-open"></i> Ачык Электрондук Китептер жана Макалалар</h2>
        </div>

        <div id="loader"><i class="fas fa-spinner fa-spin"></i> Китептер жүктөлүүдө...</div>

        <div class="books-grid" id="public-books-container"></div>
    </div>

    <!-- ТОЛУК ЭКРАНДАРДАГЫ КИТЕП ОКУУ МУЛЬТИ-МОДАЛЫ -->
    <div class="reader-modal" id="pdf-reader-modal">
        <div class="reader-header">
            <h3 id="reader-book-title" style="color:#00d2ff;">Китеп окуу</h3>
            <button class="btn-close-reader" id="btn-close-reader"><i class="fas fa-times"></i> Жабуу</button>
        </div>
        <div class="reader-body">
            <iframe id="pdf-frame" src="about:blank" allow="autoplay" allowfullscreen="true"></iframe>
        </div>
    </div>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
            authDomain: "bilimal-org.firebaseapp.com",
            databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bilimal-org",
            storageBucket: "bilimal-org.firebasestorage.app",
            messagingSenderId: "241750360816",
            appId: "1:241750360816:web:a991434eb5afbc470d7835",
            measurementId: "G-9GSQV60QV0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const publicBooksContainer = document.getElementById('public-books-container');
        const loader = document.getElementById('loader');

        function loadPublicBooks() {
            onValue(ref(db, 'library'), (snapshot) => {
                loader.style.display = 'none';
                publicBooksContainer.innerHTML = '';

                if (!snapshot.exists()) {
                    publicBooksContainer.innerHTML = '<div class="empty-msg">Азырынча ачык китептер же макалалар кошула элек.</div>';
                    return;
                }

                const books = snapshot.val();
                let count = 0;

                Object.keys(books).forEach(id => {
                    const item = books[id];
                    const isBookPublic = item.isPublic === true || item.isPublic === "true" || item.isPublic === "public";

                    if (isBookPublic) {
                        count++;
                        const card = document.createElement('div');
                        card.className = 'book-card';
                        card.innerHTML = `
                            <h3>${escapeHtml(item.title)}</h3>
                            <p>${escapeHtml(item.desc)}</p>
                            <div>
                                ${item.pdfUrl ? `<button class="btn-read" data-pdf="${escapeAttribute(item.pdfUrl)}" data-title="${escapeAttribute(item.title)}"><i class="fas fa-book-open"></i> Окуу (Толук экран)</button>` : '<span style="font-size:12px; color:#aaa; display:block; margin-top:10px;">(Макала мазмуну жогоруда)</span>'}
                            </div>
                        `;
                        publicBooksContainer.appendChild(card);
                    }
                });

                if (count === 0) {
                    publicBooksContainer.innerHTML = '<div class="empty-msg">Азырынча ачык китептер кошула элек.</div>';
                }

                document.querySelectorAll('.btn-read').forEach(b => {
                    b.addEventListener('click', (e) => {
                        const target = e.currentTarget;
                        openReader(target.getAttribute('data-pdf'), target.getAttribute('data-title'));
                    });
                });
            });
        }

        // УНИВЕРСАЛДЫК EMBED URL ИШТЕТҮҮЧҮ ФУНКЦИЯ
        function getEmbeddablePdfUrl(url) {
            if (!url) return '';
            const cleanUrl = url.trim();

            // 1. Heyzine Flipbook шилтемелери
            if (cleanUrl.includes('heyzine.com')) {
                return cleanUrl;
            }

            // 2. Google Drive шилтемелери
            if (cleanUrl.includes('drive.google.com')) {
                const match = cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://drive.google.com/file/d/${match[1]}/preview`;
                }
                const idParam = cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (idParam && idParam[1]) {
                    return `https://drive.google.com/file/d/${idParam[1]}/preview`;
                }
            }

            // 3. Base64 же Түз PDF шилтемелер
            if (cleanUrl.startsWith('data:application/pdf') || cleanUrl.toLowerCase().endsWith('.pdf')) {
                return cleanUrl;
            }

            // 4. Башка тышкы документтер үчүн Google Docs Viewer
            return `https://docs.google.com/gview?embedded=true&url=${encodeURIComponent(cleanUrl)}`;
        }

        const readerModal = document.getElementById('pdf-reader-modal');
        const pdfFrame = document.getElementById('pdf-frame');
        const readerTitle = document.getElementById('reader-book-title');

        function openReader(url, title) {
            readerTitle.innerText = title;
            pdfFrame.src = getEmbeddablePdfUrl(url);
            readerModal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        document.getElementById('btn-close-reader').addEventListener('click', () => {
            readerModal.style.display = 'none';
            pdfFrame.src = 'about:blank';
            document.body.style.overflow = 'auto';
        });

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : '';
        }

        function escapeAttribute(str) {
            return str ? str.replace(/"/g, '&quot;').replace(/'/g, '&#39;') : '';
        }

        loadPublicBooks();
    </script>
</body>
</html>
