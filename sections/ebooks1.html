<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электрондук Китептер — BiliMal</title>

    <!-- Google Analytics & AdSense -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GSQV60QV0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9GSQV60QV0');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1495571814896964" crossorigin="anonymous"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: #020208; 
            color: #fff; 
            min-height: 100vh; 
            padding-top: 100px;
        }

        header { 
            background: rgba(4, 4, 16, 0.85); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(0, 240, 255, 0.15); 
            padding: 20px 8%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: fixed; 
            width: 100%; 
            top: 0; 
            z-index: 100; 
        }
        .logo { 
            font-size: 1.8rem; 
            font-weight: 900; 
            background: linear-gradient(45deg, #00f0ff, #ff00ff); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-decoration: none;
        }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .nav-links a { color: #a5b4fc; text-decoration: none; font-weight: 600; }
        
        .language-switcher { display: flex; gap: 6px; }
        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: #a5b4fc;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .lang-btn.active {
            background: rgba(0, 240, 255, 0.2);
            color: #fff;
            border-color: #00f0ff;
        }

        .admin-toggle-btn {
            background: linear-gradient(45deg, #ff00ff, #7928ca);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .admin-toggle-btn:hover { opacity: 0.9; box-shadow: 0 0 10px rgba(255, 0, 255, 0.5); }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 5%; }
        .page-title { 
            font-size: 2.3rem; 
            font-weight: 800; 
            margin-bottom: 10px; 
            background: linear-gradient(to right, #ffffff, #00f0ff); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .page-subtitle { color: #94a3b8; font-size: 1rem; margin-bottom: 30px; }

        /* АДМИН ПАНЕЛЬ ФОРМАСЫ */
        .admin-panel {
            display: none;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #ff00ff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.2);
        }
        .admin-panel h3 { color: #ff00ff; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: #a5b4fc; margin-bottom: 5px; }
        .form-control {
            width: 100%;
            padding: 10px;
            background: #020208;
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
        }
        .form-control:focus { outline: none; border-color: #00f0ff; }
        textarea.form-control { height: 120px; resize: vertical; }
        .save-btn {
            background: #00f0ff;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
        }

        /* КИТЕПТЕРДИН КАРТОЧКАСЫ */
        .topics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .topic-card {
            background: rgba(10, 10, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 25px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .topic-card:hover {
            transform: translateY(-5px);
            border-color: #00f0ff;
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15);
        }
        .topic-badge {
            background: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 12px;
        }
        .topic-title { font-size: 1.3rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
        .topic-desc { font-size: 0.9rem; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; }
        .topic-btn {
            color: #00f0ff;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1rem;
            text-align: left;
        }

        /* КИТЕП ОКУУЧУ МОДАЛДЫК АКТЫЛЫК */
        .reader-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(2, 2, 8, 0.98);
            z-index: 1000;
            overflow-y: auto;
        }
        .reader-header {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 25, 0.95);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .reader-content {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px 80px 20px;
            line-height: 1.8;
            font-size: 1.1rem;
            color: #e2e8f0;
        }
        .reader-content img {
            max-width: 100%;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }
        .close-btn {
            background: rgba(255, 0, 85, 0.2);
            border: 1px solid #ff0055;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="logo">BiliMal.org</a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="../index.html" id="nav-home">Башкы бет</a>
            </div>
            <div class="language-switcher">
                <button class="lang-btn active" id="btn-lang-ky" onclick="changeLanguage('ky')">KG</button>
                <button class="lang-btn" id="btn-lang-ru" onclick="changeLanguage('ru')">RU</button>
                <button class="lang-btn" id="btn-lang-en" onclick="changeLanguage('en')">EN</button>
            </div>
            <!-- АДМИН РЕЖИМИН КҮЙГҮЗҮҮ БАШКЫЧЫ -->
            <button class="admin-toggle-btn" onclick="toggleAdminPanel()">+ Жаңы китеп кошуу</button>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title" id="page-title">Электрондук Китептер жана Темалар</h1>
        <p class="page-subtitle" id="page-subtitle">Мектеп окуу китептеринин, интерактивдүү материалдардын жыйнагы.</p>

        <!-- АДМИН ПАНЕЛЬ (ЖАҢЫ КИТЕП ЖАРАТУУ) -->
        <div class="admin-panel" id="adminPanel">
            <h3>➕ Жаңы китеп/тема кошуу</h3>
            <div class="form-group">
                <label>Класс же Категория (мис: Физика • 7-Класс):</label>
                <input type="text" id="inputCategory" class="form-control" placeholder="Физика • 7-Класс">
            </div>
            <div class="form-group">
                <label>Теманын аталышы:</label>
                <input type="text" id="inputTitle" class="form-control" placeholder="Заттын түзүлүшү">
            </div>
            <div class="form-group">
                <label>Кыскача сыпаттамасы (Карточкага көрүнөт):</label>
                <input type="text" id="inputDesc" class="form-control" placeholder="Заттар, молекулалар жана атомдор тууралуу маалымат.">
            </div>
            <div class="form-group">
                <label>Сүрөттүн сырткы шилтемеси (URL) [Милдеттүү эмес]:</label>
                <input type="text" id="inputImageUrl" class="form-control" placeholder="https://example.com/image.jpg">
            </div>
            <div class="form-group">
                <label>Китептин толук тексти (Макала):</label>
                <textarea id="inputText" class="form-control" placeholder="Бул жерге китептин толук текстин жазыңыз..."></textarea>
            </div>
            <button class="save-btn" onclick="saveNewBook()">Сайтка сактоо</button>
        </div>

        <!-- КИТЕПТЕРДИН КАРТОЧКАЛАРЫ ЧЫГУУЧУ ЖЕР -->
        <div class="topics-grid" id="booksGrid">
            <!-- ДИНАМИКАЛЫК ТҮРДӨ ЖҮКТӨЛӨТ -->
        </div>
    </div>

    <!-- КИТЕПТИ ОКУУЧУ ОПТИМАЛДУУ ОКНО (READER MODAL) -->
    <div class="reader-modal" id="readerModal">
        <div class="reader-header">
            <h2 id="readerTitle" style="color: #00f0ff;">Тема</h2>
            <button class="close-btn" onclick="closeReader()">Жабуу (✕)</button>
        </div>
        <div class="reader-content" id="readerBody">
            <!-- Китептин мазмуну ошу жерде көрүнөт -->
        </div>
    </div>

    <script>
        // Стандарттуу (дефолттук) китептердин базасы
        const defaultBooks = [
            {
                id: 1,
                category: "Физика • 7-Класс",
                title: "Түз сызыктуу бир калыптагы кыймыл",
                desc: "Тең убакыт аралыгында бирдей аралыкты басып өткөн нерсенин кыймылы, ылдамдык формуласы жана графиктер.",
                imageUrl: "",
                text: "<h3>1. Түз сызыктуу бир калыптагы кыймыл деген эмне?</h3><p>Нерсе каалагандай тең убакыт аралыгында бирдей аралыктарды басып өтсө, анда мындай кыймыл <b>түз сызыктуу бир калыптагы кыймыл</b> деп аталат.</p><p><b>Ылдамдык формуласы:</b><br><code style='color:#00f0ff; font-size: 1.3rem;'>v = S / t</code></p><p>Бул жерде: <i>S</i> — басып өтүлгөн жол, <i>t</i> — убакыт, <i>v</i> — ылдамдык.</p>"
            }
        ];

        // Маалыматтарды алуу
        function getStoredBooks() {
            const stored = localStorage.getItem('bilimal_custom_books');
            return stored ? JSON.parse(stored) : defaultBooks;
        }

        // Китептерди экранга чыгаруу
        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            const books = getStoredBooks();
            grid.innerHTML = '';

            books.forEach((book, index) => {
                const card = document.createElement('div');
                card.className = 'topic-card';
                card.innerHTML = `
                    <div>
                        <span class="topic-badge">${book.category}</span>
                        <div class="topic-title">${book.title}</div>
                        <div class="topic-desc">${book.desc}</div>
                    </div>
                    <button class="topic-btn" onclick="openReader(${index})">Окууну баштоо →</button>
                `;
                grid.appendChild(card);
            });
        }

        // Админ панелди ачуу/жабуу
        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        // Жаңы китепти сактоо
        function saveNewBook() {
            const category = document.getElementById('inputCategory').value || "Физика • 7-Класс";
            const title = document.getElementById('inputTitle').value;
            const desc = document.getElementById('inputDesc').value;
            const imageUrl = document.getElementById('inputImageUrl').value;
            const text = document.getElementById('inputText').value;

            if (!title || !text) {
                alert("Сураныч, теманын аталышын жана толук текстин киргизиңиз!");
                return;
            }

            const books = getStoredBooks();
            books.push({
                id: Date.now(),
                category: category,
                title: title,
                desc: desc,
                imageUrl: imageUrl,
                text: text.replace(/\n/g, '<br>') // Жаңы саптарды сактоо
            });

            localStorage.setItem('bilimal_custom_books', JSON.stringify(books));
            
            // Форманы тазалоо жана панелди жабуу
            document.getElementById('inputTitle').value = '';
            document.getElementById('inputDesc').value = '';
            document.getElementById('inputImageUrl').value = '';
            document.getElementById('inputText').value = '';
            toggleAdminPanel();

            renderBooks();
            alert("Жаңы китеп ийгиликтүү кошулду!");
        }

        // Китепти окурман терезесинен ачуу
        function openReader(index) {
            const books = getStoredBooks();
            const book = books[index];

            document.getElementById('readerTitle').innerText = book.title;
            
            let contentHTML = ``;
            if (book.imageUrl) {
                contentHTML += `<img src="${book.imageUrl}" alt="${book.title}">`;
            }
            contentHTML += `<div>${book.text}</div>`;

            document.getElementById('readerBody').innerHTML = contentHTML;
            document.getElementById('readerModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // Окурман терезесин жабуу
        function closeReader() {
            document.getElementById('readerModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Баракча жүктөлгөндө чакыруу
        window.addEventListener('DOMContentLoaded', () => {
            renderBooks();
        });
    </script>
</body>
</html>
