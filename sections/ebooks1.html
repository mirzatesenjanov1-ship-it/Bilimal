<html lang="ky">
<head>
    <meta charset="UTF-8">

    <!-- SEO Ключевой сөздөр жана Meta Тегдер -->

    <meta name="keywords" content="физика, Кыргызча китептер, электрондук китептер, астрономия, BiliMal, Mugalim AI, мектеп физикасы, 7-класс физика, физикалык макалалар, онлайн билим">

    <!-- Open Graph (Telegram / WhatsApp / Соцтармактар үчүн) -->

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GSQV60QV0"></script>
    <script>

      gtag('js', new Date());
      gtag('config', 'G-9GSQV60QV0');

    <!-- Google AdSense Башкы Скрипти -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1495571814896964" crossorigin="anonymous"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        body { 
            background: #030712; 
            color: #f8fafc; 
            min-height: 100vh; 
            padding-top: 80px;
            overflow-x: hidden;
        }

        /* HEADER & NAVIGATION */
        header { 
            background: rgba(3, 7, 18, 0.85); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.12); 
            padding: 16px 8%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: fixed; 
            width: 100%; 
            top: 0; 
            z-index: 100; 
        }
        .logo { 
            font-size: 1.8rem; 
            font-weight: 900; 
            background: linear-gradient(135deg, #00f0ff, #7000ff); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .nav-links a { 
            color: #94a3b8; 
            text-decoration: none; 
            font-weight: 600; 
            transition: color 0.3s ease;
            font-size: 0.95rem;
        }
        .nav-links a:hover { color: #00f0ff; }
        
        .language-switcher { 
            display: flex; 
            gap: 6px; 
            background: rgba(255, 255, 255, 0.03);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: #64748b;
            padding: 6px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.82rem;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            color: #f8fafc;
        }
        .lang-btn.active {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(112, 0, 255, 0.2));
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        /* CONTAINER */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 5% 60px 5%; }

        /* HERO SECTION UI/UX */
        .hero-section {
            text-align: center;
            padding: 60px 20px 40px 20px;
            position: relative;
        }
        .hero-section::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(112, 0, 255, 0.05) 50%, transparent 70%);
            filter: blur(50px);
            z-index: -1;
            pointer-events: none;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.25);
            color: #00f0ff;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .page-title { 
            font-size: 2.8rem; 
            font-weight: 900; 
            margin-bottom: 16px; 
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: -1px;
            line-height: 1.2;
        }
        .page-subtitle { 
            color: #94a3b8; 
            font-size: 1.15rem; 
            max-width: 650px;
            margin: 0 auto 30px auto;
            line-height: 1.6;
        }

        /* ADS CONTAINER */
        .ads-container {
            width: 100%;
            margin: 30px 0;
            text-align: center;
            background: rgba(15, 23, 42, 0.4);
            border: 1px dashed rgba(0, 240, 255, 0.15);
            border-radius: 16px;
            padding: 12px;
            overflow: hidden;
        }
        .ads-card {
            background: rgba(15, 23, 42, 0.3);
            border: 1px dashed rgba(0, 240, 255, 0.15);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        /* TOPICS / BOOKS GRID */
        .topics-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 24px; 
            margin-top: 20px;
        }
        .topic-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 28px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            backdrop-filter: blur(10px);
        }
        .topic-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 12px 30px rgba(0, 240, 255, 0.12);
            background: rgba(15, 23, 42, 0.7);
        }
        .topic-badge {
            background: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 14px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            width: fit-content;
        }
        .topic-title { 
            font-size: 1.35rem; 
            font-weight: 800; 
            color: #f8fafc; 
            margin-bottom: 10px; 
            line-height: 1.3;
        }
        .topic-desc { 
            font-size: 0.92rem; 
            color: #94a3b8; 
            line-height: 1.6; 
            margin-bottom: 24px; 
        }
        
        .card-actions { display: flex; justify-content: space-between; align-items: center; }
        .topic-btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(112, 0, 255, 0.15));
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            width: 100%;
            justify-content: center;
        }
        .topic-btn:hover {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        /* MODAL WINDOW */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.96);
            backdrop-filter: blur(16px);
            z-index: 1000;
            flex-direction: column;
        }
        .modal-header {
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-title { color: #00f0ff; font-size: 1.25rem; font-weight: 700; }
        .close-btn {
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid rgba(255, 0, 85, 0.4);
            color: #ff4d8d;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .close-btn:hover {
            background: #ff0055;
            color: #fff;
        }
        
        .modal-body {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background: #030712;
        }
        
        .article-content {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 25px 80px 25px;
            line-height: 1.8;
            font-size: 1.1rem;
            color: #e2e8f0;
        }
        .article-content img {
            max-width: 100%;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid rgba(0, 240, 255, 0.3);
            display: block;
        }
        .pdf-object { width: 100%; height: 100%; border: none; }

        @media (max-width: 640px) {
            .page-title { font-size: 2.1rem; }
            .hero-section { padding: 40px 10px 20px 10px; }
            header { padding: 16px 4%; }
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="logo">BiliMal.org</a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="../index.html" id="nav-home">Башкы бет</a>
            </div>
            <div class="language-switcher">
                <button class="lang-btn active" id="btn-lang-ky" onclick="changeLanguage('ky')">KG</button>
                <button class="lang-btn" id="btn-lang-ru" onclick="changeLanguage('ru')">RU</button>
                <button class="lang-btn" id="btn-lang-en" onclick="changeLanguage('en')">EN</button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- HERO SECTION -->
        <section class="hero-section">
            <div class="hero-badge">
                <span>📚</span> <span id="hero-badge-text">Интерактивдүү Билим Банкы</span>
            </div>
            <h1 class="page-title" id="page-title">Электрондук Китептер жана Макалалар</h1>
            <p class="page-subtitle" id="page-subtitle">Интерактивдүү физика, астрономия окуу материалдары жана илимий китептер жыйнагы.</p>
        </section>

        <!-- Google AdSense Жарнак Блогу -->
        <div class="ads-container">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-1495571814896964"
                 data-ad-slot="1574613769"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <!-- КИТЕПТЕР ГРИДИ -->
        <div class="topics-grid" id="postsGrid">
            <!-- Динамикалык китептер жана AdSense ушул жерге чыгат -->
        </div>
    </div>

    <!-- МОДАЛДЫК ОКНО (Текст жана PDF көрүү үчүн) -->
    <div class="modal" id="contentModal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Материал</div>
            <button class="close-btn" onclick="closeModal()">Жабуу (✕)</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>

    <script>
        // Негизги дефолттук PDF китептер
        const defaultPosts = [
            {
                id: 1,
                type: 'pdf',
                category: 'Gemini Storybook • PDF Китеп',
                title: 'Түз сызыктуу бир калыптагы кыймыл',
                desc: 'Сүрөттүү жана иллюстрациялуу PDF форматтагы окуу китеби.',
                url: 'gemini-books/story1.pdf'
            },
            {
                id: 2,
                type: 'pdf',
                category: 'Gemini Storybook • PDF Китеп',
                title: 'Физика илиминин максаты жана мааниси',
                desc: 'Сүрөттүү жана иллюстрациялуу PDF форматтагы окуу китеби.',
                url: 'gemini-books/story2.pdf'
            },
            {
                id: 3,
                type: 'pdf',
                category: 'Gemini Storybook • PDF Китеп',
                title: 'Физикалык чоңдуктар',
                desc: 'Сүрөттүү жана иллюстрациялуу PDF форматтагы окуу китеби.',
                url: 'gemini-books/story3.pdf'
            }
        ];

        function getStoredPosts() {
            const stored = localStorage.getItem('bilimal_posts');
            if (!stored) return defaultPosts;
            
            try {
                const parsed = JSON.parse(stored);
                return parsed.length > 0 ? parsed : defaultPosts;
            } catch (e) {
                return defaultPosts;
            }
        }

        function renderPosts() {
            const grid = document.getElementById('postsGrid');
            const posts = getStoredPosts();
            grid.innerHTML = '';

            posts.forEach((post, index) => {
                const card = document.createElement('div');
                card.className = 'topic-card';
                card.innerHTML = `
                    <div>
                        <span class="topic-badge">${post.category}</span>
                        <div class="topic-title">${post.title}</div>
                        <div class="topic-desc">${post.desc || ''}</div>
                    </div>
                    <div class="card-actions">
                        <button class="topic-btn" onclick="openPost(${index})">
                            <span>Окууну баштоо</span>
                            <span>→</span>
                        </button>
                    </div>
                `;
                grid.appendChild(card);

                if ((index + 1) % 3 === 0) {
                    const adCard = document.createElement('div');
                    adCard.className = 'ads-card';
                    adCard.innerHTML = `
                        <ins class="adsbygoogle"
                             style="display:block; width:100%;"
                             data-ad-client="ca-pub-1495571814896964"
                             data-ad-slot="1574613769"
                             data-ad-format="auto"
                             data-full-width-responsive="true"></ins>
                    `;
                    grid.appendChild(adCard);
                    try {
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    } catch(e){}
                }
            });
        }

        function openPost(index) {
            const posts = getStoredPosts();
            const post = posts[index];

            document.getElementById('modalTitle').innerText = post.title;
            const container = document.getElementById('modalBody');

            const adHtml = `
                <div class="ads-container" style="max-width: 850px; margin: 20px auto;">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-1495571814896964"
                         data-ad-slot="1574613769"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                </div>
            `;

            if (post.type === 'pdf') {
                container.innerHTML = `<object data="${post.url}" type="application/pdf" class="pdf-object">
                    <embed src="${post.url}" type="application/pdf" />
                    <p style="color: #fff; padding: 20px; text-align: center;">
                        PDF ачылбаса: <a href="${post.url}" target="_blank" style="color: #00f0ff;">Бул жерди басып ачыңыз</a>.
                    </p>
                </object>`;
            } else {
                container.innerHTML = `<div class="article-content">${post.content}</div>` + adHtml;
            }

            document.getElementById('contentModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';

            setTimeout(() => {
                try {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                } catch(e){}
            }, 100);
        }

        function closeModal() {
            document.getElementById('contentModal').style.display = 'none';
            document.getElementById('modalBody').innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        const translations = {
            ky: {
                navHome: "Башкы бет",
                heroBadge: "Интерактивдүү Билим Банкы",
                pageTitle: "Электрондук Китептер жана Макалалар",
                pageSubtitle: "Интерактивдүү физика, астрономия окуу материалдары жана илимий китептер жыйнагы."
            },
            ru: {
                navHome: "Главная",
                heroBadge: "Интерактивный Банк Знаний",
                pageTitle: "Электронные Книги и Статьи",
                pageSubtitle: "Коллекция интерактивных материалов по физике, астрономии и учебных книг."
            },
            en: {
                navHome: "Home",
                heroBadge: "Interactive Knowledge Base",
                pageTitle: "E-Books & Articles",
                pageSubtitle: "Collection of interactive physics, astronomy educational materials, and books."
            }
        };

        function changeLanguage(lang) {
            if (!translations[lang]) return;
            localStorage.setItem('bilimal_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-lang-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');

            const t = translations[lang];
            document.getElementById('nav-home').innerText = t.navHome;
            document.getElementById('hero-badge-text').innerText = t.heroBadge;
            document.getElementById('page-title').innerText = t.pageTitle;
            document.getElementById('page-subtitle').innerText = t.pageSubtitle;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('bilimal_lang') || 'ky';
            changeLanguage(savedLang);
            renderPosts();
        });
    </script>
</body>
</html>
