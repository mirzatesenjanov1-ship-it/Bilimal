    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: #020208; 
            color: #fff; 
            min-height: 100vh; 
            padding-top: 100px;
        }

        header { 
            background: rgba(4, 4, 16, 0.85); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(0, 240, 255, 0.15); 
            padding: 20px 8%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: fixed; 
            width: 100%; 
            top: 0; 
            z-index: 100; 
        }
        .logo { 
            font-size: 1.8rem; 
            font-weight: 900; 
            background: linear-gradient(45deg, #00f0ff, #ff00ff); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-decoration: none;
        }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .nav-links a { color: #a5b4fc; text-decoration: none; font-weight: 600; }
        
        .language-switcher { display: flex; gap: 8px; }
        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: #a5b4fc;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .lang-btn.active {
            background: rgba(0, 240, 255, 0.2);
            color: #fff;
            border-color: #00f0ff;
        }

        .btn-add-post {
            background: linear-gradient(45deg, #00f0ff, #7000ff);
            border: none;
            color: #fff;
            padding: 9px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transition: 0.3s;
        }
        .btn-add-post:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0, 240, 255, 0.6); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 5%; }
        .page-title { 
            font-size: 2.5rem; 
            font-weight: 800; 
            margin-bottom: 15px; 
            background: linear-gradient(to right, #ffffff, #00f0ff); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .page-subtitle { color: #94a3b8; font-size: 1.1rem; margin-bottom: 25px; }

        /* ЖАРНАМА БЛОКТОРУНУН СТИЛИ */
        .ads-container {
            width: 100%;
            margin: 25px 0;
            text-align: center;
            background: rgba(15, 23, 42, 0.4);
            border: 1px dashed rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 10px;
            overflow: hidden;
        }
        .ads-card {
            background: rgba(10, 10, 25, 0.4);
            border: 1px dashed rgba(0, 240, 255, 0.2);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        /* ПОСТ КИРГИЗҮҮЧҮ АДМИН ПАНЕЛЬ */
        .admin-panel {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #00f0ff;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        .admin-panel h3 { color: #00f0ff; margin-bottom: 20px; font-size: 1.4rem; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.9rem; color: #a5b4fc; margin-bottom: 6px; font-weight: 600; }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: #020208;
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .form-control:focus { border-color: #ff00ff; box-shadow: 0 0 10px rgba(255, 0, 255, 0.3); }
        textarea.form-control { height: 200px; resize: vertical; line-height: 1.6; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .save-btn {
            background: linear-gradient(90deg, #00f0ff, #0077ff);
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        .save-btn:hover { box-shadow: 0 0 20px rgba(0, 240, 255, 0.5); }

        /* КАРТОЧКАЛАР ГРИДИ */
        .topics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
        .topic-card {
            background: rgba(10, 10, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 25px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .topic-card:hover {
            transform: translateY(-5px);
            border-color: #00f0ff;
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15);
        }
        .topic-badge {
            background: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 12px;
        }
        .topic-title { font-size: 1.3rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
        .topic-desc { font-size: 0.9rem; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; }
        
        .card-actions { display: flex; justify-content: space-between; align-items: center; }
        .topic-btn {
            color: #00f0ff;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1rem;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ff0055;
            cursor: pointer;
            font-size: 0.85rem;
            opacity: 0.7;
            transition: 0.3s;
        }
        .delete-btn:hover { opacity: 1; text-shadow: 0 0 8px #ff0055; }

        /* ПОСТ ЖАНА КИТЕПТЕРДИ ОКУУЧУ МОДАЛДЫК ОКНО */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(2, 2, 8, 0.96);
            backdrop-filter: blur(15px);
            z-index: 1000;
            flex-direction: column;
        }
        .modal-header {
            background: rgba(10, 10, 25, 0.95);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-title { color: #00f0ff; font-size: 1.3rem; font-weight: 700; }
        .close-btn {
            background: rgba(255, 0, 85, 0.2);
            border: 1px solid #ff0055;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
        
        .modal-body {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background: #060612;
        }
        
        /* Макала мазмунунун стили */
        .article-content {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 25px 80px 25px;
            line-height: 1.8;
            font-size: 1.1rem;
            color: #e2e8f0;
            white-space: pre-wrap;
        }
        .article-content img {
            max-width: 100%;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid rgba(0, 240, 255, 0.3);
            display: block;
        }
        .pdf-object { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="logo">BiliMal.org</a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="../index.html" id="nav-home">Башкы бет</a>
            </div>
            <div class="language-switcher">
                <button class="lang-btn active" id="btn-lang-ky" onclick="changeLanguage('ky')">KG</button>
                <button class="lang-btn" id="btn-lang-ru" onclick="changeLanguage('ru')">RU</button>
                <button class="lang-btn" id="btn-lang-en" onclick="changeLanguage('en')">EN</button>
            </div>
            <button class="btn-add-post" onclick="toggleAdminPanel()">✍️ Пост / Текст жүктөө</button>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title" id="page-title">Электрондук Китептер жана Макалалар</h1>
        <p class="page-subtitle" id="page-subtitle">Gemini Storybook, автордук тексттер жана окуу материалдарынын жыйнагы.</p>

        <!-- 1. Google AdSense Жарнак Блогу (Баракчанын жогорку бөлүгүндө) -->
        <div class="ads-container">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-1495571814896964"
                 data-ad-slot="1574613769"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <!-- ЖАҢЫ ПОСТ КИРГИЗҮҮ ФОРМАСЫ -->
        <div class="admin-panel" id="adminPanel">
            <h3>📝 Жаңы пост же макала жарыялоо</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Категория / Бачка (мис: Физика • 7-Класс):</label>
                    <input type="text" id="postCategory" class="form-control" placeholder="Физика • 7-Класс">
                </div>
                <div class="form-group">
                    <label>Материалдын түрү:</label>
                    <select id="postType" class="form-control" onchange="handleTypeChange()">
                        <option value="text">Тексттик пост / Макала</option>
                        <option value="pdf">PDF Файл шилтемеси</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Посттун / Теманын аталышы:</label>
                <input type="text" id="postTitle" class="form-control" placeholder="Теманын аты">
            </div>

            <div class="form-group">
                <label>Кыскача сыпаттамасы (Карточкада көрүнөт):</label>
                <input type="text" id="postDesc" class="form-control" placeholder="Тема боюнча кыскача түшүндүрмө...">
            </div>

            <div class="form-group" id="pdfUrlGroup" style="display: none;">
                <label>PDF Файлдын дареги (мис: gemini-books/story1.pdf):</label>
                <input type="text" id="postPdfUrl" class="form-control" placeholder="gemini-books/story1.pdf">
            </div>

            <div class="form-group" id="textContentGroup">
                <label>Макала / Китептин тексти (кандай көчүрүп чаптасаңыз ошол боюнча сакталат):</label>
                <textarea id="postContent" class="form-control" placeholder="Текстти ушул жерге чаптаңыз..."></textarea>
            </div>

            <button class="save-btn" onclick="savePost()">Сайтка жарыялоо 🚀</button>
        </div>

        <div class="topics-grid" id="postsGrid">
            <!-- Динамикалык посттор жана AdSense блок ушул жерге чыгат -->
        </div>
    </div>

    <!-- МОДАЛДЫК ОКНО (Текст жана PDF көрүү үчүн) -->
    <div class="modal" id="contentModal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Материал</div>
            <button class="close-btn" onclick="closeModal()">Жабуу (✕)</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>

    <script>
        // Стандарттуу дефолттук PDF китептер
        const defaultPosts = [
            {
                id: 1,
                type: 'pdf',
                category: 'Gemini Storybook • PDF Китеп',
                title: 'Түз сызыктуу бир калыптагы кыймыл',
                desc: 'Gemini Storybook аркылуу түзүлгөн сүрөттүү жана иллюстрациялуу PDF форматтагы окуу китеби.',
                url: 'gemini-books/story1.pdf'
            },
            {
                id: 2,
                type: 'pdf',
                category: 'Gemini Storybook • PDF Китеп',
                title: 'Физика илиминин максаты жана мааниси',
                desc: 'Gemini Storybook аркылуу түзүлгөн сүрөттүү жана иллюстрациялуу PDF форматтагы окуу китеби.',
                url: 'gemini-books/story2.pdf'
            }
        ];

        function getStoredPosts() {
            const stored = localStorage.getItem('bilimal_posts');
            if (!stored) return defaultPosts;
            
            const parsed = JSON.parse(stored);
            
            const hasStory1 = parsed.some(p => p.id === 1 || (p.url && p.url.includes('story1.pdf')));
            const hasStory2 = parsed.some(p => p.id === 2 || (p.url && p.url.includes('story2.pdf')));
            
            let updated = false;
            if (!hasStory1) {
                parsed.unshift(defaultPosts[0]);
                updated = true;
            }
            if (!hasStory2) {
                const story1Index = parsed.findIndex(p => p.id === 1 || (p.url && p.url.includes('story1.pdf')));
                if (story1Index !== -1) {
                    parsed.splice(story1Index + 1, 0, defaultPosts[1]);
                } else {
                    parsed.unshift(defaultPosts[1]);
                }
                updated = true;
            }

            if (updated) {
                localStorage.setItem('bilimal_posts', JSON.stringify(parsed));
            }
            
            return parsed;
        }

        function renderPosts() {
            const grid = document.getElementById('postsGrid');
            const posts = getStoredPosts();
            grid.innerHTML = '';

            posts.forEach((post, index) => {
                const isDefaultPdf = (post.id === 1 || post.id === 2 || (post.url && (post.url.includes('story1.pdf') || post.url.includes('story2.pdf'))));
                
                const card = document.createElement('div');
                card.className = 'topic-card';
                card.innerHTML = `
                    <div>
                        <span class="topic-badge">${post.category}</span>
                        <div class="topic-title">${post.title}</div>
                        <div class="topic-desc">${post.desc || ''}</div>
                    </div>
                    <div class="card-actions">
                        <button class="topic-btn" onclick="openPost(${index})">Окууну баштоо →</button>
                        ${!isDefaultPdf ? `<button class="delete-btn" onclick="deletePost(${index})">Өчүрүү 🗑️</button>` : ''}
                    </div>
                `;
                grid.appendChild(card);

                // 2. Ар бир 3-карточкадан кийин толук туура келген AdSense жарнак карточкасын кошуу
                if ((index + 1) % 3 === 0) {
                    const adCard = document.createElement('div');
                    adCard.className = 'ads-card';
                    adCard.innerHTML = `
                        <ins class="adsbygoogle"
                             style="display:block; width:100%;"
                             data-ad-client="ca-pub-1495571814896964"
                             data-ad-slot="1574613769"
                             data-ad-format="auto"
                             data-full-width-responsive="true"></ins>
                    `;
                    grid.appendChild(adCard);
                    (adsbygoogle = window.adsbygoogle || []).push({});
                }
            });
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function handleTypeChange() {
            const type = document.getElementById('postType').value;
            if (type === 'pdf') {
                document.getElementById('pdfUrlGroup').style.display = 'block';
                document.getElementById('textContentGroup').style.display = 'none';
            } else {
                document.getElementById('pdfUrlGroup').style.display = 'none';
                document.getElementById('textContentGroup').style.display = 'block';
            }
        }

        function savePost() {
            const type = document.getElementById('postType').value;
            const category = document.getElementById('postCategory').value || "Макала";
            const title = document.getElementById('postTitle').value;
            const desc = document.getElementById('postDesc').value;
            const pdfUrl = document.getElementById('postPdfUrl').value;
            const content = document.getElementById('postContent').value;

            if (!title) {
                alert("Сураныч, теманын аталышын жазыңыз!");
                return;
            }

            const posts = getStoredPosts();
            posts.push({
                id: Date.now(),
                type: type,
                category: category,
                title: title,
                desc: desc,
                url: pdfUrl,
                content: content
            });

            localStorage.setItem('bilimal_posts', JSON.stringify(posts));

            document.getElementById('postTitle').value = '';
            document.getElementById('postDesc').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('postPdfUrl').value = '';
            toggleAdminPanel();

            renderPosts();
            alert("Пост ийгиликтүү жарыяланды!");
        }

        function deletePost(index) {
            if (confirm("Бул постту өчүрүүнү каалайсызбы?")) {
                const posts = getStoredPosts();
                posts.splice(index, 1);
                localStorage.setItem('bilimal_posts', JSON.stringify(posts));
                renderPosts();
            }
        }

        function openPost(index) {
            const posts = getStoredPosts();
            const post = posts[index];

            document.getElementById('modalTitle').innerText = post.title;
            const container = document.getElementById('modalBody');

            // 3. Макала же PDF ачылганда ичине жарнама кошуу
            const adHtml = `
                <div class="ads-container" style="max-width: 850px; margin: 20px auto;">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-1495571814896964"
                         data-ad-slot="1574613769"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                </div>
            `;

            if (post.type === 'pdf') {
                container.innerHTML = `<object data="${post.url}" type="application/pdf" class="pdf-object">
                    <embed src="${post.url}" type="application/pdf" />
                    <p style="color: #fff; padding: 20px; text-align: center;">
                        PDF ачылбаса: <a href="${post.url}" target="_blank" style="color: #00f0ff;">Бул жерди басып ачыңыз</a>.
                    </p>
                </object>`;
            } else {
                container.innerHTML = `<div class="article-content">${post.content}</div>` + adHtml;
            }

            document.getElementById('contentModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';

            // Модалдагы жарнаманы инициализациялоо
            setTimeout(() => {
                (adsbygoogle = window.adsbygoogle || []).push({});
            }, 100);
        }

        function closeModal() {
            document.getElementById('contentModal').style.display = 'none';
            document.getElementById('modalBody').innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        const translations = {
            ky: {
                navHome: "Башкы бет",
                pageTitle: "Электрондук Китептер жана Макалалар",
                pageSubtitle: "Gemini Storybook, автордук тексттер жана окуу материалдарынын жыйнагы."
            },
            ru: {
                navHome: "Главная",
                pageTitle: "Электронные Книги и Статьи",
                pageSubtitle: "Коллекция Gemini Storybook, авторских текстов и учебных материалов."
            },
            en: {
                navHome: "Home",
                pageTitle: "E-Books & Articles",
                pageSubtitle: "Collection of Gemini Storybook, author texts, and educational materials."
            }
        };

        function changeLanguage(lang) {
            if (!translations[lang]) return;
            localStorage.setItem('bilimal_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-lang-${lang}`).classList.add('active');

            const t = translations[lang];
            document.getElementById('nav-home').innerText = t.navHome;
            document.getElementById('page-title').innerText = t.pageTitle;
            document.getElementById('page-subtitle').innerText = t.pageSubtitle;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('bilimal_lang') || 'ky';
            changeLanguage(savedLang);
            renderPosts();
        });
    </script>
</body>
</html>
