<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Окуу жайга тапшыруу анкетасы</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --accent-color: #00d2ff;
            --accent-green: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .form-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 480px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .form-header { text-align: center; margin-bottom: 20px; }
        .form-header i { font-size: 36px; color: var(--accent-color); margin-bottom: 8px; }
        .form-header h2 { font-size: 20px; }
        .form-header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); }
        input[type="text"], select, textarea { width: 100%; padding: 10px 12px; background: #1f2937; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; outline: none; font-size: 14px; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }
        .btn-submit { background: linear-gradient(135deg, #00d2ff, #0072ff); color: #fff; border: none; width: 100%; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
        .btn-submit:hover { opacity: 0.9; }
        .success-box { display: none; text-align: center; padding: 20px 0; }
        .success-box i { font-size: 48px; color: var(--accent-green); margin-bottom: 12px; }
    </style>
</head>
<body>

    <div class="form-card">
        <div id="form-content">
            <div class="form-header">
                <i class="fas fa-user-graduate"></i>
                <h2>Мектеп бүтүрүүчүлөрүнүн анкетасы</h2>
                <p>Жыйынтыкты так толтуруп жөнөтүңүз</p>
            </div>

            <form id="studentSurveyForm" onsubmit="sendData(event)">
                <div class="form-group">
                    <label>Аты-жөнүңүз:</label>
                    <input type="text" id="fullName" placeholder="Мисалы: Асанов Арсен" required>
                </div>

                <div class="form-group">
                    <label>Классыңыз:</label>
                    <input type="text" id="studentClass" placeholder="Мисалы: 11-А" required>
                </div>

                <div class="form-group">
                    <label>Окуу жайга тапшырдыңызбы?</label>
                    <select id="status" onchange="toggleInstitutionField()" required>
                        <option value="">-- Тандаңыз --</option>
                        <option value="Тапшырдым">✅ Тапшырдым</option>
                        <option value="Тапшырган жокмун">❌ Тапшырган жокмун (Иштеп жатам)</option>
                        <option value="Даярданып жатам">⏳ Кийинки жылга даярданып жатам</option>
                    </select>
                </div>

                <div class="form-group" id="institutionGroup" style="display: none;">
                    <label>Кайсы окуу жайга жана кесипке?</label>
                    <input type="text" id="institution" placeholder="Мисалы: КНУ, Компьютердик инженерия">
                </div>

                <div class="form-group">
                    <label>Кошумча маалымат:</label>
                    <textarea id="notes" rows="2" placeholder="Бюджет / Контракт..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> Жөнөтүү
                </button>
            </form>
        </div>

        <div class="success-box" id="successBox">
            <i class="fas fa-check-circle"></i>
            <h3>Рахмат! Маалымат ийгиликтүү жөнөтүлдү.</h3>
            <p>Жыйынтыгы мугалимге өттү.</p>
        </div>
    </div>

    <script>
        // ----------------------------------------------------------------------
        // ЖӨНӨТҮҮ ЖӨНДӨӨЛӨРҮ:
        // 1-вариант (Telegram Бот):
        const BOT_TOKEN = "ВАШ_TELEGRAM_BOT_TOKEN"; 
        const CHAT_ID = "ВАШ_TELEGRAM_CHAT_ID";

        // 2-вариант (Google Sheets):
        const GOOGLE_SCRIPT_URL = "ВАШ_GOOGLE_APPS_SCRIPT_URL";
        // ----------------------------------------------------------------------

        function toggleInstitutionField() {
            const status = document.getElementById('status').value;
            document.getElementById('institutionGroup').style.display = (status === 'Тапшырдым') ? 'block' : 'none';
        }

        async function sendData(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Жөнөтүлүүдө...';

            const fullName = document.getElementById('fullName').value.trim();
            const studentClass = document.getElementById('studentClass').value.trim();
            const status = document.getElementById('status').value;
            const institution = document.getElementById('institution').value.trim() || '-';
            const notes = document.getElementById('notes').value.trim() || '-';

            // Telegram аркылуу жөнөтүү (эгер Бот токен киргизилсе)
            if (BOT_TOKEN !== "ВАШ_TELEGRAM_BOT_TOKEN") {
                const message = `🎓 **ЖАҢЫ АНКЕТА ТҮШТҮ!**\n\n👤 **Окуучу:** ${fullName}\n🏫 **Класс:** ${studentClass}\n📌 **Абалы:** ${status}\n🏛 **Окуу жай:** ${institution}\n📝 **Эскертүү:** ${notes}`;
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'Markdown' })
                });
            }

            // Google Sheets аркылуу жөнөтүү (эгер Google Script URL киргизилсе)
            if (GOOGLE_SCRIPT_URL !== "ВАШ_GOOGLE_APPS_SCRIPT_URL") {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, studentClass, status, institution, notes })
                });
            }

            document.getElementById('form-content').style.display = 'none';
            document.getElementById('successBox').style.display = 'block';
        }
    </script>
</body>
</html>
