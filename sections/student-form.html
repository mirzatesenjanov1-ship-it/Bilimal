<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Окуу жайга тапшыруу боюнча анкета</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --accent-color: #00d2ff;
            --accent-green: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .form-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 480px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .form-header { text-align: center; margin-bottom: 25px; }
        .form-header i { font-size: 40px; color: var(--accent-color); margin-bottom: 10px; }
        .form-header h2 { font-size: 22px; color: var(--text-main); }
        .form-header p { font-size: 13px; color: var(--text-muted); margin-top: 5px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); }
        input[type="text"], select, textarea { width: 100%; padding: 12px; background: #1f2937; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; outline: none; font-size: 14px; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }
        .btn-submit { background: linear-gradient(135deg, #00d2ff, #0072ff); color: #fff; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
        .success-box { display: none; text-align: center; padding: 20px 0; }
        .success-box i { font-size: 50px; color: var(--accent-green); margin-bottom: 15px; }
        .success-box h3 { font-size: 20px; margin-bottom: 8px; }
        .success-box p { color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

    <div class="form-card">
        <div id="form-content">
            <div class="form-header">
                <i class="fas fa-user-graduate"></i>
                <h2>Мектеп бүтүрүүчүлөрүнүн анкетасы</h2>
                <p>Сураныч, маалыматты так жана туура толтуруңуз</p>
            </div>

            <form id="studentSurveyForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Фамилияңыз жана Атыңыз:</label>
                    <input type="text" id="fullName" placeholder="Мисалы: Асанов Арсен" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-graduation-cap"></i> Классыңыз:</label>
                    <input type="text" id="studentClass" placeholder="Мисалы: 11-А" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-question-circle"></i> Кайсыл окууга тапшырдыңыз же Талас облустук жатак-мектепте улантасызбы?</label>
                    <input type="text" id="status" placeholder="Мисалы: КНУга тапшырдым же Жатак-мектепте улантам" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-comment-alt"></i> Кошумча маалымат же эскертүү:</label>
                    <textarea id="notes" rows="3" placeholder="Мисалы: Контракт түрүндө өттүм..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> Жөнөтүү
                </button>
            </form>
        </div>

        <div class="success-box" id="successBox">
            <i class="fas fa-check-circle"></i>
            <h3>Рахмат! Маалымат кабыл алынды.</h3>
            <p>Жообуңуз класс жетекчиңиздин системасына ийгиликтүү жөнөтүлдү.</p>
        </div>
    </div>

    <!-- Firebase SDK модулдары -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
            authDomain: "bilimal-org.firebaseapp.com",
            databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bilimal-org",
            storageBucket: "bilimal-org.firebasestorage.app",
            messagingSenderId: "241750360816",
            appId: "1:241750360816:web:a991434eb5afbc470d7835",
            measurementId: "G-9GSQV60QV0"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const form = document.getElementById('studentSurveyForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Жөнөтүлүүдө...';

            const payload = {
                fullName: document.getElementById('fullName').value.trim(),
                studentClass: document.getElementById('studentClass').value.trim(),
                status: document.getElementById('status').value.trim(),
                notes: document.getElementById('notes').value.trim() || 'Кошумча маалымат жок',
                timestamp: new Date().toISOString()
            };

            try {
                const movementsRef = ref(database, 'movements');
                await push(movementsRef, payload);

                document.getElementById('form-content').style.display = 'none';
                document.getElementById('successBox').style.display = 'block';
            } catch (err) {
                console.error(err);
                alert('Ката чыкты. Сураныч кайрадан аракет кылып көрүңүз!');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Жөнөтүү';
            }
        });
    </script>
</body>
</html>
