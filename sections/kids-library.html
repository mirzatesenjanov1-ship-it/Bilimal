<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жомоктор жана Балдар Китептери — BiliMal</title>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1495571814896964" crossorigin="anonymous"></script>
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GSQV60QV0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-9GSQV60QV0');
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #050312; color: #fff; padding: 30px 4%; min-height: 100vh; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .back-btn { background: rgba(255,255,255,0.08); border: 1px solid #a855f7; color: #a855f7; padding: 10px 20px; border-radius: 12px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { background: #a855f7; color: #fff; box-shadow: 0 0 15px rgba(168,85,247,0.4); }
        
        .header-title { text-align: center; flex: 1; }
        .header-title h1 { font-size: 2.2rem; color: #a855f7; text-shadow: 0 0 15px rgba(168,85,247,0.3); }
        .header-title p { color: #94a3b8; font-size: 1rem; margin-top: 5px; }

        /* ИЗДӨӨ ЖАНА ЧЫПКАЛАР */
        .controls-box { background: rgba(15, 15, 40, 0.7); border: 1px solid rgba(168,85,247,0.3); border-radius: 16px; padding: 20px; margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center; }
        .search-input { flex: 1; min-width: 250px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 12px 18px; color: #fff; font-size: 1rem; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.3); }
        
        .categories-filter { display: flex; gap: 10px; flex-wrap: wrap; }
        .cat-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #ccc; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-size: 0.9rem; font-weight: bold; }
        .cat-btn.active, .cat-btn:hover { background: #a855f7; color: #fff; border-color: #a855f7; }

        /* ЖАРНАМА ЗОНАСЫ */
        .ad-banner { width: 100%; margin-bottom: 30px; text-align: center; }

        /* КИТЕПТЕР КОРЗИНАСЫ / СЕТКАСЫ */
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .book-card { background: #0c0926; border: 1px solid rgba(168,85,247,0.2); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; transition: 0.3s; position: relative; overflow: hidden; }
        .book-card:hover { transform: translateY(-7px); border-color: #a855f7; box-shadow: 0 10px 25px rgba(168,85,247,0.25); }
        
        .book-cover { width: 100%; height: 260px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; background: #1a1738; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #a855f7; }
        .book-title { font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 8px; line-height: 1.3; }
        .book-author { font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px; }
        .book-badge { position: absolute; top: 25px; right: 25px; background: rgba(168,85,247,0.85); color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 10px; font-weight: bold; backdrop-filter: blur(5px); }

        .book-actions { margin-top: auto; display: flex; gap: 8px; }
        .btn-read { flex: 1; background: #a855f7; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; text-decoration: none; font-size: 0.9rem; }
        .btn-read:hover { background: #9333ea; }
        .btn-audio { background: rgba(255,170,0,0.15); border: 1px solid #ffaa00; color: #ffaa00; padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-audio:hover { background: #ffaa00; color: #000; }

        /* МОДАЛДЫК ТЕРЕЗЕ (КИТЕП ОКУУ) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(8px); }
        .modal-box { background: #0c0926; border: 2px solid #a855f7; width: 90%; max-width: 900px; height: 85vh; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .modal-header { padding: 15px 25px; background: rgba(168,85,247,0.1); border-bottom: 1px solid rgba(168,85,247,0.3); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 1.3rem; color: #fff; font-weight: bold; }
        .close-btn { background: #ff3366; border: none; color: #fff; width: 35px; height: 35px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; font-weight: bold; }
        .modal-body { flex: 1; padding: 20px; overflow-y: auto; color: #e2e8f0; font-size: 1.1rem; line-height: 1.8; }
        .reader-frame { width: 100%; height: 100%; border: none; border-radius: 10px; background: #fff; }
    </style>
</head>
<body>

    <header>
        <a href="kindergarten.html" class="back-btn">← Бала бакчага кайтуу</a>
        <div class="header-title">
            <h1>📚 Жомоктор жана Балдар Китептери</h1>
            <p>Балдар үчүн кызыктуу элдик жомоктор, сүрөттүү китептер жана аудио аңгемелер</p>
        </div>
        <div style="width: 150px;"></div>
    </header>

    <!-- ИЗДӨӨ ЖАНА КАТЕГОРИЯЛАР -->
    <div class="controls-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Жомок же китептин атын издеңиз..." oninput="filterBooks()">
        <div class="categories-filter">
            <button class="cat-btn active" onclick="setCategory('all', this)">Бардыгы</button>
            <button class="cat-btn" onclick="setCategory('jomok', this)">Эл жомоктору</button>
            <button class="cat-btn" onclick="setCategory('audio', this)">Аудио жомоктор</button>
            <button class="cat-btn" onclick="setCategory('picture', this)">Сүрөттүү китептер</button>
        </div>
    </div>

    <!-- GOOGLE ADSENSE BANNER -->
    <div class="ad-banner">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-1495571814896964"
             data-ad-slot="1574613769"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <!-- КИТЕПТЕР СЕТКАСЫ -->
    <div class="books-grid" id="booksGrid"></div>

    <!-- КИТЕП ОКУУ МОДАЛДЫК ТЕРЕЗЕСИ -->
    <div class="modal-overlay" id="readerModal">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title" id="modalBookTitle">Китеп аталышы</span>
                <button class="close-btn" onclick="closeReader()">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- PDF / Ичиндеги текст ушул жерге жүктөлөт -->
            </div>
        </div>
    </div>

    <script>
        // БАЛДАР КИТЕПКАНАСЫНЫН МАТЕРИАЛДАР БАЗАСЫ
        const booksData = [
            {
                id: 1,
                title: "Алтын Куш Жомогу",
                author: "Кыргыз эл жомогу",
                category: "jomok",
                badge: "Элдик жомок",
                cover: "🦚",
                content: "Бир бар экен, бир жок экен, байыркы заманда бир акылман хан жашаптыр. Анын багында алтын алма берүүчү дарак бар экен...",
                pdfUrl: ""
            },
            {
                id: 2,
                title: "Акылдуу Чыйырчык",
                author: "Балдар аңгемеси",
                category: "picture",
                badge: "Сүрөттүү",
                cover: "🐦",
                content: "Жаз келип, чыйырчыктар жылуу жактан учуп келишти. Алар бакчадагы эң бийик жыгач үйгө жайгашып, ырдай башташты...",
                pdfUrl: ""
            },
            {
                id: 3,
                title: "Боорсоктун Жоруктары",
                author: "Сүйүктүү жомок",
                category: "audio",
                badge: "Аудио",
                cover: "🥖",
                content: "Бир күнү кемпир чалга боорсок бышырып бериптир. Боорсок терезеден секирип түшүп, токойду көздөй качып жөнөптүр...",
                audioText: "Боорсоктун аудио форматы иштетилүүдө..."
            },
            {
                id: 4,
                title: "Түлкү менен Турна",
                author: "Ариеттүү сабак",
                category: "jomok",
                badge: "Элдик жомок",
                cover: "🦊",
                content: "Түлкү менен турна дос болушуптур. Бир күнү түлкү турнаны конокко чакырып, жалпак табакка суюк ботко куюп бериптир...",
                pdfUrl: ""
            },
            {
                id: 5,
                title: "Жайлоодогу Күн",
                author: "Табият сырлары",
                category: "picture",
                badge: "Сүрөттүү",
                cover: "🏔️",
                content: "Аскар жайлоого чоң атасыныкына барды. Ал жерде тунук булактар, көк майсандар жана көптөгөн козу-лактар бар экен...",
                pdfUrl: ""
            }
        ];

        let currentCategory = 'all';

        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = booksData.filter(book => {
                const matchesCat = (currentCategory === 'all' || book.category === currentCategory);
                const matchesSearch = book.title.toLowerCase().includes(searchVal) || book.author.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #94a3b8; font-size: 1.2rem;">Эч кандай китеп же жомок табылган жок 🔍</div>`;
                return;
            }

            filtered.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <span class="book-badge">${book.badge}</span>
                    <div class="book-cover">${book.cover}</div>
                    <div class="book-title">${book.title}</div>
                    <div class="book-author">${book.author}</div>
                    <div class="book-actions">
                        <button class="btn-read" onclick="openReader(${book.id})">Окуу 📖</button>
                        <button class="btn-audio" onclick="playAudio('${book.title}')">🔊</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderBooks();
        }

        function filterBooks() {
            renderBooks();
        }

        function openReader(bookId) {
            const book = booksData.find(b => b.id === bookId);
            if (!book) return;

            document.getElementById('modalBookTitle').innerText = book.title;
            const body = document.getElementById('modalBody');

            if (book.pdfUrl) {
                body.innerHTML = `<iframe src="${book.pdfUrl}" class="reader-frame"></iframe>`;
            } else {
                body.innerHTML = `
                    <div style="background: rgba(255,255,255,0.03); padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                        <h2 style="color: #a855f7; margin-bottom: 15px;">${book.title}</h2>
                        <p style="font-size: 1.15rem; line-height: 2;">${book.content}</p>
                    </div>
                `;
            }

            document.getElementById('readerModal').style.display = 'flex';
        }

        function closeReader() {
            document.getElementById('readerModal').style.display = 'none';
        }

        function playAudio(title) {
            alert(`"${title}" жомогунун аудио варианты жакында кошулат!`);
        }

        // Баштапкы жүктөө
        renderBooks();
    </script>
</body>
</html>
