<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жомоктор жана Балдар Китептери — BiliMal</title>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1495571814896964" crossorigin="anonymous"></script>
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GSQV60QV0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #050312; color: #fff; padding: 30px 4%; min-height: 100vh; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        
        .back-btn { background: rgba(255,255,255,0.08); border: 1px solid #a855f7; color: #a855f7; padding: 10px 20px; border-radius: 12px; text-decoration: none; font-weight: bold; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .back-btn:hover { background: #a855f7; color: #fff; box-shadow: 0 0 15px rgba(168,85,247,0.4); }

        .admin-controls { display: flex; gap: 10px; align-items: center; }

        .add-book-btn { background: #00ff96; color: #000; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 0.95rem; display: none; }
        .add-book-btn:hover { background: #00cc78; box-shadow: 0 0 15px rgba(0,255,150,0.4); }

        .admin-login-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #94a3b8; padding: 8px 14px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; transition: 0.3s; }
        .admin-login-btn:hover { color: #fff; border-color: #a855f7; }

        .admin-logout-btn { background: rgba(255,51,102,0.2); border: 1px solid #ff3366; color: #ff3366; padding: 8px 14px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; transition: 0.3s; display: none; }
        .admin-logout-btn:hover { background: #ff3366; color: #fff; }
        
        .header-title { text-align: center; flex: 1; }
        .header-title h1 { font-size: 2.2rem; color: #a855f7; text-shadow: 0 0 15px rgba(168,85,247,0.3); }
        .header-title p { color: #94a3b8; font-size: 1rem; margin-top: 5px; }

        /* ИЗДӨӨ ЖАНА ЧЫПКАЛАР */
        .controls-box { background: rgba(15, 15, 40, 0.7); border: 1px solid rgba(168,85,247,0.3); border-radius: 16px; padding: 20px; margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center; }
        .search-input { flex: 1; min-width: 250px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 12px 18px; color: #fff; font-size: 1rem; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.3); }
        
        .categories-filter { display: flex; gap: 10px; flex-wrap: wrap; }
        .cat-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #ccc; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-size: 0.9rem; font-weight: bold; }
        .cat-btn.active, .cat-btn:hover { background: #a855f7; color: #fff; border-color: #a855f7; }

        /* ЖАРНАМА ЗОНАСЫ */
        .ad-banner { width: 100%; margin-bottom: 30px; text-align: center; }

        /* КИТЕПТЕР СЕТКАСЫ */
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
        .book-card { background: #0c0926; border: 1px solid rgba(168,85,247,0.2); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; transition: 0.3s; position: relative; overflow: hidden; }
        .book-card:hover { transform: translateY(-7px); border-color: #a855f7; box-shadow: 0 10px 25px rgba(168,85,247,0.25); }
        
        .book-cover { width: 100%; height: 180px; border-radius: 10px; margin-bottom: 15px; background: rgba(168,85,247,0.08); display: flex; align-items: center; justify-content: center; font-size: 4rem; color: #a855f7; border: 1px dashed rgba(168,85,247,0.3); }
        .book-title { font-size: 1.15rem; font-weight: bold; color: #fff; margin-bottom: 6px; line-height: 1.3; }
        .book-author { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }
        .book-badge { position: absolute; top: 25px; right: 25px; background: rgba(168,85,247,0.85); color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 10px; font-weight: bold; backdrop-filter: blur(5px); }

        .book-actions { margin-top: auto; display: flex; gap: 8px; }
        .btn-read { flex: 1; background: #a855f7; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; text-decoration: none; font-size: 0.9rem; }
        .btn-read:hover { background: #9333ea; }
        
        /* ӨЧҮРҮҮ БАСКЫЧЫ ДЕФОЛТТУК КҮЙДӨ ЖАШЫРУУН */
        .btn-delete { background: rgba(255,51,102,0.15); border: 1px solid #ff3366; color: #ff3366; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; display: none; }
        .btn-delete:hover { background: #ff3366; color: #fff; }

        /* МОДАЛДЫК ТЕРЕЗЕЛЕР */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(8px); }
        .modal-box { background: #0c0926; border: 2px solid #a855f7; width: 90%; max-width: 900px; height: 85vh; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .modal-box.form-modal { height: auto; max-height: 90vh; max-width: 600px; }
        .modal-box.auth-modal { height: auto; max-width: 400px; }

        .modal-header { padding: 18px 25px; background: rgba(168,85,247,0.1); border-bottom: 1px solid rgba(168,85,247,0.3); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 1.3rem; color: #fff; font-weight: bold; }
        .close-btn { background: #ff3366; border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
        
        .modal-body { flex: 1; padding: 25px; overflow-y: auto; color: #e2e8f0; font-size: 1.1rem; line-height: 1.8; }
        .reader-frame { width: 100%; height: 100%; border: none; border-radius: 10px; background: #fff; }

        /* ФОРМА СТИЛДЕРИ */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 0.95rem; font-weight: bold; }
        .form-control { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 12px; color: #fff; font-size: 0.95rem; outline: none; }
        .form-control:focus { border-color: #a855f7; }
        textarea.form-control { resize: vertical; min-height: 120px; }
        
        .submit-btn { width: 100%; background: #a855f7; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { background: #9333ea; box-shadow: 0 0 15px rgba(168,85,247,0.4); }
    </style>
</head>
<body>

    <header>
        <a href="kindergarten.html" class="back-btn">← Бала бакчага кайтуу</a>
        <div class="header-title">
            <h1>📚 Жомоктор жана Балдар Китептери</h1>
            <p>Балдар үчүн кызыктуу элдик жомоктор, сүрөттүү китептер жана PDF/тексттик аңгемелер</p>
        </div>
        
        <!-- АДМИН УПРАВЛЕНИЕ -->
        <div class="admin-controls">
            <button class="add-book-btn" id="addBookBtn" onclick="openAddModal()">+ Китеп кошуу</button>
            <button class="admin-login-btn" id="adminLoginBtn" onclick="openAdminAuthModal()">🔑 Админ</button>
            <button class="admin-logout-btn" id="adminLogoutBtn" onclick="logoutAdmin()">Выйти</button>
        </div>
    </header>

    <!-- ИЗДӨӨ ЖАНА КАТЕГОРИЯЛАР -->
    <div class="controls-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Жомок же китептин атын издеңиз..." oninput="filterBooks()">
        <div class="categories-filter">
            <button class="cat-btn active" onclick="setCategory('all', this)">Бардыгы</button>
            <button class="cat-btn" onclick="setCategory('jomok', this)">Эл жомоктору</button>
            <button class="cat-btn" onclick="setCategory('audio', this)">Аудио жомоктор</button>
            <button class="cat-btn" onclick="setCategory('picture', this)">Сүрөттүү / PDF</button>
        </div>
    </div>

    <!-- GOOGLE ADSENSE BANNER -->
    <div class="ad-banner">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-1495571814896964"
             data-ad-slot="1574613769"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <!-- КИТЕПТЕР СЕТКАСЫ -->
    <div class="books-grid" id="booksGrid"></div>

    <!-- 1. КИТЕП ОКУУ МОДАЛДЫК ТЕРЕЗЕСИ -->
    <div class="modal-overlay" id="readerModal">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title" id="modalBookTitle">Китеп аталышы</span>
                <button class="close-btn" onclick="closeModal('readerModal')">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- 2. АДМИН ПИН-КОД МОДАЛДЫК ТЕРЕЗЕСИ -->
    <div class="modal-overlay" id="adminAuthModal">
        <div class="modal-box auth-modal">
            <div class="modal-header">
                <span class="modal-title">🔐 Админ Кирүү</span>
                <button class="close-btn" onclick="closeModal('adminAuthModal')">✕</button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleAdminAuth(event)">
                    <div class="form-group">
                        <label>Администратор PIN коду:</label>
                        <input type="password" id="adminPinInput" class="form-control" placeholder="PIN кодду киргизиңиз" required>
                    </div>
                    <button type="submit" class="submit-btn">Кирүү</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 3. ЖАҢЫ КИТЕП КОШУУ МОДАЛДЫК ТЕРЕЗЕСИ (АДМИН ГАНА КӨРӨТ) -->
    <div class="modal-overlay" id="addBookModal">
        <div class="modal-box form-modal">
            <div class="modal-header">
                <span class="modal-title">➕ Жаңы китеп / жомок кошуу</span>
                <button class="close-btn" onclick="closeModal('addBookModal')">✕</button>
            </div>
            <div class="modal-body">
                <form id="addBookForm" onsubmit="handleSaveBook(event)">
                    <div class="form-group">
                        <label>Китептин / Жомоктун аталышы *</label>
                        <input type="text" id="bookTitle" class="form-control" placeholder="Мисалы: Алтын балык" required>
                    </div>

                    <div class="form-group">
                        <label>Автору / Булагы *</label>
                        <input type="text" id="bookAuthor" class="form-control" placeholder="Мисалы: Кыргыз эл жомогу" required>
                    </div>

                    <div class="form-group">
                        <label>Категориясы *</label>
                        <select id="bookCategory" class="form-control" required>
                            <option value="jomok">Эл жомоктору</option>
                            <option value="picture">Сүрөттүү / PDF китеп</option>
                            <option value="audio">Аудио жомок</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Иконка (Эмоджи) *</label>
                        <input type="text" id="bookIcon" class="form-control" placeholder="Мисалы: 📖, 🦊, 🐉, 📕" value="📖" required>
                    </div>

                    <div class="form-group">
                        <label>Форматы *</label>
                        <select id="bookFormat" class="form-control" onchange="toggleFormatFields()" required>
                            <option value="text">Текст түрүндө (Мазмунун жазуу)</option>
                            <option value="pdf">PDF Шилтемеси (Google Drive / Түз URL)</option>
                        </select>
                    </div>

                    <div class="form-group" id="textGroup">
                        <label>Китептин / Жомоктун текст мазмуну *</label>
                        <textarea id="bookContent" class="form-control" placeholder="Жомоктун же китептин текстин ушул жерге жазыңыз..."></textarea>
                    </div>

                    <div class="form-group" id="pdfGroup" style="display: none;">
                        <label>PDF Файлдын Шилтемеси (URL) *</label>
                        <input type="url" id="bookPdfUrl" class="form-control" placeholder="https://drive.google.com/... же түз URL">
                    </div>

                    <button type="submit" class="submit-btn">💾 Китепканага сактоо</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIGURATION (BiliMal Жалпы долбоору)
        const firebaseConfig = {
            databaseURL: "https://bilimal-default-rtdb.firebaseio.com"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // АДМИН ПИН-КОДУ (Өзүңүзгө ылайыктуу пароль коюңуз)
        const ADMIN_SECRET_PIN = "7788"; 
        let isAdminLoggedIn = false;

        // ДЕФОЛТТУК КИТЕПТЕР БАЗАСЫ (Эгер маалымат базасы бош болсо)
        const defaultBooks = [
            {
                id: "default_1",
                title: "Алтын Куш Жомогу",
                author: "Кыргыз эл жомогу",
                category: "jomok",
                badge: "Элдик жомок",
                cover: "🦚",
                format: "text",
                content: "Бир бар экен, бир жок экен, байыркы заманда бир акылман хан жашаптыр. Анын багында алтын алма берүүчү дарак бар экен. Бирок күн сайын түн ичинде бир сыйкырдуу Алтын Куш учуп келип, бактагы эң таттуу алтын алманы жеп кетет экен..."
            },
            {
                id: "default_2",
                title: "Боорсоктун Жоруктары",
                author: "Сүйүктүү жомок",
                category: "jomok",
                badge: "Жомок",
                cover: "🥖",
                format: "text",
                content: "Бир күнү кемпир чалга боорсок бышырып бериптир. Боорсок терезеден секирип түшүп, токойду көздөй качып жөнөптүр. Жолдон ага коён, карышкыр, аюу жолугуптур..."
            }
        ];

        let booksData = [];
        let currentCategory = 'all';

        // КИТЕПТЕРДИ FIREBASE ЖАНА LOCALSTORAGE'ДЕН ИНИЦИАЛИЗАЦИЯЛОО
        function loadBooks() {
            // 1. Firebase Realtime Database синхронизациясы
            const booksRef = database.ref('kids_library/books');
            booksRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    booksData = Object.keys(data).map(key => ({
                        id: key,
                        ...data[key]
                    }));
                } else {
                    booksData = defaultBooks;
                }
                localStorage.setItem('bilimal_kids_books', JSON.stringify(booksData));
                renderBooks();
            }, (error) => {
                // Эгер тармак жок болсо, LocalStorage Fallback
                console.warn("Firebase туташуусу болбоду, LocalStorage колдонулууда:", error);
                const stored = localStorage.getItem('bilimal_kids_books');
                booksData = stored ? JSON.parse(stored) : defaultBooks;
                renderBooks();
            });
        }

        // АДМИН СЕССИЯСЫН ТЕКШЕРҮҮ
        function checkAdminSession() {
            const savedAdmin = sessionStorage.getItem('bilimal_kids_admin');
            if (savedAdmin === 'true') {
                isAdminLoggedIn = true;
                updateAdminUI(true);
            } else {
                isAdminLoggedIn = false;
                updateAdminUI(false);
            }
        }

        function updateAdminUI(loggedIn) {
            const addBtn = document.getElementById('addBookBtn');
            const loginBtn = document.getElementById('adminLoginBtn');
            const logoutBtn = document.getElementById('adminLogoutBtn');

            if (loggedIn) {
                addBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'inline-block';
                loginBtn.style.display = 'none';
            } else {
                addBtn.style.display = 'none';
                logoutBtn.style.display = 'none';
                loginBtn.style.display = 'inline-block';
            }
            renderBooks();
        }

        function openAdminAuthModal() {
            document.getElementById('adminAuthModal').style.display = 'flex';
        }

        function handleAdminAuth(e) {
            e.preventDefault();
            const pin = document.getElementById('adminPinInput').value;
            if (pin === ADMIN_SECRET_PIN) {
                sessionStorage.setItem('bilimal_kids_admin', 'true');
                isAdminLoggedIn = true;
                updateAdminUI(true);
                closeModal('adminAuthModal');
                document.getElementById('adminPinInput').value = '';
                alert('Администратор режими ийгиликтүү жандырылды! Эми китеп кошуп же өчүрө аласыз.');
            } else {
                alert('Ката PIN код! Кайра текшерип киргизиңиз.');
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('bilimal_kids_admin');
            isAdminLoggedIn = false;
            updateAdminUI(false);
            alert('Администратор режиминен чыктыңыз.');
        }

        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = booksData.filter(book => {
                const matchesCat = (currentCategory === 'all' || book.category === currentCategory);
                const matchesSearch = book.title.toLowerCase().includes(searchVal) || book.author.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #94a3b8; font-size: 1.1rem;">Эч кандай китеп же жомок табылган жок 🔍</div>`;
                return;
            }

            filtered.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                
                const badgeText = book.format === 'pdf' ? 'PDF Китеп' : (book.badge || 'Жомок');
                const deleteDisplay = isAdminLoggedIn ? 'inline-block' : 'none';

                card.innerHTML = `
                    <span class="book-badge">${badgeText}</span>
                    <div class="book-cover">${book.cover || '📖'}</div>
                    <div class="book-title">${escapeHtml(book.title)}</div>
                    <div class="book-author">${escapeHtml(book.author)}</div>
                    <div class="book-actions">
                        <button class="btn-read" onclick="openReader('${book.id}')">Окуу 📖</button>
                        <button class="btn-delete" style="display: ${deleteDisplay}" onclick="deleteBook('${book.id}')" title="Өчүрүү">🗑️</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderBooks();
        }

        function filterBooks() {
            renderBooks();
        }

        function openReader(bookId) {
            const book = booksData.find(b => String(b.id) === String(bookId));
            if (!book) return;

            document.getElementById('modalBookTitle').innerText = book.title;
            const body = document.getElementById('modalBody');

            if (book.format === 'pdf' && book.pdfUrl) {
                let embedUrl = book.pdfUrl;
                if(embedUrl.includes('drive.google.com') && embedUrl.includes('/view')) {
                    embedUrl = embedUrl.replace('/view', '/preview');
                }
                body.innerHTML = `<iframe src="${embedUrl}" class="reader-frame" allow="autoplay"></iframe>`;
            } else {
                body.innerHTML = `
                    <div style="background: rgba(255,255,255,0.02); padding: 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                        <h2 style="color: #a855f7; margin-bottom: 15px; font-size: 1.5rem;">${escapeHtml(book.title)}</h2>
                        <div style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">Автору: ${escapeHtml(book.author)}</div>
                        <p style="font-size: 1.15rem; line-height: 2; white-space: pre-line;">${escapeHtml(book.content)}</p>
                    </div>
                `;
            }

            document.getElementById('readerModal').style.display = 'flex';
        }

        function openAddModal() {
            if (!isAdminLoggedIn) {
                alert("Уруксат берилген жок! Китеп кошуу үчүн адегенде Админ катары кириңиз.");
                return;
            }
            document.getElementById('addBookModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function toggleFormatFields() {
            const format = document.getElementById('bookFormat').value;
            const textGroup = document.getElementById('textGroup');
            const pdfGroup = document.getElementById('pdfGroup');

            if (format === 'pdf') {
                textGroup.style.display = 'none';
                pdfGroup.style.display = 'block';
                document.getElementById('bookPdfUrl').required = true;
                document.getElementById('bookContent').required = false;
            } else {
                textGroup.style.display = 'block';
                pdfGroup.style.display = 'none';
                document.getElementById('bookPdfUrl').required = false;
                document.getElementById('bookContent').required = true;
            }
        }

        function handleSaveBook(e) {
            e.preventDefault();

            if (!isAdminLoggedIn) {
                alert("Сиз администратор эмессиз!");
                return;
            }

            const title = document.getElementById('bookTitle').value.trim();
            const author = document.getElementById('bookAuthor').value.trim();
            const category = document.getElementById('bookCategory').value;
            const icon = document.getElementById('bookIcon').value.trim() || '📖';
            const format = document.getElementById('bookFormat').value;
            const content = document.getElementById('bookContent').value.trim();
            const pdfUrl = document.getElementById('bookPdfUrl').value.trim();

            const newBook = {
                title: title,
                author: author,
                category: category,
                badge: format === 'pdf' ? 'PDF Китеп' : 'Жомок',
                cover: icon,
                format: format,
                content: content,
                pdfUrl: pdfUrl,
                createdAt: Date.now()
            };

            // Firebase'ге сактоо
            const newBookRef = database.ref('kids_library/books').push();
            newBookRef.set(newBook).then(() => {
                document.getElementById('addBookForm').reset();
                toggleFormatFields();
                closeModal('addBookModal');
                alert("Китеп маалымат базасына ийгиликтүү кошулду!");
            }).catch(err => {
                console.error("Firebase сактоодо ката чыкты:", err);
                alert("Ката чыкты. Китеп жергиликтүү гана сакталды.");
            });
        }

        function deleteBook(bookId) {
            if (!isAdminLoggedIn) {
                alert("Өчүрүүгө уруксатыңыз жок!");
                return;
            }

            if (confirm('Бул китепти чынында эле өчүргүңүз келеби?')) {
                if (String(bookId).startsWith('default_')) {
                    booksData = booksData.filter(b => b.id !== bookId);
                    renderBooks();
                } else {
                    database.ref(`kids_library/books/${bookId}`).remove().then(() => {
                        alert("Китеп өчүрүлдү!");
                    });
                }
            }
        }

        function escapeHtml(text) {
            if(!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // БАШТАПКЫ ИШКЕ ТҮШҮРҮҮ
        checkAdminSession();
        loadBooks();
    </script>
</body>
</html>
