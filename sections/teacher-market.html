<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Жеке Кабинет - BilimAl</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b1329; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(23, 32, 54, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .input-field { background-color: #172036; border: 1px solid #2d3a5a; color: white; transition: all 0.2s; }
    .input-field:focus { border-color: #a855f7; outline: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Авторизация блогу -->
  <div id="authSection" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
    <div class="glass-card max-w-sm w-full p-6 rounded-2xl space-y-4">
      <h2 class="text-xl font-bold text-center text-white">Мугалимдер үчүн кирүү</h2>
      <form id="authForm" class="space-y-3">
        <input type="email" id="authEmail" placeholder="Электрондук почта" required class="input-field w-full p-3 rounded-xl text-sm">
        <input type="password" id="authPassword" placeholder="Сыр сөз" required class="input-field w-full p-3 rounded-xl text-sm">
        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white py-3 rounded-xl font-bold text-sm">Кирүү / Катталуу</button>
      </form>
    </div>
  </div>

  <!-- Кабинет Хедери -->
  <header class="glass-card sticky top-0 z-40 px-6 py-4 shadow-xl flex items-center justify-between">
    <a href="/sections/lesson-plans.html" class="text-2xl font-bold text-purple-400">BilimAl</a>
    <div class="flex items-center gap-4">
      <span id="userEmailDisplay" class="text-xs text-slate-300"></span>
      <button id="btnLogout" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-lg flex items-center gap-1">
        <i class="fa-solid fa-right-from-bracket"></i> Чыгуу
      </button>
    </div>
  </header>

  <!-- Кабинеттин негизги бөлүгү -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
    
    <!-- Финансылык панель -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Мугалимдин Таза Балансы (79%) -->
      <div class="glass-card p-5 rounded-2xl space-y-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-green-500/20 text-green-400 flex items-center justify-center text-xl"><i class="fa-solid fa-wallet"></i></div>
          <div>
            <p class="text-xs text-slate-400">Мугалимдин капчыгы (79%)</p>
            <h3 class="text-2xl font-bold text-green-400" id="teacherBalance">0 сом</h3>
          </div>
        </div>
        <button id="btnWithdraw" disabled class="w-full bg-green-600 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-green-500 text-white text-xs font-bold py-2.5 rounded-xl transition">
          MBank'ка чечүү (мин. 100 сом)
        </button>
      </div>

      <!-- Комиссия -->
      <div class="glass-card p-5 rounded-2xl flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-xl"><i class="fa-solid fa-percent"></i></div>
        <div>
          <p class="text-xs text-slate-400">Платформа комиссиясы</p>
          <h3 class="text-2xl font-bold text-white">21%</h3>
          <p class="text-[10px] text-slate-500">Автоматтык түрдө кармалат</p>
        </div>
      </div>

      <!-- MBank реквизит сактоо -->
      <div class="glass-card p-5 rounded-2xl space-y-3">
        <p class="text-xs font-semibold text-slate-300">Корголгон MBank Реквизитим</p>
        <div class="flex gap-2">
          <input type="text" id="mbankReqInput" placeholder="+996XXXXXXXXX" class="input-field flex-1 px-3 py-2 rounded-xl text-xs">
          <button id="btnSaveReq" class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-3 py-2 rounded-xl font-bold">Сактоо</button>
        </div>
      </div>
    </div>

    <!-- Жаңы материал кошуу жана Менин материалдарым -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Форма -->
      <div class="glass-card p-5 rounded-2xl space-y-4">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-circle-plus text-purple-400"></i> Жаңы материал кошуу
        </h3>
        <form id="addMaterialForm" class="space-y-3">
          <input type="text" id="matTitle" placeholder="Материалдын аталышы *" required class="input-field w-full p-2.5 rounded-xl text-xs">
          
          <!-- Толук Предметтер Тизмеси -->
          <select id="matSubject" required class="input-field w-full p-2.5 rounded-xl text-xs">
            <option value="">Предметти тандаңыз</option>
            <option value="Физика">Физика</option>
            <option value="Математика">Математика</option>
            <option value="Кыргыз тили">Кыргыз тили</option>
            <option value="Кыргыз адабияты">Кыргыз адабияты</option>
            <option value="Астрономия">Астрономия</option>
            <option value="Химия">Химия</option>
            <option value="Биология">Биология</option>
            <option value="География">География</option>
            <option value="Тарых">Тарых</option>
            <option value="Информатика">Информатика</option>
            <option value="Орус тили">Орус тили</option>
            <option value="Англис тили">Англис тили</option>
            <option value="Немис тили">Немис тили</option>
            <option value="Көркөм өнөр">Көркөм өнөр</option>
            <option value="Музыка">Музыка</option>
            <option value="Дене тарбия">Дене тарбия</option>
            <option value="Адеп / Адам жана коом">Адеп / Адам жана коом</option>
            <option value="Башталгыч класс">Башталгыч класс</option>
            <option value="Башка">Башка</option>
          </select>

          <!-- Толук Материалдын Түрлөрү (Түшүндүрмөсү жана эмодзилери менен) -->
          <select id="matType" required class="input-field w-full p-2.5 rounded-xl text-xs">
            <option value="">Түрүн тандаңыз</option>
            <option value="📘 Сабак пландары (Word, PDF, 3C+1E, 5E, кыска мөөнөттүү план)">📘 Сабак пландары (Word, PDF, 3C+1E, 5E, кыска мөөнөттүү план)</option>
            <option value="🖥️ Презентациялар (PowerPoint, Canva, Google Slides)">🖥️ Презентациялар (PowerPoint, Canva, Google Slides)</option>
            <option value="🎬 Видеосабактар (Толук сабак, түшүндүрмө видео, эксперименттер)">🎬 Видеосабактар (Толук сабак, түшүндүрмө видео, эксперименттер)</option>
            <option value="📝 Тесттер (Даяр тест, олимпиадалык тест, чейректик тест)">📝 Тесттер (Даяр тест, олимпиадалык тест, чейректик тест)</option>
            <option value="🧮 Маселелер жыйнагы (Физика, математика, химия ж.б.)">🧮 Маселелер жыйнагы (Физика, математика, химия ж.б.)</option>
            <option value="📄 Жумушчу баракчалар (Worksheet, карточка, практикалык тапшырмалар)">📄 Жумушчу баракчалар (Worksheet, карточка, практикалык тапшырмалар)</option>
            <option value="🧪 Лабораториялык иштер (Нускама + таблица + жыйынтык үлгүсү)">🧪 Лабораториялык иштер (Нускама + таблица + жыйынтык үлгүсү)</option>
            <option value="📑 Контролдук иштер (БЖБ/ТЖБ, текшерүү иштери)">📑 Контролдук иштер (БЖБ/ТЖБ, текшерүү иштери)</option>
            <option value="🏆 Олимпиада материалдары (Маселелер, жооптор, даярдык курстары)">🏆 Олимпиада материалдары (Маселелер, жооптор, даярдык курстары)</option>
            <option value="📚 Электрондук китептер (Автордук окуу куралдары, методикалык колдонмолор)">📚 Электрондук китептер (Автордук окуу куралдары, методикалык колдонмолор)</option>
            <option value="🎮 Окутуучу оюндар (Quiz, интерактивдүү оюн, HTML оюндар)">🎮 Окутуучу оюндар (Quiz, интерактивдүү оюн, HTML оюндар)</option>
            <option value="🧩 Интерактивдүү тапшырмалар (LearningApps/Genially сыяктуу материалдар)">🧩 Интерактивдүү тапшырмалар (LearningApps/Genially сыяктуу материалдар)</option>
            <option value="🔬 Виртуалдык лабораториялар (Физика, химия, биология симуляциялары)">🔬 Виртуалдык лабораториялар (Физика, химия, биология симуляциялары)</option>
            <option value="🎨 Дизайн материалдары (Постер, плакат, инфографика, сертификат)">🎨 Дизайн материалдары (Постер, плакат, инфографика, сертификат)</option>
            <option value="📋 Документ шаблондору (Күндөлүк, журнал, отчет, портфолио)">📋 Документ шаблондору (Күндөлүк, журнал, отчет, портфолио)</option>
            <option value="👨‍👩‍👦 Ата-эне менен иштөө (Жыйын протоколу, анкета, билдирүү шаблондору)">👨‍👩‍👦 Ата-эне менен иштөө (Жыйын протоколу, анкета, билдирүү шаблондору)</option>
            <option value="👨‍🏫 Класс жетекчиге материалдар (Тарбиялык сааттар, сценарийлер, пландар)">👨‍🏫 Класс жетекчиге материалдар (Тарбиялык сааттар, сценарийлер, пландар)</option>
            <option value="🎉 Иш-чара сценарийлери (Акыркы коңгуроо, мугалимдер күнү, майрамдар)">🎉 Иш-чара сценарийлери (Акыркы коңгуроо, мугалимдер күнү, майрамдар)</option>
            <option value="🎓 Курстар (Видео курс + материалдар + сертификат)">🎓 Курстар (Видео курс + материалдар + сертификат)</option>
            <option value="🤖 AI үчүн промпттар (Сабак даярдоо, тест түзүү, презентация үчүн даяр prompt топтомдору)">🤖 AI үчүн промпттар (Сабак даярдоо, тест түзүү, презентация үчүн даяр prompt топтомдору)</option>
            <option value="📦 Даяр комплекттер (Бир тема боюнча план + презентация + тест + тапшырма)">📦 Даяр комплекттер (Бир тема боюнча план + презентация + тест + тапшырма)</option>
          </select>

          <input type="number" id="matPrice" placeholder="Баасы (сом)" min="0" required class="input-field w-full p-2.5 rounded-xl text-xs">
          <input type="url" id="matFileUrl" placeholder="Файлга шилтеме (Google Drive/Telegram)" required class="input-field w-full p-2.5 rounded-xl text-xs">
          <textarea id="matDesc" placeholder="Кыскача сүрөттөмө" class="input-field w-full p-2.5 rounded-xl text-xs h-20"></textarea>

          <p id="bonusNotice" class="text-[11px] text-yellow-400 font-semibold hidden">🎁 6-материалыңыз АКЫСЫЗ катары жайгаштырылат!</p>

          <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white py-2.5 rounded-xl font-bold text-xs transition">Жайгаштыруу</button>
        </form>
      </div>

      <!-- Менин материалдарым -->
      <div class="glass-card p-5 rounded-2xl md:col-span-2 space-y-4">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-folder-open text-purple-400"></i> Менин жайгаштырган материалдарым
        </h3>
        <div id="myMaterialsList" class="space-y-3">
          <p class="text-xs text-slate-500 text-center py-8">Материалдар жок.</p>
        </div>
      </div>

    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
      authDomain: "bilimal-org.firebaseapp.com",
      databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "bilimal-org"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let currentUser = null;
    let myItemCount = 0;

    // Кирүү/Катталуу
    document.getElementById('authForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        if (err.code === 'auth/user-not-found') {
          await createUserWithEmailAndPassword(auth, email, pass);
        } else {
          alert('Ката: ' + err.message);
        }
      }
    };

    document.getElementById('btnLogout').onclick = () => signOut(auth);

    // Авторизация статусун көзөмөлдөө
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('userEmailDisplay').innerText = user.email;
        loadUserData();
      } else {
        document.getElementById('authSection').classList.remove('hidden');
      }
    });

    // Колдонуучунун маалыматын жүктөө
    function loadUserData() {
      // Балансты жүктөө
      onValue(ref(db, `users/${currentUser.uid}/balance`), snap => {
        const bal = snap.val() || 0;
        document.getElementById('teacherBalance').innerText = `${bal} сом`;
        const btnWithdraw = document.getElementById('btnWithdraw');
        
        if (bal >= 100) {
          btnWithdraw.disabled = false;
        } else {
          btnWithdraw.disabled = true;
        }
      });

      // Реквизит жүктөө
      get(ref(db, `users/${currentUser.uid}/mbank`)).then(snap => {
        if (snap.exists()) document.getElementById('mbankReqInput').value = snap.val();
      });

      // Менин материалдарымды жүктөө
      onValue(ref(db, 'market_items'), snap => {
        const data = snap.val();
        const list = document.getElementById('myMaterialsList');
        list.innerHTML = '';
        myItemCount = 0;

        if (!data) return;

        Object.keys(data).forEach(key => {
          const item = data[key];
          if (item.authorUid === currentUser.uid) {
            myItemCount++;
            const div = document.createElement('div');
            div.className = "bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex justify-between items-center";
            div.innerHTML = `
              <div class="space-y-1">
                <span class="text-[10px] text-purple-400 font-bold block">${item.subject} | ${item.type}</span>
                <h4 class="text-xs font-bold text-white">${item.title}</h4>
                <span class="text-xs text-green-400 font-bold">${item.price == 0 ? 'АКЫСЫЗ' : item.price + ' сом'}</span>
              </div>
              <button onclick="deleteItem('${key}')" class="text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>
            `;
            list.appendChild(div);
          }
        });

        const notice = document.getElementById('bonusNotice');
        if (myItemCount > 0 && (myItemCount + 1) % 6 === 0) {
          notice.classList.remove('hidden');
        } else {
          notice.classList.add('hidden');
        }
      });
    }

    // MBank реквизит сактоо
    document.getElementById('btnSaveReq').onclick = () => {
      const val = document.getElementById('mbankReqInput').value.trim();
      if (val) {
        set(ref(db, `users/${currentUser.uid}/mbank`), val);
        alert('Реквизит сакталды!');
      }
    };

    // Акча чечүү өтүнүчүн жөнөтүү
    document.getElementById('btnWithdraw').onclick = async () => {
      const snap = await get(ref(db, `users/${currentUser.uid}/balance`));
      const bal = snap.val() || 0;
      const mbank = document.getElementById('mbankReqInput').value;

      if (!mbank) {
        alert('Алгач MBank реквизитиңизди сактаңыз!');
        return;
      }

      const reqId = 'WITHDRAW_' + Date.now();
      await set(ref(db, `withdrawal_requests/${reqId}`), {
        uid: currentUser.uid, email: currentUser.email, amount: bal, mbank, createdAt: Date.now()
      });

      alert(`Арыз кабыл алынды! ${bal} сом жакында ${mbank} номериңизге которулат.`);
    };

    // Материал кошуу (6-материал АКЫСЫЗ)
    document.getElementById('addMaterialForm').onsubmit = async (e) => {
      e.preventDefault();

      let price = Number(document.getElementById('matPrice').value);
      
      if ((myItemCount + 1) % 6 === 0) {
        price = 0;
      }

      const newItemRef = push(ref(db, 'market_items'));
      await set(newItemRef, {
        title: document.getElementById('matTitle').value,
        subject: document.getElementById('matSubject').value,
        type: document.getElementById('matType').value,
        price: price,
        fileUrl: document.getElementById('matFileUrl').value,
        description: document.getElementById('matDesc').value,
        authorUid: currentUser.uid,
        authorEmail: currentUser.email,
        createdAt: Date.now()
      });

      alert(price === 0 ? '6-акысыз бонустук материалыңыз жайгаштырылды!' : 'Материал ийгиликтүү кошулду!');
      document.getElementById('addMaterialForm').reset();
    };

    // Өчүрүү
    window.deleteItem = (id) => {
      if (confirm('Материалды өчүрүүнү каалайсызбы?')) {
        remove(ref(db, `market_items/${id}`));
      }
    };
  </script>
</body>
</html>
