<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мугалимдин Маркети - BilimAl</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged,
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      get,
      push,
      onValue,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
      authDomain: "bilimal-org.firebaseapp.com",
      databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "bilimal-org",
      storageBucket: "bilimal-org.firebasestorage.app",
      messagingSenderId: "241750360816",
      appId: "1:241750360816:web:a991434eb5afbc470d7835",
      measurementId: "G-9GSQV60QV0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let userMaterialCount = 0;
    let allMaterialsData = {};
    let selectedCategory = 'Все';

    document.addEventListener("DOMContentLoaded", () => {
      const loadingState = document.getElementById('loadingState');
      const mainContent = document.getElementById('mainContent');
      const userEmailSpan = document.getElementById('userEmail');
      const userBalanceSpan = document.getElementById('userBalance');
      const logoutBtn = document.getElementById('logoutBtn');
      const materialsGrid = document.getElementById('materialsGrid');
      const categoryFilter = document.getElementById('categoryFilter');

      // Модалдык терезе элементтери
      const openAddModalBtn = document.getElementById('openAddModalBtn');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const addMaterialModal = document.getElementById('addMaterialModal');
      const addMaterialForm = document.getElementById('addMaterialForm');
      const formError = document.getElementById('formError');
      const saveMaterialBtn = document.getElementById('saveMaterialBtn');
      const bonusNotice = document.getElementById('bonusNotice');
      const userCountSpan = document.getElementById('userCountSpan');

      // Авторизацияны текшерүү
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          currentUser = user;
          if (userEmailSpan) {
            userEmailSpan.innerText = user.email || 'Колдонуучу';
          }

          // Балансты алуу
          try {
            const userRef = ref(db, `users/${user.uid}/balance`);
            const snapshot = await get(userRef);
            if (snapshot.exists()) {
              const rawBal = Number(snapshot.val()) || 0;
              userBalanceSpan.innerText = `${rawBal.toFixed(2)} сом`;
            } else {
              userBalanceSpan.innerText = '0.00 сом';
            }
          } catch (err) {
            console.error("Баланс алууда ката чыкты:", err);
            userBalanceSpan.innerText = '0.00 сом';
          }

          // Колдонуучу кошкон материалдардын санын жүктөө
          loadUserMaterialCount();

          // Материалдарды реалдуу убакытта угуу (market_items түйүнүнөн)
          loadMaterials();

          if (loadingState) loadingState.classList.add('hidden');
          if (mainContent) mainContent.classList.remove('hidden');
        } else {
          window.location.href = '/login.html';
        }
      });

      // Колдонуучу кошкон материалдардын санын эсептөө
      function loadUserMaterialCount() {
        if (!currentUser) return;
        const countRef = ref(db, `users/${currentUser.uid}/materialsCount`);
        onValue(countRef, (snapshot) => {
          if (snapshot.exists()) {
            userMaterialCount = snapshot.val();
          } else {
            userMaterialCount = 0;
          }
          if (userCountSpan) userCountSpan.innerText = userMaterialCount;
          updateBonusUI();
        });
      }

      function updateBonusUI() {
        const isNextFree = (userMaterialCount > 0 && (userMaterialCount + 1) % 6 === 0);
        if (bonusNotice) {
          if (isNextFree) {
            bonusNotice.innerHTML = `🎉 <strong>Куттуктайбыз!</strong> Бул сиздин ${userMaterialCount + 1}-чи материалыңыз. Бул материал БЕКЕР жайгаштырылат!`;
            bonusNotice.className = "bg-emerald-900/50 border border-emerald-500/60 text-emerald-300 text-xs p-3 rounded-xl mb-3";
            bonusNotice.classList.remove('hidden');
          } else {
            const left = 5 - (userMaterialCount % 6);
            bonusNotice.innerHTML = `💡 Сизде <strong>${userMaterialCount}</strong> материал бар. Дагы <strong>${left}</strong> материал кошсоңуз, кийинкиси БЕКЕР жайгаштырылат!`;
            bonusNotice.className = "bg-indigo-900/40 border border-indigo-500/40 text-indigo-300 text-xs p-3 rounded-xl mb-3";
            bonusNotice.classList.remove('hidden');
          }
        }
      }

      // Системадан чыгуу
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          try {
            await signOut(auth);
            window.location.href = '/login.html';
          } catch (err) {
            alert("Системадан чыгууда ката чыкты: " + err.message);
          }
        });
      }

      // Модалды ачуу/жабуу
      if (openAddModalBtn) {
        openAddModalBtn.addEventListener('click', () => {
          updateBonusUI();
          addMaterialModal.classList.remove('hidden');
          addMaterialModal.classList.add('flex');
        });
      }

      if (closeModalBtn) {
        closeModalBtn.addEventListener('click', () => {
          addMaterialModal.classList.add('hidden');
          addMaterialModal.classList.remove('flex');
          addMaterialForm.reset();
          formError.classList.add('hidden');
        });
      }

      // Категория боюнча фильтр
      if (categoryFilter) {
        categoryFilter.addEventListener('change', (e) => {
          selectedCategory = e.target.value;
          renderFilteredMaterials();
        });
      }

      // Жаңы материал кошуу (market_items түйүнүнө сакталат)
      if (addMaterialForm) {
        addMaterialForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          formError.classList.add('hidden');

          if (!currentUser) {
            formError.innerText = "Ката: Колдонуучу авторизациядан өткөн эмес. Кайра кириңиз.";
            formError.classList.remove('hidden');
            return;
          }

          saveMaterialBtn.disabled = true;
          saveMaterialBtn.innerText = 'Сакталууда...';

          const title = document.getElementById('matTitle').value.trim();
          const category = document.getElementById('matCategory').value;
          const subject = document.getElementById('matSubject').value.trim();
          const price = parseFloat(document.getElementById('matPrice').value) || 0;
          const desc = document.getElementById('matDesc').value.trim();
          const fileUrl = document.getElementById('matUrl').value.trim();

          const isBonusFree = (userMaterialCount > 0 && (userMaterialCount + 1) % 6 === 0);

          try {
            // Эрежеде уруксат берилген 'market_items' түйүнүнө сактайбыз
            const materialsRef = ref(db, 'market_items');
            await push(materialsRef, {
              title: title,
              category: category,
              subject: subject,
              price: price,
              description: desc,
              fileUrl: fileUrl,
              authorId: currentUser.uid,
              authorEmail: currentUser.email,
              isBonusFree: isBonusFree,
              createdAt: Date.now()
            });

            // Колдонуучунун материалдар санын көбөйтүү (users/$uid түйүнүнө уруксат бар)
            const userCountRef = ref(db, `users/${currentUser.uid}/materialsCount`);
            await runTransaction(userCountRef, (current) => {
              return (current || 0) + 1;
            });

            // Модалды жабуу
            addMaterialModal.classList.add('hidden');
            addMaterialModal.classList.remove('flex');
            addMaterialForm.reset();
            saveMaterialBtn.disabled = false;
            saveMaterialBtn.innerText = 'Жайгаштыруу';
          } catch (err) {
            saveMaterialBtn.disabled = false;
            saveMaterialBtn.innerText = 'Жайгаштыруу';
            formError.innerText = "Сактоодо ката чыкты: " + err.message;
            formError.classList.remove('hidden');
          }
        });
      }

      // Материалдарды 'market_items' түйүнүнөн жүктөө
      function loadMaterials() {
        const materialsRef = ref(db, 'market_items');
        onValue(materialsRef, (snapshot) => {
          if (snapshot.exists()) {
            allMaterialsData = snapshot.val();
          } else {
            allMaterialsData = {};
          }
          renderFilteredMaterials();
        }, (err) => {
          console.error("Материалдарды жүктөөдө ката:", err);
        });
      }

      function renderFilteredMaterials() {
        materialsGrid.innerHTML = '';
        const keys = Object.keys(allMaterialsData);

        const filteredKeys = keys.filter(key => {
          if (selectedCategory === 'Все') return true;
          return allMaterialsData[key].category === selectedCategory;
        });

        if (filteredKeys.length > 0) {
          filteredKeys.reverse().forEach((key) => {
            const item = allMaterialsData[key];
            const card = createMaterialCard(key, item);
            materialsGrid.appendChild(card);
          });
        } else {
          materialsGrid.innerHTML = `
            <div class="col-span-full text-center py-12 text-slate-500">
              Бул категорияда азырынча материал жок. Биринчи болуп кошуңуз!
            </div>
          `;
        }
      }

      // Карточка түзүү
      function createMaterialCard(id, item) {
        const card = document.createElement('div');
        card.className = 'bg-slate-800 border border-slate-700/60 rounded-2xl p-5 flex flex-col justify-between hover:border-indigo-500/50 transition duration-200 shadow-lg';

        const isFreeBadge = item.isBonusFree ? `<span class="bg-emerald-900/60 text-emerald-300 text-[10px] font-bold px-2 py-0.5 rounded border border-emerald-500/40">🎁 Бонус 6-материал</span>` : '';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 flex-wrap mb-2">
              <span class="bg-indigo-950 text-indigo-300 text-xs font-semibold px-2.5 py-1 rounded-lg border border-indigo-800/60">${item.category || 'Материал'}</span>
              ${isFreeBadge}
            </div>
            <h3 class="text-base font-bold text-slate-100 mt-1 break-words">${item.title}</h3>
            <p class="text-xs text-slate-400 font-medium mt-1">Предмет же Класс: <span class="text-slate-300">${item.subject || 'Жалпы'}</span></p>
            <p class="text-xs text-slate-400 mt-2 break-words line-clamp-3">${item.description}</p>
          </div>
          <div class="mt-6 flex items-center justify-between border-t border-slate-700/60 pt-4">
            <div>
              <span class="text-xs text-slate-500 block">Баасы:</span>
              <span class="text-lg font-bold text-emerald-400">${item.price} сом</span>
            </div>
            <button onclick="window.open('${item.fileUrl}', '_blank')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition shadow-md shadow-indigo-600/20">
              Ачуу / Сатып алуу
            </button>
          </div>
        `;
        return card;
      }
    });
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

          <option value="📝 Тесттер">📝 Тесттер (Даяр, олимпиадалык, чейректик)</option>

            <option value="🖥️ Презентациялар">🖥️ Презентациялар (PowerPoint, Canva, Google Slides)</option>

            <option value="📝 Тесттер">📝 Тесттер (Даяр, олимпиадалык, чейректик)</option>

            <option value="🔬 Виртуалдык лабораториялар">🔬 Виртуалдык лабораториялар (Симуляциялар)</option>
            <option value="🎨 Дизайн материалдары">🎨 Дизайн материалдары (Постер, инфографика)</option>
            <option value="📋 Документ шаблондору">📋 Документ шаблондору (Журнал, отчет, портфолио)</option>
            <option value="👨‍👩‍👦 Ата-эне менен иштөө">👨‍👩‍👦 Ата-эне менен иштөө (Протокол, анкета)</option>
            <option value="👨‍🏫 Класс жетекчиге материалдар">👨‍🏫 Класс жетекчиге материалдар (Тарбиялык саат)</option>
            <option value="🎉 Иш-чара сценарийлери">🎉 Иш-чара сценарийлери (Акыркы коңгуроо ж.б.)</option>
            <option value="🎓 Курстар">🎓 Курстар (Видео курс + сертификат)</option>
            <option value="🤖 AI үчүн промпттар">🤖 AI үчүн промпттар (Сабак, тест түзүү даяр промпттар)</option>
            <option value="📦 Даяр комплекттер">📦 Даяр комплекттер (План + презентация + тест)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Материалдын аталышы</label>
          <input type="text" id="matTitle" required placeholder="Мисалы: 7-класс Физика: Ньютон мыйзамы" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Предмет же Класс</label>
            <input type="text" id="matSubject" required placeholder="Мисалы: 8-класс Физика" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Баасы (сом)</label>
            <input type="number" id="matPrice" required min="0" placeholder="150" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Кыскача сүрөттөмө</label>
          <textarea id="matDesc" required rows="3" placeholder="Материалдын мазмуну, курамы тууралуу маалымат..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Материалга шилтеме (Google Drive, Telegram ж.б.)</label>
          <input type="url" id="matUrl" required placeholder="https://drive.google.com/..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div class="flex justify-end gap-3 pt-3 border-t border-slate-700">
          <button type="submit" id="saveMaterialBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-5 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20">
            Жайгаштыруу
          </button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
