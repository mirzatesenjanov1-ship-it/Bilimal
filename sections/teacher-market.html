<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мугалимдин маркетплейси - BilimAl</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto p-4 sm:p-6">
    <!-- Header -->
    <header class="flex justify-between items-center py-4 border-b border-slate-800 mb-8">
      <h1 class="text-2xl font-bold text-indigo-400">BilimAl</h1>
      <div id="userInfo" class="flex items-center gap-4 text-sm">
        <span id="userEmail" class="text-slate-400">Жүктөлүүдө...</span>
        <button id="logoutBtn" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300 transition">Чыгуу</button>
      </div>
    </header>

    <!-- Dashboard Top Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <!-- Balance Card -->
      <div class="bg-slate-800/80 rounded-2xl p-6 border border-slate-700/50">
        <div class="text-sm text-slate-400 mb-1">Мугалимдин капчыгы (79%)</div>
        <div id="balanceDisplay" class="text-3xl font-extrabold text-emerald-400 mb-4">0,0 сом</div>
        <button id="withdrawBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 font-medium py-2.5 rounded-xl transition">MBank'ка чечүү (мин. 100 сом)</button>
      </div>

      <!-- Commission Info -->
      <div class="bg-slate-800/80 rounded-2xl p-6 border border-slate-700/50 flex flex-col justify-center">
        <div class="text-3xl font-extrabold text-indigo-400 mb-1">21%</div>
        <div class="text-sm text-slate-400">Ар бир сатууда автоматтык түрдө эсептелет</div>
      </div>

      <!-- Payout Card Info -->
      <div class="bg-slate-800/80 rounded-2xl p-6 border border-slate-700/50">
        <div class="font-bold mb-2">Коопсуз payout картасы</div>
        <div id="cardStatus" class="text-sm text-slate-400 mb-4">Карта маалыматы азырынча жеткиликтүү эмес.</div>
        <button id="addCardBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 font-medium py-2.5 rounded-xl transition">Картаны кошуу</button>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Add Material Form -->
      <div class="bg-slate-800/80 rounded-2xl p-6 border border-slate-700/50">
        <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><span>+</span> Жаңы материал кошуу</h2>
        <form id="materialForm" class="space-y-4">
          <input type="text" id="titleInput" placeholder="Материалдын аталышы *" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500">
          <select id="subjectInput" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500">
            <option value="">Предметти тандаңыз</option>
            <option value="Физика">Физика</option>
            <option value="Математика">Математика</option>
            <option value="Информатика">Информатика</option>
            <option value="Башка">Башка</option>
          </select>
          <select id="typeInput" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500">
            <option value="">Түрүн тандаңыз</option>
            <option value="Сабактын иштеп чыгуусу">Сабактын иштеп чыгуусу</option>
            <option value="Презентация">Презентация</option>
            <option value="Тесттик тапшырмалар">Тесттик тапшырмалар</option>
          </select>
          <input type="number" id="priceInput" placeholder="Баасы (сом)" min="0" step="10" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500">
          <input type="url" id="fileUrlInput" placeholder="Файлга шилтеме (Google Drive/Telegram)" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500">
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-medium py-3 rounded-xl transition">Жайгаштыруу</button>
        </form>
      </div>

      <!-- My Materials List -->
      <div class="bg-slate-800/80 rounded-2xl p-6 border border-slate-700/50">
        <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><span>📁</span> Менин жайгаштырган материалдарым</h2>
        <div id="materialsList" class="space-y-3">
          <div class="text-slate-500 text-sm">Материалдар жүктөлүүдө...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Config: БУЛ ЖЕРГЕ ӨЗҮҢҮЗДҮН ВЕРСЕЛ API URL ЖАЗЫЛАТ
    const API_BASE_URL = 'https://YOUR-BILIMAL-API.vercel.app'; 

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "bilimal-org.firebaseapp.com",
      databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "bilimal-org",
      storageBucket: "bilimal-org.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById('userEmail').innerText = user.email;
        loadTeacherProfile();
        loadTeacherMaterials();
      } else {
        window.location.href = '/login.html';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      auth.signOut().then(() => window.location.href = '/');
    });

    async function getAuthToken() {
      if (!currentUser) throw new Error('Авторизация жок.');
      return await currentUser.getIdToken();
    }

    function loadTeacherProfile() {
      db.ref(`users/${currentUser.uid}`).on('value', (snapshot) => {
        const val = snapshot.val() || {};
        const balance = val.balance || 0;
        document.getElementById('balanceDisplay').innerText = `${balance.toLocaleString()} сом`;
        
        if (val.payoutCard && val.payoutCard.maskedPan) {
          document.getElementById('cardStatus').innerText = `Карта кошулган: ${val.payoutCard.maskedPan}`;
          document.getElementById('addCardBtn').innerText = 'Картаны өзгөртүү';
        } else {
          document.getElementById('cardStatus').innerText = 'Карта маалыматы азырынча жеткиликтүү эмес.';
          document.getElementById('addCardBtn').innerText = 'Картаны кошуу';
        }
      });
    }

    // Payout Карта кошуу баскычы
    document.getElementById('addCardBtn').addEventListener('click', async () => {
      try {
        const token = await getAuthToken();
        const res = await fetch(`${API_BASE_URL}/api/payouts/add-card`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await res.json();
        if (!res.ok || !data.ok) {
          throw new Error(data.message || 'Карта кошуу шилтемесин алууда ката чыкты.');
        }

        if (data.redirectUrl) {
          window.location.href = data.redirectUrl;
        } else {
          alert('Карта формасынын шилтемеси табылган жок.');
        }
      } catch (err) {
        console.error('Card Add Error:', err);
        alert(`Ката: ${err.message}\n\nЭгер CORS катасы болсо, Vercel API дарегин (${API_BASE_URL}) туура киргизгениңизди текшериңиз.`);
      }
    });

    // Жаңы материал кошуу
    document.getElementById('materialForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const token = await getAuthToken();
        const payload = {
          title: document.getElementById('titleInput').value,
          subject: document.getElementById('subjectInput').value,
          type: document.getElementById('typeInput').value,
          price: parseFloat(document.getElementById('priceInput').value),
          fileUrl: document.getElementById('fileUrlInput').value
        };

        const res = await fetch(`${API_BASE_URL}/api/materials`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.message || 'Ката чыкты.');

        alert('Материал ийгиликтүү кошулду!');
        document.getElementById('materialForm').reset();
      } catch (err) {
        alert(`Ката: ${err.message}`);
      }
    });

    // Мугалимдин материалдарын жүктөө
    function loadTeacherMaterials() {
      db.ref('market_items').orderByChild('authorUid').equalTo(currentUser.uid).on('value', (snapshot) => {
        const listEl = document.getElementById('materialsList');
        listEl.innerHTML = '';
        if (!snapshot.exists()) {
          listEl.innerHTML = '<div class="text-slate-500 text-sm">Сизде азырынча материал жок.</div>';
          return;
        }

        snapshot.forEach((child) => {
          const item = child.val();
          const div = document.createElement('div');
          div.className = 'bg-slate-900/60 p-4 rounded-xl flex justify-between items-center border border-slate-800';
          div.innerHTML = `
            <div>
              <div class="font-bold text-slate-200">${item.title}</div>
              <div class="text-xs text-slate-400">${item.subject} • ${item.price} сом</div>
            </div>
            <button onclick="deleteMaterial('${child.key}')" class="bg-red-600/20 text-red-400 hover:bg-red-600/30 px-3 py-1 rounded-lg text-sm transition">Өчүрүү</button>
          `;
          listEl.appendChild(div);
        });
      });
    }

    async function deleteMaterial(id) {
      if (!confirm('Материалды өчүрүүнү каалайсызбы?')) return;
      try {
        await db.ref(`market_items/${id}`).remove();
      } catch (e) {
        alert('Өчүрүүдө ката чыкты: ' + e.message);
      }
    }
  </script>
</body>
</html>
