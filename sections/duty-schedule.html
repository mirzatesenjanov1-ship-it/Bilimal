<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Класстык Кезметчилик жана Тазалык Көзөмөлү</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 24px;
            width: 100%;
            max-width: 480px;
        }
        h2 {
            color: #1a73e8;
            margin-top: 0;
            text-align: center;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #4a5568;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: #1a73e8;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary {
            background-color: #1a73e8;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1557b0;
        }
        .btn-success {
            background-color: #2e7d32;
            color: white;
            margin-top: 10px;
        }
        .btn-success:hover {
            background-color: #1b5e20;
        }
        .btn-danger {
            background-color: #d32f2f;
            color: white;
            margin-top: 15px;
            padding: 8px;
            font-size: 13px;
        }
        .hidden {
            display: none !important;
        }
        .user-card {
            background-color: #e8f0fe;
            border-left: 5px solid #1a73e8;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .user-card p {
            margin: 4px 0;
            color: #202124;
            font-size: 14px;
        }
        .status-badge {
            display: inline-block;
            background-color: #c6f6d5;
            color: #22543d;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #2d3748;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
            margin-top: 20px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🧹 Класстык Кезметчилик</h2>

    <!-- 1-БӨЛҮМ: БИРИНЧИ ЖОЛУ КИРГЕНДЕР ҮЧҮН КАТТОО -->
    <div id="registerSection">
        <p style="text-align: center; color: #718096; font-size: 14px;">
            Системага биринчи жолу кирип жатасыз. Аты-жөнүңүздү жана почтаңызды жазыңыз.
        </p>
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="fullName">Толук аты-жөнүңүз (ФИО):</label>
                <input type="text" id="fullName" placeholder="Мис: Асанов Бакыт" required>
            </div>
            <div class="form-group">
                <label for="email">Электрондук почтаңыз (Email):</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <button type="submit" class="btn btn-primary">Сактоо жана Улантуу</button>
        </form>
    </div>

    <!-- 2-БӨЛҮМ: ЭКИНЧИ ЖОЛУ КИРГЕНДЕ ЖАНА КЕЗМЕТТИ ТАПШЫРУУ -->
    <div id="dutySection" class="hidden">
        <!-- Автоматтык таанылган окуучунун маалыматы -->
        <div class="user-card">
            <p><strong>Жооптуу окуучу:</strong> <span id="savedName"></span></p>
            <p><strong>Email:</strong> <span id="savedEmail"></span></p>
            <span class="status-badge">✓ Автоматтык кирдиңиз</span>
        </div>

        <form id="dutyForm" onsubmit="handleDutySubmit(event)">
            <div class="section-title">👥 Кезметчи өнөктөштөр (3 окуучу)</div>
            
            <div class="form-group">
                <label for="partner1">2-кезметчи окуучунун аты-жөнү:</label>
                <input type="text" id="partner1" placeholder="Аты-жөнүн жазыңыз" required>
            </div>

            <div class="form-group">
                <label for="partner2">3-кезметчи окуучунун аты-жөнү:</label>
                <input type="text" id="partner2" placeholder="Аты-жөнүн жазыңыз" required>
            </div>

            <div class="section-title">📸 Тазаланган класс жана сүрөт</div>

            <div class="form-group">
                <label for="classroomPhoto">3 окуучу чогуу түшкөн сүрөттү тандаңыз же тартыңыз:</label>
                <input type="file" id="classroomPhoto" accept="image/*" capture="environment" required>
            </div>

            <button type="submit" class="btn btn-success">Кезметти тапшыруу (Отчет жөнөтүү)</button>
        </form>

        <button onclick="resetUser()" class="btn btn-danger">Каттоону өчүрүү (Башка аккаунт менен кирүү)</button>
    </div>
</div>

<script>
    // Баракча ачылганда тутум браузердеги маалыматты текшерет
    document.addEventListener("DOMContentLoaded", function() {
        checkUserSession();
    });

    // Окуучу мурда киргенби же жокпу текшерүүчү функция
    function checkUserSession() {
        const name = localStorage.getItem("student_fullname");
        const email = localStorage.getItem("student_email");

        if (name && email) {
            // Эгер сакталган маалымат бар болсо -> 2-бөлүмдү көргөзөт (Автоматтык эсептөө)
            document.getElementById("registerSection").classList.add("hidden");
            document.getElementById("dutySection").classList.remove("hidden");
            
            document.getElementById("savedName").innerText = name;
            document.getElementById("savedEmail").innerText = email;
        } else {
            // Маалымат жок болсо -> Катталуу бөлүмүн көргөзөт
            document.getElementById("registerSection").classList.remove("hidden");
            document.getElementById("dutySection").classList.add("hidden");
        }
    }

    // Биринчи жолу кирген окуучунун маалыматын localStorage-ке сактоо
    function handleRegister(event) {
        event.preventDefault();

        const fullName = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim();

        if (fullName && email) {
            localStorage.setItem("student_fullname", fullName);
            localStorage.setItem("student_email", email);
            
            // Маалымат сакталгандан кийин баракчаны жаңылап, 2-экранага өтөт
            checkUserSession();
        }
    }

    // Кезмет аяктаганда отчетту жөнөтүү
    function handleDutySubmit(event) {
        event.preventDefault();

        const mainStudent = localStorage.getItem("student_fullname");
        const mainEmail = localStorage.getItem("student_email");
        const partner1 = document.getElementById("partner1").value.trim();
        const partner2 = document.getElementById("partner2").value.trim();
        const photoInput = document.getElementById("classroomPhoto");

        if (photoInput.files.length === 0) {
            alert("Сураныч, 3 окуучу тең түшкөн класстын сүрөтүн жүктөңүз!");
            return;
        }

        const photoFile = photoInput.files[0];

        // Жөнөтүлө турган бардык даяр маалыматтар
        const reportData = {
            mainStudent: mainStudent,
            mainEmail: mainEmail,
            partners: [partner1, partner2],
            allStudents: [mainStudent, partner1, partner2],
            timestamp: new Date().toLocaleString(),
            photoName: photoFile.name
        };

        console.log("Жөнөтүлгөн отчет маалыматтары:", reportData);

        // Бул жерде маалыматтарды өзүңүздүн Telegram Ботко же Сервериңизге жөнөтсөңүз болот
        alert("Рахмат! Кезмет ийгиликтүү тапшырылды.\n\nКатышкандар:\n1. " + mainStudent + "\n2. " + partner1 + "\n3. " + partner2);

        // Форманы тазалоо
        document.getElementById("dutyForm").reset();
    }

    // Сакталган профилди өчүрүү (башка телефон же окуучу киргиси келсе)
    function resetUser() {
        if (confirm("Чын эле эсте сакталган профилиңизди өчүргүңүз келеби?")) {
            localStorage.removeItem("student_fullname");
            localStorage.removeItem("student_email");
            checkUserSession();
        }
    }
</script>

</body>
</html>
