<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageMetaTitle">Кыз куумай: Жалпы предметтер боюнча тест — BiliMal</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
    body { background-color: #0b0f19; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

    .header-nav {
      width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 25px; background: #111827; padding: 15px 25px; border-radius: 14px; border: 1px solid #1f2937;
      flex-wrap: wrap; gap: 10px;
    }
    .back-btn { color: #38bdf8; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
    .back-btn:hover { color: #ffffff; }
    h1 { font-size: 1.2rem; color: #facc15; }

    .lang-selector { display: flex; gap: 6px; }
    .lang-btn {
      background-color: #1e2640; color: #fff; border: 1px solid #34495e; padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.3s;
    }
    .lang-btn.active, .lang-btn:hover { background-color: #00d2ff; color: #0b0e14; border-color: #00d2ff; }

    .game-container {
      width: 100%; max-width: 900px; background: #111827; border: 1px solid #1f2937;
      border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* РЕАЛДУУ ЖАРЫШ АРЕНАСЫ */
    .track-area {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #38bdf8; border-radius: 16px; padding: 20px; margin: 20px 0;
      position: relative; overflow: hidden;
    }
    .runner-line { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; position: relative; }
    .runner-track { height: 12px; background: #334155; border-radius: 6px; width: 100%; position: relative; overflow: hidden; }
    .runner-progress { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #a855f7); transition: width 0.4s ease; }
    .avatar { font-size: 2.2rem; position: absolute; top: -15px; transition: left 0.4s ease; }

    .quiz-box { background: rgba(30, 41, 59, 0.7); border-radius: 14px; padding: 20px; margin-top: 20px; border: 1px solid rgba(255,255,255,0.08); }
    .question-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; color: #f8fafc; }
    .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .opt-btn {
      background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px 18px;
      border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; text-align: left;
    }
    .opt-btn:hover { background: #38bdf8; color: #0b0f19; border-color: #38bdf8; }

    .score-board { display: flex; justify-content: space-around; margin-bottom: 15px; font-weight: 700; color: #facc15; }

    /* ЖАРНАМА ЭСКЕРТҮҮ МОДАЛДЫК ТЕРЕЗЕСИ */
    .ad-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 6, 12, 0.88); backdrop-filter: blur(8px); z-index: 20000; justify-content: center; align-items: center; }
    .ad-modal-content { background: #111827; border: 2px solid #38bdf8; border-radius: 20px; padding: 30px 40px; box-shadow: 0 0 30px rgba(56, 189, 248, 0.4); text-align: center; max-width: 450px; width: 90%; }
    .ad-modal-icon { font-size: 3rem; color: #38bdf8; margin-bottom: 15px; animation: spin 1.5s infinite linear; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ЖАРНАМА ЭСКЕРТҮҮ ТЕРЕЗЕСИ -->
  <div class="ad-modal" id="adNoticeModal">
    <div class="ad-modal-content">
      <div class="ad-modal-icon">⌛</div>
      <div class="ad-modal-title" id="uiAdTitle">Жарнама жүктөлүүдө...</div>
      <div class="ad-modal-subtitle" id="uiAdSub">Сураныч күтө туруңуз, 2 секунддан кийин оюн ачылат</div>
    </div>
  </div>

  <div class="header-nav">
    <a href="test-games.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> <span id="uiBackBtn">Оюндарга кайтуу</span></a>
    <h1 id="uiHeaderTitle">🏇 Кыз куумай: Жалпы предметтер</h1>
    <div class="lang-selector">
      <button class="lang-btn active" id="btn-ky" onclick="setLang('ky')">KG</button>
      <button class="lang-btn" id="btn-ru" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="game-container">
    <h2 id="uiGameTitle" style="color: #38bdf8; margin-bottom: 10px;">Кыз куумай улуттук оюну</h2>
    <p id="uiGameDesc" style="color: #94a3b8; font-size: 0.9rem;">Билимиңизди сынап, суроолорго туура жооп берип кыз куумай жарышында жеңишке жетиңиз!</p>

    <div class="track-area">
      <div class="score-board">
        <div><span id="uiBoyLabel">Жигит:</span> <span id="boyScore">0</span>%</div>
        <div><span id="uiGirlLabel">Кыз:</span> <span id="girlScore">80</span>%</div>
      </div>
      <div class="runner-line">
        <div class="runner-track">
          <div class="runner-progress" id="progressBar"></div>
        </div>
        <div class="avatar" id="boyAvatar" style="left: 0%;">🏇</div>
        <div class="avatar" id="girlAvatar" style="left: 80%;">👧</div>
      </div>
    </div>

    <div class="quiz-box" id="quizBox">
      <div class="question-text" id="qText">Суроо жүктөлүүдө...</div>
      <div class="options-grid" id="optsGrid"></div>
    </div>
  </div>

  <script>
    const SMARTLINK = "https://uplcm.com/4/11977319";
    const AD_COOLDOWN_MS = 30 * 60 * 1000;

    function canShowAd() {
      const lastAd = localStorage.getItem('monetag_kyz_kuumay_last_ad');
      if (!lastAd) return true;
      return (Date.now() - parseInt(lastAd, 10)) > AD_COOLDOWN_MS;
    }

    function recordAd() {
      localStorage.setItem('monetag_kyz_kuumay_last_ad', Date.now().toString());
    }

    // ТИЛДЕР ЖАНА КОТОРМОЛОР
    const translations = {
      ky: {
        pageMetaTitle: "Кыз куумай: Жалпы предметтер боюнча тест — BiliMal",
        backBtn: "Оюндарга кайтуу",
        headerTitle: "🏇 Кыз куумай: Жалпы предметтер",
        gameTitle: "Кыз куумай улуттук оюну",
        gameDesc: "Билимиңизди сынап, суроолорго туура жооп берип кыз куумай жарышында жеңишке жетиңиз!",
        boyLabel: "Жигит:", girlLabel: "Кыз:",
        adTitle: "Жарнама жүктөлүүдө...", adSub: "Сураныч күтө туруңуз, 2 секунддан кийин оюн ачылат",
        winMsg: "🏆 Куттуктайбыз! Сиз кызга жетип, жарышта жеңишке жетиштиңиз!",
        questions: [
          { q: "Кыргызстандын борбор шаары кайсы?", opts: ["Ош", "Бишкек", "Нарын", "Жалал-Абад"], ans: 1 },
          { q: "Математикада 15 × 6 канчага барабар?", opts: ["80", "90", "100", "75"], ans: 1 },
          { q: "Кыргыз тилинде канча үндүү тыбыш бар?", opts: ["8", "12", "14", "10"], ans: 2 },
          { q: "Жер Күндү канча убакта толук бир айланып чыгат?", opts: ["24 саат", "1 ай", "1 жыл (365 күн)", "12 саат"], ans: 2 },
          { q: "Адам организминде канча жуп кабырга бар?", opts: ["10", "12", "14", "16"], ans: 1 }
        ]
      },
      ru: {
        pageMetaTitle: "Кыз куумай: Тест по общим предметам — BiliMal",
        backBtn: "Назад к играм",
        headerTitle: "🏇 Кыз куумай: Общие предметы",
        gameTitle: "Национальная игра Кыз куумай",
        gameDesc: "Проверьте свои знания, отвечая на вопросы, и победите в скачке Кыз куумай!",
        boyLabel: "Джигит:", girlLabel: "Девушка:",
        adTitle: "Загрузка рекламы...", adSub: "Пожалуйста, подождите 2 секунды",
        winMsg: "🏆 Поздравляем! Вы догнали девушку и победили в соревновании!",
        questions: [
          { q: "Какой город является столицей Кыргызстана?", opts: ["Ош", "Бишкек", "Нарын", "Джалал-Абад"], ans: 1 },
          { q: "Чему равно выражение 15 × 6 в математике?", opts: ["80", "90", "100", "75"], ans: 1 },
          { q: "Сколько гласных звуков в кыргызском языке?", opts: ["8", "12", "14", "10"], ans: 2 },
          { q: "За какое время Земля делает полный оборот вокруг Солнца?", opts: ["24 часа", "1 месяц", "1 год (365 дней)", "12 часов"], ans: 2 },
          { q: "Сколько пар ребер у человека?", opts: ["10", "12", "14", "16"], ans: 1 }
        ]
      },
      en: {
        pageMetaTitle: "Kyz Kuumay: General Subjects Quiz — BiliMal",
        backBtn: "Back to Games",
        headerTitle: "🏇 Kyz Kuumay: General Subjects",
        gameTitle: "National Game Kyz Kuumay",
        gameDesc: "Test your knowledge by answering questions and win the Kyz Kuumay horse race!",
        boyLabel: "Rider:", girlLabel: "Girl:",
        adTitle: "Loading advertisement...", adSub: "Please wait 2 seconds",
        winMsg: "🏆 Congratulations! You caught up with the girl and won the race!",
        questions: [
          { q: "What is the capital city of Kyrgyzstan?", opts: ["Osh", "Bishkek", "Naryn", "Jalal-Abad"], ans: 1 },
          { q: "What is 15 × 6 in mathematics?", opts: ["80", "90", "100", "75"], ans: 1 },
          { q: "How many vowel sounds are there in Kyrgyz language?", opts: ["8", "12", "14", "10"], ans: 2 },
          { q: "How long does it take for Earth to orbit the Sun?", opts: ["24 hours", "1 month", "1 year (365 days)", "12 hours"], ans: 2 },
          { q: "How many pairs of ribs do humans have?", opts: ["10", "12", "14", "16"], ans: 1 }
        ]
      }
    };

    let currentLang = 'ky';
    let currentQ = 0;
    let boyPos = 0;

    function setLang(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.getElementById('pageMetaTitle').innerText = t.pageMetaTitle;
      document.getElementById('uiBackBtn').innerText = t.backBtn;
      document.getElementById('uiHeaderTitle').innerText = t.headerTitle;
      document.getElementById('uiGameTitle').innerText = t.gameTitle;
      document.getElementById('uiGameDesc').innerText = t.gameDesc;
      document.getElementById('uiBoyLabel').innerText = t.boyLabel;
      document.getElementById('uiGirlLabel').innerText = t.girlLabel;
      document.getElementById('uiAdTitle').innerText = t.adTitle;
      document.getElementById('uiAdSub').innerText = t.adSub;

      ['ky', 'ru', 'en'].forEach(l => {
        document.getElementById(`btn-${l}`).classList.toggle('active', l === lang);
      });

      currentQ = 0;
      boyPos = 0;
      updateRace();
      loadQuestion();
    }

    function loadQuestion() {
      const qList = translations[currentLang].questions;
      if (currentQ >= qList.length || boyPos >= 80) {
        document.getElementById('quizBox').innerHTML = `<h3 style="color:#4ade80;">${translations[currentLang].winMsg}</h3>`;
        return;
      }

      const q = qList[currentQ];
      document.getElementById('qText').innerText = `${currentQ + 1}. ${q.q}`;
      const grid = document.getElementById('optsGrid');
      grid.innerHTML = '';

      q.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx);
        grid.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      const qList = translations[currentLang].questions;
      if (selected === qList[currentQ].ans) {
        boyPos += 20;
      }
      currentQ++;
      updateRace();
      loadQuestion();
    }

    function updateRace() {
      document.getElementById('boyPos')
      document.getElementById('boyAvatar').style.left = boyPos + '%';
      document.getElementById('progressBar').style.width = boyPos + '%';
      document.getElementById('boyScore').innerText = boyPos;
    }

    window.onload = () => {
      if (canShowAd()) {
        const modal = document.getElementById('adNoticeModal');
        modal.style.display = 'flex';
        setTimeout(() => {
          recordAd();
          window.open(SMARTLINK, '_blank');
          modal.style.display = 'none';
        }, 2000);
      }
      setLang('ky');
    };
  </script>
</body>
</html>
