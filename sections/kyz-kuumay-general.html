<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кыз куумай — мугалимдин тести</title>
<style>
  :root{
    --bg:#0b1220; --card:#111b2e; --card2:#1a2438; --line:#25324b;
    --cyan:#38bdf8; --yellow:#facc15; --text:#f1f5f9; --muted:#94a3b8;
    --good:#22c55e; --bad:#ef4444; --pink:#f472b6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;padding:18px}
  .wrap{max-width:1700px;margin:0 auto}
  .hidden{display:none!important}
  input,textarea,button{font-family:inherit}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 24px;margin-bottom:18px}
  header a{color:var(--cyan);font-weight:700;text-decoration:none;font-size:19px}
  header h1{margin:0;font-size:24px;color:var(--yellow)}
  .langs{display:flex;gap:8px}
  .langs button{background:var(--card2);color:var(--text);border:1px solid var(--line);
    border-radius:12px;padding:10px 16px;font-weight:800;font-size:15px;cursor:pointer}
  .langs button.active{background:#00d1ff;color:#04121f;border-color:#00d1ff}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px}
  .panel h2{margin:0 0 8px;text-align:center;color:var(--cyan);font-size:32px}
  .sub{margin:0 auto 22px;text-align:center;color:var(--muted);font-size:17px;max-width:900px}

  /* ---------- мугалимдин панели ---------- */
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:14px}
  .fld{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;color:#cbd5e1}
  .fld.wide{grid-column:1/-1}
  .fld small{color:var(--muted);font-weight:500}
  input[type=text],input[type=number],textarea{background:#0f1a2e;color:var(--text);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;font-size:16px;width:100%}
  input:focus,textarea:focus{outline:2px solid var(--cyan);border-color:var(--cyan)}
  textarea{resize:vertical}
  .checks{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 18px}
  .checks label{display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer}
  .checks input{width:18px;height:18px}

  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
  .bar h3{margin:0;font-size:22px;color:var(--yellow);margin-right:auto}
  .btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;
    padding:11px 16px;font-size:15px;font-weight:800;cursor:pointer}
  .btn:hover{border-color:var(--cyan)}
  .btn.primary{background:#00d1ff;color:#04121f;border-color:#00d1ff}
  .btn.danger{color:#fca5a5}
  .btn.small{padding:6px 11px;font-size:14px}

  .qcard{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .qcard.bad{border-color:var(--bad);box-shadow:0 0 0 2px rgba(239,68,68,.35)}
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:18px}
  .ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:10px}
  .orow{display:flex;gap:10px;align-items:center}
  .orow input[type=radio]{width:22px;height:22px;accent-color:#22c55e;flex:none;cursor:pointer}

  details{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:16px 0}
  summary{cursor:pointer;font-weight:800;font-size:18px;color:var(--cyan)}
  details p{color:var(--muted);font-size:15px;margin:10px 0}
  .msg{margin-top:8px;font-size:15px;color:var(--good)}
  .errbox{background:rgba(239,68,68,.12);border:1px solid var(--bad);border-radius:14px;padding:12px 18px;margin:14px 0;color:#fecaca}
  .errbox ul{margin:6px 0 0;padding-left:20px}
  .rules{color:var(--muted);font-size:15px;line-height:1.55;margin:6px 0}
  .startrow{text-align:center;margin-top:20px}
  .startrow .btn{font-size:22px;padding:16px 44px;border-radius:16px}

  /* ---------- оюн ---------- */
  .gbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .gbar b{font-size:22px;color:var(--yellow);margin-right:auto}
  .arena{display:grid;gap:18px;align-items:start;
    grid-template-columns:minmax(260px,1fr) minmax(0,1.7fr) minmax(260px,1fr)}
  .center{min-width:0}
  @media(max-width:1100px){
    .arena{grid-template-columns:1fr 1fr}
    .center{grid-column:1/-1;order:-1}
  }
  @media(max-width:640px){.arena{grid-template-columns:1fr}}

  .stage{position:relative;border-radius:16px;overflow:hidden;border:3px solid var(--cyan);background:#000}
  canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
  .banner{position:absolute;top:8px;left:8px;max-width:55%;background:#f3deb0;border:3px solid #8a6a34;border-radius:6px;
    padding:5px 16px;text-align:center;color:#4a2c10;font-weight:900;font-size:clamp(13px,1.8vw,26px);
    pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hud{position:absolute;top:8px;right:8px;display:flex;gap:8px;pointer-events:none}
  .hud div{background:rgba(10,32,64,.88);border:2px solid #0b2a52;border-radius:10px;padding:4px 12px;min-width:84px}
  .hud small{display:block;color:#bcd4f5;font-size:clamp(10px,1vw,14px)}
  .hud b{font-size:clamp(15px,1.8vw,26px);color:#fff}
  #cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:clamp(50px,11vw,150px);font-weight:900;color:#fff;
    text-shadow:0 6px 0 #0b2a52,0 0 30px rgba(0,0,0,.6);pointer-events:none;background:rgba(0,0,0,.25)}

  .race{margin-top:14px;padding:14px 20px;border:3px solid var(--cyan);border-radius:18px;background:#0f1a2e}
  .race .labels{display:flex;justify-content:space-between;color:var(--yellow);font-weight:900;font-size:clamp(14px,1.4vw,20px);margin-bottom:4px;gap:10px}
  .track{position:relative;height:50px}
  .track .rail{position:absolute;left:0;right:0;top:20px;height:12px;border-radius:8px;background:#33415a}
  .track .fill{position:absolute;left:0;top:20px;height:12px;border-radius:8px;background:linear-gradient(90deg,#0ea5e9,#facc15);width:0;transition:width .5s}
  .track .mk{position:absolute;top:4px;font-size:34px;line-height:1;transition:left .5s}

  .pl{background:var(--card);border:3px solid var(--cyan);border-radius:22px;padding:16px}
  .pl.girl{border-color:var(--pink)}
  .plhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
  .role{font-weight:900;font-size:clamp(16px,1.5vw,22px);color:var(--cyan)}
  .pl.girl .role{color:var(--pink)}
  .pname{font-weight:800;font-size:clamp(14px,1.3vw,20px);background:var(--card2);border-radius:10px;padding:4px 12px;
    max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .plstat{display:flex;justify-content:space-between;color:var(--muted);font-size:clamp(13px,1.1vw,17px);margin-bottom:8px}
  .tbar{height:10px;background:#33415a;border-radius:6px;overflow:hidden;margin-bottom:14px}
  .tbar i{display:block;height:100%;width:100%;background:var(--good)}
  .tbar i.low{background:var(--bad)}
  .pq{margin:0 0 14px;font-size:clamp(18px,1.9vw,32px);line-height:1.3}
  .popts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;background:#1f2b42;border:2px solid var(--line);color:var(--text);
    border-radius:14px;padding:12px 14px;font-size:clamp(16px,1.5vw,26px);font-weight:700;text-align:left;cursor:pointer;transition:.12s}
  .opt:hover:not(:disabled){border-color:var(--cyan);transform:translateX(2px)}
  .pl.girl .opt:hover:not(:disabled){border-color:var(--pink)}
  .opt:disabled{cursor:default}
  .opt.ok{background:rgba(34,197,94,.28);border-color:var(--good)}
  .opt.no{background:rgba(239,68,68,.28);border-color:var(--bad)}
  .kb{flex:none;min-width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
    background:#0b1220;border:2px solid var(--cyan);border-radius:8px;color:var(--cyan);font-weight:900;font-size:.8em}
  .pl.girl .kb{border-color:var(--pink);color:var(--pink)}
  .pwait{padding:30px 10px;text-align:center;color:var(--muted);font-size:clamp(16px,1.5vw,24px)}

  .saveline{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .saveline input{flex:1;min-width:220px}
  .srow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
  .sinfo{flex:1;display:flex;flex-direction:column;min-width:0}
  .sinfo b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px}
  .sinfo small{color:var(--muted)}
  .nosaved{color:var(--muted);padding:6px 2px}

  .modal{position:fixed;inset:0;background:rgba(2,6,23,.8);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .mcard{background:var(--card);border:3px solid var(--cyan);border-radius:28px;padding:30px 36px;max-width:780px;width:100%;text-align:center}
  .mico{font-size:64px}
  .mt{margin:8px 0;font-size:clamp(24px,3vw,40px);color:var(--yellow)}
  .mp{margin:0 0 18px;color:var(--muted);font-size:20px}
  .mstats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
  .mcol{background:var(--card2);border:2px solid var(--cyan);border-radius:16px;padding:14px;font-size:18px;display:flex;flex-direction:column;gap:6px}
  .mcol.girl{border-color:var(--pink)}
  .mbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .mbtns .btn{font-size:18px;padding:14px 26px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a href="../games.html" data-i18n="back">← Оюндарга кайтуу</a>
    <h1>🏇 <span data-i18n="appTitle">Кыз куумай: Мугалимдин тести</span></h1>
    <div class="langs">
      <button type="button" data-lang="kg" class="active">KG</button>
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <!-- ======================= МУГАЛИМДИН ПАНЕЛИ ======================= -->
  <section id="setup">
    <div class="panel">
      <h2 data-i18n="setupH">Тестти даярдоо</h2>
      <p class="sub" data-i18n="setupSub"></p>

      <div class="fields">
        <label class="fld wide"><span data-i18n="lblTitle"></span>
          <input id="inTitle" type="text" maxlength="60" data-i18n-ph="phTitle"></label>
        <label class="fld"><span data-i18n="lblBoy"></span>
          <input id="inBoy" type="text" maxlength="30"></label>
        <label class="fld"><span data-i18n="lblGirl"></span>
          <input id="inGirl" type="text" maxlength="30"></label>
        <label class="fld"><span data-i18n="lblTime"></span>
          <input id="inTime" type="number" min="5" max="300" value="20"></label>
        <label class="fld"><span data-i18n="lblGap"></span>
          <input id="inGap" type="number" min="1" max="200" placeholder="auto"><small id="autoGap"></small></label>
      </div>
      <div class="checks">
        <label><input id="inSQ" type="checkbox" checked> <span data-i18n="optShuffleQ"></span></label>
        <label><input id="inSO" type="checkbox" checked> <span data-i18n="optShuffleO"></span></label>
        <label><input id="inSnd" type="checkbox" checked> <span data-i18n="optSound"></span></label>
        <label><input id="inMus" type="checkbox" checked> <span data-i18n="optMusic"></span></label>
      </div>

      <div class="bar">
        <h3><span data-i18n="qHeader">Суроолор</span> — <span id="qCount"></span></h3>
        <button type="button" class="btn" id="btnSample" data-i18n="sample"></button>
        <button type="button" class="btn" id="btnExport" data-i18n="exportJ"></button>
        <button type="button" class="btn" id="btnImport" data-i18n="importJ"></button>
        <button type="button" class="btn danger" id="btnClear" data-i18n="clearAll"></button>
        <input type="file" id="fileIn" accept=".json,application/json" class="hidden">
      </div>

      <div id="qlist"></div>
      <button type="button" class="btn primary" id="btnAdd" data-i18n="addQ"></button>

      <details open id="savedBox">
        <summary data-i18n="saveH"></summary>
        <div class="saveline">
          <input id="saveName" type="text" maxlength="60" data-i18n-ph="saveNamePh">
          <button type="button" class="btn primary" id="btnSaveNamed" data-i18n="saveBtn"></button>
        </div>
        <div class="msg" id="saveMsg"></div>
        <h4 style="margin:14px 0 8px;color:var(--yellow)" data-i18n="savedH"></h4>
        <div id="savedList"></div>
      </details>

      <details>
        <summary data-i18n="bulkH"></summary>
        <p data-i18n="bulkHelp"></p>
        <textarea id="bulk" rows="9" data-i18n-ph="bulkPh"></textarea>
        <div class="bar"><button type="button" class="btn primary" id="btnBulk" data-i18n="bulkBtn"></button></div>
        <div class="msg" id="bulkMsg"></div>
      </details>

      <details open>
        <summary data-i18n="rulesH"></summary>
        <p class="rules" data-i18n="rules"></p>
        <p class="rules" data-i18n="keysInfo"></p>
      </details>

      <div class="errbox hidden" id="errBox"></div>
      <div class="startrow"><button type="button" class="btn primary" id="btnStart" data-i18n="start"></button></div>
    </div>
  </section>

  <!-- ======================= ОЮН ======================= -->
  <section id="game" class="hidden">
    <div class="gbar">
      <b id="gTitle"></b>
      <button type="button" class="btn" id="btnMusic"></button>
      <button type="button" class="btn" id="btnFs" data-i18n="fs"></button>
      <button type="button" class="btn danger" id="btnStop" data-i18n="stop"></button>
    </div>

    <div class="arena">

      <!-- жигиттин панели -->
      <aside class="pl boy">
        <div class="plhead"><span class="role">🏇 <span data-i18n="roleBoy"></span></span><span class="pname" id="b-name"></span></div>
        <div class="plstat"><span id="b-prog"></span><span id="b-stat"></span></div>
        <div class="tbar"><i id="b-bar"></i></div>
        <div id="b-main">
          <h3 class="pq" id="b-q"></h3>
          <div class="popts" id="b-opts"></div>
        </div>
        <div class="pwait hidden" id="b-wait"></div>
      </aside>

      <!-- борбор: сахна -->
      <div class="center">
        <div class="stage">
          <canvas id="scene" width="320" height="180"></canvas>
          <div class="banner" id="bannerText"></div>
          <div class="hud">
            <div><small data-i18n="gapL"></small><b id="hudGap">0</b></div>
            <div><small data-i18n="qsL"></small><b id="hudN">0</b></div>
          </div>
          <div id="cd" class="hidden"></div>
        </div>
        <div class="race">
          <div class="labels">
            <span><span id="lblBoyName"></span>: <span id="pctBoy">0</span>%</span>
            <span><span id="lblGirlName"></span>: <span id="pctGirl">100</span>%</span>
          </div>
          <div class="track">
            <div class="rail"></div>
            <div class="fill" id="fill"></div>
            <div class="mk" id="mkBoy" style="left:0">🏇</div>
            <div class="mk" id="mkGirl" style="left:88%">👧</div>
          </div>
        </div>
      </div>

      <!-- кыздын панели -->
      <aside class="pl girl">
        <div class="plhead"><span class="role">👧 <span data-i18n="roleGirl"></span></span><span class="pname" id="g-name"></span></div>
        <div class="plstat"><span id="g-prog"></span><span id="g-stat"></span></div>
        <div class="tbar"><i id="g-bar"></i></div>
        <div id="g-main">
          <h3 class="pq" id="g-q"></h3>
          <div class="popts" id="g-opts"></div>
        </div>
        <div class="pwait hidden" id="g-wait"></div>
      </aside>

    </div>
  </section>
</div>

<!-- жыйынтык терезеси -->
<div class="modal hidden" id="modal"><div class="mcard" id="mcard"></div></div>

<script>
(function(){
'use strict';

function $(id){return document.getElementById(id)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}

/* ============================================================
   1. ТИЛДЕР (интерфейс гана; мугалим суроолорду өз тилинде жазат)
   ============================================================ */
var I18N={
 kg:{
  back:'← Оюндарга кайтуу',appTitle:'Кыз куумай: Мугалимдин тести',
  setupH:'Тестти даярдоо',
  setupSub:'Суроолорду жазыңыз — эки окуучу жарышат: бири жигитти, экинчиси кызды башкарат. Жигит кызга жетсе — жигит утат, жеткире албаса — кыз утат!',
  lblTitle:'Сабактын / тесттин аталышы',phTitle:'Мисалы: Тарых, 7-класс',
  lblBoy:'Жигитти башкарган окуучу',lblGirl:'Кызды башкарган окуучу',
  lblTime:'Бир суроого убакыт (сек)',lblGap:'Баштапкы аралык (кадам)',autoGap:'Бош калтырсаңыз — авто: {n}',
  optShuffleQ:'Суроолорду аралаштыруу',optShuffleO:'Жооптордун ордун аралаштыруу',optSound:'Дабыш',
  qHeader:'Суроолор',qCount:'даяр суроо: {n}',addQ:'+ Суроо кошуу',clearAll:'Баарын тазалоо',
  sample:'Үлгү суроолор',exportJ:'⬇ Тестти сактоо',importJ:'⬆ Тестти жүктөө',
  qPh:'Суроонун тексти',optPh:'Жооп {n}',correctTip:'Туура жооп',del:'Өчүрүү',
  bulkH:'Тез кошуу (Word/текстен чаптаңыз)',
  bulkHelp:'Ар бир суроо — өзүнчө блок, блоктордун ортосунда бош сап. Биринчи сап — суроо, кийинкилер — жооптор (2–4). Туура жоопту * белгиси менен баштаңыз.',
  bulkPh:'Кыргызстандын борбору кайсы шаар?\nОш\n*Бишкек\nНарын\nЖалал-Абад\n\n2 + 2 канчага барабар?\n3\n*4\n5',
  bulkBtn:'Суроолорду кошуу',
  rulesH:'Эрежелер',
  rules:'Эки окуучу бирдей суроолорго өз темпинде жооп берет. Жигит туура жооп берсе кызга бир кадам жакындайт, кыз туура жооп берсе бир кадам алыстайт. Жигит кызга жетсе — жигит утат. Жигит жеткире албаса — кыз утат. Баштапкы аралык суроо санына жараша автоматтык эсептелет.',
  keysInfo:'Баскычтар: жигит — 1 2 3 4, кыз — 7 8 9 0 (же экрандагы жоопторду басыңыз).',
  start:'Оюнду баштоо ▶',
  errNone:'Эң аз бир суроо кошуңуз.',errQ:'{n}-суроо: суроонун тексти жок.',
  errOpt:'{n}-суроо: кеминде 2 жооп жазыңыз.',errCorrect:'{n}-суроо: туура жоопту белгилеңиз (ал бош болбошу керек).',
  errTitle:'Төмөнкү каталарды оңдоңуз:',
  imported:'{n} суроо кошулду.',importNone:'Суроо табылган жок. Форматты текшериңиз (туура жоопко * коюңуз).',
  jsonBad:'Файлды окуу мүмкүн болгон жок.',confirmClear:'Бардык суроолорду өчүрөсүзбү?',
  confirmReplace:'Учурдагы суроолор алмашылсынбы?',
  defBoy:'Жигит',defGirl:'Кыз',defTitle:'Кыз куумай',

var KEY='kyzKuumayTeacherQuiz_v2';
var quiz={title:'',boy:'',girl:'',time:'20',gap:'',shuffleQ:true,shuffleO:true,sound:true,music:true,questions:[]};
function newQ(){return {q:'',o:['','','',''],a:0}}
function autoGap(n){return Math.max(1,Math.round(n*0.3))}
function isBlank(q){return !q.q.trim()&&q.o.every(function(s){return !s.trim()})}

function sanitize(arr){
  if(!Array.isArray(arr)) return [];
  return arr.map(function(it){
    it=it||{};
    var o=Array.isArray(it.o)?it.o.slice(0,4).map(function(s){return String(s==null?'':s)}):[];
    while(o.length<4) o.push('');
    var a=parseInt(it.a,10); if(!(a>=0&&a<4)) a=0;
    return {q:String(it.q==null?'':it.q),o:o,a:a};
  });
}
function readForm(){
  quiz.title=$('inTitle').value; quiz.boy=$('inBoy').value; quiz.girl=$('inGirl').value;
  quiz.time=$('inTime').value; quiz.gap=$('inGap').value;
  quiz.shuffleQ=$('inSQ').checked; quiz.shuffleO=$('inSO').checked; quiz.sound=$('inSnd').checked;
  quiz.music=$('inMus').checked;
}
function fillForm(){
  $('inTitle').value=quiz.title||''; $('inBoy').value=quiz.boy||''; $('inGirl').value=quiz.girl||'';
  $('inTime').value=quiz.time||'20'; $('inGap').value=quiz.gap||'';
  $('inSQ').checked=quiz.shuffleQ!==false; $('inSO').checked=quiz.shuffleO!==false; $('inSnd').checked=quiz.sound!==false;
  $('inMus').checked=quiz.music!==false;
}
function saveState(){
  readForm(); updateCounts();
  try{localStorage.setItem(KEY,JSON.stringify({quiz:quiz,lang:lang}));}catch(e){}
}
function loadState(){
  try{
    var raw=localStorage.getItem(KEY); if(!raw) return;
    var d=JSON.parse(raw); if(!d||!d.quiz) return;
    var s=d.quiz;
    ['title','boy','girl','time','gap'].forEach(function(k){if(typeof s[k]==='string'||typeof s[k]==='number') quiz[k]=String(s[k]);});
    ['shuffleQ','shuffleO','sound','music'].forEach(function(k){if(typeof s[k]==='boolean') quiz[k]=s[k];});
    quiz.questions=sanitize(s.questions);
    if(d.lang&&I18N[d.lang]) lang=d.lang;
  }catch(e){}
}

function isValidQ(q){
  if(!q.q.trim()) return false;
  var n=q.o.filter(function(s){return s.trim()}).length;
  return n>=2 && !!(q.o[q.a]||'').trim();
}
function updateCounts(){
  var n=quiz.questions.filter(isValidQ).length;

}

      renderEditor(); saveState();

    ta.addEventListener('input',function(){q.q=ta.value;saveState();});

        var inp=document.createElement('input'); inp.type='text'; inp.placeholder=t('optPh',{n:oi+1}); inp.value=q.o[oi]||'';

/* --- тез кошуу --- */
function parseBulk(text){
  var blocks=text.replace(/\r/g,'').split(/\n\s*\n/);
  var out=[];
  blocks.forEach(function(b){
    var lines=b.split('\n').map(function(s){return s.trim()}).filter(function(s){return s.length>0});
    if(lines.length<3) return;
    var qtext=lines[0].replace(/^\d+\s*[\.\)]\s*/,'');
    var opts=[],a=-1;
    for(var i=1;i<lines.length&&opts.length<4;i++){
      var l=lines[i],corr=false;
      if(l.charAt(0)==='*'){corr=true;l=l.slice(1).trim();}
      l=l.replace(/^[-•]\s*/,'').replace(/^[A-Da-dА-Га-г]\)\s*/,'');
      if(!l) continue;
      if(corr&&a<0) a=opts.length;
      opts.push(l);
    }
    if(opts.length>=2&&a>=0){
      while(opts.length<4) opts.push('');
      out.push({q:qtext,o:opts,a:a});
    }
  });
  return out;
}
$('btnBulk').addEventListener('click',function(){
  var res=parseBulk($('bulk').value);
  var msg=$('bulkMsg');
  if(!res.length){msg.style.color='#fca5a5';msg.textContent=t('importNone');return;}
  dropBlanks();
  quiz.questions=quiz.questions.concat(res);
  renderEditor(); saveState();
  msg.style.color='';msg.textContent=t('imported',{n:res.length});
  $('bulk').value='';
});

function validate(){
  var errors=[],bad=[],clean=[];
  quiz.questions.forEach(function(q,qi){
    if(isBlank(q)) return;
    var n=qi+1, ok=true;
    if(!q.q.trim()){errors.push(t('errQ',{n:n}));ok=false;}
    var map=[];
    q.o.forEach(function(s,i){if(s.trim()) map.push(i);});
    if(map.length<2){errors.push(t('errOpt',{n:n}));ok=false;}
    if(!(q.o[q.a]||'').trim()){errors.push(t('errCorrect',{n:n}));ok=false;}
    if(!ok){bad.push(qi);return;}
    clean.push({q:q.q.trim(),o:map.map(function(i){return q.o[i].trim()}),a:map.indexOf(q.a)});
  });
  if(!clean.length&&!errors.length) errors.push(t('errNone'));
  return {ok:errors.length===0,errors:errors,bad:bad,clean:clean};
}
function showErrors(v){
  var box=$('errBox'); box.innerHTML='';
  box.appendChild(el('b','',t('errTitle')));
  var ul=el('ul');
  v.errors.forEach(function(e){ul.appendChild(el('li','',e));});
  box.appendChild(ul); box.classList.remove('hidden');
  var cards=$('qlist').children;
  v.bad.forEach(function(i){if(cards[i]) cards[i].classList.add('bad');});
  if(v.bad.length&&cards[v.bad[0]]) cards[v.bad[0]].scrollIntoView({behavior:'smooth',block:'center'});
  else box.scrollIntoView({behavior:'smooth',block:'center'});
}

var AC=null;
function initAudio(){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    if(!AC) AC=new C();
    if(AC.state==='suspended'&&AC.resume) AC.resume();
  }catch(e){}
}
function beep(freq,dur,type,vol,delay){
  if(!quiz.sound||!AC) return;
  try{
    var o=AC.createOscillator(),gn=AC.createGain(),t0=AC.currentTime+(delay||0);
    o.type=type||'square'; o.frequency.value=freq;
    gn.gain.setValueAtTime(vol||0.05,t0);
    gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(gn); gn.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
function snd(k){
  if(k==='ok'){beep(660,.12);beep(880,.16,'square',.05,.1);}
  else if(k==='bad'){beep(190,.3,'sawtooth',.05);}
  else if(k==='tick'){beep(520,.1,'square',.04);}
  else if(k==='go'){beep(880,.3,'square',.06);}
  else if(k==='win'){[523,659,784,1047].forEach(function(f,i){beep(f,.22,'square',.05,i*.16)});}
  else if(k==='lose'){[420,350,280,220].forEach(function(f,i){beep(f,.25,'triangle',.06,i*.18)});}
}

var SKEY='kyzKuumaySavedTests_v1';
function getSaved(){
  try{
    var a=JSON.parse(localStorage.getItem(SKEY)||'[]');
    return Array.isArray(a)?a:[];
  }catch(e){return [];}
}
function putSaved(a){
  try{localStorage.setItem(SKEY,JSON.stringify(a));return true;}catch(e){return false;}
}
function setSavedMsg(txt,bad){
  var m=$('saveMsg'); m.textContent=txt; m.style.color=bad?'#fca5a5':'';
}
function renderSaved(){
  var box=$('savedList'); box.innerHTML='';
  var arr=getSaved();
  if(!arr.length){box.appendChild(el('div','nosaved',t('noSaved')));return;}
  arr.sort(function(a,b){return (b.ts||0)-(a.ts||0);});
  arr.forEach(function(it){
    var row=el('div','srow');
    var info=el('div','sinfo');
    info.appendChild(el('b','',String(it.name||'')));
    var d=new Date(it.ts||0);
    info.appendChild(el('small','',t('nQ',{n:(it.questions||[]).length})+' · '+d.toLocaleDateString()));
    var b1=el('button','btn small primary',t('loadBtn')); b1.type='button';
    b1.addEventListener('click',function(){loadSaved(it.id);});
    var b2=el('button','btn small danger',t('delBtn')); b2.type='button';
    b2.addEventListener('click',function(){
      if(!confirm(t('confirmDelSaved',{name:it.name}))) return;
      putSaved(getSaved().filter(function(x){return x.id!==it.id;}));
      renderSaved();
    });
    row.appendChild(info); row.appendChild(b1); row.appendChild(b2);
    box.appendChild(row);
  });
}
function loadSaved(id){
  var it=getSaved().filter(function(x){return x.id===id;})[0];
  if(!it) return;
  dropBlanks();
  if(quiz.questions.length&&!confirm(t('confirmReplace'))){renderEditor();return;}
  var qs=sanitize(it.questions).filter(function(q){return !isBlank(q);});
  quiz.questions=qs.length?qs:[newQ()];
  quiz.title=it.title||it.name||'';
  quiz.time=String(it.time||'20');
  quiz.gap=it.gap?String(it.gap):'';
  quiz.shuffleQ=it.shuffleQ!==false;
  quiz.shuffleO=it.shuffleO!==false;
  fillForm();
  $('saveName').value=it.name||'';
  renderEditor(); saveState();
  setSavedMsg(t('loadedOk',{name:it.name}));
}
$('btnSaveNamed').addEventListener('click',function(){
  readForm();
  var name=$('saveName').value.trim()||quiz.title.trim();
  if(!name){setSavedMsg(t('nameEmpty'),true);$('saveName').focus();return;}
  $('saveName').value=name;
  var qs=quiz.questions.filter(function(q){return !isBlank(q);});
  if(!qs.length){setSavedMsg(t('saveNone'),true);return;}
  var arr=getSaved();
  var idx=-1;
  arr.forEach(function(it,i){if(String(it.name).toLowerCase()===name.toLowerCase()) idx=i;});
  if(idx>=0&&!confirm(t('confirmOverwrite',{name:name}))) return;
  var rec={
    id:idx>=0?arr[idx].id:('t'+Date.now()+Math.floor(Math.random()*1000)),
    name:name,ts:Date.now(),title:quiz.title,time:quiz.time,gap:quiz.gap,
    shuffleQ:quiz.shuffleQ,shuffleO:quiz.shuffleO,
    questions:JSON.parse(JSON.stringify(qs))
  };

  if(putSaved(arr)){setSavedMsg(t('savedOk',{name:name}));renderSaved();}
  else setSavedMsg(t('saveFail'),true);
});

var G=null;
var KL={b:['1','2','3','4'],g:['7','8','9','0']};
var KEYMAP={'1':['b',0],'2':['b',1],'3':['b',2],'4':['b',3],'7':['g',0],'8':['g',1],'9':['g',2],'0':['g',3]};

function mkP(){return {i:0,correct:0,wrong:0,answered:0,t:0,lock:false,done:false,perm:[]}}

function newGame(clean){
  var N=clean.length;
  var T=Math.max(5,Math.min(300,parseInt(quiz.time,10)||20));
  var g0=parseInt(quiz.gap,10); if(!(g0>=1)) g0=autoGap(N);
  g0=Math.min(g0,N);
  var order=[]; for(var i=0;i<N;i++) order.push(i);
  if(quiz.shuffleQ) order=shuffle(order);
  return {
    q:clean,N:N,T:T,g0:g0,gap:g0,order:order,mode:'count',cd:3,cdTxt:'',winner:null,
    names:{b:(quiz.boy||'').trim()||t('defBoy'),g:(quiz.girl||'').trim()||t('defGirl')},
    p:{b:mkP(),g:mkP()}
  };
}
function loadQ(key){
  var p=G.p[key], q=G.q[G.order[p.i]];
  var idx=q.o.map(function(_,i){return i});
  p.perm=quiz.shuffleO?shuffle(idx):idx;
  p.t=G.T; p.lock=false;
}
function boyPct(){
  if(!G) return 0;
  if(G.mode==='end'&&G.winner==='boy') return 100;
  return Math.max(0,Math.min(100,Math.round((1-G.gap/G.g0)*100)));
}
function updateHud(){
  if(!G) return;
  var p=boyPct();
  $('hudGap').textContent=Math.max(0,G.gap);
  $('hudN').textContent=G.N;
  $('pctBoy').textContent=p; $('pctGirl').textContent=100-p;
  $('lblBoyName').textContent=G.names.b; $('lblGirlName').textContent=G.names.g;
  $('fill').style.width=(p*0.88)+'%';
  $('mkBoy').style.left=(p*0.88)+'%';
}
function renderPanel(key){
  if(!G) return;
  var p=G.p[key];
  $(key+'-name').textContent=G.names[key];
  $(key+'-stat').textContent='✔ '+p.correct+'    ✘ '+p.wrong;
  var main=$(key+'-main'), wait=$(key+'-wait');
  if(G.mode==='count'||p.done){
    main.classList.add('hidden'); wait.classList.remove('hidden');
    wait.textContent=p.done?t('wait'):t('ready');
    $(key+'-prog').textContent=t('qn',{i:p.done?G.N:1,n:G.N});
    return;
  }
  main.classList.remove('hidden'); wait.classList.add('hidden');
  var q=G.q[G.order[p.i]];
  $(key+'-prog').textContent=t('qn',{i:p.i+1,n:G.N});
  $(key+'-q').textContent=q.q;
  var box=$(key+'-opts'); box.innerHTML='';
  p.perm.forEach(function(orig,pos){
    var b=el('button','opt'); b.type='button';
    b.appendChild(el('span','kb',KL[key][pos]));
    b.appendChild(el('span','ot',q.o[orig]));
    b.addEventListener('click',function(){answer(key,pos);});
    if(p.lock||G.mode==='end') b.disabled=true;
    box.appendChild(b);
  });
}
function renderPanels(){renderPanel('b');renderPanel('g');}

function evaluate(){
  if(G.gap<=0) return 'boy';
  var rem=G.N-G.p.b.answered;
  if(G.gap>rem) return 'girl';
  return null;
}
function answer(key,pos){
  if(!G||G.mode!=='play') return;
  var p=G.p[key];
  if(p.done||p.lock) return;
  if(pos>=p.perm.length) return;
  var thisG=G;
  var q=G.q[G.order[p.i]];
  p.lock=true;
  var correctPos=p.perm.indexOf(q.a);
  var ok=(pos===correctPos);
  var btns=$(key+'-opts').children;
  for(var i=0;i<btns.length;i++) btns[i].disabled=true;
  if(btns[correctPos]) btns[correctPos].classList.add('ok');
  if(!ok&&pos>=0&&btns[pos]) btns[pos].classList.add('no');
  p.answered++;
  if(ok){
    p.correct++; G.gap+=(key==='b'?-1:1); boost[key]=0.9; snd('ok');
  }else{
    p.wrong++; snd('bad');
  }
  $(key+'-stat').textContent='✔ '+p.correct+'    ✘ '+p.wrong;
  updateHud();
  var w=evaluate();
  if(w){endGame(w);return;}
  setTimeout(function(){
    if(G!==thisG||G.mode!=='play') return;
    p.i++;
    if(p.i>=G.N) p.done=true; else loadQ(key);
    renderPanel(key);
  },650);
}
function endGame(w){
  var thisG=G;
  G.mode='end'; G.winner=(w==='boy'?'boy':'girl');
  ['b','g'].forEach(function(k){
    var bs=$(k+'-opts').children;
    for(var i=0;i<bs.length;i++) bs[i].disabled=true;
  });
  updateHud();
  if(w==='boy'){spawnHearts();snd('win');}else{spawnStars();snd('lose');}
  setTimeout(function(){ if(G===thisG) showResult(); },2000);
}
function showResult(){
  if(!G||G.mode!=='end') return;
  var w=G.winner, c=$('mcard'); c.innerHTML='';
  c.appendChild(el('div','mico',w==='boy'?'🏇💞':'👧🏆'));
  c.appendChild(el('h2','mt',t(w==='boy'?'resBoyT':'resGirlT',{name:G.names[w==='boy'?'b':'g']})));
  c.appendChild(el('p','mp',t(w==='boy'?'resBoyP':'resGirlP')));
  var tb=el('div','mstats');
  ['b','g'].forEach(function(k){
    var p=G.p[k], acc=p.answered?Math.round(p.correct/p.answered*100):0;
    var col=el('div','mcol '+(k==='b'?'boy':'girl'));
    col.appendChild(el('b','',(k==='b'?'🏇 ':'👧 ')+G.names[k]));
    col.appendChild(el('div','',t('correctL')+': '+p.correct+' / '+G.N));
    col.appendChild(el('div','',t('accL')+': '+acc+'%'));
    tb.appendChild(col);
  });
  c.appendChild(tb);
  var bt=el('div','mbtns');
  var b1=el('button','btn primary',t('again')); b1.type='button';
  b1.addEventListener('click',function(){var cl=G.q;launch(cl);});
  var b2=el('button','btn',t('edit')); b2.type='button';
  b2.addEventListener('click',backToSetup);
  bt.appendChild(b1); bt.appendChild(b2); c.appendChild(bt);
  $('modal').classList.remove('hidden');
}
function launch(clean){
  $('modal').classList.add('hidden');
  updateMusicBtn(); musicStart();
  G=newGame(clean);
  resetScene();
  $('setup').classList.add('hidden'); $('game').classList.remove('hidden');
  $('gTitle').textContent=(quiz.title||'').trim()||t('defTitle');
  $('bannerText').textContent=(quiz.title||'').trim()||t('defTitle');
  ['b','g'].forEach(function(k){$(k+'-bar').style.width='100%';$(k+'-bar').classList.remove('low');});

function backToSetup(){

var W=320,H=180;
var cv=$('scene'), g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rc(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function R(x,y,w,h,c){rc(g,x,y,w,h,c)}
function rnd(i){var s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}

var LW=640;
var layerMtn=(function(){
  var c=mk(LW,H),x=c.getContext('2d');
  function hf(px){var tt=px/LW*Math.PI*2;
    return 84-0.7*(22*Math.sin(3*tt+1)+16*Math.sin(5*tt+2)+10*Math.sin(9*tt)+6*Math.sin(17*tt+4));}
  for(var px=0;px<LW;px++){
    var hy=Math.floor(hf(px)), s=hf(px+2)-hf(px-2), lit=s<0;
    rc(x,px,hy,1,125-hy,lit?'#5c88c8':'#456fae');
    if(px%9===0) rc(x,px,hy+7,1,11,lit?'#6b97d6':'#3d629c');
    var snow=Math.max(0,72-hy)*0.7;
    if(snow>0){var d=Math.floor(snow)+(px%4<2?1:0); rc(x,px,hy,1,d,lit?'#f6f9ff':'#c3d4ee');}
  }
  return c;
})();
var layerHill=(function(){
  var c=mk(LW,H),x=c.getContext('2d');
  for(var px=0;px<LW;px++){
    var tt=px/LW*Math.PI*2;
    var hy=Math.floor(112-(9*Math.sin(2*tt+.5)+7*Math.sin(4*tt+1)+4*Math.sin(7*tt)));
    rc(x,px,hy,1,140-hy,'#3f8f3b');
    rc(x,px,hy,1,2,'#5bae4a');
    if(px%7===0) rc(x,px,hy+6,1,8,'#357d33');
  }
  return c;
})();
var layerForest=(function(){
  var c=mk(LW,H),x=c.getContext('2d');
  for(var i=0;i<LW/6;i++){
    var px=i*6, hh=9+Math.floor(rnd(i)*9), base=126;
    for(var r=0;r<hh;r++){
      var w=1+Math.floor(r*3.5/hh)*2;
      rc(x,px+3-Math.floor(w/2),base-hh+r,w,1,r%2?'#1d5a2b':'#256b33');
    }
    rc(x,px+2,base,2,2,'#4a2f1a');
  }
  return c;
})();
var layerLake=(function(){
  var c=mk(LW,H),x=c.getContext('2d');
  rc(x,0,126,LW,7,'#3b8bd6'); rc(x,0,126,LW,1,'#2f78c2');
  for(var i=0;i<40;i++) rc(x,(i*37)%LW,128+(i%3)*2,5,1,'#8fc8f5');
  return c;
})();
var tileGround=(function(){
  var c=mk(320,50),x=c.getContext('2d');
  rc(x,0,0,320,50,'#62b03c');
  for(var i=0;i<260;i++){
    var px=Math.floor(rnd(i+3)*320), py=Math.floor(rnd(i+900)*50);
    rc(x,px,py,2,1,i%2?'#4f9a30':'#7bc44b');
  }
  rc(x,0,20,320,18,'#c8a367');
  rc(x,0,19,320,1,'#9c7a45'); rc(x,0,38,320,1,'#a98a50');
  for(var j=0;j<200;j++){
    var qx=Math.floor(rnd(j+77)*320), qy=20+Math.floor(rnd(j+444)*18);
    rc(x,qx,qy,2,1,j%2?'#b08a52':'#dcbf86');
  }
  for(var k=0;k<14;k++){
    var fx=Math.floor(rnd(k+1234)*320), fy=Math.floor(rnd(k+4321)*14)+2;
    rc(x,fx,fy,1,1,k%2?'#ffffff':'#ffe066');
  }
  return c;
})();
var tileFg=(function(){
  var c=mk(320,16),x=c.getContext('2d');
  for(var i=0;i<30;i++){
    var px=Math.floor(rnd(i+50)*316), h=4+Math.floor(rnd(i+90)*7);
    rc(x,px,16-h,1,h,'#2f7a2a'); rc(x,px+1,16-h+2,1,h-2,'#3e9a35'); rc(x,px+2,16-h+1,1,h-1,'#2f7a2a');
  }
  rc(x,0,14,320,2,'#2f7a2a');
  return c;
})();
function tile(c,off,y,w){
  var o=-Math.floor(off%w); g.drawImage(c,o,y); g.drawImage(c,o+w,y);
}

var clouds=[{x:30,y:14,s:1},{x:150,y:30,s:.8},{x:250,y:10,s:1.2}];
function drawCloud(x,y,s){
  g.globalAlpha=.9;
  R(x+4*s,y,14*s,3,'#fff'); R(x,y+3,26*s,3,'#fff'); R(x+6*s,y+6,16*s,2,'#e8f3ff');

}
function drawHorse(x,y,ph,c){
  var bob=-Math.round(Math.abs(Math.sin(ph))*2);
  function leg(hx,p0,col){
    var s=Math.sin(ph+p0), l=Math.max(0,Math.cos(ph+p0));
    var lift=Math.round(l*3);
    var x1=hx+Math.round(s*1), x2=hx+Math.round(s*3), x3=hx+Math.round(s*5);
    R(x+x1,y+17+bob,2,5,col);
    R(x+x2,y+22-Math.round(lift*.5),2,4,col);
    R(x+x3,y+26-lift,2,3,col);
    R(x+x3-1,y+29-lift,4,2,'#222');
  }
  leg(26,.7,c.dark); leg(8,Math.PI+.9,c.dark);
  R(x+9,y+9+bob,22,10,c.body);
  R(x+7,y+10+bob,3,8,c.body);
  R(x+30,y+9+bob,3,9,c.body);
  R(x+9,y+17+bob,22,2,c.dark);
  R(x+12,y+9+bob,10,1,c.light);
  R(x+31,y+6+bob,4,6,c.body);
  R(x+33,y+3+bob,4,5,c.body);
  R(x+35,y+1+bob,6,5,c.body);
  R(x+40,y+3+bob,3,4,c.body);
  R(x+42,y+5+bob,1,2,c.dark);
  R(x+37,y+2+bob,1,1,'#111');
  R(x+35,y-1+bob,2,2,c.body);
  var w=Math.round(Math.sin(ph*1.5)*1);
  R(x+30-w,y+3+bob,2,8,c.mane); R(x+33,y+1+bob,2,3,c.mane);
  for(var i=0;i<5;i++){
    R(x+7-i*2,y+10+bob+Math.round(Math.sin(ph*1.5-i*.8)*2)+i,2,3,c.mane);
  }
  R(x+16,y+8+bob,8,3,'#c62828'); R(x+17,y+9+bob,6,1,'#ffd54f');
  leg(29,0,c.body); leg(11,Math.PI+.2,c.body);
}

function drawGirl(x,y,ph){
  var bob=-Math.round(Math.abs(Math.sin(ph))*2);
  R(x+20,y+14+bob,3,4,'#3b2412');
  R(x+16,y+1+bob,7,10,'#d32f2f');
  R(x+15,y+9+bob,9,5,'#c62828');
  R(x+15,y+13+bob,9,1,'#fff');
  R(x+22,y+3+bob,5,2,'#fff'); R(x+27,y+3+bob,2,2,'#f0c9a0');
  var hw=Math.round(Math.sin(ph*1.5));
  R(x+16,y-4+bob,3,9,'#2a1a14');
  R(x+13-hw,y+1+bob,3,5,'#2a1a14');
  R(x+18,y-5+bob,5,5,'#f0c9a0');
  R(x+21,y-3+bob,1,1,'#111');
  R(x+17,y-8+bob,7,4,'#fff');
  R(x+17,y-6+bob,7,1,'#d32f2f');
  for(var i=0;i<4;i++){
    R(x+14-i*2,y-6+bob+Math.round(Math.sin(ph*1.5-i)*1.5),3,1,'#fff');
  }
}
var HORSE_BOY ={body:'#8a4b24',dark:'#5e3015',light:'#a8663a',mane:'#2b1608'};
var HORSE_GIRL={body:'#b9bec9',dark:'#8a909c',light:'#d7dbe3',mane:'#3a3f4d'};

function drawYurt(x,by){
  var wd=56;
  R(x,by-14,wd,14,'#efe6d2');
  for(var i=0;i<=12;i++){
    var w=Math.round(wd*Math.sqrt(1-Math.pow((12-i)/13,2)));
    R(x+wd/2-w/2,by-26+i,w,1,i%4===0?'#e2d7bd':'#f3ecdb');
  }
  R(x+wd/2-3,by-28,6,2,'#c62828');
  R(x,by-14,wd,2,'#c62828');
  for(var k=0;k<wd;k+=4){R(x+k,by-11+((k/4)%2)*2,1,1,'#c62828');R(x+k+2,by-9-((k/4)%2)*2,1,1,'#c62828');}
  R(x+22,by-12,12,12,'#c62828'); R(x+24,by-10,8,10,'#6b3b1d');
}

/* бөлүкчөлөр */
var dust=[], sparks=[];
var HEART=["0110110","1111111","1111111","0111110","0011100","0001000"];
function drawHeart(x,y){
  for(var r=0;r<HEART.length;r++) for(var c=0;c<7;c++) if(HEART[r].charAt(c)==='1') R(x+c,y+r,1,1,(r===0&&c===1)?'#ffb3c1':'#ff4d6d');
}
function drawSpark(x,y){
  R(x+1,y,1,3,'#ffe066'); R(x,y+1,3,1,'#ffe066'); R(x+1,y+1,1,1,'#fff');
}
function spawnHearts(){
  for(var i=0;i<12;i++) sparks.push({k:'h',x:bx+25+Math.random()*60,y:118+Math.random()*14,vy:-(18+Math.random()*18),life:1.8+Math.random()*.6,t:0});
}
function spawnStars(){
  for(var i=0;i<14;i++) sparks.push({k:'s',x:gx+Math.random()*50,y:100+Math.random()*30,vy:-(10+Math.random()*20),life:1.6+Math.random()*.6,t:0});
}

/* сахна абалы */
var sc=0, tm=0, last=0, dustT=0;
var phB=0, phG=0, spd=1;
var boost={b:0,g:0};
var GXB=215, gx=GXB, bx=60;
function resetScene(){
  sc=0; phB=0; phG=1.3; spd=1; boost.b=0; boost.g=0; gx=GXB; bx=40; dust=[]; sparks=[];
}

function update(dt){
  sc+=dt*70*spd; tm+=dt;
  boost.b=Math.max(0,boost.b-dt); boost.g=Math.max(0,boost.g-dt);
  phB+=dt*(12+boost.b*14); phG+=dt*(12+boost.g*14);
  var endBoy=G.mode==='end'&&G.winner==='boy';
  var endGirl=G.mode==='end'&&G.winner==='girl';
  var vis=endBoy?26:26+Math.min(1.3,Math.max(0,G.gap)/G.g0)*125;
  var tgtB=GXB-vis;
  bx+=(tgtB-bx)*Math.min(1,dt*3);
  var tgtG=endGirl?380:GXB;
  gx+=(tgtG-gx)*Math.min(1,dt*(endGirl?0.9:3));
  var tspd=endBoy?0.35:(endGirl?1.5:1);
  spd+=(tspd-spd)*Math.min(1,dt*1.5);

  if(G.mode==='count'){
    G.cd-=dt;
    var txt=G.cd>0?String(Math.ceil(G.cd)):t('cdGo');
    if(txt!==G.cdTxt){
      G.cdTxt=txt; $('cd').textContent=txt; $('cd').classList.remove('hidden');
      snd(G.cd>0?'tick':'go');
    }
    if(G.cd<=-0.7){
      $('cd').classList.add('hidden');
      G.mode='play'; loadQ('b'); loadQ('g'); renderPanels();
    }
  }else if(G.mode==='play'){
    ['b','g'].forEach(function(k){
      var p=G.p[k]; if(!G||G.mode!=='play') return;
      if(p.done){$(k+'-bar').style.width='0%';return;}
      if(!p.lock){
        p.t-=dt;
        var pc=Math.max(0,p.t/G.T*100);
        var bar=$(k+'-bar'); bar.style.width=pc+'%';
        if(pc<25) bar.classList.add('low'); else bar.classList.remove('low');
        if(p.t<=0) answer(k,-1);
      }
    });
  }

  dustT-=dt;
  if(dustT<=0){
    dustT=.06;
    dust.push({x:gx+6,y:154,vx:-45-Math.random()*20,vy:-Math.random()*14,life:.45});
    dust.push({x:bx+6,y:162,vx:-45-Math.random()*20,vy:-Math.random()*14,life:.45});
  }
  for(var i=dust.length-1;i>=0;i--){var p2=dust[i];p2.x+=p2.vx*dt;p2.y+=p2.vy*dt;p2.life-=dt;if(p2.life<=0)dust.splice(i,1);}
  for(var j=sparks.length-1;j>=0;j--){var s=sparks[j];s.t+=dt;s.y+=s.vy*dt;if(s.t>s.life)sparks.splice(j,1);}
  clouds.forEach(function(c){c.x-=dt*4*c.s;if(c.x<-30)c.x=W+10;});
}
function draw(){
  var sky=['#2f86e0','#3d94e8','#4fa3ee','#66b3f2','#82c3f5','#a0d3f7'];
  for(var i=0;i<sky.length;i++) R(0,i*20,W,20,sky[i]);
  clouds.forEach(function(c){drawCloud(c.x,c.y,c.s)});
  tile(layerMtn,sc*0.04,0,LW);
  tile(layerHill,sc*0.10,0,LW);
  tile(layerForest,sc*0.20,0,LW);
  tile(layerLake,sc*0.28,0,LW);
  tile(tileGround,sc,130,320);
  var fo=Math.floor(sc*0.9)%40;
  R(0,133,W,1,'#6b4a2b'); R(0,138,W,1,'#6b4a2b');
  for(var p=-1;p<9;p++){var px=p*40-fo; R(px,128,3,15,'#7a5632'); R(px,128,3,1,'#9b7447');}
  var yx=820-(sc*0.9%820)-100;
  if(yx<W&&yx>-70) drawYurt(Math.round(yx),146);
  var gxr=Math.round(gx);
  drawHorse(gxr,124,phG,HORSE_GIRL);
  drawGirl(gxr,124,phG);
  var bxr=Math.round(bx);
  drawHorse(bxr,132,phB,HORSE_BOY);
  drawBoy(bxr,132,phB);
  dust.forEach(function(d){g.globalAlpha=Math.max(0,d.life/.45)*.8;R(d.x,d.y,2,2,'#e3cc9a');});
  g.globalAlpha=1;
  tile(tileFg,sc*1.5,166,320);
  sparks.forEach(function(s){
    g.globalAlpha=Math.max(0,1-s.t/s.life);
    var sx=Math.round(s.x+Math.sin(s.t*5)*3), sy=Math.round(s.y);
    if(s.k==='h') drawHeart(sx,sy); else drawSpark(sx,sy);
  });
  g.globalAlpha=1;
}
function loop(ts){
  if(!last) last=ts;
  var dt=Math.min(.05,(ts-last)/1000); last=ts;
  if(G){update(dt);draw();}
  requestAnimationFrame(loop);
}

/* ============================================================
   8. ТИЛДИ КОЛДОНУУ + БАШТОО
   ============================================================ */
function applyLang(){
  document.documentElement.lang=(lang==='kg')?'ky':lang;
  document.querySelectorAll('[data-i18n]').forEach(function(e){e.textContent=t(e.getAttribute('data-i18n'));});
  document.querySelectorAll('[data-i18n-ph]').forEach(function(e){e.placeholder=t(e.getAttribute('data-i18n-ph'));});
  document.querySelectorAll('.langs button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-lang')===lang);});
  document.title=t('appTitle');
  renderEditor(); renderSaved(); updateMusicBtn();
  if(G){
    renderPanels(); updateHud();
    if(G.mode==='end'&&!$('modal').classList.contains('hidden')) showResult();
  }
}
document.querySelectorAll('.langs button').forEach(function(b){
  b.addEventListener('click',function(){lang=b.getAttribute('data-lang');applyLang();saveState();});
});

loadState();
if(!quiz.questions.length) quiz.questions=[newQ()];
fillForm();
applyLang();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
