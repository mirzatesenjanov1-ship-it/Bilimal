<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilimAl.org - Класс жетекчилер/Кураторлор үчүн</title>
    
    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GSQV60QV0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9GSQV60QV0');
    </script>

    <!-- FontAwesome & CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Үстүнкү дарек / Башкы баракка кайтуу */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background-color: #111622;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #1e2640;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #00d2ff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: 0.2s;
        }

        .btn-back:hover {
            color: #ffffff;
        }

        .lang-selector button {
            background-color: #1e2640;
            color: #fff;
            border: 1px solid #34495e;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .lang-selector button.active {
            background-color: #00d2ff;
            color: #0b0e14;
            font-weight: bold;
        }

        .header-title {
            margin-bottom: 30px;
        }

        .header-title h1 {
            color: #00d2ff;
            font-size: 26px;
            margin-bottom: 5px;
        }

        .header-title p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .grid-item {
            background-color: #111622;
            border: 1px solid #1e2640;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
            color: white;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .grid-item:hover {
            transform: translateY(-4px);
            border-color: #00d2ff;
            background-color: #161f33;
        }

        .grid-item i {
            font-size: 36px;
            color: #00d2ff;
            width: 50px;
            text-align: center;
        }

        .item-text h3 {
            font-size: 18px;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .item-text p {
            font-size: 13px;
            color: #7f8c8d;
            line-height: 1.4;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Навигация -->
        <div class="top-bar">
            <a href="../index.html" class="btn-back" id="btn-back">
                <i class="fas fa-arrow-left"></i> Башкы бетке
            </a>
            
            <div class="lang-selector">
                <button class="lang-btn active" onclick="setLanguage('ky')">KG</button>
                <button class="lang-btn" onclick="setLanguage('ru')">RU</button>
                <button class="lang-btn" onclick="setLanguage('en')">EN</button>
            </div>
        </div>

        <!-- Баш сөз -->
        <div class="header-title">
            <h1 id="page-title">Класс жетекчилер жана кураторлор үчүн</h1>
            <p id="page-sub">Класс боюнча электрондук журналдарды жана кезметти онлайн башкарыңыз</p>
        </div>

        <!-- Негизги бөлүмдөр -->
        <div class="grid-container">
            <!-- Келди-кетти (Жоктоо) -->
            <a href="./attendance.html" class="grid-item">
                <i class="fas fa-user-check"></i>
                <div class="item-text">
                    <h3 id="item-attendance-title">Келди-кетти</h3>
                    <p id="item-attendance-desc">Окуучулардын келди-кеттисин, сабакка катышуусун жана калтыруу себептерин көзөмөлдөө</p>
                </div>
            </a>

            <!-- Кезмет графиги -->
            <a href="./duty-schedule.html" class="grid-item">
                <i class="fas fa-calendar-alt"></i>
                <div class="item-text">
                    <h3 id="item-duty-title">Кезмет графиги</h3>
                    <p id="item-duty-desc">Класстык кезметчиликти түзүү, бөлүштүрүү жана көзөмөлдөө</p>
                </div>
            </a>
        </div>
    </div>

    <!-- Тил алмаштыруу логикасы -->
    <script>
        const translations = {
            ky: {
                btnBack: "Башкы бетке",
                pageTitle: "Класс жетекчилер жана кураторлор үчүн",
                pageSub: "Класс боюнча электрондук журналдарды жана кезметти онлайн башкарыңыз",
                attendanceTitle: "Келди-кетти",
                attendanceDesc: "Окуучулардын келди-кеттисин, сабакка катышуусун жана калтыруу себептерин көзөмөлдөө",
                dutyTitle: "Кезмет графиги",
                dutyDesc: "Класстык кезметчиликти түзүү, бөлүштүрүү жана көзөмөлдөө"
            },
            ru: {
                btnBack: "На главную",
                pageTitle: "Для классных руководителей и кураторов",
                pageSub: "Управляйте электронным журналом посещаемости и дежурствами онлайн",
                attendanceTitle: "Посещаемость (Приход-Уход)",
                attendanceDesc: "Отметка прихода и ухода учеников, фиксация причин отсутствия и отчеты",
                dutyTitle: "График дежурств",
                dutyDesc: "Создание, распределение и контроль классного дежурства"
            },
            en: {
                btnBack: "Back to Home",
                pageTitle: "For Class Teachers & Curators",
                pageSub: "Manage electronic attendance register and duty rosters online",
                attendanceTitle: "Attendance (In & Out)",
                attendanceDesc: "Track student entry/exit, mark absence reasons, and generate reports",
                dutyTitle: "Duty Roster",
                dutyDesc: "Create, assign, and monitor classroom duty schedules"
            }
        };

        let currentLang = localStorage.getItem('site_lang') || 'ky';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase() === lang);
            });

            const t = translations[lang];

            document.getElementById('btn-back').innerHTML = `<i class="fas fa-arrow-left"></i> ${t.btnBack}`;
            document.getElementById('page-title').innerText = t.pageTitle;
            document.getElementById('page-sub').innerText = t.pageSub;
            document.getElementById('item-attendance-title').innerText = t.attendanceTitle;
            document.getElementById('item-attendance-desc').innerText = t.attendanceDesc;
            document.getElementById('item-duty-title').innerText = t.dutyTitle;
            document.getElementById('item-duty-desc').innerText = t.dutyDesc;
        }

        window.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLang);
        });
    </script>

</body>
</html>
