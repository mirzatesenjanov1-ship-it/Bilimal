<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кыргыз тили — BiliMal.org</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GSQV60QV0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9GSQV60QV0');
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1495571814896964" crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-1495571814896964">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #03030c; 
            color: #fff; 
            min-height: 100vh; 
            position: relative; 
            padding-bottom: 90px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Навигация */
        header { 
            background: rgba(3, 3, 12, 0.85); 
            backdrop-filter: blur(10px);
            padding: 18px 8%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%; 
            position: relative;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
        }
        .logo { 
            font-size: 1.8rem; 
            font-weight: 900; 
            background: linear-gradient(45deg, #00f0ff, #ff00ff); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-decoration: none;
        }
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links a { 
            color: #a5b4fc; 
            text-decoration: none; 
            font-weight: 600; 
            transition: 0.3s; 
            font-size: 0.95rem; 
        }
        .nav-links a:hover { color: #00f0ff; }

        /* Башкы заголовок */
        .hero { text-align: center; padding: 25px 20px; }
        .hero h1 { 
            font-size: 2.5rem; 
            font-weight: 900; 
            color: #ff9900; 
            margin-bottom: 8px;
        }
        .hero p { color: #a5b4fc; font-size: 1rem; max-width: 700px; margin: 0 auto 20px; }

        .adsense-container { width: 100%; max-width: 850px; margin: 0 auto 25px; text-align: center; }

        /* Контент контейнери */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 4%;
        }

        /* Бөлүмдүн карточкалары */
        .homework-section {
            background: rgba(15, 15, 30, 0.75);
            border: 2px solid #00f0ff;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .section-header h2 {
            font-size: 1.6rem;
            color: #00f0ff;
        }

        /* Үй тапшырмалар тизмеси */
        .homework-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .homework-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid #ff9900;
            border-radius: 10px;
            padding: 18px;
            transition: 0.3s ease;
        }

        .homework-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(4px);
        }

        .hw-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .hw-date {
            font-size: 0.8rem;
            color: #ff9900;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .hw-text {
            font-size: 0.95rem;
            color: #d1d5db;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .empty-msg {
            text-align: center;
            color: #64748b;
            padding: 30px 0;
            font-size: 1rem;
        }

        /* Тил алмаштыруу баскычы */
        .language-switcher-bottom { 
            position: fixed; 
            bottom: 25px; 
            right: 25px; 
            background: rgba(10, 10, 20, 0.9); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 30px; 
            padding: 5px; 
            display: flex; 
            gap: 4px; 
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 800;
            transition: 0.3s;
        }

        .lang-btn.active {
            background: #ff9900;
            color: #000;
        }

        @media (max-width: 768px) {
            header { padding: 15px 5%; }
            .hero h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="logo">BiliMal.org</a>
        <div class="nav-links">
            <a href="../index.html" data-i18n="nav_home">Башкы бет</a>
            <a href="school-subjects.html" data-i18n="nav_back">← Артка</a>
        </div>
    </header>

    <section class="hero">
        <h1 data-i18n="hero_title">🇰🇬 Кыргыз тили предмети</h1>
        <p data-i18n="hero_subtitle">Бул жерде окуу материалдары жана мугалим тарабынан жарыяланган үй тапшырмалары жайгашат</p>

        <div class="adsense-container">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-1495571814896964"
                 data-ad-slot="auto"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </section>

    <div class="container">
        <!-- Үй тапшырмалары бөлүмү -->
        <div class="homework-section">
            <div class="section-header">
                <span style="font-size: 1.8rem;">📌</span>
                <h2 data-i18n="hw_section_title">Үй тапшырмалары</h2>
            </div>

            <div id="homeworkContainer" class="homework-list">
                <!-- Мугалим жарыялаган тапшырмалар ушул жерге динамикалык түрдө чыгат -->
            </div>
        </div>
    </div>

    <!-- Тил алмаштыруу баскычтары -->
    <div class="language-switcher-bottom">
        <button class="lang-btn active" onclick="changeLanguage('ky')">KG</button>
        <button class="lang-btn" onclick="changeLanguage('ru')">RU</button>
        <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
    </div>

    <script>
        const translations = {
            ky: {
                nav_home: "Башкы бет",
                nav_back: "← Артка",
                hero_title: "🇰🇬 Кыргыз тили предмети",
                hero_subtitle: "Бул жерде окуу материалдары жана мугалим тарабынан жарыяланган үй тапшырмалары жайгашат",
                hw_section_title: "Үй тапшырмалары",
                no_hw: "Азырынча үй тапшырмалары жарыялана элек."
            },
            ru: {
                nav_home: "Главная",
                nav_back: "← Назад",
                hero_title: "🇰🇬 Предмет Кыргызский язык",
                hero_subtitle: "Здесь размещены учебные материалы и домашние задания, опубликованные учителем",
                hw_section_title: "Домашние задания",
                no_hw: "Пока нет опубликованных домашних заданий."
            },
            en: {
                nav_home: "Home",
                nav_back: "← Back",
                hero_title: "🇰🇬 Kyrgyz Language Subject",
                hero_subtitle: "Learning materials and homework assigned by the teacher are located here",
                hw_section_title: "Homework Assignments",
                no_hw: "No homework assigned yet."
            }
        };

        let currentLang = 'ky';

        // Тапшырмаларды жуктоп чыгаруу
        function loadHomeworks() {
            const container = document.getElementById('homeworkContainer');
            const storedHomeworks = JSON.parse(localStorage.getItem('kyrgyz_homeworks') || '[]');

            if (storedHomeworks.length === 0) {
                container.innerHTML = `<div class="empty-msg">${translations[currentLang].no_hw}</div>`;
                return;
            }

            container.innerHTML = storedHomeworks.map(hw => `
                <div class="homework-card">
                    <div class="hw-title">${hw.title}</div>
                    <div class="hw-date">⏱ ${hw.date}</div>
                    <div class="hw-text">${hw.text}</div>
                </div>
            `).join('');
        }

        // Тил алмаштыруу
        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            loadHomeworks();
        }

        // Баракча ачылганда тапшырмаларды жүктөө
        document.addEventListener('DOMContentLoaded', loadHomeworks);
    </script>
</body>
</html>
