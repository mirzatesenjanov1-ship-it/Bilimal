<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кыргыз тили - Окуучулар үчүн - BilimAl.org</title>

    <!-- FontAwesome & CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #111622;
            border-radius: 12px;
            border: 1px solid #1e2640;
        }

        .header-box h1 {
            color: #00d2ff;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .card {
            background: #111622;
            border: 1px solid #1e2640;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e2640;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .card-title {
            color: #00d2ff;
            font-size: 18px;
            font-weight: bold;
        }

        .grade-badge {
            background: #1e2640;
            color: #2ecc71;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .card-content {
            font-size: 15px;
            color: #d1d5db;
            line-height: 1.6;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .file-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid rgba(0, 210, 255, 0.3);
            transition: 0.2s;
        }

        .file-button:hover {
            background: #00d2ff;
            color: #0b0e14;
        }

        .card-footer {
            margin-top: 15px;
            font-size: 12px;
            color: #6b7280;
            display: flex;
            justify-content: space-between;
        }

        .empty-box {
            text-align: center;
            padding: 40px;
            color: #6b7280;
            background: #111622;
            border-radius: 12px;
            border: 1px solid #1e2640;
        }

        #loader {
            text-align: center;
            padding: 30px;
            color: #00d2ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <h1><i class="fas fa-book-open"></i> Кыргыз тили боюнча тапшырмалар жана сабактар</h1>
            <p style="color: #9ca3af; font-size: 14px;">Мугалим тарабынан жарыяланган материалдардын тизмеси</p>
        </div>

        <div id="loader"><i class="fas fa-spinner fa-spin"></i> Тапшырмалар жүктөлүүдө...</div>
        <div id="student-materials-list"></div>
    </div>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
            authDomain: "bilimal-org.firebaseapp.com",
            databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bilimal-org",
            storageBucket: "bilimal-org.firebasestorage.app",
            messagingSenderId: "241750360816",
            appId: "1:241750360816:web:a991434eb5afbc470d7835"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const loader = document.getElementById('loader');
        const listContainer = document.getElementById('student-materials-list');

        // Public зонадагы материалдарды угуу (Firebase Rules боюнча library/.read = true)
        const publicMaterialsRef = ref(db, 'library/kyrgyz_teacher_materials');

        onValue(publicMaterialsRef, (snapshot) => {
            loader.style.display = 'none';
            listContainer.innerHTML = '';

            if (!snapshot.exists()) {
                listContainer.innerHTML = `
                    <div class="empty-box">
                        <i class="fas fa-folder-open" style="font-size: 32px; margin-bottom: 10px;"></i>
                        <p>Азырынча үй тапшырмалары жарыялана элек.</p>
                    </div>`;
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const item = childSnapshot.val();

                const card = document.createElement('div');
                card.className = 'card';

                const fileBtn = item.fileUrl 
                    ? `<a href="${item.fileUrl}" target="_blank" class="file-button"><i class="fas fa-file-download"></i> Тиркелген файлды ачуу</a>` 
                    : '';

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">${item.title}</span>
                        <span class="grade-badge">${item.grade}-класс</span>
                    </div>
                    <div class="card-content">${item.content}</div>
                    ${fileBtn}
                    <div class="card-footer">
                        <span><i class="fas fa-chalkboard-teacher"></i> Мугалим: ${item.teacherEmail || 'Кыргыз тили мугалими'}</span>
                        <span><i class="far fa-clock"></i> ${item.updatedAt || item.createdAt || ''}</span>
                    </div>
                `;

                listContainer.prepend(card);
            });
        }, (error) => {
            loader.style.display = 'none';
            console.error("Fetch error:", error);
            listContainer.innerHTML = `<div class="empty-box" style="color: #ff5252;">Ката кетти: ${error.message}</div>`;
        });
    </script>
</body>
</html>
