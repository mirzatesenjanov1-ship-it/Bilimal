<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bilimal Infinite Learning Workspace</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--panel2:#17243a;--line:#2a3b56;--text:#eaf2ff;--muted:#9eb0c9;--accent:#00c9e8;--accent2:#6b8cff;--danger:#ff5b6e;--shadow:0 16px 50px #0005;--radius:16px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font:14px/1.4 Inter,system-ui,Segoe UI,Arial;color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:#1b2a42;border-radius:10px;padding:9px 12px;transition:.15s}button:hover{background:#263c5c;border-color:#466488}button:active{transform:translateY(1px)}button.active{background:var(--accent);color:#04202a;border-color:var(--accent);font-weight:700}button.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:17px}button.flat{background:transparent;border-color:transparent}button.small{padding:6px 9px;font-size:12px}
input,select,textarea{background:#0d1728;border:1px solid var(--line);border-radius:8px;padding:8px;outline:none;width:100%}input:focus,select:focus,textarea:focus{border-color:var(--accent)}label{display:block;color:var(--muted);font-size:12px;margin:9px 0 5px}.app{height:100%;display:flex;flex-direction:column}
.topbar{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;background:#101a2c;border-bottom:1px solid var(--line);z-index:20}.brand{font-weight:800;font-size:16px;white-space:nowrap}.brand span{color:var(--accent)}.project-title{max-width:230px;background:transparent;border:0;font-size:15px;font-weight:700;padding:6px}.top-actions{margin-left:auto;display:flex;gap:7px;align-items:center}.top-actions .hide-mobile{display:inline}
.workspace{position:relative;flex:1;min-height:0;overflow:hidden;background:#f4f7fb;color:#101828;--grid:#dce4ef}
.canvas-viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}.canvas-viewport.panning{cursor:grabbing}.canvas-viewport.drawmode{cursor:crosshair}
.gridbg{position:absolute;inset:0;background-color:#f4f7fb;background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:24px 24px}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.obj{position:absolute;box-sizing:border-box;transform-origin:center center;user-select:none;touch-action:none;cursor:move;color:#172033}
.obj.selected{outline:2px solid #00a9cf;outline-offset:2px}
.obj.textobj{min-width:60px;min-height:28px;white-space:pre-wrap;overflow-wrap:anywhere;cursor:move;padding:4px;background:transparent}
.obj.textobj[contenteditable=true]{outline:2px solid var(--accent);user-select:text;cursor:text}
.obj.shapeobj{display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;border:2px solid #233750;background:#ffffffb8}
.obj.sticky{border-radius:4px;padding:12px 10px;box-shadow:3px 7px 15px #0002;white-space:pre-wrap;overflow:auto}
.obj.imageobj img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.obj.mediaobj{background:#111;color:white;border-radius:10px;overflow:hidden}
.obj.mediaobj iframe,.obj.mediaobj video,.obj.mediaobj audio,.obj.mediaobj embed{width:100%;height:100%;border:0;display:block}
.obj.pdfobj iframe{width:100%;height:100%;border:0;background:#fff}
.obj.frameobj{border:2px dashed #7388a5;background:#ffffff10;border-radius:12px;pointer-events:none}
.frame-label{position:absolute;left:0;top:-26px;background:#536d8e;color:#fff;padding:3px 8px;border-radius:5px;font-size:12px;white-space:nowrap}
.resize-handle{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #009fca;right:-6px;bottom:-6px;cursor:nwse-resize;display:none}
.obj.selected .resize-handle{display:block}
.rotate-handle{position:absolute;left:50%;top:-22px;width:9px;height:9px;border-radius:50%;border:2px solid #00a9cf;background:#fff;display:none;cursor:grab}
.obj.selected .rotate-handle{display:block}
.connector-layer{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.connector-line{stroke:#52708f;stroke-width:2;fill:none;marker-end:url(#arrowhead)}
.toolbar-shell{position:absolute;left:12px;top:12px;z-index:12;display:flex;align-items:flex-start;gap:8px}
.tool-rail{width:46px;padding:6px;background:#132039eF;border:1px solid #32445e;border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px;transition:width .2s;overflow:hidden}
.tool-rail:hover,.tool-rail.pinned{width:206px}.tool-rail:not(.pinned) .tool-label{opacity:0;max-width:0}.tool-rail:hover .tool-label,.tool-rail.pinned .tool-label{opacity:1;max-width:150px}
.tool-btn{height:38px;display:flex;align-items:center;gap:10px;padding:0 9px;border:0;background:transparent;color:#d9e8fc;white-space:nowrap;text-align:left}.tool-btn:hover{background:#263a58}.tool-btn .glyph{width:26px;flex:none;text-align:center;font-size:18px}.tool-label{transition:opacity .15s;overflow:hidden;font-size:13px}
.panel{position:absolute;right:12px;top:12px;width:250px;max-height:calc(100% - 24px);overflow:auto;background:#142039ed;color:#eaf2ff;border:1px solid #30445e;border-radius:15px;box-shadow:var(--shadow);z-index:13;padding:12px;backdrop-filter:blur(16px);display:none}.panel.show{display:block}.panel-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:8px}.panel .row{display:flex;gap:7px}.panel .row>*{flex:1;min-width:0}.panel input[type=color]{height:36px;padding:3px}.panel input[type=range]{padding:0}.panel hr{border:0;border-top:1px solid #2b3c55;margin:12px 0}.layers-list{display:flex;flex-direction:column;gap:5px}.layer-item{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid #2c3f59;border-radius:7px;font-size:12px}.layer-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bottomdock{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:14;display:flex;gap:5px;align-items:center;background:#142039ed;border:1px solid #32445e;border-radius:13px;padding:6px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.bottomdock button{padding:7px 10px;font-size:12px}.zoomread{min-width:45px;text-align:center;font-size:12px;color:#b8c9df}
.minimap{position:absolute;right:12px;bottom:12px;width:160px;height:100px;border:1px solid #8394aa;background:#ffffffd9;border-radius:9px;z-index:11;display:none;overflow:hidden}.minimap.show{display:block}.mini-world{position:absolute;inset:0}.mini-dot{position:absolute;background:#00a7ca;border-radius:2px;opacity:.8}.mini-view{position:absolute;border:1px solid #00a9cf;background:#00c9e822}
.status{position:absolute;left:12px;bottom:12px;z-index:5;color:#56657a;background:#ffffffb8;padding:4px 8px;border-radius:6px;font-size:11px;pointer-events:none}
.toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);background:#15243b;color:white;padding:9px 14px;border-radius:9px;z-index:40;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
.modal-backdrop{position:absolute;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50;padding:15px}.modal-backdrop.show{display:flex}.modal{width:min(440px,100%);background:#142039;border:1px solid #334761;border-radius:16px;padding:18px;box-shadow:var(--shadow)}.modal h3{margin:0 0 12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.timeline{position:absolute;left:0;right:0;bottom:0;height:170px;background:#121d30;border-top:1px solid #2c3e59;z-index:15;display:none;color:#dce8f7;padding:8px 12px}.timeline.show{display:block}.timeline-top{display:flex;align-items:center;gap:8px;height:32px}.timeline-scroll{overflow:auto;height:118px;position:relative}.track{height:26px;margin:5px 0;background:#1b2b44;border-radius:5px;position:relative}.track-label{position:absolute;left:0;top:0;width:110px;padding:4px;font-size:11px;color:#b9cce2;background:#213550;border-radius:5px}.clip{position:absolute;top:3px;height:20px;border-radius:4px;background:#00a7c8;min-width:18px;color:#06202a;font-size:10px;padding:3px;overflow:hidden;white-space:nowrap}
.presentation{position:absolute;inset:0;background:#050b14;z-index:60;display:none;align-items:center;justify-content:center;color:white}.presentation.show{display:flex}.pres-caption{position:absolute;bottom:18px;display:flex;gap:10px}.presentation .pres-canvas{position:absolute;inset:0;overflow:hidden}
body.light{--bg:#e8edf5;--panel:#fff;--panel2:#f1f5fb;--text:#142238;--muted:#65758c;--line:#d4deeb;--shadow:0 12px 35px #14223818}.light .topbar{background:#fff;color:#142238}.light .tool-rail,.light .panel,.light .bottomdock,.light .timeline{background:#fff;color:#142238}.light .tool-btn{color:#142238}
@media(max-width:760px){.topbar{height:52px;padding:0 8px;gap:5px}.brand{font-size:13px}.project-title{max-width:120px;font-size:12px}.top-actions button{padding:6px 8px}.top-actions .hide-mobile{display:none}.toolbar-shell{left:6px;top:7px}.tool-rail{width:42px}.tool-rail:hover,.tool-rail.pinned{width:190px}.panel{right:6px;top:7px;width:210px;max-height:65%}.bottomdock{bottom:6px;gap:2px;padding:4px}.bottomdock button{padding:6px;font-size:11px}.minimap{right:6px;bottom:58px;width:120px;height:80px}.status{bottom:6px;left:6px}.timeline{height:145px}.timeline-scroll{height:94px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar">
  <div class="brand">▣ <span>Bilimal</span> Infinite</div>
  <input class="project-title" id="projectName" value="Жаңы билим долбоору" aria-label="Project name">
  <div class="top-actions">
    <button id="saveBtn" title="Save project (Ctrl+S)">💾 <span class="hide-mobile">Save</span></button>
    <button id="exportBtn" title="Export project JSON">⇩ <span class="hide-mobile">Export</span></button>
    <button id="importBtn" title="Import project">⇧ <span class="hide-mobile">Import</span></button>
    <button id="themeBtn" title="Light / Dark">☀</button>
    <button id="exitBtn" title="Back to Bilimal">↩</button>
  </div>
</header>
<main class="workspace" id="workspace">
 <div class="canvas-viewport" id="viewport">
  <div class="gridbg"></div>
  <div class="world" id="world">
   <svg class="connector-layer" id="svgLayer" width="10000" height="10000" style="overflow:visible">
    <defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#52708f"/></marker></defs>
   </svg>
  </div>
 </div>
 <div class="toolbar-shell">
  <div class="tool-rail" id="toolRail">
   <button class="tool-btn" id="pinTools" title="Pin toolbar"><span class="glyph">📌</span><span class="tool-label">Toolbar pin</span></button>
   <button class="tool-btn" data-tool="select"><span class="glyph">↖</span><span class="tool-label">Select / Move</span></button>
   <button class="tool-btn" data-tool="pen"><span class="glyph">✏️</span><span class="tool-label">Freehand pencil</span></button>
   <button class="tool-btn" data-tool="eraser"><span class="glyph">🩹</span><span class="tool-label">Eraser</span></button>
   <button class="tool-btn" data-tool="text"><span class="glyph">T</span><span class="tool-label">Text</span></button>
   <button class="tool-btn" data-tool="sticky"><span class="glyph">📌</span><span class="tool-label">Sticky note</span></button>
   <button class="tool-btn" data-tool="image"><span class="glyph">🖼</span><span class="tool-label">Image</span></button>
   <button class="tool-btn" data-tool="pdf"><span class="glyph">📄</span><span class="tool-label">PDF</span></button>
   <button class="tool-btn" data-tool="video"><span class="glyph">▶</span><span class="tool-label">Video / YouTube</span></button>
   <button class="tool-btn" data-tool="audio"><span class="glyph">♫</span><span class="tool-label">Audio</span></button>
   <button class="tool-btn" data-tool="shape"><span class="glyph">◇</span><span class="tool-label">Shapes</span></button>
   <button class="tool-btn" data-tool="connector"><span class="glyph">↗</span><span class="tool-label">Connector</span></button>
   <button class="tool-btn" data-tool="table"><span class="glyph">▦</span><span class="tool-label">Table</span></button>
   <button class="tool-btn" data-tool="mindmap"><span class="glyph">🧠</span><span class="tool-label">Mind map</span></button>
   <button class="tool-btn" data-tool="flow"><span class="glyph">📈</span><span class="tool-label">Flowchart</span></button>
   <button class="tool-btn" data-tool="frame"><span class="glyph">▣</span><span class="tool-label">Frame</span></button>
   <button class="tool-btn" data-tool="comment"><span class="glyph">💬</span><span class="tool-label">Comment</span></button>
   <button class="tool-btn" data-tool="record"><span class="glyph">🎙</span><span class="tool-label">Voice recording</span></button>
   <button class="tool-btn" data-tool="cinema"><span class="glyph">🎬</span><span class="tool-label">Cinema route</span></button>
  </div>
 </div>
 <aside class="panel" id="properties">
  <div class="panel-head"><span>Object Properties</span><button class="icon flat small" id="closeProps">×</button></div>
  <div id="propertyContent"><div style="color:#9eb0c9;font-size:12px">Select an object to edit its properties.</div></div>
 </aside>
 <div class="bottomdock" id="dock">
  <button id="zoomOut">−</button><span class="zoomread" id="zoomLabel">100%</span><button id="zoomIn">+</button>
  <button id="fitBtn">Fit</button><button id="miniBtn">Mini map</button><button id="timelineBtn">Timeline</button><button id="presBtn">Present</button><button id="cinemaBtn">Cinema</button><button id="fullscreenBtn">⛶</button>
 </div>
 <div class="minimap" id="minimap"><div class="mini-world" id="miniWorld"></div><div class="mini-view" id="miniView"></div></div>
 <div class="status" id="status">Select · Space + drag to pan · Double-click to edit text</div>
 <div class="toast" id="toast"></div>
 <div class="timeline" id="timeline"><div class="timeline-top"><b>Timeline</b><button class="small" id="timelineClose">Close</button><button class="small" id="addKeyframe">＋ Camera keyframe</button><button class="small" id="playTimeline">▶ Play</button><span id="timeLabel">00:00</span></div><div class="timeline-scroll" id="timelineTracks"></div></div>
 <div class="presentation" id="presentation"><div class="pres-canvas" id="presCanvas"></div><div class="pres-caption"><button id="prevFrame">← Previous</button><span id="frameCounter">Frame 0/0</span><button id="nextFrame">Next →</button><button id="presExit">Exit</button></div></div>
 <div class="modal-backdrop" id="modal"><div class="modal"><h3 id="modalTitle">Dialog</h3><div id="modalBody"></div><div class="modal-actions"><button id="modalCancel">Cancel</button><button class="active" id="modalOK">Continue</button></div></div></div>
 <input type="file" id="fileInput" hidden multiple accept="image/*,application/pdf,video/*,audio/*">
 <input type="file" id="importInput" hidden accept=".json,application/json">
</main>
</div>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s), viewport=$("#viewport"),world=$("#world"),workspace=$("#workspace"),props=$("#properties"),propertyContent=$("#propertyContent"),svg=$("#svgLayer");
const state={objects:[],connectors:[],frames:[],selected:null,tool:"select",scale:1,panX:0,panY:0,theme:"dark",pinned:false,undo:[],redo:[],clipboard:null,drag:null,draw:null,frameIndex:0,projectName:"Жаңы билим долбоору",cameraKeyframes:[],recording:null,recordedChunks:[],timelineOn:false,playing:false};
const colors=["#fff3a6","#c9f7dc","#d9e8ff","#ffd9e8","#eadcff","#ffe3bd"];
let idCounter=0,autosaveTimer,rafPending=false,toastTimer;
function uid(){return "obj_"+Date.now().toString(36)+"_"+(++idCounter).toString(36)}
function toast(msg){let el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),1800)}
function snapshot(){return JSON.stringify({objects:state.objects,connectors:state.connectors,frames:state.frames,projectName:state.projectName,scale:state.scale,panX:state.panX,panY:state.panY,cameraKeyframes:state.cameraKeyframes})}
function pushUndo(){state.undo.push(snapshot());if(state.undo.length>150)state.undo.shift();state.redo=[]}
function restore(data){try{const p=JSON.parse(data);state.objects=p.objects||[];state.connectors=p.connectors||[];state.frames=p.frames||[];state.projectName=p.projectName||"Жаңы билим долбоору";state.cameraKeyframes=p.cameraKeyframes||[];state.selected=null;$("#projectName").value=state.projectName;render();updateView()}catch(e){console.error(e);toast("Project data could not be read")}}
function undo(){if(!state.undo.length)return;state.redo.push(snapshot());restore(state.undo.pop())}
function redo(){if(!state.redo.length)return;state.undo.push(snapshot());restore(state.redo.pop())}
function updateView(){world.style.transform=`translate(${state.panX}px,${state.panY}px) scale(${state.scale})`;$("#zoomLabel").textContent=Math.round(state.scale*100)+"%";renderMini()}
function screenToWorld(x,y){let r=viewport.getBoundingClientRect();return{x:(x-r.left-state.panX)/state.scale,y:(y-r.top-state.panY)/state.scale}}
function worldToScreen(x,y){return{x:x*state.scale+state.panX,y:y*state.scale+state.panY}}
function createObj(type,x,y,extra={}){pushUndo();const o={id:uid(),type,x,y,w:extra.w||220,h:extra.h||120,rotation:0,color:extra.color||"#ffffff",text:extra.text||"",content:extra.content||"",name:extra.name||type,opacity:1,border:"#34445b",fontSize:20,fontFamily:"Arial",bold:false,italic:false,underline:false,align:"left",animation:"none",start:0,duration:10,locked:false,hidden:false,...extra};state.objects.push(o);state.selected=o.id;render();showProperties();return o}
function objectEl(o){let el=document.createElement("div");el.className="obj";el.dataset.id=o.id;el.style.left=o.x+"px";el.style.top=o.y+"px";el.style.width=o.w+"px";el.style.height=o.h+"px";el.style.transform=`rotate(${o.rotation||0}deg)`;el.style.opacity=o.opacity??1;el.style.zIndex=o.z||1;
if(o.type==="text"){el.classList.add("textobj");el.style.fontSize=(o.fontSize||20)+"px";el.style.fontFamily=o.fontFamily||"Arial";el.style.color=o.color||"#172033";el.style.fontWeight=o.bold?"700":"400";el.style.fontStyle=o.italic?"italic":"normal";el.style.textDecoration=o.underline?"underline":"none";el.style.textAlign=o.align||"left";el.textContent=o.text||"Double-click to edit";el.addEventListener("dblclick",e=>{e.stopPropagation();el.contentEditable="true";el.focus();document.execCommand("selectAll",false,null)});el.addEventListener("blur",()=>{if(el.contentEditable==="true"){o.text=el.innerText;el.contentEditable="false";scheduleSave()}});el.addEventListener("keydown",e=>{if(e.key==="Escape"){el.blur()}if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();el.blur()}})}
else if(o.type==="sticky"){el.classList.add("sticky");el.style.background=o.color||colors[0];el.style.color=o.textColor||"#293247";el.style.fontSize=(o.fontSize||16)+"px";el.textContent=o.text||"Стикерге жаз...";el.addEventListener("dblclick",()=>editSticky(o,el))}
else if(o.type==="image"){el.classList.add("imageobj");let im=document.createElement("img");im.src=o.content;el.appendChild(im)}
else if(o.type==="pdf"){el.classList.add("mediaobj","pdfobj");let f=document.createElement("iframe");f.src=o.content;el.appendChild(f)}
else if(o.type==="video"){el.classList.add("mediaobj");if(o.content.startsWith("https://")||o.content.startsWith("http://")){let iframe=document.createElement("iframe");iframe.src=o.content;iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";iframe.allowFullscreen=true;el.appendChild(iframe)}else{let v=document.createElement("video");v.src=o.content;v.controls=true;el.appendChild(v)}}
else if(o.type==="audio"){el.classList.add("mediaobj");let a=document.createElement("audio");a.src=o.content;a.controls=true;el.appendChild(a)}
else if(o.type==="shape"){el.classList.add("shapeobj");el.style.background=o.fill||"#ffffffaa";el.style.borderColor=o.border||"#233750";el.style.color=o.color||"#172033";el.style.borderWidth=(o.lineWidth||2)+"px";el.style.borderRadius=o.shape==="circle"?"50%":o.shape==="diamond"?"0":o.shape==="triangle"?"0":o.shape==="hexagon"?"18px":"8px";if(o.shape==="diamond")el.style.transform=`rotate(${(o.rotation||0)+45}deg) scale(.85)`;if(o.shape==="triangle"){el.style.clipPath="polygon(50% 0,0 100%,100% 100%)";el.style.border="0"}if(o.shape==="hexagon")el.style.clipPath="polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)";el.textContent=o.text||o.shape}
else if(o.type==="frame"){el.classList.add("frameobj");el.style.borderColor=o.color||"#7288a5";el.style.zIndex=0;let lab=document.createElement("span");lab.className="frame-label";lab.textContent=o.text||"Frame";el.appendChild(lab)}
else if(o.type==="table"){el.style.background="#fff";el.style.border="1px solid #718096";el.style.color="#152238";el.style.overflow="auto";el.innerHTML=o.content||makeTableHTML(3,3)}
else if(o.type==="comment"){el.classList.add("sticky");el.style.background="#d9e8ff";el.textContent="💬 "+(o.text||"Комментарий");}
else if(o.type==="drawing"){el.style.pointerEvents="none";el.innerHTML=o.content}
else if(o.type==="mindnode"){el.classList.add("shapeobj");el.style.background=o.fill||"#d8f7ff";el.style.borderRadius="20px";el.textContent=o.text||"Node"}
else if(o.type==="flow"){el.classList.add("shapeobj");el.textContent=o.text||"Process";el.style.background="#e4efff";}
if(o.id===state.selected){el.classList.add("selected");let rh=document.createElement("span");rh.className="resize-handle";el.appendChild(rh);let rot=document.createElement("span");rot.className="rotate-handle";el.appendChild(rot)}
if(!o.hidden){el.addEventListener("pointerdown",objectPointerDown);el.addEventListener("click",e=>{e.stopPropagation();select(o.id)})}
return el}
function makeTableHTML(r,c){let html="<table style='border-collapse:collapse;width:100%;height:100%'>";for(let i=0;i<r;i++){html+="<tr>";for(let j=0;j<c;j++)html+=`<td contenteditable="true" style="border:1px solid #aab6c5;padding:5px;min-width:50px"> </td>`;html+="</tr>"}return html+"</table>"}

$("#timelineClose").onclick=()=>{$("#timeline").classList.remove("show");state.timelineOn=false};
$("#addKeyframe").onclick=()=>{state.cameraKeyframes.push({time:state.cameraKeyframes.length*5,x:state.panX,y:state.panY,scale:state.scale});renderTimeline();toast("Camera keyframe saved")};
function renderTimeline(){if(!state.timelineOn)return;let tracks=$("#timelineTracks");tracks.innerHTML="";let maxTime=Math.max(30,...state.objects.map(o=>(o.start||0)+(o.duration||10)),...state.cameraKeyframes.map(k=>k.time||0));state.objects.forEach(o=>{let tr=document.createElement("div");tr.className="track";let label=document.createElement("span");label.className="track-label";label.textContent=o.name||o.type;tr.appendChild(label);let clip=document.createElement("div");clip.className="clip";clip.style.left=(120+(o.start||0)/maxTime*75)+"%";clip.style.width=Math.max(3,(o.duration||10)/maxTime*75)+"%";clip.textContent=o.animation||o.type;tr.appendChild(clip);tracks.appendChild(tr)});state.cameraKeyframes.forEach((k,i)=>{let tr=document.createElement("div");tr.className="track";tr.innerHTML=`<span class="track-label">Camera key ${i+1}</span><div class="clip" style="left:${120+(k.time||0)/maxTime*75}%;width:12px">◆</div>`;tracks.appendChild(tr)})}
$("#playTimeline").onclick=()=>playAnimations();
function playAnimations(){let start=performance.now(),duration=Math.max(1000,...state.objects.map(o=>(o.start||0)+(o.duration||10))*1000);state.playing=true;function tick(now){if(!state.playing)return;let t=(now-start)/1000;$("#timeLabel").textContent="00:"+String(Math.floor(t)).padStart(2,"0");state.objects.forEach(o=>{let el=world.querySelector(`[data-id="${o.id}"]`);if(!el)return;let local=(t-(o.start||0))/(o.duration||10);if(t<(o.start||0)){el.style.opacity=0;return}el.style.opacity=o.animation==="fade"?Math.min(1,local*4):o.animation==="fadeOut"?Math.max(0,1-local):o.animation==="zoom"?Math.min(1,local*4):o.opacity??1;let anim=o.animation;if(anim==="slideLeft")el.style.transform=`translateX(${-Math.max(0,1-local)*80}px) rotate(${o.rotation||0}deg)`;if(anim==="slideRight")el.style.transform=`translateX(${Math.max(0,1-local)*80}px) rotate(${o.rotation||0}deg)`;if(anim==="slideUp")el.style.transform=`translateY(${Math.max(0,1-local)*80}px) rotate(${o.rotation||0}deg)`;if(anim==="slideDown")el.style.transform=`translateY(${-Math.max(0,1-local)*80}px) rotate(${o.rotation||0}deg)`;if(anim==="rotate")el.style.transform=`rotate(${(o.rotation||0)+360*local}deg)`;if(anim==="pulse")el.style.transform=`scale(${1+.08*Math.sin(now/160)}) rotate(${o.rotation||0}deg)`});if(t*1000<duration)requestAnimationFrame(tick);else{state.playing=false;render()}}requestAnimationFrame(tick)}
$("#saveBtn").onclick=saveProject;function saveProject(){let data=snapshot();try{localStorage.setItem("bilimalInfiniteWorkspace",data);toast("Project saved locally")}catch(e){toast("Save failed — project may be too large. Export JSON instead.")}}
function scheduleSave(){clearTimeout(autosaveTimer);autosaveTimer=setTimeout(saveProject,30000)}
$("#projectName").addEventListener("input",()=>{state.projectName=$("#projectName").value;scheduleSave()});
$("#exportBtn").onclick=()=>exportJSON();function exportJSON(){let blob=new Blob([snapshot()],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(state.projectName||"bilimal-project").replace(/[^\w\- ]/g,"_")+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("#importBtn").onclick=()=>$("#importInput").click();$("#importInput").onchange=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>restore(reader.result);reader.readAsText(f);e.target.value=""};
$("#themeBtn").onclick=()=>{state.theme=state.theme==="dark"?"light":"dark";document.body.classList.toggle("light",state.theme==="light");$("#themeBtn").textContent=state.theme==="light"?"☾":"☀"};
$("#exitBtn").onclick=()=>{if(confirm("Return to Bilimal.org?"))location.href="/"};
function exportCanvas(){let clone=world.cloneNode(true);clone.querySelectorAll(".selected,.resize-handle,.rotate-handle").forEach(e=>e.classList.remove("selected"));let b=new Blob([`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml">${clone.outerHTML}</div></foreignObject></svg>`],{type:"image/svg+xml"});let u=URL.createObjectURL(b),im=new Image();im.onload=()=>{let c=document.createElement("canvas");c.width=1600;c.height=1000;let ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0);c.toBlob(blob=>{let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="bilimal-board.png";a.click();URL.revokeObjectURL(a.href)}, "image/png");URL.revokeObjectURL(u)};im.src=u}
$("#exportBtn").addEventListener("contextmenu",e=>{e.preventDefault();exportCanvas()});
workspace.addEventListener("dragover",e=>{e.preventDefault()});workspace.addEventListener("drop",e=>{e.preventDefault();let p=screenToWorld(e.clientX,e.clientY);Array.from(e.dataTransfer.files||[]).forEach(f=>{let type=f.type.startsWith("image/")?"image":f.type==="application/pdf"?"pdf":f.type.startsWith("video/")?"video":f.type.startsWith("audio/")?"audio":null;if(type)readFileForObject(f,type)})});
window.addEventListener("paste",e=>{if(isTyping())return;let items=e.clipboardData?.items;if(!items)return;for(let item of items){if(item.type.startsWith("image/")){let f=item.getAsFile();if(f)readFileForObject(f,"image");return}if(item.kind==="string"&&item.type==="text/plain"){item.getAsString(text=>{let p=screenToWorld(viewport.clientWidth/2,viewport.clientHeight/2);createObj("text",p.x,p.y,{w:350,h:120,text,color:"#172033"})});return}}});
function isTyping(){let el=document.activeElement;return el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.isContentEditable)}
window.addEventListener("keydown",e=>{if(isTyping())return;let ctrl=e.ctrlKey||e.metaKey;if(ctrl&&e.key.toLowerCase()==="z"){e.preventDefault();undo()}if(ctrl&&e.key.toLowerCase()==="y"){e.preventDefault();redo()}if(ctrl&&e.key.toLowerCase()==="s"){e.preventDefault();saveProject()}if(ctrl&&e.key.toLowerCase()==="d"&&state.selected){e.preventDefault();duplicate(state.objects.find(o=>o.id===state.selected))}if(ctrl&&e.key.toLowerCase()==="c"&&state.selected){state.clipboard=JSON.stringify(state.objects.find(o=>o.id===state.selected))}if(ctrl&&e.key.toLowerCase()==="v"&&state.clipboard){try{let o=JSON.parse(state.clipboard);o.id=uid();o.x+=35;o.y+=35;pushUndo();state.objects.push(o);state.selected=o.id;render()}catch{}}if(e.key==="Delete"||e.key==="Backspace")deleteSelected();if(e.key.toLowerCase()==="t"){setTool("text")}if(e.key==="Escape")exitPresentation()});
function startAudioRecord(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast("Audio recording is not supported in this browser");return}navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{let rec=new MediaRecorder(stream);let chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"}),url=URL.createObjectURL(blob),p=screenToWorld(viewport.clientWidth/2,viewport.clientHeight/2);createObj("audio",p.x,p.y,{w:300,h:70,content:url,name:"Voice recording"});stream.getTracks().forEach(t=>t.stop())};rec.start();modal("Voice recording",`<p>Recording microphone audio. Use the controls to finish.</p><button id="stopRec" class="active">Stop recording</button>`,()=>{if(rec.state!=="inactive")rec.stop()});$("#modalCancel").onclick=()=>{if(rec.state!=="inactive")rec.stop();$("#modal").classList.remove("show")};$("#stopRec").onclick=()=>{rec.stop();$("#modal").classList.remove("show")}}).catch(()=>toast("Microphone permission denied"))}
function renderTimeline(){if(state.timelineOn)renderTimeline()}
function init(){let saved=localStorage.getItem("bilimalInfiniteWorkspace");if(saved){try{let p=JSON.parse(saved);state.objects=p.objects||[];state.connectors=p.connectors||[];state.frames=p.frames||[];state.projectName=p.projectName||state.projectName;state.cameraKeyframes=p.cameraKeyframes||[];$("#projectName").value=state.projectName}catch{}}render();state.panX=viewport.clientWidth/2;state.panY=viewport.clientHeight/2;updateView();setTool("select");scheduleSave()}
init();
})();
</script>
</body>
</html>
