<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiLiMal • Менин Тесттерим</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-area i {
            font-size: 1.8rem;
            color: #00f2fe;
        }
        .logo-area h1 {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 700;
        }
        .logo-area span {
            color: #00f2fe;
        }
        .btn-create {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.5);
        }
        main {
            flex: 1;
            padding: 40px 30px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .test-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.3s ease;
        }
        .test-card:hover {
            border-color: #00f2fe;
        }
        .badge {
            align-self: flex-start;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-pub {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .badge-unpub {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .test-card h3 {
            font-size: 1.25rem;
            color: #fff;
            margin-bottom: 5px;
        }
        .test-card p {
            font-size: 0.9rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-actions {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px solid #1e293b;
            padding-top: 15px;
        }
        .btn-action {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s ease;
        }
        .btn-action:hover {
            background: #334155;
            color: #fff;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #1e293b;
        }
        th {
            background: #1e293b;
            color: #f8fafc;
        }
        td {
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <i class="fa-solid fa-graduation-cap"></i>
            <h1>BiLiMal • <span>Тесттер</span></h1>
        </div>
        <a href="test-builder.html" class="btn-create" id="topCreateBtn">
            <i class="fa-solid fa-plus"></i> Жаңы Тест Түзүү
        </a>
    </header>

    <main>
        <div id="testContainer" class="dashboard-grid">
            <div style="text-align:center; padding:60px; grid-column: 1/-1;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size:2.5rem; color:#00f2fe; margin-bottom:15px;"></i>
                <p style="color:#94a3b8; font-size:1.1rem;">Тесттер жүктөлүүдө, күтө туруңуз...</p>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="resultsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="color:#fff;">Жыйынтыктар</h3>
                <button id="closeModal" style="background:none; border:none; color:#ef4444; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div class="modal-body">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Окуучу</th>
                            <th>Класс</th>
                            <th>Упай</th>
                            <th>Пайыз</th>
                            <th>Списать</th>
                            <th>Убакыт</th>
                            <th>Аракет</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="../js/tests-dashboard.js"></script>
</body>
</html>
