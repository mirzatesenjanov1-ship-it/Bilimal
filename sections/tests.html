<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Башкаруу панели - Bilimal.org</title>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- QRCode JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            /* Негизги түстөр - сүрөттөрдөгүдөй заманбап Dark Theme */
            --bg-color: #070b19; /* Эң караңгы фон */
            --surface-color: #111827; /* Карточкалардын фону */
            --surface-hover: #1f2937;
            
            /* Акцент түстөр */
            --primary: #00f2fe; /* Неоновый көк */
            --primary-glow: rgba(0, 242, 254, 0.3);
            --secondary: #4facfe;
            
            /* Көмөкчү түстөр */
            --success: #00e676;
            --success-glow: rgba(0, 230, 118, 0.3);
            --danger: #ff4b4b;
            --warning: #f59e0b;
            
            /* Текст түстөрү */
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            
            /* Чек аралар */
            --border-color: rgba(255, 255, 255, 0.08);
            --border-light: rgba(255, 255, 255, 0.15);
            
            /* Транзициялар */
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- SIDEBAR (Каптал меню) --- */
        .sidebar {
            width: 280px;
            background: transparent;
            padding: 30px 20px;
            height: 100vh;
            border-right: 1px solid var(--border-color);
            position: fixed;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            z-index: 50;
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .brand-logo span {
            color: var(--primary);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 15px;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .nav-item i {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .nav-item:hover {
            background: var(--surface-color);
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(0, 242, 254, 0.1) 0%, transparent 100%);
            color: var(--primary);
            border-left: 3px solid var(--primary);
            border-radius: 0 12px 12px 0;
            box-shadow: inset 20px 0 20px -20px var(--primary-glow);
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            margin-left: 280px;
            padding: 40px;
            width: calc(100% - 280px);
            box-sizing: border-box;
        }

        /* Header (Издөө жана Башкаруу) */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Формалар жана Инпуттар */
        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: var(--transition);
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Кнопкалар */
        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-icon {
            padding: 12px;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-primary:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .btn-success {
            background: var(--success);
            color: #000;
            box-shadow: 0 0 15px var(--success-glow);
        }

        .btn-success:hover {
            filter: brightness(1.1);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: var(--surface-color);
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-danger {
            background: rgba(255, 75, 75, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 75, 75, 0.3);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 75, 75, 0.4);
        }

        /* Статистика Карточкалары */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--surface-color);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .stat-card:hover {
            border-color: var(--border-light);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), transparent);
            opacity: 0.5;
        }

        .stat-card h3 {
            margin: 0 0 15px 0;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow);
        }

        /* Тесттердин Тизмеси (Grid) */
        .test-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }

        .test-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            position: relative;
        }

        .test-card:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 25px var(--primary-glow);
        }

        .test-card h4 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: var(--text-main);
            line-height: 1.4;
        }

        .test-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .test-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .test-card-footer {
            margin-top: auto;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .test-card-footer .btn {
            flex: 1;
        }

        /* Modal (Тестти бөлүшүү / Жөндөөлөр) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 11, 25, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--surface-color);
            width: 500px;
            max-width: 95%;
            border-radius: 16px;
            padding: 35px;
            border: 1px solid var(--border-light);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 20px;
            color: var(--primary);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            transition: var(--transition);
        }

        .close-btn:hover {
            color: var(--danger);
            transform: scale(1.1);
        }

        .link-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        
        .link-group .form-control {
            padding-left: 15px; /* Икона жок болгондуктан */
        }

        .qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px auto;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            width: 180px;
            height: 180px;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        /* Loading & Empty States */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--surface-color);
            border-radius: 16px;
            border: 1px dashed var(--border-light);
        }
        
        .empty-state i {
            font-size: 48px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="brand-logo">
        <i class="fas fa-atom" style="color: var(--primary);"></i>
        Bilimal<span>.</span>
    </div>
    <nav class="nav-menu">
        <a href="/sections/tests.html" class="nav-item active">
            <i class="fas fa-chart-pie"></i> Башкаруу панели
        </a>
        <a href="/sections/test-builder.html" class="nav-item">
            <i class="fas fa-sliders-h"></i> Smart Test Builder
        </a>
        <a href="/sections/test-results.html" class="nav-item">
            <i class="fas fa-graduation-cap"></i> Жыйынтыктар
        </a>
        <a href="/sections/students.html" class="nav-item">
            <i class="fas fa-users"></i> Окуучулар
        </a>
    </nav>
</aside>

<!-- MAIN CONTENT -->
<main class="main-content">
    
    <div class="top-header">
        <h1 class="page-title">Тесттердин Башкаруу Панели</h1>
        <div class="header-actions">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" class="form-control" placeholder="Тесттин аталышын издөө...">
            </div>
            <button class="btn btn-primary btn-icon" onclick="loadTests()" title="Жаңыртуу">
                <i class="fas fa-sync-alt"></i>
            </button>
            <a href="/sections/test-builder.html" class="btn btn-success">
                <i class="fas fa-plus"></i> Жаңы тест түзүү
            </a>
        </div>
    </div>

    <!-- STATS -->
    <div class="dashboard-stats" id="statsContainer">
        <div class="stat-card">
            <h3>Бардык Тесттер</h3>
            <div class="value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
            <h3>Активдүү</h3>
            <div class="value" id="statActive" style="color: var(--success); text-shadow: 0 0 15px var(--success-glow);">0</div>
        </div>
        <div class="stat-card">
            <h3>Жалпы Тапшыргандар</h3>
            <div class="value" id="statSubmits">0</div>
        </div>
        <div class="stat-card">
            <h3>Орточо балл</h3>
            <div class="value" id="statAvg">0%</div>
        </div>
    </div>

    <!-- TEST LIST -->
    <div class="test-list" id="testListContainer">
        <!-- Төмөнкү HTML JS аркылуу генерацияланат. Көрүнүшү ушундай болот:
        <div class="test-card">
            <h4>Механиканын негиздери</h4>
            <div class="test-meta">
                <span><i class="fas fa-book" style="color: var(--primary);"></i> Физика</span>
                <span><i class="fas fa-clock" style="color: var(--text-muted);"></i> 12.05.2026</span>
            </div>
            <div class="test-card-footer">
                <button class="btn btn-primary" onclick="openTestModal('id', 'Title')">
                    <i class="fas fa-share-alt"></i> Бөлүшүү
                </button>
                <button class="btn btn-outline" onclick="window.location.href='/sections/test-builder.html?edit=id'">
                    <i class="fas fa-pen"></i> Өзгөртүү
                </button>
            </div>
        </div>
        -->
        
        <!-- Маалымат жүктөлгүчө көрүнүүчү Skeleton / Empty state -->
        <div class="empty-state" id="emptyStateContainer">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Тесттер жүктөлүүдө...</p>
        </div>
    </div>
</main>

<!-- SHARE / MANAGE MODAL -->
<div class="modal-overlay" id="testModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTestTitle">Тестти Башкаруу</h3>
            <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
        </div>
        
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 10px;">Окуучулар үчүн шилтеме:</p>
        <div class="link-group">
            <input type="text" id="shareLinkInput" class="form-control" readonly>
            <button class="btn btn-primary" onclick="copyLink()" style="padding: 0 20px;">
                <i class="fas fa-copy"></i>
            </button>
        </div>
        
        <div class="qr-container" id="qrcode" title="QR Код">
            <!-- QR код ушул жерге чыгат -->
        </div>
        
        <hr style="border-color: var(--border-light); margin: 20px 0;">
        
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="exportResults('excel')">
                <i class="fas fa-file-excel" style="color: var(--success);"></i> Excel жыйынтык
            </button>
            <button class="btn btn-danger" onclick="deleteTest()">
                <i class="fas fa-trash"></i> Өчүрүү
            </button>
        </div>
    </div>
</div>

<!-- Тесттин логикасын башкаруучу скрипт (Architecture эрежесине ылайык модулдук) -->
<script type="module" src="/assets/js/tests.js"></script>

<!-- Модалды жабуу үчүн глобалдык окуялар -->
<script>
    document.getElementById('testModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeModal();
        }
    });
</script>

</body>
</html>
