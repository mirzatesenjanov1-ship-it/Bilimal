<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiliMal • Тесттер</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #00f2fe;
            --primary-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --btn-gradient: linear-gradient(90deg, #00d2ff 0%, #928dab 100%);
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-create {
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
        }

        .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.5);
        }

        .tests-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .test-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .test-card h3 {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .test-card p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .badge {
            align-self: flex-start;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-pub { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-unpub { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .card-actions {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-action {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: #334155;
        }

        .btn-delete {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            color: #f8fafc;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th { background: #1e293b; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-title">
            <i class="fa-solid fa-graduation-cap"></i> BiliMal • Тесттер
        </div>
        <a href="test-builder.html" class="btn-create">
            <i class="fa-solid fa-plus"></i> Жаңы Тест Түзүү
        </a>
    </header>

    <!-- ТЕСТТЕР ЧЫГА ТУРГАН НЕГИЗГИ КОНТЕЙНЕР -->
    <main class="tests-grid" id="testContainer">
        <p style="color:#94a3b8; grid-column: 1/-1;"><i class="fa-solid fa-spinner fa-spin"></i> Тесттер жүктөлүүдө...</p>
    </main>

    <!-- Жыйынтыктар үчүн Модалдык терезе -->
    <div class="modal" id="resultsModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <h2 id="modalTitle" style="margin-bottom: 15px;">Жыйынтыктар</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Окуучунун аты</th>
                            <th>Класс</th>
                            <th>Упай</th>
                            <th>Пайызы</th>
                            <th>Анти-чит</th>
                            <th>Датасы</th>
                            <th>Аракет</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="/js/tests-dashboard.js"></script>
</body>
</html>
