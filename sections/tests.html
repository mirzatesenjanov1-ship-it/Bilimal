<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тесттерди башкаруу панели — BiliMal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#03030d; color:#fff; min-height:100vh; padding:30px 5%; }
        header { display:flex; justify-shadow:space-between; align-items:center; margin-bottom:30px; border-bottom:1px solid rgba(0,240,255,0.2); padding-bottom:15px; }
        .logo { font-size:1.8rem; font-weight:800; color:#00f0ff; text-decoration:none; }
        .btn-create { background:linear-gradient(45deg, #00f0ff, #7000ff); color:#fff; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:700; transition:0.3s; }
        .btn-create:hover { box-shadow:0 0 15px rgba(0,240,255,0.5); }
        .test-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:20px; }
        .test-card { background:rgba(15,23,42,0.8); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:20px; position:relative; }
        .test-card h3 { color:#00f0ff; margin-bottom:10px; font-size:1.2rem; }
        .test-card p { color:#94a3b8; font-size:0.9rem; margin-bottom:6px; }
        .card-actions { display:flex; gap:8px; margin-top:15px; flex-wrap:wrap; }
        .btn-action { background:#1e293b; color:#fff; border:1px solid rgba(255,255,255,0.1); padding:6px 12px; border-radius:6px; cursor:pointer; font-size:0.85rem; text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
        .btn-action:hover { border-color:#00f0ff; color:#00f0ff; }
        .btn-delete { color:#ff0055; }
        .btn-delete:hover { border-color:#ff0055; background:rgba(255,0,85,0.1); }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); z-index:100; justify-content:center; align-items:center; }
        .modal-content { background:#0f172a; border:1px solid #00f0ff; border-radius:12px; width:90%; max-width:900px; max-height:85vh; overflow-y:auto; padding:25px; }
        table { width:100%; border-collapse:collapse; margin-top:15px; }
        th, td { border:1px solid rgba(255,255,255,0.1); padding:10px; text-align:left; font-size:0.9rem; }
        th { background:rgba(0,240,255,0.1); color:#00f0ff; }
    </style>
</head>
<body>
    <header>
        <a href="../dashboard.html" class="logo">BiliMal • Тесттер</a>
        <div>
            <a href="test-builder.html" class="btn-create"><i class="fas fa-plus"></i> Жаңы Тест Түзүү</a>
        </div>
    </header>

    <div class="test-grid" id="testContainer">
        <p style="color:#94a3b8">Тесттер жүктөлүп жатат...</p>
    </div>

    <!-- Жыйынтыктар модалкасы -->
    <div class="modal" id="resultsModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="color:#00f0ff" id="modalTitle">Окуучулардын жыйынтыктары</h3>
                <button class="btn-action" id="closeModal">Жабуу (✕)</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Окуучу</th>
                        <th>Класс</th>
                        <th>Балл</th>
                        <th>%</th>
                        <th>Дата</th>
                    </tr>
                </thead>
                <tbody id="resultsTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="../js/tests-dashboard.js"></script>
</body>
</html>
