<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тесттерди башкаруу панели — BiliMal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#03030d; color:#fff; min-height:100vh; padding:30px 5%; }
        header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; border-bottom:1px solid rgba(0,240,255,0.2); padding-bottom:15px; }
        .logo { font-size:1.8rem; font-weight:800; color:#00f0ff; text-decoration:none; display: flex; align-items: center; gap: 10px; }
        .logo:hover { text-shadow: 0 0 10px #00f0ff; }
        .btn-create { background:linear-gradient(45deg, #00f0ff, #7000ff); color:#fff; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:700; transition:0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-create:hover { box-shadow:0 0 15px rgba(0,240,255,0.5); transform: translateY(-2px); }
        .test-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:20px; }
        .test-card { background:rgba(15,23,42,0.8); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:20px; position:relative; backdrop-filter: blur(8px); transition: 0.3s; }
        .test-card:hover { border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 0 20px rgba(0, 240, 255, 0.15); }
        .test-card h3 { color:#00f0ff; margin-bottom:10px; font-size:1.2rem; }
        .test-card p { color:#94a3b8; font-size:0.9rem; margin-bottom:6px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }
        .badge-pub { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
        .badge-unpub { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        .card-actions { display:flex; gap:8px; margin-top:15px; flex-wrap:wrap; }
        .btn-action { background:#1e293b; color:#fff; border:1px solid rgba(255,255,255,0.1); padding:6px 12px; border-radius:6px; cursor:pointer; font-size:0.85rem; text-decoration:none; display:inline-flex; align-items:center; gap:5px; transition: 0.2s; }
        .btn-action:hover { border-color:#00f0ff; color:#00f0ff; background: rgba(0, 240, 255, 0.05); }
        .btn-delete { color:#ff0055; }
        .btn-delete:hover { border-color:#ff0055; background:rgba(255,0,85,0.1); color: #ff0055; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); z-index:100; justify-content:center; align-items:center; }
        .modal-content { background:#0f172a; border:1px solid #00f0ff; border-radius:12px; width:90%; max-width:900px; max-height:85vh; overflow-y:auto; padding:25px; box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); }
        table { width:100%; border-collapse:collapse; margin-top:15px; }
        th, td { border:1px solid rgba(255,255,255,0.1); padding:10px; text-align:left; font-size:0.9rem; }
        th { background:rgba(0,240,255,0.1); color:#00f0ff; }

        /* ЧЕКБОКС ЖАНА ТЕКШЕРИЛГЕН ОКУУЧУНУН СТИЛИ */
        .check-col { text-align: center; width: 45px; }
        .result-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #00f0ff; }
        .checked-student-name { text-decoration: line-through; opacity: 0.5; color: #94a3b8 !important; }
        .checked-row-bg { background: rgba(255, 255, 255, 0.02); }
    </style>
</head>
<body>
    <header>
        <a href="/dashboard.html" class="logo"><i class="fa-solid fa-graduation-cap"></i> BiliMal • Тесттер</a>
        <div>
            <a href="test-builder.html" class="btn-create"><i class="fas fa-plus"></i> Жаңы Тест Түзүү</a>
        </div>
    </header>

    <div class="test-grid" id="testContainer">
        <p style="color:#94a3b8"><i class="fa-solid fa-spinner fa-spin"></i> Тесттер жүктөлүп жатат...</p>
    </div>

    <!-- Жыйынтыктар модалкасы -->
    <div class="modal" id="resultsModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="color:#00f0ff" id="modalTitle">Окуучулардын жыйынтыктары</h3>
                <button class="btn-action" id="closeModal">Жабуу (✕)</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th class="check-col"><i class="fa-solid fa-check"></i></th>
                        <th>Окуучунун аты-жөнү</th>
                        <th>Класс</th>
                        <th>Балл</th>
                        <th>Процент (%)</th>
                        <th>Анти-Чит (чыгуулары)</th>
                        <th>Датасы</th>
                    </tr>
                </thead>
                <tbody id="resultsTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- ТҮЗДӨН-ТҮЗ ИШТӨӨЧҮ ЖАҢЫЛАНГАН МУГАЛИМ СКРИПТИ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
            authDomain: "bilimal-org.firebaseapp.com",
            databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bilimal-org",
            storageBucket: "bilimal-org.firebasestorage.app",
            messagingSenderId: "241750360816",
            appId: "1:241750360816:web:a991434eb5afbc470d7835"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const testContainer = document.getElementById('testContainer');

        onAuthStateChanged(auth, (user) => {
            const userEmail = user ? user.email : null;
            const userUid = user ? user.uid : null;

            const testsRef = ref(db, 'tests');

            onValue(testsRef, (snapshot) => {
                testContainer.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    testContainer.innerHTML = '<p style="color:#94a3b8">Азырынча түзүлгөн тесттер жок.</p>';
                    return;
                }

                let count = 0;

                Object.keys(data).forEach(testId => {
                    const test = data[testId];

                    // КОРГОО/ФИЛЬТР:
                    // 1) Түзүүчү тиешелүү болсо ЭЕ
                    // 2) Же эгер автор талаасы жок болсо (эски тесттер болсо) мугалимдин панелинде БАРДЫК тесттер ачылат.
                    const isMine = !test.authorEmail || test.authorEmail === userEmail || test.createdBy === userEmail || test.authorUid === userUid;

                    if (isMine) {
                        count++;
                        const isPublished = test.isPublished !== false && test.status !== 'hidden';

                        const badgeHTML = isPublished 
                            ? `<span class="badge badge-pub">• Жарыяланды</span>` 
                            : `<span class="badge badge-unpub">• Жашырылган</span>`;

                        const toggleIcon = isPublished ? 'fa-eye-slash' : 'fa-eye';
                        const toggleText = isPublished ? 'Жашыруу' : 'Көрсөтүү';

                        const card = document.createElement('div');
                        card.className = 'test-card';
                        card.innerHTML = `
                            ${badgeHTML}
                            <h3>${test.title || 'Аты жок тест'}</h3>
                            <p><strong>Предмет:</strong> ${test.subject || '—'} (${test.grade || '—'}-класс)</p>
                            <p><strong>Убактысы:</strong> ${test.timer || test.timeLimit || 45} мүнөт</p>
                            <p><strong>Суроолор саны:</strong> ${test.questions ? Object.keys(test.questions).length : 0}</p>
                            <div class="card-actions">
                                <button class="btn-action toggle-btn" data-id="${testId}" data-status="${isPublished}">
                                    <i class="fa-solid ${toggleIcon}"></i> ${toggleText}
                                </button>
                                <a href="test-builder.html?edit=${testId}" class="btn-action"><i class="fa-solid fa-pen"></i> Оңдоо</a>
                                <button class="btn-action btn-delete delete-btn" data-id="${testId}"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        `;
                        testContainer.appendChild(card);
                    }
                });

                if (count === 0) {
                    testContainer.innerHTML = '<p style="color:#94a3b8">Сиз азырынча тест түзө элексиз.</p>';
                }

                // Абалын өзгөртүү (Жашыруу / Көрсөтүү)
                document.querySelectorAll('.toggle-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.currentTarget.getAttribute('data-id');
                        const currentStatus = e.currentTarget.getAttribute('data-status') === 'true';

                        await update(ref(db, `tests/${id}`), {
                            isPublished: !currentStatus,
                            status: !currentStatus ? 'published' : 'hidden'
                        });
                    });
                });

                // Өчүрүү баскычы
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.currentTarget.getAttribute('data-id');
                        if (confirm('Тестти чындап эле өчүрүүнү каалайсызбы?')) {
                            await remove(ref(db, `tests/${id}`));
                        }
                    });
                });
            });
        });

        // Модалка жабуу
        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('resultsModal').style.display = 'none';
        });
    </script>

    <!-- DevTools / F12 бөгөттөөчү скрипт (Мурдагыдай калтырылды) -->
    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
