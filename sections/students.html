<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Окуучулардын рейтинги - BilimAl</title>
    
    <!-- FontAwesome жана CSS стильдер -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-size: 24px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .actions-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: #2d3748;
            border-color: var(--accent-blue);
        }

        .btn-danger {
            color: #fca5a5;
            border-color: #7f1d1d;
        }

        .btn-danger:hover {
            background: #991b1b;
            color: #fff;
        }

        /* Статистика карточкалары */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .stat-card .title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
        }

        /* Чыпкалар жана Издөө */
        .filter-container {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 10px 10px 35px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        select {
            padding: 10px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
        }

        /* Таблица */
        .table-responsive {
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-muted);
            font-weight: 600;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Бейджтер */
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-high { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-mid { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-low { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .btn-view {
            background: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-view:hover {
            background: var(--accent-blue);
            color: #000;
        }

        /* Модалдык терезе */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .close-btn:hover { color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fa-solid fa-graduation-cap" style="color: var(--accent-blue);"></i> Окуучулардын аналитикасы</h1>
        <div class="actions-group">
            <button class="btn" onclick="exportToCSV()"><i class="fa-solid fa-file-excel"></i> CSV Экспорт</button>
            <button class="btn btn-danger" onclick="resetAcademicYear()"><i class="fa-solid fa-trash-can"></i> Окуу жылын тазалоо</button>
        </div>
    </header>

    <!-- Статистика -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="title">Бардык окуучулар</div>
            <div class="value" id="statTotalStudents" style="color: var(--accent-blue);">0</div>
        </div>
        <div class="stat-card">
            <div class="title">Жогорку деңгээл (≥85%)</div>
            <div class="value" id="statHighLevel" style="color: var(--success);">0</div>
        </div>
        <div class="stat-card">
            <div class="title">Орто деңгээл (60-84%)</div>
            <div class="value" id="statMidLevel" style="color: var(--warning);">0</div>
        </div>
        <div class="stat-card">
            <div class="title">Төмөнкү деңгээл (<60%)</div>
            <div class="value" id="statLowLevel" style="color: var(--danger);">0</div>
        </div>
    </div>

    <!-- Чыпкалоо панели -->
    <div class="filter-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ФИО боюнча издөө..." oninput="applyFilters()">
        </div>
        
        <select id="classFilterSelect" onchange="applyFilters()">
            <option value="ALL">Бардык класстар</option>
        </select>

        <select id="sortSelect" onchange="applyFilters()">
            <option value="NAME_ASC">Аты-жөнү боюнча (А-Я)</option>
            <option value="RANK_DESC">Рейтинг боюнча (Жогоркудан)</option>
        </select>
    </div>

    <!-- Жыйынтыктар таблицасы -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>№</th>
                    <th>Окуучунун аты-жөнү</th>
                    <th>Классы</th>
                    <th>Тапшырган тесттери</th>
                    <th>Орточо %</th>
                    <th>Деңгээли</th>
                    <th>Аракет</th>
                </tr>
            </thead>
            <tbody id="studentsTableBody">
                <tr>
                    <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 30px;">
                        <i class="fa-solid fa-spinner fa-spin"></i> Маалыматтар жүктөлүүдө...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Окуучунун толук тарыхын көрсөтүүчү модалдык терезе -->
<div id="detailsModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalStudentName" style="color: var(--text-main); font-size: 18px;">Окуучунун маалыматы</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalHistoryContent">
            <!-- Тарых ушул жерге жүктөлөт -->
        </div>
    </div>
</div>

</body>
