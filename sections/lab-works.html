<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Виртуальная Лаборатория - Измерение объема</title>
  <!-- Three.js, OrbitControls жана DragControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Банер */
    .vip-banner {
      width: 100%;
      max-width: 1000px;
      background: linear-gradient(135deg, #1e1b4b 0%, #311b92 50%, #4a148c 100%);
      border: 2px solid #a855f7;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
      border-radius: 16px;
      padding: 18px 25px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .vip-banner h2 {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #c084fc, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .vip-btn {
      background: linear-gradient(90deg, #e11d48, #9333ea);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
      white-space: nowrap;
    }

    /* Лаборатория контейнери */
    .lab-container {
      width: 100%;
      max-width: 1000px;
      background: #111827;
      border-radius: 20px;
      border: 1px solid #1f2937;
      padding: 20px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .lab-container { grid-template-columns: 1fr; }
      .vip-banner { flex-direction: column; gap: 12px; text-align: center; }
    }

    #canvas-container {
      width: 100%;
      height: 480px;
      background: radial-gradient(circle at center, #1f2937 0%, #0f172a 100%);
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      border: 1px solid #374151;
    }

    .canvas-hint {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.75);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #38bdf8;
      pointer-events: none;
      line-height: 1.5;
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-card {
      background: #1e293b;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .panel-card h3 {
      font-size: 0.9rem;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    select, button {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 6px;
    }

    .lang-select {
      background: #312e81;
      border-color: #6366f1;
      font-weight: 600;
    }

    .btn-action {
      background: #2563eb;
      font-weight: 600;
      border: none;
    }

    .btn-action:hover {
      background: #1d4ed8;
    }

    .rotate-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
    }

    .rotate-btn {
      background: #374151;
      padding: 6px;
      font-size: 0.75rem;
      margin-bottom: 0;
    }

    .rotate-btn:hover {
      background: #4b5563;
    }

    .measure-info {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .measure-info span {
      color: #4ade80;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Банер -->
  <div class="vip-banner">
    <h2 id="banner-title">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      Коллекция лабораторных работ в личном кабинете
    </h2>
    <a href="#" class="vip-btn" id="banner-btn">Войти в кабинет 🚀</a>
  </div>

  <div class="lab-container">
    
    <!-- 3D Визуализация -->
    <div id="canvas-container">
      <div class="canvas-hint" id="canvas-hint">
        🖱️ Вращение: Левая кнопка мыши<br>
        📏 Перемещение линейки: Зажмите и перетащите
      </div>
    </div>

    <!-- Панель управления -->
    <div class="control-panel">
      
      <!-- Тил таңдоо -->
      <div class="panel-card" style="padding: 10px;">
        <select id="lang-select" class="lang-select" onchange="changeLanguage()">
          <option value="ru" selected>🇷🇺 Русский</option>
          <option value="ky">🇰🇬 Кыргызча</option>
          <option value="en">🇬🇧 English</option>
        </select>
      </div>

      <div class="panel-card">
        <h3 id="label-select-obj">1. Выбор объекта</h3>
        <select id="object-select" onchange="changeObject()">
          <option value="box">Правильная форма: Параллелепипед</option>
          <option value="cube">Правильная форма: Куб</option>
          <option value="cylinder">Правильная форма: Цилиндр</option>
          <option value="irregular">Неправильная форма: Камень (с водой)</option>
        </select>
      </div>

      <div class="panel-card">
        <h3 id="label-ruler-ctrl">2. Управление линейкой</h3>
        <button class="btn-action" id="btn-toggle-ruler" onclick="toggleRuler()">📏 Включить / выключить линейку</button>
        <button class="btn-action" id="btn-reset-ruler" style="background: #475569;" onclick="resetRuler()">🔄 Сбросить положение</button>
        
        <p id="label-rotate-ruler" style="font-size: 0.78rem; color: #9ca3af; margin: 6px 0 4px 0;">Вращение линейки (90°):</p>
        <div class="rotate-grid">
          <button class="rotate-btn" onclick="rotateRuler('x')">Ось X</button>
          <button class="rotate-btn" onclick="rotateRuler('y')">Ось Y</button>
          <button class="rotate-btn" onclick="rotateRuler('z')">Ось Z</button>
        </div>

        <button id="submerge-btn" class="btn-action" style="display:none; background:#059669; margin-top: 10px;" onclick="toggleSubmerge()">💧 Опустить камень в воду</button>
      </div>

      <div class="panel-card">
        <h3 id="label-result">3. Результат измерений</h3>
        <div id="info-display" class="measure-info"></div>
      </div>

    </div>
  </div>

  <script>
    // Тилдердин сөздүгү (Translations)
    const i18n = {
      ru: {
        bannerTitle: "Коллекция лабораторных работ в личном кабинете",
        bannerBtn: "Войти в кабинет 🚀",
        hint: "🖱️ Вращение: Левая кнопка мыши<br>📏 Перемещение линейки: Зажмите и перетащите",
        selectObj: "1. Выбор объекта",
        rulerCtrl: "2. Управление линейкой",
        toggleRuler: "📏 Включить / выключить линейку",
        resetRuler: "🔄 Сбросить положение",
        rotateRuler: "Вращение линейки (90°):",
        axisX: "Ось X", axisY: "Ось Y", axisZ: "Ось Z",
        resultTitle: "3. Результат измерений",
        submergeBtnIn: "💧 Опустить камень в воду",
        submergeBtnOut: "🪨 Вытащить камень",
        optBox: "Правильная форма: Параллелепипед",
        optCube: "Правильная форма: Куб",
        optCylinder: "Правильная форма: Цилиндр",
        optIrregular: "Неправильная форма: Камень (с водой)",
        unitCm: "см", unitCm3: "см³", unitMl: "мл (см³)",
        boxInfo: `Параметры:<br>• Ширина (a): <span>4.0 см</span><br>• Длина (b): <span>6.0 см</span><br>• Высота (c): <span>3.0 см</span><br><br>Формула: V = a × b × c<br>Объем (V): <span>72.0 см³</span>`,
        cubeInfo: `Параметры:<br>• Ребро (a): <span>4.0 см</span><br><br>Формула: V = a³<br>Объем (V): <span>64.0 см³</span>`,
        cylinderInfo: `Параметры:<br>• Радиус (r): <span>2.0 см</span><br>• Высота (h): <span>5.0 см</span><br><br>Формула: V = π × r² × h<br>Объем (V): <span>62.8 см³</span>`,
        menzurkaTitle: "Метод измерения (Мензурка):",
        v1Text: "• Начальный объем (V1):",
        v2Text: "• Конечный объем (V2):",
        stoneVolText: "Объем камня (V):",
        submergeHint: "<br><i>Нажмите кнопку погружения камня.</i>"
      },
      ky: {
        bannerTitle: "Лабораториялык иштердин топтому жеке кабинетте",
        bannerBtn: "Кабинетке кирүү 🚀",
        hint: "🖱️ Айландыруу: Чычкандын сол баскычы<br>📏 Сызгычты жылдыруу: Чычкан менен кармап чоюңуз",
        selectObj: "1. Объектти тандоо",
        rulerCtrl: "2. Сызгычты башкаруу",
        toggleRuler: "📏 Сызгычты күйгүзүү / өчүрүү",
        resetRuler: "🔄 Ордуна кайтаруу",
        rotateRuler: "Сызгычты айландыруу (90°):",
        axisX: "X огу", axisY: "Y огу", axisZ: "Z огу",
        resultTitle: "3. Өлчөө жыйынтыгы",
        submergeBtnIn: "💧 Ташты сууга салуу",
        submergeBtnOut: "🪨 Ташты суудан чыгаруу",
        optBox: "Туура форма: Параллелепипед",
        optCube: "Туура форма: Куб",
        optCylinder: "Туура форма: Цилиндр",
        optIrregular: "Туура эмес форма: Таш (Суу менен)",
        unitCm: "см", unitCm3: "см³", unitMl: "мл (см³)",
        boxInfo: `Параметри:<br>• Эни (a): <span>4.0 см</span><br>• Узундугу (b): <span>6.0 см</span><br>• Бийиктиги (c): <span>3.0 см</span><br><br>Формула: V = a × b × c<br>Көлөмү (V): <span>72.0 см³</span>`,
        cubeInfo: `Параметри:<br>• Кырлары (a): <span>4.0 см</span><br><br>Формула: V = a³<br>Көлөмү (V): <span>64.0 см³</span>`,
        cylinderInfo: `Параметри:<br>• Радиусу (r): <span>2.0 см</span><br>• Бийиктиги (h): <span>5.0 см</span><br><br>Формула: V = π × r² × h<br>Көлөмү (V): <span>62.8 см³</span>`,
        menzurkaTitle: "Өлчөө ыкмасы (Мензурка):",
        v1Text: "• Баштапкы көлөм (V1):",
        v2Text: "• Кийинки көлөм (V2):",
        stoneVolText: "Таштын көлөмү (V):",
        submergeHint: "<br><i>Ташты сууга салуу баскычын басыңыз.</i>"
      },
      en: {
        bannerTitle: "Collection of lab works in your account",
        bannerBtn: "Login to account 🚀",
        hint: "🖱️ Rotate: Left mouse button<br>📏 Move Ruler: Click and drag",
        selectObj: "1. Select Object",
        rulerCtrl: "2. Ruler Controls",
        toggleRuler: "📏 Toggle Ruler",
        resetRuler: "🔄 Reset Position",
        rotateRuler: "Rotate Ruler (90°):",
        axisX: "X Axis", axisY: "Y Axis", axisZ: "Z Axis",
        resultTitle: "3. Measurement Result",
        submergeBtnIn: "💧 Submerge stone in water",
        submergeBtnOut: "🪨 Remove stone",
        optBox: "Regular Shape: Parallelepiped",
        optCube: "Regular Shape: Cube",
        optCylinder: "Regular Shape: Cylinder",
        optIrregular: "Irregular Shape: Stone (with water)",
        unitCm: "cm", unitCm3: "cm³", unitMl: "ml (cm³)",
        boxInfo: `Parameters:<br>• Width (a): <span>4.0 cm</span><br>• Length (b): <span>6.0 cm</span><br>• Height (c): <span>3.0 cm</span><br><br>Formula: V = a × b × c<br>Volume (V): <span>72.0 cm³</span>`,
        cubeInfo: `Parameters:<br>• Edge (a): <span>4.0 cm</span><br><br>Formula: V = a³<br>Volume (V): <span>64.0 cm³</span>`,
        cylinderInfo: `Parameters:<br>• Radius (r): <span>2.0 cm</span><br>• Height (h): <span>5.0 cm</span><br><br>Formula: V = π × r² × h<br>Volume (V): <span>62.8 cm³</span>`,
        menzurkaTitle: "Measurement Method (Beaker):",
        v1Text: "• Initial Volume (V1):",
        v2Text: "• Final Volume (V2):",
        stoneVolText: "Stone Volume (V):",
        submergeHint: "<br><i>Click the submerge button.</i>"
      }
    };

    let currentLang = 'ru'; // Дефолттук тил: Орус тили
    let scene, camera, renderer, orbitControls, dragControls;
    let currentMesh, rulerGroup, waterMesh;
    let isSubmerged = false;

    const container = document.getElementById('canvas-container');

    function init() {
      // 1. Сахна
      scene = new THREE.Scene();

      // 2. Камера
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(10, 8, 15);

      // 3. Рендерер
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // 4. Жарык
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(10, 20, 15);
      scene.add(dirLight);

      // 5. Башкаруу (OrbitControls)
      orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
      orbitControls.enableDamping = true;

      // Торчо (Grid)
      const grid = new THREE.GridHelper(20, 20, 0x475569, 0x1e293b);
      grid.position.y = -2;
      scene.add(grid);

      // Сызгыч
      rulerGroup = new THREE.Group();
      createRulerWithNumbers();
      scene.add(rulerGroup);

      // DragControls
      dragControls = new THREE.DragControls([rulerGroup], camera, renderer.domElement);
      dragControls.addEventListener('dragstart', () => orbitControls.enabled = false);
      dragControls.addEventListener('dragend', () => orbitControls.enabled = true);

      // Интерфейсти орус тилинде баштоо
      updateInterfaceLanguage();
      loadBox();

      animate();
    }

    // Тилди өзгөртүү
    function changeLanguage() {
      currentLang = document.getElementById('lang-select').value;
      updateInterfaceLanguage();
      
      // Тандалган объектке жараша маалыматты которуу
      const type = document.getElementById('object-select').value;
      if (type === 'box') loadBox();
      else if (type === 'cube') loadCube();
      else if (type === 'cylinder') loadCylinder();
      else if (type === 'irregular') updateWaterInfo(isSubmerged);

      // Сызгычтын "см" жазуусун да тилге жараша жаңылоо
      createRulerWithNumbers();
    }

    function updateInterfaceLanguage() {
      const t = i18n[currentLang];
      
      document.getElementById('banner-title').childNodes[2].nodeValue = " " + t.bannerTitle;
      document.getElementById('banner-btn').innerText = t.bannerBtn;
      document.getElementById('canvas-hint').innerHTML = t.hint;
      document.getElementById('label-select-obj').innerText = t.selectObj;
      document.getElementById('label-ruler-ctrl').innerText = t.rulerCtrl;
      document.getElementById('btn-toggle-ruler').innerText = t.toggleRuler;
      document.getElementById('btn-reset-ruler').innerText = t.resetRuler;
      document.getElementById('label-rotate-ruler').innerText = t.rotateRuler;
      document.getElementById('label-result').innerText = t.resultTitle;

      const objSelect = document.getElementById('object-select');
      objSelect.options[0].text = t.optBox;
      objSelect.options[1].text = t.optCube;
      objSelect.options[2].text = t.optCylinder;
      objSelect.options[3].text = t.optIrregular;

      const rotateBtns = document.querySelectorAll('.rotate-btn');
      rotateBtns[0].innerText = t.axisX;
      rotateBtns[1].innerText = t.axisY;
      rotateBtns[2].innerText = t.axisZ;

      const subBtn = document.getElementById('submerge-btn');
      subBtn.innerText = isSubmerged ? t.submergeBtnOut : t.submergeBtnIn;
    }

    // Сызгыч текстурасы
    function createRulerTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#000000';
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 28px Poppins, sans-serif';
      ctx.textAlign = 'center';

      const totalCm = 8;
      const startX = 64; 
      const stepCm = (canvas.width - 128) / totalCm;

      for (let i = 0; i <= totalCm; i++) {
        const x = startX + i * stepCm;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 45);
        ctx.stroke();

        ctx.fillText(i.toString(), x, 85);

        if (i < totalCm) {
          for (let mm = 1; mm < 10; mm++) {
            const mmX = x + (mm * stepCm / 10);
            ctx.lineWidth = (mm === 5) ? 3 : 1.5;
            const h = (mm === 5) ? 32 : 20;

            ctx.beginPath();
            ctx.moveTo(mmX, 0);
            ctx.lineTo(mmX, h);
            ctx.stroke();
          }
        }
      }

      ctx.font = 'italic bold 22px Poppins';
      ctx.fillText(i18n[currentLang].unitCm, canvas.width - 35, 80);

      return new THREE.CanvasTexture(canvas);
    }

    function createRulerWithNumbers() {
      rulerGroup.clear();

      const texture = createRulerTexture();
      const sideMaterial = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
      const topMaterial = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.3 });

      const materials = [
        sideMaterial, sideMaterial, topMaterial, sideMaterial, sideMaterial, sideMaterial
      ];

      const geometry = new THREE.BoxGeometry(8.8, 0.2, 1.2);
      const rulerMesh = new THREE.Mesh(geometry, materials);
      rulerGroup.add(rulerMesh);

      resetRuler();
    }

    function resetRuler() {
      rulerGroup.position.set(0, -1.8, 4);
      rulerGroup.rotation.set(0, 0, 0);
    }

    function toggleRuler() {
      rulerGroup.visible = !rulerGroup.visible;
    }

    function rotateRuler(axis) {
      if (axis === 'x') rulerGroup.rotation.x += Math.PI / 2;
      if (axis === 'y') rulerGroup.rotation.y += Math.PI / 2;
      if (axis === 'z') rulerGroup.rotation.z += Math.PI / 2;
    }

    function changeObject() {
      const type = document.getElementById('object-select').value;
      const subBtn = document.getElementById('submerge-btn');
      
      if (currentMesh) scene.remove(currentMesh);
      if (waterMesh) scene.remove(waterMesh);
      subBtn.style.display = 'none';
      isSubmerged = false;

      if (type === 'box') loadBox();
      else if (type === 'cube') loadCube();
      else if (type === 'cylinder') loadCylinder();
      else if (type === 'irregular') {
        loadIrregular();
        subBtn.style.display = 'block';
      }
    }

    function loadBox() {
      const geo = new THREE.BoxGeometry(4, 3, 6);
      const mat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.1, roughness: 0.2 });
      currentMesh = new THREE.Mesh(geo, mat);
      scene.add(currentMesh);

      document.getElementById('info-display').innerHTML = i18n[currentLang].boxInfo;
    }

    function loadCube() {
      const geo = new THREE.BoxGeometry(4, 4, 4);
      const mat = new THREE.MeshStandardMaterial({ color: 0xa855f7, metalness: 0.1, roughness: 0.2 });
      currentMesh = new THREE.Mesh(geo, mat);
      scene.add(currentMesh);

      document.getElementById('info-display').innerHTML = i18n[currentLang].cubeInfo;
    }

    function loadCylinder() {
      const geo = new THREE.CylinderGeometry(2, 2, 5, 32);
      const mat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, metalness: 0.1, roughness: 0.2 });
      currentMesh = new THREE.Mesh(geo, mat);
      scene.add(currentMesh);

      document.getElementById('info-display').innerHTML = i18n[currentLang].cylinderInfo;
    }

    function loadIrregular() {
      currentMesh = new THREE.Group();

      const glassGeo = new THREE.CylinderGeometry(2, 2, 7, 32, 1, true);
      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff, transparent: true, opacity: 0.3, roughness: 0.1, transmission: 0.9
      });
      const glass = new THREE.Mesh(glassGeo, glassMat);
      currentMesh.add(glass);

      const waterGeo = new THREE.CylinderGeometry(1.9, 1.9, 3, 32);
      const waterMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, transparent: true, opacity: 0.6 });
      waterMesh = new THREE.Mesh(waterGeo, waterMat);
      waterMesh.position.y = -1.5;
      scene.add(waterMesh);

      const stoneGeo = new THREE.DodecahedronGeometry(1, 1);
      const pos = stoneGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        pos.setX(i, pos.getX(i) + (Math.random() - 0.5) * 0.3);
        pos.setY(i, pos.getY(i) + (Math.random() - 0.5) * 0.3);
      }
      stoneGeo.computeVertexNormals();

      const stoneMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.9 });
      const stone = new THREE.Mesh(stoneGeo, stoneMat);
      stone.name = "stone";
      stone.position.set(4, -1, 0);
      currentMesh.add(stone);

      scene.add(currentMesh);
      updateWaterInfo(false);
    }

    function toggleSubmerge() {
      const stone = currentMesh.getObjectByName("stone");
      if (!stone) return;

      isSubmerged = !isSubmerged;

      if (isSubmerged) {
        stone.position.set(0, -2.2, 0);
        waterMesh.scale.set(1, 1.4, 1);
        waterMesh.position.y = -0.9;
      } else {
        stone.position.set(4, -1, 0);
        waterMesh.scale.set(1, 1, 1);
        waterMesh.position.y = -1.5;
      }

      document.getElementById('submerge-btn').innerText = isSubmerged ? i18n[currentLang].submergeBtnOut : i18n[currentLang].submergeBtnIn;
      updateWaterInfo(isSubmerged);
    }

    function updateWaterInfo(submerged) {
      const t = i18n[currentLang];
      document.getElementById('info-display').innerHTML = `
        ${t.menzurkaTitle}<br>
        ${t.v1Text} <span>50 ${t.unitMl}</span><br>
        ${submerged ? `${t.v2Text} <span>70${t.unitMl}</span><br><br>
        Формула: Vx = V2 - V1<br>
        ${t.stoneVolText} <span>20.0${t.unitCm3}</span>` : t.submergeHint}
      `;
    }

    function animate() {
      requestAnimationFrame(animate);
      orbitControls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updatePriorityMatrix ? camera.updatePriorityMatrix() : camera.updateMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    window.onload = init;
  </script>
</body>
</html>
