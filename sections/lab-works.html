<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Виртуалдык Лабораториялар Борбору — BiliMal</title>
  
  <!-- Font Awesome Иконкалары -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Банер */
    .vip-banner {
      width: 100%;
      max-width: 1000px;
      background: linear-gradient(135deg, #1e1b4b 0%, #311b92 50%, #4a148c 100%);
      border: 2px solid #a855f7;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
      border-radius: 16px;
      padding: 18px 25px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .vip-banner h2 {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #c084fc, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .vip-btn {
      background: linear-gradient(90deg, #e11d48, #9333ea);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
      white-space: nowrap;
      cursor: pointer;
      border: none;
    }

    /* Бөлүмдүн негизги аталышы */
    .main-title {
      width: 100%;
      max-width: 1000px;
      font-size: 1.4rem;
      color: #38bdf8;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sections-grid {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    /* Карточка стили */
    .section-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .section-card:hover {
      transform: translateY(-5px);
      border-color: #facc15;
      box-shadow: 0 8px 25px rgba(250, 204, 21, 0.2);
    }

    .card-icon {
      font-size: 2.2rem;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .card-action {
      font-size: 0.9rem;
      font-weight: 600;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-lab {
      background: rgba(250, 204, 21, 0.15);
      border: 1px solid #facc15;
      color: #facc15;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: inline-block;
      width: fit-content;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .vip-banner { flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Банер -->
  <div class="vip-banner">
    <h2>
      <i class="fa-solid fa-flask-vial"></i>
      BiliMal Виртуалдык Лабораториясы
    </h2>
    <button class="vip-btn" onclick="openSmartlink()">Кабинетке кирүү 🚀</button>
  </div>

  <div class="main-title">
    <i class="fa-solid fa-bolt-lightning"></i> Физика: Электродинамика жана Магниттик кубулуштар
  </div>

  <!-- Лабораториялык иштердин тизмеси -->
  <div class="sections-grid">
    
    <!-- Лабораториялык иш: Магнит талаасынын токко таасири -->
    <div class="section-card" onclick="openMagneticLab()" style="border-color: rgba(250, 204, 21, 0.4); background: linear-gradient(135deg, #111827 0%, #1e1b4b 100%);">
      <div>
        <span class="badge-lab"><i class="fa-solid fa-laptop-code"></i> Виртуалдык Лаборатория</span>
        <div class="card-icon" style="color: #facc15;"><i class="fa-solid fa-magnet"></i></div>
        <div class="card-title">Магнит талаасынын токко болгон аракетин байкоо</div>
        <div class="card-desc">Тогу бар проводникке магнит талаасынын көрсөткөн таасирин (Ампер күчүн) интерактивдүү жөнгө салуу жана байкоо жүргүзүү.</div>
      </div>
      <div class="card-action">Лабораторияны иштетүү <i class="fa-solid fa-arrow-right"></i></div>
    </div>

  </div>

  <script>
    const SMARTLINK_EFFICIENT = "https://uplcm.com/4/11977316";
    const SMARTLINK_LOVEY = "https://uplcm.com/4/11977319";

    document.addEventListener('click', function(e) {
      if (!sessionStorage.getItem('monetag_lovey_lab_opened')) {
        window.open(SMARTLINK_LOVEY, '_blank');
        sessionStorage.setItem('monetag_lovey_lab_opened', 'true');
      }
    });

    function openSmartlink() {
      window.open(SMARTLINK_EFFICIENT, '_blank');
    }

    // Магнит талаасы боюнча лабораториялык иш файлын ачуу
    function openMagneticLab() {
      openSmartlink();
      window.location.href = "magnetic-field-current-lab.html";
    }
  </script>
</body>
</html>
