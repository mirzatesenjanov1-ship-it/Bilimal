<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Виртуалдык Санариптик Лабораториялар - Bilimal.org</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #050811; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- TOP BAR -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40 px-4 py-3">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="/" class="text-amber-500 font-semibold text-sm border border-amber-500/30 px-3 py-1.5 rounded-xl hover:bg-amber-500 hover:text-slate-950 transition">
        ← Предметтер бөлүмүнө кайт
      </a>
      <a href="/sections/lab-works-vip.html" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition">
        🧪 VIP Виртуалдык Лаборатория
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 mt-8">

    <!-- TITLE -->
    <div class="text-center mb-10">
      <h1 class="text-3xl md:text-4xl font-extrabold text-white">
        Виртуалдык Санариптик <span class="text-fuchsia-500">Лабораториялар</span> 🔬
      </h1>
      <p class="text-slate-400 mt-2 text-sm md:text-base">
        Мектеп окуучулары жана мугалимдер үчүн акысыз ачык виртуалдык симуляциялар
      </p>
    </div>

    <!-- SEARCH -->
    <div class="max-w-xl mx-auto mb-10">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="public-lab-search" placeholder="Лабораториялык ишти издөө..." 
               class="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-white focus:outline-none focus:border-fuchsia-500">
      </div>
    </div>

    <!-- PUBLIC LABS CONTAINER -->
    <div id="public-labs-container" class="space-y-10">
      <div class="text-center py-10 text-slate-400">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-fuchsia-500"></i>
        <p class="mt-2">Ачык лабораториялар жүктөлүүдө...</p>
      </div>
    </div>

  </main>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
      authDomain: "bilimal-org.firebaseapp.com",
      databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "bilimal-org",
      storageBucket: "bilimal-org.firebasestorage.app",
      messagingSenderId: "241750360816",
      appId: "1:241750360816:web:a991434eb5afbc470d7835",
      measurementId: "G-9GSQV60QV0"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.database();
    let publicLabs = [];

    async function loadPublicLabs() {
      const container = document.getElementById('public-labs-container');
      try {
        // Firebase Security Rules эрежесинде уруксат берилген 'library' түйүнүн колдонобуз
        const snap = await db.ref('library').once('value');
        const data = snap.val() || {};

        // Лабораториялык иш катары белгиленген же ачык материалдарды фильтрлөө
        publicLabs = Object.keys(data)
          .map(id => ({ id, ...data[id] }))
          .filter(item => item.isPublic === true || item.type === 'lab_work' || item.category === 'lab_works');

        renderPublicLabs(publicLabs);
      } catch (err) {
        console.error("Error loading public labs:", err);
        container.innerHTML = `
          <div class="text-center py-10 text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-2xl p-6">
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-3"></i>
            <p class="font-bold">Маалыматтарды жүктөөдө ката чыкты.</p>
            <p class="text-xs text-slate-400 mt-1">Сервер менен байланышты текшериңиз.</p>
          </div>
        `;
      }
    }

    function renderPublicLabs(labs) {
      const container = document.getElementById('public-labs-container');
      container.innerHTML = '';

      if (labs.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 py-10">Азырынча ачык жарыяланган лабораториялык иштер жок.</p>`;
        return;
      }

      // Group labs by Grade
      const grouped = {};
      labs.forEach(lab => {
        const gradeKey = lab.grade || 'Башка класстар';
        if (!grouped[gradeKey]) grouped[gradeKey] = [];
        grouped[gradeKey].push(lab);
      });

      Object.keys(grouped).forEach(grade => {
        const section = document.createElement('div');
        section.className = "space-y-4";
        
        let cardsHtml = '';
        grouped[grade].forEach(lab => {
          cardsHtml += `
            <div class="bg-slate-900/90 border border-slate-800 p-6 rounded-2xl flex flex-col justify-between hover:border-fuchsia-500/50 transition">
              <div>
                <div class="flex justify-between items-center mb-3">
                  <span class="text-xs font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-0.5 rounded-full uppercase">АКТИВДҮҮ</span>
                  <span class="text-xs text-slate-400">${lab.subject || 'Физика'}</span>
                </div>
                <h3 class="text-xl font-bold text-cyan-400 mb-2">${lab.title || 'Аталышы жок'}</h3>
                <p class="text-sm text-slate-300 leading-relaxed">${lab.description || ''}</p>
              </div>
              <div class="mt-6 flex flex-wrap gap-3">
                ${lab.simUrl ? `
                  <a href="${lab.simUrl}" target="_blank" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition flex items-center gap-2">
                    Тажрыйбаны баштоо →
                  </a>
                ` : ''}
                ${lab.pdfUrl ? `
                  <a href="${lab.pdfUrl}" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-white font-semibold px-4 py-2 rounded-xl text-sm transition flex items-center gap-2 border border-slate-700">
                    <i class="fa-solid fa-file-pdf"></i> Нускама
                  </a>
                ` : ''}
              </div>
            </div>
          `;
        });

        section.innerHTML = `
          <h2 class="text-2xl font-bold text-fuchsia-400 border-l-4 border-fuchsia-500 pl-3">${grade}</h2>
          <div class="grid md:grid-cols-2 gap-6">
            ${cardsHtml}
          </div>
        `;
        container.appendChild(section);
      });
    }

    document.getElementById('public-lab-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = publicLabs.filter(l => 
        (l.title && l.title.toLowerCase().includes(q)) || 
        (l.grade && l.grade.toLowerCase().includes(q))
      );
      renderPublicLabs(filtered);
    });

    loadPublicLabs();
  </script>
</body>
</html>
