<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кыргыз тили мугалиминин кабинети - BilimAl.org</title>

    <!-- FontAwesome & CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111622;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #1e2640;
            margin-bottom: 25px;
        }

        .back-btn {
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        .page-title {
            font-size: 20px;
            color: #00d2ff;
            font-weight: bold;
        }

        .user-badge {
            font-size: 13px;
            background: #1e2640;
            padding: 6px 12px;
            border-radius: 20px;
            color: #a0aec0;
        }

        .card {
            background: #111622;
            border: 1px solid #1e2640;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .card h3 {
            color: #00d2ff;
            margin-bottom: 15px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #ccc;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: #0b0e14;
            border: 1px solid #1e2640;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: #00d2ff;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-submit {
            background: #00d2ff;
            color: #0b0e14;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #00a3cc;
        }

        .btn-submit:disabled {
            background: #4a5568;
            cursor: not-allowed;
        }

        .btn-cancel {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            display: none;
        }

        .materials-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-card {
            background: #111622;
            border: 1px solid #1e2640;
            border-radius: 10px;
            padding: 20px;
            position: relative;
        }

        .item-card.public {
            border-left: 4px solid #2ecc71;
        }

        .item-card.private {
            border-left: 4px solid #f39c12;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .item-title {
            font-size: 18px;
            color: #fff;
        }

        .status-tag {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: bold;
        }

        .status-tag.pub {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
        }

        .status-tag.priv {
            background: rgba(243, 156, 18, 0.15);
            color: #f39c12;
        }

        .item-desc {
            font-size: 14px;
            color: #bbb;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #7f8c8d;
            border-top: 1px solid #1e2640;
            padding-top: 10px;
        }

        .action-btns {
            display: flex;
            gap: 15px;
        }

        .btn-edit {
            background: transparent;
            border: none;
            color: #00d2ff;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 14px;
        }

        .file-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #00d2ff;
            text-decoration: none;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .empty-msg {
            text-align: center;
            padding: 30px;
            color: #7f8c8d;
        }

        #loader {
            text-align: center;
            padding: 20px;
            color: #00d2ff;
        }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .top-nav { flex-direction: column; gap: 10px; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Навигация -->
        <div class="top-nav">
            <a href="../dashboard.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Башкаруу панелине кайтуу
            </a>
            <div class="page-title">Кыргыз тили мугалими</div>
            <div id="user-email-display" class="user-badge"><i class="fas fa-user-circle"></i> Текшерилүүдө...</div>
        </div>

        <!-- Жаңы материал кошуу же оңдоо -->
        <div class="card">
            <h3 id="form-title"><i class="fas fa-plus-circle"></i> Жаңы сабак же материал түзүү</h3>
            <form id="material-form">
                <input type="hidden" id="edit-id" value="">
                
                <div class="form-group">
                    <label>Материалдын же сабактын темасы</label>
                    <input type="text" id="title" placeholder="Мисалы: Зат атоочтун жөндөлүшү" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Класс</label>
                        <select id="grade">
                            <option value="5">5-класс</option>
                            <option value="6">6-класс</option>
                            <option value="7">7-класс</option>
                            <option value="8">8-класс</option>
                            <option value="9">9-класс</option>
                            <option value="10">10-класс</option>
                            <option value="11">11-класс</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Жарыялоо статусу</label>
                        <select id="status">
                            <option value="public">🌐 Жарыялоо (Окуучулар көрүшөт)</option>
                            <option value="private">🔒 Жабык (Өзүм үчүн гана черновик)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Файлдын шилтемеси (Google Drive, Telegram же документке шилтеме - милдеттүү эмес)</label>
                    <input type="url" id="file-url" placeholder="https://drive.google.com/...">
                </div>

                <div class="form-group">
                    <label>Мазмуну же тапшырманын тексти</label>
                    <textarea id="content" rows="5" placeholder="Сабактын баяндамасы, эрежелер же окуучуларга тапшырма..." required></textarea>
                </div>

                <button type="submit" class="btn-submit" id="save-btn" disabled>Материалды сактоо</button>
                <button type="button" class="btn-cancel" id="cancel-btn">Баш тартуу (Өзгөртпөө)</button>
            </form>
        </div>

        <!-- Түзүлгөн материалдар -->
        <h3 style="margin-bottom: 15px; color: #fff;"><i class="fas fa-folder-open"></i> Менин сакталган материалдарым:</h3>
        
        <div id="loader"><i class="fas fa-spinner fa-spin"></i> Жүктөлүүдө...</div>
        <div class="materials-list" id="materials-container"></div>
    </div>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
            authDomain: "bilimal-org.firebaseapp.com",
            databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bilimal-org",
            storageBucket: "bilimal-org.firebasestorage.app",
            messagingSenderId: "241750360816",
            appId: "1:241750360816:web:a991434eb5afbc470d7835"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let localMaterials = {};

        const saveBtn = document.getElementById('save-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const userEmailDisplay = document.getElementById('user-email-display');
        const formTitle = document.getElementById('form-title');
        const materialForm = document.getElementById('material-form');

        // Авторизацияны текшерүү
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                userEmailDisplay.innerHTML = `<i class="fas fa-user-circle"></i> ${user.email}`;
                saveBtn.disabled = false;
                loadTeacherMaterials(user.uid);
            } else {
                userEmailDisplay.innerText = "Кирбей калдыңыз";
                saveBtn.disabled = true;
                window.location.href = "../dashboard.html";
            }
        });

        // Форманы сактоо (Жаңы түзүү же Түзөтүү)
        materialForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            saveBtn.disabled = true;
            saveBtn.innerText = "Сакталууда...";

            const editId = document.getElementById('edit-id').value;
            const title = document.getElementById('title').value.trim();
            const grade = document.getElementById('grade').value;
            const status = document.getElementById('status').value;
            const fileUrl = document.getElementById('file-url').value.trim();
            const content = document.getElementById('content').value.trim();

            try {
                let targetKey = editId;
                if (!targetKey) {
                    const newRef = push(ref(db, `users/${currentUser.uid}/kyrgyz_teacher_materials`));
                    targetKey = newRef.key;
                }

                const postData = {
                    id: targetKey,
                    authorUid: currentUser.uid,
                    teacherEmail: currentUser.email,
                    title: title,
                    grade: grade,
                    status: status,
                    fileUrl: fileUrl,
                    content: content,
                    updatedAt: new Date().toLocaleString("ky-KG")
                };

                // 1. Өзүнүн профилине сактоо
                await set(ref(db, `users/${currentUser.uid}/kyrgyz_teacher_materials/${targetKey}`), postData);

                // 2. Статуска жараша Library (Public) зонасын башкаруу
                if (status === 'public') {
                    await set(ref(db, `library/kyrgyz_teacher_materials/${targetKey}`), postData);
                } else {
                    // Эгер сабак мурда public болуп, эми private кылынса, public зонадан өчүрүү
                    await remove(ref(db, `library/kyrgyz_teacher_materials/${targetKey}`));
                }

                resetForm();
                alert(editId ? "Материал ийгиликтүү оңдолду!" : "Жаңы материал сакталды!");
            } catch (error) {
                console.error("Save error:", error);
                alert("Ката кетти: " + error.message);
            } finally {
                saveBtn.disabled = false;
            }
        });

        // Мугалимдин сакталган материалдарын жүктөө
        function loadTeacherMaterials(uid) {
            const loader = document.getElementById('loader');
            const container = document.getElementById('materials-container');
            const teacherRef = ref(db, `users/${uid}/kyrgyz_teacher_materials`);

            onValue(teacherRef, (snapshot) => {
                loader.style.display = 'none';
                container.innerHTML = '';
                localMaterials = {};

                if (!snapshot.exists()) {
                    container.innerHTML = '<div class="empty-msg">Сизде азырынча сакталган материал жок.</div>';
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const item = childSnapshot.val();
                    localMaterials[item.id] = item;

                    const card = document.createElement('div');
                    card.className = `item-card ${item.status}`;

                    const statusTag = item.status === 'public' 
                        ? '<span class="status-tag pub"><i class="fas fa-globe"></i> Жарыяланды (Окуучуларга ачык)</span>'
                        : '<span class="status-tag priv"><i class="fas fa-lock"></i> Жабык (Черновик)</span>';

                    const fileHTML = item.fileUrl 
                        ? `<a href="${item.fileUrl}" target="_blank" class="file-link"><i class="fas fa-paperclip"></i> Файлды көрүү / Жүктөө</a>` 
                        : '';

                    card.innerHTML = `
                        <div class="item-header">
                            <h4 class="item-title">${item.title} (${item.grade}-класс)</h4>
                            ${statusTag}
                        </div>
                        ${fileHTML}
                        <div class="item-desc">${item.content}</div>
                        <div class="item-footer">
                            <span><i class="far fa-clock"></i> ${item.updatedAt || item.createdAt || ''}</span>
                            <div class="action-btns">
                                <button class="btn-edit" data-id="${item.id}">
                                    <i class="fas fa-edit"></i> Оңдоо
                                </button>
                                <button class="btn-delete" data-id="${item.id}">
                                    <i class="fas fa-trash-alt"></i> Өчүрүү
                                </button>
                            </div>
                        </div>
                    `;

                    // Event Listeners
                    card.querySelector('.btn-edit').addEventListener('click', () => editMaterial(item.id));
                    card.querySelector('.btn-delete').addEventListener('click', () => deleteMaterial(uid, item.id));

                    container.prepend(card);
                });
            }, (error) => {
                loader.style.display = 'none';
                console.error("Read error:", error);
            });
        }

        // Оңдоо режимин активдештирүү
        function editMaterial(id) {
            const item = localMaterials[id];
            if (!item) return;

            document.getElementById('edit-id').value = item.id;
            document.getElementById('title').value = item.title;
            document.getElementById('grade').value = item.grade;
            document.getElementById('status').value = item.status;
            document.getElementById('file-url').value = item.fileUrl || '';
            document.getElementById('content').value = item.content;

            formTitle.innerHTML = `<i class="fas fa-edit"></i> Материалды оңдоо`;
            saveBtn.innerText = "Өзгөртүүлөрдү сактоо";
            cancelBtn.style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Оңдоо режиминен чыгуу
        cancelBtn.addEventListener('click', resetForm);

        function resetForm() {
            materialForm.reset();
            document.getElementById('edit-id').value = '';
            formTitle.innerHTML = `<i class="fas fa-plus-circle"></i> Жаңы сабак же материал түзүү`;
            saveBtn.innerText = "Материалды сактоо";
            cancelBtn.style.display = 'none';
        }

        // Өчүрүү
        async function deleteMaterial(uid, itemId) {
            if (confirm("Бул материалды өчүрүүнү каалайсызбы?")) {
                try {
                    await remove(ref(db, `users/${uid}/kyrgyz_teacher_materials/${itemId}`));
                    await remove(ref(db, `library/kyrgyz_teacher_materials/${itemId}`));
                    alert("Материал өчүрүлдү.");
                } catch (err) {
                    alert("Өчүрүүдө ката: " + err.message);
                }
            }
        }
    </script>
</body>
</html>
