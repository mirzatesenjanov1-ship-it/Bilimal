<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кыргыз тили мугалиминин кабинети - BilimAl.org</title>

    <!-- FontAwesome & CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Үстүңкү навигация */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111622;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #1e2640;
            margin-bottom: 25px;
        }

        .back-btn {
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        .page-title {
            font-size: 20px;
            color: #00d2ff;
        }

        /* Форма бөлүгү (Материал түзүү) */
        .card {
            background: #111622;
            border: 1px solid #1e2640;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .card h3 {
            color: #00d2ff;
            margin-bottom: 15px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #ccc;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: #0b0e14;
            border: 1px solid #1e2640;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: #00d2ff;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-submit {
            background: #00d2ff;
            color: #0b0e14;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #00a3cc;
        }

        /* Тизме бөлүгү */
        .materials-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-card {
            background: #111622;
            border: 1px solid #1e2640;
            border-radius: 10px;
            padding: 20px;
            position: relative;
        }

        .item-card.published {
            border-left: 4px solid #2ecc71;
        }

        .item-card.private {
            border-left: 4px solid #f39c12;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .item-title {
            font-size: 18px;
            color: #fff;
        }

        .status-tag {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: bold;
        }

        .status-tag.pub {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
        }

        .status-tag.priv {
            background: rgba(243, 156, 18, 0.15);
            color: #f39c12;
        }

        .item-desc {
            font-size: 14px;
            color: #bbb;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #7f8c8d;
            border-top: 1px solid #1e2640;
            padding-top: 10px;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-delete:hover {
            color: #ff1111;
        }

        .file-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #00d2ff;
            text-decoration: none;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .empty-msg {
            text-align: center;
            padding: 30px;
            color: #7f8c8d;
        }

        #loader {
            text-align: center;
            padding: 20px;
            color: #00d2ff;
        }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Навигация -->
        <div class="top-nav">
            <a href="../dashboard.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Башкаруу панелине кайтуу
            </a>
            <div class="page-title">Кыргыз тили мугалими</div>
        </div>

        <!-- Жаңы материал кошуу -->
        <div class="card">
            <h3><i class="fas fa-plus-circle"></i> Жаңы сабак же материал түзүү</h3>
            <form id="material-form">
                <div class="form-group">
                    <label>Материалдын же сабактын темасы</label>
                    <input type="text" id="title" placeholder="Мисалы: Зат атоочтун жөндөлүшү" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Класс</label>
                        <select id="grade">
                            <option value="5">5-класс</option>
                            <option value="6">6-класс</option>
                            <option value="7">7-класс</option>
                            <option value="8">8-класс</option>
                            <option value="9">9-класс</option>
                            <option value="10">10-класс</option>
                            <option value="11">11-класс</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Жарыялоо статусу</label>
                        <select id="status">
                            <option value="public">🌐 Жарыялоо (Окуучулар көрүшөт)</option>
                            <option value="private">🔒 Жабык (Өзүм үчүн гана черновик)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Файлдын шилтемеси (Google Drive, Telegram же документке шилтеме - милдеттүү эмес)</label>
                    <input type="url" id="file-url" placeholder="https://drive.google.com/...">
                </div>

                <div class="form-group">
                    <label>Мазмуну же тапшырманын тексти</label>
                    <textarea id="content" rows="5" placeholder="Сабактын баяндамасы, эрежелер же окуучуларга тапшырма..." required></textarea>
                </div>

                <button type="submit" class="btn-submit" id="save-btn">Материалды сактоо</button>
            </form>
        </div>

        <!-- Түзүлгөн материалдар -->
        <h3 style="margin-bottom: 15px; color: #fff;"><i class="fas fa-folder-open"></i> Менин сакталган материалдарым:</h3>
        
        <div id="loader"><i class="fas fa-spinner fa-spin"></i> Юктөлүүдө...</div>
        <div class="materials-list" id="materials-container"></div>
    </div>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
            authDomain: "bilimal-org.firebaseapp.com",
            databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bilimal-org",
            storageBucket: "bilimal-org.firebasestorage.app",
            messagingSenderId: "241750360816",
            appId: "1:241750360816:web:a991434eb5afbc470d7835"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;

        // Кирген мугалимди текшерүү
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadTeacherMaterials(user.uid);
            } else {
                // Кирбеген болсо башкаруу панелине кайтаруу
                window.location.href = "../dashboard.html";
            }
        });

        // Форманы тапшыруу
        const materialForm = document.getElementById('material-form');
        materialForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const title = document.getElementById('title').value;
            const grade = document.getElementById('grade').value;
            const status = document.getElementById('status').value;
            const fileUrl = document.getElementById('file-url').value;
            const content = document.getElementById('content').value;

            // Колдонуучунун ID сине жараша зашифрованный UID түзүү
            const userEmailSafe = currentUser.email.replace(/\./g, '_');
            const materialRef = ref(db, `kyrgyz_teacher_materials/${currentUser.uid}`);
            const newPostRef = push(materialRef);

            const postData = {
                id: newPostRef.key,
                teacherEmail: currentUser.email,
                title: title,
                grade: grade,
                status: status,
                fileUrl: fileUrl,
                content: content,
                createdAt: new Date().toLocaleString("ky-KG")
            };

            set(newPostRef, postData).then(() => {
                // Эгер жарыяланган болсо, окуучулар үчүн жалпы базага да көчүрүлөт
                if (status === 'public') {
                    set(ref(db, `public_student_materials/${newPostRef.key}`), postData);
                }
                materialForm.reset();
                alert("Материал ийгиликтүү сакталды!");
            }).catch((err) => {
                alert("Ката кетти: " + err.message);
            });
        });

        // Мугалимдин МЕШИН МАТЕРИАЛДАРЫН жүктөө (Башкаларга көрүнбөйт)
        function loadTeacherMaterials(uid) {
            const loader = document.getElementById('loader');
            const container = document.getElementById('materials-container');
            const teacherRef = ref(db, `kyrgyz_teacher_materials/${uid}`);

            onValue(teacherRef, (snapshot) => {
                loader.style.display = 'none';
                container.innerHTML = '';

                if (!snapshot.exists()) {
                    container.innerHTML = '<div class="empty-msg">Сизде азырынча сакталган материал жок.</div>';
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const item = childSnapshot.val();
                    const card = document.createElement('div');
                    card.className = `item-card ${item.status}`;

                    const statusTag = item.status === 'public' 
                        ? '<span class="status-tag pub"><i class="fas fa-globe"></i> Жарыяланды (Окуучуларга ачык)</span>'
                        : '<span class="status-tag priv"><i class="fas fa-lock"></i> Жабык (Черновик)</span>';

                    const fileHTML = item.fileUrl 
                        ? `<a href="${item.fileUrl}" target="_blank" class="file-link"><i class="fas fa-paperclip"></i> Файлды көрүү / Жүктөө</a>` 
                        : '';

                    card.innerHTML = `
                        <div class="item-header">
                            <h4 class="item-title">${item.title} (${item.grade}-класс)</h4>
                            ${statusTag}
                        </div>
                        ${fileHTML}
                        <div class="item-desc">${item.content}</div>
                        <div class="item-footer">
                            <span><i class="far fa-clock"></i> ${item.createdAt}</span>
                            <button class="btn-delete" onclick="deleteMaterial('${uid}', '${item.id}', '${item.status}')">
                                <i class="fas fa-trash-alt"></i> Өчүрүү
                            </button>
                        </div>
                    `;
                    container.prepend(card);
                });
            });
        }

        // Өчүрүү функциясы
        window.deleteMaterial = function(uid, itemId, status) {
            if (confirm("Бул материалды өчүрүүнү каалайсызбы?")) {
                remove(ref(db, `kyrgyz_teacher_materials/${uid}/${itemId}`));
                if (status === 'public') {
                    remove(ref(db, `public_student_materials/${itemId}`));
                }
            }
        };
    </script>
</body>
</html>
