<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кезмет Порталы - Bilimal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #111622;
            --border-color: #1e2640;
            --accent-green: #10b981;
            --accent-blue: #00d2ff;
            --accent-yellow: #f59e0b;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 550px; width: 100%; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .btn-back { background: var(--border-color); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .user-welcome { background: rgba(0, 210, 255, 0.1); border: 1px solid var(--accent-blue); padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; }
        .user-welcome strong { color: var(--accent-blue); font-size: 15px; }
        .duty-box { background: #0b0e14; border: 1px solid var(--border-color); padding: 18px; border-radius: 12px; margin-bottom: 20px; }
        .duty-title { font-size: 15px; font-weight: bold; color: var(--accent-green); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .duty-list { list-style: none; }
        .duty-item { padding: 10px 0; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .duty-item:last-child { border-bottom: none; }
        .btn-claim { width: 100%; background: var(--accent-green); color: #0b0e14; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
        .btn-claim:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-claim:disabled { background: var(--border-color); color: var(--text-muted); cursor: not-allowed; transform: none; }
        .alert { padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 13px; text-align: center; }
        .alert-success { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <a href="/sections/student-portal.html" class="btn-back"><i class="fas fa-arrow-left"></i> Артка</a>
            <h3 style="color: var(--accent-green); display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-user-shield"></i> Кезмет Порталы
            </h3>
        </div>

        <!-- ОКУУЧУНУН АТЫ ЖӨНҮ -->
        <div class="user-welcome">
            Окуучу: <strong id="studentDisplayName">Жүктөлүүдө...</strong>
            <div style="font-size: 12px; color: var(--text-muted);" id="studentEmailDisplay">--</div>
        </div>

        <!-- БҮГҮНКҮ КЕЗМЕТЧИЛЕР -->
        <div class="duty-box">
            <div class="duty-title">
                <i class="fas fa-calendar-day"></i> Бүгүнкү кезметчилер (<span id="todayDateStr">--</span>):
            </div>
            <div id="dutyListContainer">
                <i class="fas fa-spinner fa-spin"></i> Базадан алынууда...
            </div>
        </div>

        <!-- КЕЗМЕТТИ КАБЫЛ АЛУУ БАСКЫЧЫ -->
        <button class="btn-claim" id="btnClaimDuty">
            <i class="fas fa-check-double"></i> Кезметти кабыл алдым
        </button>

        <div id="msgBox"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, onValue, get, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
        authDomain: "bilimal-org.firebaseapp.com",
        databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "bilimal-org",
        storageBucket: "bilimal-org.firebasestorage.app",
        messagingSenderId: "241750360816",
        appId: "1:241750360816:web:a991434eb5afbc470d7835"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const studentEmail = (localStorage.getItem('bilimal_student_email') || '').trim().toLowerCase();
    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('todayDateStr').innerText = todayStr;
    document.getElementById('studentEmailDisplay').innerText = studentEmail || 'Почта көрсөтүлгөн эмес';

    let currentStudentName = studentEmail.split('@')[0];
    let matchedStudentId = null;

    // 1. БАЗАДАН ОКУУЧУНУН АТЫ-ЖӨНҮН АНУКТОО
    async function loadStudentProfile() {
        if (!studentEmail) {
            document.getElementById('studentDisplayName').innerText = "Белгисиз окуучу";
            return;
        }

        const studentsSnap = await get(ref(database, 'students'));
        if (studentsSnap.exists()) {
            const allStudents = studentsSnap.val();
            for (const [id, sData] of Object.entries(allStudents)) {
                if (sData.email && sData.email.toLowerCase().trim() === studentEmail) {
                    currentStudentName = sData.name || currentStudentName;
                    matchedStudentId = id;
                    break;
                }
            }
        }
        document.getElementById('studentDisplayName').innerText = currentStudentName;
    }

    // 2. БҮГҮНКҮ КЕЗМЕТЧИЛЕРДИ РЕАЛЬНЫЙ УБАКЫТТА АЛУУ (Класс жетекчинин панелинде өзгөрсө дароо чыгат)
    function listenTodayDuty() {
        const dutyRef = ref(database, `duty_schedule/${todayStr}`);
        onValue(dutyRef, (snapshot) => {
            const container = document.getElementById('dutyListContainer');
            if (snapshot.exists()) {
                const data = snapshot.val();
                let html = '<ul class="duty-list">';
                
                // Эгер график массив же объект болсо:
                let list = Array.isArray(data) ? data : Object.values(data);
                if (data.students) list = data.students;

                list.forEach(item => {
                    const name = item.name || item.studentName || item;
                    const status = item.status || 'Дайындалды';
                    const isClaimed = status === 'Кабыл алынды' || status === 'ACCEPTED';

                    html += `
                        <li class="duty-item">
                            <div>
                                <i class="fas fa-user" style="color:var(--accent-blue); margin-right:6px;"></i>
                                <strong>${name}</strong>
                            </div>
                            <span style="font-size:12px; padding:3px 8px; border-radius:6px; background:${isClaimed ? 'rgba(16,185,129,0.2)' : 'rgba(245,158,11,0.2)'}; color:${isClaimed ? 'var(--accent-green)' : 'var(--accent-yellow)'};">
                                ${status}
                            </span>
                        </li>
                    `;
                });
                html += '</ul>';
                container.innerHTML = html;
            } else {
                container.innerHTML = `<p style="color:var(--text-muted); font-size:13px;"><i class="fas fa-info-circle"></i> Бүгүнгө класс жетекчи тарабынан кезметчи дайындала элек.</p>`;
            }
        });
    }

    // 3. КЕЗМЕТТИ КАБЫЛ АЛУУ
    document.getElementById('btnClaimDuty').addEventListener('click', async () => {
        const btn = document.getElementById('btnClaimDuty');
        const msg = document.getElementById('msgBox');
        btn.disabled = true;

        try {
            const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            // Базадагы бүгүнкү кезмет статусун жаңылоо
            const updateData = {};
            updateData[`duty_schedule/${todayStr}/claims/${studentEmail.replace(/[^a-zA-Z0-9]/g, '')}`] = {
                studentName: currentStudentName,
                email: studentEmail,
                claimedAt: nowTime,
                status: 'Кабыл алынды'
            };

            await update(ref(database), updateData);

            msg.innerHTML = `
                <div class="alert alert-success">
                    <i class="fas fa-check-circle"></i> Саат ${nowTime} боюнча кезметти ийгиликтүү кабыл алдыңыз!
                </div>
            `;
        } catch (e) {
            btn.disabled = false;
            alert("Ката чыкты: " + e.message);
        }
    });

    // Ишке киргизүү
    loadStudentProfile();
    listenTodayDuty();
</script>
</body>
</html>
