<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Окуучулардын Дежурствочулук Системасы - Bilimal.org</title>
    
    <!-- CSS Стилдер -->
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-color: #0088cc;
            --accent-hover: #006699;
            --success-color: #10b981;
            --admin-bg: #07131e;
            --admin-border: #0e334a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .header-card h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .header-card p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .student-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .student-item {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .student-item:hover {
            border-color: #374151;
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .student-number {
            background-color: var(--accent-color);
            color: #ffffff;
            font-weight: bold;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .student-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .duty-checkbox-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .duty-checkbox {
            width: 26px;
            height: 26px;
            appearance: none;
            -webkit-appearance: none;
            background-color: transparent;
            border: 2px solid #374151;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            position: relative;
        }

        .duty-checkbox:checked {
            background-color: var(--success-color);
            border-color: var(--success-color);
        }

        .duty-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 16px;
            font-weight: bold;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .duty-checkbox:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Администратор Панели Стилдери */
        .admin-panel {
            background-color: var(--admin-bg);
            border: 1px dashed var(--admin-border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
        }

        .admin-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00aaff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .admin-status {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 6px;
        }

        .admin-empty {
            color: var(--text-secondary);
            font-size: 14px;
            font-style: italic;
        }

        .status-badge {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 10px;
        }

        .status-done {
            background-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        @media (max-width: 600px) {
            .student-item {
                padding: 12px 15px;
            }
            .student-name {
                font-size: 14px;
            }
        }
    </style>

    <!-- Firebase SDK Compat версиялары -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <div class="header-card">
        <h1>Дежурствону Белгилөө Панели</h1>
        <p>Окуучулар өз ысымынын тушундагы белгини белгилеп, дежурствосун тапшыра алышат</p>
    </div>

    <!-- Окуучулардын Тизмеси -->
    <div class="student-list" id="studentListContainer">
        <!-- JS аркылуу динамикалык түрдө толтурулат -->
    </div>

    <!-- Администратор Панели -->
    <div class="admin-panel">
        <div class="admin-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
            Администратор Панели
        </div>
        <div class="admin-status">Окуучулардын кирүү суранычтары:</div>
        <div class="admin-empty" id="adminRequestsContainer">Жаңы кирүү суранычтары жок</div>
    </div>
</div>

<script>
    // 1. Firebase Конфигурациясы
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "bilimal.firebaseapp.com",
        databaseURL: "https://bilimal-default-rtdb.firebaseio.com",
        projectId: "bilimal",
        storageBucket: "bilimal.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Firebase'ти демилгелөө
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const database = firebase.database();
    const auth = firebase.auth();

    // 2. Окуучулардын Сүрөттөгү Тизмеси (27-31 чейин жана кошумчалар)
    const studentsData = [
        { id: 27, name: "Тургунбеков Байэл Эсенбекович" },
        { id: 28, name: "Турдубаева Элиза Нурланбековна" },
        { id: 29, name: "Чолпонкулова Жанайым Сталбековна" },
        { id: 30, name: "Шекербекова Аделина Шайлообековна" },
        { id: 31, name: "Эсенжанова Асема Фархатовна" }
    ];

    // 3. Бүгүнкү датаны YYYY-MM-DD форматында алуу
    function getTodayString() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    const todayDateStr = getTodayString();

    // 4. Тизмени DOM'го чыгаруу
    function renderStudents() {
        const container = document.getElementById('studentListContainer');
        container.innerHTML = '';

        studentsData.forEach(student => {
            const item = document.createElement('div');
            item.className = 'student-item';

            item.innerHTML = `
                <div class="student-info">
                    <div class="student-number">${student.id}</div>
                    <div class="student-name">
                        ${student.name}
                        <span id="status-badge-${student.id}"></span>
                    </div>
                </div>
                <div class="duty-checkbox-wrapper">
                    <input type="checkbox" 
                           class="duty-checkbox" 
                           id="checkbox-${student.id}" 
                           onchange="toggleDuty(${student.id}, this.checked)">
                </div>
            `;
            container.appendChild(item);
        });
    }

    // 5. Firebase Realtime Database менен синхрондоштуруу
    function listenToDutyChanges() {
        const dutyRef = database.ref(`duties/${todayDateStr}`);
        
        dutyRef.on('value', (snapshot) => {
            const data = snapshot.val() || {};

            studentsData.forEach(student => {
                const checkbox = document.getElementById(`checkbox-${student.id}`);
                const badge = document.getElementById(`status-badge-${student.id}`);
                
                if (checkbox) {
                    if (data[student.id] && data[student.id].completed) {
                        checkbox.checked = true;
                        if (badge) {
                            badge.className = 'status-badge status-done';
                            badge.textContent = `Аткарылды (${data[student.id].time || ''})`;
                        }
                    } else {
                        checkbox.checked = false;
                        if (badge) {
                            badge.textContent = '';
                        }
                    }
                }
            });
        });
    }

    // 6. Дежурствону өзгөртүү логикасы
    async function toggleDuty(studentId, isChecked) {
        const currentUser = auth.currentUser;
        
        // Коопсуздук же ырастоо сурамы
        const student = studentsData.find(s => s.id === studentId);
        const confirmMsg = isChecked 
            ? `${student.name} дежурствосун аткарганын ырастайсызбы?`
            : `${student.name} дежурство белгисин алып салууну каалайсызбы?`;

        if (!confirm(confirmMsg)) {
            // Эгер баш тартылса чекбоксту мурунку абалына кайтаруу
            document.getElementById(`checkbox-${studentId}`).checked = !isChecked;
            return;
        }

        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        const dutyPath = `duties/${todayDateStr}/${studentId}`;

        try {
            if (isChecked) {
                await database.ref(dutyPath).set({
                    completed: true,
                    studentName: student.name,
                    time: timeStr,
                    updatedBy: currentUser ? currentUser.uid : 'guest_student',
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            } else {
                await database.ref(dutyPath).remove();
            }
        } catch (error) {
            console.error("Дежурствону сактоодо ката чыкты:", error);
            alert("Ката: Маалымат сакталган жок! Тармак туташуусун текшериңиз.");
            document.getElementById(`checkbox-${studentId}`).checked = !isChecked;
        }
    }

    // 7. Баракча жүктөлгөндө иштетүү
    document.addEventListener('DOMContentLoaded', () => {
        renderStudents();
        listenToDutyChanges();
    });
</script>
</body>
</html>
