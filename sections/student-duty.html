<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="docTitle">Дежурство Порталы - Bilimal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK (v9 Compact) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #111622;
            --border-color: #1e2640;
            --accent-blue: #00d2ff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container { max-width: 850px; width: 100%; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .btn-back:hover { background: rgba(0, 210, 255, 0.1); color: var(--accent-blue); }

        .lang-switcher { display: flex; gap: 6px; }
        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .lang-btn.active { background: var(--accent-blue); color: #000; border-color: var(--accent-blue); }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-title { font-size: 20px; font-weight: bold; color: var(--accent-green); display: flex; align-items: center; gap: 10px; }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pending { background: rgba(245, 158, 11, 0.15); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        .status-approved { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }

        /* Сураныч жөнөтүү жабык блогу */
        .lock-notice {
            text-align: center;
            padding: 20px;
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .lock-notice i { font-size: 40px; color: var(--accent-red); margin-bottom: 10px; }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            background: #0b0e14;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--accent-blue);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: #0b0e14;
            font-size: 15px;
            transition: 0.3s;
        }
        .btn-primary:hover { opacity: 0.9; }

        /* Окуучулардын тизмеси */
        .duty-list { list-style: none; margin-top: 15px; }
        .duty-item {
            background: #0b0e14;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            transition: 0.3s;
        }

        .duty-item.active-today {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.05);
        }

        .duty-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        .student-num {
            width: 32px;
            height: 32px;
            background: rgba(0, 210, 255, 0.1);
            color: var(--accent-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .student-name { font-size: 15px; font-weight: 600; }
        .duty-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .item-actions { display: flex; align-items: center; gap: 10px; }

        .btn-skip {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-yellow);
            border: 1px solid var(--accent-yellow);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-container input { display: none; }
        .checkmark {
            width: 28px;
            height: 28px;
            background: #111622;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .checkbox-container input:checked ~ .checkmark {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }
        .checkmark i { color: #fff; display: none; font-size: 16px; }
        .checkbox-container input:checked ~ .checkmark i { display: block; }

        /* Админ панель */
        .admin-section {
            background: rgba(0, 210, 255, 0.05);
            border: 1px dashed var(--accent-blue);
            border-radius: 16px;
            padding: 20px;
            margin-top: 25px;
        }
        .admin-title { color: var(--accent-blue); font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .req-item {
            background: #111622;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .btn-approve { background: var(--accent-green); color: #fff; }
        .btn-reject { background: var(--accent-red); color: #fff; margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="/sections/student-portal.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> <span data-i18n="backBtn">Артка</span>
        </a>
        <div class="lang-switcher">
            <button class="lang-btn active" onclick="switchLanguage('ky')">KY</button>
            <button class="lang-btn" onclick="switchLanguage('ru')">RU</button>
            <button class="lang-btn" onclick="switchLanguage('en')">EN</button>
        </div>
    </div>

    <!-- 1. СУРАНЫЧ ЖӨНӨТҮҮ БЛОГУ (ЖАБЫК ПОРТАЛ УЧУН) -->
    <div id="registrationBlock" class="card" style="display: none;">
        <div class="lock-notice">
            <i class="fas fa-lock"></i>
            <h3 style="color: #fff; margin-bottom: 6px;" data-i18n="closedTitle">Портал жабык</h3>
            <p style="font-size: 13px; color: var(--text-muted);" data-i18n="closedDesc">
                Кезмет тизмесин көрүү жана белгилөө үчүн мугалимден уруксат алуу керек.
            </p>
        </div>

        <div class="input-group">
            <label data-i18n="selectName">Тизмеден аты-жөнүңүздү тандаңыз:</label>
            <select id="studentSelect">
                <!-- Окуучулар жүктөлөт -->
            </select>
        </div>

        <div class="input-group">
            <label data-i18n="enterEmail">Электрондук почтаңызды (Email) жазыңыз:</label>
            <input type="email" id="studentEmailInput" placeholder="example@gmail.com" required>
        </div>

        <button class="btn-primary" onclick="submitRegistration()" data-i18n="sendReq">Кирүүгө сураныч жөнөтүү</button>
    </div>

    <!-- 2. КҮТҮҮДӨГҮ БИЛДИРҮҮ -->
    <div id="pendingBlock" class="card" style="display: none; text-align: center;">
        <i class="fas fa-clock" style="font-size: 40px; color: var(--accent-yellow); margin-bottom: 10px;"></i>
        <h3 style="margin-bottom: 8px;" data-i18n="waitTitle">Сураныч каралууда</h3>
        <p style="font-size: 14px; color: var(--text-muted);" data-i18n="waitDesc">Мугалим суранычыңызды тастыктагандан кийин дежурство порталы ачылат.</p>
    </div>

    <!-- 3. ДЕЖУРСТВО БАРАКЧАСЫ (УРУКСАТ БЕРИЛГЕНДЕР ҮЧҮН) -->
    <div class="card" id="mainDutyCard" style="display: none;">
        <div class="card-header">
            <div class="card-title"><i class="fas fa-user-shield"></i> <span data-i18n="dutyTitle">Кезмет Порталы</span></div>
            <div id="userStatusBadge" class="status-badge status-approved" data-i18n="statusApproved">Уруксат берилди</div>
        </div>

        <p style="font-size: 14px; color: var(--text-muted);" id="currentDateText"></p>

        <ul class="duty-list" id="dutyListContainer">
            <!-- Бардык окуучулар ушул жерге чыгат -->
        </ul>
    </div>

    <!-- 4. АДМИН ПАНЕЛЬ (Мугалим үчүн гана) -->
    <div class="admin-section" id="adminPanel" style="display: none;">
        <div class="admin-title"><i class="fas fa-user-gear"></i> <span data-i18n="adminTitle">Администратор Панели</span></div>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;" data-i18n="adminDesc">Окуучулардын кирүү суранычтары:</p>
        <div id="requestsList">
            <!-- Күтүүдөгү суранычтар -->
        </div>
    </div>
</div>

<script>
    // 1. АДМИН ПОЧТАСЫ ЖАНА FIREBASE
    const ADMIN_EMAIL = "mirzatestebesov51@gmail.com"; 

    const firebaseConfig = {
        databaseURL: "https://bilimal-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 2. БАЗАЛЫК 31 ОКУУЧУ
    const MASTER_STUDENTS = [
        "Адылбекова Гүлжан Асхатовна",
        "Алымжанова Асия Радылбековна",
        "Анарбаев Адилет Рустемович",
        "Асанбеков Изатбек Алмазович",
        "Аскарова Элмина Расуловна",
        "Байтакова Айбийке Керезбековна",
        "Бактыбекова Бегимай Бактыбековна",
        "Бакытбекова Айпери Батухановна",
        "Джакыпова Азиза Максатовна",
        "Жамгырчиева Шахноза Зарлыковна",
        "Каакыев Барсбек Алтынбекович",
        "Кубаналиева Алия Манасовна",
        "Кудакеева Таттыбүбү Мирболотовна",
        "Кыязбеков Усман Нурсеитович",
        "Лимбекова Акылай Жусупбековна",
        "Максатова Амина Максатовна",
        "Муратбекова Нургиза Таалайбековна",
        "Мүсүрбеков Жаныбек Сыргакович",
        "Нурдоолотов Байэл Аскатович",
        "Нуркулова Арууке Расуловна",
        "Нурханов Мухаммад Нурханович",
        "Оболбекова Айдай Амановна",
        "Өмүрбекова Аяна Умаровна",
        "Раишева Уулкелсин Таалайбековна",
        "Сулпукоров Эмир Даниярович",
        "Таштанбеков Бексултан Бакытович",
        "Тургунбеков Байэл Эсенбекович",
        "Турдубаева Элиза Нурланбековна",
        "Чолпонкулова Жанайым Сталбековна",
        "Шекербекова Аделина Шайлообековна",
        "Эсенжанова Асема Фархатовна"
    ];

    // 3. ТИЛДЕР
    const translations = {
        ky: {
            docTitle: "Кезмет Порталы - Bilimal",
            backBtn: "Артка",
            dutyTitle: "Кезмет порталы",
            closedTitle: "Портал жабык",
            closedDesc: "Кезмет тизмесин көрүү жана белгилөө үчүн мугалимден уруксат алуу керек.",
            selectName: "Тизмеден аты-жөнүңүздү тандаңыз:",
            enterEmail: "Электрондук почтаңызды (Email) жазыңыз:",
            sendReq: "Кирүүгө сураныч жөнөтүү",
            waitTitle: "Сураныч каралууда",
            waitDesc: "Мугалим суранычыңызды тастыктагандан кийин дежурство порталы ачылат.",
            statusApproved: "Уруксат берилди",
            adminTitle: "Администратор Панели",
            adminDesc: "Окуучулардын кирүү суранычтары:",
            markedBy: "Белгиледи:",
            skipBtn: "Келбеди / Жылдыруу",
            todayLabel: "(Бүгүнкү дежур)",
            approveBtn: "Макул",
            rejectBtn: "Каршы"
        },
        ru: {
            docTitle: "Портал Дежурств - Bilimal",
            backBtn: "Назад",
            dutyTitle: "Портал дежурств",
            closedTitle: "Портал закрыт",
            closedDesc: "Для просмотра и отметки списка дежурств необходимо получить разрешение учителя.",
            selectName: "Выберите ваше имя из списка:",
            enterEmail: "Введите вашу электронную почту (Email):",
            sendReq: "Отправить запрос на доступ",
            waitTitle: "Запрос на рассмотрении",
            waitDesc: "Портал дежурств откроется после подтверждения учителем.",
            statusApproved: "Доступ разрешен",
            adminTitle: "Панель Администратора",
            adminDesc: "Запросы учеников на доступ:",
            markedBy: "Отметил:",
            skipBtn: "Отсутствует / Пропустить",
            todayLabel: "(Сегодняшний дежурный)",
            approveBtn: "Одобрить",
            rejectBtn: "Отклонить"
        },
        en: {
            docTitle: "Duty Portal - Bilimal",
            backBtn: "Back",
            dutyTitle: "Duty Portal",
            closedTitle: "Portal Closed",
            closedDesc: "Permission from the teacher is required to view and mark the duty list.",
            selectName: "Select your name from the list:",
            enterEmail: "Enter your email address:",
            sendReq: "Send Access Request",
            waitTitle: "Request Pending",
            waitDesc: "The duty portal will open once approved by the teacher.",
            statusApproved: "Access Granted",
            adminTitle: "Admin Panel",
            adminDesc: "Student access requests:",
            markedBy: "Marked by:",
            skipBtn: "Absent / Skip",
            todayLabel: "(Today's duty)",
            approveBtn: "Approve",
            rejectBtn: "Reject"
        }
    };

    let currentUserEmail = localStorage.getItem('bilimal_student_email') || '';
    let currentLang = localStorage.getItem('site_lang') || 'ky';

    function switchLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('site_lang', lang);
        document.documentElement.lang = lang;

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent.toLowerCase() === lang);
        });

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang] && translations[lang][key]) {
                if (key === 'docTitle') document.title = translations[lang][key];
                else el.textContent = translations[lang][key];
            }
        });
        renderDutyList();
    }

    document.addEventListener('DOMContentLoaded', () => {
        switchLanguage(currentLang);
        setupStudentSelect();
        checkUserAccess();

        const today = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDateText').innerText = today.toLocaleDateString(currentLang === 'ky' ? 'kg-KG' : currentLang, options);

        listenToDutyData();
    });

    function setupStudentSelect() {
        const select = document.getElementById('studentSelect');
        select.innerHTML = '';
        MASTER_STUDENTS.forEach((name, index) => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = `${index + 1}. ${name}`;
            select.appendChild(opt);
        });
    }

    // Кирүү укугун текшерүү
    function checkUserAccess() {
        if (currentUserEmail.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
            document.getElementById('mainDutyCard').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'block';
            loadAdminRequests();
            return;
        }

        if (!currentUserEmail) {
            document.getElementById('registrationBlock').style.display = 'block';
            return;
        }

        db.ref('duty_users').orderByChild('email').equalTo(currentUserEmail).on('value', snapshot => {
            if (snapshot.exists()) {
                const data = Object.values(snapshot.val())[0];
                if (data.status === 'approved') {
                    document.getElementById('mainDutyCard').style.display = 'block';
                    document.getElementById('registrationBlock').style.display = 'none';
                    document.getElementById('pendingBlock').style.display = 'none';
                } else {
                    document.getElementById('pendingBlock').style.display = 'block';
                    document.getElementById('registrationBlock').style.display = 'none';
                }
            } else {
                document.getElementById('registrationBlock').style.display = 'block';
            }
        });
    }

    // Сураныч жөнөтүү
    function submitRegistration() {
        const selectedName = document.getElementById('studentSelect').value;
        const emailInput = document.getElementById('studentEmailInput').value.trim();

        if (!emailInput || !emailInput.includes('@')) {
            alert(currentLang === 'ky' ? 'Туура e-mail дарек жазыңыз!' : 'Введите корректный email!');
            return;
        }

        localStorage.setItem('bilimal_student_email', emailInput);
        currentUserEmail = emailInput;

        db.ref('duty_requests').push({
            name: selectedName,
            email: emailInput,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            alert(currentLang === 'ky' ? 'Сураныч жөнөтүлдү!' : 'Запрос отправлен!');
            checkUserAccess();
        });
    }

    // Админ суранычтарын башкаруу
    function loadAdminRequests() {
        db.ref('duty_requests').on('value', snapshot => {
            const list = document.getElementById('requestsList');
            list.innerHTML = '';
            if (!snapshot.exists()) {
                list.innerHTML = `<p style="font-size: 13px; color: var(--text-muted);">Суранычтар жок</p>`;
                return;
            }

            snapshot.forEach(child => {
                const req = child.val();
                const key = child.key;

                const div = document.createElement('div');
                div.className = 'req-item';
                div.innerHTML = `
                    <div>
                        <strong>${req.name}</strong><br>
                        <small style="color: var(--accent-blue);">${req.email}</small>
                    </div>
                    <div>
                        <button class="btn-action btn-approve" onclick="approveUser('${key}', '${req.name}', '${req.email}')">${translations[currentLang].approveBtn}</button>
                        <button class="btn-action btn-reject" onclick="rejectUser('${key}')">${translations[currentLang].rejectBtn}</button>
                    </div>
                `;
                list.appendChild(div);
            });
        });
    }

    function approveUser(key, name, email) {
        db.ref('duty_users').push({ name, email, status: 'approved' });
        db.ref(`duty_requests/${key}`).remove();
    }

    function rejectUser(key) {
        db.ref(`duty_requests/${key}`).remove();
    }

    // 4. ТИЗМЕНИ ЖАНА "КЕЛБЕДИ/ЖЫЛДЫРУУ" ЛОГИКАСЫН РЕНДЕРДӨӨ
    let currentDutyState = {};

    function listenToDutyData() {
        db.ref('duty_state').on('value', snapshot => {
            currentDutyState = snapshot.val() || {};
            renderDutyList();
        });
    }

    function renderDutyList() {
        const container = document.getElementById('dutyListContainer');
        if (!container) return;
        container.innerHTML = '';

        const todayStr = new Date().toISOString().split('T')[0];
        let activePairIndex = currentDutyState.shift_offset || 0;

        // Бүгүнкү күнү дежур болгон 2 окуучунун индекси
        const activeIdx1 = (activePairIndex * 2) % MASTER_STUDENTS.length;
        const activeIdx2 = (activePairIndex * 2 + 1) % MASTER_STUDENTS.length;

        MASTER_STUDENTS.forEach((name, index) => {
            const isTodayActive = (index === activeIdx1 || index === activeIdx2);
            const isChecked = currentDutyState[todayStr] && currentDutyState[todayStr][index];
            const metaInfo = isChecked ? `${translations[currentLang].markedBy} ${isChecked.by} (${isChecked.time})` : '';

            const li = document.createElement('li');
            li.className = `duty-item ${isTodayActive ? 'active-today' : ''}`;
            
            li.innerHTML = `
                <div class="duty-info">
                    <div class="student-num">${index + 1}</div>
                    <div>
                        <div class="student-name">
                            ${name} 
                            ${isTodayActive ? `<span style="color: var(--accent-green); font-size: 12px; margin-left:6px;">${translations[currentLang].todayLabel}</span>` : ''}
                        </div>
                        <div class="duty-meta">${metaInfo}</div>
                    </div>
                </div>

                <div class="item-actions">
                    ${isTodayActive && !isChecked ? `
                        <button class="btn-skip" onclick="skipDuty('${todayStr}')">${translations[currentLang].skipBtn}</button>
                    ` : ''}

                    <label class="checkbox-container">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleDutyCheck(${index}, this.checked)">
                        <span class="checkmark"><i class="fas fa-check"></i></span>
                    </label>
                </div>
            `;
            container.appendChild(li);
        });
    }

    // Белги коюу
    function toggleDutyCheck(studentId, isChecked) {
        const todayStr = new Date().toISOString().split('T')[0];
        const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        if (isChecked) {
            db.ref(`duty_state/${todayStr}/${studentId}`).set({
                by: currentUserEmail,
                time: nowTime
            });
        } else {
            db.ref(`duty_state/${todayStr}/${studentId}`).remove();
        }
    }

    // Окуучу келбей калганда кийинкилерге жылдыруу баскычы
    function skipDuty(todayStr) {
        let currentOffset = currentDutyState.shift_offset || 0;
        db.ref('duty_state/shift_offset').set(currentOffset + 1).then(() => {
            alert(currentLang === 'ky' ? 'Дежурство кийинки окуучуларга жылдырылды!' : 'Дежурство перенесено на следующих!');
        });
    }
</script>
</body>
</html>
