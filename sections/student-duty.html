<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивдүү Оюн</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .timer-bar {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin: 15px 0;
        }
        .timer-progress {
            height: 100%;
            width: 100%;
            background-color: #28a745;
            transition: width 0.2s linear;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Кирүү экраны -->
    <div id="loginSection">
        <h2>Оюнга кошулуу</h2>
        <input type="text" id="playerName" placeholder="Атыңызды жазыңыз" autocomplete="off">
        <input type="text" id="roomCode" placeholder="Бөлмө коду" autocomplete="off">
        <button id="joinBtn" onclick="joinGame()">Кирүү</button>
    </div>

    <!-- Жүктөлүү экраны (Катууну алдын алуу үчүн) -->
    <div id="loadingSection" class="hidden">
        <div class="loading-spinner"></div>
        <p id="loadingText">Бөлмөгө туташууда, күтө туруңуз...</p>
    </div>

    <!-- Күтүү экраны -->
    <div id="lobbySection" class="hidden">
        <h2>Күтүү бөлмөсү</h2>
        <p>Оюндун башталышын күтүңүз...</p>
        <p>Сиздин атыңыз: <b id="displayName"></b></p>
    </div>

    <!-- Оюн экраны -->
    <div id="gameSection" class="hidden">
        <div class="timer-bar">
            <div id="timerProgress" class="timer-progress"></div>
        </div>
        <h3 id="questionText">Суроо жүктөлүүдө...</h3>
        <div id="optionsContainer"></div>
    </div>
</div>

<script>
    // Firebase Конфигурациясы
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentRoom = null;
    let playerId = null;
    let localTimerInterval = null;
    let lastRenderedState = "";
    let serverTimeOffset = 0;

    // Сервер убактысы менен жергиликтүү убакыттын айырмасын эсептөө
    db.ref(".info/serverTimeOffset").on("value", function(snap) {
        serverTimeOffset = snap.val() || 0;
    });

    function joinGame() {
        const name = document.getElementById('playerName').value.trim();
        const room = document.getElementById('roomCode').value.trim();

        if (!name || !room) {
            alert("Сураныч, атыңызды жана бөлмө кодун толук киргизиңиз!");
            return;
        }

        showSection('loadingSection');
        document.getElementById('joinBtn').disabled = true;

        const roomRef = db.ref('rooms/' + room);

        roomRef.once('value').then((snapshot) => {
            if (!snapshot.exists()) {
                alert("Мындай бөлмө табылган жок!");
                showSection('loginSection');
                document.getElementById('joinBtn').disabled = false;
                return;
            }

            playerId = localStorage.getItem('player_id');
            if (!playerId) {
                playerId = 'player_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('player_id', playerId);
            }

            currentRoom = room;
            document.getElementById('displayName').innerText = name;

            return db.ref(`rooms/${room}/players/${playerId}`).set({
                name: name,
                score: 0,
                joinedAt: firebase.database.ServerValue.TIMESTAMP
            });
        }).then(() => {
            listenToRoomUpdates();
        }).catch((error) => {
            console.error("Туташуу катасы:", error);
            alert("Туташууда ката чыкты. Кайрадан аракет кылыңыз.");
            showSection('loginSection');
            document.getElementById('joinBtn').disabled = false;
        });
    }

    function listenToRoomUpdates() {
        const roomRef = db.ref('rooms/' + currentRoom);

        roomRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Кайра-кайра рендер болуп катуунун алдын алуу
            const currentStateString = JSON.stringify({
                status: data.status,
                question: data.currentQuestion,
                startTime: data.questionStartTime
            });

            if (currentStateString === lastRenderedState) {
                return;
            }
            lastRenderedState = currentStateString;

            handleGameState(data);
        });
    }

    function handleGameState(roomData) {
        const status = roomData.status || 'lobby';

        if (status === 'lobby') {
            showSection('lobbySection');
        } else if (status === 'active') {
            showSection('gameSection');
            renderQuestion(roomData.currentQuestion, roomData.questionDuration || 30, roomData.questionStartTime);
        } else if (status === 'finished') {
            alert('Оюн аяктады!');
            showSection('lobbySection');
        }
    }

    function renderQuestion(question, duration, startTime) {
        if (!question) return;

        document.getElementById('questionText').innerText = question.text || "Суроо";
        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';

        if (question.options && Array.isArray(question.options)) {
            question.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.onclick = () => submitAnswer(index);
                optionsContainer.appendChild(btn);
            });
        }

        syncTimer(duration, startTime);
    }

    function syncTimer(durationInSeconds, startTime) {
        if (localTimerInterval) clearInterval(localTimerInterval);

        const progressBar = document.getElementById('timerProgress');

        function updateProgress() {
            // Сервердеги убакытка тууралоо
            const now = Date.now() + serverTimeOffset;
            const elapsed = startTime ? (now - startTime) / 1000 : 0;
            const remaining = durationInSeconds - elapsed;

            if (remaining <= 0) {
                progressBar.style.width = '0%';
                clearInterval(localTimerInterval);
                disableOptionButtons();
            } else {
                const percentage = (remaining / durationInSeconds) * 100;
                progressBar.style.width = `${Math.max(0, percentage)}%`;
            }
        }

        updateProgress();
        localTimerInterval = setInterval(updateProgress, 100);
    }

    function disableOptionButtons() {
        const buttons = document.querySelectorAll('#optionsContainer button');
        buttons.forEach(btn => btn.disabled = true);
    }

    function submitAnswer(optionIndex) {
        if (!currentRoom || !playerId) return;

        disableOptionButtons();

        db.ref(`rooms/${currentRoom}/answers/${playerId}`).set({
            answer: optionIndex,
            submittedAt: firebase.database.ServerValue.TIMESTAMP
        }).catch((err) => {
            console.error("Жоопту жөнөтүүдө ката:", err);
            const buttons = document.querySelectorAll('#optionsContainer button');
            buttons.forEach(btn => btn.disabled = false);
        });
    }

    function showSection(sectionId) {
        const sections = ['loginSection', 'loadingSection', 'lobbySection', 'gameSection'];
        sections.forEach(id => {
            const el = document.getElementById(id);
            if (id === sectionId) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        });
    }
</script>
</body>
</html>
