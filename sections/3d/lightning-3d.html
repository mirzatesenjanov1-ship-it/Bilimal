        /* ======================================================================
           LOUD & REALISTIC THUNDER SOUND ENGINE (Web Audio API)
           ====================================================================== */
        class RealisticThunderAudio {
            constructor() {
                this.ctx = null;
                this.compressor = null;
                this.master = null;
                this.panner = null;
                this.noise = null;
                this.enabled = true;
            }

            ensure() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AC();

                    // Динамикалык диапазонду чоңойтуп, үн бурмаланбай катуу чыгышы үчүн компрессор
                    this.compressor = this.ctx.createDynamicsCompressor();
                    this.compressor.threshold.setValueAtTime(-10, this.ctx.currentTime);
                    this.compressor.knee.setValueAtTime(18, this.ctx.currentTime);
                    this.compressor.ratio.setValueAtTime(4, this.ctx.currentTime);
                    this.compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
                    this.compressor.release.setValueAtTime(0.25, this.ctx.currentTime);

                    this.master = this.ctx.createGain();
                    this.master.gain.value = this.enabled ? 1.85 : 0.0;

                    this.panner = this.ctx.createStereoPanner();
                    this.panner.pan.value = 0;

                    this.panner.connect(this.compressor);
                    this.compressor.connect(this.master);
                    this.master.connect(this.ctx.destination);

                    const len = this.ctx.sampleRate * 5.0;
                    this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
                    const ch = this.noise.getChannelData(0);
                    let b0 = 0, b1 = 0, b2 = 0;
                    for (let i = 0; i < len; i++) {
                        const w = Math.random() * 2 - 1;
                        b0 = 0.997 * b0 + w * 0.029;
                        b1 = 0.985 * b1 + w * 0.032;
                        b2 = 0.950 * b2 + w * 0.048;
                        ch[i] = (b0 + b1 + b2 + w * 0.18) * 2.2;
                    }
                }
                if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
            }

            setEnabled(v) {
                this.enabled = v;
                if (this.master && this.ctx) {
                    this.master.gain.setTargetAtTime(v ? 1.85 : 0.0, this.ctx.currentTime, 0.03);
                }
            }

            _levelByDistance(m) {
                if (m <= 100) return 1.0;
                if (m <= 500) return 0.92;
                if (m <= 1000) return 0.80;
                if (m <= 2000) return 0.66;
                if (m <= 3000) return 0.54;
                if (m <= 5000) return 0.42;
                return 0.32;
            }

            // Кескин электр чартылдашы (Sharp crack / Snap)
            playElectricCrack(meters, pan = 0.2) {
                if (!this.enabled) return;
                this.ensure();
                const now = this.ctx.currentTime;
                this.panner.pan.setTargetAtTime(pan, now, 0.03);
                const lvl = this._levelByDistance(meters);

                const snap = this.ctx.createBufferSource();
                snap.buffer = this.noise;

                const hp = this.ctx.createBiquadFilter();
                hp.type = 'bandpass';
                hp.frequency.setValueAtTime(meters <= 500 ? 2400 : 1400, now);
                hp.Q.setValueAtTime(1.1, now);

                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.001, now);
                g.gain.linearRampToValueAtTime(Math.min(1.0, lvl * 1.35), now + 0.005);
                g.gain.exponentialRampToValueAtTime(0.001, now + 0.34);

                snap.connect(hp);
                hp.connect(g);
                g.connect(this.panner);
                snap.start(now, Math.random() * 1.5, 0.4);
            }

            // Катуу жана реалисттүү күн күркүрөөсү (Deep Thunder Roll)
            playThunderRoll(meters, pan = 0.2) {
                if (!this.enabled) return;
                this.ensure();
                const now = this.ctx.currentTime;
                this.panner.pan.setTargetAtTime(pan, now, 0.05);
                const lvl = this._levelByDistance(meters);

                const cutoff = meters <= 100 ? 620 : meters <= 500 ? 460 : meters <= 1000 ? 340 :
                               meters <= 2000 ? 250 : meters <= 3000 ? 195 : meters <= 5000 ? 150 : 115;
                const dur = meters <= 500 ? 2.6 : meters <= 2000 ? 3.4 : 4.2;

                // 1) Негизги күркүрөө ызы-чуусу
                const roll = this.ctx.createBufferSource();
                roll.buffer = this.noise;
                roll.loop = true;

                const lp = this.ctx.createBiquadFilter();
                lp.type = 'lowpass';
                lp.frequency.setValueAtTime(cutoff, now);
                lp.frequency.exponentialRampToValueAtTime(Math.max(65, cutoff * 0.4), now + dur);

                const rollGain = this.ctx.createGain();
                rollGain.gain.setValueAtTime(0.001, now);
                rollGain.gain.linearRampToValueAtTime(Math.min(1.0, lvl * 1.25), now + 0.04);
                rollGain.gain.setValueAtTime(Math.min(1.0, lvl * 0.95), now + dur * 0.35);
                rollGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

                // 2) Төмөнкү суб-басс күркүрөө (жерди титиреткен эффект)
                const sub = this.ctx.createOscillator();
                sub.type = 'sawtooth';
                sub.frequency.setValueAtTime(meters <= 500 ? 64 : 48, now);
                sub.frequency.exponentialRampToValueAtTime(24, now + dur * 0.9);

                const subFilter = this.ctx.createBiquadFilter();
                subFilter.type = 'lowpass';
                subFilter.frequency.setValueAtTime(110, now);

                const subGain = this.ctx.createGain();
                subGain.gain.setValueAtTime(0.001, now);
                subGain.gain.linearRampToValueAtTime(Math.min(1.0, lvl * 0.85), now + 0.05);
                subGain.gain.exponentialRampToValueAtTime(0.001, now + dur * 0.92);

                roll.connect(lp);
                lp.connect(rollGain);
                rollGain.connect(this.panner);

                sub.connect(subFilter);
                subFilter.connect(subGain);
                subGain.connect(this.panner);

                roll.start(now, Math.random() * 2.0);
                roll.stop(now + dur + 0.05);

                sub.start(now);
                sub.stop(now + dur + 0.05);
            }
        }

        /* ======================================================================
           REALISTIC 3D LIGHTNING BOLT (Multi-Tube Core, Plasma Glow & Branches)
           ====================================================================== */
        class RealisticLightningBolt {
            constructor(scene) {
                this.scene = scene;
                this.group = new THREE.Group();
                this.scene.add(this.group);

                // 1-этап: Булут ичиндеги заряддар (+ жана -)
                this.charges = new THREE.Group();
                this.group.add(this.charges);
                this._initCharges();

                // 2-этап: Электр талаасынын сызыктары
                this.fieldLines = new THREE.Group();
                this.group.add(this.fieldLines);
                this._initField();

                // 3-этап: Stepped Leader
                this.leaderGroup = new THREE.Group();
                this.group.add(this.leaderGroup);

                // 4-этап: Upward Streamer
                this.streamerGroup = new THREE.Group();
                this.group.add(this.streamerGroup);

                // 5-этап: Контакт жарк этүүсү
                this.flashSphere = new THREE.Mesh(
                    new THREE.SphereGeometry(3.4, 24, 24),
                    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 })
                );
                this.group.add(this.flashSphere);

                // 6-этап: Return Stroke көп катмарлуу реалисттүү плазма каналы
                this.returnGroup = new THREE.Group();
                this.group.add(this.returnGroup);

                // Асман жана жер жарыгы
                this.skyFlash = new THREE.HemisphereLight(0xbbeeff, 0x1e293b, 0.85);
                this.scene.add(this.skyFlash);

                this.boltLight = new THREE.PointLight(0xdbeafe, 0, 220, 1.2);
                this.scene.add(this.boltLight);

                this.points = [];
                this.branches = [];
                this.anchor = new THREE.Vector3(4, 0.2, -2);
            }

            _initCharges() {
                const posGeo = new THREE.SphereGeometry(0.42, 12, 12);
                const posMat = new THREE.MeshBasicMaterial({ color: 0xff5252 });
                const negGeo = new THREE.SphereGeometry(0.42, 12, 12);
                const negMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });

                for (let i = 0; i < 12; i++) {
                    const m = new THREE.Mesh(posGeo, posMat);
                    m.position.set((Math.random() - 0.5) * 18, 22.2 + (Math.random() - 0.5) * 2.0, (Math.random() - 0.5) * 8);
                    this.charges.add(m);
                }
                for (let i = 0; i < 16; i++) {
                    const m = new THREE.Mesh(negGeo, negMat);
                    m.position.set((Math.random() - 0.5) * 18, 18.2 + (Math.random() - 0.5) * 1.6, (Math.random() - 0.5) * 8);
                    this.charges.add(m);
                }
            }

            _initField() {
                const mat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0 });
                for (let i = -3; i <= 3; i++) {
                    const pts = [
                        new THREE.Vector3(i * 2.4, 17.5, 0),
                        new THREE.Vector3(i * 1.7, 9.0, Math.sin(i) * 1.2),
                        new THREE.Vector3(i * 1.1, 0.3, 0)
                    ];
                    this.fieldLines.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat.clone()));
                }
            }

            _clear(grp) {
                while (grp.children.length) {
                    const c = grp.children[0];
                    c.geometry?.dispose();
                    c.material?.dispose();
                    grp.remove(c);
                }
            }

            // Ийри сызык боюнча реалисттүү 3D түтүк (TubeGeometry) түзүүчү жардамчы
            _createBoltTube(pts, radius, colorHex, opacity) {
                const curve = new THREE.CatmullRomCurve3(pts);
                const tubularSegments = Math.max(24, pts.length * 4);
                const geo = new THREE.TubeGeometry(curve, tubularSegments, radius, 8, false);
                const mat = new THREE.MeshBasicMaterial({
                    color: colorHex,
                    transparent: true,
                    opacity
                });
                return new THREE.Mesh(geo, mat);
            }

            generate(target) {
                this.anchor.copy(target);
                this._clear(this.leaderGroup);
                this._clear(this.streamerGroup);
                this._clear(this.returnGroup);
                this.branches = [];

                const start = new THREE.Vector3(
                    target.x + (Math.random() - 0.5) * 3.2,
                    18.2,
                    target.z + (Math.random() - 0.5) * 1.8
                );
                const end = target.clone();
                const steps = 22;
                this.points = [start.clone()];

                for (let i = 1; i < steps; i++) {
                    const t = i / steps;
                    const zig = Math.sin(i * 2.3) * 0.9 + (Math.random() - 0.5) * 1.9;
                    this.points.push(new THREE.Vector3(
                        THREE.MathUtils.lerp(start.x, end.x, t) + zig * (1 - t * 0.2),
                        THREE.MathUtils.lerp(start.y, end.y, t),
                        THREE.MathUtils.lerp(start.z, end.z, t) + (Math.random() - 0.5) * 1.2
                    ));
                }
                this.points.push(end.clone());

                // Бутакталган каналдар
                for (let i = 3; i < steps - 4; i += 3) {
                    const bPts = [this.points[i].clone()];
                    let cur = this.points[i].clone();
                    const dirSign = i % 2 === 0 ? 1 : -1;
                    for (let b = 0; b < 6; b++) {
                        cur = cur.clone().add(new THREE.Vector3(
                            dirSign * (0.5 + Math.random() * 1.4),
                            -1.2 - Math.random() * 0.9,
                            (Math.random() - 0.5) * 1.4
                        ));
                        bPts.push(cur.clone());
                    }
                    this.branches.push(bPts);

                    // Leader бутагы
                    this.leaderGroup.add(new THREE.Line(
                        new THREE.BufferGeometry().setFromPoints(bPts),
                        new THREE.LineBasicMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.85 })
                    ));

                    // Return Stroke бутагы (плазмалык түтүк)
                    const bCore = this._createBoltTube(bPts, 0.045, 0xe0f2fe, 0);
                    const bGlow = this._createBoltTube(bPts, 0.14, 0x38bdf8, 0);
                    this.returnGroup.add(bCore, bGlow);
                }

                // Upward Streamer
                const streamerPts = [
                    end.clone(),
                    end.clone().add(new THREE.Vector3(-0.35, 1.5, 0.2)),
                    end.clone().add(new THREE.Vector3(0.45, 3.2, -0.2))
                ];
                this.streamerGroup.add(this._createBoltTube(streamerPts, 0.06, 0xf472b6, 0));

                // Негизги Return Stroke каналы: өтө жарык ак өзөк + көгүш плазмалык катмар
                const mainCore = this._createBoltTube(this.points, 0.11, 0xffffff, 0);
                const mainInnerGlow = this._createBoltTube(this.points, 0.28, 0x7dd3fc, 0);
                const mainOuterHalo = this._createBoltTube(this.points, 0.56, 0x0284c7, 0);
                this.returnGroup.add(mainCore, mainInnerGlow, mainOuterHalo);

                this.flashSphere.position.copy(end).add(new THREE.Vector3(0, 1.8, 0));
            }

            reset() {
                this.fieldLines.children.forEach((l) => { l.material.opacity = 0; });
                this._clear(this.leaderGroup);
                this._clear(this.streamerGroup);
                this._clear(this.returnGroup);
                this.flashSphere.material.opacity = 0;
                this.boltLight.intensity = 0;
                this.skyFlash.intensity = 0.85;
            }

            update(simTime, realTime) {
                this.charges.children.forEach((c, idx) => {
                    c.position.y += Math.sin(realTime * 3 + idx) * 0.004;
                });

                const fOp = simTime >= 1.0 && simTime < 3.2
                    ? Math.min(0.65, (simTime - 1.0) * 0.65)
                    : Math.max(0, 0.65 - (simTime - 3.2) * 0.8);
                this.fieldLines.children.forEach((l, i) => {
                    l.material.opacity = Math.max(0, fOp * (0.7 + 0.3 * Math.sin(realTime * 8 + i)));
                });

                if (simTime >= 2.0 && this.points.length > 1) {
                    const p = Math.min(1, (simTime - 2.0) / 1.2);
                    const count = Math.max(2, Math.floor(p * this.points.length));
                    const sub = this.points.slice(0, count);
                    let line = this.leaderGroup.getObjectByName('mainLeader');
                    if (!line) {
                        line = new THREE.Line(
                            new THREE.BufferGeometry().setFromPoints(sub),
                            new THREE.LineBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.95 })
                        );
                        line.name = 'mainLeader';
                        this.leaderGroup.add(line);
                    } else {
                        line.geometry.dispose();
                        line.geometry = new THREE.BufferGeometry().setFromPoints(sub);
                    }
                }

                if (this.streamerGroup.children.length && simTime >= 2.8) {
                    const sp = Math.min(1, (simTime - 2.8) / 0.6);
                    const op = simTime < 3.6 ? sp * 0.9 : Math.max(0, (1 - (simTime - 3.6) * 2.5) * 0.9);
                    this.streamerGroup.children.forEach((m) => { m.material.opacity = op; });
                }

                if (simTime >= 3.4 && simTime < 4.1) {
                    const cl = Math.max(0, 1 - Math.abs((simTime - 3.55) / 0.35));
                    this.flashSphere.material.opacity = cl * 0.95;
                    this.flashSphere.scale.setScalar(0.6 + cl * 2.6);
                } else {
                    this.flashSphere.material.opacity = 0;
                }

                if (simTime >= 3.5) {
                    const age = simTime - 3.5;
                    const flicker = 0.82 + 0.18 * Math.sin(age * 55) * Math.cos(age * 90);
                    const fade = Math.max(0, 1 - age * 0.72);
                    const intensity = Math.max(0, Math.min(1, fade * flicker));

                    this.returnGroup.children.forEach((mesh, idx) => {
                        if (idx === this.returnGroup.children.length - 3) {
                            mesh.material.opacity = intensity; // Ак өзөк
                        } else if (idx === this.returnGroup.children.length - 2) {
                            mesh.material.opacity = intensity * 0.65; // Ички көгүш нур
                        } else if (idx === this.returnGroup.children.length - 1) {
                            mesh.material.opacity = intensity * 0.32; // Сырткы ореол
                        } else {
                            mesh.material.opacity = intensity * (idx % 2 === 0 ? 0.8 : 0.35);
                        }
                    });

                    this.boltLight.position.set(this.anchor.x, 11, this.anchor.z);
                    this.boltLight.intensity = intensity * 38;
                    this.skyFlash.intensity = 0.85 + intensity * 3.8;
                } else {
                    this.boltLight.intensity = 0;
                    this.skyFlash.intensity = 0.85;
                }
            }
        }

        /* ======================================================================
           ENVIRONMENT & SUBTLE WAVES (Clouds, Grass, Tree, House, Human)
           ====================================================================== */
        class SceneWorld {
            constructor(scene) {
                this.scene = scene;
                this.clouds = [];
                this.strikePos = new THREE.Vector3(4, 0.2, -2);
                this.humanPos = new THREE.Vector3(-9, 0, 6);

                this._buildGround();
                this._buildClouds();
                this._buildTree();
                this._buildHouse();
                this._buildHuman();
                this._buildWaves();
            }

            _buildGround() {
                const ground = new THREE.Mesh(
                    new THREE.PlaneGeometry(160, 160, 24, 24).rotateX(-Math.PI / 2),
                    new THREE.MeshStandardMaterial({ color: 0x133824, roughness: 0.92 })
                );
                this.scene.add(ground);

                const bladeGeo = new THREE.ConeGeometry(0.08, 0.55, 4).translate(0, 0.27, 0);
                const bladeMat = new THREE.MeshStandardMaterial({ color: 0x226b3a, roughness: 0.8 });
                const inst = new THREE.InstancedMesh(bladeGeo, bladeMat, 360);
                const d = new THREE.Object3D();
                for (let i = 0; i < 360; i++) {
                    d.position.set((Math.random() - 0.5) * 44, 0, (Math.random() - 0.5) * 44);
                    d.rotation.y = Math.random() * Math.PI * 2;
                    const s = 0.7 + Math.random() * 0.9;
                    d.scale.set(s, s, s);
                    d.updateMatrix();
                    inst.setMatrixAt(i, d.matrix);
                }
                this.scene.add(inst);
            }

            _buildClouds() {
                const specs = [
                    { x: -6, y: 20, z: -2, s: 1.15 },
                    { x: 4,  y: 20.5, z: -1, s: 1.25 },
                    { x: 13, y: 19.8, z: -3, s: 1.05 }
                ];
                const puffGeo = new THREE.SphereGeometry(2.6, 16, 14);
                const puffMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.95 });

                specs.forEach((c) => {
                    const grp = new THREE.Group();
                    grp.position.set(c.x, c.y, c.z);
                    grp.scale.setScalar(c.s);
                    [[-2.2, 0, 0, 0.85], [0, 0.6, 0.4, 1.05], [2.2, -0.1, -0.3, 0.9], [-1.0, 1.1, -0.5, 0.75], [1.2, 0.9, 0.5, 0.8]]
                        .forEach(([ox, oy, oz, r]) => {
                            const m = new THREE.Mesh(puffGeo, puffMat);
                            m.position.set(ox, oy, oz);
                            m.scale.setScalar(r);
                            grp.add(m);
                        });
                    this.scene.add(grp);
                    this.clouds.push({ grp, baseX: c.x });
                });
            }

            _buildTree() {
                const tree = new THREE.Group();
                tree.position.set(8.5, 0, 4.5);
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.25, 0.42, 3.2, 8),
                    new THREE.MeshStandardMaterial({ color: 0x4a2e1b, roughness: 0.9 })
                );
                trunk.position.y = 1.6;
                const crown = new THREE.Mesh(
                    new THREE.ConeGeometry(2.1, 4.6, 10),
                    new THREE.MeshStandardMaterial({ color: 0x14532d, roughness: 0.85 })
                );
                crown.position.y = 4.6;
                tree.add(trunk, crown);
                this.scene.add(tree);
            }

            _buildHouse() {
                const house = new THREE.Group();
                house.position.set(-13.5, 0, -5.5);
                const walls = new THREE.Mesh(
                    new THREE.BoxGeometry(4.4, 3.0, 3.8),
                    new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.75 })
                );
                walls.position.y = 1.5;
                const roof = new THREE.Mesh(
                    new THREE.ConeGeometry(3.4, 2.0, 4).rotateY(Math.PI / 4),
                    new THREE.MeshStandardMaterial({ color: 0x7f1d1d, roughness: 0.7 })
                );
                roof.position.y = 4.0;
                house.add(walls, roof);
                this.scene.add(house);
            }

            _buildHuman() {
                const human = new THREE.Group();
                human.position.copy(this.humanPos);
                const torso = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.28, 0.34, 1.05, 10),
                    new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.5 })
                );
                torso.position.y = 1.15;
                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.26, 12, 12),
                    new THREE.MeshStandardMaterial({ color: 0xfde68a, roughness: 0.6 })
                );
                head.position.y = 1.95;
                human.add(torso, head);
                this.scene.add(human);
            }

            _buildWaves() {
                const photonPos = new Float32Array(120 * 3);
                const pGeo = new THREE.BufferGeometry();
                pGeo.setAttribute('position', new THREE.BufferAttribute(photonPos, 3));
                this.photons = new THREE.Points(
                    pGeo,
                    new THREE.PointsMaterial({ color: 0xe0f2fe, size: 0.38, transparent: true, opacity: 0 })
                );
                this.scene.add(this.photons);

                this.lightRing = new THREE.Mesh(
                    new THREE.RingGeometry(0.4, 0.85, 48).rotateX(-Math.PI / 2),
                    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0 })
                );
                this.scene.add(this.lightRing);

                this.soundRings = [0, 1, 2].map(() => {
                    const r = new THREE.Mesh(
                        new THREE.RingGeometry(0.85, 1.05, 48).rotateX(-Math.PI / 2),
                        new THREE.MeshBasicMaterial({ color: 0x93c5fd, side: THREE.DoubleSide, transparent: true, opacity: 0 })
                    );
                    this.scene.add(r);
                    return r;
                });
            }

            resetWaves() {
                this.photons.material.opacity = 0;
                this.lightRing.material.opacity = 0;
                this.lightRing.scale.setScalar(0.1);
                this.soundRings.forEach((r) => { r.material.opacity = 0; r.scale.setScalar(0.1); });
            }

            update(simTime, realTime, soundDelaySec) {
                this.clouds.forEach((c, i) => {
                    c.grp.position.x = c.baseX + Math.sin(realTime * 0.25 + i) * 1.4;
                });

                if (simTime >= 3.5) {
                    const age = simTime - 3.5;

                    // Жарык толкуну жана фотондор (300 000 км/с)
                    const lp = Math.min(1, age * 14);
                    this.lightRing.position.set(this.strikePos.x, 0.25, this.strikePos.z);
                    this.lightRing.scale.setScalar(1 + lp * 24);
                    this.lightRing.material.opacity = Math.max(0, (1 - lp) * 0.85);

                    const attr = this.photons.geometry.getAttribute('position');
                    for (let i = 0; i < attr.count; i++) {
                        const ang = (i / attr.count) * Math.PI * 2 + i * 0.37;
                        const rad = Math.min(26, age * 45 * (0.4 + (i % 7) * 0.12));
                        const y = 0.8 + ((i * 13) % 16) * (0.2 + lp * 0.8);
                        attr.setXYZ(i, this.strikePos.x + Math.cos(ang) * rad, y, this.strikePos.z + Math.sin(ang) * rad);
                    }
                    attr.needsUpdate = true;
                    this.photons.material.opacity = Math.max(0, 1 - age * 1.6);

                    // Үн толкуну (343 м/с) — таза жана реалисттүү кеңейүүчү шакекчелер
                    const rate = Math.max(0.45, 2.6 / Math.max(0.3, soundDelaySec));
                    const rad = Math.max(0.2, age * rate * 6.5);

                    this.soundRings.forEach((r, idx) => {
                        const s = Math.max(0.1, rad - idx * 2.5);
                        r.position.set(this.strikePos.x, 0.3 + idx * 0.12, this.strikePos.z);
                        r.scale.setScalar(s);
                        r.material.opacity = Math.max(0, 0.45 - s * 0.016);
                    });
                } else {
                    this.resetWaves();
                }
            }
        }

        /* ======================================================================
           MAIN APP CONTROLLER
           ====================================================================== */
        class LightningApp {
            constructor() {
                this.lang = 'ky';
                this.distIdx = 2;
                this.speedIdx = 0;
                this.isPlaying = true;
                this.cinema = false;
                this.ytMode = false;
                this.simTime = 0;
                this.realTime = 0;
                this.postStrike = 0;
                this.lastStage = -1;
                this.subtitleTimer = null;

                this.firedCrack = false;
                this.firedLight = false;
                this.firedSound = false;
                this.firedThunder = false;

                this.container = document.getElementById('scene-container');
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x030712);
                this.scene.fog = new THREE.FogExp2(0x050d21, 0.014);

                this.camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 260);
                this.camera.position.set(0, 11, 28);

                const isMob = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                this.renderer = new THREE.WebGLRenderer({ antialias: !isMob, powerPreference: 'high-performance' });
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMob ? 1.5 : 2));
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.container.appendChild(this.renderer.domElement);

                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.maxPolarAngle = Math.PI * 0.485;
                this.controls.minDistance = 8;
                this.controls.maxDistance = 68;
                this.controls.target.set(0, 8, 0);

                const dir = new THREE.DirectionalLight(0xcbd5e1, 1.2);
                dir.position.set(16, 28, 14);
                this.scene.add(dir);

                this.sound = new RealisticThunderAudio();
                this.world = new SceneWorld(this.scene);
                this.bolt = new RealisticLightningBolt(this.scene);
                this.bolt.generate(this.world.strikePos);

                this._bindUI();
                this._bindAutoHideAndKeys();
                this._applyLang();
                this._updateDist();

                this.frames = 0;
                this.fpsTick = performance.now();
                this.prevNow = performance.now();
                requestAnimationFrame((t) => this._loop(t));
            }

            _bindUI() {
                document.querySelectorAll('.lang-btn').forEach((b) => {
                    b.addEventListener('click', () => {
                        document.querySelectorAll('.lang-btn').forEach((x) => x.classList.remove('active'));
                        b.classList.add('active');
                        this.lang = b.dataset.lang;
                        this._applyLang();
                    });
                });

                document.getElementById('playBtn').addEventListener('click', () => {
                    this.sound.ensure();
                    this.isPlaying = true;
                    document.getElementById('playBtn').classList.add('active');
                    document.getElementById('pauseBtn').classList.remove('active');
                });

                document.getElementById('pauseBtn').addEventListener('click', () => {
                    this.isPlaying = false;
                    document.getElementById('pauseBtn').classList.add('active');
                    document.getElementById('playBtn').classList.remove('active');
                });

                document.getElementById('restartBtn').addEventListener('click', () => this._restart());

                document.getElementById('cinemaBtn').addEventListener('click', (e) => {
                    this.cinema = !this.cinema;
                    this.controls.enabled = !this.cinema;
                    e.currentTarget.classList.toggle('active', this.cinema);
                });

                document.getElementById('slowmoBtn').addEventListener('click', (e) => {
                    this.speedIdx = (this.speedIdx + 1) % SLOWMO_SPEEDS.length;
                    document.getElementById('txtSlowmo').textContent = SLOWMO_LABELS[this.speedIdx];
                    e.currentTarget.classList.toggle('active', this.speedIdx > 0);
                });

                document.getElementById('soundBtn').addEventListener('click', (e) => {
                    const next = !this.sound.enabled;
                    this.sound.setEnabled(next);
                    if (next) this.sound.ensure();
                    e.currentTarget.classList.toggle('active', next);
                    e.currentTarget.querySelector('i').className = next ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
                });

                document.getElementById('infoToggleBtn').addEventListener('click', () => {
                    document.getElementById('infoDrawer').classList.toggle('open');
                });

                document.getElementById('distanceSlider').addEventListener('input', (e) => {
                    this.distIdx = Number(e.target.value);
                    this._updateDist();
                });

                document.getElementById('ytModeBtn').addEventListener('click', (e) => {
                    this.ytMode = !this.ytMode;
                    document.body.classList.toggle('youtube-mode', this.ytMode);
                    e.currentTarget.classList.toggle('active', this.ytMode);
                });

                document.getElementById('fullscreenBtn').addEventListener('click', () => {
                    this._togglePresentationFullscreen();
                });

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            _togglePresentationFullscreen() {
                const entering = !document.body.classList.contains('presentation-mode');
                document.body.classList.toggle('presentation-mode', entering);
                if (entering && !document.fullscreenElement) {
                    document.documentElement.requestFullscreen?.().catch(() => {});
                } else if (!entering && document.fullscreenElement) {
                    document.exitFullscreen?.().catch(() => {});
                }
            }

            _bindAutoHideAndKeys() {
                let hideTimer = null;
                const resetHide = () => {
                    document.body.classList.remove('ui-hidden');
                    clearTimeout(hideTimer);
                    hideTimer = setTimeout(() => {
                        if (!document.getElementById('infoDrawer').classList.contains('open')) {
                            document.body.classList.add('ui-hidden');
                        }
                    }, 3000);
                };

                ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach((ev) => {
                    window.addEventListener(ev, resetHide, { passive: true });
                });
                resetHide();

                window.addEventListener('keydown', (e) => {
                    if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') {
                        this._togglePresentationFullscreen();
                    }
                });
            }

            _applyLang() {
                const t = I18N[this.lang];
                document.documentElement.lang = this.lang;
                document.getElementById('eduModeLabel').textContent = t.eduMode;
                document.getElementById('lblStage').textContent = t.stage;
                document.getElementById('lblLight').textContent = t.light;
                document.getElementById('lblSound').textContent = t.sound;
                document.getElementById('lblDist').textContent = t.dist;
                document.getElementById('lblDelay').textContent = t.delay;
                document.getElementById('txtPlay').textContent = t.play;
                document.getElementById('txtPause').textContent = t.pause;
                document.getElementById('txtRestart').textContent = t.restart;
                document.getElementById('txtCinema').textContent = t.cinema;
                document.getElementById('txtSound').textContent = t.soundLbl;

                document.getElementById('safetyMini').innerHTML = t.safety
                    .map((s) => `<div class="${s.ok ? 's-ok' : 's-no'}"><i class="fa-solid ${s.ok ? 'fa-check' : 'fa-xmark'}"></i> ${s.t}</div>`)
                    .join('');

                this._updateDist();
                if (this.lastStage >= 0) {
                    const prev = this.lastStage;
                    this.lastStage = -1;
                    this._setStage(prev);
                }
            }

            _updateDist() {
                const t = I18N[this.lang];
                const d = DISTANCES[this.distIdx];
                const delay = (d.m / SPEED_OF_SOUND).toFixed(2);
                document.getElementById('valDist').textContent = d[this.lang];
                document.getElementById('valDelay').textContent = `${delay} ${t.sec}`;
            }

            _showSubtitle(text) {
                const box = document.getElementById('subtitleBox');
                box.textContent = text;
                box.classList.add('visible');
                clearTimeout(this.subtitleTimer);
                this.subtitleTimer = setTimeout(() => {
                    box.classList.remove('visible');
                }, 2600);
            }

            _setStage(idx) {
                if (idx === this.lastStage) return;
                this.lastStage = idx;
                const t = I18N[this.lang];
                const label = t.stages[idx];
                document.getElementById('stageNumText').textContent = `${idx + 1}/6`;
                document.getElementById('valStage').textContent = `${idx + 1}/6`;
                document.getElementById('slimStageTitle').textContent = label.split(':')[0];
                document.getElementById('slimProgressFill').style.width = `${((idx + 1) / 6) * 100}%`;
                this._showSubtitle(label);
            }

            _restart() {
                this.sound.ensure();
                this.simTime = 0;
                this.postStrike = 0;
                this.lastStage = -1;
                this.firedCrack = false;
                this.firedLight = false;
                this.firedSound = false;
                this.firedThunder = false;
                this.isPlaying = true;
                this.bolt.reset();
                this.bolt.generate(this.world.strikePos);
                this.world.resetWaves();
                document.getElementById('valLight').textContent = '300 000 км/с';
                document.getElementById('valLight').classList.remove('lit');
                document.getElementById('valSound').textContent = '343 м/с';
                document.getElementById('valSound').classList.remove('heard');
            }

            _loop(now) {
                requestAnimationFrame((t) => this._loop(t));

                const rawDt = Math.min(0.05, (now - this.prevNow) / 1000);
                this.prevNow = now;

                this.frames++;
                if (now - this.fpsTick >= 500) {
                    document.getElementById('fpsChip').textContent = `${Math.round((this.frames * 1000) / (now - this.fpsTick))} FPS`;
                    this.frames = 0;
                    this.fpsTick = now;
                }

                const speed = SLOWMO_SPEEDS[this.speedIdx];
                const dt = this.isPlaying ? rawDt * speed : 0;
                this.realTime += rawDt * (this.isPlaying ? 1 : 0.2);

                if (this.isPlaying) {
                    this.simTime += dt;
                    if (this.simTime > 7.5) {
                        this._restart();
                    }
                }

                let stage = 0;
                if (this.simTime < 1.0) stage = 0;
                else if (this.simTime < 2.0) stage = 1;
                else if (this.simTime < 2.8) stage = 2;
                else if (this.simTime < 3.4) stage = 3;
                else if (this.simTime < 3.55) stage = 4;
                else stage = 5;
                this._setStage(stage);

                const meters = DISTANCES[this.distIdx].m;
                const soundDelay = meters / SPEED_OF_SOUND;
                const t = I18N[this.lang];

                if (this.simTime >= 3.5) {
                    if (!this.firedCrack) {
                        this.firedCrack = true;
                        this.sound.playElectricCrack(meters, 0.25);
                    }
                    if (!this.firedLight) {
                        this.firedLight = true;
                        const lEl = document.getElementById('valLight');
                        lEl.textContent = `0.01 ${t.sec} • ${t.lightSeen}`;
                        lEl.classList.add('lit');
                    }

                    this.postStrike += dt;
                    const visDelay = Math.min(soundDelay, 4.2);
                    if (this.postStrike >= visDelay && !this.firedSound) {
                        this.firedSound = true;
                        const sEl = document.getElementById('valSound');
                        sEl.textContent = `${soundDelay.toFixed(2)} ${t.sec} • ${t.soundHeard}`;
                        sEl.classList.add('heard');
                    }
                    if (this.postStrike >= soundDelay && !this.firedThunder) {
                        this.firedThunder = true;
                        this.sound.playThunderRoll(meters, 0.25);
                    }
                }

                this.bolt.update(this.simTime, this.realTime);
                this.world.update(this.simTime, this.realTime, soundDelay);

                if (this.cinema) {
                    const ang = this.realTime * 0.35;
                    const rad = 24 + Math.sin(ang * 0.7) * 5;
                    this.camera.position.set(Math.cos(ang) * rad, 9.5 + Math.sin(ang * 1.3) * 3.5, Math.sin(ang) * rad);
                    this.camera.lookAt(0, 8.5, 0);
                } else {
                    this.controls.update();
                }

                this.renderer.render(this.scene, this.camera);
            }
        }

        window.addEventListener('DOMContentLoaded', () => new LightningApp());
    </script>
</body>
</html>
