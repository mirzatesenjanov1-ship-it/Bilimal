<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сабак пландары жана билим берүү материалдары - BilimAl</title>
  <meta name="description" content="Мугалимдер үчүн даяр сабак пландары, презентациялар жана методикалык колдонмолор.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Иконкалары -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .ad-slot { background: rgba(255, 255, 255, 0.03); border: 1px dashed rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Хедер / Навигация -->
  <header class="glass-card sticky top-0 z-50 px-4 py-3 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="/" class="flex items-center space-x-3">
        <span class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">BilimAl</span>
      </a>
      <div class="flex items-center space-x-4">
        <a href="/sections/teacher-market.html" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2">
          <i class="fa-solid fa-store"></i> Маркет / Жеке кабинет
        </a>
      </div>
    </div>
  </header>

  <!-- Башкы контейнер -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    
    <!-- AdSense үчүн жогорку жарнама блогу -->
    <div class="ad-slot my-4 p-4 text-center text-xs text-slate-400 rounded-xl min-h-[90px] flex items-center justify-center">
      <span><!-- Google AdSense Banner Slot (Top) --> Жарнама орду</span>
    </div>

    <!-- Заголовок жана Фильтрлер -->
    <div class="mb-8">
      <h1 class="text-3xl font-extrabold text-white mb-2">Сабак пландарынын ачык каталог-витринасы</h1>
      <p class="text-slate-400 text-sm">Мугалимдер тарабынан сунушталган эң мыкты сабак конспекттери, презентациялар жана тесттер.</p>
      
      <!-- Издей турган жана Фильтрлей турган блок -->
      <div class="mt-6 flex flex-wrap gap-4">
        <input type="text" id="searchInput" oninput="filterMaterials()" placeholder="Тема же предмет боюнча издөө..." class="bg-slate-800 border border-slate-700 text-white px-4 py-2.5 rounded-xl flex-grow min-w-[250px] focus:outline-none focus:border-purple-500">
        
        <select id="classFilter" onchange="filterMaterials()" class="bg-slate-800 border border-slate-700 text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-purple-500">
          <option value="">Бардык класстар</option>
          <option value="1-4">1-4-класс</option>
          <option value="5-9">5-9-класс</option>
          <option value="10-11">10-11-класс</option>
        </select>

        <select id="typeFilter" onchange="filterMaterials()" class="bg-slate-800 border border-slate-700 text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-purple-500">
          <option value="">Бардык түрлөрү</option>
          <option value="план">Сабак планы</option>
          <option value="презентация">Презентация</option>
          <option value="тест">Тесттик тапшырма</option>
        </select>
      </div>
    </div>

    <!-- Витрина Сеткасы (Карточкалар) -->
    <div id="materialsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
        <p>Маалыматтар жүктөлүүдө...</p>
      </div>
    </div>

    <!-- AdSense үчүн төмөнкү жарнама блогу -->
    <div class="ad-slot my-8 p-4 text-center text-xs text-slate-400 rounded-xl min-h-[90px] flex items-center justify-center">
      <span><!-- Google AdSense Banner Slot (Bottom) --> Жарнама орду</span>
    </div>
  </main>

  <!-- Модальное окно (Толук материалды көрүү жана сатып алуу) -->
  <div id="materialModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4 overflow-y-auto">
    <div class="glass-card max-w-2xl w-full rounded-2xl p-6 relative my-8">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div id="modalContent">
        <!-- JS аркылуу динамикалык толукталат -->
      </div>
    </div>
  </div>

  <!-- Футер -->
  <footer class="glass-card mt-12 py-6 text-center text-xs text-slate-400 border-t border-slate-800">
    <p>© 2026 BilimAl. Бардык укуктар корголгон. | Билим берүү платформасы</p>
  </footer>

  <!-- Firebase жана Логика Скрипти -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Өзүңүздүн Firebase конфигиңизди коюңуз:
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let allMaterials = [];

    // Firebase'ден сабак пландарын жана маркет материалдарын жүктөө
    const marketRef = ref(db, 'market_items');
    onValue(marketRef, (snapshot) => {
      const data = snapshot.val();
      allMaterials = [];
      
      if (data) {
        Object.keys(data).forEach(key => {
          allMaterials.push({ id: key, ...data[key] });
        });
      }
      
      renderMaterials(allMaterials);
    }, (error) => {
      console.error("Каталык:", error);
      document.getElementById('materialsGrid').innerHTML = `
        <div class="col-span-full text-center text-red-400 py-8">
          Маалыматтарды жүктөөдө каталык келип чыкты. Кайра аракет кылыңыз.
        </div>
      `;
    });

    // Карточкаларды экранга чыгаруу Функциясы
    window.renderMaterials = function(items) {
      const grid = document.getElementById('materialsGrid');
      grid.innerHTML = '';

      if (items.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-400">
            <i class="fa-solid fa-folder-open text-4xl mb-3"></i>
            <p>Азырынча эч кандай материал табылган жок.</p>
          </div>
        `;
        return;
      }

      items.forEach(item => {
        const isFree = !item.price || item.price == 0;
        const priceTag = isFree 
          ? `<span class="bg-green-500/20 text-green-400 border border-green-500/30 text-xs px-2.5 py-1 rounded-full font-bold">Акысыз</span>`
          : `<span class="bg-purple-500/20 text-purple-300 border border-purple-500/30 text-xs px-2.5 py-1 rounded-full font-bold">${item.price} сом</span>`;

        const card = `
          <div class="glass-card rounded-2xl p-5 flex flex-col justify-between hover:border-purple-500/50 transition">
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="text-xs text-purple-400 bg-purple-950/60 px-2.5 py-1 rounded-lg border border-purple-800/40">${item.subject || 'Жалпы предмет'}</span>
                ${priceTag}
              </div>
              <h2 class="text-lg font-bold text-white mb-2 line-clamp-2">${item.title || 'Аты көрсөтүлгөн эмес'}</h2>
              
              <!-- AdSense саясаты үчүн пайдалуу текстик сүрөттөмө (Description) -->
              <p class="text-slate-300 text-sm mb-4 line-clamp-3">
                ${item.description || 'Бул сабак материалы окуучуларга жаңы теманы түшүндүрүүдө жана интерактивдүү көнүгүүлөрдү өткөрүүдө колдонулат.'}
              </p>
            </div>

            <div class="pt-4 border-t border-slate-700/50 flex items-center justify-between text-xs text-slate-400">
              <span><i class="fa-regular fa-user mr-1"></i> ${item.authorName || 'Мугалим'}</span>
              <button onclick='openModal(${JSON.stringify(item).replace(/'/g, "&apos;")})' class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg transition font-medium">
                Көрүү <i class="fa-solid fa-chevron-right ml-1"></i>
              </button>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });
    };

    // Модальное окнону ачуу
    window.openModal = function(item) {
      const modal = document.getElementById('materialModal');
      const content = document.getElementById('modalContent');
      
      const isFree = !item.price || item.price == 0;
      
      content.innerHTML = `
        <span class="text-xs text-purple-400 bg-purple-950/60 px-2.5 py-1 rounded-lg border border-purple-800/40">${item.subject || 'Предмет'}</span>
        <h2 class="text-2xl font-bold text-white mt-2 mb-4">${item.title}</h2>
        
        <div class="bg-slate-800/60 p-4 rounded-xl mb-4 border border-slate-700">
          <h3 class="text-sm font-semibold text-slate-300 mb-1">Толук маалымат:</h3>
          <p class="text-slate-300 text-sm whitespace-pre-line">${item.description || 'Маалымат жок.'}</p>
        </div>

        <div class="flex items-center justify-between pt-4 border-t border-slate-700">
          <div>
            <span class="text-xs text-slate-400 block">Баасы:</span>
            <span class="text-xl font-bold text-purple-300">${isFree ? 'Акысыз' : item.price + ' сом'}</span>
          </div>
          
          ${isFree ? `
            <a href="${item.fileUrl || '#'}" target="_blank" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-xl font-semibold transition">
              <i class="fa-solid fa-download mr-1"></i> Юктөө (PDF/DOCX)
            </a>
          ` : `
            <a href="https://wa.me/?text=Саламатсызбы, мен ${encodeURIComponent(item.title)} файлын сатып алайын дедим эле" target="_blank" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-xl font-semibold transition">
              <i class="fa-solid fa-cart-shopping mr-1"></i> Сатып алуу
            </a>
          `}
        </div>
      `;

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };

    window.closeModal = function() {
      const modal = document.getElementById('materialModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };

    // Издөө жана фильтрация логикасы
    window.filterMaterials = function() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = allMaterials.filter(item => {
        const matchesSearch = (item.title && item.title.toLowerCase().includes(search)) ||
                              (item.description && item.description.toLowerCase().includes(search)) ||
                              (item.subject && item.subject.toLowerCase().includes(search));
        return matchesSearch;
      });

      renderMaterials(filtered);
    };
  </script>
</body>
</html>
