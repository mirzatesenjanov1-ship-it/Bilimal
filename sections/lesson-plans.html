<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сабак пландарынын витринасы - BilimAl</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b1329; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(23, 32, 54, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .input-field { background-color: #172036; border: 1px solid #2d3a5a; color: white; transition: all 0.2s; }
    .input-field:focus { border-color: #a855f7; outline: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Хедер -->
  <header class="glass-card sticky top-0 z-50 px-6 py-4 shadow-xl">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="/" class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">BilimAl</a>
      <a href="/sections/teacher-market.html" class="bg-purple-600 hover:bg-purple-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition flex items-center gap-2">
        <i class="fa-solid fa-store"></i> Маркет / Жеке кабинет
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-8">
    <div>
      <h1 class="text-3xl font-extrabold text-white">Мугалимдердин материалдар витринасы</h1>
      <p class="text-slate-400 text-sm mt-1">Керектүү материалдарды тандап, оңой сатып алыңыз.</p>
    </div>

    <!-- Издөө -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <input type="text" id="searchInput" placeholder="Тема же предмет боюнча издөө..." class="input-field px-4 py-3 rounded-xl text-sm md:col-span-2">
      <select id="subjectFilter" class="input-field px-4 py-3 rounded-xl text-sm">
        <option value="all">Бардык предметтер</option>
        <option value="Физика">Физика</option>
        <option value="Математика">Математика</option>
        <option value="Кыргыз тили">Кыргыз тили</option>
        <option value="Англис тили">Англис тили</option>
        <option value="Информатика">Информатика</option>
        <option value="Башка">Башка</option>
      </select>
    </div>

    <!-- Сетка -->
    <div id="materialsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-20 text-slate-400">Жүктөлүүдө...</div>
    </div>
  </main>

  <!-- Төлөм Модалы -->
  <div id="paymentModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card max-w-md w-full rounded-2xl p-6 relative border border-purple-500/40 space-y-4">
      <button id="btnCloseModal" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>

      <h3 class="text-lg font-bold text-white" id="modalTitle">Материалды сатып алуу</h3>
      
      <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 space-y-2 text-sm">
        <div class="flex justify-between"><span class="text-slate-400">Төлөм ыкмасы:</span><span class="text-purple-400 font-semibold">MBank / Элкарт</span></div>
        <div class="flex justify-between border-t border-slate-800 pt-2"><span class="text-slate-400">Баасы:</span><span class="text-green-400 font-bold" id="modalPrice">0 сом</span></div>
      </div>

      <div class="bg-purple-950/30 p-3 rounded-xl text-center space-y-1">
        <p class="text-xs text-slate-300">Төлөм аткаруучу MBank номери:</p>
        <p class="font-mono font-bold text-purple-300 text-lg">+996 706 035 765</p>
      </div>

      <form id="paymentForm" class="space-y-3">
        <div>
          <label class="block text-xs text-slate-300 mb-1">Сиздин телефон номериңиз:</label>
          <input type="tel" id="payerPhone" placeholder="0700123456" required class="input-field w-full px-3 py-2 rounded-xl text-sm">
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1">Транзакция ID (Чек номери):</label>
          <input type="text" id="transactionId" placeholder="Чектеги чек ID" required class="input-field w-full px-3 py-2 rounded-xl text-sm">
        </div>
        <button type="submit" id="btnSubmitPayment" class="w-full bg-purple-600 hover:bg-purple-500 text-white py-2.5 rounded-xl font-bold text-sm transition">
          Төлөдүм / Материалды алуу
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
      authDomain: "bilimal-org.firebaseapp.com",
      databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "bilimal-org"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let allItems = [];
    let selectedItem = null;
    let currentUser = null;

    onAuthStateChanged(auth, user => currentUser = user);

    // Материалдарды базадан жүктөө
    onValue(ref(db, 'market_items'), snapshot => {
      const data = snapshot.val();
      allItems = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
      renderItems(allItems);
    });

    function renderItems(items) {
      const grid = document.getElementById('materialsGrid');
      grid.innerHTML = '';
      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500">Материалдар табылган жок.</div>`;
        return;
      }

      items.forEach(item => {
        const isFree = !item.price || item.price == 0;
        const div = document.createElement('div');
        div.className = "glass-card rounded-2xl p-5 flex flex-col justify-between space-y-4";
        div.innerHTML = `
          <div>
            <div class="flex justify-between items-center text-xs mb-2">
              <span class="bg-purple-900/60 text-purple-300 px-2 py-0.5 rounded">${item.subject || 'Жалпы'}</span>
              <span class="bg-blue-900/60 text-blue-300 px-2 py-0.5 rounded">${item.type || 'Файл'}</span>
            </div>
            <h3 class="text-base font-bold text-white mb-1">${item.title}</h3>
            <p class="text-xs text-slate-400 line-clamp-2">${item.description || ''}</p>
          </div>
          <div class="flex items-center justify-between border-t border-slate-800 pt-3">
            <div>
              <span class="text-[10px] text-slate-500 block">Мугалим: ${item.authorEmail || 'Мугалим'}</span>
              <span class="text-lg font-extrabold ${isFree ? 'text-green-400' : 'text-purple-400'}">${isFree ? 'АКЫСЫЗ' : item.price + ' сом'}</span>
            </div>
            <button onclick="handleAction('${item.id}')" class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-4 py-2 rounded-xl font-bold">
              ${isFree ? 'Алуу' : 'Сатып алуу'}
            </button>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    window.handleAction = async (id) => {
      if (!currentUser) {
        alert('Сатып алуу же көчүрүү үчүн алгач сайтка кириңиз!');
        window.location.href = '/sections/teacher-market.html';
        return;
      }

      const item = allItems.find(i => i.id === id);
      if (!item) return;

      // Акысыз болсо
      if (!item.price || item.price == 0) {
        window.open(item.fileUrl, '_blank');
        return;
      }

      // Сатып алуу статусун 1 жылдык жана 1 жолку көчүрүү эрежеси менен текшерүү
      const purchaseRef = ref(db, `users/${currentUser.uid}/purchases/${id}`);
      const snap = await get(purchaseRef);

      if (snap.exists()) {
        const pData = snap.val();
        const now = Date.now();

        // 1-эреже: 1 жылдан ашып кетсе
        if (pData.expiresAt && now > pData.expiresAt) {
          alert('Бул материалды сатып алганыңызга 1 жылдан ашты. Мөөнөтү бүттү, кайра сатып алышыңыз керек!');
        } 
        // 2-эреже: 1 жолдон ашык көчүрүү аракети болсо
        else if (pData.downloadCount >= 1) {
          alert('Бул материал 1 жолу көчүрүлгөн! Экинчи жолу көчүрүү үчүн кайра төлөөңүз керек.');
        } 
        else {
          // Сатып алынган, мөөнөтү бар, 1-жолу көчүрүлүүдө
          await update(purchaseRef, { downloadCount: (pData.downloadCount || 0) + 1 });
          alert('Шилтеме ачылууда...');
          window.open(item.fileUrl, '_blank');
          return;
        }
      }

      // Жаныдан сатып алуу модалын ачуу
      selectedItem = item;
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalPrice').innerText = item.price + ' сом';
      document.getElementById('paymentModal').classList.remove('hidden');
    };

    document.getElementById('btnCloseModal').onclick = () => document.getElementById('paymentModal').classList.add('hidden');

    // Төлөм тапшыруу жана Балансты бөлүштүрүү (21% Сайт, 79% Мугалим)
    document.getElementById('paymentForm').onsubmit = async (e) => {
      e.preventDefault();
      const phone = document.getElementById('payerPhone').value;
      const txId = document.getElementById('transactionId').value;

      const price = Number(selectedItem.price);
      const siteShare = Math.round(price * 0.21 * 100) / 100; // 21%
      const teacherShare = Math.round((price - siteShare) * 100) / 100; // 79%

      const orderId = 'ORD_' + Date.now();
      const oneYearLater = Date.now() + (365 * 24 * 60 * 60 * 1000); // 1 жыл

      // 1. Заказ жазуу
      await set(ref(db, `applications/${orderId}`), {
        orderId, buyerUid: currentUser.uid, teacherUid: selectedItem.authorUid,
        price, siteShare, teacherShare, txId, phone, productId: selectedItem.id, createdAt: Date.now()
      });

      // 2. Колдонуучунун сатып алуу тарыхына киргизүү
      await set(ref(db, `users/${currentUser.uid}/purchases/${selectedItem.id}`), {
        purchasedAt: Date.now(),
        expiresAt: oneYearLater,
        downloadCount: 1, // Сатып алганда 1-жолку көчүрүү укугу берилет
        fileUrl: selectedItem.fileUrl
      });

      // 3. Мугалимдин балансына акча кошуу
      const teacherBalRef = ref(db, `users/${selectedItem.authorUid}/balance`);
      const teacherSnap = await get(teacherBalRef);
      const currentTeacherBal = teacherSnap.exists() ? Number(teacherSnap.val()) : 0;
      await set(teacherBalRef, currentTeacherBal + teacherShare);

      // 4. Сайттын бизнес эсебине 21% кошуу
      const siteBalRef = ref(db, `platform_balance`);
      const siteSnap = await get(siteBalRef);
      const currentSiteBal = siteSnap.exists() ? Number(siteSnap.val()) : 0;
      await set(siteBalRef, currentSiteBal + siteShare);

      alert('Төлөм катталды! Материал ачылууда...');
      document.getElementById('paymentModal').classList.add('hidden');
      window.open(selectedItem.fileUrl, '_blank');
    };
  </script>
</body>
</html>
