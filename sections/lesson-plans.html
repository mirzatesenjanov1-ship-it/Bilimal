<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ачык сабак пландары - BilimAl.org</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding: 20px; min-height: 100vh; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; border-bottom: 1px solid #1e2640; padding-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        .title { color: #00d2ff; font-size: 24px; display: flex; align-items: center; gap: 10px; }
        .back-btn { background: #1e2640; color: #00d2ff; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; border: 1px solid #00d2ff; }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .plan-card { background: #111622; border: 1px solid #1e2640; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        .plan-card img { width: 100%; height: 160px; object-fit: cover; background: #1e2640; }
        .plan-body { padding: 15px; flex-grow: 1; }
        .plan-title { font-size: 16px; color: #00d2ff; margin-bottom: 8px; }
        .plan-desc { font-size: 13px; color: #aaa; margin-bottom: 12px; line-height: 1.4; }
        .teacher-info { font-size: 11px; color: #7f8c8d; margin-top: 5px; }

        .plan-actions { padding: 12px 15px; background: #0b0e14; border-top: 1px solid #1e2640; display: flex; justify-content: flex-end; }
        .btn-pdf { background: #1abc9c; color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }

        #loader { text-align: center; padding: 40px; color: #00d2ff; font-size: 18px; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title"><i class="fas fa-book-reader"></i> Жарыяланган Сабак Пландары</h1>
        <a href="../dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Башкы баракка</a>
    </div>

    <div id="loader"><i class="fas fa-spinner fa-spin"></i> Материалдар жүктөлүүдө...</div>
    <div class="cards-grid" id="public-plans-container" style="display: none;"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
            authDomain: "bilimal-org.firebaseapp.com",
            databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bilimal-org",
            storageBucket: "bilimal-org.firebasestorage.app",
            messagingSenderId: "241750360816",
            appId: "1:241750360816:web:a991434eb5afbc470d7835"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const loader = document.getElementById('loader');
        const container = document.getElementById('public-plans-container');

        const plansRef = ref(db, 'lesson_plans');
        onValue(plansRef, (snapshot) => {
            loader.style.display = 'none';
            container.style.display = 'grid';
            container.innerHTML = '';

            const data = snapshot.val();
            if (!data) {
                container.innerHTML = '<p style="color: #aaa; grid-column: 1/-1;">Азырынча жарыяланган сабак пландары жок.</p>';
                return;
            }

            let publicCount = 0;
            Object.keys(data).forEach(id => {
                const plan = data[id];
                // Текшерүү: Тек гана status === 'public' болгон материалдар чагылдырылат!
                if (plan.status === 'public') {
                    publicCount++;
                    renderPublicCard(plan);
                }
            });

            if (publicCount === 0) {
                container.innerHTML = '<p style="color: #aaa; grid-column: 1/-1;">Азырынча жарыяланган сабак пландары жок.</p>';
            }
        });

        function renderPublicCard(plan) {
            const card = document.createElement('div');
            card.className = 'plan-card';

            const defaultImg = 'https://via.placeholder.com/400x200/1e2640/00d2ff?text=BilimAl+Lesson+Plan';
            const imageUrl = plan.imageUrl && plan.imageUrl.trim() !== '' ? plan.imageUrl : defaultImg;

            card.innerHTML = `
                <div>
                    <img src="${escapeHtml(imageUrl)}" alt="Plan Cover" onerror="this.src='${defaultImg}'">
                    <div class="plan-body">
                        <h4 class="plan-title">${escapeHtml(plan.title || 'Аталышсыз')}</h4>
                        <p class="plan-desc">${escapeHtml(plan.description || '')}</p>
                        <div class="teacher-info"><i class="fas fa-user-chalkboard"></i> Мугалим: ${escapeHtml(plan.teacherEmail || 'Аноним')}</div>
                    </div>
                </div>
                <div class="plan-actions">
                    ${plan.pdfUrl ? `<a href="${escapeHtml(plan.pdfUrl)}" target="_blank" class="btn-pdf"><i class="fas fa-file-pdf"></i> Документти көрүү / Жүктөө</a>` : '<span style="font-size: 12px; color: #7f8c8d;">Документ жок</span>'}
                </div>
            `;

            container.appendChild(card);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
