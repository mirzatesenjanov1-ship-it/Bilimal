<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ачык Сабак Пландары - Bilimal.org</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- TOP BAR -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40 px-4 py-3">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="/" class="text-xl font-bold text-amber-500 flex items-center gap-2">
        <i class="fa-solid fa-graduation-cap"></i> Bilimal.org
      </a>
      <a href="/sections/lesson-plans-vip.html" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition">
        🔐 VIP Бардык Пландар
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 mt-8">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-white">📚 Ачык Сабак Пландары</h1>
      <p class="text-slate-400 mt-2">Мугалимдер үчүн даярдалган акысыз ачык сабак пландарынын базасы</p>
    </div>

    <!-- SEARCH BAR -->
    <div class="max-w-xl mx-auto mb-8">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="public-search" placeholder="Сабак планын издөө..." 
               class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pl-11 pr-4 text-white focus:outline-none focus:border-amber-500">
      </div>
    </div>

    <!-- PUBLIC PLANS GRID -->
    <div id="public-plans-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-10 text-slate-400">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-amber-500"></i>
        <p class="mt-2">Пландар жүктөлүүдө...</p>
      </div>
    </div>

  </main>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
      authDomain: "bilimal-org.firebaseapp.com",
      databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "bilimal-org",
      storageBucket: "bilimal-org.firebasestorage.app",
      messagingSenderId: "241750360816",
      appId: "1:241750360816:web:a991434eb5afbc470d7835",
      measurementId: "G-9GSQV60QV0"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.database();
    let publicPlans = [];

    async function loadPublicPlans() {
      try {
        const snap = await db.ref('library').once('value');
        const data = snap.val() || {};

        // FILTER: ONLY KEEP isPublic === true
        publicPlans = Object.keys(data)
          .map(id => ({ id, ...data[id] }))
          .filter(plan => plan.isPublic === true);

        renderPublicGrid(publicPlans);
      } catch (err) {
        console.error("Error loading public plans:", err);
      }
    }

    function renderPublicGrid(plans) {
      const container = document.getElementById('public-plans-grid');
      container.innerHTML = '';

      if (plans.length === 0) {
        container.innerHTML = `<p class="col-span-full text-center text-slate-400 py-10">Азырынча ачык жарыяланган сабак пландары жок.</p>`;
        return;
      }

      plans.forEach(plan => {
        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700 p-5 rounded-2xl flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-3">
              <span class="text-xs bg-amber-500/20 text-amber-400 px-2.5 py-0.5 rounded-full font-medium">
                ${plan.subject || 'Предмет'} • ${plan.grade || 'Класс'}
              </span>
              <span class="text-xs text-emerald-400">🌐 Ачык</span>
            </div>
            <h3 class="text-lg font-bold text-white mb-2">${plan.title}</h3>
            <p class="text-xs text-slate-400 line-clamp-3">${plan.goals || ''}</p>
          </div>
          <div class="mt-4 pt-4 border-t border-slate-700/50 flex justify-between items-center">
            <span class="text-xs text-slate-400">Акысыз маалымат</span>
            ${plan.pdfUrl ? `
              <a href="${plan.pdfUrl}" target="_blank" class="text-xs bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-lg hover:bg-amber-600 transition">
                📄 PDF жүктөө
              </a>
            ` : '<span class="text-xs text-slate-500">PDF жок</span>'}
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.getElementById('public-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = publicPlans.filter(p => 
        p.title.toLowerCase().includes(q) || 
        (p.subject && p.subject.toLowerCase().includes(q))
      );
      renderPublicGrid(filtered);
    });

    // Initial Load
    loadPublicPlans();
  </script>
</body>
</html>
