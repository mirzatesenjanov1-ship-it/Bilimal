<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физика Сыйкырдуу Дүйнөсү — Alan Becker Style Simulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #020617; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Start Overlay */
        #startOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(10px);
            transition: opacity 0.5s ease;
        }
        #startOverlay h1 {
            font-size: 3rem; font-weight: 900; background: linear-gradient(45deg, #00f0ff, #a855f7, #ff00ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; text-align: center;
        }
        #startOverlay p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 30px; text-align: center; max-width: 600px; padding: 0 20px; }
        .start-btn {
            background: linear-gradient(135deg, #00f0ff, #3b82f6); color: #000; border: none;
            padding: 16px 40px; font-size: 1.2rem; font-weight: 800; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5); transition: 0.3s transform ease, 0.3s box-shadow ease;
        }
        .start-btn:hover { transform: scale(1.08); box-shadow: 0 0 50px rgba(0, 240, 255, 0.8); }

        /* Canvas */
        canvas { display: block; width: 100%; height: 100%; }

        /* HUD & UI */
        .hud {
            position: absolute; top: 20px; left: 20px; color: #38bdf8;
            font-family: monospace; font-size: 0.95rem; background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.3); padding: 15px 20px; border-radius: 12px;
            backdrop-filter: blur(6px); pointer-events: none; z-index: 10;
        }
        .hud div { margin-bottom: 5px; }
        .hud span { color: #f43f5e; font-weight: bold; }

        .back-btn {
            position: absolute; top: 20px; right: 20px; background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; padding: 10px 20px;
            border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem;
            backdrop-filter: blur(6px); transition: 0.3s; z-index: 10;
        }
        .back-btn:hover { background: #38bdf8; color: #000; box-shadow: 0 0 15px #38bdf8; }
    </style>
</head>
<body>

    <!-- Start Overlay -->
    <div id="startOverlay">
        <h1>⚡ Physics: Alan Becker Style</h1>
        <p>Чычканды жылдырып жарык кыл, тамгаларды (v, a, t) сүйрөп атыңыз (Slingshot) жана физикалык кагылышуулардан ырахат алыңыз!</p>
        <button class="start-btn" onclick="startSimulation()">БАШТОО 🚀</button>
    </div>

    <!-- HUD -->
    <div class="hud" id="hudPanel">
        <div><b>[PHYSICS HUD SIMULATOR]</b></div>
        <div>v (Ылдамдык): <span id="valV">0.00</span> м/с</div>
        <div>a (Тезденүү): <span id="valA">0.00</span> м/с²</div>
        <div>t (Убакыт): <span id="valT">0.00</span> с</div>
    </div>

    <a href="../index.html" class="back-btn">← Башкы бет</a>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Web Audio API сунуштоо
        let audioCtx = null;
        let ambientOsc = null, ambientGain = null;
        let isRunning = false;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // Ambient background hum (55Hz)
            ambientOsc = audioCtx.createOscillator();
            ambientGain = audioCtx.createGain();
            ambientOsc.type = 'sawtooth';
            ambientOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
            ambientGain.gain.setValueAtTime(0.015, audioCtx.currentTime);
            ambientOsc.connect(ambientGain);
            ambientGain.connect(audioCtx.destination);
            ambientOsc.start();
        }

        function playImpactSound(intensity = 1) {
            if (!audioCtx || !isRunning) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                let freq = 80 + Math.random() * 60;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.1);

                gain.gain.setValueAtTime(Math.min(intensity * 0.3, 0.5), audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        function startSimulation() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isRunning = true;
            document.getElementById('startOverlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('startOverlay').style.display = 'none';
            }, 500);
        }

        // Mouse & Flashlight State
        const mouse = { x: width / 2, y: height / 2, tx: width / 2, ty: height / 2, isDown: false, draggedChar: null };

        window.addEventListener('mousemove', e => {
            mouse.tx = e.clientX;
            mouse.ty = e.clientY;
        });

        window.addEventListener('mousedown', e => {
            mouse.isDown = true;
            // Кармалган тамганы табуу
            chars.forEach(c => {
                let dist = Math.hypot(c.x - mouse.x, c.y - mouse.y);
                if (dist < 50) {
                    mouse.draggedChar = c;
                }
            });
        });

        window.addEventListener('mouseup', e => {
            if (mouse.draggedChar && mouse.isDown) {
                // Slingshot release impulse
                let dx = mouse.x - mouse.draggedChar.x;
                let dy = mouse.y - mouse.draggedChar.y;
                mouse.draggedChar.vx = -dx * 0.2;
                mouse.draggedChar.vy = -dy * 0.2;
                
                // Spark particles
                createSparks(mouse.draggedChar.x, mouse.draggedChar.y);
                playImpactSound(1.5);
            }
            mouse.isDown = false;
            mouse.draggedChar = null;
        });

        // Particle System (Sparks)
        let sparks = [];
        function createSparks(x, y) {
            for (let i = 0; i < 25; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 2 + Math.random() * 8;
                sparks.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: 0.02 + Math.random() * 0.03,
                    color: ['#00f0ff', '#ff00ff', '#a855f7', '#f43f5e'][Math.floor(Math.random() * 4)]
                });
            }
        }

        // Characters Class ('v', 'a', 't')
        class PhysicsChar {
            constructor(text, x, y, color) {
                this.text = text;
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.ax = 0;
                this.ay = 0;
                this.radius = 35;
                this.color = color;
                this.trail = [];
                this.shockTimer = 0;
            }

            update() {
                if (mouse.draggedChar === this && mouse.isDown) {
                    // Dragging mechanics
                    this.vx = 0;
                    this.vy = 0;
                    this.x += (mouse.x - this.x) * 0.2;
                    this.y += (mouse.y - this.y) * 0.2;
                    return;
                }

                // Physics movement with damping
                this.vx += this.ax;
                this.vy += this.ay;
                this.vx *= 0.98; // Friction
                this.vy *= 0.98;

                this.x += this.vx;
                this.y += this.vy;

                // Boundary bounce
                if (this.x < this.radius) { this.x = this.radius; this.vx *= -0.8; playImpactSound(Math.abs(this.vx) * 0.1); }
                if (this.x > width - this.radius) { this.x = width - this.radius; this.vx *= -0.8; playImpactSound(Math.abs(this.vx) * 0.1); }
                if (this.y < this.radius) { this.y = this.radius; this.vy *= -0.8; playImpactSound(Math.abs(this.vy) * 0.1); }
                if (this.y > height - this.radius) { this.y = height - this.radius; this.vy *= -0.8; playImpactSound(Math.abs(this.vy) * 0.1); }

                // Motion Trail
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 15) this.trail.shift();

                if (this.shockTimer > 0) this.shockTimer--;
            }

            draw() {
                // Trail
                ctx.beginPath();
                for (let i = 0; i < this.trail.length; i++) {
                    let p = this.trail[i];
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.globalAlpha = 0.3;
                ctx.stroke();
                ctx.globalAlpha = 1.0;

                // Kinetic Stretch & Squash calculation based on velocity
                let speed = Math.hypot(this.vx, this.vy);
                let angle = Math.atan2(this.vy, this.vx);
                let stretchX = 1 + speed * 0.03;
                let stretchY = 1 / stretchX;

                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Shock / Vibration effect if shaken
                if (this.shockTimer > 0) {
                    ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
                }

                ctx.rotate(angle);
                ctx.scale(stretchX, stretchY);

                // Draw glowing aura circle
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Draw Character Text ('v', 'a', 't')
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#020617';
                ctx.font = 'bold 36px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Rotate back text upright
                ctx.rotate(-angle);
                ctx.scale(1/stretchX, 1/stretchY);
                ctx.fillText(this.text, 0, 2);

                ctx.restore();

                // Draw Slingshot elastic band if dragged
                if (mouse.draggedChar === this && mouse.isDown) {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.strokeStyle = '#00f0ff';
                    ctx.lineWidth = 4;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
        }

        const chars = [
            new PhysicsChar('v', width * 0.3, height * 0.5, '#00f0ff'),
            new PhysicsChar('a', width * 0.5, height * 0.5, '#a855f7'),
            new PhysicsChar('t', width * 0.7, height * 0.5, '#ff00ff')
        ];

        // Elastic Collision Resolution between characters
        function resolveCollisions() {
            for (let i = 0; i < chars.length; i++) {
                for (let j = i + 1; j < chars.length; j++) {
                    let c1 = chars[i];
                    let c2 = chars[j];
                    let dx = c2.x - c1.x;
                    let dy = c2.y - c1.y;
                    let dist = Math.hypot(dx, dy);
                    let minDist = c1.radius + c2.radius;

                    if (dist < minDist) {
                        // Overlap correction
                        let overlap = minDist - dist;
                        let nx = dx / dist;
                        let ny = dy / dist;

                        c1.x -= nx * overlap * 0.5;
                        c1.y -= ny * overlap * 0.5;
                        c2.x += nx * overlap * 0.5;
                        c2.y += ny * overlap * 0.5;

                        // Elastic Collision Physics (Impulse)
                        let kx = c1.vx - c2.vx;
                        let ky = c1.vy - c2.vy;
                        let p = 2 * (nx * kx + ny * ky) / 2;

                        c1.vx -= p * nx * 0.9;
                        c1.vy -= p * ny * 0.9;
                        c2.vx += p * nx * 0.9;
                        c2.vy += p * ny * 0.9;

                        c1.shockTimer = 15;
                        c2.shockTimer = 15;
                        playImpactSound(Math.hypot(kx, ky) * 0.15);
                    }
                }
            }
        }

        // Live v(t) Performance Chart Data & History
        let chartHistory = [];
        let simulationTime = 0;

        // Main Animation Loop
        function animate() {
            // Smooth mouse interpolation for flashlight
            mouse.x += (mouse.tx - mouse.x) * 0.1;
            mouse.y += (mouse.ty - mouse.y) * 0.1;

            if (isRunning) {
                simulationTime += 0.016;
            }

            ctx.clearRect(0, 0, width, height);

            // Update and Draw Characters
            chars.forEach(c => {
                c.update();
                c.draw();
            });

            resolveCollisions();

            // Update Sparks
            for (let i = sparks.length - 1; i >= 0; i--) {
                let s = sparks[i];
                s.x += s.vx;
                s.y += s.vy;
                s.life -= s.decay;

                ctx.save();
                ctx.globalAlpha = s.life;
                ctx.fillStyle = s.color;
                ctx.beginPath();
                ctx.arc(s.x, s.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (s.life <= 0) sparks.splice(i, 1);
            }

            // Flashlight Layer (Radial Gradient)
            let grad = ctx.createRadialGradient(mouse.x, mouse.y, 30, mouse.x, mouse.y, 350);
            grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
            grad.addColorStop(1, 'rgba(2, 6, 23, 0.96)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Draw v(t) Chart in Bottom-Right Corner
            let chartX = width - 260;
            let chartY = height - 150;
            let chartW = 230;
            let chartH = 110;

            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.4);';
            ctx.lineWidth = 1;
            ctx.fillRect(chartX, chartY, chartW, chartH);
            ctx.strokeRect(chartX, chartY, chartW, chartH);

            // Chart title & axes
            ctx.fillStyle = '#38bdf8';
            ctx.font = '11px monospace';
            ctx.fillText('v(t) Live Performance Chart', chartX + 10, chartY + 18);

            // Track 'v' character velocity magnitude
            let currentV = Math.hypot(chars[0].vx, chars[0].vy) * 5;
            chartHistory.push(currentV);
            if (chartHistory.length > chartW - 20) chartHistory.shift();

            // Plot line
            ctx.beginPath();
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2;
            for (let i = 0; i < chartHistory.length; i++) {
                let px = chartX + 10 + i;
                let py = (chartY + chartH - 15) - Math.min(chartHistory[i], chartH - 30);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.restore();

            // Update HUD text values
            if (isRunning) {
                document.getElementById('valV').innerText = currentV.toFixed(2);
                document.getElementById('valA').innerText = (Math.hypot(chars[1].vx, chars[1].vy) * 2).toFixed(2);
                document.getElementById('valT').innerText = simulationTime.toFixed(1);
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
