<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аркан Тартыш - Билимал</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #fff;
            overflow: hidden;
        }
        .header-ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .team-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 12px;
            min-width: 140px;
            text-align: center;
        }
        .team-card.left { border-left: 5px solid #3b82f6; }
        .team-card.right { border-right: 5px solid #ef4444; }
        .team-title { font-weight: bold; font-size: 1.1rem; }
        .team-score { font-size: 0.9rem; color: #94a3b8; margin-top: 4px; }
        .top-controls { display: flex; gap: 8px; }
        .btn-ui {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-ui.active { background: #06b6d4; border-color: #0891b2; }
        .btn-ui.exit { background: #f43f5e; border-color: #e11d48; }
        
        #gameCanvas {
            width: 100vw;
            height: 55vh;
            display: block;
        }

        .quiz-container {
            height: 45vh;
            background: #090d16;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            border-top: 2px solid #1e293b;
        }
        .quiz-box {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .quiz-step { font-size: 0.85rem; color: #64748b; margin-bottom: 5px; }
        .quiz-question { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .opt-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .opt-btn:hover { background: #334155; border-color: #475569; }
    </style>
</head>
<body>

    <div class="header-ui">
        <div class="team-card left">
            <div class="team-title" style="color: #60a5fa;">Көк Танк</div>
            <div class="team-score">Упай: <span id="scoreLeft">100</span></div>
        </div>
        <div class="top-controls">
            <button class="btn-ui active">KY</button>
            <button class="btn-ui">RU</button>
            <button class="btn-ui">EN</button>
            <button class="btn-ui exit">Чыгуу</button>
        </div>
        <div class="team-card right">
            <div class="team-title" style="color: #f87171;">Кара Тулпар</div>
            <div class="team-score">Упай: <span id="scoreRight">0</span></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="quiz-container">
        <!-- Сол тараптагы команданын суроосу -->
        <div class="quiz-box">
            <div>
                <div class="quiz-step">Суроо 2/3</div>
                <div class="quiz-question">Тездиктин формуласы кайсы?</div>
            </div>
            <div class="options-grid">
                <button class="opt-btn">E = m * c²</button>
                <button class="opt-btn" onclick="pullRope('left')">v = S / t</button>
                <button class="opt-btn">P = F / S</button>
                <button class="opt-btn">F = m * a</button>
            </div>
        </div>

        <!-- Оң тараптагы команданын суроосу -->
        <div class="quiz-box">
            <div>
                <div class="quiz-step">Суроо 2/3</div>
                <div class="quiz-question">Тездиктин формуласы кайсы?</div>
            </div>
            <div class="options-grid">
                <button class="opt-btn" onclick="pullRope('right')">v = S / t</button>
                <button class="opt-btn">F = m * a</button>
                <button class="opt-btn">E = m * c²</button>
                <button class="opt-btn">P = F / S</button>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let ropePosition = 0; // -100дон +100гө чейин жылат
    let pulseAnim = 0;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.55;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function pullRope(side) {
        if(side === 'left') ropePosition -= 15;
        if(side === 'right') ropePosition += 15;
    }

    // -------------------------------------------------------------
    // ЧЫНЫГЫ ФИЗИКА ЖАНА АНАТОМИЯ МЕНЕН КЫРГЫЗ ЖИГИТИ
    // -------------------------------------------------------------
    function drawKyrgyzPlayerVector(x, groundY, shirtColor, pantsColor, isRightSide, localPulse, ropeY) {
        ctx.save();

        // 1. АРКАН ТАРТУУ ФИЗИКАСЫ (Оордук борбору аркага эңкейет)
        let pullEffort = Math.sin(localPulse * 1.5) * 3;
        let leanAngle = isRightSide ? (0.4 + pullEffort * 0.02) : (-0.4 - pullEffort * 0.02);

        ctx.translate(x, groundY);

        // 2. БУТТАР ЖАНА ТИРЕШҮҮ (Жерге бекем таянган анатомия)
        ctx.strokeStyle = pantsColor;
        ctx.lineWidth = 9;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        let frontFootX = isRightSide ? -22 : 22;
        let frontKneeX = isRightSide ? -12 : 12;
        let frontKneeY = -16;

        ctx.beginPath();
        ctx.moveTo(0, -32); // Бел чекити
        ctx.lineTo(frontKneeX, frontKneeY);
        ctx.lineTo(frontFootX, 0); // Жерге тийген жери
        ctx.stroke();

        let backFootX = isRightSide ? 28 : -28;
        let backKneeX = isRightSide ? 16 : -16;
        let backKneeY = -14;

        ctx.beginPath();
        ctx.moveTo(0, -32);
        ctx.lineTo(backKneeX, backKneeY);
        ctx.lineTo(backFootX, 0);
        ctx.stroke();

        // Бут кийимдер
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.ellipse(frontFootX + (isRightSide ? -3 : 3), -2, 9, 4, 0, 0, Math.PI * 2);
        ctx.ellipse(backFootX + (isRightSide ? 3 : -3), -2, 9, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // 3. ДЕНЕ ЖАНА БАШ (Оордук борборуна жараша ийилүү)
        ctx.translate(0, -32); 
        ctx.rotate(leanAngle);  

        // Торс (Бешшент)
        ctx.fillStyle = shirtColor;
        ctx.beginPath();
        ctx.moveTo(-11, -34);
        ctx.lineTo(11, -34);
        ctx.lineTo(8, 0);
        ctx.lineTo(-8, 0);
        ctx.closePath();
        ctx.fill();

        // Оймо-чийме
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(0, -34);
        ctx.lineTo(0, -5);
        ctx.stroke();

        // Моюн
        ctx.fillStyle = '#e5a872';
        ctx.fillRect(-3, -38, 6, 5);

        // Баш (Жүз)
        ctx.fillStyle = '#f0b37e';
        ctx.beginPath();
        ctx.arc(0, -45, 9.5, 0, Math.PI * 2);
        ctx.fill();

        // Көз Жана Каш
        ctx.fillStyle = '#0f172a';
        let dir = isRightSide ? -1 : 1;
        ctx.fillRect(dir * 3 - 1, -46, 3, 1.5);
        ctx.fillRect(dir * 3 - 2, -49, 4, 1.5);

        // 4. ТАЗА АК КАЛПАК (Салттуу 4 талаалуу нукура калып)
        ctx.save();
        ctx.translate(0, -50);

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.moveTo(-11, 0);
        ctx.lineTo(-12, -8);
        ctx.quadraticCurveTo(-10, -18, 0, -20); 
        ctx.quadraticCurveTo(10, -18, 12, -8);
        ctx.lineTo(11, 0);
        ctx.closePath();
        ctx.fill();

        // Кайырмасы (Кара баркыт)
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(-13, 2);
        ctx.lineTo(-11, -6);
        ctx.quadraticCurveTo(0, -3, 11, -6);
        ctx.lineTo(13, 2);
        ctx.quadraticCurveTo(0, 5, -13, 2);
        ctx.closePath();
        ctx.fill();

        // Талааларынын бириктирүүчү сызыктары
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(0, -4);
        ctx.moveTo(0, -20);
        ctx.lineTo(-7, -5);
        ctx.moveTo(0, -20);
        ctx.lineTo(7, -5);
        ctx.stroke();

        // Чок
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(0, -20, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(dir * 4, -15);
        ctx.stroke();

        ctx.restore(); 

        // 5. КОЛДОР ЖАНА АРКАНДЫ МЫКТЫ КАРМОО
        let localRopeY = (ropeY - (groundY - 32));

        ctx.strokeStyle = shirtColor;
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';

        // Арткы кол
        ctx.beginPath();
        ctx.moveTo(-5, -26);
        ctx.lineTo(dir * -8, localRopeY - 2);
        ctx.lineTo(dir * -14, localRopeY + 12);
        ctx.stroke();

        // Алдыңкы кол
        ctx.strokeStyle = '#f0b37e'; 
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(5, -26);
        ctx.lineTo(dir * 8, localRopeY - 2);
        ctx.lineTo(dir * 14, localRopeY + 12);
        ctx.stroke();

        // Муштумдар
        ctx.fillStyle = '#e5a872';
        ctx.beginPath();
        ctx.arc(dir * -14, localRopeY + 12, 4, 0, Math.PI * 2);
        ctx.arc(dir * 14, localRopeY + 12, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function render() {
        pulseAnim += 0.05;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let w = canvas.width;
        let h = canvas.height;
        let groundY = h * 0.82;
        let ropeY = groundY - 65;

        // 1. АСПАН ЖАНА АЛДЫҢКЫ АЛА-ТОО ФОНУ
        let skyGrad = ctx.createLinearGradient(0, 0, 0, h);
        skyGrad.addColorStop(0, '#7dd3fc');
        skyGrad.addColorStop(1, '#bae6fd');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, h);

        // Карлуу тоолор
        ctx.fillStyle = '#64748b';
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(w * 0.15, h * 0.35);
        ctx.lineTo(w * 0.3, groundY);
        ctx.lineTo(w * 0.5, h * 0.25);
        ctx.lineTo(w * 0.75, groundY);
        ctx.lineTo(w * 0.88, h * 0.3);
        ctx.lineTo(w, groundY);
        ctx.fill();

        // Тоонун карлуу чокулары
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(w * 0.15, h * 0.35);
        ctx.lineTo(w * 0.11, h * 0.44);
        ctx.lineTo(w * 0.19, h * 0.44);
        ctx.closePath();
        ctx.moveTo(w * 0.5, h * 0.25);
        ctx.lineTo(w * 0.44, h * 0.38);
        ctx.lineTo(w * 0.55, h * 0.38);
        ctx.closePath();
        ctx.fill();

        // Жашыл өрөөн (Жер)
        let grassGrad = ctx.createLinearGradient(0, groundY, 0, h);
        grassGrad.addColorStop(0, '#22c55e');
        grassGrad.addColorStop(1, '#15803d');
        ctx.fillStyle = grassGrad;
        ctx.fillRect(0, groundY, w, h - groundY);

        // 2. АРКАН ЖАНА ЖЫЛЫШУУ ФИЗИКАСЫ
        let centerX = w / 2 + ropePosition;

        ctx.strokeStyle = '#b45309';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(centerX - 380, ropeY);
        ctx.lineTo(centerX + 380, ropeY);
        ctx.stroke();

        // Аркандын кызыл белгиси (Центр)
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(centerX - 4, ropeY - 14, 8, 28);

        // 3. КОМАНДАЛАРДЫ ТАРТУУ (Көк Танк - Сол тарап)
        let leftTeamColors = '#2563eb';
        let leftPantsColors = '#1e293b';
        for(let i = 0; i < 3; i++) {
            let px = centerX - 120 - (i * 75);
            drawKyrgyzPlayerVector(px, groundY, leftTeamColors, leftPantsColors, false, pulseAnim + i, ropeY);
            
            // Команда аталышы
            if(i === 0) {
                ctx.fillStyle = '#1d4ed8';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText("Көк Танк", px - 25, ropeY - 100);
            }
        }

        // (Кара Тулпар - Оң тарап)
        let rightTeamColors = '#dc2626';
        let rightPantsColors = '#1e293b';
        for(let i = 0; i < 3; i++) {
            let px = centerX + 120 + (i * 75);
            drawKyrgyzPlayerVector(px, groundY, rightTeamColors, rightPantsColors, true, pulseAnim + i, ropeY);
            
            if(i === 0) {
                ctx.fillStyle = '#b91c1c';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText("Кара Тулпар", px - 35, ropeY - 100);
            }
        }

        requestAnimationFrame(render);
    }

    render();
</script>
</body>
</html>
