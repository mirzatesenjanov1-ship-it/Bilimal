<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аркан Тартыш - Физикалык Оюн</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            color: #fff;
        }

        /* --- SETUP LAYER (ЖӨНГӨ САЛУУЛАР) --- */
        #setup-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            overflow-y: auto;
        }

        .setup-container {
            max-width: 800px;
            width: 100%;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        .lang-switch {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
        }

        .lang-btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .lang-btn.active {
            background: #0284c7;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 14px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .teams-inputs {
            display: flex;
            gap: 15px;
        }

        .teams-inputs .input-group {
            flex: 1;
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-main:hover {
            background: #0369a1;
        }

        .saved-tests {
            margin-top: 15px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            max-height: 100px;
            overflow-y: auto;
        }

        .test-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #1e293b;
        }

        .btn-select {
            background: #16a34a;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-delete {
            background: #dc2626;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* --- GAME UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 10;
        }

        #gameCanvas {
            width: 100%;
            height: 55%;
            display: block;
        }

        .questions-container {
            height: 45%;
            display: flex;
            background: #020617;
            border-top: 2px solid #1e293b;
        }

        .team-side {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .team-side.left {
            border-right: 1px solid #1e293b;
            background: rgba(2, 132, 199, 0.05);
        }

        .team-side.right {
            background: rgba(220, 38, 38, 0.05);
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .team-name {
            font-size: 18px;
            font-weight: bold;
        }

        .left .team-name { color: #38bdf8; }
        .right .team-name { color: #f87171; }

        .score-badge {
            background: #1e293b;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 14px;
        }

        .question-text {
            font-size: 16px;
            margin-bottom: 15px;
            min-height: 48px;
            display: flex;
            align-items: center;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex-grow: 1;
        }

        .answer-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .answer-btn:hover {
            background: #334155;
        }

        .waiting-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #e2e8f0;
            z-index: 5;
        }

        /* --- RESULT MODAL --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid #475569;
        }

        .modal-title {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .modal-desc {
            font-size: 16px;
            margin-bottom: 20px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .top-bar-game {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 20;
            display: flex;
            gap: 10px;
        }

        .ad-container {
            margin-top: 15px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- SETUP LAYER -->
    <div id="setup-layer">
        <div class="setup-container">
            <div class="lang-switch">
                <button class="lang-btn" id="btn-lang-ky">KY</button>
                <button class="lang-btn" id="btn-lang-ru">RU</button>
                <button class="lang-btn" id="btn-lang-en">EN</button>
            </div>

            <h1 id="txt-title">Аркан Тартыш</h1>

            <div class="teams-inputs">
                <div class="input-group">
                    <label id="lbl-left-team">1-Команда (Сол)</label>
                    <input type="text" id="leftTeamInput" value="Көк Танк">
                </div>
                <div class="input-group">
                    <label id="lbl-right-team">2-Команда (Оң)</label>
                    <input type="text" id="rightTeamInput" value="Кара Тулпар">
                </div>
            </div>

            <div class="input-group">
                <label id="lbl-questions">Суроолор жана Жооптор</label>
                <textarea id="questionsTextArea" placeholder="Суроо 1&#10;*Туура жооп&#10;Ката жооп 1&#10;Ката жооп 2&#10;&#10;Суроо 2..."></textarea>
            </div>

            <div class="input-group">
                <label id="lbl-test-name">Тесттин аты (сактоо үчүн)</label>
                <input type="text" id="testNameInput" placeholder="Механика 1-бөлүм">
                <button class="btn-main" id="saveTestBtn" style="background:#16a34a; margin-top:5px;">💾 Сактоо</button>
            </div>

            <div class="saved-tests" id="savedTestsList"></div>

            <button class="btn-main" id="startGameBtn">🚀 Оюнду баштоо</button>

            <!-- Adsterra Native / Banner Ad Block -->
            <div class="ad-container">
                <script type="text/javascript">
                    atOptions = {
                        'key' : 'adsterra_placeholder_key',
                        'format' : 'iframe',
                        'height' : 90,
                        'width' : 728,
                        'params' : {}
                    };
                </script>
                <script type="text/javascript" src="//www.highperformanceformat.com/adsterra_placeholder_key/invoke.js"></script>
            </div>
        </div>
    </div>

    <!-- GAME UI LAYER -->
    <div id="ui-layer">
        <div class="top-bar-game">
            <button class="lang-btn" id="btn-game-lang-ky">KY</button>
            <button class="lang-btn" id="btn-game-lang-ru">RU</button>
            <button class="lang-btn" id="btn-game-lang-en">EN</button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="questions-container">
            <!-- Left Side -->
            <div class="team-side left">
                <div class="team-header">
                    <span class="team-name" id="leftSideName">Команда 1</span>
                    <span class="score-badge">Упай: <span id="leftScoreDisplay">0</span></span>
                </div>
                <div class="score-badge" style="align-self: flex-start; margin-bottom: 5px;" id="leftProgress">Суроо: 0/0</div>
                <div class="question-text" id="leftQuestionText">...</div>
                <div class="answers-grid" id="leftAnswersGrid"></div>
                <div class="waiting-overlay" id="leftWaitingOverlay">
                    <span id="txt-left-waiting">Башка команданы күтүүдө...</span>
                </div>
            </div>

            <!-- Right Side -->
            <div class="team-side right">
                <div class="team-header">
                    <span class="team-name" id="rightSideName">Команда 2</span>
                    <span class="score-badge">Упай: <span id="rightScoreDisplay">0</span></span>
                </div>
                <div class="score-badge" style="align-self: flex-start; margin-bottom: 5px;" id="rightProgress">Суроо: 0/0</div>
                <div class="question-text" id="rightQuestionText">...</div>
                <div class="answers-grid" id="rightAnswersGrid"></div>
                <div class="waiting-overlay" id="rightWaitingOverlay">
                    <span id="txt-right-waiting">Башка команданы күтүүдө...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- RESULT MODAL -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="modal-title" id="resultTitle">🏆 Жеңүүчү!</div>
            <div class="modal-desc" id="resultDesc"></div>
            <button class="btn-main" onclick="location.reload()">🔄 Кайра баштоо</button>
        </div>
    </div>

    <audio id="bgMusic" loop src="https://actions.google.com/sounds/v1/sports/crowd_cheer.ogg"></audio>

    <script>
        // --- ТИЛДЕР ЖАНА КОТОРМОЛОР ---
        const translations = {
            ky: {
                txtTitle: "Аркан Тартыш",
                lblLeftTeam: "1-Команда (Сол)",
                lblRightTeam: "2-Команда (Оң)",
                lblQuestions: "Суроолор жана Жооптор (Формат: Суроо, *Туура жооп, Ката жооптор)",
                lblTestName: "Тесттин аты (сактоо үчүн)",
                btnSave: "💾 Сактоо",
                btnStart: "🚀 Оюнду баштоо",
                btnSelect: "Тандоо",
                defaultLeftName: "Көк Танк",
                defaultRightName: "Кара Тулпар",
                waitingOverlay: "Башка команданы күтүүдө...",
                questionPrefix: "Суроо:",
                alertFillInfo: "Сураныч, тесттин атын жана суроолорду толтуруңуз!",
                alertSavedSuccess: "Тест ийгиликтүү сакталды!",
                alertInvalidFormat: "Суроолордун форматы туура эмес!",
                winTitleSuffix: "жеңишке жетти!",
                winDrawTitle: "ТЕН ЧЫГУУ!",
                winReasonPrefix: "көп туура жооп бергени үчүн жеңди!",
                winDrawText: "Эки команда тең бирдей сандагы суроолорго туура жооп беришти!",
                totalTimeLabel: "Жалпы убакыт:",
                resultsHeader: "Жыйынтыктар:",
                correctAnswersLabel: "туура жооп",
                secLabel: "сек"
            },
            ru: {
                txtTitle: "Перетягивание Каната",
                lblLeftTeam: "1-Команда (Слева)",
                lblRightTeam: "2-Команда (Справа)",
                lblQuestions: "Вопросы и Ответы (Формат: Вопрос, *Правильный ответ, Неправильные ответы)",
                lblTestName: "Название теста (для сохранения)",
                btnSave: "💾 Сохранить",
                btnStart: "🚀 Начать игру",
                btnSelect: "Выбрать",
                defaultLeftName: "Синий Танк",
                defaultRightName: "Черный Тулпар",
                waitingOverlay: "Ожидание другой команды...",
                questionPrefix: "Вопрос:",
                alertFillInfo: "Пожалуйста, заполните название теста и вопросы!",
                alertSavedSuccess: "Тест успешно сохранен!",
                alertInvalidFormat: "Неверный формат вопросов!",
                winTitleSuffix: "победил!",
                winDrawTitle: "НИЧЬЯ!",
                winReasonPrefix: "победил, ответив на большее количество вопросов!",
                winDrawText: "Обе команды ответили правильно на одинаковое количество вопросов!",
                totalTimeLabel: "Общее время:",
                resultsHeader: "Результаты:",
                correctAnswersLabel: "правильных ответов",
                secLabel: "сек"
            },
            en: {
                txtTitle: "Tug of War",
                lblLeftTeam: "Team 1 (Left)",
                lblRightTeam: "Team 2 (Right)",
                lblQuestions: "Questions & Answers (Format: Question, *Correct answer, Wrong answers)",
                lblTestName: "Test Name (for saving)",
                btnSave: "💾 Save",
                btnStart: "🚀 Start Game",
                btnSelect: "Select",
                defaultLeftName: "Blue Tank",
                defaultRightName: "Black Tulpar",
                waitingOverlay: "Waiting for the other team...",
                questionPrefix: "Question:",
                alertFillInfo: "Please fill in the test name and questions!",
                alertSavedSuccess: "Test saved successfully!",
                alertInvalidFormat: "Invalid question format!",
                winTitleSuffix: "won!",
                winDrawTitle: "DRAW!",
                winReasonPrefix: "won by answering more questions correctly!",
                winDrawText: "Both teams answered the same number of questions correctly!",
                totalTimeLabel: "Total Time:",
                resultsHeader: "Results:",
                correctAnswersLabel: "correct answers",
                secLabel: "sec"
            }
        };

        // Баракча ачылганда дефолт катары "ru" ачылат
        let currentLang = localStorage.getItem('arkan_game_lang') || 'ru';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('arkan_game_lang', lang);

            const t = translations[lang];

            document.getElementById('txt-title').innerText = t.txtTitle;
            document.getElementById('lbl-left-team').innerText = t.lblLeftTeam;
            document.getElementById('lbl-right-team').innerText = t.lblRightTeam;
            document.getElementById('lbl-questions').innerText = t.lblQuestions;
            document.getElementById('lbl-test-name').innerText = t.lblTestName;
            document.getElementById('saveTestBtn').innerText = t.btnSave;
            document.getElementById('startGameBtn').innerText = t.btnStart;

            document.getElementById('txt-left-waiting').innerText = t.waitingOverlay;
            document.getElementById('txt-right-waiting').innerText = t.waitingOverlay;

            ['ky', 'ru', 'en'].forEach(l => {
                const b1 = document.getElementById(`btn-lang-${l}`);
                const b2 = document.getElementById(`btn-game-lang-${l}`);
                if (b1) b1.classList.toggle('active', l === lang);
                if (b2) b2.classList.toggle('active', l === lang);
            });

            loadSavedTests();
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgMusic = document.getElementById('bgMusic');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.55;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let leftTeam = { name: "Көк Танк", score: 0, index: 0, correctCount: 0, finished: false };
        let rightTeam = { name: "Кара Тулпар", score: 0, index: 0, correctCount: 0, finished: false };
        let parsedQuestions = [];
        let gameActive = false;
        let startTime = 0;
        let ropeOffset = 0;
        let targetRopeOffset = 0;
        let animationPulse = 0;

        function loadSavedTests() {
            const container = document.getElementById('savedTestsList');
            container.innerHTML = '';
            const saved = JSON.parse(localStorage.getItem('arkan_saved_tests') || '{}');
            const t = translations[currentLang] || translations['ky'];

            Object.keys(saved).forEach(name => {
                const div = document.createElement('div');
                div.className = 'test-item';
                div.innerHTML = `<span>${name}</span><div><button class="btn-select" onclick="selectTest('${name.replace(/'/g, "\\'")}')">${t.btnSelect}</button><button class="btn-delete" onclick="deleteTest('${name.replace(/'/g, "\\'")}')">❌</button></div>`;
                container.appendChild(div);
            });
        }

        window.selectTest = function(name) {
            const saved = JSON.parse(localStorage.getItem('arkan_saved_tests') || '{}');
            if (saved[name]) {
                document.getElementById('questionsTextArea').value = saved[name];
                document.getElementById('testNameInput').value = name;
            }
        };

        window.deleteTest = function(name) {
            const saved = JSON.parse(localStorage.getItem('arkan_saved_tests') || '{}');
            delete saved[name];
            localStorage.setItem('arkan_saved_tests', JSON.stringify(saved));
            loadSavedTests();
        };

        document.getElementById('saveTestBtn').addEventListener('click', () => {
            const t = translations[currentLang] || translations['ky'];
            const name = document.getElementById('testNameInput').value.trim();
            const text = document.getElementById('questionsTextArea').value.trim();
            if (!name || !text) return alert(t.alertFillInfo);
            const saved = JSON.parse(localStorage.getItem('arkan_saved_tests') || '{}');
            saved[name] = text;
            localStorage.setItem('arkan_saved_tests', JSON.stringify(saved));
            loadSavedTests();
            alert(t.alertSavedSuccess);
        });

        function parseQuestions(text) {
            const blocks = text.split(/\n\s*\n/);
            const result = [];
            blocks.forEach(b => {
                const lines = b.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length >= 2) {
                    const q = lines[0];
                    let a = '';
                    const w = [];
                    lines.slice(1).forEach(l => {
                        if (l.startsWith('*')) a = l.substring(1).trim();
                        else w.push(l);
                    });
                    if (!a && w.length > 0) a = w.shift();
                    result.push({ q, a, w });
                }
            });
            return result;
        }

        document.getElementById('startGameBtn').addEventListener('click', () => {
            const t = translations[currentLang] || translations['ky'];
            const text = document.getElementById('questionsTextArea').value.trim();
            parsedQuestions = parseQuestions(text);
            if (parsedQuestions.length === 0) return alert(t.alertInvalidFormat);

            leftTeam.name = document.getElementById('leftTeamInput').value.trim() || t.defaultLeftName;
            rightTeam.name = document.getElementById('rightTeamInput').value.trim() || t.defaultRightName;

            document.getElementById('leftSideName').innerText = leftTeam.name;
            document.getElementById('rightSideName').innerText = rightTeam.name;

            document.getElementById('setup-layer').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'block';

            try { 
                bgMusic.currentTime = 0;
                bgMusic.play(); 
            } catch(e){}

            gameActive = true;
            startTime = performance.now();
            leftTeam.index = 0; leftTeam.score = 0; leftTeam.correctCount = 0; leftTeam.finished = false;
            rightTeam.index = 0; rightTeam.score = 0; rightTeam.correctCount = 0; rightTeam.finished = false;
            ropeOffset = 0; targetRopeOffset = 0; animationPulse = 0;

            renderSide('left');
            renderSide('right');
            requestAnimationFrame(drawGame);
        });

        function renderSide(side) {
            const team = (side === 'left') ? leftTeam : rightTeam;
            const progressEl = document.getElementById(`${side}Progress`);
            const questionEl = document.getElementById(`${side}QuestionText`);
            const gridEl = document.getElementById(`${side}AnswersGrid`);
            const t = translations[currentLang] || translations['ky'];

            if (team.index >= parsedQuestions.length) {
                team.finished = true;
                document.getElementById(`${side}WaitingOverlay`).style.display = 'flex';
                checkGameCompletion();
                return;
            }

            progressEl.innerText = `${t.questionPrefix} ${team.index + 1}/${parsedQuestions.length}`;
            const currentQuiz = parsedQuestions[team.index];
            questionEl.innerText = currentQuiz.q;
            gridEl.innerHTML = '';

            const shuffledAnswers = [currentQuiz.a, ...currentQuiz.w].sort(() => Math.random() - 0.5);
            shuffledAnswers.forEach(ans => {
                const button = document.createElement('button');
                button.className = 'answer-btn';
                button.innerText = ans;
                button.onclick = () => handleSelection(side, ans, currentQuiz.a);
                gridEl.appendChild(button);
            });
        }

        function handleSelection(side, selectedAnswer, correctAnswer) {
            if (!gameActive) return;
            const team = (side === 'left') ? leftTeam : rightTeam;

            if (selectedAnswer === correctAnswer) {
                team.score += 100;
                team.correctCount++;
                targetRopeOffset += (side === 'left') ? -65 : 65;
            } else {
                targetRopeOffset += (side === 'left') ? 35 : -35;
            }

            document.getElementById(`${side}ScoreDisplay`).innerText = team.score;
            team.index++;
            renderSide(side);
        }

        function checkGameCompletion() {
            if (leftTeam.finished && rightTeam.finished && gameActive) {
                gameActive = false;
                try { bgMusic.pause(); } catch(e){}

                const t = translations[currentLang] || translations['ky'];
                const modal = document.getElementById('resultModal');
                const title = document.getElementById('resultTitle');
                const desc = document.getElementById('resultDesc');

                const totalDuration = ((performance.now() - startTime) / 1000).toFixed(2);
                let winnerName = "";
                let winReason = "";

                if (leftTeam.correctCount > rightTeam.correctCount) {
                    winnerName = leftTeam.name;
                    title.style.color = "#00f0ff";
                    winReason = `🏆 <b>${leftTeam.name}</b> ${t.winReasonPrefix}`;
                } else if (rightTeam.correctCount > leftTeam.correctCount) {
                    winnerName = rightTeam.name;
                    title.style.color = "#ff0055";
                    winReason = `🏆 <b>${rightTeam.name}</b> ${t.winReasonPrefix}`;
                } else {
                    winReason = t.winDrawText;
                    title.style.color = "#fff";
                }

                title.innerHTML = winnerName ? `🏆 ${winnerName} ${t.winTitleSuffix}` : t.winDrawTitle;
                desc.innerHTML = `
                    ${winReason}<br><br>
                    ⏱️ ${t.totalTimeLabel} <b>${totalDuration} ${t.secLabel}</b><br><br>
                    📊 <b>${t.resultsHeader}</b><br>
                    • ${leftTeam.name}: ${leftTeam.correctCount} ${t.correctAnswersLabel}<br>
                    • ${rightTeam.name}: ${rightTeam.correctCount} ${t.correctAnswersLabel}
                `;
                modal.style.display = 'flex';
            }
        }

        // --- ДҮЙНӨНҮ ЖАНА КААРМАНДАРДЫ ТАРТУУ ---
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. АСМАН
            let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#7dd3fc');
            skyGradient.addColorStop(0.5, '#bae6fd');
            skyGradient.addColorStop(1, '#e0f2fe');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. АЛА-ТОО ЧОКУЛАРЫ
            drawKyrgyzMountains();

            // 3. ЖАЙЛОО (Чөп)
            const centerY = canvas.height * 0.72;
            let groundGradient = ctx.createLinearGradient(0, centerY, 0, canvas.height);
            groundGradient.addColorStop(0, '#4ade80');
            groundGradient.addColorStop(1, '#15803d');
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, centerY, canvas.width, canvas.height - centerY);

            ctx.strokeStyle = '#166534';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(canvas.width, centerY);
            ctx.stroke();

            const centerX = canvas.width / 2 + ropeOffset;
            const playerCount = Math.max(1, parsedQuestions.length);

            animationPulse += 0.08;

            // АРКАНДЫН БИЙИКТИГИ (КОЛДОР ДАЛ УШУЛ ДЕҢГЭЭЛДЕ КАРМАЙТ)
            const ropeY = centerY - 35;

            // 4. ТЕКСТУРАЛУУ РЕАЛДУУ АРКАН
            ctx.save();
            ctx.strokeStyle = '#854d0e'; // Аркандын негизги сары-күрөң түсү
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, ropeY);
            ctx.lineTo(canvas.width, ropeY);
            ctx.stroke();

            // Аркандын өрүлгөн оймолору
            ctx.strokeStyle = '#a16207';
            ctx.lineWidth = 4;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(0, ropeY - 1);
            ctx.lineTo(canvas.width, ropeY - 1);
            ctx.stroke();
            ctx.restore();

            // 5. ОРТОДОГУ КЫЗЫЛ ЛЕНТА (Белги)
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.fillRect(centerX - 4, ropeY - 12, 8, 24);

            let spacing = (playerCount > 5) ? Math.max(50, 320 / playerCount) : 75;

            // Командаларды тартуу
            drawTeam(canvas.width * 0.35 + ropeOffset, centerY, shirtColor='#0284c7', '#1e293b', leftTeam.name, false, animationPulse, playerCount, spacing, ropeY);
            drawTeam(canvas.width * 0.65 + ropeOffset, centerY, shirtColor='#dc2626', '#1e293b', rightTeam.name, true, animationPulse, playerCount, spacing, ropeY);

            ropeOffset += (targetRopeOffset - ropeOffset) * 0.05;

            if (gameActive) requestAnimationFrame(drawGame);
        }

        function drawKyrgyzMountains() {
            const h = canvas.height;
            const w = canvas.width;

            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.moveTo(0, h * 0.72);
            ctx.lineTo(w * 0.15, h * 0.3);
            ctx.lineTo(w * 0.35, h * 0.65);
            ctx.lineTo(w * 0.55, h * 0.25);
            ctx.lineTo(w * 0.78, h * 0.6);
            ctx.lineTo(w, h * 0.2);
            ctx.lineTo(w, h * 0.72);
            ctx.fill();

            drawMountainPeak(w * 0.25, h * 0.18, w * 0.3, h * 0.72, '#64748b', '#f8fafc');
            drawMountainPeak(w * 0.7, h * 0.15, w * 0.35, h * 0.72, '#475569', '#ffffff');
            drawMountainPeak(w * 0.05, h * 0.28, w * 0.25, h * 0.72, '#475569', '#f1f5f9');
        }

        function drawMountainPeak(peakX, peakY, baseWidth, baseY, rockColor, snowColor) {
            ctx.fillStyle = rockColor;
            ctx.beginPath();
            ctx.moveTo(peakX - baseWidth / 2, baseY);
            ctx.lineTo(peakX, peakY);
            ctx.lineTo(peakX + baseWidth / 2, baseY);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = snowColor;
            ctx.beginPath();
            ctx.moveTo(peakX, peakY);
            ctx.lineTo(peakX - baseWidth * 0.15, peakY + (baseY - peakY) * 0.3);
            ctx.lineTo(peakX - baseWidth * 0.08, peakY + (baseY - peakY) * 0.25);
            ctx.lineTo(peakX, peakY + (baseY - peakY) * 0.35);
            ctx.lineTo(peakX + baseWidth * 0.08, peakY + (baseY - peakY) * 0.24);
            ctx.lineTo(peakX + baseWidth * 0.15, peakY + (baseY - peakY) * 0.32);
            ctx.closePath();
            ctx.fill();
        }

        function drawTeam(startX, centerY, shirtColor, pantsColor, teamName, isRightSide, pulse, count, spacing, ropeY) {
            ctx.fillStyle = shirtColor;
            ctx.font = "bold 16px 'Segoe UI', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(teamName, startX + (isRightSide ? 80 : -80), centerY - 120);

            for (let i = 0; i < count; i++) {
                let distance = isRightSide ? (i * spacing) : -(i * spacing);
                let x = startX + distance;

                drawKyrgyzPlayerVector(x, centerY, shirtColor, pantsColor, isRightSide, pulse + i, ropeY);
            }
        }

        // --- ТОЛУК ОҢДОЛГОН АДАМДАРДЫ ЖАНА АРКАН КАРМАГАН ПОЗАЛАРДЫ ТАРТУУ ---
        function drawKyrgyzPlayerVector(x, groundY, shirtColor, pantsColor, isRightSide, localPulse, ropeY) {
            ctx.save();

            // Аркан тарткандагы чайпалуу анимациясы
            let pullEffort = Math.sin(localPulse * 1.5) * 2;
            let leanAngle = isRightSide ? (0.35 + pullEffort * 0.02) : (-0.35 - pullEffort * 0.02);

            // Каармандын негизги таяныч чекити - анын буту тийген жер
            ctx.translate(x, groundY);

            // 1. БУТТАР (Жерге бекем кадалган)
            ctx.strokeStyle = pantsColor;
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Арткы бут (Артка созулуп бүгүлгөн)
            let backFootX = isRightSide ? 30 : -30;
            let backKneeX = isRightSide ? 18 : -18;
            let backKneeY = -18;

            ctx.beginPath();
            ctx.moveTo(0, -32); // Дененин белинен чыгарылат
            ctx.lineTo(backKneeX, backKneeY);
            ctx.lineTo(backFootX, 0); // Жерге тийет
            ctx.stroke();

            // Алдыңкы бут (Түз тирелип турган)
            let frontFootX = isRightSide ? -18 : 18;
            let frontKneeX = isRightSide ? -10 : 10;
            let frontKneeY = -16;

            ctx.beginPath();
            ctx.moveTo(0, -32);
            ctx.lineTo(frontKneeX, frontKneeY);
            ctx.lineTo(frontFootX, 0); // Жерге тийет
            ctx.stroke();

            // Бут кийимдер (Кроссовкалар)
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(backFootX - (isRightSide ? 2 : 12), -4, 15, 6, 2);
            ctx.roundRect(frontFootX - (isRightSide ? 2 : 12), -4, 15, 6, 2);
            ctx.fill();

            // 2. ДЕНЕ ЖАНА БАШ (Эңкейген абалы)
            ctx.translate(0, -32); // Бел чекитине жылуу
            ctx.rotate(leanAngle);  // Артка эңкейтүү

            // Дене (Торс)
            ctx.fillStyle = shirtColor;
            ctx.beginPath();
            ctx.moveTo(-12, -35);
            ctx.lineTo(12, -35);
            ctx.lineTo(9, 0);
            ctx.lineTo(-9, 0);
            ctx.closePath();
            ctx.fill();

            // Кыргызстандын гербинин/туусунун сүрөтү
            ctx.fillStyle = '#dc2626';
            let patchX = isRightSide ? 2 : -10;
            ctx.fillRect(patchX, -30, 8, 6);
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(patchX + 4, -27, 1.8, 0, Math.PI * 2);
            ctx.fill();

            // БАШ ЖАНА КӨЗДӨР
            ctx.fillStyle = '#fdba74';
            ctx.beginPath();
            ctx.arc(0, -45, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(isRightSide ? -4 : 4, -46, 2, 0, Math.PI * 2);
            ctx.fill();

            // АК КАЛПАК
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(-11, -49);
            ctx.quadraticCurveTo(-12, -68, 0, -72);
            ctx.quadraticCurveTo(12, -68, 11, -49);
            ctx.closePath();
            ctx.fill();

            // Калпактын кайырмасы
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.ellipse(0, -49, 12, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(0, -50.5, 10, 2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Калпактын оймосу
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -58);
            ctx.lineTo(0, -64);
            ctx.stroke();

            // 3. АРКАНДЫ ДАЛ КАРМАГАН КОЛДОР
            // Дененин абалына жараша аркан жайгашкан жердин жергиликтүү координатасын табуу
            let localRopeY = (ropeY - (groundY - 32)); 

            ctx.strokeStyle = '#fdba74'; // Тери түсү
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';

            // Алдыңкы жана арткы колдор арканды кысып кармап турат
            ctx.beginPath();
            ctx.moveTo(-4, -25);
            ctx.lineTo(isRightSide ? -18 : 18, localRopeY + 12); // Арканды көздөй барат
            ctx.stroke();

            ctx.strokeStyle = shirtColor;
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(4, -25);
            ctx.lineTo(isRightSide ? -12 : 12, localRopeY + 12);
            ctx.stroke();

            // Муштумдар (Аркандын үстүндөгү колдор)
            ctx.fillStyle = '#fdba74';
            ctx.beginPath();
            ctx.arc(isRightSide ? -18 : 18, localRopeY + 12, 4.5, 0, Math.PI * 2);
            ctx.arc(isRightSide ? -12 : 12, localRopeY + 12, 4.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Event Listeners
        ['ky', 'ru', 'en'].forEach(lang => {
            const btnSetup = document.getElementById(`btn-lang-${lang}`);
            const btnGame = document.getElementById(`btn-game-lang-${lang}`);
            if (btnSetup) btnSetup.addEventListener('click', () => setLanguage(lang));
            if (btnGame) btnGame.addEventListener('click', () => setLanguage(lang));
        });

        document.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLang);
        });
    </script>
</body>
</html>
