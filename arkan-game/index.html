<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аркан Тартыш - Физика & Билим</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #fff;
            overflow-x: hidden;
        }
        .lang-btn-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .lang-btn {
            background: #1a2332;
            color: #8a99ad;
            border: 1px solid #2a384c;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .lang-btn.active, .lang-btn:hover {
            background: #00f0ff;
            color: #000;
            border-color: #00f0ff;
        }
        #setup-layer {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #131b26;
            border-radius: 12px;
            border: 1px solid #223147;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #00f0ff;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            background: #0b0e14;
            border: 1px solid #223147;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        textarea {
            height: 140px;
            resize: vertical;
        }
        .btn-main {
            background: linear-gradient(45deg, #00f0ff, #0077ff);
            color: #000;
            font-weight: bold;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-main:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .saved-tests {
            margin-top: 20px;
            border-top: 1px solid #223147;
            padding-top: 15px;
        }
        .test-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a2332;
            padding: 8px 12px;
            margin-top: 8px;
            border-radius: 6px;
        }
        .test-item button {
            margin-left: 5px;
            padding: 4px 8px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        .btn-select { background: #00ff88; color: #000; font-weight: bold; }
        .btn-delete { background: #ff4757; color: #fff; }

        #ui-layer {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #gameCanvas {
            display: block;
            width: 100%;
        }
        .game-header {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }
        .team-hud {
            background: rgba(19, 27, 38, 0.85);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            color: #fff;
        }
        .team-hud.left { border-left: 4px solid #00a8ff; }
        .team-hud.right { border-right: 4px solid #e84118; text-align: right; }
        
        .quiz-container {
            display: flex;
            height: calc(45vh - 20px);
            background: #0b0e14;
            border-top: 2px solid #223147;
        }
        .quiz-side {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .quiz-side.left { border-right: 1px solid #223147; }
        .question-box {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
            min-height: 50px;
        }
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .answer-btn {
            background: #1a2332;
            border: 1px solid #2a384c;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .answer-btn:hover {
            background: #2a384c;
            border-color: #00f0ff;
        }
        .waiting-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 14, 20, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #00f0ff;
            font-weight: bold;
            z-index: 5;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #131b26;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 1px solid #00f0ff;
        }
        .modal-content h2 { margin-bottom: 15px; }
        .modal-content p { margin-bottom: 20px; line-height: 1.6; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop src="/arkan-game/komuzakbakai.mp3"></audio>

    <!-- SETUP LAYER -->
    <div id="setup-layer">
        <div class="lang-btn-group">
            <button class="lang-btn" id="btn-lang-ky">Кыргызча</button>
            <button class="lang-btn" id="btn-lang-ru">Русский</button>
            <button class="lang-btn" id="btn-lang-en">English</button>
        </div>

        <h1 id="setup-title" style="text-align: center; margin-bottom: 20px; color: #00f0ff;">Аркан Тартыш: Жөндөөлөр</h1>

        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;">
                <label id="lbl-left-team">Сол тараптагы команда:</label>
                <input type="text" id="leftTeamInput" value="Көк Танк">
            </div>
            <div class="form-group" style="flex: 1;">
                <label id="lbl-right-team">Оң тараптагы команда:</label>
                <input type="text" id="rightTeamInput" value="Кара Тулпар">
            </div>
        </div>

        <div class="form-group">
            <label id="lbl-test-content">Тесттин мазмуну (Суроо / *Туура жооп / Ката жоопдор):</label>
            <textarea id="questionsTextArea"></textarea>
        </div>

        <div style="display: flex; gap: 10px;">
            <input type="text" id="testNameInput" placeholder="Тесттин аталышы" style="flex: 2;">
            <button class="btn-main" id="saveTestBtn" style="flex: 1; margin-top: 0;">Сактоо</button>
        </div>

        <button class="btn-main" id="startGameBtn" style="margin-top: 15px; background: linear-gradient(45deg, #00ff88, #00b894);">Оюнду Баштоо 🚀</button>

        <div class="saved-tests">
            <label id="lbl-saved-tests">Сакталган тесттер:</label>
            <div id="savedTestsList"></div>
        </div>
    </div>

    <!-- UI & GAME LAYER -->
    <div id="ui-layer">
        <div class="game-header">
            <div class="team-hud left">
                <h3 id="leftSideName">Көк Танк</h3>
                <div>Упай: <span id="leftScoreDisplay" style="color: #00f0ff;">0</span></div>
            </div>
            <div class="lang-btn-group">
                <button class="lang-btn" id="btn-game-lang-ky">KY</button>
                <button class="lang-btn" id="btn-game-lang-ru">RU</button>
                <button class="lang-btn" id="btn-game-lang-en">EN</button>
                <button class="lang-btn" id="btn-exit" style="background: #ff4757; color: #fff;" onclick="location.reload()">Чыгуу</button>
            </div>
            <div class="team-hud right">
                <h3 id="rightSideName">Кара Тулпар</h3>
                <div>Упай: <span id="rightScoreDisplay" style="color: #ff0055;">0</span></div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="quiz-container">
            <div class="quiz-side left">
                <div class="waiting-overlay" id="leftWaitingOverlay"><span id="left-overlay-text">Атаандашты күтүүдө...</span></div>
                <div>
                    <div id="leftProgress" style="color: #8a99ad; font-size: 12px; margin-bottom: 5px;">Суроо 1/5</div>
                    <div class="question-box" id="leftQuestionText">Суроо жүктөлүп жатат...</div>
                </div>
                <div class="answers-grid" id="leftAnswersGrid"></div>
            </div>

            <div class="quiz-side right">
                <div class="waiting-overlay" id="rightWaitingOverlay"><span id="right-overlay-text">Атаандашты күтүүдө...</span></div>
                <div>
                    <div id="rightProgress" style="color: #8a99ad; font-size: 12px; margin-bottom: 5px;">Суроо 1/5</div>
                    <div class="question-box" id="rightQuestionText">Суроо жүктөлүп жатат...</div>
                </div>
                <div class="answers-grid" id="rightAnswersGrid"></div>
            </div>
        </div>
    </div>

    <!-- RESULT MODAL -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="resultTitle">Жеңүүчү!</h2>
            <p id="resultDesc">Оюн жыйынтыгы...</p>
            <button class="btn-main" id="modal-btn-return" onclick="location.reload()">Башкы менюга кайтуу</button>
        </div>
    </div>

    <script>
        const translations = {
            ky: {
                setupTitle: "Аркан Тартыш: Жөндөөлөр",
                lblLeftTeam: "Сол тараптагы команда:",
                lblRightTeam: "Оң тараптагы команда:",
                lblSavedTests: "Сакталган тесттер:",
                lblTestContent: "Тесттин мазмуну (Суроо / *Туура жооп / Ката жоопдор):",
                testNamePlaceholder: "Тесттин аталышы",
                btnSaveTest: "Сактоо",
                btnStartGame: "Оюнду Баштоо 🚀",
                btnExit: "Чыгуу",
                overlayText: "Атаандашты күтүүдө...",
                btnReturn: "Башкы менюга кайтуу",
                defaultLeftName: "Көк Танк",
                defaultRightName: "Кара Тулпар",
                btnSelect: "Тандоо",
                alertFillInfo: "Сураныч, тесттин атын жана суроолорду толтуруңуз!",
                alertSavedSuccess: "Тест ийгиликтүү сакталды!",
                alertInvalidFormat: "Тесттин форматы туура эмес!",
                questionPrefix: "Суроо",
                winTitleSuffix: "жеңишке жетти!",
                winDrawTitle: "ТЕН-ЧЫГУУ!",
                winReasonPrefix: "көбүрөөк туура жооп берди!",
                winDrawText: "Эки команда тең бирдей жыйынтык көрсөтүштү!",
                totalTimeLabel: "Жалпы убакыт:",
                secLabel: "сек",
                resultsHeader: "Жыйынтыктар:",
                correctAnswersLabel: "туура жооп",
                defaultTopics: [
                    { q: "Күчтүн бирдиги эмне?", a: "Ньютон", w: ["Джоуль", "Паскаль", "Ватт"] },
                    { q: "Тездиктин формуласы кайсы?", a: "v = S / t", w: ["F = m * a", "P = F / S", "E = m * c²"] },
                    { q: "Заттын үч абалы кайсылар?", a: "Катуу, суюк, газ", w: ["Плазма, ток, нур", "Атом, молекула, ион", "Энергия, масса, күч"] }
                ]
            },
            ru: {
                setupTitle: "Перетягивание Каната: Настройки",
                lblLeftTeam: "Левая команда:",
                lblRightTeam: "Правая команда:",
                lblSavedTests: "Сохраненные тесты:",
                lblTestContent: "Содержание теста (Вопрос / *Правильный ответ / Неправильные):",
                testNamePlaceholder: "Название теста",
                btnSaveTest: "Сохранить",
                btnStartGame: "Начать Игру 🚀",
                btnExit: "Выход",
                overlayText: "Ожидание соперника...",
                btnReturn: "В главное меню",
                defaultLeftName: "Синий Танк",
                defaultRightName: "Черный Тулпар",
                btnSelect: "Выбрать",
                alertFillInfo: "Пожалуйста, заполните название и вопросы теста!",
                alertSavedSuccess: "Тест успешно сохранен!",
                alertInvalidFormat: "Неверный формат теста!",
                questionPrefix: "Вопрос",
                winTitleSuffix: "победил!",
                winDrawTitle: "НИЧЬЯ!",
                winReasonPrefix: "дал больше правильных ответов!",
                winDrawText: "Обе команды показали одинаковый результат!",
                totalTimeLabel: "Общее время:",
                secLabel: "сек",
                resultsHeader: "Результаты:",
                correctAnswersLabel: "правильных ответов",
                defaultTopics: [
                    { q: "Единица измерения силы?", a: "Ньютон", w: ["Джоуль", "Паскаль", "Ватт"] },
                    { q: "Формула скорости?", a: "v = S / t", w: ["F = m * a", "P = F / S", "E = m * c²"] },
                    { q: "Три состояния вещества?", a: "Твердое, жидкое, газ", w: ["Плазма, ток, луч", "Атом, молекула, ион", "Энергия, масса, сила"] }
                ]
            },
            en: {
                setupTitle: "Tug of War: Settings",
                lblLeftTeam: "Left Team:",
                lblRightTeam: "Right Team:",
                lblSavedTests: "Saved Tests:",
                lblTestContent: "Test Content (Question / *Correct answer / Wrong answers):",
                testNamePlaceholder: "Test Title",
                btnSaveTest: "Save",
                btnStartGame: "Start Game 🚀",
                btnExit: "Exit",
                overlayText: "Waiting for opponent...",
                btnReturn: "Return to Main Menu",
                defaultLeftName: "Blue Tank",
                defaultRightName: "Black Tulpar",
                btnSelect: "Select",
                alertFillInfo: "Please fill in the title and questions!",
                alertSavedSuccess: "Test saved successfully!",
                alertInvalidFormat: "Invalid test format!",
                questionPrefix: "Question",
                winTitleSuffix: "Won!",
                winDrawTitle: "DRAW!",
                winReasonPrefix: "gave more correct answers!",
                winDrawText: "Both teams achieved the same score!",
                totalTimeLabel: "Total Time:",
                secLabel: "sec",
                resultsHeader: "Results:",
                correctAnswersLabel: "correct answers",
                defaultTopics: [
                    { q: "What is the unit of force?", a: "Newton", w: ["Joule", "Pascal", "Watt"] },
                    { q: "Formula for speed?", a: "v = S / t", w: ["F = m * a", "P = F / S", "E = m * c²"] },
                    { q: "Three states of matter?", a: "Solid, Liquid, Gas", w: ["Plasma, Current, Ray", "Atom, Molecule, Ion", "Energy, Mass, Force"] }
                ]
            }
        };

        let currentLang = localStorage.getItem('site_lang') || 'ky';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);

            const buttons = ['ky', 'ru', 'en'];
            buttons.forEach(b => {
                const btnSetup = document.getElementById(`btn-lang-${b}`);
                const btnGame = document.getElementById(`btn-game-lang-${b}`);
                if (btnSetup) btnSetup.classList.toggle('active', b === lang);
                if (btnGame) btnGame.classList.toggle('active', b === lang);
            });

            const t = translations[lang] || translations['ky'];

            document.getElementById('setup-title').innerText = t.setupTitle;
            document.getElementById('lbl-left-team').innerText = t.lblLeftTeam;
            document.getElementById('lbl-right-team').innerText = t.lblRightTeam;
            document.getElementById('lbl-saved-tests').innerText = t.lblSavedTests;
            document.getElementById('lbl-test-content').innerText = t.lblTestContent;
            document.getElementById('testNameInput').placeholder = t.testNamePlaceholder;
            document.getElementById('saveTestBtn').innerText = t.btnSaveTest;
            document.getElementById('startGameBtn').innerText = t.btnStartGame;
            document.getElementById('btn-exit').innerText = t.btnExit;
            document.getElementById('left-overlay-text').innerText = t.overlayText;
            document.getElementById('right-overlay-text').innerText = t.overlayText;
            document.getElementById('modal-btn-return').innerText = t.btnReturn;

            const leftInput = document.getElementById('leftTeamInput');
            const rightInput = document.getElementById('rightTeamInput');
            if (leftInput.value === "Көк Танк" || leftInput.value === "Синий Танк" || leftInput.value === "Blue Tank") {
                leftInput.value = t.defaultLeftName;
            }
            if (rightInput.value === "Кара Тулпар" || rightInput.value === "Черный Тулпар" || rightInput.value === "Black Tulpar") {
                rightInput.value = t.defaultRightName;
            }

            if(!document.getElementById('questionsTextArea').value.trim()){
                const defaultQuestionsText = t.defaultTopics.map(item => `${item.q}\n*${item.a}\n${item.w.join('\n')}`).join('\n\n');
                document.getElementById('questionsTextArea').value = defaultQuestionsText;
            }

            loadSavedTests();
            if (gameActive) {
                renderSide('left');
                renderSide('right');
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgMusic = document.getElementById('bgMusic');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.55;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let leftTeam = { name: "Көк Танк", score: 0, index: 0, correctCount: 0, finished: false };
        let rightTeam = { name: "Кара Тулпар", score: 0, index: 0, correctCount: 0, finished: false };
        let parsedQuestions = [];
        let gameActive = false;
        let startTime = 0;
        let ropeOffset = 0;
        let targetRopeOffset = 0;
        let animationPulse = 0;

        function loadSavedTests() {
            const container = document.getElementById('savedTestsList');
            container.innerHTML = '';
            const saved = JSON.parse(localStorage.getItem('arkan_saved_tests') || '{}');
            const t = translations[currentLang] || translations['ky'];

            Object.keys(saved).forEach(name => {
                const div = document.createElement('div');
                div.className = 'test-item';
                div.innerHTML = `<span>${name}</span><div><button class="btn-select" onclick="selectTest('${name.replace(/'/g, "\\'")}')">${t.btnSelect}</button><button class="btn-delete" onclick="deleteTest('${name.replace(/'/g, "\\'")}')">❌</button></div>`;
                container.appendChild(div);
            });
        }

        window.selectTest = function(name) {
            const saved = JSON.parse(localStorage.getItem('arkan_saved_tests') || '{}');
            if (saved[name]) {
                document.getElementById('questionsTextArea').value = saved[name];
                document.getElementById('testNameInput').value = name;
            }
        };

        window.deleteTest = function(name) {
            const saved = JSON.parse(localStorage.getItem('arkan_saved_tests') || '{}');
            delete saved[name];
            localStorage.setItem('arkan_saved_tests', JSON.stringify(saved));
            loadSavedTests();
        };

        document.getElementById('saveTestBtn').addEventListener('click', () => {
            const t = translations[currentLang] || translations['ky'];
            const name = document.getElementById('testNameInput').value.trim();
            const text = document.getElementById('questionsTextArea').value.trim();
            if (!name || !text) return alert(t.alertFillInfo);
            const saved = JSON.parse(localStorage.getItem('arkan_saved_tests') || '{}');
            saved[name] = text;
            localStorage.setItem('arkan_saved_tests', JSON.stringify(saved));
            loadSavedTests();
            alert(t.alertSavedSuccess);
        });

        function parseQuestions(text) {
            const blocks = text.split(/\n\s*\n/);
            const result = [];
            blocks.forEach(b => {
                const lines = b.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length >= 2) {
                    const q = lines[0];
                    let a = '';
                    const w = [];
                    lines.slice(1).forEach(l => {
                        if (l.startsWith('*')) a = l.substring(1).trim();
                        else w.push(l);
                    });
                    if (!a && w.length > 0) a = w.shift();
                    result.push({ q, a, w });
                }
            });
            return result;
        }

        document.getElementById('startGameBtn').addEventListener('click', () => {
            const t = translations[currentLang] || translations['ky'];
            const text = document.getElementById('questionsTextArea').value.trim();
            parsedQuestions = parseQuestions(text);
            if (parsedQuestions.length === 0) return alert(t.alertInvalidFormat);

            leftTeam.name = document.getElementById('leftTeamInput').value.trim() || t.defaultLeftName;
            rightTeam.name = document.getElementById('rightTeamInput').value.trim() || t.defaultRightName;

            document.getElementById('leftSideName').innerText = leftTeam.name;
            document.getElementById('rightSideName').innerText = rightTeam.name;

            document.getElementById('setup-layer').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'block';

            try { 
                bgMusic.currentTime = 0;
                bgMusic.play(); 
            } catch(e){}

            gameActive = true;
            startTime = performance.now();
            leftTeam.index = 0; leftTeam.score = 0; leftTeam.correctCount = 0; leftTeam.finished = false;
            rightTeam.index = 0; rightTeam.score = 0; rightTeam.correctCount = 0; rightTeam.finished = false;
            ropeOffset = 0; targetRopeOffset = 0; animationPulse = 0;

            renderSide('left');
            renderSide('right');
            requestAnimationFrame(drawGame);
        });

        function renderSide(side) {
            const team = (side === 'left') ? leftTeam : rightTeam;
            const progressEl = document.getElementById(`${side}Progress`);
            const questionEl = document.getElementById(`${side}QuestionText`);
            const gridEl = document.getElementById(`${side}AnswersGrid`);
            const t = translations[currentLang] || translations['ky'];

            if (team.index >= parsedQuestions.length) {
                team.finished = true;
                document.getElementById(`${side}WaitingOverlay`).style.display = 'flex';
                checkGameCompletion();
                return;
            }

            progressEl.innerText = `${t.questionPrefix} ${team.index + 1}/${parsedQuestions.length}`;
            const currentQuiz = parsedQuestions[team.index];
            questionEl.innerText = currentQuiz.q;
            gridEl.innerHTML = '';

            const shuffledAnswers = [currentQuiz.a, ...currentQuiz.w].sort(() => Math.random() - 0.5);
            shuffledAnswers.forEach(ans => {
                const button = document.createElement('button');
                button.className = 'answer-btn';
                button.innerText = ans;
                button.onclick = () => handleSelection(side, ans, currentQuiz.a);
                gridEl.appendChild(button);
            });
        }

        function handleSelection(side, selectedAnswer, correctAnswer) {
            if (!gameActive) return;
            const team = (side === 'left') ? leftTeam : rightTeam;

            if (selectedAnswer === correctAnswer) {
                team.score += 100;
                team.correctCount++;
                targetRopeOffset += (side === 'left') ? -65 : 65;
            } else {
                targetRopeOffset += (side === 'left') ? 35 : -35;
            }

            document.getElementById(`${side}ScoreDisplay`).innerText = team.score;
            team.index++;
            renderSide(side);
        }

        function checkGameCompletion() {
            if (leftTeam.finished && rightTeam.finished && gameActive) {
                gameActive = false;
                try { bgMusic.pause(); } catch(e){}

                const t = translations[currentLang] || translations['ky'];
                const modal = document.getElementById('resultModal');
                const title = document.getElementById('resultTitle');
                const desc = document.getElementById('resultDesc');

                const totalDuration = ((performance.now() - startTime) / 1000).toFixed(2);
                let winnerName = "";
                let winReason = "";

                if (leftTeam.correctCount > rightTeam.correctCount) {
                    winnerName = leftTeam.name;
                    title.style.color = "#00f0ff";
                    winReason = `🏆 <b>${leftTeam.name}</b> ${t.winReasonPrefix}`;
                } else if (rightTeam.correctCount > leftTeam.correctCount) {
                    winnerName = rightTeam.name;
                    title.style.color = "#ff0055";
                    winReason = `🏆 <b>${rightTeam.name}</b> ${t.winReasonPrefix}`;
                } else {
                    winReason = t.winDrawText;
                    title.style.color = "#fff";
                }

                title.innerHTML = winnerName ? `🏆 ${winnerName} ${t.winTitleSuffix}` : t.winDrawTitle;
                desc.innerHTML = `
                    ${winReason}<br><br>
                    ⏱️ ${t.totalTimeLabel} <b>${totalDuration} ${t.secLabel}</b><br><br>
                    📊 <b>${t.resultsHeader}</b><br>
                    • ${leftTeam.name}: ${leftTeam.correctCount} ${t.correctAnswersLabel}<br>
                    • ${rightTeam.name}: ${rightTeam.correctCount} ${t.correctAnswersLabel}
                `;
                modal.style.display = 'flex';
            }
        }

        // --- ДҮЙНӨНҮ ЖАНА КААРМАНДАРДЫ ТАРТУУ ---
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. АСМАН
            let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#7dd3fc');
            skyGradient.addColorStop(0.5, '#bae6fd');
            skyGradient.addColorStop(1, '#e0f2fe');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. АЛА-ТОО ЧОКУЛАРЫ
            drawKyrgyzMountains();

            // 3. ЖАЙЛОО (Чөп)
            const centerY = canvas.height * 0.72;
            let groundGradient = ctx.createLinearGradient(0, centerY, 0, canvas.height);
            groundGradient.addColorStop(0, '#4ade80');
            groundGradient.addColorStop(1, '#15803d');
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, centerY, canvas.width, canvas.height - centerY);

            ctx.strokeStyle = '#166534';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(canvas.width, centerY);
            ctx.stroke();

            const centerX = canvas.width / 2 + ropeOffset;
            const playerCount = Math.max(1, parsedQuestions.length);

            animationPulse += 0.08;

            // АРКАНДЫН БИЙИКТИГИ (КОЛДОР ДАЛ УШУЛ ДЕҢГЭЭЛДЕ КАРМАЙТ)
            const ropeY = centerY - 35;

            // 4. ТЕКСТУРАЛУУ РЕАЛДУУ АРКАН
            ctx.save();
            ctx.strokeStyle = '#854d0e';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, ropeY);
            ctx.lineTo(canvas.width, ropeY);
            ctx.stroke();

            // Аркандын өрүлгөн оймолору
            ctx.strokeStyle = '#a16207';
            ctx.lineWidth = 4;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(0, ropeY - 1);
            ctx.lineTo(canvas.width, ropeY - 1);
            ctx.stroke();
            ctx.restore();

            // 5. ОРТОДОГУ КЫЗЫЛ ЛЕНТА (Белги)
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.fillRect(centerX - 4, ropeY - 12, 8, 24);

            let spacing = (playerCount > 5) ? Math.max(50, 320 / playerCount) : 75;

            // Командаларды тартуу
            drawTeam(canvas.width * 0.35 + ropeOffset, centerY, shirtColor='#0284c7', '#1e293b', leftTeam.name, false, animationPulse, playerCount, spacing, ropeY);
            drawTeam(canvas.width * 0.65 + ropeOffset, centerY, shirtColor='#dc2626', '#1e293b', rightTeam.name, true, animationPulse, playerCount, spacing, ropeY);

            ropeOffset += (targetRopeOffset - ropeOffset) * 0.05;

            if (gameActive) requestAnimationFrame(drawGame);
        }

        function drawKyrgyzMountains() {
            const h = canvas.height;
            const w = canvas.width;

            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.moveTo(0, h * 0.72);
            ctx.lineTo(w * 0.15, h * 0.3);
            ctx.lineTo(w * 0.35, h * 0.65);
            ctx.lineTo(w * 0.55, h * 0.25);
            ctx.lineTo(w * 0.78, h * 0.6);
            ctx.lineTo(w, h * 0.2);
            ctx.lineTo(w, h * 0.72);
            ctx.fill();

            drawMountainPeak(w * 0.25, h * 0.18, w * 0.3, h * 0.72, '#64748b', '#f8fafc');
            drawMountainPeak(w * 0.7, h * 0.15, w * 0.35, h * 0.72, '#475569', '#ffffff');
            drawMountainPeak(w * 0.05, h * 0.28, w * 0.25, h * 0.72, '#475569', '#f1f5f9');
        }

        function drawMountainPeak(peakX, peakY, baseWidth, baseY, rockColor, snowColor) {
            ctx.fillStyle = rockColor;
            ctx.beginPath();
            ctx.moveTo(peakX - baseWidth / 2, baseY);
            ctx.lineTo(peakX, peakY);
            ctx.lineTo(peakX + baseWidth / 2, baseY);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = snowColor;
            ctx.beginPath();
            ctx.moveTo(peakX, peakY);
            ctx.lineTo(peakX - baseWidth * 0.15, peakY + (baseY - peakY) * 0.3);
            ctx.lineTo(peakX - baseWidth * 0.08, peakY + (baseY - peakY) * 0.25);
            ctx.lineTo(peakX, peakY + (baseY - peakY) * 0.35);
            ctx.lineTo(peakX + baseWidth * 0.08, peakY + (baseY - peakY) * 0.24);
            ctx.lineTo(peakX + baseWidth * 0.15, peakY + (baseY - peakY) * 0.32);
            ctx.closePath();
            ctx.fill();
        }

        function drawTeam(startX, centerY, shirtColor, pantsColor, teamName, isRightSide, pulse, count, spacing, ropeY) {
            ctx.fillStyle = shirtColor;
            ctx.font = "bold 16px 'Segoe UI', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(teamName, startX + (isRightSide ? 80 : -80), centerY - 120);

            for (let i = 0; i < count; i++) {
                let distance = isRightSide ? (i * spacing) : -(i * spacing);
                let x = startX + distance;

                drawKyrgyzPlayerVector(x, centerY, shirtColor, pantsColor, isRightSide, pulse + i, ropeY);
            }
        }

        // --- ЧЫНЫГЫ АК КАЛПАКТУУ КЫРГЫЗ ЖИГИТТЕРИН ТАРТУУ ---
        function drawKyrgyzPlayerVector(x, groundY, shirtColor, pantsColor, isRightSide, localPulse, ropeY) {
            ctx.save();

            let pullEffort = Math.sin(localPulse * 1.5) * 2;
            let leanAngle = isRightSide ? (0.35 + pullEffort * 0.02) : (-0.35 - pullEffort * 0.02);

            ctx.translate(x, groundY);

            // 1. БУТТАР (Шым)
            ctx.strokeStyle = pantsColor;
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            let backFootX = isRightSide ? 30 : -30;
            let backKneeX = isRightSide ? 18 : -18;
            let backKneeY = -18;

            ctx.beginPath();
            ctx.moveTo(0, -32);
            ctx.lineTo(backKneeX, backKneeY);
            ctx.lineTo(backFootX, 0);
            ctx.stroke();

            let frontFootX = isRightSide ? -18 : 18;
            let frontKneeX = isRightSide ? -10 : 10;
            let frontKneeY = -16;

            ctx.beginPath();
            ctx.moveTo(0, -32);
            ctx.lineTo(frontKneeX, frontKneeY);
            ctx.lineTo(frontFootX, 0);
            ctx.stroke();

            // өтүк/бут кийим
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(backFootX - (isRightSide ? 2 : 12), -4, 15, 6, 2);
            ctx.roundRect(frontFootX - (isRightSide ? 2 : 12), -4, 15, 6, 2);
            ctx.fill();

            // 2. ДЕНЕ ЖАНА КЕЙПИ
            ctx.translate(0, -32);
            ctx.rotate(leanAngle);

            // Бешшент/Кийим (Торс)
            ctx.fillStyle = shirtColor;
            ctx.beginPath();
            ctx.moveTo(-13, -35);
            ctx.lineTo(13, -35);
            ctx.lineTo(9, 0);
            ctx.lineTo(-9, 0);
            ctx.closePath();
            ctx.fill();

            // Кийимдеги кыргыз оймосу
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -35);
            ctx.lineTo(0, -10);
            ctx.stroke();

            // ЖҮЗҮ ЖАНА ЧАЧЫ (Кыргыз жигити)
            // Моюн
            ctx.fillStyle = '#e5a872';
            ctx.fillRect(-3, -38, 6, 5);

            // Баш
            ctx.fillStyle = '#f0b37e';
            ctx.beginPath();
            ctx.arc(0, -46, 10, 0, Math.PI * 2);
            ctx.fill();

            // Кара чач
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.arc(0, -48, 10.2, Math.PI * 0.8, Math.PI * 2.2);
            ctx.fill();

            // Каш жана Көз
            ctx.fillStyle = '#0f172a';
            let eyeX = isRightSide ? -4 : 4;
            ctx.fillRect(eyeX - 1, -47, 3, 1.5); // Көз
            ctx.fillRect(eyeX - 2, -50, 4, 1.5); // Каш

            // 3. ЧЫНЫГЫ АК КАЛПАК (Төрт талаалуу салттуу кыргыз калпагы)
            ctx.save();
            ctx.translate(0, -52); // Калпакты башка жайгаштыруу

            // А) Ак кийиз негизи (Бийик, калыптуу төрт талаа формасы)
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.moveTo(-11, 0);
            ctx.lineTo(-13, -12);
            ctx.quadraticCurveTo(-14, -22, -4, -26);
            ctx.lineTo(0, -28); // Төрт талаанын чокусу
            ctx.lineTo(4, -26);
            ctx.quadraticCurveTo(14, -22, 13, -12);
            ctx.lineTo(11, 0);
            ctx.closePath();
            ctx.fill();

            // Б) Калпактын кайырмасы (Кара баркыт кайырма өйдө кайрылган)
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(-14, 2);
            ctx.lineTo(-12, -7);
            ctx.quadraticCurveTo(0, -4, 12, -7);
            ctx.lineTo(14, 2);
            ctx.quadraticCurveTo(0, 5, -14, 2);
            ctx.closePath();
            ctx.fill();

            // В) Талаалардын ортосундагы кара кыюу (Сызыктар)
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            // Капталындагы кыюулар
            ctx.moveTo(0, -28);
            ctx.lineTo(0, -5);
            ctx.moveTo(0, -28);
            ctx.lineTo(-10, -8);
            ctx.moveTo(0, -28);
            ctx.lineTo(10, -8);
            ctx.stroke();

            // Г) Калпактын чокусундагы кара Чокту (Чок/Тасма)
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(0, -28, 2, 0, Math.PI * 2); // Чоку баскыч
            ctx.fill();

            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(0, -28);
            ctx.lineTo(isRightSide ? 4 : -4, -22); // Чоктунун чачысы
            ctx.stroke();

            ctx.restore(); // Калпак бүттү

            // 4. КОЛДОР ЖАНА АРКАН
            let localRopeY = (ropeY - (groundY - 32)); 

            ctx.strokeStyle = '#f0b37e';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(-4, -25);
            ctx.lineTo(isRightSide ? -18 : 18, localRopeY + 12);
            ctx.stroke();

            ctx.strokeStyle = shirtColor;
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(4, -25);
            ctx.lineTo(isRightSide ? -12 : 12, localRopeY + 12);
            ctx.stroke();

            // Муштумдар
            ctx.fillStyle = '#f0b37e';
            ctx.beginPath();
            ctx.arc(isRightSide ? -18 : 18, localRopeY + 12, 4.5, 0, Math.PI * 2);
            ctx.arc(isRightSide ? -12 : 12, localRopeY + 12, 4.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Event Listeners
        ['ky', 'ru', 'en'].forEach(lang => {
            const btnSetup = document.getElementById(`btn-lang-${lang}`);
            const btnGame = document.getElementById(`btn-game-lang-${lang}`);
            if (btnSetup) btnSetup.addEventListener('click', () => setLanguage(lang));
            if (btnGame) btnGame.addEventListener('click', () => setLanguage(lang));
        });

        document.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLang);
        });
    </script>
</body>
</html>
