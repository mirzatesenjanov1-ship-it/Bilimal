    <!-- MathJax Конфигурациясы -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box !important; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        }
        body { 
            background: #03030d; 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            padding: 15px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow-x: hidden;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            touch-action: manipulation;
        }

        /* ТЕКСТ СЫРТКА ЧЫКПАСЫ ҮЧҮН КАБЫЛ АЛЫНГАН КАТУУ СТИЛДЕР */
        .test-box { 
            background: rgba(15,23,42,0.9); 
            border: 1px solid rgba(0,240,255,0.3); 
            border-radius: 16px; 
            padding: 25px; 
            width: 100%; 
            max-width: 750px; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8); 
            backdrop-filter: blur(10px); 
            box-sizing: border-box;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .back-nav { display: inline-flex; align-items: center; gap: 8px; color: #00f0ff; text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: 0.3s; cursor: pointer; }
        .back-nav:hover { color: #fff; text-shadow: 0 0 10px #00f0ff; }

        .lang-selector { display: flex; gap: 6px; }
        .lang-btn {
            background: rgba(2, 2, 8, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #9ca3af;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-btn:hover, .lang-btn.active {
            background: #00f0ff;
            color: #03030d;
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .btn-start { background: linear-gradient(45deg, #00f0ff, #7000ff); color: #fff; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: 800; font-size: 1.1rem; cursor: pointer; margin-top: 15px; transition: 0.3s; touch-action: manipulation; }
        .btn-start:hover { box-shadow: 0 0 20px rgba(0,240,255,0.5); transform: translateY(-2px); }
        .btn-start:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .input-field { width: 100%; padding: 12px; margin-top: 8px; background: #020208; border: 1px solid rgba(0,240,255,0.3); border-radius: 6px; color: #fff; font-size: 1rem; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.2); }
        
        /* ВАРИАНТТАР ТЕКСТИ БАТПАЙ КАЛГАНДА ЫК ЖОЛГО ТҮШҮҮСҮ ҮЧҮН */
        .q-option { 
            background: rgba(2,2,8,0.8); 
            border: 1px solid rgba(255,255,255,0.1); 
            padding: 14px 18px; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 1rem; 
            display: flex; 
            align-items: flex-start; 
            gap: 12px;
            touch-action: manipulation;
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
        }
        .q-option:hover { border-color: #00f0ff; background: rgba(0,240,255,0.1); }
        .q-option input[type="radio"], .q-option input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; accent-color: #00f0ff; margin-top: 3px; }
        .q-option span, .q-option label, .q-option div {
            width: 100% !important;
            max-width: 100% !important;
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            display: inline-block;
        }

        .pisa-container { 
            background: rgba(0, 240, 255, 0.05); 
            border: 1px solid rgba(0, 240, 255, 0.2); 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            line-height: 1.6;
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
        }
        
        .test-image, img { 
            max-width: 100% !important; 
            height: auto !important; 
            border-radius: 10px; 
            margin: 15px auto; 
            border: 1px solid rgba(0,240,255,0.4); 
            display: block; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            object-fit: contain;
        }

        .timer-badge { background: rgba(255,0,85,0.2); color: #ff0055; border: 1px solid #ff0055; padding: 6px 14px; border-radius: 20px; font-weight: 800; float: right; font-size: 0.95rem; }

        /* СУРОО ТЕКСТИ БАТПАЙ КАЛГАНДА ТӨМӨНКҮ САТКА ТҮШҮҮСҮ ҮЧҮН */
        #qText {
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            line-height: 1.6;
            font-size: 1.1rem;
            max-width: 100% !important;
            box-sizing: border-box !important;
            margin: 15px 0;
            display: block !important;
        }

        mjx-container {
            max-width: 100% !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            display: inline-block !important;
            vertical-align: middle !important;
        }

        sup, sub {
            white-space: nowrap !important;
        }

        .already-passed-msg {
            color: #ff0055;
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid #ff0055;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }

        .ad-modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(4, 6, 12, 0.88); 
            backdrop-filter: blur(8px); 
            z-index: 99999; 
            justify-content: center; 
            align-items: center; 
        }
        .ad-modal-content { 
            background: #111827; 
            border: 2px solid #38bdf8; 
            border-radius: 20px; 
            padding: 30px 40px; 
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4); 
            text-align: center; 
            max-width: 450px; 
            width: 90%; 
        }
        .ad-modal-icon { font-size: 3rem; color: #38bdf8; margin-bottom: 15px; animation: spin 1.5s infinite linear; }
        .ad-modal-title { font-size: 1.3rem; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .ad-modal-subtitle { font-size: 0.95rem; color: #cbd5e1; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .test-box { padding: 16px 12px; border-radius: 12px; }
            .top-header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .timer-badge { float: none; display: inline-block; margin-bottom: 10px; }
            #qText { font-size: 1rem; }
            .q-option { padding: 10px 12px; font-size: 0.95rem; }
            .btn-start { padding: 12px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- 2 СЕКУНДДУК ЭСКЕРТҮҮЧҮ ЖАРНАМА ТЕРЕЗЕСИ -->
    <div class="ad-modal" id="adNoticeModal">
        <div class="ad-modal-content">
            <div class="ad-modal-icon">⌛</div>
            <div class="ad-modal-title" id="adModalTitle">Жарнама жүктөлүүдө...</div>
            <div class="ad-modal-subtitle" id="adModalSub">Сураныч күтө туруңуз, 2 секунддан кийин өтмөк ачылат</div>
        </div>
    </div>

    <div class="test-box">
        <div id="startScreen">
            <div class="top-header">
                <a onclick="handleExitRedirect('tests-center.html')" class="back-nav" id="btnBack">
                    <i class="fa-solid fa-arrow-left"></i> <span>Просмотреть все тесты</span>
                </a>
                <div class="lang-selector">
                    <button type="button" class="lang-btn" id="lang-ky" onclick="setLanguage('ky')">KG</button>
                    <button type="button" class="lang-btn active" id="lang-ru" onclick="setLanguage('ru')">RU</button>
                    <button type="button" class="lang-btn" id="lang-en" onclick="setLanguage('en')">EN</button>
                </div>
            </div>

            <h2 style="color:#00f0ff; margin-bottom:10px" id="lblTitle"><i class="fa-solid fa-spinner fa-spin"></i> <span id="lblTitleText">Загрузка теста...</span></h2>
            <p style="color:#a5b4fc; margin-bottom: 15px;" id="lblMeta"></p>

            <div id="inputFormGroup" style="margin:20px 0">
                <label style="color:#a5b4fc; font-weight:600;" id="lblStudentName" for="studentName">Ваше имя и фамилия:</label>
                <input type="text" id="studentName" class="input-field" placeholder="Например: Асан Усенов" autocomplete="name">
                <br><br>
                <label style="color:#a5b4fc; font-weight:600;" id="lblStudentClass" for="studentClass">Ваш класс:</label>
                <input type="text" id="studentClass" class="input-field" placeholder="Например: 8-А" autocomplete="off">
            </div>

            <div id="alreadyPassedContainer"></div>

            <button type="button" class="btn-start" id="startBtn">НАЧАТЬ ТЕСТ 🚀</button>
        </div>

        <div id="runningScreen" style="display:none">
            <span class="timer-badge" id="timer"><i class="fa-solid fa-clock"></i> 00:00</span>
            <p style="color:#00f0ff; font-weight:700" id="progress">Вопрос 1/10</p>
            
            <div id="pisaBox" class="pisa-container" style="display:none"></div>
            <h3 id="qText"></h3>
            <div id="imgContainer"></div>

            <div id="optionsContainer" style="margin-top: 15px;"></div>
            
            <button type="button" class="btn-start" id="nextBtn" style="margin-top:20px">Следующий вопрос →</button>
        </div>
    </div>

    <!-- Smartlink ЖАРНАМА ЖАНА АНТИЧИТ ТЕҢШӨӨЛӨРҮ -->
    <script>
        const SMARTLINK_LOVEY = "https://uplcm.com/4/11977319";
        const AD_COOLDOWN_MS = 30 * 60 * 1000;

        function canShowAd() {
            const lastAdTime = localStorage.getItem('monetag_test_last_ad_time');
            if (!lastAdTime) return true;
            return (Date.now() - parseInt(lastAdTime, 10)) > AD_COOLDOWN_MS;
        }

        function recordAdShown() {
            localStorage.setItem('monetag_test_last_ad_time', Date.now().toString());
        }

        function handleExitRedirect(targetUrl) {
            if (canShowAd()) {
                const modal = document.getElementById('adNoticeModal');
                if (modal) modal.style.display = 'flex';

                setTimeout(() => {
                    recordAdShown();
                    window.open(SMARTLINK_LOVEY, '_blank');
                    window.location.href = targetUrl;
                }, 2000);
            } else {
                window.location.href = targetUrl;
            }
        }

        function disableAntiCheatCompletely() {
            window.isTestFinished = true;
            if (typeof window.stopAntiCheat === 'function') {
                window.stopAntiCheat();
            }
            const events = ['visibilitychange', 'blur', 'focus', 'pagehide', 'beforeunload'];
            events.forEach(ev => {
                window.removeEventListener(ev, window.handleAntiCheatEvent, true);
                document.removeEventListener(ev, window.handleAntiCheatEvent, true);
            });
        }

        const finishObserver = new MutationObserver(() => {
            const testBox = document.querySelector('.test-box');
            if (testBox && (
                testBox.innerText.includes('Тест аяктады') || 
                testBox.innerText.includes('Тест завершен') || 
                testBox.innerText.includes('Test completed') || 
                testBox.innerText.includes('Ваш результат') || 
                testBox.innerText.includes('Сиздин жыйынтык')
            )) {
                disableAntiCheatCompletely();

                const actionBtns = testBox.querySelectorAll('button, a');
                actionBtns.forEach(btn => {
                    if (!btn.dataset.adBound) {
                        btn.dataset.adBound = "true";
                        btn.addEventListener('click', (e) => {
                            e.preventDefault();
                            handleExitRedirect(btn.getAttribute('href') || 'tests-center.html');
                        });
                    }
                });
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const testBox = document.querySelector('.test-box');
            if (testBox) {
                finishObserver.observe(testBox, { childList: true, subtree: true, characterData: true });
            }
        });
    </script>

    <script>
        const testTranslations = {
            ky: {
                back: "Бардык тесттерди көрүү",
                loading: "Тест жүктөлүүдө...",
                noTestSelected: "Тест тандалган жок!",
                goToCenter: "ТЕСТТЕР БОРБОРУНА ӨТҮҮ 🚀",
                nameLabel: "Аты-жөнүңүз:",
                namePlaceholder: "Мисалы: Асан Усенов",
                classLabel: "Классыңыз:",
                classPlaceholder: "Мисалы: 8-А",
                startBtn: "ТЕСТТИ БАШТОО 🚀",
                nextBtn: "Кийинки суроо →",
                alreadyPassed: "Сиз бул тестти буга чейин тапшыргансыз!"
            },
            ru: {
                back: "Просмотреть все тесты",
                loading: "Загрузка теста...",
                noTestSelected: "Тест не выбран!",
                goToCenter: "ПЕРЕЙТИ В ЦЕНТР ТЕСТОВ 🚀",
                nameLabel: "Ваше имя и фамилия:",
                namePlaceholder: "Например: Асан Усенов",
                classLabel: "Ваш класс:",
                classPlaceholder: "Например: 8-А",
                startBtn: "НАЧАТЬ ТЕСТ 🚀",
                nextBtn: "Следующий вопрос →",
                alreadyPassed: "Вы уже проходили этот тест!"
            },
            en: {
                back: "View all tests",
                loading: "Loading test...",
                noTestSelected: "No test selected!",
                goToCenter: "GO TO TEST CENTER 🚀",
                nameLabel: "Full Name:",
                namePlaceholder: "Example: Asan Usenov",
                classLabel: "Class / Grade:",
                classPlaceholder: "Example: 8-A",
                startBtn: "START TEST 🚀",
                nextBtn: "Next Question →",
                alreadyPassed: "You have already completed this test!"
            }
        };

        let currentLang = 'ru';
        localStorage.setItem('site_lang', 'ru');

        function setLanguage(lang) {
            if (!testTranslations[lang]) lang = 'ru';
            currentLang = lang;
            localStorage.setItem('site_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`lang-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');

            const t = testTranslations[lang];

            const backNavSpan = document.querySelector('#btnBack span');
            if (backNavSpan) backNavSpan.innerText = t.back;

            const lblStudentName = document.getElementById('lblStudentName');
            if (lblStudentName) lblStudentName.innerText = t.nameLabel;

            const studentNameInput = document.getElementById('studentName');
            if (studentNameInput) studentNameInput.placeholder = t.namePlaceholder;

            const lblStudentClass = document.getElementById('lblStudentClass');
            if (lblStudentClass) lblStudentClass.innerText = t.classLabel;

            const studentClassInput = document.getElementById('studentClass');
            if (studentClassInput) studentClassInput.placeholder = t.classPlaceholder;

            const startBtn = document.getElementById('startBtn');
            const urlParams = new URLSearchParams(window.location.search);
            const testId = urlParams.get('id') || urlParams.get('testId');

            if (!testId && startBtn) {
                startBtn.textContent = t.goToCenter;
                const lblTitleText = document.getElementById('lblTitleText');
                if (lblTitleText) lblTitleText.innerText = t.noTestSelected;
            } else if (startBtn && startBtn.dataset.state !== "started" && !startBtn.dataset.disabledLimit) {
                startBtn.textContent = t.startBtn;
            }

            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn) nextBtn.innerText = t.nextBtn;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const testId = urlParams.get('id') || urlParams.get('testId');
            
            const startBtn = document.getElementById('startBtn');
            const studentNameInput = document.getElementById('studentName');
            const studentClassInput = document.getElementById('studentClass');
            const lblTitleText = document.getElementById('lblTitleText');

            setLanguage('ru');

            if (!testId) {
                const t = testTranslations.ru;
                if (lblTitleText) lblTitleText.innerText = t.noTestSelected;
                const spinner = document.querySelector('#lblTitle i.fa-spinner');
                if (spinner) spinner.remove();
                
                startBtn.disabled = false;
                startBtn.textContent = t.goToCenter;
                
                startBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    handleExitRedirect('tests-center.html');
                });
                return;
            }

            if (localStorage.getItem(`completed_test_${testId}`)) {
                const t = testTranslations[currentLang];
                document.getElementById('inputFormGroup').style.display = 'none';
                document.getElementById('alreadyPassedContainer').innerHTML = `<div class="already-passed-msg"><i class="fa-solid fa-circle-exclamation"></i> ${t.alreadyPassed}</div>`;
                startBtn.disabled = true;
                startBtn.dataset.disabledLimit = "true";
                startBtn.style.display = 'none';
                return;
            }

            startBtn.disabled = true;

            function checkInputs() {
                if (startBtn.dataset.state === "started" || startBtn.dataset.disabledLimit) return;
                const nameVal = studentNameInput ? studentNameInput.value.trim() : '';
                const classVal = studentClassInput ? studentClassInput.value.trim() : '';
                
                if (nameVal.length >= 2 && classVal.length >= 1) {
                    startBtn.disabled = false;
                } else {
                    startBtn.disabled = true;
                }
            }

            if (studentNameInput && studentClassInput) {
                studentNameInput.addEventListener('input', checkInputs);
                studentClassInput.addEventListener('input', checkInputs);
            }
        });
    </script>

    <script type="module" src="/js/public-test.js"></script>
    <script src="/js/anti-cheat.js"></script>

    <!-- СҮРӨТТӨРДҮ ЖҮКТӨӨ ЖАНА ТЕКСТТЕГИ ФОРМАТТАРДЫ ОҢДОО СКРИПТИ -->
    <script>
        function convertDriveUrl(url) {
            if (!url || typeof url !== 'string') return url;
            let fileId = '';
            const match1 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            const match2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            
            if (match1 && match1[1]) {
                fileId = match1[1];
            } else if (match2 && match2[1]) {
                fileId = match2[2] || match2[1];
            }

            if (fileId) {
                return `https://lh3.googleusercontent.com/d/${fileId}`;
            }
            return url;
        }

        function processImages(container) {
            if (!container) return;
            const imgs = container.querySelectorAll('img');
            imgs.forEach(img => {
                const src = img.getAttribute('src');
                if (src && (src.includes('drive.google.com') || src.includes('docs.google.com'))) {
                    const converted = convertDriveUrl(src);
                    if (src !== converted) {
                        img.src = converted;
                    }
                }
                img.onerror = function() {
                    console.log("Сүрөттү жүктөөдө ката чыкты:", this.src);
                };
            });
        }

        function fixDegreeFormatting(container) {
            if (!container) return;
            const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
            let node;
            while (node = walker.nextNode()) {
                if (node.nodeValue) {
                    node.nodeValue = node.nodeValue.replace(/(\d+)\s*°\s*([CС])?/g, '$1°$2');
                }
            }
        }

        let isRendering = false;
        function renderMathSafe() {
            if (isRendering) return;
            const target = document.getElementById('runningScreen');
            if (!target || target.style.display === 'none') return;

            isRendering = true;
            processImages(target);
            fixDegreeFormatting(target);

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([target])
                    .catch((err) => console.error("MathJax error:", err))
                    .finally(() => {
                        isRendering = false;
                    });
            } else {
                isRendering = false;
            }
        }

        const targetNode = document.getElementById('runningScreen');
        if (targetNode) {
            let timer;
            const observer = new MutationObserver(() => {
                if (isRendering) return;
                clearTimeout(timer);
                timer = setTimeout(renderMathSafe, 150);
            });
            observer.observe(targetNode, { childList: true, subtree: true });
        }
    </script>
</body>
</html>
