        let currentLang = localStorage.getItem('site_lang') || 'ky';

        function setLanguage(lang) {
            if (!testTranslations[lang]) lang = 'ky';
            currentLang = lang;
            localStorage.setItem('site_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`lang-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');

            const t = testTranslations[lang];

            const backNavSpan = document.querySelector('#btnBack span');
            if (backNavSpan) backNavSpan.innerText = t.back;

            const lblStudentName = document.getElementById('lblStudentName');
            if (lblStudentName) lblStudentName.innerText = t.nameLabel;

            const studentNameInput = document.getElementById('studentName');
            if (studentNameInput) studentNameInput.placeholder = t.namePlaceholder;

            const lblStudentClass = document.getElementById('lblStudentClass');
            if (lblStudentClass) lblStudentClass.innerText = t.classLabel;

            const studentClassInput = document.getElementById('studentClass');
            if (studentClassInput) studentClassInput.placeholder = t.classPlaceholder;

            const startBtn = document.getElementById('startBtn');
            const urlParams = new URLSearchParams(window.location.search);
            const testId = urlParams.get('id') || urlParams.get('testId');

            if (!testId && startBtn) {
                startBtn.textContent = t.goToCenter;
                const lblTitleText = document.getElementById('lblTitleText');
                if (lblTitleText) lblTitleText.innerText = t.noTestSelected;
            } else if (startBtn && startBtn.dataset.state !== "started") {
                startBtn.textContent = t.startBtn;
            }

            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn) nextBtn.innerText = t.nextBtn;

            const lblTitleText = document.getElementById('lblTitleText');
            if (lblTitleText && testId && lblTitleText.innerText.includes('жүктөлүүдө')) {
                lblTitleText.innerText = t.loading;
            }
        }

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const testId = urlParams.get('id') || urlParams.get('testId');
            
            const startBtn = document.getElementById('startBtn');
            const studentNameInput = document.getElementById('studentName');
            const studentClassInput = document.getElementById('studentClass');
            const lblTitle = document.getElementById('lblTitle');

            setLanguage(currentLang);

            if (!testId) {
                const t = testTranslations[currentLang] || testTranslations.ky;
                lblTitle.innerHTML = t.noTestSelected;
                
                startBtn.disabled = false;
                startBtn.textContent = t.goToCenter;
                
                startBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = '/tests-center.html';
                });
                return;
            }

            startBtn.disabled = true;

            function checkInputs() {
                const nameVal = studentNameInput ? studentNameInput.value.trim() : '';
                const classVal = studentClassInput ? studentClassInput.value.trim() : '';
                
                if (nameVal.length >= 2 && classVal.length >= 1) {
                    startBtn.disabled = false;
                } else {
                    startBtn.disabled = true;
                }
            }

            if (studentNameInput && studentClassInput) {
                studentNameInput.addEventListener('input', checkInputs);
                studentClassInput.addEventListener('input', checkInputs);
            }
        });
    </script>

    <!-- АКЫЛДУУ ЖАНА КЫНТЫКСЫЗ ФОРМУЛА ПАРСЕРИ -->
    <script>
        /**
         * Физикалык маанилерди, грек тамгаларын жана формулаларды тексттик пробелди бузбай
         * коопсуз калыбына келтирүүчү функция.
         */
        window.cleanPhysicsLatex = function(rawText) {
            if (!rawText || typeof rawText !== 'string') return rawText;

            let text = rawText;

            // 1. Биригип кеткен сандар жана физикалык бирдиктердин арасына туура пробел кошуу
            // Мисалы: "30см²болгондубалгагаз20кПабасым" -> "30 см² болгон дубалга газ 20 кПа басым"
            text = text.replace(/(\d+)\s*(см²|м³|мм|см|дм|м|км|кг\/м³|г\/см³|кПа|Па|Н|Ж|Вт|В|А|Ом|Гц|С|К)\b/gi, '$1 $2 ');
            
            // 2. Кийинки сөз менен жабышып калган бирдиктерди ажыратуу (мисалы: "см²болгондубалга" -> "см² болгондубалга")
            text = text.replace(/(см²|м³|кг\/м³|г\/см³|кПа|Па)\b([а-яөүңА-ЯӨҮҢa-zA-Z])/gi, '$1 $2');

            // 3. Тазаланбай калган грек тамгаларын жана индекстерди ($ жышааны жок болсо) MathJax форматына коопсуз ороо:
            // \alpha, \rho, \rho_0, \rho_1, p_0 ж.б.
            text = text.replace(/(?<!\$)\\([a-zA-Z]+)(_[0-9a-zA-Z]+)?(?!\$)/g, function(match) {
                return `$${match}$`;
            });

            // 4. Текст ичинде ачык калган p_0, a^2, a^3, F=a^2 сыяктуу математикалык туюнтмаларды $...$ кошуу
            text = text.replace(/(?<!\$)\b([a-zA-Z])_([0-9a-zA-Z]+)\b(?!\$)/g, '$$1_{$2}$');
            text = text.replace(/(?<!\$)\b([a-zA-Z])\^([0-9a-zA-Z]+)\b(?!\$)/g, '$$1^{$2}$');

            // 5. Формула варианттарындагы кашаалардын ортосундагы суроолорду ($...$) коррекциялоо
            text = text.replace(/\$\$/g, '$'); // Кайталанган $$ алып салуу

            return text;
        };

        /**
         * DOM элементтерин тазалап, MathJax'ка кайра иштетүү тапшырмасын берет.
         */
        window.renderMathInPage = function() {
            const container = document.getElementById('runningScreen');
            if (!container) return;

            // Тексттик түйүндөрдү гана оңдоо (HTML кнопкаларды, радио иконкаларды бузбоо үчүн)
            const walkTextNodes = function(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    let original = node.nodeValue;
                    if (original && original.trim().length > 0) {
                        let cleaned = window.cleanPhysicsLatex(original);
                        if (cleaned !== original) {
                            let tempSpan = document.createElement('span');
                            tempSpan.innerHTML = cleaned;
                            node.parentNode.replaceChild(tempSpan, node);
                        }
                    }
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    // Script же Style тегдерине тийбейбиз
                    if (['SCRIPT', 'STYLE', 'TEXTAREA', 'INPUT', 'SELECT'].includes(node.tagName)) return;
                    
                    // Эгер MathJax эбак рендерлеп койгон болсо, кайра башынан бузбайбыз
                    if (node.classList && (node.classList.contains('MathJax') || node.classList.contains('mjx-container'))) {
                        return;
                    }

                    for (let child of Array.from(node.childNodes)) {
                        walkTextNodes(child);
                    }
                }
            };

            const targets = container.querySelectorAll('#qText, .pisa-container, .q-option');
            targets.forEach(target => walkTextNodes(target));

            // MathJax3 асинхрондуу рендерлөө
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([container]).catch(err => {
                    console.warn("MathJax Typeset Soft Notice:", err);
                });
            }
        };

        // MutationObserver аркылуу суроолор алмашканда гана чакыруу
        let isProcessingMath = false;
        const targetNode = document.getElementById('runningScreen');
        
        if (targetNode) {
            let renderTimeout;
            const observer = new MutationObserver((mutations) => {
                // Өзүбүздүн MathJax рендерлөөбүз жараткан DOM өзгөрүүлөрүн кайра байкап циклге түшүп калбоо үчүн текшерүү
                if (isProcessingMath) return;

                let shouldRender = false;
                for (let mutation of mutations) {
                    if (mutation.type === 'childList' || mutation.type === 'characterData') {
                        shouldRender = true;
                        break;
                    }
                }

                if (shouldRender) {
                    clearTimeout(renderTimeout);
                    renderTimeout = setTimeout(() => {
                        isProcessingMath = true;
                        if (window.renderMathInPage) {
                            window.renderMathInPage();
                        }
                        setTimeout(() => { isProcessingMath = false; }, 100);
                    }, 60);
                }
            });

            observer.observe(targetNode, { childList: true, subtree: true, characterData: true });
        }
    </script>
