    <script>
        const testTranslations = {
            ky: {
                back: "Бардык тесттерди көрүү",
                loading: "Тест жүктөлүүдө...",
                noTestSelected: "Тест тандалган жок!",
                goToCenter: "ТЕСТТЕР БОРБОРУНА ӨТҮҮ 🚀",
                nameLabel: "Аты-жөнүңүз:",
                namePlaceholder: "Мисалы: Асан Усенов",
                classLabel: "Классыңыз:",
                classPlaceholder: "Мисалы: 8-А",
                startBtn: "ТЕСТТИ БАШТОО 🚀",
                nextBtn: "Кийинки суроо →",
                question: "Суроо"
            },
            ru: {
                back: "Просмотреть все тесты",
                loading: "Загрузка теста...",
                noTestSelected: "Тест не выбран!",
                goToCenter: "ПЕРЕЙТИ В ЦЕНТР ТЕСТОВ 🚀",
                nameLabel: "Ваше имя и фамилия:",
                namePlaceholder: "Например: Асан Усенов",
                classLabel: "Ваш класс:",
                classPlaceholder: "Например: 8-А",
                startBtn: "НАЧАТЬ ТЕСТ 🚀",
                nextBtn: "Следующий вопрос →",
                question: "Вопрос"
            },
            en: {
                back: "View all tests",
                loading: "Loading test...",
                noTestSelected: "No test selected!",
                goToCenter: "GO TO TEST CENTER 🚀",
                nameLabel: "Full Name:",
                namePlaceholder: "Example: Asan Usenov",
                classLabel: "Class / Grade:",
                classPlaceholder: "Example: 8-A",
                startBtn: "START TEST 🚀",
                nextBtn: "Next Question →",
                question: "Question"
            }
        };

        let currentLang = 'ru';
        localStorage.setItem('site_lang', 'ru');

        function setLanguage(lang) {
            if (!testTranslations[lang]) lang = 'ru';
            currentLang = lang;
            localStorage.setItem('site_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`lang-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');

            const t = testTranslations[lang];

            const backNavSpan = document.querySelector('#btnBack span');
            if (backNavSpan) backNavSpan.innerText = t.back;

            const lblStudentName = document.getElementById('lblStudentName');
            if (lblStudentName) lblStudentName.innerText = t.nameLabel;

            const studentNameInput = document.getElementById('studentName');
            if (studentNameInput) studentNameInput.placeholder = t.namePlaceholder;

            const lblStudentClass = document.getElementById('lblStudentClass');
            if (lblStudentClass) lblStudentClass.innerText = t.classLabel;

            const studentClassInput = document.getElementById('studentClass');
            if (studentClassInput) studentClassInput.placeholder = t.classPlaceholder;

            const startBtn = document.getElementById('startBtn');
            const urlParams = new URLSearchParams(window.location.search);
            const testId = urlParams.get('id') || urlParams.get('testId');

            if (!testId && startBtn) {
                startBtn.textContent = t.goToCenter;
                const lblTitleText = document.getElementById('lblTitleText');
                if (lblTitleText) lblTitleText.innerText = t.noTestSelected;
            } else if (startBtn && startBtn.dataset.state !== "started") {
                startBtn.textContent = t.startBtn;
            }

            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn) nextBtn.innerText = t.nextBtn;

            const lblTitleText = document.getElementById('lblTitleText');
            if (lblTitleText && testId && (lblTitleText.innerText.includes('жүктөлүүдө') || lblTitleText.innerText.includes('Загрузка') || lblTitleText.innerText.includes('Loading'))) {
                lblTitleText.innerText = t.loading;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const testId = urlParams.get('id') || urlParams.get('testId');
            
            const startBtn = document.getElementById('startBtn');
            const studentNameInput = document.getElementById('studentName');
            const studentClassInput = document.getElementById('studentClass');
            const lblTitleText = document.getElementById('lblTitleText');

            setLanguage('ru');

            if (!testId) {
                const t = testTranslations.ru;
                if (lblTitleText) lblTitleText.innerText = t.noTestSelected;
                const spinner = document.querySelector('#lblTitle i.fa-spinner');
                if (spinner) spinner.remove();
                
                startBtn.disabled = false;
                startBtn.textContent = t.goToCenter;
                
                startBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = 'tests-center.html';
                });
                return;
            }

            startBtn.disabled = true;

            function checkInputs() {
                if (startBtn.dataset.state === "started") return;
                const nameVal = studentNameInput ? studentNameInput.value.trim() : '';
                const classVal = studentClassInput ? studentClassInput.value.trim() : '';
                
                if (nameVal.length >= 2 && classVal.length >= 1) {
                    startBtn.disabled = false;
                } else {
                    startBtn.disabled = true;
                }
            }

            if (studentNameInput && studentClassInput) {
                studentNameInput.addEventListener('input', checkInputs);
                studentClassInput.addEventListener('input', checkInputs);
            }
        });
    </script>

    <!-- Тексттеги формулаларды жана сүрөттөрдү оңдоо алгоритми -->
    <script>
        let isMathJaxRendering = false;

        function convertDriveUrl(url) {
            if (!url || typeof url !== 'string') return url;
            let fileId = '';
            const match1 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            const match2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            
            if (match1 && match1[1]) {
                fileId = match1[1];
            } else if (match2 && match2[1]) {
                fileId = match2[1];
            }

            if (fileId) {
                return `https://lh3.googleusercontent.com/d/${fileId}`;
            }
            return url;
        }

        function processImages(container) {
            if (!container) return;
            const imgs = container.querySelectorAll('img');
            imgs.forEach(img => {
                const src = img.getAttribute('src');
                if (src && (src.includes('drive.google.com') || src.includes('docs.google.com'))) {
                    const converted = convertDriveUrl(src);
                    if (src !== converted) {
                        img.src = converted;
                    }
                }
            });
        }

        /* 
         * БАШКЫ ОҢДОО: Тексттеги каалаган LaTeX форматын MathJax тааныгандай $...$ арасына коопсуз оройт.
         */
        function fixLatexSyntax(container) {
            if (!container) return;

            const processNode = (node) => {
                if (node.nodeType === Node.TEXT_NODE) {
                    let text = node.nodeValue;
                    if (!text || !text.trim()) return;

                    // 1. Ашыкча эскейптерди тазалоо
                    text = text.replace(/\\\\/g, '\\');

                    // 2. (\vec{r}) сыяктуу кашаа ичиндеги же жалгыз турган LaTeX синтаксистерди $...$ долларга ороо
                    text = text.replace(/\\\((.*?)\\\)/g, '$$$1$$');
                    text = text.replace(/\\\[(.*?)\\\]/g, '$$$$$1$$$$');

                    // 3. Долларсыз калган векторлорду жана чоңдуктарды табуу: \vec{...}, \vert...\vert, \Delta
                    text = text.replace(/(?<!\$)\(\\vec\{([^}]+)\}\)(?!\$)/g, '($$\\vec{$1}$$)');
                    text = text.replace(/(?<!\$)\\vec\{([^}]+)\}(?!\$)/g, '$\\vec{$1}$');
                    text = text.replace(/(?<!\$)\\vert(.*?)\\vert(?!\$)/g, '$\\vert$1\\vert$');
                    text = text.replace(/(?<!\$)\\Delta(?!\$)/g, '$\\Delta$');
                    
                    // 4. \vec{v}=const же башка туюнтумдар долларсыз калса, аларды $...$ арасына алуу
                    text = text.replace(/(?<!\$)\\vec\{([^}]+)\}=([a-zA-Z0-9_]+)(?!\$)/g, '$\\vec{$1}=$2$');

                    node.nodeValue = text;
                } else if (node.nodeType === Node.ELEMENT_NODE && 
                           node.tagName !== 'SCRIPT' && 
                           node.tagName !== 'STYLE' && 
                           !node.classList.contains('MathJax') && 
                           !node.tagName.startsWith('MJX-')) {
                    Array.from(node.childNodes).forEach(processNode);
                }
            };

            processNode(container);
        }

        function renderMath() {
            if (isMathJaxRendering) return;
            const target = document.getElementById('runningScreen');
            if (!target || target.style.display === 'none') return;

            isMathJaxRendering = true;

            processImages(target);
            fixLatexSyntax(target);

            if (window.MathJax && window.MathJax.typesetPromise) {
                if (window.MathJax.typesetClear) {
                    window.MathJax.typesetClear([target]);
                }

                window.MathJax.typesetPromise([target])
                    .catch((err) => console.error("MathJax error:", err))
                    .finally(() => { 
                        setTimeout(() => { isMathJaxRendering = false; }, 100);
                    });
            } else {
                isMathJaxRendering = false;
            }
        }

        // Баракта суроолор алмашканда MutationObserver аркылуу MathJax чакыруу
        const targetNode = document.getElementById('runningScreen');
        if (targetNode) {
            let renderTimeout;
            const observer = new MutationObserver((mutations) => {
                if (isMathJaxRendering) return;

                const isMathJaxChange = mutations.some(m => 
                    Array.from(m.addedNodes).some(n => 
                        n.nodeType === Node.ELEMENT_NODE && 
                        (n.tagName.startsWith('MJX-') || n.classList.contains('MathJax'))
                    )
                );
                if (isMathJaxChange) return;

                clearTimeout(renderTimeout);
                renderTimeout = setTimeout(renderMath, 120);
            });
            
            observer.observe(targetNode, { childList: true, subtree: true });
        }
    </script>
