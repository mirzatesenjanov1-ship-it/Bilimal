<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- MathJax Конфигурациясы -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { 
            margin:0; 
            padding:0; 
            box-sizing:border-box !important; 
            font-family:'Segoe UI', sans-serif; 
        }
        body { 
            background:#03030d; 
            color:#fff; 
            min-height:100vh; 
            display:flex; 
            flex-direction: column;
            justify-content:center; 
            align-items:center; 
            padding:15px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow-x: hidden;
            width: 100%;
        }
        .adsterra-banner-container {
            width: 100%;
            max-width: 728px;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90px;
        }
        .test-box { 
            background:rgba(15,23,42,0.9); 
            border:1px solid rgba(0,240,255,0.3); 
            border-radius:16px; 
            padding:25px; 
            width:100%; 
            max-width:700px; 
            box-shadow:0 0 30px rgba(0,0,0,0.8); 
            backdrop-filter: blur(10px); 
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .back-nav { display: inline-flex; align-items: center; gap: 8px; color: #00f0ff; text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: 0.3s; }
        .back-nav:hover { color: #fff; text-shadow: 0 0 10px #00f0ff; }

        .lang-selector { display: flex; gap: 6px; }
        .lang-btn {
            background: rgba(2, 2, 8, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #9ca3af;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-btn:hover, .lang-btn.active {
            background: #00f0ff;
            color: #03030d;
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .btn-start { background:linear-gradient(45deg, #00f0ff, #7000ff); color:#fff; border:none; width:100%; padding:14px; border-radius:8px; font-weight:800; font-size:1.1rem; cursor:pointer; margin-top:15px; transition: 0.3s; }
        .btn-start:hover { box-shadow: 0 0 20px rgba(0,240,255,0.5); transform: translateY(-2px); }
        .btn-start:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .input-field { width:100%; padding:12px; margin-top:8px; background:#020208; border:1px solid rgba(0,240,255,0.3); border-radius:6px; color:#fff; font-size: 1rem; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.2); }
        
        .q-option { 
            background:rgba(2,2,8,0.8); 
            border:1px solid rgba(255,255,255,0.1); 
            padding:14px 18px; 
            border-radius:8px; 
            margin-bottom:12px; 
            cursor:pointer; 
            transition:0.2s; 
            font-size: 1rem; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
            max-width: 100% !important;
        }
        .q-option:hover { border-color:#00f0ff; background:rgba(0,240,255,0.1); }
        .q-option input[type="radio"], .q-option input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; accent-color: #00f0ff; }

        .pisa-container { 
            background: rgba(0, 240, 255, 0.05); 
            border: 1px solid rgba(0, 240, 255, 0.2); 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            line-height: 1.6;
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
            max-width: 100% !important;
        }
        .test-image { max-width: 100%; height: auto; border-radius: 8px; margin: 15px 0; border: 1px solid rgba(0,240,255,0.3); }

        .matching-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; align-items: center; }
        .matching-row select { background: #020208; border: 1px solid rgba(0,240,255,0.3); color: #fff; padding: 10px; border-radius: 6px; outline: none; width: 100%; }

        .timer-badge { background:rgba(255,0,85,0.2); color:#ff0055; border:1px solid #ff0055; padding:6px 14px; border-radius:20px; font-weight:800; float:right; font-size: 0.95rem; }
        .ads-slot { margin:15px 0; text-align:center; min-height:90px; }

        /* Тексттерди жана суроолорду контейнердин ичине толугу менен сыйдыруу */
        #qText {
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
            line-height: 1.5;
            font-size: 1.15rem;
            max-width: 100% !important;
            display: block !important;
            margin: 15px 0;
        }

        /* MathJax формулаларынын сыртка чыгып кетишин бөгөттөө */
        mjx-container, mjx-math, .MathJax {
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
            max-width: 100% !important;
            display: inline-block !important;
        }

        /* Мобилдик адаптация */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .test-box { padding: 16px 12px; border-radius: 12px; }
            .top-header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .timer-badge { float: none; display: inline-block; margin-bottom: 10px; }
            #qText { font-size: 1rem; }
            .q-option { padding: 10px 12px; font-size: 0.95rem; }
            .matching-row { grid-template-columns: 1fr; }
            .btn-start { padding: 12px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <!-- Top Adsterra Banner Container -->
    <div class="adsterra-banner-container">
        <script>
            atOptions = {
                'key' : '230e338703bb44150336cce1f0832fe3',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
            };
        </script>
        <script src="https://www.highperformanceformat.com/230e338703bb44150336cce1f0832fe3/invoke.js"></script>
    </div>

    <div class="test-box">
        <!-- 1-БӨЛҮК: START SCREEN -->
        <div id="startScreen">
            <div class="top-header">
                <a href="tests-center.html" class="back-nav" id="btnBack">
                    <i class="fa-solid fa-arrow-left"></i> <span>Бардык тесттерди көрүү</span>
                </a>
                <div class="lang-selector">
                    <button class="lang-btn" id="lang-ky" onclick="setLanguage('ky')">KG</button>
                    <button class="lang-btn" id="lang-ru" onclick="setLanguage('ru')">RU</button>
                    <button class="lang-btn" id="lang-en" onclick="setLanguage('en')">EN</button>
                </div>
            </div>

            <h2 style="color:#00f0ff; margin-bottom:10px" id="lblTitle"><i class="fa-solid fa-spinner fa-spin"></i> <span id="lblTitleText">Тест жүктөлүүдө...</span></h2>
            <p style="color:#a5b4fc; margin-bottom: 15px;" id="lblMeta"></p>

            <div style="margin:20px 0">
                <label style="color:#a5b4fc; font-weight:600;" id="lblStudentName">Аты-жөнүңүз:</label>
                <input type="text" id="studentName" class="input-field" placeholder="Мисалы: Асан Усенов">
                <br><br>
                <label style="color:#a5b4fc; font-weight:600;" id="lblStudentClass">Классыңыз:</label>
                <input type="text" id="studentClass" class="input-field" placeholder="Мисалы: 8-А">
            </div>

            <div class="ads-slot">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-1495571814896964"
                     data-ad-slot="1574613769"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>

            <button class="btn-start" id="startBtn">ТЕСТТИ БАШТОО 🚀</button>
        </div>

        <!-- 2-БӨЛҮК: TEST RUNNING -->
        <div id="runningScreen" style="display:none">
            <span class="timer-badge" id="timer"><i class="fa-solid fa-clock"></i> 00:00</span>
            <p style="color:#00f0ff; font-weight:700" id="progress">Суроо 1/10</p>
            
            <div id="pisaBox" class="pisa-container" style="display:none"></div>
            <h3 id="qText"></h3>
            <div id="imgContainer"></div>

            <div id="optionsContainer" style="margin-top: 15px;"></div>
            
            <button class="btn-start" id="nextBtn" style="margin-top:20px">Кийинки суроо →</button>
        </div>
    </div>

    <script>
        const testTranslations = {
            ky: {
                back: "Бардык тесттерди көрүү",
                loading: "Тест жүктөлүүдө...",
                noTestSelected: "Тест тандалган жок!",
                goToCenter: "ТЕСТТЕР БОРБОРУНА ӨТҮҮ 🚀",
                nameLabel: "Аты-жөнүңүз:",
                namePlaceholder: "Мисалы: Асан Усенов",
                classLabel: "Классыңыз:",
                classPlaceholder: "Мисалы: 8-А",
                startBtn: "ТЕСТТИ БАШТОО 🚀",
                nextBtn: "Кийинки суроо →",
                question: "Суроо"
            },
            ru: {
                back: "Просмотреть все тесты",
                loading: "Загрузка теста...",
                noTestSelected: "Тест не выбран!",
                goToCenter: "ПЕРЕЙТИ В ЦЕНТР ТЕСТОВ 🚀",
                nameLabel: "Ваше имя и фамилия:",
                namePlaceholder: "Например: Асан Усенов",
                classLabel: "Ваш класс:",
                classPlaceholder: "Например: 8-А",
                startBtn: "НАЧАТЬ ТЕСТ 🚀",
                nextBtn: "Следующий вопрос →",
                question: "Вопрос"
            },
            en: {
                back: "View all tests",
                loading: "Loading test...",
                noTestSelected: "No test selected!",
                goToCenter: "GO TO TEST CENTER 🚀",
                nameLabel: "Full Name:",
                namePlaceholder: "Example: Asan Usenov",
                classLabel: "Class / Grade:",
                classPlaceholder: "Example: 8-A",
                startBtn: "START TEST 🚀",
                nextBtn: "Next Question →",
                question: "Question"
            }
        };

        let currentLang = localStorage.getItem('site_lang') || 'ky';

        function setLanguage(lang) {
            if (!testTranslations[lang]) lang = 'ky';
            currentLang = lang;
            localStorage.setItem('site_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`lang-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');

            const t = testTranslations[lang];

            const backNavSpan = document.querySelector('#btnBack span');
            if (backNavSpan) backNavSpan.innerText = t.back;

            const lblStudentName = document.getElementById('lblStudentName');
            if (lblStudentName) lblStudentName.innerText = t.nameLabel;

            const studentNameInput = document.getElementById('studentName');
            if (studentNameInput) studentNameInput.placeholder = t.namePlaceholder;

            const lblStudentClass = document.getElementById('lblStudentClass');
            if (lblStudentClass) lblStudentClass.innerText = t.classLabel;

            const studentClassInput = document.getElementById('studentClass');
            if (studentClassInput) studentClassInput.placeholder = t.classPlaceholder;

            const startBtn = document.getElementById('startBtn');
            const urlParams = new URLSearchParams(window.location.search);
            const testId = urlParams.get('id') || urlParams.get('testId');

            if (!testId && startBtn) {
                startBtn.textContent = t.goToCenter;
                const lblTitleText = document.getElementById('lblTitleText');
                if (lblTitleText) lblTitleText.innerText = t.noTestSelected;
            } else if (startBtn && startBtn.dataset.state !== "started") {
                startBtn.textContent = t.startBtn;
            }

            const nextBtn = document.getElementById('nextBtn');
            if (nextBtn) nextBtn.innerText = t.nextBtn;

            const lblTitleText = document.getElementById('lblTitleText');
            if (lblTitleText && testId && lblTitleText.innerText.includes('жүктөлүүдө')) {
                lblTitleText.innerText = t.loading;
            }
        }
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const testId = urlParams.get('id') || urlParams.get('testId');
            
            const startBtn = document.getElementById('startBtn');
            const studentNameInput = document.getElementById('studentName');
            const studentClassInput = document.getElementById('studentClass');
            const lblTitle = document.getElementById('lblTitle');

            setLanguage(currentLang);

            if (!testId) {
                const t = testTranslations[currentLang] || testTranslations.ky;
                lblTitle.innerHTML = t.noTestSelected;
                
                startBtn.disabled = false;
                startBtn.textContent = t.goToCenter;
                
                startBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = '/tests-center.html';
                });
                return;
            }

            startBtn.disabled = true;

            function checkInputs() {
                const nameVal = studentNameInput ? studentNameInput.value.trim() : '';
                const classVal = studentClassInput ? studentClassInput.value.trim() : '';
                
                if (nameVal.length >= 2 && classVal.length >= 1) {
                    startBtn.disabled = false;
                } else {
                    startBtn.disabled = true;
                }
            }

            if (studentNameInput && studentClassInput) {
                studentNameInput.addEventListener('input', checkInputs);
                studentClassInput.addEventListener('input', checkInputs);
            }
        });
    </script>

    <script type="module" src="/js/public-test.js"></script>
    <script src="/js/anti-cheat.js"></script>

    <!-- Формулаларды иштетүү скрипти -->
    <script>
        function wrapAndRenderMath() {
            const target = document.getElementById('runningScreen');
            if (!target) return;

            const walkAndWrap = (node) => {
                if (node.nodeType === Node.TEXT_NODE) {
                    let text = node.nodeValue;
                    if (text && (text.includes('\\text{') || text.includes('\\frac{') || text.includes('\\sqrt{'))) {
                        if (!text.includes('$')) {
                            text = text.replace(/(\\text\{[^}]+\}|\\frac\{[^}]+\}\{[^}]+\}|\\sqrt\{[^}]+\})/g, '$$ $1 $$');
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = text;
                            while (tempDiv.firstChild) {
                                node.parentNode.insertBefore(tempDiv.firstChild, node);
                            }
                            node.parentNode.removeChild(node);
                        }
                    }
                } else if (node.nodeType === Node.ELEMENT_NODE && node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE') {
                    Array.from(node.childNodes).forEach(walkAndWrap);
                }
            };

            walkAndWrap(target);

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([target]).catch((err) => console.error(err));
            }
        }

        const targetNode = document.getElementById('runningScreen');
        if (targetNode) {
            const observer = new MutationObserver(() => {
                setTimeout(wrapAndRenderMath, 50);
            });
            observer.observe(targetNode, { childList: true, subtree: true });
        }
    </script>
</body>
</html>
