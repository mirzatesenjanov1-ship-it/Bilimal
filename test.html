<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн Тест — BiliMal</title>
    <!-- AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1495571814896964" crossorigin="anonymous"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#03030d; color:#fff; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .test-box { background:rgba(15,23,42,0.9); border:1px solid rgba(0,240,255,0.3); border-radius:16px; padding:30px; width:100%; max-width:650px; box-shadow:0 0 30px rgba(0,0,0,0.8); }
        .btn-start { background:linear-gradient(45deg, #00f0ff, #7000ff); color:#fff; border:none; width:100%; padding:14px; border-radius:8px; font-weight:800; font-size:1.1rem; cursor:pointer; margin-top:15px; }
        .input-field { width:100%; padding:12px; margin-top:8px; background:#020208; border:1px solid rgba(0,240,255,0.3); border-radius:6px; color:#fff; }
        .q-option { background:rgba(2,2,8,0.8); border:1px solid rgba(255,255,255,0.1); padding:12px 15px; border-radius:8px; margin-bottom:10px; cursor:pointer; transition:0.2s; }
        .q-option:hover { border-color:#00f0ff; background:rgba(0,240,255,0.1); }
        .q-option.selected { border-color:#00f0ff; background:rgba(0,240,255,0.2); }
        .timer-badge { background:rgba(255,0,85,0.2); color:#ff0055; border:1px solid #ff0055; padding:6px 12px; border-radius:20px; font-weight:800; float:right; }
        .ads-slot { margin:15px 0; text-align:center; min-height:90px; }
    </style>
</head>
<body>

    <div class="test-box">
        <!-- 1-БӨЛҮК: START SCREEN -->
        <div id="startScreen">
            <h2 style="color:#00f0ff; margin-bottom:10px" id="lblTitle">Тест жүктөлүүдө...</h2>
            <p style="color:#a5b4fc" id="lblMeta"></p>

            <div style="margin:20px 0">
                <label>Аты-жөнүңүз:</label>
                <input type="text" id="studentName" class="input-field" placeholder="Асан Усенов">
                <br><br>
                <label>Классыңыз:</label>
                <input type="text" id="studentClass" class="input-field" placeholder="7-А">
            </div>

            <!-- AdSense Жарнама Контейнери (Start Screen) -->
            <div class="ads-slot">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-1495571814896964"
                     data-ad-slot="1574613769"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>

            <button class="btn-start" id="startBtn">ТЕСТТИ БАШТОО 🚀</button>
        </div>

        <!-- 2-БӨЛҮК: TEST RUNNING -->
        <div id="runningScreen" style="display:none">
            <span class="timer-badge" id="timer">00:00</span>
            <p style="color:#00f0ff; font-weight:700" id="progress">Суроо 1/10</p>
            <h3 style="margin:20px 0" id="qText"></h3>
            <div id="optionsContainer"></div>
            <button class="btn-start" id="nextBtn" style="margin-top:20px">Кийинки суроо →</button>
        </div>
    </div>

    <script type="module" src="js/public-test.js"></script>
    <script src="js/anti-cheat.js"></script>
</body>
</html>
