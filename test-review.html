<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiLiMal • Каталарды талдоо</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- MathJax Конфигурациясы -->
    <script>
        window.MathJax = {
            tex: { 
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        * { 
            box-sizing: border-box !important; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body { 
            background-color: #0b0f19; 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            overflow-x: hidden;
            width: 100%;
        }
        .container { 
            max-width: 850px; 
            width: 100%; 
            margin: 0 auto; 
            background: #0f172a; 
            border: 1px solid #1e293b; 
            border-radius: 16px; 
            padding: 30px; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            box-sizing: border-box !important;
            overflow: hidden;
        }
        h2 { 
            color: #00f2fe; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 1.4rem; 
            word-break: break-word;
        }

        /* ТЕКСТ ЖАНА ФОРМУЛАЛАР БЛОК ИЧИНДЕ ТҮШҮҮСҮ ҮЧҮН КАТУУ СТИЛДЕР */
        .review-item { 
            background: rgba(2, 2, 8, 0.7); 
            border-radius: 10px; 
            padding: 18px; 
            margin-bottom: 15px; 
            border-left: 5px solid #ef4444; 
            line-height: 1.6; 
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
        }
        .review-item.correct { border-left-color: #10b981; }
        
        .q-title { 
            font-size: 1.05rem; 
            font-weight: bold; 
            margin-bottom: 10px; 
            color: #fff; 
            width: 100% !important;
            max-width: 100% !important;
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            display: block !important;
        }
        .ans-row { 
            font-size: 0.95rem; 
            margin-top: 6px; 
            display: block !important; 
            width: 100% !important;
            max-width: 100% !important;
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
        }
        .ans-row span, .ans-row strong {
            display: inline;
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
        }

        /* MATHJAX КОНТЕЙНЕРЛЕРИНИН СЫРТКА ЧЫГЫП КЕТПӨӨСҮ */
        mjx-container { 
            max-width: 100% !important; 
            overflow-x: auto !important;
            overflow-y: hidden !important;
            display: inline-block !important;
            vertical-align: middle !important;
        }
        mjx-container svg {
            max-width: 100% !important;
            height: auto !important;
        }

        .back-btn { 
            display: inline-block; 
            margin-top: 20px; 
            background: #1e293b; 
            color: #fff; 
            padding: 10px 20px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-weight: 600; 
            border: 1px solid #334155; 
            transition: 0.3s;
        }
        .back-btn:hover { background: #334155; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 16px 12px; }
            .review-item { padding: 12px; }
            h2 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fa-solid fa-clipboard-check"></i> Тесттин жыйынтыгы жана каталар талдоосу</h2>
        <div id="reviewContainer">
            <p style="color: #94a3b8;">Маалыматтар жүктөлүүдө...</p>
        </div>
        <a href="javascript:history.back()" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Артка кайтуу</a>
    </div>

    <script>
        function prepareMathText(text) {
            if (!text) return '';
            let str = String(text);
            if ((str.includes('\\text') || str.includes('\\frac') || str.includes('^')) && !str.includes('$')) {
                return `$${str}$`;
            }
            return str;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('reviewContainer');
            const reviewData = JSON.parse(localStorage.getItem('student_test_review') || '[]');

            if (reviewData.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <i class="fa-solid fa-lock" style="font-size: 3rem; color: #ef4444; margin-bottom: 15px;"></i>
                        <h3 style="color: #fff; margin-bottom: 10px;">Каталарды көрүүгө уруксат жок!</h3>
                        <p style="color: #94a3b8; font-size: 0.95rem;">Мугалим бул тест үчүн каталарды жана жоопторду көрүүгө уруксат берген эмес же тест аяктаган жок.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            reviewData.forEach((item, index) => {
                const isCorrect = item.isCorrect;
                const div = document.createElement('div');
                div.className = `review-item ${isCorrect ? 'correct' : ''}`;
                
                div.innerHTML = `
                    <div class="q-title">${index + 1}. ${prepareMathText(item.questionText)}</div>
                    <div class="ans-row"><strong style="color:${isCorrect ? '#10b981' : '#ef4444'}">Сиздин жооп:</strong> <span>${prepareMathText(item.studentAnswer)}</span></div>
                    ${!isCorrect ? `<div class="ans-row"><strong style="color:#10b981">Туура жооп:</strong> <span>${prepareMathText(item.correctAnswer)}</span></div>` : ''}
                    <div style="font-size: 0.8rem; color: #64748b; margin-top: 8px;">Жумшалган убакыт: ${item.timeSpent || '0'} сек</div>
                `;
                container.appendChild(div);
            });

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([container]).catch((err) => console.error("MathJax error:", err));
            }
        });
    </script>
</body>
</html>
