<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiLiMal • Каталарды талдоо</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; padding: 20px; }
        .container { max-width: 800px; width: 100%; margin: 0 auto; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 30px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        h2 { color: #00f2fe; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .review-item { background: rgba(2, 2, 8, 0.7); border-radius: 10px; padding: 18px; margin-bottom: 15px; border-left: 5px solid #ef4444; }
        .review-item.correct { border-left-color: #10b981; }
        .q-title { font-size: 1.05rem; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .ans-row { font-size: 0.95rem; margin-top: 6px; display: flex; gap: 8px; }
        .back-btn { display: inline-block; margin-top: 20px; background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; border: 1px solid #334155; }
        .back-btn:hover { background: #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fa-solid fa-clipboard-check"></i> Тесттин жыйынтыгы жана каталар талдоосу</h2>
        <div id="reviewContainer">
            <p style="color: #94a3b8;">Маалыматтар жүктөлүүдө...</p>
        </div>
        <a href="javascript:history.back()" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Артка кайтуу</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('reviewContainer');
            const reviewData = JSON.parse(localStorage.getItem('student_test_review') || '[]');

            if (reviewData.length === 0) {
                container.innerHTML = `<p style="color: #ef4444; text-align: center; padding: 30px;">Каталар тууралуу маалымат табылган жок же мугалим уруксат берген эмес.</p>`;
                return;
            }

            container.innerHTML = '';
            reviewData.forEach((item, index) => {
                const isCorrect = item.isCorrect;
                const div = document.createElement('div');
                div.className = `review-item ${isCorrect ? 'correct' : ''}`;
                div.innerHTML = `
                    <div class="q-title">${index + 1}. ${item.questionText}</div>
                    <div class="ans-row"><strong style="color:${isCorrect ? '#10b981' : '#ef4444'}">Сиздин жооп:</strong> ${item.studentAnswer}</div>
                    ${!isCorrect ? `<div class="ans-row"><strong style="color:#10b981">Туура жооп:</strong> ${item.correctAnswer}</div>` : ''}
                    <div style="font-size: 0.8rem; color: #64748b; margin-top: 8px;">Жумшалган убакыт: ${item.timeSpent || '0'} сек</div>
                `;
                container.appendChild(div);
            });
        });
    </script>
</body>
</html>
