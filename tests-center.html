<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Борбору — BiliMal</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GSQV60QV0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9GSQV60QV0');
    </script>

    <!-- FontAwesome жана AdSense -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1495571814896964" crossorigin="anonymous"></script>
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#03030d; color:#fff; min-height:100vh; padding:20px 5%; }
        
        header { text-align: center; margin-bottom: 30px; position: relative; }
        header h1 { color: #00f0ff; font-size: 2.2rem; margin-bottom: 8px; }
        header p { color: #a5b4fc; font-size: 1rem; }

        /* 🌐 LANGUAGE SELECTOR STYLES */
        .lang-selector-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }
        .lang-selector { display: flex; gap: 6px; }
        .lang-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #9ca3af;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-btn:hover, .lang-btn.active {
            background: #00f0ff;
            color: #03030d;
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        /* Издөө тилкеси */
        .search-box { max-width: 700px; margin: 0 auto 25px; position: relative; }
        .search-box input { width: 100%; padding: 14px 20px 14px 45px; background: rgba(15,23,42,0.8); border: 1px solid rgba(0,240,255,0.4); border-radius: 30px; color: #fff; font-size: 1rem; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: #00f0ff; box-shadow: 0 0 15px rgba(0,240,255,0.3); }
        .search-box i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #00f0ff; }

        /* Фильтрлер */
        .filter-section { display: flex; flex-direction: column; gap: 15px; max-width: 900px; margin: 0 auto 30px; align-items: center; }
        .filter-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .filter-btn { background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.1); color: #a5b4fc; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: 0.3s; }
        .filter-btn:hover, .filter-btn.active { background: #00f0ff; color: #000; font-weight: bold; border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.4); }

        /* Тесттер сеткасы */
        .tests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        
        /* Карточка дизайны */
        .test-card { background: rgba(15,23,42,0.9); border: 1px solid rgba(0,240,255,0.2); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; backdrop-filter: blur(8px); }
        .test-card:hover { transform: translateY(-5px); border-color: #00f0ff; box-shadow: 0 0 20px rgba(0,240,255,0.2); }
        
        .card-tag { display: inline-block; background: rgba(0,240,255,0.1); color: #00f0ff; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; margin-bottom: 10px; align-self: flex-start; }
        .card-title { font-size: 1.2rem; color: #fff; margin-bottom: 8px; font-weight: 700; }
        .card-topic { color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px; }
        
        .card-meta { display: flex; justify-content: space-between; color: #a5b4fc; font-size: 0.85rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; margin-bottom: 15px; }
        
        .btn-start-test { display: block; text-align: center; background: linear-gradient(45deg, #00f0ff, #0077ff); color: #fff; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: 700; transition: 0.3s; }
        .btn-start-test:hover { box-shadow: 0 0 15px rgba(0,240,255,0.5); }

        /* Жарнама блогу */
        .ad-card { grid-column: 1 / -1; background: rgba(2,2,8,0.5); border: 1px dashed rgba(0,240,255,0.2); border-radius: 14px; padding: 15px; text-align: center; }
    </style>
</head>
<body>

    <!-- 🌐 LANGUAGE SELECTOR -->
    <div class="lang-selector-container">
        <div class="lang-selector">
            <button class="lang-btn" id="lang-ky" onclick="setLanguage('ky')">KG</button>
            <button class="lang-btn" id="lang-ru" onclick="setLanguage('ru')">RU</button>
            <button class="lang-btn" id="lang-en" onclick="setLanguage('en')">EN</button>
        </div>
    </div>

    <header>
        <h1 id="headerTitle">🎓 BiliMal Тест Борбору</h1>
        <p id="headerSub">Билимиңизди текшериңиз, даярданыңыз жана ачык тесттерди тапшырыңыз</p>
    </header>

    <!-- 1. ИЗДӨӨ -->
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Тесттин аталышы, предмети же темасы боюнча издөө...">
    </div>

    <!-- 2. ФИЛЬТРЛЕР -->
    <div class="filter-section">
        <!-- Предметтер -->
        <div class="filter-group" id="subjectFilters">
            <button class="filter-btn active" data-subject="all" id="sub-all">Бардык предметтер</button>
            <button class="filter-btn" data-subject="Физика" id="sub-physics">⚛️ Физика</button>
            <button class="filter-btn" data-subject="Математика" id="sub-math">📐 Математика</button>
            <button class="filter-btn" data-subject="Химия" id="sub-chemistry">🧪 Химия</button>
            <button class="filter-btn" data-subject="Биология" id="sub-biology">🌱 Биология</button>
            <button class="filter-btn" data-subject="Кыргыз тили" id="sub-kyrgyz">📖 Кыргыз тили</button>
            <button class="filter-btn" data-subject="Информатика" id="sub-cs">💻 Информатика</button>
        </div>

        <!-- Класстар -->
        <div class="filter-group" id="gradeFilters">
            <button class="filter-btn active" data-grade="all" id="grade-all">Бардык класстар</button>
            <button class="filter-btn" data-grade="5" id="grade-5">5-класс</button>
            <button class="filter-btn" data-grade="6" id="grade-6">6-класс</button>
            <button class="filter-btn" data-grade="7" id="grade-7">7-класс</button>
            <button class="filter-btn" data-grade="8" id="grade-8">8-класс</button>
            <button class="filter-btn" data-grade="9" id="grade-9">9-класс</button>
            <button class="filter-btn" data-grade="10" id="grade-10">10-класс</button>
            <button class="filter-btn" data-grade="11" id="grade-11">11-класс</button>
        </div>
    </div>

    <!-- 3. ТЕСТТЕР КАТАЛОГУ -->
    <div class="tests-grid" id="testsGrid">
        <p style="color:#94a3b8; text-align:center; grid-column: 1/-1;" id="loadingText"><i class="fa-solid fa-spinner fa-spin"></i> Тесттер жүктөлүүдө...</p>
    </div>

    <!-- 🌐 TRANSLATIONS & LOCALIZATION SYSTEM -->
    <script>
        const centerTranslations = {
            ky: {
                headerTitle: "🎓 BiliMal Тест Борбору",
                headerSub: "Билимиңизди текшериңиз, даярданыңыз жана ачык тесттерди тапшырыңыз",
                searchPlaceholder: "Тесттин аталышы, предмети же темасы боюнча издөө...",
                subAll: "Бардык предметтер",
                subPhysics: "⚛️ Физика",
                subMath: "📐 Математика",
                subChemistry: "🧪 Химия",
                subBiology: "🌱 Биология",
                subKyrgyz: "📖 Кыргыз тили",
                subCs: "💻 Информатика",
                gradeAll: "Бардык класстар",
                gradeSuffix: "-класс",
                loading: "Тесттер жүктөлүүдө..."
            },
            ru: {
                headerTitle: "🎓 Центр Тестирования BiliMal",
                headerSub: "Проверьте свои знания, готовьтесь и проходите открытые тесты",
                searchPlaceholder: "Поиск по названию теста, предмету или теме...",
                subAll: "Все предметы",
                subPhysics: "⚛️ Физика",
                subMath: "📐 Математика",
                subChemistry: "🧪 Химия",
                subBiology: "🌱 Биология",
                subKyrgyz: "📖 Кыргызский язык",
                subCs: "💻 Информатика",
                gradeAll: "Все классы",
                gradeSuffix: " класс",
                loading: "Загрузка тестов..."
            },
            en: {
                headerTitle: "🎓 BiliMal Testing Center",
                headerSub: "Test your knowledge, prepare, and take open tests",
                searchPlaceholder: "Search by test title, subject, or topic...",
                subAll: "All Subjects",
                subPhysics: "⚛️ Physics",
                subMath: "📐 Mathematics",
                subChemistry: "🧪 Chemistry",
                subBiology: "🌱 Biology",
                subKyrgyz: "📖 Kyrgyz Language",
                subCs: "💻 Computer Science",
                gradeAll: "All Grades",
                gradeSuffix: " Grade",
                loading: "Loading tests..."
            }
        };

        let currentLang = localStorage.getItem('site_lang') || 'ky';

        function setLanguage(lang) {
            if (!centerTranslations[lang]) lang = 'ky';
            currentLang = lang;
            localStorage.setItem('site_lang', lang);

            // Active баскычты белгилөө
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`lang-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');

            const t = centerTranslations[lang];

            // Тексттерди алмаштыруу
            document.getElementById('headerTitle').innerText = t.headerTitle;
            document.getElementById('headerSub').innerText = t.headerSub;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;

            document.getElementById('sub-all').innerText = t.subAll;
            document.getElementById('sub-physics').innerText = t.subPhysics;
            document.getElementById('sub-math').innerText = t.subMath;
            document.getElementById('sub-chemistry').innerText = t.subChemistry;
            document.getElementById('sub-biology').innerText = t.subBiology;
            document.getElementById('sub-kyrgyz').innerText = t.subKyrgyz;
            document.getElementById('sub-cs').innerText = t.subCs;

            document.getElementById('grade-all').innerText = t.gradeAll;
            for (let i = 5; i <= 11; i++) {
                const gBtn = document.getElementById(`grade-${i}`);
                if (gBtn) {
                    gBtn.innerText = lang === 'en' ? `Grade ${i}` : `${i}${t.gradeSuffix}`;
                }
            }

            const loadingEl = document.getElementById('loadingText');
            if (loadingEl) {
                loadingEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${t.loading}`;
            }

            // Динамикалык рендерленген карточкаларды жаңылоо үчүн CustomEvent жиберүү
            window.dispatchEvent(new CustomEvent('languageChanged', { detail: { lang: lang } }));
        }

        document.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLang);
        });
    </script>

    <script type="module" src="/js/public-tests-center.js"></script>
</body>
</html>
