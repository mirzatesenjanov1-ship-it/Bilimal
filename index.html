    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: auto;
            background-color: #05050e;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }
    </style>

    <canvas id="space-canvas"></canvas>

    <div id="quest-banner-container"></div>
    <div id="story-modal" style="display: none;"></div>

    <script>
        // Canvas жана Контекстти баштоо
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        // Кара тешиктин координаталык коэффициенттери
        const BH_OFFSET_X = 0.5;
        const BH_OFFSET_Y = 0.4;
        let bhRotation = 0;

        // Инициализация функциялары
        function createStarPool(count, maxRadius, maxSpeed) {
            let pool = [];
            for (let i = 0; i < count; i++) {
                pool.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * maxRadius + 0.5,
                    speed: Math.random() * maxSpeed + 0.1,
                    alpha: Math.random(),
                    twinkleSpeed: Math.random() * 0.02 + 0.005,
                    twinkleDir: Math.random() > 0.5 ? 1 : -1,
                    isStatic: Math.random() > 0.8
                });
            }
            return pool;
        }

        function createDustPool(count) {
            let pool = [];
            for (let i = 0; i < count; i++) {
                pool.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 300 + 200,
                    alpha: Math.random() * 0.02 + 0.01,
                    vx: (Math.random() - 0.5) * 0.08,
                    color: `rgba(${Math.floor(Math.random()*50)}, ${Math.floor(Math.random()*100+50)}, ${Math.floor(Math.random()*150+100)}, `
                });
            }
            return pool;
        }

        // Жылдыздар, тумандуулук жана атомдор
        let starsLayer1 = createStarPool(100, 1, 0.2);
        let starsLayer2 = createStarPool(60, 1.5, 0.5);
        let starsLayer3 = createStarPool(30, 2.5, 0.8);
        let dustClouds = createDustPool(15);

        let atoms = [
            { x: window.innerWidth * 0.2, y: window.innerHeight * 0.3, r: 40, angle: 0 },
            { x: window.innerWidth * 0.8, y: window.innerHeight * 0.7, r: 50, angle: 1 }
        ];

        function renderStars(layer, baseBrightness) {
            ctx.fillStyle = baseBrightness;
            layer.forEach(star => {
                star.x -= star.speed;
                if (star.x < 0) star.x = canvas.width;

                if (!star.isStatic) {
                    star.alpha += star.twinkleSpeed * star.twinkleDir;
                    if (star.alpha >= 1) { star.alpha = 1; star.twinkleDir = -1; }
                    else if (star.alpha <= 0.1) { star.alpha = 0.1; star.twinkleDir = 1; }
                }

                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function renderNebula() {
            dustClouds.forEach(dust => {
                dust.x += dust.vx;
                if (dust.x < -dust.radius) dust.x = canvas.width + dust.radius;
                if (dust.x > canvas.width + dust.radius) dust.x = -dust.radius;

                let grad = ctx.createRadialGradient(dust.x, dust.y, 0, dust.x, dust.y, dust.radius);
                grad.addColorStop(0, dust.color + dust.alpha + ')');
                grad.addColorStop(1, 'rgba(0,0,0,0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(dust.x, dust.y, dust.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function renderAstrophysicalBlackHole(x, y) {
            bhRotation += 0.001; 
            const bhRadius = Math.min(canvas.width, canvas.height) * 0.07; 

            // 1. Арткы аккрециялык диск
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-12 * Math.PI / 180); 
            
            let diskGrad = ctx.createLinearGradient(-bhRadius * 4, 0, bhRadius * 4, 0);
            diskGrad.addColorStop(0, 'rgba(255, 90, 20, 0.1)');  
            diskGrad.addColorStop(0.3, 'rgba(255, 160, 50, 0.6)'); 
            diskGrad.addColorStop(0.7, 'rgba(180, 240, 255, 0.9)'); 
            diskGrad.addColorStop(1, 'rgba(100, 200, 255, 0.2)');

            ctx.beginPath();
            ctx.ellipse(0, 0, bhRadius * 3.5, bhRadius * 0.8, 0, Math.PI, Math.PI * 2);
            ctx.lineWidth = bhRadius * 0.5;
            ctx.strokeStyle = diskGrad;
            ctx.stroke();

            let innerDiskGrad = ctx.createLinearGradient(-bhRadius * 2.5, 0, bhRadius * 2.5, 0);
            innerDiskGrad.addColorStop(0, 'rgba(0,0,0,0)'); 
            innerDiskGrad.addColorStop(0.8, 'rgba(255, 255, 255, 0.7)'); 
            innerDiskGrad.addColorStop(1, 'rgba(0,0,0,0)');
            
            ctx.beginPath();
            ctx.ellipse(0, 0, bhRadius * 2.5, bhRadius * 0.4, 0, Math.PI, Math.PI * 2);
            ctx.lineWidth = bhRadius * 0.2;
            ctx.strokeStyle = innerDiskGrad;
            ctx.stroke();
            ctx.restore(); 

            // 2. Гравитациялык линзалоо шакекчеси
            let ringGrad = ctx.createRadialGradient(x, y, bhRadius * 0.95, x, y, bhRadius * 1.8);
            ringGrad.addColorStop(0, '#000000');
            ringGrad.addColorStop(0.08, 'rgba(255, 255, 255, 0.9)'); 
            ringGrad.addColorStop(0.2, 'rgba(255, 140, 50, 0.5)');  
            ringGrad.addColorStop(0.7, 'rgba(50, 20, 80, 0.15)');
            ringGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = ringGrad;
            ctx.beginPath();
            ctx.arc(x, y, bhRadius * 1.8, 0, Math.PI * 2);
            ctx.fill();

            // 3. Окуялар горизонту (Кара тешик)
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(x, y, bhRadius, 0, Math.PI * 2);
            ctx.fill();

            // 4. Алдыңкы аккрециялык диск
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-12 * Math.PI / 180); 
            
            ctx.beginPath();
            ctx.ellipse(0, 0, bhRadius * 3.5, bhRadius * 0.8, 0, 0, Math.PI);
            ctx.lineWidth = bhRadius * 0.5;
            ctx.strokeStyle = diskGrad;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, 0, bhRadius * 2.5, bhRadius * 0.4, 0, 0, Math.PI);
            ctx.lineWidth = bhRadius * 0.2;
            ctx.strokeStyle = innerDiskGrad;
            ctx.stroke();
            ctx.restore();
        } 

        function drawAtom(atom) {
            atom.angle += 0.02;
            ctx.fillStyle = '#ff00ff';
            ctx.beginPath();
            ctx.arc(atom.x, atom.y, 6, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
            ctx.lineWidth = 1;
            
            ctx.save();
            ctx.translate(atom.x, atom.y);
            ctx.rotate(Math.PI / 4);
            ctx.beginPath();
            ctx.ellipse(0, 0, atom.r, atom.r / 2, 0, 0, Math.PI * 2);
            ctx.stroke();
            
            let e1x = atom.r * Math.cos(atom.angle);
            let e1y = (atom.r / 2) * Math.sin(atom.angle);
            ctx.fillStyle = '#00f0ff';
            ctx.beginPath();
            ctx.arc(e1x, e1y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.translate(atom.x, atom.y);
            ctx.rotate(-Math.PI / 4);
            ctx.beginPath();
            ctx.ellipse(0, 0, atom.r, atom.r / 2, 0, 0, Math.PI * 2);
            ctx.stroke();

            let e2x = atom.r * Math.cos(-atom.angle * 1.2);
            let e2y = (atom.r / 2) * Math.sin(-atom.angle * 1.2);
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(e2x, e2y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            renderNebula();
            renderStars(starsLayer1, '#777777'); 
            renderStars(starsLayer2, '#bbbbbb'); 
            renderStars(starsLayer3, '#ffffff'); 

            let bhX = canvas.width * BH_OFFSET_X;
            let bhY = canvas.height * BH_OFFSET_Y;
            renderAstrophysicalBlackHole(bhX, bhY);

            atoms.forEach(atom => drawAtom(atom));

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            atoms[0].x = canvas.width * 0.2;
            atoms[0].y = canvas.height * 0.3;
            atoms[1].x = canvas.width * 0.8;
            atoms[1].y = canvas.height * 0.7;
        });

        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            animate();
            
            fetch('sections/quest-banner.html')
                .then(response => {
                    if (!response.ok) throw new Error('Файл табылган жок');
                    return response.text();
                })
                .then(data => {
                    const banner = document.getElementById('quest-banner-container');
                    if (banner) banner.innerHTML = data;
                })
                .catch(err => console.error('Квест баннерин жүктөөдө ката чыкты:', err));
            
            const userEmail = localStorage.getItem('bilimal_user_email');
            const userPass = localStorage.getItem('bilimal_user_pass');
            const loginModal = document.getElementById('login-modal');
            
            if (userEmail && userPass) {
                if (loginModal) loginModal.style.display = 'none';
            } else {
                localStorage.setItem('bilimal_user_email', 'guest@bilimal.org');
                localStorage.setItem('bilimal_user_pass', 'guest12345');
                localStorage.setItem('bilimal_user_role', 'guest');
                if (loginModal) loginModal.style.display = 'none';
                document.body.style.overflow = 'auto'; 
            }

            const savedLang = localStorage.getItem('bilimal_lang') || 'ky';
            changeLanguage(savedLang);
            checkStoryStatus();
        });

        function loginUser() {
            const emailInput = document.getElementById('email-input').value;
            const passwordInput = document.getElementById('password-input').value;
            const policyCheckbox = document.getElementById('policy-checkbox').checked;
            
            if (!policyCheckbox) {
                alert('Сураныч, Купуялык саясатынын шарттарына макулдугуңузду билдириңиз!');
                return;
            }

            if (emailInput.includes('@') && emailInput.includes('.') && passwordInput.length >= 6) {
                localStorage.setItem('bilimal_user_email', emailInput);
                localStorage.setItem('bilimal_user_pass', passwordInput);
                localStorage.setItem('bilimal_user_role', 'user');
                
                const loginModal = document.getElementById('login-modal');
                if (loginModal) loginModal.style.display = 'none';
                alert('Кош келиңиз! Ийгиликтүү кирдиңиз.');
                document.body.style.overflow = 'auto';
            } else if (passwordInput.length < 6) {
                alert('Пароль кеминде 6 белгиден турушу керек!');
            } else {
                alert('Сураныч, туура электрондук почта жазыңыз.');
            }
        }

        function loginAsGuest() {
            localStorage.setItem('bilimal_user_email', 'guest@bilimal.org');
            localStorage.setItem('bilimal_user_pass', 'guest12345');
            localStorage.setItem('bilimal_user_role', 'guest');
            
            const loginModal = document.getElementById('login-modal');
            if (loginModal) loginModal.style.display = 'none';
            document.body.style.overflow = 'auto';
            alert('Конок режими ийгиликтүү иштетилди! Бардык мазмун ачык.');
        }

        function checkStoryStatus() {
            const storySeen = localStorage.getItem('bilimal_story_seen');
            if (!storySeen) {
                fetch('sections/quest-intro.html')
                    .then(response => {
                        if (!response.ok) throw new Error('Окуя файлы табылбады');
                        return response.text();
                    })
                    .then(data => {
                        const modal = document.getElementById('story-modal');
                        if (modal) {
                            modal.innerHTML = data;
                            modal.style.display = 'flex';
                            document.body.style.overflow = 'hidden';
                        }
                    })
                    .catch(err => console.error('Окуяны жүктөөдө ката:', err));
            }
        }

        function startQuestJourney() {
            localStorage.setItem('bilimal_story_seen', 'true');
            const storyModal = document.getElementById('story-modal');
            if (storyModal) storyModal.style.display = 'none';
            document.body.style.overflow = 'auto';
            alert('Саякат башталды! Сизге 1-деңгээлдеги Механика Өрөөнү ачылды! 🚀');
        }

        function changeLanguage(lang) {
            if (!translations[lang]) return;
            localStorage.setItem('bilimal_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-lang-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');

            const t = translations[lang];

            const elements = {
                'nav-home': t.navHome,
                'nav-dashboard': t.navDashboard,
                'hero-title': t.heroTitle,
                'hero-desc': t.heroDesc,
                'card-kinder-title': t.kinderTitle,
                'card-kinder-desc': t.kinderDesc,
                'card-kinder-btn': t.kinderBtn,
                'card-school-title': t.schoolTitle,
                'card-school-desc': t.schoolDesc,
                'card-school-btn': t.schoolBtn,
                'card-books-title': t.booksTitle,
                'card-books-desc': t.booksDesc,
                'card-books-btn': t.booksBtn,
                'card-games-title': t.gamesTitle,
                'card-games-desc': t.gamesDesc,
                'card-games-btn': t.gamesBtn,
                'card-tank-title': t.tankTitle,
                'card-tank-desc': t.tankDesc,
                'card-tank-btn': t.tankBtn,
                'card-test-title': t.testTitle,
                'card-test-desc': t.testDesc,
                'card-test-btn': t.testBtn,
                'card-plans-title': t.plansTitle,
                'card-plans-desc': t.plansDesc,
                'card-plans-btn': t.plansBtn,
                'card-physics-title': t.physicsTitle,
                'card-physics-desc': t.physicsDesc,
                'card-physics-btn': t.physicsBtn,
                'card-lab-title': t.labTitle,
                'card-lab-desc': t.labDesc,
                'card-lab-btn': t.labBtn,
                'card-author-title': t.authorTitle,
                'card-author-desc': t.authorDesc,
                'card-author-btn': t.authorBtn,
                'footer-text': t.footerText,
                'footer-policy': t.footerPolicy,
                'txt-login-title': t.loginTitle,
                'txt-login-welcome': t.loginWelcome,
                'btn-login-submit': t.btnLogin,
                'btn-login-demo': t.btnDemo
            };

            for (let id in elements) {
                let el = document.getElementById(id);
                if (el && elements[id]) el.innerText = elements[id];
            }

            if (document.getElementById('email-input')) document.getElementById('email-input').placeholder = t.emailPlaceholder;
            if (document.getElementById('password-input')) document.getElementById('password-input').placeholder = t.passPlaceholder;
            
            const policyContainer = document.getElementById('txt-policy-text');
            if (policyContainer) {
                policyContainer.innerHTML = `${t.policySpan}<a href="pages/privacy-policy.html" target="_blank">${t.policyLink}</a>${t.policyEnd}`;
            }
        }

        // Коргоо механизми
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            alert("Эскертүү: Автордук укук корголгон! Көчүрүүгө тыюу салынат.");
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === "F12") { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
                e.preventDefault(); return false;
            }
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) { alert("Көчүрүүгө бөгөт коюлган!"); e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); return false; }
        });
    </script>
</body>
</html>
