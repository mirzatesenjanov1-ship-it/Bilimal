        * {

        body {

        }
        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }
        /* Негизги модалдык терезелердин стили */

            display: flex;
            position: fixed;
            top: 0;
            left: 0;

            align-items: center;
            z-index: 1000;

            background: #111827;
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            border: 1px solid #374151;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

            font-weight: bold;
            border-bottom: 2px solid #3b82f6;
        }

    <script>
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');

        let BH_OFFSET_X = 0.5;
        let BH_OFFSET_Y = 0.4;
        let bhRotation = 0;

        let starsLayer1 = [];
        let starsLayer2 = [];
        let starsLayer3 = [];
        let dustClouds = [];
        let atoms = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initSpaceObjects();
        }

        function createStars(count, speed, minRadius, maxRadius) {
            let stars = [];
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * (maxRadius - minRadius) + minRadius,
                    speed: speed,
                    alpha: Math.random(),
                    twinkleSpeed: Math.random() * 0.02 + 0.005,
                    twinkleDir: Math.random() > 0.5 ? 1 : -1,
                    isStatic: Math.random() > 0.8
                });
            }
            return stars;
        }

        function createDustPool(count) {
            let pool = [];
            for (let i = 0; i < count; i++) {
                pool.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 300 + 200,
                    alpha: Math.random() * 0.02 + 0.01,
                    vx: (Math.random() - 0.5) * 0.08,
                    color: `rgba(${Math.floor(Math.random()*50)}, ${Math.floor(Math.random()*100+50)}, ${Math.floor(Math.random()*150+100)}, `
                });
            }
            return pool;
        }

        function initSpaceObjects() {
            starsLayer1 = createStars(150, 0.2, 0.5, 1.2);
            starsLayer2 = createStars(100, 0.5, 1.0, 1.8);
            starsLayer3 = createStars(50, 0.8, 1.5, 2.5);
            dustClouds = createDustPool(15);
            
            atoms = [
                { x: canvas.width * 0.2, y: canvas.height * 0.3, r: 40, angle: 0 },
                { x: canvas.width * 0.8, y: canvas.height * 0.7, r: 50, angle: 2 }
            ];
        }

        function renderStars(layer, baseBrightness) {
            ctx.fillStyle = baseBrightness;
            layer.forEach(star => {
                star.x -= star.speed;
                if (star.x < 0) star.x = canvas.width;

                if (!star.isStatic) {
                    star.alpha += star.twinkleSpeed * star.twinkleDir;
                    if (star.alpha >= 1) { star.alpha = 1; star.twinkleDir = -1; }
                    else if (star.alpha <= 0.1) { star.alpha = 0.1; star.twinkleDir = 1; }
                }

                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function renderNebula() {
            dustClouds.forEach(dust => {
                dust.x += dust.vx;
                if (dust.x < -dust.radius) dust.x = canvas.width + dust.radius;
                if (dust.x > canvas.width + dust.radius) dust.x = -dust.radius;

                let grad = ctx.createRadialGradient(dust.x, dust.y, 0, dust.x, dust.y, dust.radius);
                grad.addColorStop(0, dust.color + dust.alpha + ')');
                grad.addColorStop(1, 'rgba(0,0,0,0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(dust.x, dust.y, dust.radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function renderAstrophysicalBlackHole(x, y) {
            bhRotation += 0.001; 
            const bhRadius = Math.min(canvas.width, canvas.height) * 0.07; 

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-12 * Math.PI / 180); 
            
            let diskGrad = ctx.createLinearGradient(-bhRadius * 4, 0, bhRadius * 4, 0);
            diskGrad.addColorStop(0, 'rgba(255, 90, 20, 0.1)');  
            diskGrad.addColorStop(0.3, 'rgba(255, 160, 50, 0.6)'); 
            diskGrad.addColorStop(0.7, 'rgba(180, 240, 255, 0.9)'); 
            diskGrad.addColorStop(1, 'rgba(100, 200, 255, 0.2)');

            ctx.beginPath();
            ctx.ellipse(0, 0, bhRadius * 3.5, bhRadius * 0.8, 0, Math.PI, Math.PI * 2);
            ctx.lineWidth = bhRadius * 0.5;
            ctx.strokeStyle = diskGrad;
            ctx.stroke();

            let innerDiskGrad = ctx.createLinearGradient(-bhRadius * 2.5, 0, bhRadius * 2.5, 0);
            innerDiskGrad.addColorStop(0, 'rgba(0,0,0,0)'); 
            innerDiskGrad.addColorStop(0.8, 'rgba(255, 255, 255, 0.7)'); 
            innerDiskGrad.addColorStop(1, 'rgba(0,0,0,0)');
            
            ctx.beginPath();
            ctx.ellipse(0, 0, bhRadius * 2.5, bhRadius * 0.4, 0, Math.PI, Math.PI * 2);
            ctx.lineWidth = bhRadius * 0.2;
            ctx.strokeStyle = innerDiskGrad;
            ctx.stroke();
            ctx.restore(); 

            let ringGrad = ctx.createRadialGradient(x, y, bhRadius * 0.95, x, y, bhRadius * 1.8);
            ringGrad.addColorStop(0, '#000000');
            ringGrad.addColorStop(0.08, 'rgba(255, 255, 255, 0.9)'); 
            ringGrad.addColorStop(0.2, 'rgba(255, 140, 50, 0.5)');  
            ringGrad.addColorStop(0.7, 'rgba(50, 20, 80, 0.15)');
            ringGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = ringGrad;
            ctx.beginPath();
            ctx.arc(x, y, bhRadius * 1.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(x, y, bhRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-12 * Math.PI / 180); 
            
            ctx.beginPath();
            ctx.ellipse(0, 0, bhRadius * 3.5, bhRadius * 0.8, 0, 0, Math.PI);
            ctx.lineWidth = bhRadius * 0.5;
            ctx.strokeStyle = diskGrad;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, 0, bhRadius * 2.5, bhRadius * 0.4, 0, 0, Math.PI);
            ctx.lineWidth = bhRadius * 0.2;
            ctx.strokeStyle = innerDiskGrad;
            ctx.stroke();
            ctx.restore();
        } 

        function drawAtom(atom) {
            atom.angle += 0.02;
            ctx.fillStyle = '#ff00ff';
            ctx.beginPath();
            ctx.arc(atom.x, atom.y, 6, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.save();
            ctx.translate(atom.x, atom.y);
            ctx.rotate(Math.PI / 4);
            ctx.beginPath();
            ctx.ellipse(0, 0, atom.r, atom.r / 2, 0, 0, Math.PI * 2);
            ctx.stroke();
            
            let e1x = atom.r * Math.cos(atom.angle);
            let e1y = (atom.r / 2) * Math.sin(atom.angle);
            ctx.fillStyle = '#00f0ff';
            ctx.beginPath();
            ctx.arc(e1x, e1y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.translate(atom.x, atom.y);
            ctx.rotate(-Math.PI / 4);
            ctx.beginPath();
            ctx.ellipse(0, 0, atom.r, atom.r / 2, 0, 0, Math.PI * 2);
            ctx.stroke();

            let e2x = atom.r * Math.cos(-atom.angle * 1.2);
            let e2y = (atom.r / 2) * Math.sin(-atom.angle * 1.2);
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(e2x, e2y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            renderNebula();
            renderStars(starsLayer1, '#777777'); 
            renderStars(starsLayer2, '#bbbbbb'); 
            renderStars(starsLayer3, '#ffffff'); 

            let bhX = canvas.width * BH_OFFSET_X;
            let bhY = canvas.height * BH_OFFSET_Y;
            renderAstrophysicalBlackHole(bhX, bhY);

            atoms.forEach(atom => drawAtom(atom));

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            animate();
            
            fetch('sections/quest-banner.html')
                .then(response => {
                    if (!response.ok) throw new Error('Файл табылган жок');
                    return response.text();
                })
                .then(data => {
                    const banner = document.getElementById('quest-banner-container');
                    if (banner) banner.innerHTML = data;
                })
                .catch(err => console.error('Квест баннерин жүктөөдө ката чыкты:', err));
            
            const userEmail = localStorage.getItem('bilimal_user_email');
            const userPass = localStorage.getItem('bilimal_user_pass');
            
            const loginModal = document.getElementById('login-modal');
            if (userEmail && userPass) {
                if (loginModal) loginModal.style.display = 'none';
            } else {
                localStorage.setItem('bilimal_user_email', 'guest@bilimal.org');
                localStorage.setItem('bilimal_user_pass', 'guest12345');
                localStorage.setItem('bilimal_user_role', 'guest');
                if (loginModal) loginModal.style.display = 'none';
                document.body.style.overflow = 'auto'; 
            }

            const savedLang = localStorage.getItem('bilimal_lang') || 'ky';
            changeLanguage(savedLang);
            checkStoryStatus();
        });

        function loginUser() {
            const emailInput = document.getElementById('email-input').value;
            const passwordInput = document.getElementById('password-input').value;
            const policyCheckbox = document.getElementById('policy-checkbox').checked;
            
            if (!policyCheckbox) {
                alert('Сураныч, Купуялык саясатынын шарттарына макулдугуңузду билдириңиз!');
                return;
            }

            if (emailInput.includes('@') && emailInput.includes('.') && passwordInput.length >= 6) {
                localStorage.setItem('bilimal_user_email', emailInput);
                localStorage.setItem('bilimal_user_pass', passwordInput);
                localStorage.setItem('bilimal_user_role', 'user');
                
                document.getElementById('login-modal').style.display = 'none';
                alert('Кош келиңиз! Ийгиликтүү кирдиңиз.');
                document.body.style.overflow = 'auto';
            } else if (passwordInput.length < 6) {
                alert('Пароль кеминде 6 белгиден турушу керек!');
            } else {
                alert('Сураныч, туура электрондук почта жазыңыз.');
            }
        }

        function loginAsGuest() {
            localStorage.setItem('bilimal_user_email', 'guest@bilimal.org');
            localStorage.setItem('bilimal_user_pass', 'guest12345');
            localStorage.setItem('bilimal_user_role', 'guest');
            
            document.getElementById('login-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
            alert('Конок режими ийгиликтүү иштетилди! Бардык мазмун ачык.');
        }

        function checkStoryStatus() {
            const storySeen = localStorage.getItem('bilimal_story_seen');
            if (!storySeen) {
                fetch('sections/quest-intro.html')
                    .then(response => {
                        if (!response.ok) throw new Error('Окуя файлы табылбады');
                        return response.text();
                    })
                    .then(data => {
                        const modal = document.getElementById('story-modal');
                        if (modal) {
                            modal.innerHTML = data;
                            modal.style.display = 'flex';
                            document.body.style.overflow = 'hidden';
                        }
                    })
                    .catch(err => console.error('Окуяны жүктөөдө ката:', err));
            }
        }

        function startQuestJourney() {
            localStorage.setItem('bilimal_story_seen', 'true');
            const storyModal = document.getElementById('story-modal');
            if (storyModal) storyModal.style.display = 'none';
            document.body.style.overflow = 'auto';
            alert('Саякат башталды! Сизге 1-деңгээлдеги Механика Өрөөнү ачылды! 🚀');
        }

        function changeLanguage(lang) {
            if (!translations[lang]) return;
            localStorage.setItem('bilimal_lang', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-lang-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');

            const t = translations[lang];

            const navHome = document.getElementById('nav-home');
            if (navHome) navHome.innerText = t.navHome;
            const navDashboard = document.getElementById('nav-dashboard');
            if (navDashboard) navDashboard.innerText = t.navDashboard;
            const heroTitle = document.getElementById('hero-title');
            if (heroTitle) heroTitle.innerText = t.heroTitle;
            const heroDesc = document.getElementById('hero-desc');
            if (heroDesc) heroDesc.innerText = t.heroDesc;

            if (document.getElementById('card-kinder-title')) {
                document.getElementById('card-kinder-title').innerText = t.kinderTitle;
                document.getElementById('card-kinder-desc').innerText = t.kinderDesc;
                document.getElementById('card-kinder-btn').innerText = t.kinderBtn;

                document.getElementById('card-school-title').innerText = t.schoolTitle;
                document.getElementById('card-school-desc').innerText = t.schoolDesc;
                document.getElementById('card-school-btn').innerText = t.schoolBtn;

                document.getElementById('card-books-title').innerText = t.booksTitle;
                document.getElementById('card-books-desc').innerText = t.booksDesc;
                document.getElementById('card-books-btn').innerText = t.booksBtn;

                document.getElementById('card-games-title').innerText = t.gamesTitle;
                document.getElementById('card-games-desc').innerText = t.gamesDesc;
                document.getElementById('card-games-btn').innerText = t.gamesBtn;

                document.getElementById('card-tank-title').innerText = t.tankTitle;
                document.getElementById('card-tank-desc').innerText = t.tankDesc;
                document.getElementById('card-tank-btn').innerText = t.tankBtn;

                document.getElementById('card-test-title').innerText = t.testTitle;
                document.getElementById('card-test-desc').innerText = t.testDesc;
                document.getElementById('card-test-btn').innerText = t.testBtn;

                document.getElementById('card-plans-title').innerText = t.plansTitle;
                document.getElementById('card-plans-desc').innerText = t.plansDesc;
                document.getElementById('card-plans-btn').innerText = t.plansBtn;

                document.getElementById('card-physics-title').innerText = t.physicsTitle;
                document.getElementById('card-physics-desc').innerText = t.physicsDesc;
                document.getElementById('card-physics-btn').innerText = t.physicsBtn;

                document.getElementById('card-lab-title').innerText = t.labTitle;
                document.getElementById('card-lab-desc').innerText = t.labDesc;
                document.getElementById('card-lab-btn').innerText = t.labBtn;

                document.getElementById('card-author-title').innerText = t.authorTitle;
                document.getElementById('card-author-desc').innerText = t.authorDesc;
                document.getElementById('card-author-btn').innerText = t.authorBtn;
            }

            if (document.getElementById('footer-text')) document.getElementById('footer-text').innerHTML = t.footerText;
            if (document.getElementById('footer-policy')) document.getElementById('footer-policy').innerText = t.footerPolicy;

            if (document.getElementById('txt-login-title')) {
                document.getElementById('txt-login-title').innerText = t.loginTitle;
                document.getElementById('txt-login-welcome').innerText = t.loginWelcome;
                document.getElementById('email-input').placeholder = t.emailPlaceholder;
                document.getElementById('password-input').placeholder = t.passPlaceholder;
                
                const policyContainer = document.getElementById('txt-policy-text');
                if (policyContainer) {
                    policyContainer.innerHTML = `${t.policySpan}<a href="pages/privacy-policy.html" target="_blank">${t.policyLink}</a>${t.policyEnd}`;

                document.getElementById('btn-login-submit').innerText = t.btnLogin;

            }

        /* Коргоо механизми */
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            alert("Эскертүү: Автордук укук корголгон! Көчүрүүгө тыюу салынат.");
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === "F12") { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
                e.preventDefault(); return false;
            }
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) { alert("Көчүрүүгө бөгөт коюлган!"); e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); return false; }
        });
    </script>
