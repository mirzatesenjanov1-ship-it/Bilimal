<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <title>Тесттик төлөм системасы (Mock Payment)</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .pay-card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-success { background: #10b981; color: white; }
    </style>
</head>
<body>
    <div class="pay-card">
        <h2>Банк Төлөм Баракчасы (Тест Режим)</h2>
        <p id="orderInfo">Заказ жүктөлүүдө...</p>
        <button id="payBtn" class="btn btn-success">Төлөөнү ырастоо (100% Ийгиликтүү)</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const amount = urlParams.get('amount');

        document.getElementById('orderInfo').textContent = `Заказ №: ${orderId} | Суммасы: ${amount} сом`;

        document.getElementById('payBtn').addEventListener('click', async () => {
            const res = await fetch('http://localhost:5000/api/payment/simulate-test-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId })
            });
            const data = await res.json();
            if (data.success) {
                alert('Төлөм ийгиликтүү кабыл алынды! Материал сизге ачылды.');
                window.location.href = '/index.html#marketplace';
            } else {
                alert('Төлөм иштетүүдө ката: ' + data.message);
            }
        });
    </script>
</body>
</html>
