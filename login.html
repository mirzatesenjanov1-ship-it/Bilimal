<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БилимАл — Кирүү</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 1. Firebase SDK Модулдарын кошуу (v10+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 2. Firebase Конфигурациясы
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "bilimal-org.firebaseapp.com",
            databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bilimal-org",
            storageBucket: "bilimal-org.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // Firebase'ди ишке киргизүү
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const loadingState = document.getElementById('loadingState');
        const authContainer = document.getElementById('authContainer');
        const errorAlert = document.getElementById('errorAlert');

        function showError(msg) {
            errorAlert.innerText = msg;
            errorAlert.classList.remove('hidden');
        }

        function clearError() {
            errorAlert.innerText = '';
            errorAlert.classList.add('hidden');
        }

        // 3. Авторизация абалын текшерүү
        onAuthStateChanged(auth, (user) => {
            loadingState.classList.add('hidden');
            if (user) {
                // Колдонуучу ийгиликтүү кирсе, жеке кабинетке багыттоо
                console.log("Колдонуучу кирди:", user.uid);
                window.location.href = "/sections/teacher-market.html";
            } else {
                // Колдонуучу кирген эмес, авторизация формасын ачуу (Чексиз редирект алынып салынды)
                authContainer.classList.remove('hidden');
            }
        });

        // Tab которуу
        const tabLoginBtn = document.getElementById('tabLoginBtn');
        const tabRegisterBtn = document.getElementById('tabRegisterBtn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        tabLoginBtn.addEventListener('click', () => {
            clearError();
            tabLoginBtn.className = 'flex-1 py-2 text-center font-semibold text-indigo-400 border-b-2 border-indigo-500 focus:outline-none';
            tabRegisterBtn.className = 'flex-1 py-2 text-center font-semibold text-slate-400 hover:text-slate-200 focus:outline-none';
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        });

        tabRegisterBtn.addEventListener('click', () => {
            clearError();
            tabRegisterBtn.className = 'flex-1 py-2 text-center font-semibold text-indigo-400 border-b-2 border-indigo-500 focus:outline-none';
            tabLoginBtn.className = 'flex-1 py-2 text-center font-semibold text-slate-400 hover:text-slate-200 focus:outline-none';
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        });

        // Email / Password Кирүү
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;

            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                showError('Кирүүдө ката чыкты: ' + err.message);
            }
        });

        // Email / Password Катталуу
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPassword').value;

            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                if (res.user) {
                    await set(ref(db, `users/${res.user.uid}`), {
                        email: res.user.email,
                        createdAt: Date.now(),
                        balance: 0
                    });
                }
            } catch (err) {
                showError('Катталууда ката чыкты: ' + err.message);
            }
        });

        // Google менен кирүү
        document.getElementById('googleAuthBtn').addEventListener('click', async () => {
            clearError();
            const provider = new GoogleAuthProvider();
            try {
                const res = await signInWithPopup(auth, provider);
                if (res.user) {
                    const userRef = ref(db, `users/${res.user.uid}`);
                    const snap = await get(userRef);
                    if (!snap.exists()) {
                        await set(userRef, {
                            email: res.user.email,
                            createdAt: Date.now(),
                            balance: 0
                        });
                    }
                }
            } catch (err) {
                showError('Google авторизациясы оңунан чыккан жок: ' + err.message);
            }
        });
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Loading State -->
    <div id="loadingState" class="text-center py-10">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent mb-4"></div>
        <p class="text-slate-300 font-medium">Колдонуучунун авторизациясы текшерилүүдө...</p>
    </div>

    <!-- Auth Form Container -->
    <div id="authContainer" class="hidden w-full max-w-md bg-slate-800/90 border border-slate-700/80 rounded-2xl shadow-xl p-6 sm:p-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-indigo-400 mb-1">BilimAl</h1>
            <p class="text-sm text-slate-400">Билим берүү платформасына кош келиңиз</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-700 mb-6">
            <button id="tabLoginBtn" class="flex-1 py-2 text-center font-semibold text-indigo-400 border-b-2 border-indigo-500 focus:outline-none">Кирүү</button>
            <button id="tabRegisterBtn" class="flex-1 py-2 text-center font-semibold text-slate-400 hover:text-slate-200 focus:outline-none">Катталуу</button>
        </div>

        <!-- Error Alert -->
        <div id="errorAlert" class="hidden mb-4 p-3 rounded-xl bg-red-500/20 border border-red-500/50 text-red-300 text-sm"></div>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">E-mail дарек</label>
                <input type="email" id="loginEmail" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="example@mail.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Сыр сөз</label>
                <input type="password" id="loginPassword" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-xl transition text-white shadow-lg shadow-indigo-600/30">Системага кирүү</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="hidden space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">E-mail дарек</label>
                <input type="email" id="regEmail" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="example@mail.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Жаңы сыр сөз</label>
                <input type="password" id="regPassword" required minlength="6" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500" placeholder="Кем дегенде 6 белги">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-xl transition text-white shadow-lg shadow-indigo-600/30">Катталуу</button>
        </form>

        <div class="relative my-6 text-center">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-700"></div></div>
            <span class="relative bg-slate-800 px-3 text-xs text-slate-400">же</span>
        </div>

        <!-- GOOGLE LOGIN -->
        <button id="googleAuthBtn" type="button" class="w-full bg-slate-900 hover:bg-slate-700/80 border border-slate-700 text-slate-200 font-medium py-3 rounded-xl transition flex items-center justify-center gap-3">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
                <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/>
                <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
            </svg>
            Google менен кирүү
        </button>
    </div>

</body>
</html>
