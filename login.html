<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кирүү / Катталуу - BilimAl</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Жүктөлүүдө абалы (Лоадер) -->
  <div id="loadingState" class="text-slate-400 text-sm flex flex-col items-center gap-3">
    <div class="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
    <span>Авторизация текшерилүүдө...</span>
  </div>

  <!-- Негизги Контент -->
  <div id="mainContent" class="hidden w-full max-w-md bg-slate-800/90 rounded-2xl p-6 border border-slate-700/60 shadow-2xl">
    
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-indigo-400">BilimAl</h1>
      <p class="text-sm text-slate-400 mt-1">Билим берүү платформасына кош келиңиз</p>
    </div>

    <div class="flex border-b border-slate-700 mb-6">
      <button type="button" id="tabLogin" class="w-1/2 py-2 text-center font-semibold border-b-2 border-indigo-500 text-indigo-400 cursor-pointer">
        Кирүү
      </button>
      <button type="button" id="tabRegister" class="w-1/2 py-2 text-center font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 cursor-pointer">
        Катталуу
      </button>
    </div>

    <div id="errorBox" class="hidden bg-red-900/40 border border-red-500/50 text-red-300 text-sm p-3 rounded-xl mb-4 break-words"></div>

    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">E-mail дарек</label>
        <input 
          type="email" 
          id="emailInput" 
          placeholder="Электрондук почтаңызды киргизиңиз" 
          required 
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500 text-sm"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Сыр сөз</label>
        <input 
          type="password" 
          id="passwordInput" 
          placeholder="Сыр сөзүңүздү киргизиңиз" 
          required 
          minlength="6"
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500 text-sm"
        />
      </div>

      <button 
        type="submit" 
        id="submitBtn" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-xl transition text-white shadow-lg shadow-indigo-600/30"
      >
        Кирүү
      </button>
    </form>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword,
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Сиздин Консолдон алынган ЧЫНЫГЫ Firebase Конфигурациясы
    const firebaseConfig = {
      apiKey: "AIzaSyAsRjj_5VoQwZA7hSBWhkQ58UvUnct-b28",
      authDomain: "bilimal-org.firebaseapp.com",
      databaseURL: "https://bilimal-org-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "bilimal-org",
      storageBucket: "bilimal-org.firebasestorage.app",
      messagingSenderId: "241750360816",
      appId: "1:241750360816:web:a991434eb5afbc470d7835",
      measurementId: "G-9GSQV60QV0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.addEventListener("DOMContentLoaded", () => {
      let activeTab = 'login';
      let isResolved = false;

      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const submitBtn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      const authForm = document.getElementById('authForm');
      const loadingState = document.getElementById('loadingState');
      const mainContent = document.getElementById('mainContent');

      function showForm() {
        if (!isResolved) {
          isResolved = true;
          if (loadingState) loadingState.classList.add('hidden');
          if (mainContent) mainContent.classList.remove('hidden');
        }
      }

      tabLogin.addEventListener('click', () => {
        activeTab = 'login';
        tabLogin.className = 'w-1/2 py-2 text-center font-semibold border-b-2 border-indigo-500 text-indigo-400 cursor-pointer';
        tabRegister.className = 'w-1/2 py-2 text-center font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 cursor-pointer';
        submitBtn.innerText = 'Кирүү';
        errorBox.classList.add('hidden');
      });

      tabRegister.addEventListener('click', () => {
        activeTab = 'register';
        tabRegister.className = 'w-1/2 py-2 text-center font-semibold border-b-2 border-indigo-500 text-indigo-400 cursor-pointer';
        tabLogin.className = 'w-1/2 py-2 text-center font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 cursor-pointer';
        submitBtn.innerText = 'Катталуу';
        errorBox.classList.add('hidden');
      });

      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.href = '/sections/teacher-market.html';
        } else {
          showForm();
        }
      });

      setTimeout(() => {
        showForm();
      }, 2000);

      authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.add('hidden');
        submitBtn.disabled = true;

        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;

        try {
          if (activeTab === 'login') {
            await signInWithEmailAndPassword(auth, email, password);
          } else {
            await createUserWithEmailAndPassword(auth, email, password);
          }
          window.location.href = '/sections/teacher-market.html';
        } catch (err) {
          submitBtn.disabled = false;
          errorBox.innerText = `Ката чыкты: ${err.message}`;
          errorBox.classList.remove('hidden');
        }
      });
    });
  </script>
</body>
</html>
